name: Bug report
description: Something on the site does not work or looks broken.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address where it happens.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For example iPhone 13, Safari; or Windows laptop, Chrome.
