one_minute:
  what_happens: In Capernaum, four men carry a paralysed friend to Jesus. They open up the roof and lower him down. Jesus forgives his sins, and when the scribes object, he heals him too. The man picks up his mat and walks out.
  why_this_sunday: The third Sunday of Great Lent reads the healing of a paralysed man. The morning Gospel tells of another, at the pool of Bethesda.
  take_with_you: Jesus saw their faith, the faith of the four friends. Sometimes we are carried to Christ by others.
readings_thread: 'Moses says he cannot speak well, and God answers: who made the mouth? Elisha watches Elijah taken up. In Acts even handkerchiefs carry healing, and Paul learns that God’s grace is enough when his own weakness is not taken away.'
key_verse:
  ref: Mark 2:5
  ml: 'യേശു അവരുടെ വിശ്വാസം കണ്ടിട്ടു പക്ഷവാതക്കാരനോടു: മകനേ, നിന്റെ പാപങ്ങൾ മോചിച്ചു തന്നിരിക്കുന്നു എന്നു പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: Jesus, seeing their faith, said to the paralytic, “Son, your sins are forgiven you.”
  en_translation: World English Bible
scenes:
- verses: Mark 2:1–2
  title: No room, not even at the door
  text: Jesus is back home in Capernaum. So many people gather that there is no room left, not even outside the door, and he is speaking the word to them.
  easy_to_miss: Mark says Jesus was “at home”. This may have been Peter’s house (Mark 1:29).
- verses: Mark 2:3–4
  title: Through the roof
  text: Four men bring a paralysed man. They cannot get near, so they open up the roof above Jesus, dig through it and lower the mat he is lying on.
  easy_to_miss: Roofs were flat, made of beams covered with branches and packed clay. Somebody’s roof was ruined that day.
- verses: Mark 2:5
  title: Your sins are forgiven
  text: 'Seeing their faith, Jesus says to the paralysed man: son, your sins are forgiven.'
  easy_to_miss: The man has not said a word. Jesus responds to the faith of his friends.
- verses: Mark 2:6–9
  title: Who can forgive sins?
  text: 'Some scribes think to themselves: this is blasphemy; only God can forgive sins. Jesus knows their thoughts and asks which is easier to say: your sins are forgiven, or get up and walk?'
  easy_to_miss: The scribes are right that only God forgives sins. That is exactly Mark’s point about who Jesus is.
- verses: Mark 2:10–12
  title: Take up your mat
  text: 'So that you may know the Son of Man has authority to forgive, he says to the man: get up, take your mat and go home. He does, in front of everyone, and they all glorify God.'
  easy_to_miss: He came in through the roof and leaves through the door, carrying the mat that carried him.
