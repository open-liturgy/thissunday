  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Who has carried you through a hard time? Who might need us to carry them now?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Pray every day this week for one person who is struggling, and tell them you are doing it.
  prayer: Lord Jesus, you saw the faith of four friends and raised the man they carried. Bless those who have carried us, and give us strength to carry others to you. Amen.
