one_minute:
  what_happens: In Capernaum, four men carry a paralysed friend to Jesus. They open up the roof and lower him down. Jesus forgives his sins, and when the scribes object, he heals him too. The man picks up his mat and walks out.
  why_this_sunday: The third Sunday of Great Lent reads the healing of a paralysed man. The morning Gospel tells of another, at the pool of Bethesda.
  take_with_you: Jesus saw their faith, the faith of the four friends. Sometimes we are carried to Christ by others.
readings_thread: 'Moses says he cannot speak well, and God answers: who made the mouth? Elisha watches Elijah taken up. In Acts even handkerchiefs carry healing, and Paul learns that God’s grace is enough when his own weakness is not taken away.'
key_verse:
  ref: Mark 2:5
  ml: 'യേശു അവരുടെ വിശ്വാസം കണ്ടിട്ടു പക്ഷവാതക്കാരനോടു: മകനേ, നിന്റെ പാപങ്ങൾ മോചിച്ചു തന്നിരിക്കുന്നു എന്നു പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: Jesus, seeing their faith, said to the paralytic, “Son, your sins are forgiven you.”
  en_translation: World English Bible
scenes:
- verses: Mark 2:1–2
  title: No room, not even at the door
  text: Jesus is back home in Capernaum. So many people gather that there is no room left, not even outside the door, and he is speaking the word to them.
  easy_to_miss: Mark says Jesus was “at home”. This may have been Peter’s house (Mark 1:29).
- verses: Mark 2:3–4
  title: Through the roof
  text: Four men bring a paralysed man. They cannot get near, so they open up the roof above Jesus, dig through it and lower the mat he is lying on.
  easy_to_miss: Roofs were flat, made of beams covered with branches and packed clay. Somebody’s roof was ruined that day.
- verses: Mark 2:5
  title: Your sins are forgiven
  text: 'Seeing their faith, Jesus says to the paralysed man: son, your sins are forgiven.'
  easy_to_miss: The man has not said a word. Jesus responds to the faith of his friends.
- verses: Mark 2:6–9
  title: Who can forgive sins?
  text: 'Some scribes think to themselves: this is blasphemy; only God can forgive sins. Jesus knows their thoughts and asks which is easier to say: your sins are forgiven, or get up and walk?'
  easy_to_miss: The scribes are right that only God forgives sins. That is exactly Mark’s point about who Jesus is.
- verses: Mark 2:10–12
  title: Take up your mat
  text: 'So that you may know the Son of Man has authority to forgive, he says to the man: get up, take your mat and go home. He does, in front of everyone, and they all glorify God.'
  easy_to_miss: He came in through the roof and leaves through the door, carrying the mat that carried him.
people:
- name: The paralysed man
  ml: പക്ഷവാതക്കാരൻ
  role: Unable to walk, carried on a mat by four friends.
  name_meaning: —
- name: The four friends
  ml: ചുമന്നുകൊണ്ടുവന്ന നാലുപേർ
  role: Unnamed men whose faith Jesus sees.
  name_meaning: —
- name: The scribes
  ml: ശാസ്ത്രിമാർ
  role: Experts in the law who question Jesus silently.
  name_meaning: —
phrases:
- term: Palsy
  explanation: An old English word for paralysis.
- term: Son of Man
  explanation: Jesus’ name for himself, drawn from Daniel 7:13–14, where the Son of Man receives authority from God.
- term: Mat
  explanation: A simple sleeping pallet, light enough to carry.
reflection:
  title_en: Carried by others
  title_ml: മറ്റുള്ളവർ ചുമന്നുകൊണ്ടുവന്നവൻ
  read_time: A three-minute read
  body: |-
    We never learn the paralysed man’s name, or what he believed. We only know that four people cared enough to carry him across town, find the door blocked, climb a roof and tear it open. Mark says Jesus saw their faith. The man was forgiven and healed because his friends would not give up.

    There are times in life when we cannot walk to Christ ourselves. Illness, grief, doubt or sin can leave us lying still. In those times the faith of others carries us: a parent’s prayer, a friend who drives us to church, a parish that keeps our name in its intercessions.

    And there are times when we are the ones holding a corner of the mat. Lent is a good time to ask who we are carrying, and who we have stopped carrying because it got hard. The four friends dug through a roof. Surely we can make a phone call.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Who has carried you through a hard time? Who might need us to carry them now?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Pray every day this week for one person who is struggling, and tell them you are doing it.
  prayer: Lord Jesus, you saw the faith of four friends and raised the man they carried. Bless those who have carried us, and give us strength to carry others to you. Amen.
translations:
  ml:
    name:
      en: തളർവാതക്കാരന്റെ ഞായർ
      ml: Palsy Sunday
    season:
      en: വലിയ നോമ്പ്
      gloss: ഉയിർപ്പിനു മുമ്പുള്ള അമ്പതു നോമ്പുദിവസങ്ങൾ
    tagline: നാലു സ്നേഹിതന്മാരും മേല്പുരയിലെ ഒരു ദ്വാരവും
    standfirst: വീട്ടിൽ ആർക്കും കടക്കാൻ കഴിയാത്തത്ര തിരക്ക്. നാലുപേർ മേല്പുരയിൽ കയറി അതു പൊളിച്ച്, തളർവാതം പിടിച്ച തങ്ങളുടെ സ്നേഹിതനെ യേശുവിന്റെ മുമ്പിൽ ഇറക്കുന്നു.
    description: 'വലിയ നോമ്പിലെ മൂന്നാം ഞായറായ തളർവാതക്കാരന്റെ ഞായറിലെ വായനകൾ, മർക്കൊസ് 2:1–12: പക്ഷവാതക്കാരനും നാലു സ്നേഹിതന്മാരും. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: കഫർന്നഹൂമിൽ നാലുപേർ തളർവാതം പിടിച്ച ഒരു സ്നേഹിതനെ യേശുവിന്റെ അടുക്കൽ ചുമന്നുകൊണ്ടുവരുന്നു. അവർ മേല്പുര പൊളിച്ച് അവനെ ഇറക്കുന്നു. യേശു അവന്റെ പാപങ്ങൾ മോചിക്കുന്നു; ശാസ്ത്രിമാർ എതിർക്കുമ്പോൾ അവനെ സൌഖ്യവുമാക്കുന്നു. ആ മനുഷ്യൻ കിടക്ക എടുത്തു പുറത്തേക്കു നടക്കുന്നു.
      why_this_sunday: വലിയ നോമ്പിലെ മൂന്നാം ഞായറാഴ്ച ഒരു പക്ഷവാതക്കാരന്റെ സൌഖ്യം വായിക്കുന്നു. പ്രഭാതസുവിശേഷം ബേഥെസ്ദാ കുളക്കരയിലെ മറ്റൊരുവനെക്കുറിച്ചു പറയുന്നു.
      take_with_you: യേശു അവരുടെ വിശ്വാസം കണ്ടു; നാലു സ്നേഹിതന്മാരുടെ വിശ്വാസം. ചിലപ്പോൾ മറ്റുള്ളവരാണ് നമ്മെ ക്രിസ്തുവിന്റെ അടുക്കൽ ചുമന്നുകൊണ്ടുപോകുന്നത്.
    readings_thread: തനിക്കു നന്നായി സംസാരിക്കാൻ കഴിയില്ല എന്നു മോശെ പറയുന്നു; മനുഷ്യനു വായ് കൊടുത്തതു ആർ എന്നു ദൈവം ചോദിക്കുന്നു. ഏലീയാവ് എടുക്കപ്പെടുന്നത് എലീശാ നോക്കിനില്ക്കുന്നു. അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഉറുമാലുകൾപോലും സൌഖ്യം കൊണ്ടുപോകുന്നു; തന്റെ ബലഹീനത നീങ്ങാതിരിക്കുമ്പോഴും ദൈവത്തിന്റെ കൃപ മതി എന്നു പൗലോസ് പഠിക്കുന്നു.
    scenes:
    - verses: മർക്കൊസ് 2:1–2
      title: വാതില്ക്കൽപോലും ഇടമില്ല
      text: യേശു കഫർന്നഹൂമിൽ വീട്ടിൽ തിരിച്ചെത്തിയിരിക്കുന്നു. വാതില്ക്കൽപോലും ഇടമില്ലാത്തവണ്ണം അനേകർ കൂടിവരുന്നു; അവൻ അവരോടു വചനം പ്രസ്താവിക്കുന്നു.
      easy_to_miss: യേശു “വീട്ടിൽ” ആയിരുന്നു എന്നു മർക്കൊസ് പറയുന്നു. അതു പത്രൊസിന്റെ വീടായിരുന്നിരിക്കാം (മർക്കൊസ് 1:29).
    - verses: മർക്കൊസ് 2:3–4
      title: മേല്പുരയിലൂടെ
      text: നാലുപേർ ഒരു പക്ഷവാതക്കാരനെ ചുമന്നുകൊണ്ടുവരുന്നു. അടുത്തു ചെല്ലാൻ കഴിയാഞ്ഞതുകൊണ്ട് അവർ യേശുവിനു മുകളിലുള്ള മേല്പുര പൊളിച്ചു തുറന്ന്, അവൻ കിടക്കുന്ന കിടക്ക ഇറക്കുന്നു.
      easy_to_miss: മേല്പുരകൾ പരന്നവയായിരുന്നു; കഴുക്കോലുകളും അവയ്ക്കു മുകളിൽ ചില്ലകളും ഉറപ്പിച്ച മണ്ണുംകൊണ്ടു തീർത്തവ. അന്ന് ആരുടെയോ മേല്പുര നശിച്ചു.
    - verses: മർക്കൊസ് 2:5
      title: നിന്റെ പാപങ്ങൾ മോചിച്ചു തന്നിരിക്കുന്നു
      text: 'അവരുടെ വിശ്വാസം കണ്ടിട്ട് യേശു പക്ഷവാതക്കാരനോടു പറയുന്നു: മകനേ, നിന്റെ പാപങ്ങൾ മോചിച്ചു തന്നിരിക്കുന്നു.'
      easy_to_miss: ആ മനുഷ്യൻ ഒരു വാക്കും പറഞ്ഞിട്ടില്ല. യേശു പ്രതികരിക്കുന്നത് അവന്റെ സ്നേഹിതന്മാരുടെ വിശ്വാസത്തോടാണ്.
    - verses: മർക്കൊസ് 2:6–9
      title: പാപങ്ങളെ മോചിപ്പാൻ ആർക്കു കഴിയും?
      text: 'ചില ശാസ്ത്രിമാർ ഉള്ളിൽ ചിന്തിക്കുന്നു: ഇതു ദൈവദൂഷണം; ദൈവം ഒരുവൻ അല്ലാതെ പാപങ്ങളെ മോചിപ്പാൻ ആർക്കു കഴിയും? യേശു അവരുടെ ചിന്ത അറിഞ്ഞ് ചോദിക്കുന്നു: നിന്റെ പാപങ്ങൾ മോചിച്ചിരിക്കുന്നു എന്നു പറയുന്നതോ, എഴുന്നേറ്റു നടക്ക എന്നു പറയുന്നതോ ഏതാകുന്നു എളുപ്പം?'
      easy_to_miss: പാപങ്ങൾ മോചിക്കുന്നതു ദൈവം മാത്രമാണ് എന്നതിൽ ശാസ്ത്രിമാർ ശരിയാണ്. യേശു ആരെന്നതിനെക്കുറിച്ച് മർക്കൊസ് പറയാൻ ആഗ്രഹിക്കുന്നതും അതുതന്നെയാണ്.
    - verses: മർക്കൊസ് 2:10–12
      title: കിടക്ക എടുത്തു പോക
      text: 'ഭൂമിയിൽ പാപങ്ങളെ മോചിപ്പാൻ മനുഷ്യപുത്രന്നു അധികാരം ഉണ്ടെന്നു നിങ്ങൾ അറിയേണ്ടതിന്ന് അവൻ ആ മനുഷ്യനോടു പറയുന്നു: എഴുന്നേറ്റു കിടക്ക എടുത്തു വീട്ടിലേക്കു പോക. എല്ലാവരും കാൺകെ അവൻ അങ്ങനെ ചെയ്യുന്നു; എല്ലാവരും ദൈവത്തെ മഹത്വപ്പെടുത്തുന്നു.'
      easy_to_miss: മേല്പുരയിലൂടെ അകത്തു വന്നവൻ വാതിലിലൂടെ പുറത്തുപോകുന്നു; തന്നെ ചുമന്ന കിടക്ക ചുമന്നുകൊണ്ട്.
    people:
    - name: പക്ഷവാതക്കാരൻ
      role: നടക്കാൻ കഴിയാത്തവൻ; നാലു സ്നേഹിതന്മാർ കിടക്കയിൽ ചുമന്നുകൊണ്ടുവന്നവൻ.
      name_meaning: —
      ml: The paralysed man
    - name: ചുമന്നുകൊണ്ടുവന്ന നാലുപേർ
      role: യേശു അവരുടെ വിശ്വാസം കാണുന്ന, പേരില്ലാത്ത മനുഷ്യർ.
      name_meaning: —
      ml: The four friends
    - name: ശാസ്ത്രിമാർ
      role: നിശ്ശബ്ദമായി യേശുവിനെ ചോദ്യം ചെയ്യുന്ന ന്യായപ്രമാണപണ്ഡിതന്മാർ.
      name_meaning: —
      ml: The scribes
    phrases:
    - term: പക്ഷവാതം
      explanation: ശരീരം തളർന്നുപോകുന്ന രോഗം; തളർവാതം. 1910-ലെ സത്യവേദപുസ്തകം ഈ വാക്ക് ഉപയോഗിക്കുന്നു.
    - term: മനുഷ്യപുത്രൻ
      explanation: തനിക്കു യേശു നല്കുന്ന പേര്. മനുഷ്യപുത്രൻ ദൈവത്തിൽനിന്ന് അധികാരം പ്രാപിക്കുന്ന ദാനീയേൽ 7:13–14-ൽനിന്ന്.
    - term: കിടക്ക
      explanation: ചുമന്നുകൊണ്ടുപോകാവുന്നത്ര ലഘുവായ ഒരു ലളിതമായ പായ.
    reflection:
      title_en: മറ്റുള്ളവർ ചുമന്നുകൊണ്ടുവന്നവൻ
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        പക്ഷവാതക്കാരന്റെ പേരോ അവൻ എന്തു വിശ്വസിച്ചു എന്നോ നാം ഒരിക്കലും അറിയുന്നില്ല. അവനെ പട്ടണത്തിലൂടെ ചുമന്ന്, വാതിൽ അടഞ്ഞുകിടക്കുന്നതു കണ്ട്, മേല്പുരയിൽ കയറി അതു പൊളിക്കാൻ മാത്രം കരുതൽ നാലുപേർക്ക് ഉണ്ടായിരുന്നു എന്നു മാത്രമേ നമുക്കറിയൂ. യേശു അവരുടെ വിശ്വാസം കണ്ടു എന്നു മർക്കൊസ് പറയുന്നു. സ്നേഹിതന്മാർ പിന്മാറാതിരുന്നതുകൊണ്ട് ആ മനുഷ്യൻ ക്ഷമിക്കപ്പെടുകയും സൌഖ്യം പ്രാപിക്കുകയും ചെയ്തു.

        നമുക്കു സ്വയം ക്രിസ്തുവിന്റെ അടുക്കലേക്കു നടക്കാൻ കഴിയാത്ത സമയങ്ങൾ ജീവിതത്തിലുണ്ട്. രോഗമോ ദുഃഖമോ സംശയമോ പാപമോ നമ്മെ അനങ്ങാതെ കിടത്തിയേക്കാം. ആ സമയങ്ങളിൽ മറ്റുള്ളവരുടെ വിശ്വാസം നമ്മെ ചുമക്കുന്നു: ഒരു അമ്മയുടെയോ അപ്പന്റെയോ പ്രാർത്ഥന, നമ്മെ പള്ളിയിലേക്കു കൊണ്ടുപോകുന്ന ഒരു സ്നേഹിതൻ, മദ്ധ്യസ്ഥപ്രാർത്ഥനകളിൽ നമ്മുടെ പേര് സൂക്ഷിക്കുന്ന ഒരു ഇടവക.

        കിടക്കയുടെ ഒരു മൂല പിടിക്കുന്നവർ നാമായിരിക്കുന്ന സമയങ്ങളുമുണ്ട്. നാം ആരെയാണ് ചുമക്കുന്നത്, ബുദ്ധിമുട്ടായപ്പോൾ ആരെയാണ് ചുമക്കുന്നതു നിർത്തിയത് എന്നു ചോദിക്കാൻ നോമ്പ് നല്ല സമയമാണ്. ആ നാലു സ്നേഹിതന്മാർ ഒരു മേല്പുര പൊളിച്ചു. നമുക്ക് ഒരു ഫോൺവിളിയെങ്കിലും ചെയ്യാമല്ലോ.
      title_ml: Carried by others
    week:
      question: ഒരു പ്രയാസകാലത്ത് നിങ്ങളെ ചുമന്നത് ആരാണ്? ഇപ്പോൾ നാം ചുമക്കേണ്ടിയിരിക്കുന്നത് ആരെയായിരിക്കാം?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച എല്ലാ ദിവസവും വിഷമിക്കുന്ന ഒരാൾക്കുവേണ്ടി പ്രാർത്ഥിക്കുക; അങ്ങനെ ചെയ്യുന്നുണ്ടെന്ന് അവരോടു പറയുക.
      prayer: കർത്താവായ യേശുവേ, നാലു സ്നേഹിതന്മാരുടെ വിശ്വാസം നീ കണ്ടു; അവർ ചുമന്നുകൊണ്ടുവന്നവനെ എഴുന്നേല്പിച്ചു. ഞങ്ങളെ ചുമന്നവരെ അനുഗ്രഹിക്കേണമേ; മറ്റുള്ളവരെ നിന്റെ അടുക്കലേക്കു ചുമന്നുകൊണ്ടുവരാൻ ഞങ്ങൾക്കു ബലം തരേണമേ. ആമേൻ.
