tagline: Four friends and a hole in the roof
standfirst: The house is so crowded that nobody else can get in. Four men climb onto the roof, dig through it and lower their paralysed friend down in front of Jesus.
description: Readings for Palsy Sunday, the third Sunday of Great Lent, with Mark 2:1–12, the paralysed man and his four friends, explained. Reflection and question.
