phrases:
- term: Palsy
  explanation: An old English word for paralysis.
- term: Son of Man
  explanation: Jesus’ name for himself, drawn from Daniel 7:13–14, where the Son of Man receives authority from God.
- term: Mat
  explanation: A simple sleeping pallet, light enough to carry.
reflection:
  title_en: Carried by others
  title_ml: മറ്റുള്ളവർ ചുമന്നുകൊണ്ടുവന്നവൻ
  read_time: A three-minute read
  body: |-
    We never learn the paralysed man’s name, or what he believed. We only know that four people cared enough to carry him across town, find the door blocked, climb a roof and tear it open. Mark says Jesus saw their faith. The man was forgiven and healed because his friends would not give up.

    There are times in life when we cannot walk to Christ ourselves. Illness, grief, doubt or sin can leave us lying still. In those times the faith of others carries us: a parent’s prayer, a friend who drives us to church, a parish that keeps our name in its intercessions.

    And there are times when we are the ones holding a corner of the mat. Lent is a good time to ask who we are carrying, and who we have stopped carrying because it got hard. The four friends dug through a roof. Surely we can make a phone call.
