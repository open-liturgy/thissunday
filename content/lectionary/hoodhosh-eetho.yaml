one_minute:
  what_happens: 'At the Feast of Dedication, people surround Jesus and demand a plain answer: is he the Christ? He points to his works, says his sheep hear his voice, and says he and the Father are one. They pick up stones.'
  why_this_sunday: Hoodosh Eetho means the dedication of the Church. Last week the Church was sanctified; this week it is dedicated to God, as Solomon dedicated the Temple.
  take_with_you: A building is dedicated once. People who belong to the Shepherd are dedicated every time they listen for his voice.
readings_thread: Solomon prays at the dedication of the first Temple, Isaiah invites everyone who is thirsty to come, and Hebrews describes the tabernacle Christ fulfils. Stephen reminds his hearers that God does not live in houses made by hands.
key_verse:
  ref: John 10:27
  ml: '[ML VERSE: Sathyavedapusthakam 1910, John 10:27]'
  ml_translation: Sathyavedapusthakam, 1910
  en: My sheep hear my voice, and I know them, and they follow me.
  en_translation: World English Bible
scenes:
- verses: John 10:22–24
  title: Winter in Solomon’s porch
  text: 'It is the Feast of Dedication, and Jesus is walking in the covered colonnade of the Temple. People gather round him and say: stop keeping us in suspense.'
  easy_to_miss: This feast remembers the cleansing of the Temple after it was defiled, about 160 years earlier. Today it is called Hanukkah.
- verses: John 10:25–26
  title: I told you
  text: Jesus says he has already answered them. The works he does in his Father’s name speak for him, but they do not believe.
  easy_to_miss: John’s Gospel calls Jesus’ miracles “signs”. They are meant to point beyond themselves.
- verses: John 10:27–30
  title: My sheep hear my voice
  text: His sheep know his voice and follow him. He gives them eternal life, and no one can snatch them out of his hand or his Father’s. “I and the Father are one.”
  easy_to_miss: The hand of Jesus and the hand of the Father hold the same sheep. The safety is doubled.
- verses: John 10:31–33
  title: Stones in their hands
  text: The crowd picks up stones. Jesus asks which of his good works they are stoning him for. They say it is for blasphemy, because he, a man, makes himself God.
  easy_to_miss: At a feast celebrating God’s presence in the Temple, they try to stone the one in whom God is present.
- verses: John 10:34–38
  title: Believe the works
  text: Jesus quotes Psalm 82, where God calls people “gods”. If you cannot believe me, he says, believe the works, so that you may know the Father is in me and I am in the Father.
  easy_to_miss: 'Jesus calls himself the one “the Father sanctified and sent into the world” (verse 36). Sanctified and dedicated: the same idea as this Sunday’s name.'
