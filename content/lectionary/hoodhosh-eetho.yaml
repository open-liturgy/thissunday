    main: true
one_minute:
  what_happens: 'At the Feast of Dedication, people surround Jesus and demand a plain answer: is he the Christ? He points to his works, says his sheep hear his voice, and says he and the Father are one. They pick up stones.'
  why_this_sunday: Hoodosh Eetho means the dedication of the Church. Last week the Church was sanctified; this week it is dedicated to God, as Solomon dedicated the Temple.
  take_with_you: A building is dedicated once. People who belong to the Shepherd are dedicated every time they listen for his voice.
readings_thread: Solomon prays at the dedication of the first Temple, Isaiah invites everyone who is thirsty to come, and Hebrews describes the tabernacle Christ fulfils. Stephen reminds his hearers that God does not live in houses made by hands.
key_verse:
  ref: John 10:27
  ml: എന്റെ ആടുകൾ എന്റെ ശബ്ദം കേൾക്കുന്നു; ഞാൻ അവയെ അറികയും അവ എന്നെ അനുഗമിക്കയും ചെയ്യുന്നു.
  ml_translation: Sathyavedapusthakam, 1910
  en: My sheep hear my voice, and I know them, and they follow me.
  en_translation: World English Bible
scenes:
- verses: John 10:22–24
  title: Winter in Solomon’s porch
  text: 'It is the Feast of Dedication, and Jesus is walking in the covered colonnade of the Temple. People gather round him and say: stop keeping us in suspense.'
  easy_to_miss: This feast remembers the cleansing of the Temple after it was defiled, about 160 years earlier. Today it is called Hanukkah.
- verses: John 10:25–26
  title: I told you
  text: Jesus says he has already answered them. The works he does in his Father’s name speak for him, but they do not believe.
  easy_to_miss: John’s Gospel calls Jesus’ miracles “signs”. They are meant to point beyond themselves.
- verses: John 10:27–30
  title: My sheep hear my voice
  text: His sheep know his voice and follow him. He gives them eternal life, and no one can snatch them out of his hand or his Father’s. “I and the Father are one.”
  easy_to_miss: The hand of Jesus and the hand of the Father hold the same sheep. The safety is doubled.
- verses: John 10:31–33
  title: Stones in their hands
  text: The crowd picks up stones. Jesus asks which of his good works they are stoning him for. They say it is for blasphemy, because he, a man, makes himself God.
  easy_to_miss: At a feast celebrating God’s presence in the Temple, they try to stone the one in whom God is present.
- verses: John 10:34–38
  title: Believe the works
  text: Jesus quotes Psalm 82, where God calls people “gods”. If you cannot believe me, he says, believe the works, so that you may know the Father is in me and I am in the Father.
  easy_to_miss: 'Jesus calls himself the one “the Father sanctified and sent into the world” (verse 36). Sanctified and dedicated: the same idea as this Sunday’s name.'
people:
- name: Jesus
  ml: യേശു
  role: Walking in the Temple at the winter feast, questioned by the crowd.
  name_meaning: “The Lord saves”
- name: Solomon
  ml: ശലോമോൻ
  role: The king who built and dedicated the first Temple. The porch where Jesus walks bears his name.
  name_meaning: “Peaceful”
phrases:
- term: Feast of Dedication
  explanation: A winter feast remembering the rededication of the Temple by the Maccabees after it had been defiled (1 Maccabees 4:52–59).
- term: Solomon’s porch
  explanation: A long covered colonnade on the east side of the Temple courts. The early Church met there too (Acts 5:12).
- term: Hoodosh Eetho
  explanation: Syriac for the dedication of the Church. It is kept on the Sunday after Koodosh Eetho.
reflection:
  title_en: A people who know the voice
  title_ml: ശബ്ദം തിരിച്ചറിയുന്ന ഒരു ജനം
  read_time: A three-minute read
  body: |-
    The people in Solomon’s porch want a plain answer. They have heard Jesus teach and seen what he does, and they still want him to say it in one sentence. He tells them the problem is not the answer. Sheep recognise their shepherd because they have listened to him for a long time.

    This Sunday the Church remembers its dedication. Solomon dedicated a Temple of stone, and the Maccabees rededicated it after it had been defiled. Both mattered. But in this Gospel the dedication that counts is a person: the one the Father sanctified and sent into the world, and the people who belong to him.

    Recognising a voice takes time spent near it. A child knows a parent’s voice in a crowded room because they have heard it every day. If we want to know the Shepherd’s voice, the readings, the prayers and the Qurbana are where we hear it, week after week, until we can pick it out anywhere.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Where do you most easily hear God’s voice, and where is it hardest to hear?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Find ten quiet minutes this week to read the Gospel for next Sunday, Luke 1:5–25, before you hear it in church.
  prayer: Good Shepherd, we are the sheep of your hand. Dedicate our home and our Church to you again, teach us to know your voice, and let no one snatch us out of your hand. Amen.
translations:
  ml:
    name:
      en: ഹൂദോശ് ഈത്തോ ഞായർ
      ml: Hoodosh Eetho
    season:
      en: കൂദോശ് ഈത്തോ
      gloss: സഭാവർഷം ആരംഭിക്കുന്നു
    also_kept_as: സഭയുടെ പ്രതിഷ്ഠ
    tagline: സഭയുടെ നവീകരണം
    standfirst: യെരൂശലേമിൽ ശീതകാലം. ദൈവാലയം വീണ്ടും പ്രതിഷ്ഠിച്ച ദിവസം നഗരം ആഘോഷിക്കുന്നു. ദൈവാലയത്തിന്റെ മണ്ഡപത്തിൽ നടന്നുകൊണ്ട്, തന്റെ ആടുകൾ തന്റെ ശബ്ദം അറിയുന്നു എന്ന് യേശു പുരുഷാരത്തോടു പറയുന്നു.
    description: സഭയുടെ പ്രതിഷ്ഠയായ ഹൂദോശ് ഈത്തോയുടെ വായനകൾ, യോഹന്നാൻ 10:22–38 അഞ്ചു രംഗങ്ങളിൽ, ഒരു ധ്യാനം, കുടുംബത്തിനായി ഒരു ചോദ്യം.
    one_minute:
      what_happens: 'പ്രതിഷ്ഠോത്സവത്തിനിടെ ജനങ്ങൾ യേശുവിനെ വളഞ്ഞ് വ്യക്തമായ ഒരു ഉത്തരം ആവശ്യപ്പെടുന്നു: അവൻ ക്രിസ്തുവോ? അവൻ തന്റെ പ്രവൃത്തികളിലേക്കു ചൂണ്ടിക്കാണിക്കുന്നു; തന്റെ ആടുകൾ തന്റെ ശബ്ദം കേൾക്കുന്നു എന്നും താനും പിതാവും ഒന്നാകുന്നു എന്നും പറയുന്നു. അവർ കല്ലെടുക്കുന്നു.'
      why_this_sunday: ഹൂദോശ് ഈത്തോ എന്നാൽ സഭയുടെ പ്രതിഷ്ഠ. കഴിഞ്ഞ ആഴ്ച സഭ ശുദ്ധീകരിക്കപ്പെട്ടു; ശലോമോൻ ദൈവാലയം പ്രതിഷ്ഠിച്ചതുപോലെ ഈ ആഴ്ച അത് ദൈവത്തിനു പ്രതിഷ്ഠിക്കപ്പെടുന്നു.
      take_with_you: ഒരു കെട്ടിടം ഒരിക്കൽ പ്രതിഷ്ഠിക്കപ്പെടുന്നു. ഇടയനുള്ളവർ അവന്റെ ശബ്ദത്തിനായി കാതോർക്കുന്ന ഓരോ തവണയും പ്രതിഷ്ഠിക്കപ്പെടുന്നു.
    readings_thread: ഒന്നാം ദൈവാലയത്തിന്റെ പ്രതിഷ്ഠയിൽ ശലോമോൻ പ്രാർത്ഥിക്കുന്നു; ദാഹിക്കുന്ന എല്ലാവരെയും യെശയ്യാവ് ക്ഷണിക്കുന്നു; ക്രിസ്തു നിവർത്തിക്കുന്ന തിരുനിവാസത്തെക്കുറിച്ച് എബ്രായലേഖനം പറയുന്നു. കൈപ്പണിയായ ആലയങ്ങളിൽ ദൈവം വസിക്കുന്നില്ല എന്ന് സ്തെഫാനൊസ് തന്റെ കേൾവിക്കാരെ ഓർമ്മിപ്പിക്കുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 10:22–24
      title: ശലോമോന്റെ മണ്ഡപത്തിലെ ശീതകാലം
      text: 'പ്രതിഷ്ഠോത്സവമാണ്. ദൈവാലയത്തിലെ മേൽക്കൂരയുള്ള മണ്ഡപത്തിൽ യേശു നടക്കുന്നു. ജനങ്ങൾ അവനെ ചുറ്റിനിന്ന് പറയുന്നു: ഞങ്ങളെ ഇനിയും സംശയത്തിൽ നിർത്തരുത്.'
      easy_to_miss: ഏകദേശം 160 വർഷം മുമ്പ് അശുദ്ധമാക്കപ്പെട്ട ദൈവാലയം ശുദ്ധീകരിച്ചതിന്റെ ഓർമ്മയാണ് ഈ പെരുന്നാൾ. ഇന്ന് അതിനെ ഹനുക്കാ എന്നു വിളിക്കുന്നു.
    - verses: യോഹന്നാൻ 10:25–26
      title: ഞാൻ നിങ്ങളോടു പറഞ്ഞു
      text: താൻ ഇതിനകം ഉത്തരം പറഞ്ഞിട്ടുണ്ട് എന്ന് യേശു പറയുന്നു. പിതാവിന്റെ നാമത്തിൽ അവൻ ചെയ്യുന്ന പ്രവൃത്തികൾ അവനുവേണ്ടി സംസാരിക്കുന്നു; എങ്കിലും അവർ വിശ്വസിക്കുന്നില്ല.
      easy_to_miss: യോഹന്നാന്റെ സുവിശേഷം യേശുവിന്റെ അത്ഭുതങ്ങളെ “അടയാളങ്ങൾ” എന്നു വിളിക്കുന്നു. അവ തങ്ങൾക്ക് അപ്പുറത്തേക്കു ചൂണ്ടിക്കാണിക്കാനുള്ളതാണ്.
    - verses: യോഹന്നാൻ 10:27–30
      title: എന്റെ ആടുകൾ എന്റെ ശബ്ദം കേൾക്കുന്നു
      text: അവന്റെ ആടുകൾ അവന്റെ ശബ്ദം അറിഞ്ഞ് അവനെ അനുഗമിക്കുന്നു. അവൻ അവയ്ക്കു നിത്യജീവൻ കൊടുക്കുന്നു; അവന്റെ കയ്യിൽനിന്നോ പിതാവിന്റെ കയ്യിൽനിന്നോ ആർക്കും അവയെ പിടിച്ചുപറിക്കാൻ കഴിയില്ല. “ഞാനും പിതാവും ഒന്നാകുന്നു.”
      easy_to_miss: യേശുവിന്റെ കയ്യും പിതാവിന്റെ കയ്യും ഒരേ ആടുകളെ പിടിച്ചിരിക്കുന്നു. സുരക്ഷിതത്വം ഇരട്ടിയാണ്.
    - verses: യോഹന്നാൻ 10:31–33
      title: അവരുടെ കയ്യിൽ കല്ലുകൾ
      text: പുരുഷാരം കല്ലെടുക്കുന്നു. തന്റെ ഏതു നല്ല പ്രവൃത്തി നിമിത്തമാണ് കല്ലെറിയുന്നത് എന്ന് യേശു ചോദിക്കുന്നു. മനുഷ്യനായിരിക്കെ തന്നെത്താൻ ദൈവമാക്കുന്നതുകൊണ്ട്, ദൈവദൂഷണം നിമിത്തമാണ് എന്ന് അവർ പറയുന്നു.
      easy_to_miss: ദൈവാലയത്തിലെ ദൈവസാന്നിദ്ധ്യം ആഘോഷിക്കുന്ന പെരുന്നാളിൽ, ദൈവം സന്നിഹിതനായിരിക്കുന്നവനെ അവർ കല്ലെറിയാൻ ശ്രമിക്കുന്നു.
    - verses: യോഹന്നാൻ 10:34–38
      title: പ്രവൃത്തികളെ വിശ്വസിപ്പിൻ
      text: ദൈവം മനുഷ്യരെ “ദൈവങ്ങൾ” എന്നു വിളിക്കുന്ന 82-ാം സങ്കീർത്തനം യേശു ഉദ്ധരിക്കുന്നു. എന്നെ വിശ്വസിക്കാൻ കഴിയുന്നില്ലെങ്കിൽ പ്രവൃത്തികളെ വിശ്വസിക്കുക, എന്നാൽ പിതാവ് എന്നിലും ഞാൻ പിതാവിലും എന്ന് നിങ്ങൾ അറിയും എന്ന് അവൻ പറയുന്നു.
      easy_to_miss: 'പിതാവു വിശുദ്ധീകരിച്ചു ലോകത്തിലേക്കു അയച്ചവൻ എന്ന് യേശു തന്നെത്തന്നെ വിളിക്കുന്നു (36-ാം വാക്യം). വിശുദ്ധീകരിക്കപ്പെട്ടവനും പ്രതിഷ്ഠിക്കപ്പെട്ടവനും: ഈ ഞായറിന്റെ പേരിലെ അതേ ആശയം.'
    people:
    - name: യേശു
      role: ശീതകാലപ്പെരുന്നാളിൽ ദൈവാലയത്തിൽ നടക്കുന്നു; പുരുഷാരം അവനെ ചോദ്യം ചെയ്യുന്നു.
      name_meaning: “കർത്താവ് രക്ഷിക്കുന്നു”
      ml: Jesus
    - name: ശലോമോൻ
      role: ഒന്നാം ദൈവാലയം പണിത് പ്രതിഷ്ഠിച്ച രാജാവ്. യേശു നടക്കുന്ന മണ്ഡപം അവന്റെ പേരിലാണ്.
      name_meaning: “സമാധാനമുള്ളവൻ”
      ml: Solomon
    phrases:
    - term: പ്രതിഷ്ഠോത്സവം
      explanation: അശുദ്ധമാക്കപ്പെട്ട ദൈവാലയം മക്കബായർ വീണ്ടും പ്രതിഷ്ഠിച്ചതിന്റെ ഓർമ്മയ്ക്കുള്ള ശീതകാലപ്പെരുന്നാൾ (1 മക്കബായർ 4:52–59).
    - term: ശലോമോന്റെ മണ്ഡപം
      explanation: ദൈവാലയപ്രാകാരത്തിന്റെ കിഴക്കുവശത്തുള്ള നീണ്ട, മേൽക്കൂരയുള്ള തൂണുകളുടെ നിര. ആദിമസഭയും അവിടെ കൂടിവന്നിരുന്നു (അപ്പൊസ്തലപ്രവൃത്തികൾ 5:12).
    - term: ഹൂദോശ് ഈത്തോ
      explanation: സഭയുടെ പ്രതിഷ്ഠ എന്നർത്ഥമുള്ള സുറിയാനി വാക്ക്. കൂദോശ് ഈത്തോയ്ക്കു ശേഷമുള്ള ഞായറാഴ്ച ആചരിക്കുന്നു.
    reflection:
      title_en: ശബ്ദം തിരിച്ചറിയുന്ന ഒരു ജനം
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ശലോമോന്റെ മണ്ഡപത്തിലെ ജനങ്ങൾക്കു വേണ്ടത് വ്യക്തമായ ഒരു ഉത്തരമാണ്. യേശു പഠിപ്പിക്കുന്നത് അവർ കേട്ടിട്ടുണ്ട്, അവൻ ചെയ്യുന്നതു കണ്ടിട്ടുണ്ട്; എന്നിട്ടും അവൻ അത് ഒറ്റ വാക്യത്തിൽ പറയണമെന്ന് അവർ ആഗ്രഹിക്കുന്നു. പ്രശ്നം ഉത്തരത്തിലല്ല എന്ന് അവൻ അവരോടു പറയുന്നു. ആടുകൾ ഇടയനെ തിരിച്ചറിയുന്നത് ഏറെക്കാലം അവന്റെ ശബ്ദം കേട്ടതുകൊണ്ടാണ്.

        ഈ ഞായറാഴ്ച സഭ തന്റെ പ്രതിഷ്ഠയെ ഓർക്കുന്നു. ശലോമോൻ കല്ലുകൊണ്ടുള്ള ഒരു ആലയം പ്രതിഷ്ഠിച്ചു; അത് അശുദ്ധമാക്കപ്പെട്ടപ്പോൾ മക്കബായർ അതു വീണ്ടും പ്രതിഷ്ഠിച്ചു. രണ്ടും പ്രധാനമായിരുന്നു. എന്നാൽ ഈ സുവിശേഷത്തിൽ പ്രധാനമായ പ്രതിഷ്ഠ ഒരു വ്യക്തിയാണ്: പിതാവു വിശുദ്ധീകരിച്ചു ലോകത്തിലേക്ക് അയച്ചവനും, അവനുള്ള ജനവും.

        ഒരു ശബ്ദം തിരിച്ചറിയാൻ അതിനടുത്ത് സമയം ചെലവഴിക്കണം. തിരക്കുള്ള ഒരു മുറിയിലും ഒരു കുഞ്ഞ് അപ്പന്റെയോ അമ്മയുടെയോ ശബ്ദം തിരിച്ചറിയുന്നത് ദിവസവും അതു കേൾക്കുന്നതുകൊണ്ടാണ്. ഇടയന്റെ ശബ്ദം അറിയണമെങ്കിൽ, വായനകളിലും പ്രാർത്ഥനകളിലും വിശുദ്ധ കുർബ്ബാനയിലുമാണ് നാം അതു കേൾക്കുന്നത്; ആഴ്ചതോറും, എവിടെവെച്ചും തിരിച്ചറിയാൻ കഴിയുംവരെ.
      title_ml: A people who know the voice
    week:
      question: ദൈവത്തിന്റെ ശബ്ദം നിങ്ങൾ ഏറ്റവും എളുപ്പത്തിൽ കേൾക്കുന്നത് എവിടെയാണ്? കേൾക്കാൻ ഏറ്റവും പ്രയാസമുള്ളത് എവിടെ?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: അടുത്ത ഞായറാഴ്ചത്തെ സുവിശേഷമായ ലൂക്കൊസ് 1:5–25 പള്ളിയിൽ കേൾക്കുന്നതിനു മുമ്പ് വായിക്കാൻ ഈ ആഴ്ച പത്തു മിനിറ്റ് ശാന്തമായ സമയം കണ്ടെത്തുക.
      prayer: നല്ല ഇടയനേ, ഞങ്ങൾ നിന്റെ കയ്യിലെ ആടുകളാകുന്നു. ഞങ്ങളുടെ ഭവനത്തെയും സഭയെയും വീണ്ടും നിനക്കായി പ്രതിഷ്ഠിക്കേണമേ. നിന്റെ ശബ്ദം തിരിച്ചറിയാൻ ഞങ്ങളെ പഠിപ്പിക്കേണമേ; നിന്റെ കയ്യിൽനിന്ന് ആരും ഞങ്ങളെ പിടിച്ചുപറിക്കാതിരിക്കട്ടെ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 19:47–20:8
        ml: ലൂക്കൊസ് 19:47–20:8
        note: യേശു ദിനംപ്രതി ദൈവാലയത്തിൽ ഉപദേശിക്കുന്നു; പ്രമാണികൾ അവന്റെ അധികാരത്തെ ചോദ്യം ചെയ്യുന്നു.
        printed: St. Luke 19:47-20:8
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Mark 12:41–44
        ml: മർക്കൊസ് 12:41–44
        note: 'ഒരു ദരിദ്രവിധവ രണ്ടു ചെറുകാശു ഭണ്ഡാരത്തിൽ ഇടുന്നു: തനിക്കുള്ളതു മുഴുവനും.'
        printed: St. Mark 12:41-44
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Exodus 33:7–11
        ml: പുറപ്പാട് 33:7–11
        note: പാളയത്തിനു പുറത്തുള്ള കൂടാരത്തിൽ, ഒരു സ്നേഹിതനോടെന്നപോലെ, മുഖാമുഖമായി മോശെ ദൈവത്തെ കാണുന്നു.
        printed: Exodus 33:7-11
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: 1 Kings 8:22–40
        ml: 1 രാജാക്കന്മാർ 8:22–40
        note: 'ദൈവാലയപ്രതിഷ്ഠയിൽ ശലോമോൻ പ്രാർത്ഥിക്കുന്നു: സ്വർഗ്ഗത്തിൽനിന്നു കേട്ടു ക്ഷമിക്കേണമേ.'
        printed: I Kings 8:22-40
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 55:1–13
        ml: യെശയ്യാവ് 55:1–13
        note: ദാഹിക്കുന്ന ഏവരും വരുവിൻ; എന്റെ വചനം വെറുതെ എന്റെ അടുക്കലേക്കു മടങ്ങിവരികയില്ല.
        printed: Isaiah 55:1-13
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 7:44–53
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 7:44–53
        note: അത്യുന്നതൻ കൈപ്പണിയായ ആലയങ്ങളിൽ വസിക്കുന്നില്ല എന്നു സ്തെഫാനൊസ് പറയുന്നു.
        printed: Acts 7:44-53
        or:
          kind: Revelation
          kind_ml: വെളിപ്പാട്
          ref: Revelation 3:14–22
          ml: വെളിപ്പാട് 3:14–22
          printed: Revelation 3:14-22
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Hebrews 9:1–14
        ml: എബ്രായർ 9:1–14
        note: പഴയ കൂടാരം ഒരു മാതൃകയായിരുന്നു; ക്രിസ്തു സ്വന്തരക്തത്തോടെ സത്യവിശുദ്ധമന്ദിരത്തിൽ പ്രവേശിച്ചു.
        printed: Hebrews 9:1-14
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 10:22–38
        ml: യോഹന്നാൻ 10:22–38
        note: 'പ്രതിഷ്ഠാപെരുന്നാളിൽ: എന്റെ ആടുകൾ എന്റെ ശബ്ദം കേൾക്കുന്നു; ഞാനും പിതാവും ഒന്നാകുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.'
        printed: St. John 10:22-38
        main: true
    key_verse:
      ref: യോഹന്നാൻ 10:27
    hero_quote:
      text: അനന്തരം യെരൂശലേമിൽ പ്രതിഷ്ഠോത്സവം ആചരിച്ചു; അന്നു ശീതകാലമായിരുന്നു. യേശു ദൈവലായത്തിൽ ശലോമോന്റെ മണ്ഡപത്തിൽ നടന്നുകൊണ്ടിരുന്നു.
      ref: യോഹന്നാൻ 10:22–23
sources:
