tagline: Renewal of the Church
standfirst: It is winter in Jerusalem and the city is celebrating the day the Temple was rededicated. Jesus walks in the Temple courts and tells the crowd that his sheep know his voice.
description: Readings for Hoodosh Eetho, the dedication of the Church, with John 10:22–38 explained in five scenes, a reflection and a family question.
hero_quote:
  text: It was the Feast of the Dedication at Jerusalem. It was winter, and Jesus was walking in the temple, in Solomon’s porch.
  ref: John 10:22–23
