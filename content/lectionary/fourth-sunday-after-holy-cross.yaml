one_minute:
  what_happens: After the parable of the shrewd manager, Jesus tells his disciples to use worldly wealth to make friends for eternity. Whoever is faithful in little is faithful in much. No one can serve two masters. The money-loving Pharisees scoff, and Jesus says God knows their hearts.
  why_this_sunday: The morning Gospel is the parable of the shrewd manager, and this passage draws its lessons.
  take_with_you: Money makes a good servant and a terrible master.
readings_thread: Israel keeps the last day of the feast of Tabernacles, and Solomon prays at the dedication of the Temple. The psalm cries “as a deer longs for streams of water”. Paul says God chose what the world thinks foolish to shame the wise.
key_verse:
  ref: Luke 16:13
  ml: രണ്ടു യജമാനന്മാരെ സേവിപ്പാൻ ഒരു ഭൃത്യന്നും കഴികയില്ല; അവൻ ഒരുവനെ പകെച്ചു മറ്റവനെ സ്നേഹിക്കും; അല്ലെങ്കിൽ ഒരുത്തനോടു പറ്റിച്ചേർന്നു മറ്റവനെ നിരസിക്കും. നിങ്ങൾക്കു ദൈവത്തെയും മമ്മോനെയും സേവിപ്പാൻ കഴികയില്ല.
  ml_translation: Sathyavedapusthakam, 1910
  en: No servant can serve two masters, for either he will hate the one, and love the other; or else he will hold to one, and despise the other. You aren’t able to serve God and Mammon.”
  en_translation: World English Bible
scenes:
- verses: Luke 16:9
  title: Friends for eternity
  text: Make friends for yourselves by means of worldly wealth, so that when it runs out they will welcome you into eternal homes.
  easy_to_miss: Money will run out, Jesus says. The friendships made by generosity will not.
- verses: Luke 16:10–12
  title: Faithful in little
  text: Whoever is faithful in a very little is faithful in much. If you have not been trustworthy with worldly wealth, who will trust you with true riches?
  easy_to_miss: Jesus calls money “a very little”. Compared with true riches, it is.
- verses: Luke 16:13
  title: Two masters
  text: No servant can serve two masters. You cannot serve God and money.
  easy_to_miss: Jesus uses the Aramaic word Mammon, almost as if money were a rival god.
- verses: Luke 16:14–15
  title: God knows your hearts
  text: 'The Pharisees, who love money, hear this and sneer. Jesus says: you justify yourselves before others, but God knows your hearts. What people prize is detestable to God.'
  easy_to_miss: They laugh because they think wealth shows God’s blessing. Jesus says God looks at the heart, not the bank balance.
- verses: Luke 16:16–18
  title: The law still stands
  text: The law and the prophets were until John; since then the kingdom is preached. It is easier for heaven and earth to pass than for one stroke of the law to fall. Whoever divorces and remarries commits adultery.
  easy_to_miss: Jesus does not loosen God’s law. He applies it more deeply, here to faithfulness in marriage.
people:
- name: The Pharisees
  ml: പരീശന്മാർ
  role: Luke says they loved money and scoffed at Jesus’ teaching.
  name_meaning: Probably “the separated ones”
phrases:
- term: Mammon
  explanation: An Aramaic word for wealth or possessions, used by Jesus as if it were a master demanding service.
- term: Eternal homes
  explanation: The dwellings of God’s kingdom, where friends made by generosity will welcome us.
- term: One stroke of the law
  explanation: The smallest mark of a Hebrew letter. Not even that will fail.
reflection:
  title_en: Two masters
  title_ml: രണ്ടു യജമാനന്മാർ
  read_time: A three-minute read
  body: |-
    Jesus talks about money more than almost anything else in Luke’s Gospel. He knows how it grips people. In this passage he does not say money is evil. He says it is small, temporary, and a test. How we handle it shows whether we can be trusted with things that matter more.

    Then he draws a line. No one can serve two masters. Money is a fine servant, but when it becomes a master it demands everything: our time, our worries, our relationships, our souls. The Pharisees laughed at this. Many people still do.

    Families make money decisions every week. What we buy, what we save, what we give. Jesus suggests a simple test: is our money making friends for eternity? Generosity to the poor, support for the Church, kindness to people in need are how money serves God instead of ruling us.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Does money serve our family, or does it sometimes feel like our master?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Agree as a family on one gift you will give this month to someone in need.
  prayer: Lord, you alone are our master. Free us from the love of money, make us faithful in little things, and teach us to use what we have to make friends for eternity. Amen.
translations:
  ml:
    name:
      en: സ്ലീബാ പെരുന്നാളിനു ശേഷം നാലാം ഞായർ
      ml: Fourth Sunday after Holy Cross
    season:
      en: സ്ലീബാ
      gloss: സ്ലീബായുടെ കാലം
    tagline: അത്യല്പത്തിൽ വിശ്വസ്തൻ; രണ്ടു യജമാനന്മാരെ സേവിപ്പാൻ കഴികയില്ല
    standfirst: 'ചെറിയ കാര്യങ്ങളിൽ വിശ്വസ്തനായവൻ വലിയ കാര്യങ്ങളിലും വിശ്വസ്തനായിരിക്കും എന്ന് യേശു പറയുന്നു. പിന്നെ എല്ലാവരും ഉള്ളിൽ അറിഞ്ഞിരുന്ന കാര്യം അവൻ തുറന്നു പറയുന്നു: ദൈവത്തെയും മമ്മോനെയും ഒരുമിച്ചു സേവിക്കാനാവില്ല.'
    description: 'സ്ലീബാ പെരുന്നാളിനു ശേഷം നാലാം ഞായറിലെ വായനകൾ, ദൈവവും മമ്മോനും: ലൂക്കൊസ് 16:9–18 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും കുടുംബചോദ്യവും.'
    one_minute:
      what_happens: അനീതിയുള്ള കാര്യവിചാരകന്റെ ഉപമയ്ക്കു ശേഷം, ലൌകികസമ്പത്തുകൊണ്ടു നിത്യതയ്ക്കായി സ്നേഹിതന്മാരെ ഉണ്ടാക്കാൻ യേശു ശിഷ്യന്മാരോടു പറയുന്നു. അത്യല്പത്തിൽ വിശ്വസ്തനായവൻ അധികത്തിലും വിശ്വസ്തൻ. രണ്ടു യജമാനന്മാരെ സേവിപ്പാൻ ആർക്കും കഴികയില്ല. ദ്രവ്യാഗ്രഹികളായ പരീശന്മാർ പരിഹസിക്കുന്നു; ദൈവം അവരുടെ ഹൃദയം അറിയുന്നു എന്ന് യേശു പറയുന്നു.
      why_this_sunday: പ്രഭാതത്തിലെ സുവിശേഷം അനീതിയുള്ള കാര്യവിചാരകന്റെ ഉപമയാണ്; ഈ ഭാഗം അതിൽനിന്നുള്ള പാഠങ്ങൾ എടുത്തു പറയുന്നു.
      take_with_you: പണം നല്ലൊരു ദാസനാണ്; എന്നാൽ യജമാനനായാൽ അതു ഭയങ്കരമാണ്.
    readings_thread: യിസ്രായേൽ കൂടാരപ്പെരുന്നാളിന്റെ അവസാനദിവസം ആചരിക്കുന്നു; ദൈവാലയപ്രതിഷ്ഠയിൽ ശലോമോൻ പ്രാർത്ഥിക്കുന്നു. “മാൻ നീർത്തോടുകളിലേക്കു ചെല്ലുവാൻ കാംക്ഷിക്കുന്നതുപോലെ” എന്നു സങ്കീർത്തനം നിലവിളിക്കുന്നു. ജ്ഞാനികളെ ലജ്ജിപ്പിക്കാൻ ലോകം ഭോഷത്വമെന്നു കരുതുന്നതിനെ ദൈവം തിരഞ്ഞെടുത്തു എന്നു പൌലൊസ് പറയുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 16:9
      title: നിത്യതയ്ക്കായുള്ള സ്നേഹിതന്മാർ
      text: അനീതിയുള്ള മമ്മോനെക്കൊണ്ടു നിങ്ങൾക്കു സ്നേഹിതന്മാരെ ഉണ്ടാക്കിക്കൊൾവിൻ; അതു ഇല്ലാതെയാകുമ്പോൾ അവർ നിത്യകൂടാരങ്ങളിൽ നിങ്ങളെ ചേർത്തുകൊൾവാൻ ഇടയാകും.
      easy_to_miss: പണം തീർന്നുപോകും എന്ന് യേശു പറയുന്നു. ഉദാരതകൊണ്ടു നേടിയ സൗഹൃദങ്ങൾ തീർന്നുപോകുകയില്ല.
    - verses: ലൂക്കൊസ് 16:10–12
      title: അത്യല്പത്തിൽ വിശ്വസ്തൻ
      text: അത്യല്പത്തിൽ വിശ്വസ്തനായവൻ അധികത്തിലും വിശ്വസ്തൻ. നിങ്ങൾ അനീതിയുള്ള മമ്മോനിൽ വിശ്വസ്തരായില്ല എങ്കിൽ സത്യമായതു നിങ്ങളെ ആർ ഭരമേല്പിക്കും?
      easy_to_miss: യേശു പണത്തെ ‘അത്യല്പം’ എന്നു വിളിക്കുന്നു. സത്യമായ സമ്പത്തിനോടു തട്ടിച്ചുനോക്കുമ്പോൾ അത് അങ്ങനെതന്നെ.
    - verses: ലൂക്കൊസ് 16:13
      title: രണ്ടു യജമാനന്മാർ
      text: രണ്ടു യജമാനന്മാരെ സേവിപ്പാൻ ഒരു ഭൃത്യന്നും കഴികയില്ല. നിങ്ങൾക്കു ദൈവത്തെയും മമ്മോനെയും സേവിപ്പാൻ കഴികയില്ല.
      easy_to_miss: യേശു ‘മമ്മോൻ’ എന്ന അരാമ്യവാക്ക് ഉപയോഗിക്കുന്നു; പണം ഒരു എതിർദൈവം എന്നപോലെ.
    - verses: ലൂക്കൊസ് 16:14–15
      title: ദൈവം ഹൃദയം അറിയുന്നു
      text: 'ദ്രവ്യാഗ്രഹികളായ പരീശന്മാർ ഇതു കേട്ടു അവനെ പരിഹസിക്കുന്നു. യേശു പറയുന്നു: നിങ്ങൾ മനുഷ്യരുടെ മുമ്പാകെ നിങ്ങളെ തന്നേ നീതീകരിക്കുന്നു; ദൈവമോ നിങ്ങളുടെ ഹൃദയം അറിയുന്നു. മനുഷ്യരുടെ ഇടയിൽ ഉന്നതമായതു ദൈവത്തിന്റെ മുമ്പാകെ അറെപ്പത്രേ.'
      easy_to_miss: സമ്പത്ത് ദൈവാനുഗ്രഹത്തിന്റെ അടയാളമാണെന്ന് അവർ കരുതിയതുകൊണ്ടാണ് അവർ ചിരിക്കുന്നത്. ദൈവം നോക്കുന്നതു ഹൃദയത്തിലേക്കാണ്, സമ്പാദ്യത്തിലേക്കല്ല എന്ന് യേശു പറയുന്നു.
    - verses: ലൂക്കൊസ് 16:16–18
      title: ന്യായപ്രമാണം നിലനില്ക്കുന്നു
      text: ന്യായപ്രമാണത്തിന്റെയും പ്രവാചകന്മാരുടെയും കാലം യോഹന്നാൻ വരെ ആയിരുന്നു; അന്നുമുതൽ ദൈവരാജ്യം സുവിശേഷിക്കപ്പെടുന്നു. ന്യായപ്രമാണത്തിൽ ഒരു പുള്ളി വീണുപോകുന്നതിനെക്കാൾ ആകാശവും ഭൂമിയും ഒഴിഞ്ഞുപോകുന്നതു എളുപ്പം. ഭാര്യയെ ഉപേക്ഷിച്ചു മറ്റൊരുത്തിയെ വിവാഹം കഴിക്കുന്നവൻ വ്യഭിചാരം ചെയ്യുന്നു.
      easy_to_miss: യേശു ദൈവത്തിന്റെ ന്യായപ്രമാണം അയച്ചുവിടുന്നില്ല. അവൻ അതിനെ കൂടുതൽ ആഴത്തിൽ, ഇവിടെ വിവാഹത്തിലെ വിശ്വസ്തതയിൽ, പ്രയോഗിക്കുന്നു.
    people:
    - name: പരീശന്മാർ
      role: ദ്രവ്യാഗ്രഹികളായിരുന്നു എന്നും യേശുവിന്റെ ഉപദേശത്തെ പരിഹസിച്ചു എന്നും ലൂക്കൊസ് പറയുന്നു.
      name_meaning: ഒരുപക്ഷേ “വേർപെട്ടവർ”
      ml: The Pharisees
    phrases:
    - term: മമ്മോൻ
      explanation: സമ്പത്ത് അല്ലെങ്കിൽ വസ്തുവക എന്നതിന്റെ അരാമ്യവാക്ക്. സേവനം ആവശ്യപ്പെടുന്ന ഒരു യജമാനൻ എന്നപോലെ യേശു അത് ഉപയോഗിക്കുന്നു.
    - term: നിത്യകൂടാരങ്ങൾ
      explanation: ദൈവരാജ്യത്തിലെ വാസസ്ഥലങ്ങൾ; ഉദാരതകൊണ്ടു നേടിയ സ്നേഹിതന്മാർ അവിടെ നമ്മെ സ്വീകരിക്കും.
    - term: ഒരു പുള്ളി
      explanation: ഒരു എബ്രായ അക്ഷരത്തിലെ ഏറ്റവും ചെറിയ അടയാളം. അതുപോലും വീണുപോകുകയില്ല.
    reflection:
      title_en: രണ്ടു യജമാനന്മാർ
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ലൂക്കൊസിന്റെ സുവിശേഷത്തിൽ യേശു മറ്റു മിക്കവാറും എല്ലാറ്റിനെക്കാളും അധികം പണത്തെക്കുറിച്ചു സംസാരിക്കുന്നു. അതു മനുഷ്യരെ എങ്ങനെ പിടിമുറുക്കുന്നു എന്ന് അവന് അറിയാം. പണം തിന്മയാണ് എന്ന് ഈ ഭാഗത്ത് അവൻ പറയുന്നില്ല. അതു ചെറുതും താല്ക്കാലികവും ഒരു പരീക്ഷയുമാണ് എന്ന് അവൻ പറയുന്നു. നാം അതു കൈകാര്യം ചെയ്യുന്ന വിധം, അതിനെക്കാൾ വിലയുള്ളതു നമ്മെ ഏല്പിക്കാമോ എന്നു കാണിക്കുന്നു.

        പിന്നെ അവൻ ഒരു വര വരയ്ക്കുന്നു. രണ്ടു യജമാനന്മാരെ സേവിപ്പാൻ ആർക്കും കഴികയില്ല. പണം നല്ലൊരു ദാസനാണ്; എന്നാൽ യജമാനനാകുമ്പോൾ അത് എല്ലാം ആവശ്യപ്പെടുന്നു: നമ്മുടെ സമയം, നമ്മുടെ ആകുലതകൾ, നമ്മുടെ ബന്ധങ്ങൾ, നമ്മുടെ ആത്മാവ്. പരീശന്മാർ ഇതു കേട്ടു ചിരിച്ചു. ഇന്നും അനേകർ ചിരിക്കുന്നു.

        ഓരോ ആഴ്ചയും കുടുംബങ്ങൾ പണത്തെക്കുറിച്ചു തീരുമാനങ്ങൾ എടുക്കുന്നു: എന്തു വാങ്ങണം, എന്തു സൂക്ഷിക്കണം, എന്തു കൊടുക്കണം. യേശു ഒരു ലളിതമായ പരീക്ഷ നല്കുന്നു: നമ്മുടെ പണം നിത്യതയ്ക്കായി സ്നേഹിതന്മാരെ ഉണ്ടാക്കുന്നുണ്ടോ? ദരിദ്രരോടുള്ള ഉദാരത, സഭയ്ക്കുള്ള പിന്തുണ, ആവശ്യത്തിലിരിക്കുന്നവരോടുള്ള ദയ: ഇങ്ങനെയാണ് പണം നമ്മെ ഭരിക്കാതെ ദൈവത്തെ സേവിക്കുന്നത്.
      title_ml: Two masters
    week:
      question: പണം നമ്മുടെ കുടുംബത്തെ സേവിക്കുകയാണോ, അതോ ചിലപ്പോൾ അതു നമ്മുടെ യജമാനനായി തോന്നുന്നുണ്ടോ?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ മാസം ആവശ്യത്തിലിരിക്കുന്ന ഒരാൾക്കു നല്കുന്ന ഒരു ദാനം കുടുംബം ഒരുമിച്ചു തീരുമാനിക്കുക.
      prayer: കർത്താവേ, നീ മാത്രമാണ് ഞങ്ങളുടെ യജമാനൻ. ദ്രവ്യാഗ്രഹത്തിൽനിന്നു ഞങ്ങളെ സ്വതന്ത്രരാക്കേണമേ; അത്യല്പത്തിൽ ഞങ്ങളെ വിശ്വസ്തരാക്കേണമേ; ഞങ്ങൾക്കുള്ളതുകൊണ്ടു നിത്യതയ്ക്കായി സ്നേഹിതന്മാരെ ഉണ്ടാക്കാൻ ഞങ്ങളെ പഠിപ്പിക്കേണമേ. ആമേൻ.
