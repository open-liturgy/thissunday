tagline: Faithful in little things, and no one can serve two masters
standfirst: 'Jesus says that whoever is faithful in small things will be faithful in large ones. Then he says what everyone already suspected: you cannot serve God and money.'
description: Readings for the Fourth Sunday after Holy Cross, with Luke 16:9–18, God and money, explained in five scenes. A reflection and a family question.
