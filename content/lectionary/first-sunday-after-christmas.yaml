one_minute:
  what_happens: The wise men follow the star to the child, worship him and give gold, frankincense and myrrh. Warned in a dream, they go home another way. Joseph takes Mary and the child to Egypt, and after Herod dies they settle in Nazareth.
  why_this_sunday: Two days after Christmas the story turns dangerous. The Church remembers the Holy Family as refugees.
  take_with_you: Christ’s first journey outside his homeland was as a refugee, carried at night by parents who had to leave everything.
readings_thread: Another Joseph, son of Jacob, is sold and taken down to Egypt. Zechariah promises God will bring his scattered people home, and Isaiah warns of the dark. Paul is turned aside by a vision, and Corinthians remembers Israel in the wilderness.
key_verse:
  ref: Matthew 2:11
  ml: ആ വീട്ടിൽ ചെന്നു, ശിശുവിനെ അമ്മയായ മറിയയോടുംകൂടെ കണ്ടു, വീണു അവനെ നമസ്കരിച്ചു; നിക്ഷേപപാത്രങ്ങളെ തുറന്നു അവന്നു പൊന്നും കുന്തുരുക്കവും മൂരും കാഴ്ചവെച്ചു.
  ml_translation: Sathyavedapusthakam, 1910
  en: 'They came into the house and saw the young child with Mary, his mother, and they fell down and worshiped him. Opening their treasures, they offered to him gifts: gold, frankincense, and myrrh.'
  en_translation: World English Bible
scenes:
- verses: Matthew 2:9–10
  title: The star stops
  text: The star goes ahead of the wise men and stops over the place where the child is. They are overjoyed.
  easy_to_miss: 'Matthew piles up the words: they rejoiced with exceedingly great joy. After a long journey, they have found him.'
- verses: Matthew 2:11
  title: Gold, frankincense and myrrh
  text: They enter the house, see the child with Mary his mother, kneel and worship him, and open their treasures.
  easy_to_miss: The first people in Matthew to worship Jesus are foreigners. The Gospel ends with the disciples sent to all nations.
- verses: Matthew 2:12–13
  title: Another way home
  text: Warned in a dream not to return to Herod, the wise men leave by another road. Then an angel tells Joseph to take the child and his mother and flee to Egypt.
  easy_to_miss: This is the second of four dreams Joseph has in Matthew’s first two chapters. He obeys every one.
- verses: Matthew 2:14–15
  title: By night to Egypt
  text: Joseph gets up, takes the child and his mother by night and leaves for Egypt, where they stay until Herod dies.
  easy_to_miss: 'Matthew quotes Hosea: “Out of Egypt I called my son.” Jesus relives Israel’s own story of going down to Egypt and coming out.'
- verses: Matthew 2:19–23
  title: Home to Nazareth
  text: After Herod’s death the angel sends them back. Hearing that Herod’s son rules Judea, Joseph is afraid and settles in Nazareth in Galilee.
  easy_to_miss: Nazareth was so small it is never mentioned in the Old Testament. The King of Israel grows up in a village nobody expected.
people:
- name: The wise men
  ml: വിദ്വാന്മാർ
  role: Scholars from the east who studied the stars. Matthew does not say how many.
  name_meaning: Greek magoi, a word for Persian priests and astrologers
- name: Herod the Great
  ml: ഹെരോദാവ്
  role: King of Judea under Rome, known for killing anyone he saw as a threat.
  name_meaning: “Heroic”
- name: Archelaus
  ml: അർക്കെലയൊസ്
  role: Herod’s son, who ruled Judea after him and was as cruel as his father.
  name_meaning: “Ruler of the people”
phrases:
- term: Frankincense
  explanation: A fragrant resin burned in worship. It was used in the Temple incense (Exodus 30:34).
- term: Myrrh
  explanation: A bitter resin used in perfume and for preparing the dead. It appears again at Jesus’ burial (John 19:39).
- term: Nazarene
  explanation: Someone from Nazareth. Matthew may also be hearing the Hebrew netser, “branch”, from Isaiah 11:1.
reflection:
  title_en: The Holy Family on the road
  title_ml: വഴിയിലായ തിരുക്കുടുംബം
  read_time: A three-minute read
  body: |-
    Christmas cards usually stop at the manger. Matthew’s story keeps going. The wise men leave their gifts and go home, and that same night Joseph wakes his wife and the baby and leaves for a foreign country. They take what they can carry and travel in the dark.

    The Son of God spent his early childhood as a refugee. His parents depended on strangers in a land where they did not speak the language. They waited for news from home and did not know when they could return. When they did, they could not go where they had planned, and settled in a small village instead.

    Many families in our Church know something of this: moving for work or safety, building a life in a new country, missing home. This Gospel says God has been on that road. It also asks us to look kindly on those who are on it now, because the Holy Family once needed exactly that kindness.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Has our family ever had to move to a new place? What helped us feel at home?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Welcome one person who is new to your parish, school or workplace this week. Learn their name and one thing about them.
  prayer: Lord Jesus, you were carried into Egypt as a child. Protect all who have had to leave their homes, give them welcome where they arrive, and make our family a place of shelter. Amen.
translations:
  ml:
    name:
      en: ജനനപ്പെരുന്നാളിനു ശേഷം ഒന്നാം ഞായർ
      ml: First Sunday after Christmas
    season:
      en: യൽദോ
      gloss: ജനനപ്പെരുന്നാൾ കാലം
    tagline: വിദ്വാന്മാർ നമസ്കരിക്കുന്നു; തിരുക്കുടുംബം മിസ്രയീമിലേക്ക് ഓടിപ്പോകുന്നു
    standfirst: വിദ്വാന്മാർ ശിശുവിനെ കണ്ടെത്തി, വീണു നമസ്കരിച്ച്, തങ്ങളുടെ കാഴ്ചകൾ വെക്കുന്നു. അന്നു രാത്രി ഒരു ദൂതൻ യോസേഫിനെ ഉണർത്തുന്നു; പുലരുംമുമ്പേ കുടുംബം മിസ്രയീമിലേക്കു പുറപ്പെടുന്നു.
    description: 'ജനനപ്പെരുന്നാളിനു ശേഷം ഒന്നാം ഞായറിലെ വായനകൾ, മത്തായി 2:9–15, 19–23 വിശദീകരിച്ചത്: വിദ്വാന്മാരും മിസ്രയീമിലേക്കുള്ള ഓട്ടവും. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: നക്ഷത്രത്തെ പിന്തുടർന്ന് വിദ്വാന്മാർ ശിശുവിന്റെ അടുക്കൽ എത്തി, അവനെ നമസ്കരിച്ച്, പൊന്നും കുന്തുരുക്കവും മൂരും കാഴ്ചവെക്കുന്നു. സ്വപ്നത്തിൽ അരുളപ്പാടു ലഭിച്ച് അവർ മറ്റൊരു വഴിയായി മടങ്ങുന്നു. യോസേഫ് മറിയയെയും ശിശുവിനെയും കൂട്ടി മിസ്രയീമിലേക്കു പോകുന്നു; ഹെരോദാവ് മരിച്ചശേഷം അവർ നസറെത്തിൽ പാർക്കുന്നു.
      why_this_sunday: ക്രിസ്തുമസ് കഴിഞ്ഞ് രണ്ടു ദിവസത്തിനകം കഥ അപകടകരമാകുന്നു. അഭയാർത്ഥികളായ തിരുക്കുടുംബത്തെ സഭ ഓർക്കുന്നു.
      take_with_you: ക്രിസ്തുവിന്റെ ജന്മനാട്ടിനു പുറത്തേക്കുള്ള ആദ്യയാത്ര ഒരു അഭയാർത്ഥിയായിട്ടായിരുന്നു; എല്ലാം ഉപേക്ഷിക്കേണ്ടിവന്ന മാതാപിതാക്കൾ രാത്രിയിൽ അവനെ ചുമന്നുകൊണ്ടുപോയി.
    readings_thread: മറ്റൊരു യോസേഫ്, യാക്കോബിന്റെ മകൻ, വില്ക്കപ്പെട്ട് മിസ്രയീമിലേക്കു കൊണ്ടുപോകപ്പെടുന്നു. ചിതറിപ്പോയ തന്റെ ജനത്തെ ദൈവം തിരികെ കൊണ്ടുവരും എന്ന് സെഖര്യാവ് വാഗ്ദാനം ചെയ്യുന്നു; യെശയ്യാവ് ഇരുളിനെക്കുറിച്ചു മുന്നറിയിപ്പു നല്കുന്നു. ഒരു ദർശനത്താൽ പൗലോസ് വഴിമാറ്റപ്പെടുന്നു; മരുഭൂമിയിലെ യിസ്രായേലിനെ കൊരിന്ത്യലേഖനം ഓർക്കുന്നു.
    scenes:
    - verses: മത്തായി 2:9–10
      title: നക്ഷത്രം നില്ക്കുന്നു
      text: നക്ഷത്രം വിദ്വാന്മാർക്കു മുമ്പായി പോയി ശിശു ഇരിക്കുന്ന സ്ഥലത്തിനു മീതെ നില്ക്കുന്നു. അവർ അത്യന്തം സന്തോഷിക്കുന്നു.
      easy_to_miss: 'മത്തായി വാക്കുകൾ കൂട്ടിവെക്കുന്നു: അവർ അത്യന്തം സന്തോഷിച്ചു. നീണ്ട യാത്രയ്ക്കു ശേഷം അവർ അവനെ കണ്ടെത്തിയിരിക്കുന്നു.'
    - verses: മത്തായി 2:11
      title: പൊന്നും കുന്തുരുക്കവും മൂരും
      text: അവർ വീട്ടിൽ ചെന്ന്, ശിശുവിനെ അമ്മയായ മറിയയോടുകൂടെ കണ്ട്, വീണു നമസ്കരിച്ച്, തങ്ങളുടെ നിക്ഷേപപാത്രങ്ങൾ തുറക്കുന്നു.
      easy_to_miss: മത്തായിയിൽ യേശുവിനെ ആദ്യം നമസ്കരിക്കുന്നത് വിദേശികളാണ്. സകല ജാതികളിലേക്കും ശിഷ്യന്മാരെ അയയ്ക്കുന്നതോടെയാണ് സുവിശേഷം അവസാനിക്കുന്നത്.
    - verses: മത്തായി 2:12–13
      title: മറ്റൊരു വഴിയായി വീട്ടിലേക്ക്
      text: ഹെരോദാവിന്റെ അടുക്കലേക്കു മടങ്ങരുത് എന്നു സ്വപ്നത്തിൽ അരുളപ്പാടു ലഭിച്ച് വിദ്വാന്മാർ മറ്റൊരു വഴിയായി പോകുന്നു. പിന്നെ ശിശുവിനെയും അമ്മയെയും കൂട്ടി മിസ്രയീമിലേക്ക് ഓടിപ്പോകാൻ ഒരു ദൂതൻ യോസേഫിനോടു പറയുന്നു.
      easy_to_miss: മത്തായിയുടെ ആദ്യ രണ്ട് അദ്ധ്യായങ്ങളിൽ യോസേഫ് കാണുന്ന നാലു സ്വപ്നങ്ങളിൽ രണ്ടാമത്തേതാണിത്. ഓരോന്നും അവൻ അനുസരിക്കുന്നു.
    - verses: മത്തായി 2:14–15
      title: രാത്രിയിൽ മിസ്രയീമിലേക്ക്
      text: യോസേഫ് എഴുന്നേറ്റ് ശിശുവിനെയും അമ്മയെയും കൂട്ടി രാത്രിയിൽ മിസ്രയീമിലേക്കു പോകുന്നു; ഹെരോദാവ് മരിക്കുംവരെ അവർ അവിടെ പാർക്കുന്നു.
      easy_to_miss: “മിസ്രയീമിൽനിന്നു ഞാൻ എന്റെ മകനെ വിളിച്ചു” എന്ന ഹോശേയയുടെ വാക്ക് മത്തായി ഉദ്ധരിക്കുന്നു. മിസ്രയീമിലേക്കു പോയി പുറത്തുവന്ന യിസ്രായേലിന്റെ സ്വന്തം കഥ യേശു വീണ്ടും ജീവിക്കുന്നു.
    - verses: മത്തായി 2:19–23
      title: നസറെത്തിലേക്കു മടക്കം
      text: ഹെരോദാവിന്റെ മരണശേഷം ദൂതൻ അവരെ തിരിച്ചയയ്ക്കുന്നു. ഹെരോദാവിന്റെ മകൻ യെഹൂദ്യ ഭരിക്കുന്നു എന്നു കേട്ട് യോസേഫ് ഭയപ്പെട്ട് ഗലീലയിലെ നസറെത്തിൽ പാർക്കുന്നു.
      easy_to_miss: പഴയനിയമത്തിൽ ഒരിക്കലും പരാമർശിക്കപ്പെടാത്തത്ര ചെറുതായിരുന്നു നസറെത്ത്. യിസ്രായേലിന്റെ രാജാവ് വളരുന്നത് ആരും പ്രതീക്ഷിക്കാത്ത ഒരു ഗ്രാമത്തിലാണ്.
    people:
    - name: വിദ്വാന്മാർ
      role: നക്ഷത്രങ്ങളെ പഠിച്ചിരുന്ന കിഴക്കുനിന്നുള്ള പണ്ഡിതന്മാർ. അവർ എത്രപേർ എന്നു മത്തായി പറയുന്നില്ല.
      name_meaning: ഗ്രീക്കിൽ മാഗോയി; പാർസി പുരോഹിതന്മാരെയും ജ്യോതിഷികളെയും കുറിക്കുന്ന വാക്ക്
      ml: The wise men
    - name: മഹാനായ ഹെരോദാവ്
      role: റോമിനു കീഴിൽ യെഹൂദ്യയുടെ രാജാവ്; ഭീഷണിയായി കണ്ട ആരെയും കൊന്നുകളയുന്നതിൽ കുപ്രസിദ്ധൻ.
      name_meaning: “വീരോചിതൻ”
      ml: Herod the Great
    - name: അർക്കെലയൊസ്
      role: ഹെരോദാവിനു ശേഷം യെഹൂദ്യ ഭരിച്ച അവന്റെ മകൻ; അപ്പനെപ്പോലെ ക്രൂരൻ.
      name_meaning: “ജനത്തിന്റെ ഭരണാധികാരി”
      ml: Archelaus
    phrases:
    - term: കുന്തുരുക്കം
      explanation: ആരാധനയിൽ കത്തിക്കുന്ന സുഗന്ധമുള്ള ഒരു പശ. ദൈവാലയത്തിലെ ധൂപവർഗ്ഗത്തിൽ അത് ഉപയോഗിച്ചിരുന്നു (പുറപ്പാട് 30:34).
    - term: മൂര്
      explanation: സുഗന്ധദ്രവ്യങ്ങളിലും മരിച്ചവരെ ഒരുക്കുന്നതിലും ഉപയോഗിച്ചിരുന്ന കയ്പുള്ള ഒരു പശ. യേശുവിന്റെ ശവസംസ്കാരത്തിൽ അതു വീണ്ടും വരുന്നു (യോഹന്നാൻ 19:39).
    - term: നസറായൻ
      explanation: നസറെത്തുകാരൻ. യെശയ്യാവ് 11:1-ലെ “മുള” എന്നർത്ഥമുള്ള നേസർ എന്ന എബ്രായവാക്കും മത്തായി കേൾക്കുന്നുണ്ടാകാം.
    reflection:
      title_en: വഴിയിലായ തിരുക്കുടുംബം
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ക്രിസ്തുമസ് കാർഡുകൾ സാധാരണ പുൽക്കൂട്ടിൽ നില്ക്കുന്നു. മത്തായിയുടെ കഥ മുന്നോട്ടു പോകുന്നു. വിദ്വാന്മാർ കാഴ്ചകൾ വെച്ച് മടങ്ങുന്നു; അന്നു രാത്രിതന്നെ യോസേഫ് ഭാര്യയെയും കുഞ്ഞിനെയും ഉണർത്തി ഒരു അന്യദേശത്തേക്കു പുറപ്പെടുന്നു. ചുമക്കാവുന്നതു മാത്രം എടുത്ത് അവർ ഇരുട്ടിൽ യാത്ര ചെയ്യുന്നു.

        ദൈവപുത്രൻ തന്റെ ആദ്യബാല്യം ചെലവഴിച്ചത് ഒരു അഭയാർത്ഥിയായാണ്. ഭാഷ അറിയാത്ത ഒരു നാട്ടിൽ അവന്റെ മാതാപിതാക്കൾ അപരിചിതരെ ആശ്രയിച്ചു. നാട്ടിൽനിന്നുള്ള വാർത്തയ്ക്കായി അവർ കാത്തിരുന്നു; എപ്പോൾ മടങ്ങാമെന്ന് അവർക്കറിയില്ലായിരുന്നു. മടങ്ങിയപ്പോൾ, ഉദ്ദേശിച്ചിടത്തേക്കു പോകാൻ കഴിയാതെ ഒരു ചെറിയ ഗ്രാമത്തിൽ അവർ പാർപ്പുറപ്പിച്ചു.

        നമ്മുടെ സഭയിലെ പല കുടുംബങ്ങൾക്കും ഇതിൽ ചിലതൊക്കെ അറിയാം: ജോലിക്കോ സുരക്ഷയ്ക്കോ വേണ്ടി താമസം മാറുന്നത്, പുതിയ ഒരു രാജ്യത്ത് ജീവിതം പടുത്തുയർത്തുന്നത്, നാടിനെ ഓർത്തു വേദനിക്കുന്നത്. ദൈവം ആ വഴിയിലൂടെ നടന്നിട്ടുണ്ട് എന്ന് ഈ സുവിശേഷം പറയുന്നു. ഇപ്പോൾ ആ വഴിയിലുള്ളവരെ കരുണയോടെ കാണാനും അതു നമ്മോട് ആവശ്യപ്പെടുന്നു; ഒരിക്കൽ തിരുക്കുടുംബത്തിനു വേണ്ടിയിരുന്നതും അതേ കരുണയായിരുന്നു.
      title_ml: The Holy Family on the road
    week:
      question: നമ്മുടെ കുടുംബത്തിന് എപ്പോഴെങ്കിലും പുതിയ ഒരു സ്ഥലത്തേക്കു മാറേണ്ടിവന്നിട്ടുണ്ടോ? വീടുപോലെ തോന്നാൻ നമ്മെ സഹായിച്ചത് എന്താണ്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച നിങ്ങളുടെ ഇടവകയിലോ സ്കൂളിലോ ജോലിസ്ഥലത്തോ പുതുതായി വന്ന ഒരാളെ സ്വാഗതം ചെയ്യുക. അവരുടെ പേരും അവരെക്കുറിച്ച് ഒരു കാര്യവും അറിയുക.
      prayer: കർത്താവായ യേശുവേ, ശിശുവായിരിക്കെ നീ മിസ്രയീമിലേക്കു ചുമന്നുകൊണ്ടുപോകപ്പെട്ടു. വീടുവിട്ടു പോകേണ്ടിവന്ന എല്ലാവരെയും കാക്കേണമേ; അവർ ചെല്ലുന്നിടത്ത് അവർക്കു സ്വാഗതം നല്കേണമേ; ഞങ്ങളുടെ കുടുംബത്തെ ഒരു അഭയസ്ഥാനമാക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 10:16–23
        ml: മത്തായി 10:16–23
        note: 'ചെന്നായ്ക്കളുടെ നടുവിൽ ആടുകളെപ്പോലെ: ഒരു പട്ടണത്തിൽ ഉപദ്രവിച്ചാൽ മറ്റൊന്നിലേക്ക് ഓടിപ്പോകുവിൻ.'
        printed: St. Matthew 10:16-23
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 15:18–21
        ml: യോഹന്നാൻ 15:18–21
        note: ലോകം നിങ്ങളെ പകെക്കുന്നു എങ്കിൽ അതു നിങ്ങൾക്കു മുമ്പെ എന്നെ പകെച്ചിരിക്കുന്നു എന്ന് അറിവിൻ.
        printed: St. John 15:18-21
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 37:13–28
        ml: ഉല്പത്തി 37:13–28
        note: യോസേഫിന്റെ സഹോദരന്മാർ അവനെ മിസ്രയീമിലേക്കു പോകുന്ന കച്ചവടക്കാർക്കു വില്ക്കുന്നു.
        printed: Genesis 37:13-28
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Zechariah 8:3–8
        ml: സെഖര്യാവ് 8:3–8
        note: ദൈവം തന്റെ ജനത്തെ മടക്കിക്കൊണ്ടുവരും; യെരൂശലേമിന്റെ വീഥികൾ വൃദ്ധന്മാരെക്കൊണ്ടും കുട്ടികളെക്കൊണ്ടും നിറയും.
        printed: Zechariah 8:3-8
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 5:20–30
        ml: യെശയ്യാവ് 5:20–30
        note: തിന്മെക്കു നന്മ എന്നും നന്മെക്കു തിന്മ എന്നും പറയുന്നവർക്ക് അയ്യോ കഷ്ടം.
        printed: Isaiah 5:20-30
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 16:6–10
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 16:6–10
        note: 'ഒരു വഴിയിൽനിന്നു തടയപ്പെട്ട പൌലൊസിനെ ഒരു ദർശനത്തിൽ മറ്റൊന്നിലേക്കു വിളിക്കുന്നു: ഇക്കരെ വന്നു ഞങ്ങളെ സഹായിക്ക.'
        printed: Acts 16:6-10
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 1 Corinthians 10:1–13
        ml: 1 കൊരിന്ത്യർ 10:1–13
        note: മരുഭൂമിയിലെ യിസ്രായേൽ ഒരു മുന്നറിയിപ്പാണ്; നിങ്ങൾക്കു കഴിയുന്നതിന്നുമീതെ പരീക്ഷിക്കപ്പെടുവാൻ ദൈവം സമ്മതിക്കയില്ല.
        printed: I Corinthians 10:1-13
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 2:9–15, 19–23
        ml: മത്തായി 2:9–15, 19–23
        note: വിദ്വാന്മാർ ശിശുവിനെ നമസ്കരിക്കുന്നു; തിരുകുടുംബം മിസ്രയീമിലേക്ക് ഓടിപ്പോയി നസറെത്തിലേക്കു മടങ്ങുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Matthew 2:9-15, 19-23
        main: true
    key_verse:
      ref: മത്തായി 2:11
    hero_quote:
      text: നക്ഷത്രം കണ്ടതുകൊണ്ടു അവർ അത്യന്തം സന്തോഷിച്ചു.
      ref: മത്തായി 2:10
sources:
  lectionary: https://mosc.in/lectionary/421-2/
reviewed: false
