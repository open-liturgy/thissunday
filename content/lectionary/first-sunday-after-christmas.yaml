sunday_slug: first-sunday-after-christmas
is_sunday: true
name:
  en: First Sunday after Christmas
  ml: ജനനപ്പെരുന്നാളിനു ശേഷം ഒന്നാം ഞായർ
title_as_printed: First Sunday after Christmas (The Holy Family flee to Egypt)
season:
  en: Yeldho
  gloss: The Christmas season
  syr: ܝܠܕܐ
tagline: Wise men worship, and the Holy Family flees to Egypt
standfirst: The wise men find the child, kneel and leave their gifts. That night Joseph is woken by an angel, and the family leaves for Egypt before dawn.
description: 'Readings for the First Sunday after Christmas, with Matthew 2:9–15, 19–23 explained: the wise men and the flight to Egypt. Reflection and question.'
hero_quote:
  text: When they saw the star, they rejoiced with exceedingly great joy.
  ref: Matthew 2:10
