    note: Rahab hides the spies sent to Jericho.
    printed: Joshua 2:1-6
  - kind: Old Testament
    kind_ml: പഴയനിയമം
    ref: Isaiah 49:13–21
    ml: യെശയ്യാവ് 49:13–21
