sunday_slug: second-sunday-after-new-sunday
is_sunday: true
name:
  en: Second Sunday after New Sunday
  ml: പുതുഞായറിനു ശേഷം രണ്ടാം ഞായർ
title_as_printed: Second Sunday after New Sunday
season:
  en: Kyomtho
  gloss: The Resurrection season
  syr: ܩܝܡܬܐ
tagline: “Do you love me?” Peter is asked three times
standfirst: After breakfast on the beach, Jesus turns to Peter. Three times Peter had denied him. Now, three times, Jesus asks him the same question.
description: Readings for the Second Sunday after New Sunday, with John 21:15–19, Jesus and Peter by the lake, explained in five scenes. Reflection and question.
hero_quote:
  text: Lord, you know everything. You know that I have affection for you.
  ref: John 21:17
