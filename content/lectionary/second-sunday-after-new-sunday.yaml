    main: true
one_minute:
  what_happens: 'Jesus asks Peter three times whether he loves him. Each time Peter says yes, and Jesus tells him to feed or care for his sheep. Peter is hurt by the third question. Jesus tells him how he will die, and says: follow me.'
  why_this_sunday: This continues last Sunday’s Gospel. The breakfast by the lake turns into Peter’s restoration.
  take_with_you: Jesus does not ask Peter to explain his failure. He asks if he loves him, and then gives him work to do.
readings_thread: Moses anoints Aaron and his sons to serve, and Rahab, an outsider, protects God’s people. Isaiah says even if a mother forgets her child, God will not forget. Peter and John refuse to stop speaking about Jesus.
key_verse:
  ref: John 21:15
  ml: 'അവർ പ്രാതൽ കഴിച്ചശേഷം യേശു ശിമോൻ പത്രൊസിനോടു: യോഹന്നാന്റെ മകനായ ശിമോനേ, നീ ഇവരിൽ അധികമായി എന്നെ സ്നേഹിക്കുന്നുവോ എന്നു ചോദിച്ചു. അതിന്നു അവൻ: ഉവ്വു, കർത്താവേ, എനിക്കു നിന്നോടു പ്രിയമുണ്ടു എന്നു നീ അറിയുന്നുവല്ലോ എന്നു പറഞ്ഞു. എന്റെ കുഞ്ഞാടുകളെ മേയ്ക്ക എന്നു അവൻ അവനോടു പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: So when they had eaten their breakfast, Jesus said to Simon Peter, “Simon, son of Jonah, do you love me more than these?” He said to him, “Yes, Lord; you know that I have affection for you.” He said to him, “Feed my lambs.”
  en_translation: World English Bible
scenes:
- verses: John 21:15
  title: More than these?
  text: 'After breakfast Jesus says: Simon, son of John, do you love me more than these? Yes, Lord, you know I love you. Feed my lambs.'
  easy_to_miss: Jesus calls him Simon, his old name, not Peter, the rock. He is starting again from the beginning.
- verses: John 21:16
  title: Tend my sheep
  text: 'A second time: Simon, son of John, do you love me? Yes, Lord, you know I love you. Take care of my sheep.'
  easy_to_miss: 'Lambs, then sheep: the young and the grown. Peter is to care for the whole flock.'
- verses: John 21:17
  title: Peter is hurt
  text: 'A third time: do you love me? Peter is grieved that he asks a third time. Lord, you know everything; you know that I love you. Feed my sheep.'
  easy_to_miss: Three denials beside a charcoal fire; three declarations of love beside another one.
- verses: John 21:18–19a
  title: When you are old
  text: 'When you were young you dressed yourself and went where you wanted. When you are old, someone else will dress you and lead you where you do not want to go. John explains: this showed the kind of death by which Peter would glorify God.'
  easy_to_miss: Tradition says Peter was crucified in Rome. John wrote after it had happened.
- verses: John 21:19b
  title: Follow me
  text: 'Then Jesus says to him: follow me.'
  easy_to_miss: By the same lake, “follow me” was the first call Peter heard (Mark 1:17). Now it is the last thing Jesus says to him in John.
people:
- name: Simon Peter
  ml: ശിമോൻ പത്രൊസ്
  role: The disciple who denied Jesus three times, now restored.
  name_meaning: Simon, “he has heard”; Peter, “rock”
- name: Jesus
  ml: യേശു
  role: The risen Lord, the Good Shepherd, handing his flock to Peter.
  name_meaning: “The Lord saves”
phrases:
- term: Feed my sheep
  explanation: Jesus called himself the Good Shepherd (John 10:11). Now he gives Peter a share in the same work.
- term: Love
  explanation: John uses two Greek words here, agapao and phileo. Interpreters differ on whether the change matters.
- term: Stretch out your hands
  explanation: Early Christians read this as a picture of crucifixion.
reflection:
  title_en: Three questions for three denials
  title_ml: മൂന്നു തള്ളിപ്പറച്ചിലിനു മൂന്നു ചോദ്യങ്ങൾ
  read_time: A three-minute read
  body: |-
    Peter must have dreaded this moment. Three times he had said he did not know Jesus. Now he was sitting by a fire with him again. Jesus could have asked why. He could have reminded him of the boasting at the Last Supper. Instead he asks a single question, three times: do you love me?

    The third time hurts. Peter knows what Jesus is doing, and he answers with everything he has left: Lord, you know everything. You know I love you. Each answer is met not with forgiveness in words but with a job. Feed my lambs. Look after my sheep. The failed disciple is trusted with the flock.

    When someone we love has let us down, it is hard not to make them explain. Jesus shows another way: ask about love, and then hand them something to do. Being trusted again heals in a way that words alone cannot. And for all of us, after every failure, the last word is the same: follow me.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Is there someone you need to trust again after they let you down? What would it take?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Give someone who has made a mistake a real responsibility this week, to show that you trust them.
  prayer: Lord Jesus, you know everything; you know that we love you, even when we fail you. Restore us as you restored Peter, give us work to do for your flock, and teach us to follow you to the end. Amen.
translations:
  ml:
    name:
      en: പുതുഞായറിനു ശേഷം രണ്ടാം ഞായർ
      ml: Second Sunday after New Sunday
    season:
      en: ക്യംതാ
      gloss: ഉയിർപ്പുകാലം
    tagline: “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” പത്രൊസിനോടു മൂന്നു പ്രാവശ്യം
    standfirst: കടല്ക്കരയിലെ പ്രാതലിനു ശേഷം യേശു പത്രൊസിന്റെ നേരെ തിരിയുന്നു. പത്രൊസ് അവനെ മൂന്നു പ്രാവശ്യം തള്ളിപ്പറഞ്ഞിരുന്നു. ഇപ്പോൾ മൂന്നു പ്രാവശ്യം യേശു അവനോട് ഒരേ ചോദ്യം ചോദിക്കുന്നു.
    description: 'പുതുഞായറിനു ശേഷം രണ്ടാം ഞായറിലെ വായനകൾ, കടല്ക്കരയിൽ യേശുവും പത്രൊസും: യോഹന്നാൻ 21:15–19 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: 'തന്നെ സ്നേഹിക്കുന്നുവോ എന്ന് യേശു പത്രൊസിനോടു മൂന്നു പ്രാവശ്യം ചോദിക്കുന്നു. ഓരോ തവണയും പത്രൊസ് ഉവ്വ് എന്നു പറയുന്നു; തന്റെ ആടുകളെ മേയ്ക്കുവാനോ പാലിക്കുവാനോ യേശു അവനോടു പറയുന്നു. മൂന്നാമത്തെ ചോദ്യം പത്രൊസിനെ ദുഃഖിപ്പിക്കുന്നു. അവൻ എങ്ങനെ മരിക്കുമെന്ന് യേശു പറയുന്നു; എന്നിട്ട്: എന്നെ അനുഗമിക്ക.'
      why_this_sunday: കഴിഞ്ഞ ഞായറിലെ സുവിശേഷത്തിന്റെ തുടർച്ചയാണിത്. കടല്ക്കരയിലെ പ്രാതൽ പത്രൊസിന്റെ പുനഃസ്ഥാപനമായി മാറുന്നു.
      take_with_you: തന്റെ പരാജയം വിശദീകരിക്കാൻ യേശു പത്രൊസിനോട് ആവശ്യപ്പെടുന്നില്ല. തന്നെ സ്നേഹിക്കുന്നുവോ എന്നു ചോദിക്കുന്നു; എന്നിട്ട് ചെയ്യാൻ ഒരു ജോലി നല്കുന്നു.
    readings_thread: ശുശ്രൂഷ ചെയ്യുവാൻ മോശെ അഹരോനെയും പുത്രന്മാരെയും അഭിഷേകം ചെയ്യുന്നു; പുറത്തുനിന്നുള്ളവളായ രാഹാബ് ദൈവജനത്തെ സംരക്ഷിക്കുന്നു. ഒരു അമ്മ തന്റെ കുഞ്ഞിനെ മറന്നാലും ദൈവം മറക്കുകയില്ല എന്നു യെശയ്യാവു പറയുന്നു. യേശുവിനെക്കുറിച്ചു സംസാരിക്കുന്നതു നിർത്താൻ പത്രൊസും യോഹന്നാനും വിസമ്മതിക്കുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 21:15
      title: ഇവരിൽ അധികമായി?
      text: 'പ്രാതലിനു ശേഷം യേശു പറയുന്നു: യോഹന്നാന്റെ മകനായ ശിമോനേ, നീ ഇവരിൽ അധികമായി എന്നെ സ്നേഹിക്കുന്നുവോ? ഉവ്വു, കർത്താവേ, എനിക്കു നിന്നോടു പ്രിയമുണ്ടു എന്നു നീ അറിയുന്നുവല്ലോ. എന്റെ കുഞ്ഞാടുകളെ മേയ്ക്ക.'
      easy_to_miss: യേശു അവനെ പാറ എന്നർത്ഥമുള്ള പത്രൊസ് എന്നല്ല, അവന്റെ പഴയ പേരായ ശിമോൻ എന്നു വിളിക്കുന്നു. അവൻ ആദ്യംമുതൽ വീണ്ടും തുടങ്ങുകയാണ്.
    - verses: യോഹന്നാൻ 21:16
      title: എന്റെ ആടുകളെ പാലിക്ക
      text: 'രണ്ടാമതും: യോഹന്നാന്റെ മകനായ ശിമോനേ, നീ എന്നെ സ്നേഹിക്കുന്നുവോ? ഉവ്വു കർത്താവേ, എനിക്കു നിന്നോടു പ്രിയമുണ്ടു എന്നു നീ അറിയുന്നുവല്ലോ. എന്റെ ആടുകളെ പാലിക്ക.'
      easy_to_miss: 'കുഞ്ഞാടുകൾ, പിന്നെ ആടുകൾ: ചെറിയവരും വളർന്നവരും. ആട്ടിൻകൂട്ടത്തെ മുഴുവനും പത്രൊസ് പരിപാലിക്കണം.'
    - verses: യോഹന്നാൻ 21:17
      title: പത്രൊസ് ദുഃഖിച്ചു
      text: 'മൂന്നാമതും: നിനക്കു എന്നോടു പ്രിയമുണ്ടോ? മൂന്നാമതും ചോദിക്കയാൽ പത്രൊസ് ദുഃഖിക്കുന്നു. കർത്താവേ, നീ സകലവും അറിയുന്നു; എനിക്കു നിന്നോടു പ്രിയമുണ്ടു എന്നും നീ അറിയുന്നു. എന്റെ ആടുകളെ മേയ്ക്ക.'
      easy_to_miss: ഒരു കനൽത്തീയുടെ അരികിൽ മൂന്നു തള്ളിപ്പറച്ചിൽ; മറ്റൊന്നിന്റെ അരികിൽ സ്നേഹത്തിന്റെ മൂന്ന് ഏറ്റുപറച്ചിൽ.
    - verses: യോഹന്നാൻ 21:18–19a
      title: വയസ്സനായശേഷം
      text: നീ യൗവനക്കാരൻ ആയിരുന്നപ്പോൾ നീ തന്നേ അര കെട്ടി ഇഷ്ടമുള്ളേടത്തു നടന്നു; വയസ്സനായശേഷമോ മറ്റൊരുത്തൻ നിന്റെ അര കെട്ടി നിനക്കു ഇഷ്ടമില്ലാത്ത ഇടത്തേക്കു നിന്നെ കൊണ്ടുപോകും. ഇന്നവിധം മരണംകൊണ്ട് അവൻ ദൈവത്തെ മഹത്വപ്പെടുത്തും എന്നാണ് ഇതു സൂചിപ്പിച്ചത് എന്നു യോഹന്നാൻ വിശദീകരിക്കുന്നു.
      easy_to_miss: പത്രൊസ് റോമിൽ ക്രൂശിക്കപ്പെട്ടു എന്നു പാരമ്പര്യം പറയുന്നു. അതു സംഭവിച്ചശേഷമാണ് യോഹന്നാൻ എഴുതിയത്.
    - verses: യോഹന്നാൻ 21:19b
      title: എന്നെ അനുഗമിക്ക
      text: 'ഇതു പറഞ്ഞിട്ടു യേശു അവനോടു പറയുന്നു: എന്നെ അനുഗമിക്ക.'
      easy_to_miss: ഇതേ കടല്ക്കരയിൽവെച്ച് “എന്നെ അനുഗമിക്ക” എന്നതായിരുന്നു പത്രൊസ് കേട്ട ആദ്യത്തെ വിളി (മർക്കൊസ് 1:17). ഇപ്പോൾ യോഹന്നാനിൽ യേശു അവനോടു പറയുന്ന അവസാനവാക്കും അതുതന്നെ.
    people:
    - name: ശിമോൻ പത്രൊസ്
      role: യേശുവിനെ മൂന്നു പ്രാവശ്യം തള്ളിപ്പറഞ്ഞ ശിഷ്യൻ; ഇപ്പോൾ പുനഃസ്ഥാപിക്കപ്പെടുന്നു.
      name_meaning: ശിമോൻ, “അവൻ കേട്ടു”; പത്രൊസ്, “പാറ”
      ml: Simon Peter
    - name: യേശു
      role: ഉയിർത്തെഴുന്നേറ്റ കർത്താവ്, നല്ല ഇടയൻ; തന്റെ ആട്ടിൻകൂട്ടത്തെ പത്രൊസിനെ ഏല്പിക്കുന്നു.
      name_meaning: “കർത്താവു രക്ഷിക്കുന്നു”
      ml: Jesus
    phrases:
    - term: എന്റെ ആടുകളെ മേയ്ക്ക
      explanation: യേശു തന്നെത്താൻ നല്ല ഇടയൻ എന്നു വിളിച്ചു (യോഹന്നാൻ 10:11). ഇപ്പോൾ അതേ വേലയിൽ പത്രൊസിന് ഒരു പങ്കു നല്കുന്നു.
    - term: സ്നേഹം
      explanation: യോഹന്നാൻ ഇവിടെ അഗപ്പാവോ, ഫിലെയോ എന്നീ രണ്ടു ഗ്രീക്ക് വാക്കുകൾ ഉപയോഗിക്കുന്നു; 1910 വിവർത്തനം അവയെ ‘സ്നേഹിക്കുന്നുവോ’, ‘പ്രിയമുണ്ടോ’ എന്നു വേർതിരിക്കുന്നു. ഈ മാറ്റത്തിനു പ്രാധാന്യമുണ്ടോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കു ഭിന്നാഭിപ്രായമുണ്ട്.
    - term: കൈ നീട്ടുക
      explanation: ക്രൂശീകരണത്തിന്റെ ഒരു ചിത്രമായി ആദിമ ക്രിസ്ത്യാനികൾ ഇതിനെ വായിച്ചു.
    reflection:
      title_en: മൂന്നു തള്ളിപ്പറച്ചിലിനു മൂന്നു ചോദ്യങ്ങൾ
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        പത്രൊസ് ഈ നിമിഷത്തെ ഭയപ്പെട്ടിരിക്കണം. യേശുവിനെ അറിയില്ല എന്ന് അവൻ മൂന്നു പ്രാവശ്യം പറഞ്ഞിരുന്നു. ഇപ്പോൾ അവൻ വീണ്ടും അവനോടൊപ്പം ഒരു തീയുടെ അരികിൽ ഇരിക്കുന്നു. എന്തുകൊണ്ട് എന്നു യേശുവിനു ചോദിക്കാമായിരുന്നു. അന്ത്യഅത്താഴത്തിലെ വീമ്പുപറച്ചിൽ ഓർമ്മിപ്പിക്കാമായിരുന്നു. പകരം അവൻ ഒരൊറ്റ ചോദ്യം മൂന്നു പ്രാവശ്യം ചോദിക്കുന്നു: നീ എന്നെ സ്നേഹിക്കുന്നുവോ?

        മൂന്നാമത്തേതു വേദനിപ്പിക്കുന്നു. യേശു ചെയ്യുന്നത് എന്താണെന്നു പത്രൊസിന് അറിയാം; തന്നിൽ ബാക്കിയുള്ളതെല്ലാംകൊണ്ട് അവൻ ഉത്തരം പറയുന്നു: കർത്താവേ, നീ സകലവും അറിയുന്നു; എനിക്കു നിന്നോടു പ്രിയമുണ്ടു എന്നും നീ അറിയുന്നു. ഓരോ ഉത്തരത്തിനും മറുപടി വാക്കുകളിലുള്ള ക്ഷമയല്ല, ഒരു ജോലിയാണ്. എന്റെ കുഞ്ഞാടുകളെ മേയ്ക്ക. എന്റെ ആടുകളെ പാലിക്ക. പരാജയപ്പെട്ട ശിഷ്യനെ ആട്ടിൻകൂട്ടം ഏല്പിക്കുന്നു.

        നാം സ്നേഹിക്കുന്ന ഒരാൾ നമ്മെ നിരാശപ്പെടുത്തുമ്പോൾ, അവരെക്കൊണ്ടു വിശദീകരിപ്പിക്കാതിരിക്കാൻ പ്രയാസമാണ്. യേശു മറ്റൊരു വഴി കാണിക്കുന്നു: സ്നേഹത്തെക്കുറിച്ചു ചോദിക്കുക, എന്നിട്ട് ചെയ്യാൻ എന്തെങ്കിലും ഏല്പിക്കുക. വീണ്ടും വിശ്വസിക്കപ്പെടുന്നതു വാക്കുകൾക്കു മാത്രം കഴിയാത്ത വിധത്തിൽ സൌഖ്യമാക്കുന്നു. നമുക്കെല്ലാവർക്കും, ഓരോ പരാജയത്തിനും ശേഷം, അവസാനവാക്ക് ഒന്നുതന്നെ: എന്നെ അനുഗമിക്ക.
      title_ml: Three questions for three denials
    week:
      question: നിങ്ങളെ നിരാശപ്പെടുത്തിയ ശേഷം വീണ്ടും വിശ്വസിക്കേണ്ട ആരെങ്കിലും ഉണ്ടോ? അതിന് എന്തു വേണ്ടിവരും?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: തെറ്റു പറ്റിയ ഒരാൾക്ക് ഈ ആഴ്ച യഥാർത്ഥമായ ഒരു ഉത്തരവാദിത്വം ഏല്പിക്കുക; നിങ്ങൾ അവരെ വിശ്വസിക്കുന്നു എന്നു കാണിക്കാൻ.
      prayer: കർത്താവായ യേശുവേ, നീ സകലവും അറിയുന്നു; ഞങ്ങൾ നിന്നെ കൈവിടുമ്പോഴും ഞങ്ങൾക്കു നിന്നോടു പ്രിയമുണ്ടെന്നു നീ അറിയുന്നു. പത്രൊസിനെപ്പോലെ ഞങ്ങളെയും പുനഃസ്ഥാപിക്കേണമേ; നിന്റെ ആട്ടിൻകൂട്ടത്തിനുവേണ്ടി ഞങ്ങൾക്കു വേല തരേണമേ; അവസാനത്തോളം നിന്നെ അനുഗമിക്കാൻ ഞങ്ങളെ പഠിപ്പിക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 6:16–29
        ml: യോഹന്നാൻ 6:16–29
        note: യേശു കടലിന്മീതെ നടക്കുന്നു; അവൻ അയച്ചവനിൽ വിശ്വസിക്കുന്നതാണ് ദൈവത്തിന്റെ പ്രവൃത്തി.
        printed: St. John 6:16-29
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 14:22–33
        ml: മത്തായി 14:22–33
        note: പത്രൊസ് വെള്ളത്തിന്മീതെ നടക്കുന്നു, മുങ്ങിത്തുടങ്ങുന്നു; യേശു അവനെ പിടിക്കുന്നു.
        printed: St. Matthew 14:22-33
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Exodus 40:1–16
        ml: പുറപ്പാട് 40:1–16
        note: മോശെ സമാഗമനകൂടാരം സ്ഥാപിച്ച്, ശുശ്രൂഷയ്ക്കായി അഹരോനെയും പുത്രന്മാരെയും അഭിഷേകം ചെയ്യുന്നു.
        printed: Exodus 40:1-16
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Joshua 2:1–6
        ml: യോശുവ 2:1–6
        note: യെരീഹോവിലേക്ക് അയച്ച ഒറ്റുകാരെ രാഹാബ് ഒളിപ്പിക്കുന്നു.
        printed: Joshua 2:1-6
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 49:13–21
        ml: യെശയ്യാവ് 49:13–21
        note: ഒരു സ്ത്രീ തന്റെ മുലകുടിക്കുന്ന കുഞ്ഞിനെ മറക്കുമോ? അവർ മറന്നാലും ഞാൻ നിന്നെ മറക്കയില്ല.
        printed: Isaiah 49:13-21
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 4:8–21
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 4:8–21
        note: 'ന്യായാധിപസംഘത്തിനു മുമ്പിൽ പത്രൊസും യോഹന്നാനും: ഞങ്ങൾ കണ്ടതു പറയാതിരിപ്പാൻ ഞങ്ങൾക്കു കഴിയുന്നതല്ല.'
        printed: Acts 4:8-21
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Hebrews 3:1–13
        ml: എബ്രായർ 3:1–13
        note: ക്രിസ്തു ദൈവഭവനത്തിന്മേൽ വിശ്വസ്തനാണ്; ദിനംപ്രതി അന്യോന്യം പ്രബോധിപ്പിൻ.
        printed: Hebrews 3:1-13
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 21:15–19
        ml: യോഹന്നാൻ 21:15–19
        note: നീ എന്നെ സ്നേഹിക്കുന്നുവോ? എന്റെ ആടുകളെ മേയ്ക്ക. എന്നെ അനുഗമിക്ക. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. John 21:15-19
        main: true
    key_verse:
      ref: യോഹന്നാൻ 21:15
    hero_quote:
      text: കർത്താവേ, നീ സകലവും അറിയുന്നു; എനിക്കു നിന്നോടു പ്രിയമുണ്ടു എന്നും നീ അറിയുന്നു.
      ref: യോഹന്നാൻ 21:17
sources:
