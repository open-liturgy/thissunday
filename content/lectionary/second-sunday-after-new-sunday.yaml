    kind_ml: സുവിശേഷം
    ref: John 6:16–29
    ml: യോഹന്നാൻ 6:16–29
    note: Jesus walks on the sea; the work of God is to believe in the one he has sent.
    printed: St. John 6:16-29
  morning:
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: Matthew 14:22–33
    ml: മത്തായി 14:22–33
