    note: Christ is faithful over God’s house; encourage one another every day.
    printed: Hebrews 3:1-13
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: John 21:15–19
    ml: യോഹന്നാൻ 21:15–19
