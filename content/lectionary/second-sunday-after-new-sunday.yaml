phrases:
- term: Feed my sheep
  explanation: Jesus called himself the Good Shepherd (John 10:11). Now he gives Peter a share in the same work.
- term: Love
  explanation: John uses two Greek words here, agapao and phileo. Interpreters differ on whether the change matters.
- term: Stretch out your hands
  explanation: Early Christians read this as a picture of crucifixion.
reflection:
  title_en: Three questions for three denials
  title_ml: '[TITLE ML]'
  read_time: A three-minute read
  body: |-
    Peter must have dreaded this moment. Three times he had said he did not know Jesus. Now he was sitting by a fire with him again. Jesus could have asked why. He could have reminded him of the boasting at the Last Supper. Instead he asks a single question, three times: do you love me?

    The third time hurts. Peter knows what Jesus is doing, and he answers with everything he has left: Lord, you know everything. You know I love you. Each answer is met not with forgiveness in words but with a job. Feed my lambs. Look after my sheep. The failed disciple is trusted with the flock.

    When someone we love has let us down, it is hard not to make them explain. Jesus shows another way: ask about love, and then hand them something to do. Being trusted again heals in a way that words alone cannot. And for all of us, after every failure, the last word is the same: follow me.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Is there someone you need to trust again after they let you down? What would it take?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Give someone who has made a mistake a real responsibility this week, to show that you trust them.
  prayer: Lord Jesus, you know everything; you know that we love you, even when we fail you. Restore us as you restored Peter, give us work to do for your flock, and teach us to follow you to the end. Amen.
