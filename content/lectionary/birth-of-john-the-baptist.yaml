    hero_quote:
      text: 'അവൻ ഒരു എഴുത്തു പലക ചോദിച്ചു: അവന്റെ പേർ യോഹന്നാൻ എന്നു എഴുതി; എല്ലാവരും ആശ്ചര്യപ്പെട്ടു.'
