phrases:
- term: Eighth day
  explanation: Jewish boys were circumcised and named on the eighth day after birth, as God commanded Abraham (Genesis 17:12).
- term: Benedictus
  explanation: The Latin first word of Zechariah’s song, “Blessed”. It is prayed in the morning in many churches.
- term: Horn of salvation
  explanation: A horn was a picture of strength. Zechariah means God has raised up a strong saviour from David’s house.
reflection:
  title_en: What will this child be?
  title_ml: ഈ പൈതൽ എന്താകും?
  read_time: A three-minute read
  body: |-
    Everyone in the hill country asks the same question about John: what will this child be? It is a question parents ask over every cradle, usually with hope and some fear. Zechariah and Elizabeth already know part of the answer, because Gabriel told them. Their son will go ahead of the Lord.

    The family wants to call him Zechariah, after his father. It is a kind thing to want, and it is also a way of saying he will be like us. Elizabeth and Zechariah refuse. His name is John, a name from God, because his life belongs to God’s plan before it belongs to the family’s.

    On Children’s Day this is worth holding on to. Our children are given to us, but they are not ours to shape into copies of ourselves. The best thing a home can do is what Zechariah and Elizabeth did: love the child, give him to God, and let him grow strong in spirit, even if that leads somewhere unexpected.
