one_minute:
  what_happens: Elizabeth gives birth to a son. At his circumcision the relatives want to call him Zechariah, but Elizabeth says John. Zechariah writes “His name is John”, his voice returns, and he praises God in the Benedictus.
  why_this_sunday: The promise made to Zechariah three weeks ago comes true. The Church also keeps this Sunday as Children’s Day.
  take_with_you: Zechariah’s first words after nine months of silence were praise. Waiting had changed him.
readings_thread: Isaac is born to Sarah in old age, the baby Moses is saved from the river, and Hannah gives Samuel back to God. The psalm calls children a gift from the Lord, and Ephesians and Colossians speak to children and parents.
key_verse:
  ref: Luke 1:76
  ml: നീയോ പൈതലേ, അത്യുന്നതന്റെ പ്രവാചകൻ എന്നു വിളിക്കപ്പെടും. കർത്താവിന്റെ വഴി ഒരുക്കുവാനും…
  ml_translation: Sathyavedapusthakam, 1910
  en: And you, child, will be called a prophet of the Most High; for you will go before the face of the Lord to prepare his ways,
  en_translation: World English Bible
scenes:
- verses: Luke 1:57–58
  title: The neighbours rejoice
  text: Elizabeth gives birth to a son. Her neighbours and relatives hear how the Lord has shown her great mercy, and they rejoice with her.
  easy_to_miss: Gabriel promised that many would rejoice at his birth (Luke 1:14). The first to do so are the neighbours.
- verses: Luke 1:59–61
  title: What will he be called?
  text: 'On the eighth day they come to circumcise the child and want to name him Zechariah after his father. Elizabeth says no: he will be called John. But no one in the family has that name.'
  easy_to_miss: Nobody told Elizabeth the name in the text. Zechariah must have written it down for her in the months of silence.
- verses: Luke 1:62–64
  title: His name is John
  text: 'They make signs to Zechariah. He asks for a writing tablet and writes: “His name is John.” At once his mouth is opened and he begins to praise God.'
  easy_to_miss: They make signs to him as though he were deaf too. His silence had been longer and lonelier than we might think.
- verses: Luke 1:65–66
  title: What will this child be?
  text: 'Fear comes over the whole hill country and everyone talks about it. People ask: what then will this child be? The Lord’s hand is with him.'
  easy_to_miss: Every child is born with this question hanging over them. Here the whole region asks it out loud.
- verses: Luke 1:67–80
  title: Zechariah’s song
  text: Filled with the Holy Spirit, Zechariah blesses God for visiting his people, and tells his son he will be the prophet who prepares the Lord’s way. The child grows strong in spirit and lives in the wilderness.
  easy_to_miss: Zechariah sings mostly about someone else’s son. Only near the end does he turn to John, and then to say he will go ahead of another.
people:
- name: John
  ml: യോഹന്നാൻ
  role: The newborn son, who will prepare the way for Christ.
  name_meaning: “The Lord is gracious”
- name: Zechariah
  ml: സെഖര്യാവ്
  role: His father, silent since the Temple, now able to speak.
  name_meaning: “The Lord remembers”
- name: Elizabeth
  ml: എലീശബെത്ത്
  role: His mother, who insists on the name John.
  name_meaning: “My God is an oath”
phrases:
- term: Eighth day
  explanation: Jewish boys were circumcised and named on the eighth day after birth, as God commanded Abraham (Genesis 17:12).
- term: Benedictus
  explanation: The Latin first word of Zechariah’s song, “Blessed”. It is prayed in the morning in many churches.
- term: Horn of salvation
  explanation: A horn was a picture of strength. Zechariah means God has raised up a strong saviour from David’s house.
reflection:
  title_en: What will this child be?
  title_ml: ഈ പൈതൽ എന്താകും?
  read_time: A three-minute read
  body: |-
    Everyone in the hill country asks the same question about John: what will this child be? It is a question parents ask over every cradle, usually with hope and some fear. Zechariah and Elizabeth already know part of the answer, because Gabriel told them. Their son will go ahead of the Lord.

    The family wants to call him Zechariah, after his father. It is a kind thing to want, and it is also a way of saying he will be like us. Elizabeth and Zechariah refuse. His name is John, a name from God, because his life belongs to God’s plan before it belongs to the family’s.

    On Children’s Day this is worth holding on to. Our children are given to us, but they are not ours to shape into copies of ourselves. The best thing a home can do is what Zechariah and Elizabeth did: love the child, give him to God, and let him grow strong in spirit, even if that leads somewhere unexpected.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Do you know why you were given your name? Ask someone at the table to tell the story.
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: 'Parents: tell each child one thing you have seen God doing in their life this year. Children: thank a parent for one specific thing.'
  prayer: Blessed are you, Lord God, for you have visited your people. Bless the children of our home and our Church. Let your hand be with them, and let them grow strong in spirit and prepare your way. Amen.
translations:
  ml:
    name:
      en: യോഹന്നാൻ സ്നാപകന്റെ ജനനത്തിന്റെ ഞായർ
      ml: Birth of John the Baptist
    season:
      en: സൂബോറോ
      gloss: അറിയിപ്പുകളുടെ കാലം
    also_kept_as: ബാലദിനം
    also_kept_as_note: മർക്കൊസ് 10:13–16 കാണുക
    tagline: അവന്റെ പേർ യോഹന്നാൻ; സെഖര്യാവ് വീണ്ടും സംസാരിക്കുന്നു
    standfirst: എലീശബെത്തിന്റെ മകൻ ജനിക്കുന്നു; അയല്ക്കാർ ആഘോഷിക്കാൻ വരുന്നു. എല്ലാവരും അവനെ അപ്പന്റെ പേരു വിളിക്കാൻ ആഗ്രഹിക്കുമ്പോൾ, മിണ്ടാനാവാത്ത ഒരു വൃദ്ധപുരോഹിതൻ ഒരു എഴുത്തുപലക ചോദിക്കുന്നു.
    description: യോഹന്നാൻ സ്നാപകന്റെ ജനനത്തിന്റെ ഞായറിലെ വായനകൾ, ലൂക്കൊസ് 1:57–80 അഞ്ചു രംഗങ്ങളിൽ, ഒരു ധ്യാനം, കുടുംബത്തിനായി ഒരു ചോദ്യം.
    one_minute:
      what_happens: എലീശബെത്ത് ഒരു മകനെ പ്രസവിക്കുന്നു. പരിച്ഛേദനദിവസം ബന്ധുക്കൾ അവനെ സെഖര്യാവ് എന്നു വിളിക്കാൻ ആഗ്രഹിക്കുന്നു; എലീശബെത്ത് യോഹന്നാൻ എന്നു പറയുന്നു. “അവന്റെ പേർ യോഹന്നാൻ” എന്ന് സെഖര്യാവ് എഴുതുന്നു; അവന്റെ നാവ് അഴിയുന്നു; അവൻ ദൈവത്തെ വാഴ്ത്തിപ്പാടുന്നു.
      why_this_sunday: മൂന്നാഴ്ച മുമ്പ് സെഖര്യാവിനു നല്കിയ വാഗ്ദാനം നിറവേറുന്നു. സഭ ഈ ഞായറാഴ്ച ബാലദിനമായും ആചരിക്കുന്നു.
      take_with_you: ഒമ്പതു മാസത്തെ മൌനത്തിനു ശേഷം സെഖര്യാവിന്റെ ആദ്യവാക്കുകൾ സ്തുതിയായിരുന്നു. കാത്തിരിപ്പ് അവനെ മാറ്റിയിരുന്നു.
    readings_thread: വാർദ്ധക്യത്തിൽ സാറായ്ക്ക് യിസ്ഹാക്ക് ജനിക്കുന്നു; കുഞ്ഞായ മോശെ നദിയിൽനിന്നു രക്ഷിക്കപ്പെടുന്നു; ഹന്നാ ശമൂവേലിനെ ദൈവത്തിനു തിരികെ കൊടുക്കുന്നു. മക്കൾ കർത്താവിന്റെ ദാനമെന്ന് സങ്കീർത്തനം പറയുന്നു; എഫെസ്യരും കൊലൊസ്സ്യരും മക്കളോടും മാതാപിതാക്കളോടും സംസാരിക്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 1:57–58
      title: അയല്ക്കാർ സന്തോഷിക്കുന്നു
      text: എലീശബെത്ത് ഒരു മകനെ പ്രസവിക്കുന്നു. കർത്താവ് അവളോടു വലിയ കരുണ കാണിച്ചതു കേട്ട് അയല്ക്കാരും ബന്ധുക്കളും അവളോടുകൂടെ സന്തോഷിക്കുന്നു.
      easy_to_miss: അവന്റെ ജനനത്തിൽ അനേകർ സന്തോഷിക്കും എന്ന് ഗബ്രിയേൽ വാഗ്ദാനം ചെയ്തിരുന്നു (ലൂക്കൊസ് 1:14). ആദ്യം സന്തോഷിക്കുന്നത് അയല്ക്കാരാണ്.
    - verses: ലൂക്കൊസ് 1:59–61
      title: അവനെ എന്തു വിളിക്കും?
      text: 'എട്ടാം ദിവസം അവർ ശിശുവിനെ പരിച്ഛേദന ചെയ്യാൻ വന്ന് അപ്പന്റെ പേരുപോലെ സെഖര്യാവ് എന്നു വിളിക്കാൻ ഭാവിക്കുന്നു. എലീശബെത്ത് പറയുന്നു: അല്ല, യോഹന്നാൻ എന്നു വിളിക്കേണം. എന്നാൽ കുടുംബത്തിൽ ആർക്കും ആ പേരില്ല.'
      easy_to_miss: പേര് എലീശബെത്തിനോട് ആരും പറഞ്ഞതായി വേദഭാഗത്തില്ല. മൌനത്തിന്റെ മാസങ്ങളിൽ സെഖര്യാവ് അത് അവൾക്ക് എഴുതിക്കൊടുത്തിരിക്കണം.
    - verses: ലൂക്കൊസ് 1:62–64
      title: അവന്റെ പേർ യോഹന്നാൻ
      text: 'അവർ സെഖര്യാവിനോട് ആംഗ്യം കാണിക്കുന്നു. അവൻ ഒരു എഴുത്തുപലക ചോദിച്ച് എഴുതുന്നു: “അവന്റെ പേർ യോഹന്നാൻ.” ഉടനെ അവന്റെ വായ് തുറക്കുന്നു; അവൻ ദൈവത്തെ സ്തുതിച്ചുതുടങ്ങുന്നു.'
      easy_to_miss: അവൻ ബധിരനുമാണെന്നപോലെ അവർ അവനോട് ആംഗ്യം കാണിക്കുന്നു. നാം കരുതുന്നതിലും നീണ്ടതും ഏകാന്തവുമായിരുന്നു അവന്റെ മൌനം.
    - verses: ലൂക്കൊസ് 1:65–66
      title: ഈ പൈതൽ എന്താകും?
      text: 'മലനാട്ടിൽ എങ്ങും ഭയം ഉണ്ടാകുന്നു; എല്ലാവരും ഇതിനെക്കുറിച്ചു സംസാരിക്കുന്നു. ജനങ്ങൾ ചോദിക്കുന്നു: ഈ പൈതൽ എന്താകും? കർത്താവിന്റെ കൈ അവനോടുകൂടെ ഉണ്ടായിരുന്നു.'
      easy_to_miss: ഓരോ കുഞ്ഞും ഈ ചോദ്യം തലയ്ക്കു മുകളിൽ തൂങ്ങിക്കൊണ്ടാണ് ജനിക്കുന്നത്. ഇവിടെ ഒരു പ്രദേശം മുഴുവൻ അത് ഉറക്കെ ചോദിക്കുന്നു.
    - verses: ലൂക്കൊസ് 1:67–80
      title: സെഖര്യാവിന്റെ പാട്ട്
      text: പരിശുദ്ധാത്മാവു നിറഞ്ഞ്, തന്റെ ജനത്തെ സന്ദർശിച്ചതിന് സെഖര്യാവ് ദൈവത്തെ വാഴ്ത്തുന്നു; കർത്താവിന്റെ വഴി ഒരുക്കുന്ന പ്രവാചകൻ നീ ആകും എന്ന് മകനോടു പറയുന്നു. പൈതൽ ആത്മാവിൽ ബലപ്പെട്ടു വളർന്ന് മരുഭൂമിയിൽ പാർക്കുന്നു.
      easy_to_miss: സെഖര്യാവ് ഏറെയും പാടുന്നത് മറ്റൊരാളുടെ മകനെക്കുറിച്ചാണ്. അവസാനത്തോടടുത്തു മാത്രമേ അവൻ യോഹന്നാനിലേക്കു തിരിയുന്നുള്ളൂ; അതും, അവൻ മറ്റൊരുവനു മുമ്പായി പോകും എന്നു പറയാൻ.
    people:
    - name: യോഹന്നാൻ
      role: ക്രിസ്തുവിനു വഴി ഒരുക്കാനിരിക്കുന്ന നവജാതശിശു.
      name_meaning: “കർത്താവ് കൃപയുള്ളവൻ”
      ml: John
    - name: സെഖര്യാവ്
      role: അവന്റെ അപ്പൻ; ദൈവാലയത്തിൽവെച്ചുമുതൽ മൌനിയായിരുന്നവൻ, ഇപ്പോൾ സംസാരിക്കാൻ കഴിയുന്നു.
      name_meaning: “കർത്താവ് ഓർക്കുന്നു”
      ml: Zechariah
    - name: എലീശബെത്ത്
      role: അവന്റെ അമ്മ; യോഹന്നാൻ എന്ന പേരിൽ ഉറച്ചുനില്ക്കുന്നവൾ.
      name_meaning: “എന്റെ ദൈവം ഒരു ആണയാകുന്നു”
      ml: Elizabeth
    phrases:
    - term: എട്ടാം ദിവസം
      explanation: ദൈവം അബ്രാഹാമിനോടു കല്പിച്ചതുപോലെ, യെഹൂദബാലന്മാരെ ജനിച്ച് എട്ടാം ദിവസം പരിച്ഛേദന ചെയ്ത് പേരിട്ടിരുന്നു (ഉല്പത്തി 17:12).
    - term: ബെനഡിക്ടസ്
      explanation: സെഖര്യാവിന്റെ പാട്ടിലെ ആദ്യവാക്കിന്റെ ലത്തീൻ രൂപം, “വാഴ്ത്തപ്പെട്ടവൻ”. പല സഭകളിലും ഇതു പ്രഭാതപ്രാർത്ഥനയിൽ ചൊല്ലുന്നു.
    - term: രക്ഷയുടെ കൊമ്പ്
      explanation: കൊമ്പ് ബലത്തിന്റെ ചിത്രമായിരുന്നു. ദാവീദിന്റെ ഗൃഹത്തിൽനിന്ന് ദൈവം ബലമുള്ള ഒരു രക്ഷകനെ എഴുന്നേല്പിച്ചിരിക്കുന്നു എന്നാണ് സെഖര്യാവ് പറയുന്നത്.
    reflection:
      title_en: ഈ പൈതൽ എന്താകും?
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        മലനാട്ടിലെ എല്ലാവരും യോഹന്നാനെക്കുറിച്ച് ഒരേ ചോദ്യം ചോദിക്കുന്നു: ഈ പൈതൽ എന്താകും? ഓരോ തൊട്ടിലിനു മുകളിലും മാതാപിതാക്കൾ ചോദിക്കുന്ന ചോദ്യമാണിത്; സാധാരണ പ്രത്യാശയോടെയും അല്പം ഭയത്തോടെയും. സെഖര്യാവിനും എലീശബെത്തിനും ഉത്തരത്തിന്റെ ഒരു ഭാഗം ഇതിനകം അറിയാം; ഗബ്രിയേൽ പറഞ്ഞിരുന്നു. അവരുടെ മകൻ കർത്താവിനു മുമ്പായി നടക്കും.

        അപ്പന്റെ പേരിൽ അവനെ സെഖര്യാവ് എന്നു വിളിക്കാനാണ് കുടുംബത്തിന്റെ ആഗ്രഹം. അതൊരു സ്നേഹമുള്ള ആഗ്രഹമാണ്; അവൻ നമ്മെപ്പോലെയാകും എന്നു പറയുന്ന ഒരു രീതിയുമാണ്. എലീശബെത്തും സെഖര്യാവും അതു നിരസിക്കുന്നു. അവന്റെ പേർ യോഹന്നാൻ; ദൈവത്തിൽനിന്നുള്ള ഒരു പേര്. കാരണം അവന്റെ ജീവിതം കുടുംബത്തിന്റെ പദ്ധതിക്കു മുമ്പേ ദൈവത്തിന്റെ പദ്ധതിക്കുള്ളതാണ്.

        ബാലദിനത്തിൽ ഇത് ഓർത്തുവെക്കേണ്ടതാണ്. നമ്മുടെ മക്കൾ നമുക്കു നല്കപ്പെട്ടവരാണ്; എങ്കിലും നമ്മുടെ തന്നെ പകർപ്പുകളായി രൂപപ്പെടുത്താനുള്ളവരല്ല. ഒരു ഭവനത്തിനു ചെയ്യാവുന്ന ഏറ്റവും നല്ല കാര്യം സെഖര്യാവും എലീശബെത്തും ചെയ്തതാണ്: കുഞ്ഞിനെ സ്നേഹിക്കുക, അവനെ ദൈവത്തിനു കൊടുക്കുക, അവൻ ആത്മാവിൽ ബലപ്പെട്ടു വളരാൻ അനുവദിക്കുക; അത് അപ്രതീക്ഷിതമായ എവിടേക്കെങ്കിലും നയിച്ചാലും.
      title_ml: What will this child be?
    week:
      question: നിങ്ങൾക്ക് ആ പേര് എന്തുകൊണ്ട് ഇട്ടു എന്ന് അറിയാമോ? ആ കഥ പറയാൻ മേശയ്ക്കരികിലുള്ള ഒരാളോടു ചോദിക്കുക.
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: 'മാതാപിതാക്കൾ: ഈ വർഷം ഓരോ കുട്ടിയുടെയും ജീവിതത്തിൽ ദൈവം ചെയ്യുന്നതായി നിങ്ങൾ കണ്ട ഒരു കാര്യം അവരോടു പറയുക. മക്കൾ: ഒരു പ്രത്യേക കാര്യത്തിന് അപ്പനോടോ അമ്മയോടോ നന്ദി പറയുക.'
      prayer: ദൈവമായ കർത്താവേ, നീ നിന്റെ ജനത്തെ സന്ദർശിച്ചതിനാൽ നീ വാഴ്ത്തപ്പെട്ടവൻ. ഞങ്ങളുടെ ഭവനത്തിലെയും സഭയിലെയും കുഞ്ഞുങ്ങളെ അനുഗ്രഹിക്കേണമേ. നിന്റെ കൈ അവരോടുകൂടെ ഇരിക്കട്ടെ; അവർ ആത്മാവിൽ ബലപ്പെട്ട് നിന്റെ വഴി ഒരുക്കുമാറാകട്ടെ. ആമേൻ.
