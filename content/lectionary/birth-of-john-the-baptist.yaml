  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Do you know why you were given your name? Ask someone at the table to tell the story.
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: 'Parents: tell each child one thing you have seen God doing in their life this year. Children: thank a parent for one specific thing.'
  prayer: Blessed are you, Lord God, for you have visited your people. Bless the children of our home and our Church. Let your hand be with them, and let them grow strong in spirit and prepare your way. Amen.
