one_minute:
  what_happens: Elizabeth gives birth to a son. At his circumcision the relatives want to call him Zechariah, but Elizabeth says John. Zechariah writes “His name is John”, his voice returns, and he praises God in the Benedictus.
  why_this_sunday: The promise made to Zechariah three weeks ago comes true. The Church also keeps this Sunday as Children’s Day.
  take_with_you: Zechariah’s first words after nine months of silence were praise. Waiting had changed him.
readings_thread: Isaac is born to Sarah in old age, the baby Moses is saved from the river, and Hannah gives Samuel back to God. The psalm calls children a gift from the Lord, and Ephesians and Colossians speak to children and parents.
