phrases:
- term: Passover
  explanation: The spring feast remembering Israel’s escape from Egypt. Every Jewish man was expected to come to Jerusalem for it.
- term: Teachers
  explanation: Experts in the law who taught in the Temple courts and debated questions with their students.
- term: Kept these things in her heart
  explanation: Luke says this of Mary twice (2:19 and 2:51). She thinks about what she does not yet understand.
reflection:
  title_en: Lost, and found asking questions
  title_ml: കാണാതെപോയി, ചോദ്യങ്ങൾ ചോദിക്കുന്നവനായി കണ്ടെത്തി
  read_time: A three-minute read
  body: |-
    Any parent who has lost a child for even a few minutes in a crowd knows what Mary and Joseph felt. They searched for three days. When they found him, Mary said what every parent would say: why have you done this to us? We were so worried.

    Jesus’ answer is gentle and puzzling. He assumed they would know where to find him: in his Father’s house. Then he goes home, obeys them and keeps growing. He knows who his Father is, and he still lives as a son in Joseph and Mary’s home.

    Teenagers are often caught between these two things. They are growing into their own faith and their own questions, and they still belong to a family. This Gospel does not make them choose. It shows a young person asking real questions in God’s house, and parents who do not understand everything but keep it all in their hearts.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What is one question about God or faith you would like answered? Let the youngest go first.
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Each person write down one question about faith, and take it to your priest or Sunday School teacher this month.
  prayer: Lord Jesus, you grew in wisdom and stature in the home at Nazareth. Bless our young people with good questions and our parents with patience, and let our whole family grow in favour with God. Amen.
translations:
  ml:
    name:
      en: ജനനപ്പെരുന്നാളിനു ശേഷം രണ്ടാം ഞായർ
      ml: Second Sunday after Christmas
    season:
      en: യൽദോ
      gloss: ജനനപ്പെരുന്നാൾ കാലം
    tagline: ബാലനായ യേശുവിനെ ദൈവാലയത്തിൽ കണ്ടെത്തുന്നു
    standfirst: പെസഹ കഴിഞ്ഞു വീട്ടിലേക്കു മടങ്ങുംവഴി, തങ്ങളുടെ പന്ത്രണ്ടു വയസ്സുകാരനെ കാണാനില്ല എന്ന് മറിയയും യോസേഫും തിരിച്ചറിയുന്നു. മൂന്നു ദിവസത്തിനു ശേഷം ചോദ്യങ്ങൾ ചോദിച്ചുകൊണ്ട് ദൈവാലയത്തിൽ ഇരിക്കുന്ന അവനെ അവർ കണ്ടെത്തുന്നു.
    description: 'ജനനപ്പെരുന്നാളിനു ശേഷം രണ്ടാം ഞായറിലെ വായനകൾ, ബാലനായ യേശു ദൈവാലയത്തിൽ: ലൂക്കൊസ് 2:40–52 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: യേശുവിനു പന്ത്രണ്ടു വയസ്സുള്ളപ്പോൾ കുടുംബം പെസഹയ്ക്കു യെരൂശലേമിലേക്കു പോകുന്നു. മടക്കയാത്രയിൽ അവൻ കൂടെയില്ല എന്ന് മാതാപിതാക്കൾ കണ്ടെത്തുന്നു. മൂന്നു ദിവസം കഴിഞ്ഞ് ദൈവാലയത്തിൽ ഉപദേഷ്ടാക്കന്മാരുടെ നടുവിൽ അവനെ കണ്ടെത്തുന്നു. അവൻ അവരോടുകൂടെ വീട്ടിലേക്കു പോയി ജ്ഞാനത്തിൽ വളരുന്നു.
      why_this_sunday: ശൈശവത്തിനു ശേഷമുള്ള യേശുവിന്റെ ബാല്യത്തിൽനിന്ന് സുവിശേഷങ്ങളിലുള്ള ഏക കഥ ഇതാണ്. ജനനപ്പെരുന്നാൾ കാലത്ത് സഭ ഇതു വായിക്കുന്നു.
      take_with_you: യേശു മാതാപിതാക്കളെ അനുസരിച്ചു; എന്നിട്ടും താൻ ആരുടെ ഭവനത്തിനുള്ളവൻ എന്ന് അവന് അറിയാമായിരുന്നു. ഒരു കൌമാരക്കാരനെക്കുറിച്ച് ഇവ രണ്ടും ഒരുപോലെ സത്യമാകാം.
    readings_thread: യുവാവായ യോസേഫ് സ്വപ്നം കാണുന്നു; പിന്നീട് മറിയ ചെയ്യുന്നതുപോലെ അവന്റെ അപ്പൻ കാര്യം മനസ്സിൽ സംഗ്രഹിക്കുന്നു. ബാലനായ ശമൂവേൽ ദൈവാലയത്തിൽ ശുശ്രൂഷ ചെയ്ത് പ്രീതിയിൽ വളരുന്നു. മകനെ ഒളിപ്പിച്ച മോശെയുടെ മാതാപിതാക്കളുടെ വിശ്വാസത്തെ എബ്രായലേഖനം പ്രശംസിക്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 2:40–42
      title: പന്ത്രണ്ടു വയസ്സ്
      text: പൈതൽ ബലപ്പെട്ട് ജ്ഞാനം നിറഞ്ഞവനായി വളരുന്നു. എല്ലാ വർഷവും അവന്റെ മാതാപിതാക്കൾ പെസഹയ്ക്കു യെരൂശലേമിലേക്കു പോകുന്നു; അവനു പന്ത്രണ്ടു വയസ്സായപ്പോഴും പതിവുപോലെ പോകുന്നു.
      easy_to_miss: ഏകദേശം പതിമൂന്നാം വയസ്സിലാണ് ഒരു യെഹൂദബാലൻ മുതിർന്നവരുടെ മതപരമായ ചുമതലകൾ ഏറ്റെടുത്തിരുന്നത്. പന്ത്രണ്ടാം വയസ്സിൽ യേശു വളർച്ചയുടെ വക്കിലാണ്.
    - verses: ലൂക്കൊസ് 2:43–45
      title: അവനില്ലാതെ ഒരു ദിവസത്തെ വഴി
      text: മടക്കയാത്രയിൽ അവൻ കൂട്ടത്തിൽ ബന്ധുക്കളോടുകൂടെ ഉണ്ടെന്ന് അവർ വിചാരിക്കുന്നു. ഒരു ദിവസം കഴിഞ്ഞ് അവനെ കാണാഞ്ഞിട്ട് അവർ യെരൂശലേമിലേക്കു മടങ്ങുന്നു.
      easy_to_miss: ഗ്രാമവാസികളുടെ വലിയ കൂട്ടങ്ങളായാണ് കുടുംബങ്ങൾ യാത്ര ചെയ്തിരുന്നത്. ഒരു കുട്ടിയെ ദിവസം മുഴുവൻ കാണാതിരിക്കുന്നത് സാധാരണമായിരുന്നു.
    - verses: ലൂക്കൊസ് 2:46–47
      title: ഉപദേഷ്ടാക്കന്മാരുടെ നടുവിൽ
      text: മൂന്നു ദിവസം കഴിഞ്ഞ് അവർ അവനെ ദൈവാലയത്തിൽ ഉപദേഷ്ടാക്കന്മാരുടെ നടുവിൽ ഇരുന്ന്, അവരുടെ വാക്കു കേൾക്കുകയും അവരോടു ചോദിക്കുകയും ചെയ്യുന്നതായി കണ്ടെത്തുന്നു. അവന്റെ ബുദ്ധിയിൽ എല്ലാവരും വിസ്മയിക്കുന്നു.
      easy_to_miss: അവൻ കേൾക്കുകയും ചോദിക്കുകയുമാണ്, പ്രസംഗിക്കുകയല്ല. ലൂക്കൊസ് അവനെ പഠിക്കുന്നവനായി കാണിക്കുന്നു.
    - verses: ലൂക്കൊസ് 2:48–50
      title: എന്റെ പിതാവിന്റെ ഭവനം
      text: 'മറിയ പറയുന്നു: നിന്റെ അപ്പനും ഞാനും വ്യസനിച്ചുകൊണ്ടു നിന്നെ തിരഞ്ഞു. യേശു ഉത്തരം പറയുന്നു: എന്നെ തിരഞ്ഞതു എന്തിന്നു? എന്റെ പിതാവിന്നുള്ളതിൽ ഞാൻ ഇരിക്കേണ്ടതു എന്നു നിങ്ങൾ അറിയുന്നില്ലയോ? അവർക്കു മനസ്സിലാകുന്നില്ല.'
      easy_to_miss: ലൂക്കൊസിൽ രേഖപ്പെടുത്തിയിരിക്കുന്ന യേശുവിന്റെ ആദ്യവാക്കുകളാണിവ. മറിയ “നിന്റെ അപ്പൻ” എന്നു പറയുന്നു; യേശു “എന്റെ പിതാവ്” എന്നു പറയുന്നു.
    - verses: ലൂക്കൊസ് 2:51–52
      title: നസറെത്തിലേക്കു മടക്കം
      text: അവൻ അവരോടുകൂടെ വീട്ടിലേക്കു പോയി അവർക്കു കീഴടങ്ങിയിരിക്കുന്നു. അവന്റെ അമ്മ ഈ കാര്യങ്ങൾ എല്ലാം ഹൃദയത്തിൽ സംഗ്രഹിക്കുന്നു. യേശു ജ്ഞാനത്തിലും വളർച്ചയിലും ദൈവത്തിന്റെയും മനുഷ്യരുടെയും കൃപയിലും മുതിർന്നു വരുന്നു.
      easy_to_miss: 'മൂന്നു ദിവസത്തെ തിരച്ചിൽ, പിന്നെ അവനെ ജീവനോടെ കണ്ടെത്തൽ: ഉയിർപ്പിന്റെ കഥയിലും ലൂക്കൊസ് ഇതേ മാതൃക ഉപയോഗിക്കും.'
    people:
    - name: യേശു
      role: പന്ത്രണ്ടു വയസ്സ്; ബാലനായിരിക്കെ ദൈവാലയത്തിലേക്കുള്ള രേഖപ്പെടുത്തപ്പെട്ട ആദ്യസന്ദർശനം.
      name_meaning: “കർത്താവ് രക്ഷിക്കുന്നു”
      ml: Jesus
    - name: മറിയം
      role: അവനെ തിരയുകയും ഈ കാര്യങ്ങൾ ഹൃദയത്തിൽ സംഗ്രഹിക്കുകയും ചെയ്യുന്ന അവന്റെ അമ്മ.
      name_meaning: എബ്രായയിൽ മിര്യാം; അർത്ഥം ഉറപ്പില്ല
      ml: Mary
    - name: യോസേഫ്
      role: എല്ലാ വർഷവും പെസഹയ്ക്കു കുടുംബത്തെ യെരൂശലേമിലേക്കു കൊണ്ടുപോകുന്നവൻ.
      name_meaning: “അവൻ കൂട്ടിച്ചേർക്കും”
      ml: Joseph
    phrases:
    - term: പെസഹ
      explanation: മിസ്രയീമിൽനിന്നുള്ള യിസ്രായേലിന്റെ രക്ഷപ്പെടൽ ഓർക്കുന്ന വസന്തകാലപ്പെരുന്നാൾ. ഓരോ യെഹൂദപുരുഷനും അതിനായി യെരൂശലേമിൽ വരേണ്ടിയിരുന്നു.
    - term: ഉപദേഷ്ടാക്കന്മാർ
      explanation: ദൈവാലയപ്രാകാരങ്ങളിൽ പഠിപ്പിക്കുകയും ശിഷ്യന്മാരുമായി ചോദ്യങ്ങൾ ചർച്ച ചെയ്യുകയും ചെയ്തിരുന്ന ന്യായപ്രമാണപണ്ഡിതന്മാർ.
    - term: ഹൃദയത്തിൽ സംഗ്രഹിച്ചു
      explanation: മറിയയെക്കുറിച്ച് ലൂക്കൊസ് ഇതു രണ്ടു പ്രാവശ്യം പറയുന്നു (2:19, 2:51). ഇനിയും മനസ്സിലാകാത്ത കാര്യങ്ങളെക്കുറിച്ച് അവൾ ചിന്തിക്കുന്നു.
    reflection:
      title_en: കാണാതെപോയി, ചോദ്യങ്ങൾ ചോദിക്കുന്നവനായി കണ്ടെത്തി
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ഒരു തിരക്കിൽ ഏതാനും മിനിറ്റുനേരത്തേക്കെങ്കിലും ഒരു കുഞ്ഞിനെ കാണാതായിട്ടുള്ള ഏതു മാതാപിതാക്കൾക്കും മറിയയും യോസേഫും അനുഭവിച്ചത് അറിയാം. അവർ മൂന്നു ദിവസം തിരഞ്ഞു. അവനെ കണ്ടെത്തിയപ്പോൾ ഏത് അമ്മയും പറയുന്നതുതന്നെ മറിയ പറഞ്ഞു: നീ ഞങ്ങളോട് എന്തിന് ഇങ്ങനെ ചെയ്തു? ഞങ്ങൾ എത്ര വിഷമിച്ചു.

        യേശുവിന്റെ ഉത്തരം സൌമ്യവും കുഴപ്പിക്കുന്നതുമാണ്. തന്നെ എവിടെ കണ്ടെത്താമെന്ന് അവർക്ക് അറിയാമായിരിക്കുമെന്ന് അവൻ കരുതി: തന്റെ പിതാവിന്റെ ഭവനത്തിൽ. പിന്നെ അവൻ വീട്ടിലേക്കു പോയി, അവരെ അനുസരിച്ച്, വളർന്നുകൊണ്ടിരിക്കുന്നു. തന്റെ പിതാവ് ആരെന്ന് അവനറിയാം; എന്നിട്ടും യോസേഫിന്റെയും മറിയയുടെയും വീട്ടിൽ ഒരു മകനായി അവൻ ജീവിക്കുന്നു.

        കൌമാരക്കാർ പലപ്പോഴും ഇവ രണ്ടിനുമിടയിൽ പെട്ടുപോകുന്നു. അവർ സ്വന്തം വിശ്വാസത്തിലേക്കും സ്വന്തം ചോദ്യങ്ങളിലേക്കും വളരുകയാണ്; എങ്കിലും ഇപ്പോഴും ഒരു കുടുംബത്തിന്റേതാണ്. ഒന്നു തിരഞ്ഞെടുക്കാൻ ഈ സുവിശേഷം അവരെ നിർബ്ബന്ധിക്കുന്നില്ല. ദൈവഭവനത്തിൽ യഥാർത്ഥ ചോദ്യങ്ങൾ ചോദിക്കുന്ന ഒരു ചെറുപ്പക്കാരനെയും, എല്ലാം മനസ്സിലാകുന്നില്ലെങ്കിലും എല്ലാം ഹൃദയത്തിൽ സൂക്ഷിക്കുന്ന മാതാപിതാക്കളെയും അതു കാണിക്കുന്നു.
      title_ml: Lost, and found asking questions
    week:
      question: ദൈവത്തെക്കുറിച്ചോ വിശ്വാസത്തെക്കുറിച്ചോ ഉത്തരം കിട്ടാൻ നിങ്ങൾ ആഗ്രഹിക്കുന്ന ഒരു ചോദ്യം എന്താണ്? ഏറ്റവും ഇളയയാൾ ആദ്യം പറയട്ടെ.
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഓരോരുത്തരും വിശ്വാസത്തെക്കുറിച്ചുള്ള ഒരു ചോദ്യം എഴുതി, ഈ മാസം നിങ്ങളുടെ അച്ചന്റെയോ സൺഡേസ്കൂൾ അദ്ധ്യാപകന്റെയോ അടുക്കൽ കൊണ്ടുചെല്ലുക.
      prayer: കർത്താവായ യേശുവേ, നസറെത്തിലെ ഭവനത്തിൽ നീ ജ്ഞാനത്തിലും വളർച്ചയിലും മുതിർന്നുവന്നു. ഞങ്ങളുടെ ചെറുപ്പക്കാർക്കു നല്ല ചോദ്യങ്ങളും മാതാപിതാക്കൾക്കു ക്ഷമയും നല്കി അനുഗ്രഹിക്കേണമേ; ഞങ്ങളുടെ കുടുംബം മുഴുവൻ ദൈവത്തിന്റെ കൃപയിൽ വളരുമാറാകട്ടെ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 1:35–42
        ml: യോഹന്നാൻ 1:35–42
        note: അന്ത്രെയാസ് യേശുവിനെ അനുഗമിക്കുന്നു; ഞങ്ങൾ മശീഹയെ കണ്ടെത്തിയിരിക്കുന്നു എന്നു പറഞ്ഞ് സഹോദരനായ ശിമോനെ കൊണ്ടുവരുന്നു.
        printed: St. John 1:35-42
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 1:43–51
        ml: യോഹന്നാൻ 1:43–51
        note: 'ഫിലിപ്പൊസ് നഥനയേലിനെ കൊണ്ടുവരുന്നു: വന്നു കാൺക.'
        printed: St. John 1:43-51
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 37:1–11
        ml: ഉല്പത്തി 37:1–11
        note: യോസേഫ് സ്വപ്നം കാണുന്നു; സഹോദരന്മാർ അവനെ പകെക്കുന്നു; അപ്പൻ ആ കാര്യം മനസ്സിൽ സൂക്ഷിക്കുന്നു.
        printed: Genesis 37:1-11
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: 1 Samuel 2:18–21
        ml: 1 ശമൂവേൽ 2:18–21
        note: ബാലനായ ശമൂവേൽ യഹോവയെ ശുശ്രൂഷിക്കുന്നു; ഹന്നാ ഓരോ വർഷവും അവന് ഒരു ചെറിയ അങ്കി കൊണ്ടുവരുന്നു.
        printed: 1 Samuel 2:18-21
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 26:1–12
        ml: യെശയ്യാവ് 26:1–12
        note: സ്ഥിരമാനസൻ നിന്നിൽ ആശ്രയം വെച്ചിരിക്കകൊണ്ടു നീ അവനെ പൂർണ്ണസമാധാനത്തിൽ കാക്കുന്നു.
        printed: Isaiah 26:1-12
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: 1 John 3:21–24
        ml: 1 യോഹന്നാൻ 3:21–24
        note: അവന്റെ പുത്രന്റെ നാമത്തിൽ വിശ്വസിക്കയും അന്യോന്യം സ്നേഹിക്കയും ചെയ്യുക.
        printed: I John 3:21-24
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Hebrews 11:23–31
        ml: എബ്രായർ 11:23–31
        note: വിശ്വാസത്താൽ മോശെയുടെ മാതാപിതാക്കൾ അവനെ ഒളിപ്പിച്ചു; വിശ്വാസത്താൽ മോശെ ദൈവജനത്തോടുകൂടെ കഷ്ടമനുഭവിക്കുന്നതു തിരഞ്ഞെടുത്തു.
        printed: Hebrews 11:23-31
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 2:40–52
        ml: ലൂക്കൊസ് 2:40–52
        note: 'പന്ത്രണ്ടാം വയസ്സിൽ ബാലനായ യേശു ദൈവാലയത്തിൽ: ഞാൻ എന്റെ പിതാവിന്നുള്ളവയിൽ ഇരിക്കേണ്ടതാകുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.'
        printed: St. Luke 2:40-52
        main: true
    key_verse:
      ref: ലൂക്കൊസ് 2:52
    hero_quote:
      text: എന്റെ പിതാവിന്നുള്ളതിൽ ഞാൻ ഇരിക്കേണ്ടതു എന്നു നിങ്ങൾ അറിയുന്നില്ലയോ.
      ref: ലൂക്കൊസ് 2:49
