one_minute:
  what_happens: When Jesus is twelve, the family goes to Jerusalem for Passover. On the way home his parents find he is missing. After three days they find him in the Temple among the teachers. He goes home with them and grows in wisdom.
  why_this_sunday: This is the only story in the Gospels from Jesus’ childhood after his infancy. The Church reads it in the Christmas season.
  take_with_you: Jesus was obedient to his parents and still knew whose house he belonged in. Both can be true of a young person.
readings_thread: Young Joseph dreams and his father keeps the matter in mind, as Mary later does. The boy Samuel serves in the house of God and grows in favour. Hebrews praises the faith of Moses’ parents, who hid their son.
key_verse:
  ref: Luke 2:52
  ml: യേശുവോ ജ്ഞാനത്തിലും വളർച്ചയിലും ദൈവത്തിന്റെയും മനുഷ്യരുടെയും കൃപയിലും മുതിർന്നു വന്നു.
  ml_translation: Sathyavedapusthakam, 1910
  en: And Jesus increased in wisdom and stature, and in favor with God and men.
  en_translation: World English Bible
scenes:
- verses: Luke 2:40–42
  title: Twelve years old
  text: The child grows strong and full of wisdom. Every year his parents go to Jerusalem for Passover, and when he is twelve they go as usual.
  easy_to_miss: A Jewish boy took on adult religious duties at about thirteen. At twelve, Jesus is on the edge of growing up.
- verses: Luke 2:43–45
  title: A day’s journey without him
  text: On the way home they assume he is with relatives in the group. After a day they cannot find him and go back to Jerusalem.
  easy_to_miss: Families travelled in large groups of villagers. It was normal not to see a child all day.
- verses: Luke 2:46–47
  title: Among the teachers
  text: After three days they find him in the Temple, sitting among the teachers, listening and asking questions. Everyone is amazed at his understanding.
  easy_to_miss: He is listening and asking, not lecturing. Luke shows him learning.
- verses: Luke 2:48–50
  title: My Father’s house
  text: 'Mary says: your father and I have been searching for you anxiously. Jesus answers: why were you looking for me? Did you not know I must be in my Father’s house? They do not understand.'
  easy_to_miss: These are the first words of Jesus recorded in Luke. Mary says “your father”; Jesus speaks of “my Father”.
- verses: Luke 2:51–52
  title: Back to Nazareth
  text: He goes home with them and is obedient to them. His mother keeps all these things in her heart. Jesus grows in wisdom and stature, and in favour with God and people.
  easy_to_miss: '“Three days” of searching and then finding him alive: Luke will use the same pattern at Easter.'
