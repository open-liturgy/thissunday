  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What is one question about God or faith you would like answered? Let the youngest go first.
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Each person write down one question about faith, and take it to your priest or Sunday School teacher this month.
  prayer: Lord Jesus, you grew in wisdom and stature in the home at Nazareth. Bless our young people with good questions and our parents with patience, and let our whole family grow in favour with God. Amen.
