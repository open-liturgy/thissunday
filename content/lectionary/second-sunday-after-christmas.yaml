phrases:
- term: Passover
  explanation: The spring feast remembering Israel’s escape from Egypt. Every Jewish man was expected to come to Jerusalem for it.
- term: Teachers
  explanation: Experts in the law who taught in the Temple courts and debated questions with their students.
- term: Kept these things in her heart
  explanation: Luke says this of Mary twice (2:19 and 2:51). She thinks about what she does not yet understand.
reflection:
  title_en: Lost, and found asking questions
  title_ml: കാണാതെപോയി, ചോദ്യങ്ങൾ ചോദിക്കുന്നവനായി കണ്ടെത്തി
  read_time: A three-minute read
  body: |-
    Any parent who has lost a child for even a few minutes in a crowd knows what Mary and Joseph felt. They searched for three days. When they found him, Mary said what every parent would say: why have you done this to us? We were so worried.

    Jesus’ answer is gentle and puzzling. He assumed they would know where to find him: in his Father’s house. Then he goes home, obeys them and keeps growing. He knows who his Father is, and he still lives as a son in Joseph and Mary’s home.

    Teenagers are often caught between these two things. They are growing into their own faith and their own questions, and they still belong to a family. This Gospel does not make them choose. It shows a young person asking real questions in God’s house, and parents who do not understand everything but keep it all in their hearts.
