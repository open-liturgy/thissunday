one_minute:
  what_happens: The crowd follows Jesus across the lake after the feeding of the five thousand. He says they came for the bread, not the sign. They ask for a sign like the manna in the desert. He tells them he is the true bread from heaven.
  why_this_sunday: After Pentecost the Church begins a long run of ordinary Sundays about life in the Spirit. It starts with what feeds that life.
  take_with_you: We spend most of our energy on food that runs out. Jesus offers food that lasts.
readings_thread: Joseph is given charge of Egypt’s grain, and Israel leaves Egypt in haste. The manna stops when Israel eats the produce of the promised land. Jeremiah promises God will bring his people home, and Paul says we are a new creation.
key_verse:
  ref: John 6:27
  ml: '[ML VERSE: Sathyavedapusthakam 1910, John 6:27]'
  ml_translation: Sathyavedapusthakam, 1910
  en: Don’t work for the food which perishes, but for the food which remains to eternal life, which the Son of Man will give to you. For God the Father has sealed him.
  en_translation: World English Bible
scenes:
- verses: John 6:26–27
  title: Bread that perishes
  text: You are looking for me because you ate your fill of the loaves, says Jesus, not because you saw signs. Do not work for food that perishes, but for food that lasts to eternal life.
  easy_to_miss: Jesus does not despise their hunger. He fed them yesterday. He wants them to see what the feeding pointed to.
- verses: John 6:28–29
  title: The work of God
  text: 'They ask what they must do to do God’s works. This is the work of God, Jesus says: that you believe in the one he has sent.'
  easy_to_miss: They ask about “works”, plural. Jesus answers with one work, and it is believing.
- verses: John 6:30–31
  title: Show us a sign
  text: They ask for a sign. Our ancestors ate manna in the wilderness; Moses gave them bread from heaven.
  easy_to_miss: They have just eaten miraculous bread and still ask for a sign. Signs do not create faith on their own.
- verses: John 6:32–33
  title: The true bread from heaven
  text: It was not Moses who gave the bread from heaven, Jesus says, but my Father gives you the true bread from heaven, which comes down and gives life to the world.
  easy_to_miss: Manna fed one people for forty years. This bread gives life “to the world”.
- verses: John 6:34–35
  title: I am the bread of life
  text: 'Lord, give us this bread always. Jesus says: I am the bread of life. Whoever comes to me will never be hungry, and whoever believes in me will never be thirsty.'
  easy_to_miss: This is the first of the seven “I am” sayings in John’s Gospel.
