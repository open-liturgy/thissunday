    hero_quote:
      text: ഞാൻ ജീവന്റെ അപ്പം ആകുന്നു; എന്റെ അടുക്കൽ വരുന്നവന്നു വിശക്കയില്ല; എന്നിൽ വിശ്വസിക്കുന്നവന്നു ഒരുനാളും ദാഹിക്കയുമില്ല.
