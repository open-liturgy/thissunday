- term: Manna
  explanation: The bread-like food God gave Israel each morning in the wilderness (Exodus 16). Its name means “what is it?”
- term: Sealed
  explanation: Marked with an official seal of approval. The Father has authorised the Son.
- term: “I am” sayings
  explanation: 'Seven sayings in John where Jesus describes himself: bread, light, door, shepherd, resurrection, way, vine.'
reflection:
  title_en: Food that lasts
  title_ml: '[TITLE ML]'
  read_time: A three-minute read
  body: |-
    The crowd had a good reason to look for Jesus. Yesterday he had fed them for free, and they were hungry again. Jesus does not blame them for being hungry. He tells them that their hunger points to something deeper, which bread from a bakery will never satisfy.

    We know this from our own lives. We work hard for things that do not last: a better phone, a bigger house, the approval of people who will forget us next year. None of it is bad. But we come back hungry every time. Jesus says: I am the bread that lasts.

    After Pentecost the Church settles into a long season of ordinary Sundays. This is where faith is fed or starved, week by week. Coming to the Qurbana, reading the Scriptures, praying at home: these are how we eat the bread that lasts. Like daily food, they work best when they are regular.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What do you spend most of your time and energy working for? Does it last?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Give food to someone who needs it this week, and pray for them when you do.
  prayer: Lord Jesus, bread of life, give us this bread always. Feed us with your word and your body, and teach us to work for the food that lasts. Amen.
