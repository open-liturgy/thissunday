sunday_slug: first-sunday-after-pentecost
is_sunday: true
name:
  en: First Sunday after Pentecost
  ml: പെന്തിക്കോസ്തിക്കു ശേഷം ഒന്നാം ഞായർ
title_as_printed: First Sunday after Pentecost
season:
  en: Pentecost
  gloss: The season of the Holy Spirit
  syr: ܦܢܛܩܘܣܛܐ
tagline: “I am the bread of life”
standfirst: The day after Jesus fed five thousand people, the crowd finds him again. They want more bread. He tells them he is the bread they really need.
description: Readings for the First Sunday after Pentecost, with John 6:26–35, “I am the bread of life”, explained in five scenes. A reflection and a family question.
hero_quote:
  text: I am the bread of life. Whoever comes to me will not be hungry, and whoever believes in me will never be thirsty.
  ref: John 6:35
