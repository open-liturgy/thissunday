    main: true
one_minute:
  what_happens: The crowd follows Jesus across the lake after the feeding of the five thousand. He says they came for the bread, not the sign. They ask for a sign like the manna in the desert. He tells them he is the true bread from heaven.
  why_this_sunday: After Pentecost the Church begins a long run of ordinary Sundays about life in the Spirit. It starts with what feeds that life.
  take_with_you: We spend most of our energy on food that runs out. Jesus offers food that lasts.
readings_thread: Joseph is given charge of Egypt’s grain, and Israel leaves Egypt in haste. The manna stops when Israel eats the produce of the promised land. Jeremiah promises God will bring his people home, and Paul says we are a new creation.
key_verse:
  ref: John 6:27
  ml: നശിച്ചുപോകുന്ന ആഹാരത്തിന്നായിട്ടല്ല, നിത്യജീവങ്കലേക്കു നിലനില്ക്കുന്ന ആഹാരത്തിന്നായിട്ടു തന്നേ പ്രവർത്തിപ്പിൻ; അതു മനുഷ്യപുത്രൻ നിങ്ങൾക്കു തരും. അവനെ പിതാവായ ദൈവം മുദ്രയിട്ടിരിക്കുന്നു എന്നു ഉത്തരം പറഞ്ഞു.
  ml_translation: Sathyavedapusthakam, 1910
  en: Don’t work for the food which perishes, but for the food which remains to eternal life, which the Son of Man will give to you. For God the Father has sealed him.
  en_translation: World English Bible
scenes:
- verses: John 6:26–27
  title: Bread that perishes
  text: You are looking for me because you ate your fill of the loaves, says Jesus, not because you saw signs. Do not work for food that perishes, but for food that lasts to eternal life.
  easy_to_miss: Jesus does not despise their hunger. He fed them yesterday. He wants them to see what the feeding pointed to.
- verses: John 6:28–29
  title: The work of God
  text: 'They ask what they must do to do God’s works. This is the work of God, Jesus says: that you believe in the one he has sent.'
  easy_to_miss: They ask about “works”, plural. Jesus answers with one work, and it is believing.
- verses: John 6:30–31
  title: Show us a sign
  text: They ask for a sign. Our ancestors ate manna in the wilderness; Moses gave them bread from heaven.
  easy_to_miss: They have just eaten miraculous bread and still ask for a sign. Signs do not create faith on their own.
- verses: John 6:32–33
  title: The true bread from heaven
  text: It was not Moses who gave the bread from heaven, Jesus says, but my Father gives you the true bread from heaven, which comes down and gives life to the world.
  easy_to_miss: Manna fed one people for forty years. This bread gives life “to the world”.
- verses: John 6:34–35
  title: I am the bread of life
  text: 'Lord, give us this bread always. Jesus says: I am the bread of life. Whoever comes to me will never be hungry, and whoever believes in me will never be thirsty.'
  easy_to_miss: This is the first of the seven “I am” sayings in John’s Gospel.
people:
- name: The crowd
  ml: പുരുഷാരം
  role: Fed by Jesus the day before, now looking for more.
  name_meaning: —
- name: Moses
  ml: മോശെ
  role: Through whom God gave manna in the wilderness.
  name_meaning: Probably “drawn out” (Exodus 2:10)
phrases:
- term: Manna
  explanation: The bread-like food God gave Israel each morning in the wilderness (Exodus 16). Its name means “what is it?”
- term: Sealed
  explanation: Marked with an official seal of approval. The Father has authorised the Son.
- term: “I am” sayings
  explanation: 'Seven sayings in John where Jesus describes himself: bread, light, door, shepherd, resurrection, way, vine.'
reflection:
  title_en: Food that lasts
  title_ml: നിലനില്ക്കുന്ന ആഹാരം
  read_time: A three-minute read
  body: |-
    The crowd had a good reason to look for Jesus. Yesterday he had fed them for free, and they were hungry again. Jesus does not blame them for being hungry. He tells them that their hunger points to something deeper, which bread from a bakery will never satisfy.

    We know this from our own lives. We work hard for things that do not last: a better phone, a bigger house, the approval of people who will forget us next year. None of it is bad. But we come back hungry every time. Jesus says: I am the bread that lasts.

    After Pentecost the Church settles into a long season of ordinary Sundays. This is where faith is fed or starved, week by week. Coming to the Qurbana, reading the Scriptures, praying at home: these are how we eat the bread that lasts. Like daily food, they work best when they are regular.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What do you spend most of your time and energy working for? Does it last?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Give food to someone who needs it this week, and pray for them when you do.
  prayer: Lord Jesus, bread of life, give us this bread always. Feed us with your word and your body, and teach us to work for the food that lasts. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം ഒന്നാം ഞായർ
      ml: First Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: “ഞാൻ ജീവന്റെ അപ്പം ആകുന്നു”
    standfirst: യേശു അയ്യായിരം പേരെ പോഷിപ്പിച്ചതിന്റെ പിറ്റേന്ന്, പുരുഷാരം അവനെ വീണ്ടും കണ്ടെത്തുന്നു. അവർക്കു കൂടുതൽ അപ്പം വേണം. അവർക്കു യഥാർത്ഥത്തിൽ ആവശ്യമുള്ള അപ്പം താനാണെന്ന് അവൻ അവരോടു പറയുന്നു.
    description: പെന്തിക്കോസ്തിക്കു ശേഷം ഒന്നാം ഞായറിലെ വായനകൾ, “ഞാൻ ജീവന്റെ അപ്പം ആകുന്നു” എന്ന യോഹന്നാൻ 6:26–35 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: അയ്യായിരം പേരെ പോഷിപ്പിച്ചശേഷം പുരുഷാരം കടലിനക്കരെ യേശുവിനെ പിന്തുടരുന്നു. അവർ വന്നത് അടയാളം കണ്ടിട്ടല്ല, അപ്പത്തിനുവേണ്ടിയാണെന്ന് അവൻ പറയുന്നു. മരുഭൂമിയിലെ മന്നാപോലെ ഒരു അടയാളം അവർ ചോദിക്കുന്നു. സ്വർഗ്ഗത്തിൽനിന്നുള്ള സാക്ഷാൽ അപ്പം താനാണെന്ന് അവൻ അവരോടു പറയുന്നു.
      why_this_sunday: പെന്തിക്കോസ്തിക്കു ശേഷം, ആത്മാവിലുള്ള ജീവിതത്തെക്കുറിച്ചുള്ള സാധാരണ ഞായറാഴ്ചകളുടെ ഒരു നീണ്ട നിര സഭ ആരംഭിക്കുന്നു. ആ ജീവനെ പോഷിപ്പിക്കുന്നതെന്താണ് എന്നതിൽനിന്നാണ് തുടക്കം.
      take_with_you: തീർന്നുപോകുന്ന ആഹാരത്തിനായി നാം നമ്മുടെ ശക്തിയിൽ ഏറിയപങ്കും ചെലവഴിക്കുന്നു. നിലനില്ക്കുന്ന ആഹാരം യേശു നല്കുന്നു.
    readings_thread: മിസ്രയീമിലെ ധാന്യത്തിന്റെ ചുമതല യോസേഫിനു ലഭിക്കുന്നു; യിസ്രായേൽ തിടുക്കത്തിൽ മിസ്രയീം വിടുന്നു. വാഗ്ദത്തദേശത്തെ വിളവു യിസ്രായേൽ ഭക്ഷിച്ചപ്പോൾ മന്നാ നിന്നുപോകുന്നു. ദൈവം തന്റെ ജനത്തെ മടക്കിവരുത്തുമെന്നു യിരെമ്യാവു വാഗ്ദത്തം ചെയ്യുന്നു; നാം പുതിയ സൃഷ്ടി ആകുന്നു എന്നു പൌലൊസ് പറയുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 6:26–27
      title: നശിച്ചുപോകുന്ന ആഹാരം
      text: നിങ്ങൾ അടയാളം കണ്ടതുകൊണ്ടല്ല, അപ്പം തിന്നു തൃപ്തരായതുകൊണ്ടത്രേ എന്നെ അന്വേഷിക്കുന്നത്, യേശു പറയുന്നു. നശിച്ചുപോകുന്ന ആഹാരത്തിന്നായിട്ടല്ല, നിത്യജീവങ്കലേക്കു നിലനില്ക്കുന്ന ആഹാരത്തിന്നായിട്ടു തന്നേ പ്രവർത്തിപ്പിൻ.
      easy_to_miss: യേശു അവരുടെ വിശപ്പിനെ നിന്ദിക്കുന്നില്ല. ഇന്നലെ അവൻ അവരെ പോഷിപ്പിച്ചു. ആ പോഷിപ്പിക്കൽ എന്തിലേക്കു വിരൽചൂണ്ടി എന്ന് അവർ കാണണമെന്ന് അവൻ ആഗ്രഹിക്കുന്നു.
    - verses: യോഹന്നാൻ 6:28–29
      title: ദൈവത്തിന്നു പ്രസാദമുള്ള പ്രവൃത്തി
      text: 'ദൈവത്തിന്നു പ്രസാദമുള്ള പ്രവൃത്തികളെ പ്രവർത്തിക്കേണ്ടതിന്നു തങ്ങൾ എന്തു ചെയ്യേണം എന്ന് അവർ ചോദിക്കുന്നു. യേശു പറയുന്നു: ദൈവത്തിന്നു പ്രസാദമുള്ള പ്രവൃത്തി അവൻ അയച്ചവനിൽ നിങ്ങൾ വിശ്വസിക്കുന്നതത്രേ.'
      easy_to_miss: 'അവർ ‘പ്രവൃത്തികളെ’ക്കുറിച്ച്, ബഹുവചനത്തിൽ, ചോദിക്കുന്നു. യേശു ഒരു പ്രവൃത്തികൊണ്ട് ഉത്തരം പറയുന്നു: വിശ്വസിക്കുക.'
    - verses: യോഹന്നാൻ 6:30–31
      title: ഒരു അടയാളം കാണിക്ക
      text: അവർ ഒരു അടയാളം ചോദിക്കുന്നു. നമ്മുടെ പിതാക്കന്മാർ മരുഭൂമിയിൽ മന്നാ തിന്നു; അവർക്കു തിന്നുവാൻ സ്വർഗ്ഗത്തിൽനിന്നു അപ്പം കൊടുത്തു എന്നു എഴുതിയിരിക്കുന്നുവല്ലോ.
      easy_to_miss: അത്ഭുതകരമായ അപ്പം ഇപ്പോൾ ഭക്ഷിച്ചിട്ടും അവർ ഒരു അടയാളം ചോദിക്കുന്നു. അടയാളങ്ങൾ സ്വയം വിശ്വാസം ഉളവാക്കുന്നില്ല.
    - verses: യോഹന്നാൻ 6:32–33
      title: സ്വർഗ്ഗത്തിൽനിന്നുള്ള സാക്ഷാൽ അപ്പം
      text: സ്വർഗ്ഗത്തിൽനിന്നുള്ള അപ്പം മോശെയല്ല നിങ്ങൾക്കു തന്നത്, യേശു പറയുന്നു; എന്റെ പിതാവത്രേ സ്വർഗ്ഗത്തിൽനിന്നുള്ള സാക്ഷാൽ അപ്പം നിങ്ങൾക്കു തരുന്നത്. ദൈവത്തിന്റെ അപ്പം സ്വർഗ്ഗത്തിൽനിന്നു ഇറങ്ങിവന്നു ലോകത്തിന്നു ജീവനെ കൊടുക്കുന്നതു ആകുന്നു.
      easy_to_miss: മന്നാ ഒരു ജനത്തെ നാല്പതു വർഷം പോഷിപ്പിച്ചു. ഈ അപ്പം “ലോകത്തിന്നു ജീവനെ” കൊടുക്കുന്നു.
    - verses: യോഹന്നാൻ 6:34–35
      title: ഞാൻ ജീവന്റെ അപ്പം ആകുന്നു
      text: 'കർത്താവേ, ഈ അപ്പം എപ്പോഴും ഞങ്ങൾക്കു തരേണമേ. യേശു പറയുന്നു: ഞാൻ ജീവന്റെ അപ്പം ആകുന്നു; എന്റെ അടുക്കൽ വരുന്നവന്നു വിശക്കയില്ല; എന്നിൽ വിശ്വസിക്കുന്നവന്നു ഒരുനാളും ദാഹിക്കയുമില്ല.'
      easy_to_miss: യോഹന്നാന്റെ സുവിശേഷത്തിലെ ഏഴ് “ഞാൻ ആകുന്നു” വചനങ്ങളിൽ ആദ്യത്തേതാണിത്.
    people:
    - name: പുരുഷാരം
      role: തലേദിവസം യേശു പോഷിപ്പിച്ചവർ; ഇപ്പോൾ കൂടുതൽ തേടുന്നു.
      name_meaning: —
      ml: The crowd
    - name: മോശെ
      role: അവനിലൂടെയാണ് ദൈവം മരുഭൂമിയിൽ മന്നാ നല്കിയത്.
      name_meaning: ഒരുപക്ഷേ “വലിച്ചെടുത്തവൻ” (പുറപ്പാടു 2:10)
      ml: Moses
    phrases:
    - term: മന്നാ
      explanation: മരുഭൂമിയിൽ എല്ലാ പ്രഭാതത്തിലും ദൈവം യിസ്രായേലിനു നല്കിയ അപ്പംപോലെയുള്ള ആഹാരം (പുറപ്പാടു 16). അതിന്റെ പേരിന് ‘ഇതെന്ത്?’ എന്നർത്ഥം.
    - term: മുദ്രയിട്ടിരിക്കുന്നു
      explanation: ഔദ്യോഗികമായ അംഗീകാരമുദ്ര പതിക്കപ്പെട്ടത്. പിതാവു പുത്രനെ അധികാരപ്പെടുത്തിയിരിക്കുന്നു.
    - term: “ഞാൻ ആകുന്നു” വചനങ്ങൾ
      explanation: 'യേശു തന്നെത്തന്നെ വിവരിക്കുന്ന യോഹന്നാനിലെ ഏഴു വചനങ്ങൾ: അപ്പം, വെളിച്ചം, വാതിൽ, ഇടയൻ, പുനരുത്ഥാനം, വഴി, മുന്തിരിവള്ളി.'
    reflection:
      title_en: നിലനില്ക്കുന്ന ആഹാരം
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        യേശുവിനെ തേടാൻ പുരുഷാരത്തിനു നല്ല കാരണമുണ്ടായിരുന്നു. ഇന്നലെ അവൻ അവരെ സൌജന്യമായി പോഷിപ്പിച്ചു; ഇന്ന് അവർക്കു വീണ്ടും വിശക്കുന്നു. വിശക്കുന്നതിന് യേശു അവരെ കുറ്റപ്പെടുത്തുന്നില്ല. അവരുടെ വിശപ്പ് കൂടുതൽ ആഴമുള്ള ഒന്നിലേക്കു വിരൽചൂണ്ടുന്നുവെന്നും, ബേക്കറിയിൽനിന്നുള്ള അപ്പം ഒരിക്കലും അതിനെ തൃപ്തിപ്പെടുത്തുകയില്ലെന്നും അവൻ അവരോടു പറയുന്നു.

        നമ്മുടെ സ്വന്തം ജീവിതത്തിൽനിന്നു നമുക്കിതറിയാം. നിലനില്ക്കാത്ത കാര്യങ്ങൾക്കായി നാം കഠിനമായി അദ്ധ്വാനിക്കുന്നു: ഒരു നല്ല ഫോൺ, ഒരു വലിയ വീട്, അടുത്ത വർഷം നമ്മെ മറക്കുന്നവരുടെ അംഗീകാരം. ഇവയൊന്നും മോശമല്ല. പക്ഷേ ഓരോ തവണയും നാം വിശന്നുതന്നെ മടങ്ങിവരുന്നു. യേശു പറയുന്നു: നിലനില്ക്കുന്ന അപ്പം ഞാനാണ്.

        പെന്തിക്കോസ്തിക്കു ശേഷം സഭ സാധാരണ ഞായറാഴ്ചകളുടെ ഒരു നീണ്ട കാലത്തിലേക്കു പ്രവേശിക്കുന്നു. ആഴ്ചതോറും വിശ്വാസം പോഷിപ്പിക്കപ്പെടുകയോ പട്ടിണിയിലാകുകയോ ചെയ്യുന്നത് ഇവിടെയാണ്. കുർബ്ബാനയ്ക്കു വരുന്നതും തിരുവെഴുത്തുകൾ വായിക്കുന്നതും വീട്ടിൽ പ്രാർത്ഥിക്കുന്നതും: ഇങ്ങനെയാണ് നിലനില്ക്കുന്ന അപ്പം നാം ഭക്ഷിക്കുന്നത്. ദിവസേനയുള്ള ആഹാരംപോലെ, ക്രമമായിരിക്കുമ്പോഴാണ് അവ ഏറ്റവും നന്നായി ഫലിക്കുന്നത്.
      title_ml: Food that lasts
    week:
      question: നിങ്ങളുടെ സമയത്തിന്റെയും ശക്തിയുടെയും ഏറിയപങ്കും നിങ്ങൾ എന്തിനുവേണ്ടിയാണ് ചെലവഴിക്കുന്നത്? അതു നിലനില്ക്കുമോ?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച ആവശ്യമുള്ള ഒരാൾക്കു ഭക്ഷണം കൊടുക്കുക; കൊടുക്കുമ്പോൾ അവർക്കുവേണ്ടി പ്രാർത്ഥിക്കുക.
      prayer: ജീവന്റെ അപ്പമായ കർത്താവായ യേശുവേ, ഈ അപ്പം എപ്പോഴും ഞങ്ങൾക്കു തരേണമേ. നിന്റെ വചനംകൊണ്ടും നിന്റെ ശരീരംകൊണ്ടും ഞങ്ങളെ പോഷിപ്പിക്കേണമേ; നിലനില്ക്കുന്ന ആഹാരത്തിനായി പ്രവർത്തിക്കാൻ ഞങ്ങളെ പഠിപ്പിക്കേണമേ. ആമേൻ.
