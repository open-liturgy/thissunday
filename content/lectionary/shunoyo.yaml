phrases:
- term: Shunoyo
  explanation: Syriac name for the feast of St. Mary’s passing from this life and her assumption, kept on 15 August.
- term: Fifteen-day fast
  explanation: The Malankara Church fasts from 1 to 15 August in preparation for this feast.
- term: Martha Mariam Samajam
  explanation: The women’s organisation of the Malankara Orthodox Church, which keeps this day as its own.
reflection:
  title_en: She heard the word and kept it
  title_ml: അവൾ വചനം കേട്ടു പ്രമാണിച്ചു
  read_time: A three-minute read
  body: |-
    The woman in the crowd says what many of us feel about Mary: how blessed must the mother of such a son be. Jesus agrees, and then points deeper. Blessed are those who hear God’s word and keep it. Nobody did that more completely than his mother.

    Mary heard the word from Gabriel and said yes. She kept what she did not understand in her heart. She stood by the cross when most of the disciples had run. Jesus, dying, gave her to the beloved disciple as his mother, and the Church has received her as mother ever since.

    On Shunoyo we celebrate her passing from this life into the presence of her Son. She goes ahead of us where we hope to follow. The way she took is open to all: hearing God’s word, keeping it, and staying near Jesus even at the cross. That is how we become his family too.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What is one thing God has said to you that you want to keep, like Mary did?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Learn one verse from this week’s readings by heart as a family, and say it together before meals.
  prayer: Holy Mother of God, who heard the word and kept it, pray for us. Lord Jesus, as you gave your mother to the beloved disciple, let us also take her into our home and follow her example of faith. Amen.
translations:
  ml:
    name:
      en: 'ശൂനോയോ: വിശുദ്ധ ദൈവമാതാവിന്റെ വാങ്ങിപ്പ്'
      ml: 'Shunoyo: the Assumption of St. Mary'
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    also_kept_as: മർത്തമറിയം സമാജം ദിനം
    tagline: വചനം കേട്ടു പ്രമാണിച്ച ദൈവമാതാവ്
    standfirst: 'വിശുദ്ധ മറിയം ഈ ജീവിതത്തിൽനിന്നു വാങ്ങിപ്പോയതു സഭ ആഘോഷിക്കുന്നു. സഭ വായിക്കുന്ന സുവിശേഷങ്ങൾ, യേശുതന്നെ അവളെ കണ്ടതുപോലെ അവളെ കാണിക്കുന്നു: ദൈവവചനം കേട്ടു പ്രമാണിച്ചവൾ, ക്രൂശിന്നരികെ നിന്നവൾ.'
    description: ശൂനോയോ പെരുന്നാളിലെ വായനകൾ, ലൂക്കൊസ് 11:27–28, മത്തായി 12:46–50, യോഹന്നാൻ 19:25–27 എന്നിവ വിശദമായി. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: മൂന്നു ചെറിയ സുവിശേഷഭാഗങ്ങൾ വായിക്കുന്നു. പുരുഷാരത്തിൽ ഒരു സ്ത്രീ യേശുവിന്റെ അമ്മയെ ഭാഗ്യവതി എന്നു പറയുന്നു; ദൈവവചനം കേട്ടു പ്രമാണിക്കുന്നവർ ഭാഗ്യവാന്മാർ എന്ന് അവൻ പറയുന്നു. പിതാവിന്റെ ഇഷ്ടം ചെയ്യുന്നവൻ തന്റെ അമ്മ എന്ന് അവൻ പറയുന്നു. ക്രൂശിൽനിന്ന് അവൻ തന്റെ അമ്മയെ താൻ സ്നേഹിച്ച ശിഷ്യനെ ഏല്പിക്കുന്നു.
      why_this_sunday: വിശുദ്ധ മറിയത്തിന്റെ വാങ്ങിപ്പിന്റെയും സ്വർഗ്ഗാരോപണത്തിന്റെയും പെരുന്നാളായ ശൂനോയോ ആഗസ്റ്റ് 15 ആണ്. അത് ഒരു ഞായറാഴ്ച വരുമ്പോൾ ആ ദിവസം ആചരിക്കുന്നു. പതിനഞ്ചു ദിവസത്തെ നോമ്പോടെ സഭ അതിനായി ഒരുങ്ങുന്നു.
      take_with_you: ക്രിസ്തുവിനെ പ്രസവിച്ചതുകൊണ്ടു മറിയം ഭാഗ്യവതിയാണ്; ദൈവവചനം കേട്ടു പ്രമാണിച്ചതുകൊണ്ട് അതിലും അധികം.
    readings_thread: കത്തിയിട്ടും വെന്തുപോകാത്ത മുൾപ്പടർപ്പു മോശെ കാണുന്നു; കർത്താവു പ്രവേശിച്ചിട്ട് അടഞ്ഞുതന്നെ ഇരിക്കുന്ന ഗോപുരം യെഹെസ്കേൽ കാണുന്നു. ഈ രണ്ടിലും സഭ പണ്ടുമുതലേ മറിയത്തെ കണ്ടിരിക്കുന്നു. അപ്പൊസ്തലന്മാരോടുകൂടെ അവൾ പ്രാർത്ഥിക്കുന്നത് അപ്പൊസ്തലപ്രവൃത്തികൾ കാണിക്കുന്നു; ദൈവത്തിന്റെ നിയമം സൂക്ഷിച്ചിരുന്ന പെട്ടകത്തെ എബ്രായലേഖനം വിവരിക്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 11:27
      title: നിന്നെ ചുമന്ന ഉദരം
      text: 'യേശു ഉപദേശിക്കുമ്പോൾ പുരുഷാരത്തിൽ ഒരു സ്ത്രീ ഉച്ചത്തിൽ പറയുന്നു: നിന്നെ ചുമന്ന ഉദരവും നീ കുടിച്ച മുലയും ഭാഗ്യമുള്ളവ.'
      easy_to_miss: “ഇന്നുമുതൽ എല്ലാ തലമുറകളും എന്നെ ഭാഗ്യവതി എന്നു വാഴ്ത്തും” എന്ന മറിയത്തിന്റെ സ്വന്തം വാക്കുകൾ ഇതു നിവൃത്തിയാക്കുന്നു (ലൂക്കൊസ് 1:48).
    - verses: ലൂക്കൊസ് 11:28
      title: കേട്ടു പ്രമാണിക്കുന്നവർ
      text: 'യേശു മറുപടി പറയുന്നു: അല്ല, ദൈവത്തിന്റെ വചനം കേട്ടു പ്രമാണിക്കുന്നവർ അത്രേ ഭാഗ്യവാന്മാർ.'
      easy_to_miss: 'യേശു തന്റെ അമ്മയുടെ ഭാഗ്യം നിഷേധിക്കുന്നില്ല. അതിന്റെ ഉറവിടത്തിലേക്ക് അവൻ വിരൽചൂണ്ടുന്നു: മറിയം ദൈവവചനം കേട്ട്, “നിന്റെ വാക്കുപോലെ എനിക്കു ഭവിക്കട്ടെ” എന്നു പറഞ്ഞു.'
    - verses: മത്തായി 12:46–48
      title: നിന്റെ അമ്മ പുറത്തുനില്ക്കുന്നു
      text: 'യേശു സംസാരിച്ചുകൊണ്ടിരിക്കെ, അവന്റെ അമ്മയും സഹോദരന്മാരും അവനോടു സംസാരിപ്പാൻ ആഗ്രഹിച്ചു പുറത്തുനില്ക്കുന്നു. ഒരാൾ അത് അവനോടു പറയുന്നു. അവൻ ചോദിക്കുന്നു: എന്റെ അമ്മ ആർ? എന്റെ സഹോദരന്മാർ ആർ?'
      easy_to_miss: ഇവിടെ ‘സഹോദരന്മാർ’ എന്നതിനെ, ആ വാക്കിനു പലപ്പോഴും ഉണ്ടായിരുന്ന അർത്ഥത്തിൽ, അടുത്ത ബന്ധുക്കൾ എന്നാണ് സഭ മനസ്സിലാക്കിയിട്ടുള്ളത്.
    - verses: മത്തായി 12:49–50
      title: പിതാവിന്റെ ഇഷ്ടം ചെയ്യുന്നവൻ
      text: 'ശിഷ്യന്മാരുടെ നേരെ കൈ നീട്ടി അവൻ പറയുന്നു: ഇതാ, എന്റെ അമ്മയും എന്റെ സഹോദരന്മാരും. സ്വർഗ്ഗസ്ഥനായ എന്റെ പിതാവിന്റെ ഇഷ്ടം ചെയ്യുന്നവൻ എന്റെ സഹോദരനും സഹോദരിയും അമ്മയും ആകുന്നു.'
      easy_to_miss: പിതാവിന്റെ ഇഷ്ടം ചെയ്യുന്നതിന്റെ ആദ്യത്തെയും ഏറ്റവും നല്ലതുമായ മാതൃക മറിയമാണ്. അവൾ രണ്ടു വിധത്തിൽ യേശുവിന്റെ കുടുംബത്തിൽ ഉൾപ്പെടുന്നു.
    - verses: യോഹന്നാൻ 19:25–27
      title: ഇതാ നിന്റെ അമ്മ
      text: 'ക്രൂശിന്നരികെ അവന്റെ അമ്മയും മറ്റു സ്ത്രീകളും നില്ക്കുന്നു. യേശു തന്റെ അമ്മയും താൻ സ്നേഹിച്ച ശിഷ്യനും നില്ക്കുന്നതു കണ്ടിട്ട് അമ്മയോടു പറയുന്നു: സ്ത്രീയേ, ഇതാ നിന്റെ മകൻ. പിന്നെ ശിഷ്യനോട്: ഇതാ നിന്റെ അമ്മ. ആ നാഴികമുതൽ ആ ശിഷ്യൻ അവളെ തന്റെ വീട്ടിൽ കൈക്കൊള്ളുന്നു.'
      easy_to_miss: ഇവിടെയും കാനാവിലും (യോഹന്നാൻ 2:4) യേശു അവളെ “സ്ത്രീയേ” എന്നു വിളിക്കുന്നു. കല്യാണവും ക്രൂശും യോഹന്നാന്റെ സുവിശേഷത്തിൽ അവളുടെ സ്ഥാനത്തിനു ചട്ടക്കൂടൊരുക്കുന്നു.
    people:
    - name: ദൈവമാതാവായ മറിയം
      role: യേശുവിന്റെ അമ്മ; ഈ പെരുന്നാളിൽ സഭ അവളെ ബഹുമാനിക്കുന്നു.
      name_meaning: എബ്രായയിൽ മിര്യാം; അർത്ഥം നിശ്ചയമില്ല
      ml: Mary, Mother of God
    - name: യേശു സ്നേഹിച്ച ശിഷ്യൻ
      role: പാരമ്പര്യമനുസരിച്ച് യോഹന്നാൻ; മറിയത്തെ തന്റെ വീട്ടിൽ കൈക്കൊണ്ടവൻ.
      name_meaning: —
      ml: The beloved disciple
    phrases:
    - term: ശൂനോയോ
      explanation: വിശുദ്ധ മറിയം ഈ ജീവിതത്തിൽനിന്നു വാങ്ങിപ്പോയതിന്റെയും സ്വർഗ്ഗാരോപണത്തിന്റെയും പെരുന്നാളിനുള്ള സുറിയാനിപ്പേര്; ആഗസ്റ്റ് 15-ന് ആചരിക്കുന്നു.
    - term: പതിനഞ്ചു നോമ്പ്
      explanation: ഈ പെരുന്നാളിന് ഒരുക്കമായി ആഗസ്റ്റ് 1 മുതൽ 15 വരെ മലങ്കരസഭ നോമ്പ് ആചരിക്കുന്നു.
    - term: മർത്തമറിയം സമാജം
      explanation: മലങ്കര ഓർത്തഡോക്സ് സഭയിലെ സ്ത്രീകളുടെ സംഘടന; ഈ ദിവസം അതിന്റെ സ്വന്തം ദിനമായി ആചരിക്കുന്നു.
    reflection:
      title_en: അവൾ വചനം കേട്ടു പ്രമാണിച്ചു
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        മറിയത്തെക്കുറിച്ച് നമ്മിൽ പലർക്കും തോന്നുന്നതാണ് പുരുഷാരത്തിലെ ആ സ്ത്രീ പറയുന്നത്: ഇങ്ങനെയൊരു പുത്രന്റെ അമ്മ എത്ര ഭാഗ്യവതിയായിരിക്കും. യേശു അതു സമ്മതിക്കുന്നു; എന്നിട്ട് കൂടുതൽ ആഴത്തിലേക്കു വിരൽചൂണ്ടുന്നു. ദൈവത്തിന്റെ വചനം കേട്ടു പ്രമാണിക്കുന്നവർ ഭാഗ്യവാന്മാർ. അവന്റെ അമ്മയെക്കാൾ പൂർണ്ണമായി അതു ചെയ്ത ആരുമില്ല.

        ഗബ്രീയേലിൽനിന്നു മറിയം വചനം കേട്ടു, സമ്മതം മൂളി. തനിക്കു മനസ്സിലാകാത്തത് അവൾ ഹൃദയത്തിൽ സംഗ്രഹിച്ചു. ശിഷ്യന്മാരിൽ മിക്കവരും ഓടിപ്പോയപ്പോൾ അവൾ ക്രൂശിന്നരികെ നിന്നു. മരിക്കുമ്പോൾ യേശു അവളെ താൻ സ്നേഹിച്ച ശിഷ്യന് അമ്മയായി നല്കി; അന്നുമുതൽ സഭ അവളെ അമ്മയായി സ്വീകരിച്ചിരിക്കുന്നു.

        ശൂനോയോയിൽ, ഈ ജീവിതത്തിൽനിന്നു തന്റെ പുത്രന്റെ സന്നിധിയിലേക്കുള്ള അവളുടെ വാങ്ങിപ്പു നാം ആഘോഷിക്കുന്നു. നാം പിന്തുടരാൻ ആശിക്കുന്നിടത്തേക്ക് അവൾ നമുക്കു മുമ്പേ പോകുന്നു. അവൾ സ്വീകരിച്ച വഴി എല്ലാവർക്കുമായി തുറന്നിരിക്കുന്നു: ദൈവവചനം കേൾക്കുക, അതു പ്രമാണിക്കുക, ക്രൂശിൽപോലും യേശുവിനോടു ചേർന്നുനില്ക്കുക. അങ്ങനെയാണ് നാമും അവന്റെ കുടുംബമാകുന്നത്.
      title_ml: She heard the word and kept it
    week:
      question: മറിയത്തെപ്പോലെ സൂക്ഷിച്ചുവെക്കാൻ നിങ്ങൾ ആഗ്രഹിക്കുന്ന, ദൈവം നിങ്ങളോടു പറഞ്ഞ ഒരു കാര്യം എന്താണ്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ചത്തെ വായനകളിൽനിന്ന് ഒരു വാക്യം കുടുംബമായി മനഃപാഠമാക്കുക; ഭക്ഷണത്തിനു മുമ്പ് ഒരുമിച്ച് അതു ചൊല്ലുക.
      prayer: വചനം കേട്ടു പ്രമാണിച്ച വിശുദ്ധ ദൈവമാതാവേ, ഞങ്ങൾക്കുവേണ്ടി പ്രാർത്ഥിക്കേണമേ. കർത്താവായ യേശുവേ, നിന്റെ അമ്മയെ നീ സ്നേഹിച്ച ശിഷ്യനെ ഏല്പിച്ചതുപോലെ, ഞങ്ങളും അവളെ ഞങ്ങളുടെ വീട്ടിൽ കൈക്കൊള്ളുവാനും അവളുടെ വിശ്വാസമാതൃക പിന്തുടരുവാനും ഇടയാക്കേണമേ. ആമേൻ.
