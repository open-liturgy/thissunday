one_minute:
  what_happens: Three short Gospel passages are read. A woman in the crowd blesses Jesus’ mother, and he says those who hear and keep God’s word are blessed. He says whoever does the Father’s will is his mother. On the cross he gives his mother to the beloved disciple.
  why_this_sunday: 15 August is the feast of Shunoyo, the falling asleep and assumption of St. Mary. When it falls on a Sunday, it is kept that day. The Church prepares for it with a fifteen-day fast.
  take_with_you: Mary is blessed because she bore Christ, and even more because she heard God’s word and kept it.
readings_thread: Moses sees the bush that burns and is not consumed, and Ezekiel sees the gate the Lord enters that stays shut. The Church has long seen Mary in both. Acts shows her praying with the apostles, and Hebrews describes the ark that held God’s covenant.
key_verse:
  ref: John 19:27
  ml: 'പിന്നെ ശിഷ്യനോടു: ഇതാ നിന്റെ അമ്മ എന്നും പറഞ്ഞു. ആ നാഴികമുതൽ ആ ശിഷ്യൻ അവളെ തന്റെ വീട്ടിൽ കൈക്കൊണ്ടു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: Then he said to the disciple, “Behold, your mother!” From that hour, the disciple took her to his own home.
  en_translation: World English Bible
scenes:
- verses: Luke 11:27
  title: Blessed is the womb
  text: 'As Jesus teaches, a woman in the crowd calls out: blessed is the womb that bore you and the breasts that nursed you.'
  easy_to_miss: 'This fulfils Mary’s own words: “all generations will call me blessed” (Luke 1:48).'
- verses: Luke 11:28
  title: Hear and keep
  text: 'Jesus replies: blessed rather are those who hear the word of God and keep it.'
  easy_to_miss: 'Jesus does not deny his mother’s blessing. He points to its source: Mary heard God’s word and said “let it be”.'
- verses: Matthew 12:46–48
  title: Your mother is outside
  text: 'While Jesus is speaking, his mother and brothers stand outside wanting to speak to him. Someone tells him. He asks: who is my mother, and who are my brothers?'
  easy_to_miss: The Church has understood “brothers” here as close relatives, as the word often meant.
- verses: Matthew 12:49–50
  title: Whoever does the Father’s will
  text: 'Pointing to his disciples, he says: here are my mother and my brothers. Whoever does the will of my Father in heaven is my brother, sister and mother.'
  easy_to_miss: Mary is the first and best example of doing the Father’s will. She belongs to Jesus’ family twice over.
- verses: John 19:25–27
  title: Behold your mother
  text: 'Near the cross stand his mother and other women. Jesus sees his mother and the disciple he loves. Woman, here is your son, he says. To the disciple: here is your mother. From that hour the disciple takes her into his home.'
  easy_to_miss: Jesus calls her “woman” here and at Cana (John 2:4). The wedding and the cross frame her place in John’s Gospel.
