phrases:
- term: Shunoyo
  explanation: Syriac name for the feast of St. Mary’s passing from this life and her assumption, kept on 15 August.
- term: Fifteen-day fast
  explanation: The Malankara Church fasts from 1 to 15 August in preparation for this feast.
- term: Martha Mariam Samajam
  explanation: The women’s organisation of the Malankara Orthodox Church, which keeps this day as its own.
reflection:
  title_en: She heard the word and kept it
  title_ml: അവൾ വചനം കേട്ടു പ്രമാണിച്ചു
  read_time: A three-minute read
  body: |-
    The woman in the crowd says what many of us feel about Mary: how blessed must the mother of such a son be. Jesus agrees, and then points deeper. Blessed are those who hear God’s word and keep it. Nobody did that more completely than his mother.

    Mary heard the word from Gabriel and said yes. She kept what she did not understand in her heart. She stood by the cross when most of the disciples had run. Jesus, dying, gave her to the beloved disciple as his mother, and the Church has received her as mother ever since.

    On Shunoyo we celebrate her passing from this life into the presence of her Son. She goes ahead of us where we hope to follow. The way she took is open to all: hearing God’s word, keeping it, and staying near Jesus even at the cross. That is how we become his family too.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What is one thing God has said to you that you want to keep, like Mary did?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Learn one verse from this week’s readings by heart as a family, and say it together before meals.
  prayer: Holy Mother of God, who heard the word and kept it, pray for us. Lord Jesus, as you gave your mother to the beloved disciple, let us also take her into our home and follow her example of faith. Amen.
