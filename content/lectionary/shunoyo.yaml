tagline: The Mother of God, who heard the word and kept it
standfirst: 'The Church celebrates the passing of St. Mary from this life. The Gospels it reads show her as Jesus himself saw her: the one who heard God’s word and kept it, and who stood by the cross.'
description: Readings for Shunoyo, the feast of St. Mary’s Assumption, with Luke 11:27–28, Matthew 12:46–50 and John 19:25–27 explained. Reflection and question.
