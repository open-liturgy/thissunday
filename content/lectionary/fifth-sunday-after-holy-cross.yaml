  en: Sleeba
  gloss: The season of the Cross
  syr: ܨܠܝܒܐ
tagline: The greatest among you will be your servant
standfirst: Jesus warns the crowds about religious leaders who say the right things and do not do them, who love titles and the best seats. The greatest among you, he says, will be the servant.
description: Readings for the Fifth Sunday after Holy Cross, with Matthew 23:1–12, the greatest as servant, explained. Reflection and question.
hero_quote:
  text: All things therefore whatever they tell you to observe, observe and do, but don’t do their works; for they say, and don’t do.
  ref: Matthew 23:3
