one_minute:
  what_happens: Jesus tells the crowds and his disciples to do what the scribes and Pharisees teach, but not to copy what they do. They tie heavy burdens on others, do their deeds to be seen, and love titles and places of honour. The greatest among you will be your servant.
  why_this_sunday: Near the end of the Church year, the readings turn to how leaders and believers should live. The morning Gospel is about the greatest commandment.
  take_with_you: Titles are given by people. Greatness, in Jesus’ kingdom, is measured by service.
readings_thread: Leviticus describes the grain offering, a simple gift of flour and oil. The psalm says God is our refuge and strength, and Isaiah says those who wait on the Lord will renew their strength. Paul charges Timothy to keep the faith without stain.
key_verse:
  ref: Matthew 23:11
  ml: നിങ്ങളിൽ ഏറ്റവും വലിയവൻ നിങ്ങളുടെ ശുശ്രൂഷക്കാരൻ ആകേണം.
  ml_translation: Sathyavedapusthakam, 1910
  en: But he who is greatest among you will be your servant.
  en_translation: World English Bible
scenes:
- verses: Matthew 23:1–3
  title: Moses’ seat
  text: The scribes and Pharisees sit on Moses’ seat. So do what they tell you, but do not do what they do, because they do not practise what they teach.
  easy_to_miss: Jesus respects their teaching office. His complaint is about the gap between words and life.
- verses: Matthew 23:4
  title: Heavy burdens
  text: They tie up heavy burdens and lay them on people’s shoulders, but will not lift a finger to move them.
  easy_to_miss: 'Compare Jesus: “my yoke is easy and my burden is light” (Matthew 11:30).'
- verses: Matthew 23:5–7
  title: To be seen
  text: 'They do everything to be seen: wide prayer boxes, long tassels, the best seats at feasts and in synagogues, greetings in the market, being called rabbi.'
  easy_to_miss: 'None of these things is wrong in itself. The problem is the reason: “to be seen by people”.'
- verses: Matthew 23:8–10
  title: One teacher, one Father
  text: Do not be called rabbi, for you have one teacher and you are all brothers. Call no one on earth your father, for you have one Father in heaven. Do not be called instructors; you have one instructor, the Christ.
  easy_to_miss: Paul still calls himself a father to his converts (1 Corinthians 4:15). Jesus is warning against titles that take God’s place, not banning words.
- verses: Matthew 23:11–12
  title: The greatest is the servant
  text: The greatest among you will be your servant. Whoever exalts himself will be humbled, and whoever humbles himself will be exalted.
  easy_to_miss: 'Jesus said the same about himself: the Son of Man came not to be served but to serve (Matthew 20:28).'
people:
- name: The scribes and Pharisees
  ml: ശാസ്ത്രിമാരും പരീശന്മാരും
  role: Teachers of the law with real authority, criticised for not living it.
  name_meaning: —
phrases:
- term: Moses’ seat
  explanation: The authority to teach the law of Moses. Some synagogues had an actual stone seat for the teacher.
- term: Phylacteries
  explanation: Small leather boxes holding Scripture verses, worn on the forehead and arm during prayer (Deuteronomy 6:8).
- term: Rabbi
  explanation: Hebrew for “my great one”, a respectful title for a teacher.
reflection:
  title_en: Practise what you preach
  title_ml: പറയുന്നതു ചെയ്യുക
  read_time: A three-minute read
  body: |-
    This Gospel is uncomfortable for anyone with any kind of authority: priests, parents, teachers, committee members, older siblings. Jesus does not say the Pharisees taught the wrong things. He says they did not live them, and they liked being honoured more than serving.

    It is easy to point at others while reading this. Jesus means us to look at ourselves. Do we ask more of our children than we ask of ourselves? Do we enjoy titles and front seats? Do we lay burdens on people and then walk away?

    The answer Jesus gives is simple and hard. The greatest is the servant. He showed what that means when he washed his disciples’ feet and went to the cross. In a family or a parish, the person who most resembles Christ is not the one with the title. It is the one who serves without being seen.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Is there something we ask of others at home that we do not do ourselves?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: 'Parents and older siblings: do one task you usually ask the younger ones to do, without comment.'
  prayer: Lord Jesus, you came not to be served but to serve. Make our words and our lives match, free us from love of honour, and make us servants of one another. Amen.
translations:
  ml:
    name:
      en: സ്ലീബാ പെരുന്നാളിനു ശേഷം അഞ്ചാം ഞായർ
      ml: Fifth Sunday after Holy Cross
    season:
      en: സ്ലീബാ
      gloss: സ്ലീബായുടെ കാലം
    tagline: നിങ്ങളിൽ ഏറ്റവും വലിയവൻ നിങ്ങളുടെ ശുശ്രൂഷക്കാരൻ ആകേണം
    standfirst: ശരിയായതു പറയുകയും അതു ചെയ്യാതിരിക്കുകയും, സ്ഥാനപ്പേരുകളും മുഖ്യാസനങ്ങളും ഇഷ്ടപ്പെടുകയും ചെയ്യുന്ന മതനേതാക്കളെക്കുറിച്ച് യേശു പുരുഷാരത്തിനു മുന്നറിയിപ്പു നല്കുന്നു. നിങ്ങളിൽ ഏറ്റവും വലിയവൻ ശുശ്രൂഷക്കാരൻ ആയിരിക്കണം എന്ന് അവൻ പറയുന്നു.
    description: 'സ്ലീബാ പെരുന്നാളിനു ശേഷം അഞ്ചാം ഞായറിലെ വായനകൾ, വലിയവൻ ശുശ്രൂഷക്കാരൻ: മത്തായി 23:1–12 വിശദീകരണം. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: ശാസ്ത്രിമാരും പരീശന്മാരും ഉപദേശിക്കുന്നതു ചെയ്യാനും എന്നാൽ അവരുടെ പ്രവൃത്തികൾ അനുകരിക്കാതിരിക്കാനും യേശു പുരുഷാരത്തോടും ശിഷ്യന്മാരോടും പറയുന്നു. അവർ ഘനമുള്ള ചുമടുകൾ മറ്റുള്ളവരുടെ തോളിൽ വെക്കുന്നു, മനുഷ്യർ കാണേണ്ടതിനു പ്രവൃത്തികൾ ചെയ്യുന്നു, സ്ഥാനപ്പേരുകളും ബഹുമാനസ്ഥാനങ്ങളും ഇഷ്ടപ്പെടുന്നു. നിങ്ങളിൽ ഏറ്റവും വലിയവൻ നിങ്ങളുടെ ശുശ്രൂഷക്കാരൻ ആകേണം.
      why_this_sunday: സഭാവർഷത്തിന്റെ അവസാനത്തോടടുത്ത്, നേതാക്കളും വിശ്വാസികളും എങ്ങനെ ജീവിക്കണം എന്നതിലേക്കു വായനകൾ തിരിയുന്നു. പ്രഭാതത്തിലെ സുവിശേഷം ഏറ്റവും വലിയ കല്പനയെക്കുറിച്ചാണ്.
      take_with_you: സ്ഥാനപ്പേരുകൾ മനുഷ്യർ നല്കുന്നതാണ്. യേശുവിന്റെ രാജ്യത്തിൽ വലിപ്പം അളക്കുന്നതു ശുശ്രൂഷകൊണ്ടാണ്.
    readings_thread: ലേവ്യപുസ്തകം ഭോജനയാഗത്തെ, മാവും എണ്ണയും കൊണ്ടുള്ള ഒരു ലളിതമായ കാഴ്ചയെ, വിവരിക്കുന്നു. ദൈവം നമ്മുടെ സങ്കേതവും ബലവും എന്നു സങ്കീർത്തനം പറയുന്നു; “യഹോവയെ കാത്തിരിക്കുന്നവർ ശക്തിയെ പുതുക്കും” എന്ന് യെശയ്യാവും. വിശ്വാസം കളങ്കമില്ലാതെ കാക്കാൻ പൌലൊസ് തിമൊഥെയൊസിനോടു കല്പിക്കുന്നു.
    scenes:
    - verses: മത്തായി 23:1–3
      title: മോശെയുടെ പീഠം
      text: ശാസ്ത്രിമാരും പരീശന്മാരും മോശെയുടെ പീഠത്തിൽ ഇരിക്കുന്നു. ആകയാൽ അവർ നിങ്ങളോടു പറയുന്നതു ഒക്കെയും പ്രമാണിച്ചു ചെയ്‌വിൻ; അവരുടെ പ്രവൃത്തികൾപോലെ ചെയ്യരുതു താനും. അവർ പറയുന്നതല്ലാതെ ചെയ്യുന്നില്ലല്ലോ.
      easy_to_miss: അവരുടെ ഉപദേശസ്ഥാനത്തെ യേശു മാനിക്കുന്നു. വാക്കിനും ജീവിതത്തിനും ഇടയിലുള്ള അകലമാണ് അവന്റെ പരാതി.
    - verses: മത്തായി 23:4
      title: ഘനമുള്ള ചുമടുകൾ
      text: അവർ ഘനമുള്ള ചുമടുകളെ കെട്ടി മനുഷ്യരുടെ തോളിൽ വെക്കുന്നു; ഒരു വിരൽ കൊണ്ടുപോലും അവയെ തൊടുവാൻ അവർക്കു മനസ്സില്ല.
      easy_to_miss: 'യേശുവിന്റെ വാക്കുമായി ഒത്തുനോക്കുക: “എന്റെ നുകം മൃദുവും എന്റെ ചുമടു ലഘുവും ആകുന്നു” (മത്തായി 11:30).'
    - verses: മത്തായി 23:5–7
      title: മനുഷ്യർ കാണേണ്ടതിന്
      text: 'അവർ എല്ലാം മനുഷ്യർ കാണേണ്ടതിന്നു ചെയ്യുന്നു: വീതിയുള്ള മന്ത്രപ്പട്ട, വലിയ തൊങ്ങൽ, അത്താഴത്തിൽ പ്രധാനസ്ഥലം, പള്ളിയിൽ മുഖ്യാസനം, അങ്ങാടിയിൽ വന്ദനം, റബ്ബീ എന്ന വിളി.'
      easy_to_miss: 'ഇവയിൽ ഒന്നും തന്നെ സ്വയം തെറ്റല്ല. പ്രശ്നം അതിന്റെ കാരണമാണ്: “മനുഷ്യർ കാണേണ്ടതിന്നത്രേ”.'
    - verses: മത്തായി 23:8–10
      title: ഒരു ഗുരു, ഒരു പിതാവ്
      text: നിങ്ങളോ റബ്ബീ എന്നു പേർ എടുക്കരുതു; ഒരുത്തൻ അത്രേ നിങ്ങളുടെ ഗുരു; നിങ്ങളോ എല്ലാവരും സഹോദരന്മാർ. ഭൂമിയിൽ ആരെയും പിതാവു എന്നു വിളിക്കരുതു; ഒരുത്തൻ അത്രേ നിങ്ങളുടെ പിതാവു, സ്വർഗ്ഗസ്ഥൻ തന്നേ. നായകന്മാർ എന്നും പേർ എടുക്കരുതു; ഒരുത്തൻ അത്രേ നിങ്ങളുടെ നായകൻ, ക്രിസ്തു തന്നെ.
      easy_to_miss: പൌലൊസ് താൻ മാനസാന്തരപ്പെടുത്തിയവരുടെ പിതാവ് എന്നു തന്നെക്കുറിച്ചു പറയുന്നുണ്ട് (1 കൊരിന്ത്യർ 4:15). വാക്കുകൾ വിലക്കുകയല്ല, ദൈവത്തിന്റെ സ്ഥാനം കൈയടക്കുന്ന സ്ഥാനപ്പേരുകൾക്കെതിരെ മുന്നറിയിപ്പു നല്കുകയാണ് യേശു.
    - verses: മത്തായി 23:11–12
      title: ഏറ്റവും വലിയവൻ ശുശ്രൂഷക്കാരൻ
      text: നിങ്ങളിൽ ഏറ്റവും വലിയവൻ നിങ്ങളുടെ ശുശ്രൂഷക്കാരൻ ആകേണം. തന്നെത്താൻ ഉയർത്തുന്നവൻ എല്ലാം താഴ്ത്തപ്പെടും; തന്നെത്താൻ താഴ്ത്തുന്നവൻ എല്ലാം ഉയർത്തപ്പെടും.
      easy_to_miss: 'യേശു തന്നെക്കുറിച്ചും ഇതുതന്നെ പറഞ്ഞു: “മനുഷ്യപുത്രൻ ശുശ്രൂഷ ചെയ്യിപ്പാനല്ല ശുശ്രൂഷിപ്പാനും” വന്നു (മത്തായി 20:28).'
    people:
    - name: ശാസ്ത്രിമാരും പരീശന്മാരും
      role: യഥാർത്ഥ അധികാരമുള്ള ന്യായപ്രമാണോപദേഷ്ടാക്കൾ; അതു ജീവിക്കാത്തതിനാൽ വിമർശിക്കപ്പെടുന്നു.
      name_meaning: —
      ml: The scribes and Pharisees
    phrases:
    - term: മോശെയുടെ പീഠം
      explanation: മോശെയുടെ ന്യായപ്രമാണം പഠിപ്പിക്കാനുള്ള അധികാരം. ചില പള്ളികളിൽ ഉപദേഷ്ടാവിനായി ഒരു കല്ലുകൊണ്ടുള്ള ഇരിപ്പിടം ഉണ്ടായിരുന്നു.
    - term: മന്ത്രപ്പട്ട
      explanation: തിരുവെഴുത്തു വാക്യങ്ങൾ ഉള്ളിൽ വെച്ച ചെറിയ തുകൽപ്പെട്ടികൾ; പ്രാർത്ഥനാസമയത്ത് നെറ്റിയിലും കൈയിലും കെട്ടിയിരുന്നു (ആവർത്തനം 6:8).
    - term: റബ്ബീ
      explanation: ‘എന്റെ വലിയവനേ’ എന്നർത്ഥമുള്ള എബ്രായവാക്ക്; ഉപദേഷ്ടാവിനുള്ള ബഹുമാനസൂചകമായ സ്ഥാനപ്പേര്.
    reflection:
      title_en: പറയുന്നതു ചെയ്യുക
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ഏതെങ്കിലും വിധത്തിൽ അധികാരമുള്ള എല്ലാവർക്കും ഈ സുവിശേഷം അസ്വസ്ഥതയുണ്ടാക്കുന്നു: പുരോഹിതന്മാർ, മാതാപിതാക്കൾ, അദ്ധ്യാപകർ, കമ്മിറ്റിയംഗങ്ങൾ, മൂത്ത സഹോദരങ്ങൾ. പരീശന്മാർ തെറ്റായതു പഠിപ്പിച്ചു എന്ന് യേശു പറയുന്നില്ല. അവർ അതു ജീവിച്ചില്ല എന്നും, ശുശ്രൂഷിക്കുന്നതിനെക്കാൾ ബഹുമാനിക്കപ്പെടുന്നത് അവർക്ക് ഇഷ്ടമായിരുന്നു എന്നും അവൻ പറയുന്നു.

        ഇതു വായിക്കുമ്പോൾ മറ്റുള്ളവരെ ചൂണ്ടിക്കാണിക്കാൻ എളുപ്പമാണ്. നാം നമ്മളിലേക്കുതന്നെ നോക്കണം എന്നാണ് യേശു ഉദ്ദേശിക്കുന്നത്. നാം നമ്മോടു ചോദിക്കുന്നതിനെക്കാൾ അധികം നമ്മുടെ മക്കളോടു ചോദിക്കുന്നുണ്ടോ? സ്ഥാനപ്പേരുകളും മുൻനിരയിലെ ഇരിപ്പിടങ്ങളും നമുക്ക് ഇഷ്ടമാണോ? മനുഷ്യരുടെ മേൽ ഭാരം വെച്ചിട്ടു നാം മാറിപ്പോകുന്നുണ്ടോ?

        യേശു നല്കുന്ന ഉത്തരം ലളിതവും കഠിനവുമാണ്. ഏറ്റവും വലിയവൻ ശുശ്രൂഷക്കാരനാണ്. ശിഷ്യന്മാരുടെ കാലുകൾ കഴുകിയും ക്രൂശിലേക്കു പോയും അതിന്റെ അർത്ഥം അവൻ കാണിച്ചുതന്നു. ഒരു കുടുംബത്തിലോ ഇടവകയിലോ ക്രിസ്തുവിനോട് ഏറ്റവും സാദൃശ്യമുള്ളയാൾ സ്ഥാനപ്പേരുള്ളയാളല്ല. ആരും കാണാതെ ശുശ്രൂഷിക്കുന്നയാളാണ്.
      title_ml: Practise what you preach
    week:
      question: നാം സ്വയം ചെയ്യാത്ത എന്തെങ്കിലും വീട്ടിൽ മറ്റുള്ളവരോടു ചെയ്യാൻ ആവശ്യപ്പെടുന്നുണ്ടോ?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: 'മാതാപിതാക്കളും മൂത്ത സഹോദരങ്ങളും: ഇളയവരോടു സാധാരണ ചെയ്യാൻ പറയുന്ന ഒരു ജോലി, ഒന്നും പറയാതെ, സ്വയം ചെയ്യുക.'
      prayer: കർത്താവായ യേശുവേ, നീ ശുശ്രൂഷ ചെയ്യിപ്പാനല്ല ശുശ്രൂഷിപ്പാൻ വന്നു. ഞങ്ങളുടെ വാക്കുകളും ജീവിതവും ഒന്നായിരിക്കട്ടെ; ബഹുമാനമോഹത്തിൽനിന്നു ഞങ്ങളെ സ്വതന്ത്രരാക്കേണമേ; ഞങ്ങളെ പരസ്പരം ശുശ്രൂഷക്കാരാക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 20:27–40
        ml: ലൂക്കൊസ് 20:27–40
        note: അവൻ മരിച്ചവരുടെ ദൈവമല്ല, ജീവനുള്ളവരുടെ ദൈവമത്രേ.
        printed: St. Luke 20:27-40
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 22:34–44
        ml: മത്തായി 22:34–44
        note: 'ഏറ്റവും വലിയ കല്പന: ദൈവത്തെ സ്നേഹിക്ക, കൂട്ടുകാരനെ നിന്നെപ്പോലെ തന്നേ സ്നേഹിക്ക.'
        printed: St. Matthew 22:34-44
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Leviticus 2:1–3
        ml: ലേവ്യപുസ്തകം 2:1–3
        note: എണ്ണയും കുന്തുരുക്കവും ചേർത്ത നേരിയ മാവുകൊണ്ടുള്ള ഭോജനയാഗം.
        printed: Leviticus 2:1-3
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Psalm 46
        ml: സങ്കീർത്തനങ്ങൾ 46
        note: ദൈവം നമ്മുടെ സങ്കേതവും ബലവും ആകുന്നു; മിണ്ടാതിരുന്നു, ഞാൻ ദൈവം എന്ന് അറിഞ്ഞുകൊൾവിൻ.
        printed: Psalms 46
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 40:27–31
        ml: യെശയ്യാവ് 40:27–31
        note: യഹോവയെ കാത്തിരിക്കുന്നവർ ശക്തിയെ പുതുക്കും; അവർ കഴുകന്മാരെപ്പോലെ ചിറകടിച്ചു കയറും.
        printed: Isaiah 40:27-31
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 22:22–29
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 22:22–29
        note: പുരുഷാരം പൌലൊസിനെതിരെ തിരിയുന്നു; അവൻ റോമപൌരൻ എന്ന നിലയിലുള്ള അവകാശം ഉന്നയിക്കുന്നു.
        printed: Acts 22:22-29
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 1 Timothy 6:13–21
        ml: 1 തിമൊഥെയൊസ് 6:13–21
        note: ധനവാന്മാരോട് ഉന്നതഭാവം കൂടാതെ സൽപ്രവൃത്തികളിൽ സമ്പന്നരാകുവാൻ ആജ്ഞാപിക്ക.
        printed: I Timothy 6:13-21
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 23:1–12
        ml: മത്തായി 23:1–12
        note: അവർ ഉപദേശിക്കുന്നതു ചെയ്‌വിൻ, അവർ ചെയ്യുന്നതുപോലെ ചെയ്യരുത്; നിങ്ങളിൽ ഏറ്റവും വലിയവൻ നിങ്ങളുടെ ശുശ്രൂഷക്കാരൻ ആകേണം. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Matthew 23:1-12
        main: true
    key_verse:
      ref: മത്തായി 23:11
    hero_quote:
      text: ആകയാൽ അവർ നിങ്ങളോടു പറയുന്നതു ഒക്കെയും പ്രമാണിച്ചു ചെയ്‌വിൻ; അവരുടെ പ്രവൃത്തികൾപോലെ ചെയ്യരുതു താനും. അവർ പറയുന്നതല്ലാതെ ചെയ്യുന്നില്ലല്ലോ.
      ref: മത്തായി 23:3
