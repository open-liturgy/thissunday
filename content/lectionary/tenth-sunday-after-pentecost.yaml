one_minute:
  what_happens: The disciples ask who is greatest. Jesus puts a child among them and says unless they become like children they will not enter the kingdom. Whoever welcomes a child welcomes him. He warns against causing little ones to stumble, and says their angels see the Father’s face.
  why_this_sunday: In the middle of the long season after Pentecost, the Church reads Jesus’ teaching on the little ones of his kingdom.
  take_with_you: Jesus did not just talk about children. He put one in the middle.
readings_thread: Water at Marah is made sweet, and Job is restored and prays for his friends. The psalm blesses the generous person. Paul says that all who call on the Lord will be saved, and asks how they will hear unless someone is sent.
key_verse:
  ref: Matthew 18:3
  ml: നിങ്ങൾ തിരിഞ്ഞു ശിശുക്കളെപ്പോലെ ആയ്‌വരുന്നില്ല എങ്കിൽ സ്വർഗ്ഗരാജ്യത്തിൽ കടക്കയില്ല എന്നു ഞാൻ സത്യമായിട്ടു നിങ്ങളോടു പറയുന്നു.
  ml_translation: Sathyavedapusthakam, 1910
  en: and said, “Most certainly I tell you, unless you turn, and become as little children, you will in no way enter into the Kingdom of Heaven.
  en_translation: World English Bible
scenes:
- verses: Matthew 18:1–2
  title: A child in the middle
  text: 'The disciples ask: who is the greatest in the kingdom of heaven? Jesus calls a child and puts the child in the middle of them.'
  easy_to_miss: Children had no status in that world. Jesus places the least important person at the centre.
- verses: Matthew 18:3–4
  title: Become like children
  text: Unless you turn and become like children, you will never enter the kingdom. Whoever humbles himself like this child is the greatest.
  easy_to_miss: The question was about being greatest. Jesus answers that the first problem is getting in at all.
- verses: Matthew 18:5–6
  title: Welcome, and do not harm
  text: Whoever welcomes one such child in my name welcomes me. But whoever causes one of these little ones who believe in me to stumble would be better drowned with a millstone round his neck.
  easy_to_miss: Jesus identifies himself with the child, as he does with the hungry and the stranger in Matthew 25.
- verses: Matthew 18:7–9
  title: Cut it off
  text: Woe to the world because of stumbling blocks. If your hand or foot or eye causes you to stumble, cut it off. Better to enter life maimed than to be thrown into fire whole.
  easy_to_miss: Jesus turns from those who make others stumble to what makes us stumble ourselves.
- verses: Matthew 18:10–11
  title: Their angels
  text: Do not despise one of these little ones. Their angels in heaven always see the face of my Father.
  easy_to_miss: Verse 11, “the Son of Man came to save the lost”, is missing from some old manuscripts. It leads into the parable of the lost sheep.
