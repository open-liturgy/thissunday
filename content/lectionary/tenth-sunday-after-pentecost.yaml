phrases:
- term: Little ones
  explanation: Children, and also humble believers who are easily hurt or led astray.
- term: Millstone
  explanation: A huge stone for grinding grain, turned by a donkey. Tied to someone’s neck, it meant certain drowning.
- term: Their angels
  explanation: The Church’s teaching on guardian angels draws on this verse.
reflection:
  title_en: A child in the middle
  title_ml: നടുവിൽ ഒരു ശിശു
  read_time: A three-minute read
  body: |-
    The disciples wanted a ranking. Who is greatest? Who gets the best seat when the kingdom comes? Jesus does not give them a list. He calls a child over and puts the child in the middle. In a world where children counted for little, that was a shock.

    He says three things about children. Adults must become like them to enter the kingdom: dependent, trusting, unconcerned with rank. Welcoming a child is welcoming Jesus himself. And harming a child, or leading them away from faith, is among the worst things anyone can do.

    That last warning should make every parish and family careful. Children must be safe in our churches and homes, and their faith must be protected and nourished. Jesus says their angels see the face of the Father. Whatever we do to the little ones, heaven is watching.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What can adults learn from children about faith?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: 'Adults: ask a child to teach you a prayer or song they know. Children: pray for the grown-ups in your family by name.'
  prayer: Lord Jesus, you set a child in the middle of your disciples. Make us humble and trusting like children, keep every child in our Church safe, and let their angels always see your Father’s face. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം പത്താം ഞായർ
      ml: Tenth Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: ഏറ്റവും വലിയവൻ ആർ? നടുവിൽ ഒരു ശിശു
    standfirst: സ്വർഗ്ഗരാജ്യത്തിൽ ഏറ്റവും വലിയവൻ ആർ എന്നു ശിഷ്യന്മാർ യേശുവിനോടു ചോദിക്കുന്നു. ഒരു ചെറിയ ശിശുവിനെ വിളിച്ച് കൂട്ടത്തിന്റെ നടുവിൽ നിറുത്തിക്കൊണ്ടാണ് അവൻ ഉത്തരം പറയുന്നത്.
    description: പെന്തിക്കോസ്തിക്കു ശേഷം പത്താം ഞായറിലെ വായനകൾ, ശിശുക്കളെപ്പോലെ ആകുന്നതിനെക്കുറിച്ചുള്ള മത്തായി 18:1–11 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: ഏറ്റവും വലിയവൻ ആർ എന്നു ശിഷ്യന്മാർ ചോദിക്കുന്നു. യേശു ഒരു ശിശുവിനെ അവരുടെ നടുവിൽ നിറുത്തി, ശിശുക്കളെപ്പോലെ ആയ്‌വരുന്നില്ല എങ്കിൽ അവർ സ്വർഗ്ഗരാജ്യത്തിൽ കടക്കയില്ല എന്നു പറയുന്നു. ഒരു ശിശുവിനെ കൈക്കൊള്ളുന്നവൻ അവനെ കൈക്കൊള്ളുന്നു. ചെറിയവർക്ക് ഇടർച്ച വരുത്തുന്നതിനെതിരെ അവൻ മുന്നറിയിപ്പു നല്കുന്നു; അവരുടെ ദൂതന്മാർ പിതാവിന്റെ മുഖം കാണുന്നു എന്നു പറയുന്നു.
      why_this_sunday: പെന്തിക്കോസ്തിക്കു ശേഷമുള്ള നീണ്ട കാലത്തിന്റെ നടുവിൽ, തന്റെ രാജ്യത്തിലെ ചെറിയവരെക്കുറിച്ചുള്ള യേശുവിന്റെ ഉപദേശം സഭ വായിക്കുന്നു.
      take_with_you: യേശു ശിശുക്കളെക്കുറിച്ചു സംസാരിക്കുക മാത്രമല്ല ചെയ്തത്. അവൻ ഒരാളെ നടുവിൽ നിറുത്തി.
    readings_thread: മാറയിലെ വെള്ളം മധുരമാക്കപ്പെടുന്നു; ഇയ്യോബിന് എല്ലാം തിരികെ ലഭിക്കുന്നു, അവൻ തന്റെ സ്നേഹിതന്മാർക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നു. ഔദാര്യമുള്ളവനെ സങ്കീർത്തനം അനുഗ്രഹിക്കുന്നു. കർത്താവിന്റെ നാമം വിളിച്ചപേക്ഷിക്കുന്ന ഏവനും രക്ഷിക്കപ്പെടും എന്നു പൌലൊസ് പറയുന്നു; ആരെങ്കിലും അയക്കപ്പെടാതെ അവർ എങ്ങനെ കേൾക്കും എന്ന് അവൻ ചോദിക്കുന്നു.
    scenes:
    - verses: മത്തായി 18:1–2
      title: നടുവിൽ ഒരു ശിശു
      text: 'ശിഷ്യന്മാർ ചോദിക്കുന്നു: സ്വർഗ്ഗരാജ്യത്തിൽ ഏറ്റവും വലിയവൻ ആർ? യേശു ഒരു ശിശുവിനെ അടുക്കെ വിളിച്ച് അവരുടെ നടുവിൽ നിറുത്തുന്നു.'
      easy_to_miss: ആ ലോകത്തിൽ കുട്ടികൾക്ക് ഒരു സ്ഥാനവുമില്ലായിരുന്നു. ഏറ്റവും പ്രാധാന്യം കുറഞ്ഞയാളെ യേശു കേന്ദ്രത്തിൽ നിറുത്തുന്നു.
    - verses: മത്തായി 18:3–4
      title: ശിശുക്കളെപ്പോലെ ആകുവിൻ
      text: നിങ്ങൾ തിരിഞ്ഞു ശിശുക്കളെപ്പോലെ ആയ്‌വരുന്നില്ല എങ്കിൽ സ്വർഗ്ഗരാജ്യത്തിൽ കടക്കയില്ല. ആകയാൽ ഈ ശിശുവിനെപ്പോലെ തന്നെത്താൻ താഴ്ത്തുന്നവൻ സ്വർഗ്ഗരാജ്യത്തിൽ ഏറ്റവും വലിയവൻ ആകുന്നു.
      easy_to_miss: ഏറ്റവും വലിയവൻ ആകുന്നതിനെക്കുറിച്ചായിരുന്നു ചോദ്യം. അകത്തു കടക്കുന്നതുതന്നെയാണ് ആദ്യത്തെ പ്രശ്നം എന്ന് യേശു ഉത്തരം നല്കുന്നു.
    - verses: മത്തായി 18:5–6
      title: കൈക്കൊള്ളുക, ഇടർച്ച വരുത്താതിരിക്കുക
      text: ഇങ്ങിനെയുള്ള ശിശുവിനെ എന്റെ നാമത്തിൽ കൈക്കൊള്ളുന്നവൻ എന്നെ കൈക്കൊള്ളുന്നു. എന്നിൽ വിശ്വസിക്കുന്ന ഈ ചെറിയവരിൽ ഒരുത്തന്നു ആരെങ്കിലും ഇടർച്ച വരുത്തിയാലോ, അവന്റെ കഴുത്തിൽ വലിയോരു തിരിക്കല്ലു കെട്ടി അവനെ സമുദ്രത്തിന്റെ ആഴത്തിൽ താഴ്ത്തിക്കളയുന്നതു അവന്നു നന്ന്.
      easy_to_miss: മത്തായി 25-ൽ വിശക്കുന്നവനോടും പരദേശിയോടും എന്നപോലെ, യേശു ശിശുവിനോടു തന്നെത്തന്നെ താദാത്മ്യപ്പെടുത്തുന്നു.
    - verses: മത്തായി 18:7–9
      title: വെട്ടി എറിഞ്ഞുകളക
      text: ഇടർച്ച ഹേതുവായി ലോകത്തിന്നു അയ്യോ കഷ്ടം. നിന്റെ കയ്യോ കാലോ കണ്ണോ നിനക്കു ഇടർച്ച ആയാൽ അതിനെ എറിഞ്ഞുകളക. രണ്ടു കയ്യും രണ്ടു കാലും ഉള്ളവനായി നിത്യാഗ്നിയിൽ വീഴുന്നതിനെക്കാൾ അംഗഹീനനായി ജീവനിൽ കടക്കുന്നതു നിനക്കു നന്ന്.
      easy_to_miss: മറ്റുള്ളവർക്ക് ഇടർച്ച വരുത്തുന്നവരിൽനിന്ന്, നമുക്കുതന്നെ ഇടർച്ച വരുത്തുന്നവയിലേക്കു യേശു തിരിയുന്നു.
    - verses: മത്തായി 18:10–11
      title: അവരുടെ ദൂതന്മാർ
      text: ഈ ചെറിയവരിൽ ഒരുത്തനെ തുച്ഛീകരിക്കാതിരിപ്പാൻ സൂക്ഷിച്ചുകൊൾവിൻ. സ്വർഗ്ഗത്തിൽ അവരുടെ ദൂതന്മാർ സ്വർഗ്ഗസ്ഥനായ എന്റെ പിതാവിന്റെ മുഖം എപ്പോഴും കാണുന്നു.
      easy_to_miss: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘മനുഷ്യപുത്രൻ കാണാതെപോയതിനെ രക്ഷിപ്പാൻ വന്നു’ എന്ന ഒരു വാക്യം കൂടിയുണ്ട്; 1910 വിവർത്തനത്തിൽ അതില്ല. അടുത്തതായി കാണാതെപോയ ആടിന്റെ ഉപമ വരുന്നു.
    people:
    - name: ശിശു
      role: യേശു വിളിച്ച് ശിഷ്യന്മാരുടെ നടുവിൽ നിറുത്തിയ കുട്ടി.
      name_meaning: —
      ml: The child
    - name: ശിഷ്യന്മാർ
      role: രാജ്യത്തിലെ സ്ഥാനമാനത്തെക്കുറിച്ചു തർക്കിക്കുന്നവർ.
      name_meaning: —
      ml: The disciples
    phrases:
    - term: ചെറിയവർ
      explanation: കുട്ടികൾ; എളുപ്പത്തിൽ മുറിവേല്ക്കുകയോ വഴിതെറ്റിക്കപ്പെടുകയോ ചെയ്യുന്ന എളിയ വിശ്വാസികളും.
    - term: തിരിക്കല്ല്
      explanation: കഴുത തിരിക്കുന്ന, ധാന്യം പൊടിക്കാനുള്ള വലിയ കല്ല്. ഒരാളുടെ കഴുത്തിൽ കെട്ടിയാൽ മുങ്ങിമരണം ഉറപ്പ്.
    - term: അവരുടെ ദൂതന്മാർ
      explanation: കാവൽദൂതന്മാരെക്കുറിച്ചുള്ള സഭയുടെ ഉപദേശം ഈ വാക്യത്തെ ആശ്രയിക്കുന്നു.
    reflection:
      title_en: നടുവിൽ ഒരു ശിശു
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ശിഷ്യന്മാർക്ക് ഒരു റാങ്ക്പട്ടിക വേണമായിരുന്നു. ഏറ്റവും വലിയവൻ ആർ? രാജ്യം വരുമ്പോൾ ഏറ്റവും നല്ല ഇരിപ്പിടം ആർക്ക്? യേശു അവർക്ക് ഒരു പട്ടിക കൊടുക്കുന്നില്ല. അവൻ ഒരു ശിശുവിനെ അടുക്കെ വിളിച്ച് നടുവിൽ നിറുത്തുന്നു. കുട്ടികൾക്കു വലിയ വിലയില്ലാതിരുന്ന ഒരു ലോകത്തിൽ, അതൊരു ഞെട്ടലായിരുന്നു.

        കുട്ടികളെക്കുറിച്ച് അവൻ മൂന്നു കാര്യങ്ങൾ പറയുന്നു. രാജ്യത്തിൽ കടക്കാൻ മുതിർന്നവർ അവരെപ്പോലെ ആകണം: ആശ്രയിക്കുന്നവരും വിശ്വസിക്കുന്നവരും സ്ഥാനമാനത്തെക്കുറിച്ചു വേവലാതിയില്ലാത്തവരും. ഒരു ശിശുവിനെ കൈക്കൊള്ളുന്നതു യേശുവിനെത്തന്നെ കൈക്കൊള്ളുന്നതാണ്. ഒരു ശിശുവിനെ ദ്രോഹിക്കുന്നതോ വിശ്വാസത്തിൽനിന്ന് അകറ്റുന്നതോ ആർക്കും ചെയ്യാവുന്നതിൽ ഏറ്റവും മോശമായ കാര്യങ്ങളിൽ ഒന്നാണ്.

        ആ അവസാന മുന്നറിയിപ്പ് ഓരോ ഇടവകയെയും കുടുംബത്തെയും ജാഗ്രതയുള്ളതാക്കണം. നമ്മുടെ പള്ളികളിലും വീടുകളിലും കുട്ടികൾ സുരക്ഷിതരായിരിക്കണം; അവരുടെ വിശ്വാസം സംരക്ഷിക്കപ്പെടുകയും പോഷിപ്പിക്കപ്പെടുകയും വേണം. അവരുടെ ദൂതന്മാർ പിതാവിന്റെ മുഖം കാണുന്നു എന്ന് യേശു പറയുന്നു. ചെറിയവരോടു നാം എന്തു ചെയ്താലും, സ്വർഗ്ഗം അതു കാണുന്നുണ്ട്.
      title_ml: A child in the middle
    week:
      question: വിശ്വാസത്തെക്കുറിച്ചു മുതിർന്നവർക്കു കുട്ടികളിൽനിന്ന് എന്തു പഠിക്കാം?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: 'മുതിർന്നവർ: കുട്ടിക്കറിയാവുന്ന ഒരു പ്രാർത്ഥനയോ പാട്ടോ നിങ്ങളെ പഠിപ്പിക്കാൻ ഒരു കുട്ടിയോടു ചോദിക്കുക. കുട്ടികൾ: കുടുംബത്തിലെ മുതിർന്നവർക്കുവേണ്ടി പേരുപറഞ്ഞു പ്രാർത്ഥിക്കുക.'
      prayer: കർത്താവായ യേശുവേ, നിന്റെ ശിഷ്യന്മാരുടെ നടുവിൽ നീ ഒരു ശിശുവിനെ നിറുത്തി. ശിശുക്കളെപ്പോലെ താഴ്മയും ആശ്രയവുമുള്ളവരായി ഞങ്ങളെ തീർക്കേണമേ; ഞങ്ങളുടെ സഭയിലെ ഓരോ കുട്ടിയെയും സുരക്ഷിതരായി കാക്കേണമേ; അവരുടെ ദൂതന്മാർ എപ്പോഴും നിന്റെ പിതാവിന്റെ മുഖം കാണുമാറാകട്ടെ. ആമേൻ.
