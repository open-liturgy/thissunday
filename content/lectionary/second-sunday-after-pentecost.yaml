# Readings transcribed from https://mosc.in/lectionary/kyomtho-easter-to-koodosh-edtho/. Everything else is a DRAFT for priest/editor review.
sunday_slug: second-sunday-after-pentecost
is_sunday: true
name:
  en: Second Sunday after Pentecost
  ml: പെന്തിക്കോസ്തിക്കു ശേഷം രണ്ടാം ഞായർ
title_as_printed: Second Sunday after Pentecost
season:
  en: Pentecost
  gloss: The season of the Holy Spirit
  syr: ܦܢܛܩܘܣܛܐ
tagline: 'Sheep among wolves: the twelve are sent out'
standfirst: Jesus sends his twelve apostles out for the first time. He tells them what to say, what not to take, and what to do when a town will not listen.
description: Readings for the Second Sunday after Pentecost, with Matthew 10:5–16, Jesus sending the twelve, explained in five scenes. Reflection and question.
hero_quote:
  text: Freely you received, so freely give.
  ref: Matthew 10:8
readings:
  evening:
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: Luke 6:12–23
    ml: ലൂക്കൊസ് 6:12–23
    note: Jesus prays all night, chooses the twelve, and speaks the Beatitudes.
    printed: St. Luke 6:12-23
  morning:
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: Mark 3:7–19
    ml: മർക്കൊസ് 3:7–19
    note: Crowds press in from every region; Jesus appoints the twelve.
    printed: St. Mark 3:7-19
  before_qurbana:
  - kind: Old Testament
    kind_ml: പഴയനിയമം
    ref: Leviticus 19:1–8
    ml: ലേവ്യപുസ്തകം 19:1–8
    note: Be holy, for I the Lord your God am holy.
    printed: Leviticus 19:1-8
  - kind: Old Testament
    kind_ml: പഴയനിയമം
    ref: 2 Samuel 5:1–10
    ml: 2 ശമൂവേൽ 5:1–10
    note: David is anointed king over all Israel and takes Jerusalem.
    printed: II Samuel 5:1-10
  - kind: Old Testament
    kind_ml: പഴയനിയമം
    ref: Daniel 6:25–28
    ml: ദാനീയേൽ 6:25–28
    note: King Darius praises Daniel’s God, who rescued him from the lions.
    printed: Daniel 6:25-28
  holy_qurbana:
  - kind: Acts of the Apostles
    kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
    ref: Acts 4:23–31
    ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 4:23–31
    note: The believers pray for boldness, and the place where they meet is shaken.
    printed: Acts 4:23-31
  - kind: Pauline Epistle
    kind_ml: പൗലോസിന്റെ ലേഖനം
    ref: Ephesians 2:11–22
    ml: എഫെസ്യർ 2:11–22
    note: Christ is our peace; he has broken down the wall of hostility.
    printed: Ephesians 2:11-22
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: Matthew 10:5–16
    ml: മത്തായി 10:5–16
    note: 'Jesus sends the twelve: freely you have received, freely give. This is the Gospel of the day.'
    printed: St. Matthew 10:5-16
    main: true
one_minute:
  what_happens: Jesus sends the twelve to the lost sheep of Israel to proclaim the kingdom and heal. They are to take no money or spare clothes, stay with worthy hosts, and shake off the dust of towns that refuse them. He is sending them like sheep among wolves.
  why_this_sunday: After Pentecost the Church thinks about its mission. The evening Gospel tells how Jesus chose the twelve; today he sends them.
  take_with_you: Everything they had to give, they had been given first. Freely you received, freely give.
readings_thread: Leviticus calls Israel to be holy as God is holy, and David is made king over all Israel. Daniel’s God is praised by a foreign king. In Acts the believers pray for boldness, and Ephesians says the wall between peoples has been broken down.
key_verse:
  ref: Matthew 10:16
  ml: ചെന്നായ്ക്കളുടെ നടുവിൽ ആടിനെപ്പോലെ ഞാൻ നിങ്ങളെ അയക്കുന്നു. ആകയാൽ പാമ്പിനെപ്പോലെ ബുദ്ധിയുള്ളവരും പ്രാവിനെപ്പോലെ കളങ്കമില്ലാത്തവരും ആയിരിപ്പിൻ.
  ml_translation: Sathyavedapusthakam, 1910
  en: Behold, I send you out as sheep among wolves. Therefore be wise as serpents, and harmless as doves.
  en_translation: World English Bible
scenes:
- verses: Matthew 10:5–6
  title: To the lost sheep
  text: 'Jesus sends the twelve out with instructions: do not go to the Gentiles or Samaritans, but to the lost sheep of the house of Israel.'
  easy_to_miss: The mission starts close to home. After the resurrection it widens to all nations (Matthew 28:19).
- verses: Matthew 10:7–8
  title: Freely give
  text: Proclaim that the kingdom of heaven is near. Heal the sick, raise the dead, cleanse lepers, cast out demons. You received without paying; give without charging.
  easy_to_miss: 'Their message is the same as Jesus’ and John’s: the kingdom is near (Matthew 3:2, 4:17).'
- verses: Matthew 10:9–10
  title: Travel light
  text: Take no gold, silver or copper, no bag, no second tunic, no sandals or staff. The worker deserves his food.
  easy_to_miss: They will depend on the people they serve. Mission begins by receiving hospitality.
- verses: Matthew 10:11–15
  title: Peace to the house
  text: In each town find a worthy person and stay there. Greet the house with peace. If you are not welcomed, shake the dust off your feet as you leave.
  easy_to_miss: If the house is not worthy, Jesus says, “let your peace return to you”. Peace offered is never wasted.
- verses: Matthew 10:16
  title: Sheep among wolves
  text: I am sending you out like sheep among wolves. So be wise as serpents and innocent as doves.
  easy_to_miss: Jesus does not promise safety. He asks for both cleverness and innocence, which rarely go together.
people:
- name: The twelve apostles
  ml: പന്ത്രണ്ട് അപ്പൊസ്തലന്മാർ
  role: Chosen from among the disciples and now sent out for the first time.
  name_meaning: Apostle means “one who is sent”
phrases:
- term: Lost sheep of Israel
  explanation: Israel’s people who had drifted from God. Jesus’ first mission was to them.
- term: Shake the dust off your feet
  explanation: A sign that the messengers had done their part and were not responsible for the town’s refusal.
- term: Wise as serpents
  explanation: Shrewd and alert to danger, while staying as harmless as doves.
reflection:
  title_en: Travelling light
  title_ml: ഭാരമില്ലാത്ത യാത്ര
  read_time: A three-minute read
  body: |-
    Jesus sends the twelve out with almost nothing. No money, no luggage, not even a spare shirt. They will have to depend on the kindness of the people they visit. It sounds impractical, and it is meant to be. Their message is that God provides, and they are to live as if it is true.

    They are also told what to give: healing, peace and the news that God’s kingdom is near. They had received all of it from Jesus without paying anything. Now they hand it on the same way. Freely you received, freely give.

    We are not all called to walk from village to village. But everyone in the Church has received something freely: forgiveness, faith, a community, a place at the table. This Gospel asks what we are doing with it. The Church grows when ordinary people give away, without charge, what was given to them.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What has God given you freely that you could give to someone else?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: 'Give something away this week: time, a skill, an item you do not need, with no expectation of return.'
  prayer: Lord Jesus, you sent your apostles out with nothing but your word and your peace. Make us generous with what we have received freely, and wise and gentle among those who do not welcome us. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം രണ്ടാം ഞായർ
      ml: Second Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: 'ചെന്നായ്ക്കളുടെ നടുവിൽ ആടുകൾ: പന്ത്രണ്ടുപേർ അയക്കപ്പെടുന്നു'
    standfirst: യേശു തന്റെ പന്ത്രണ്ട് അപ്പൊസ്തലന്മാരെ ആദ്യമായി അയക്കുന്നു. എന്തു പറയണം, എന്തു കരുതരുത്, ഒരു പട്ടണം കേൾക്കാതിരുന്നാൽ എന്തു ചെയ്യണം എന്ന് അവൻ അവരോടു പറയുന്നു.
    description: പെന്തിക്കോസ്തിക്കു ശേഷം രണ്ടാം ഞായറിലെ വായനകൾ, യേശു പന്ത്രണ്ടുപേരെ അയക്കുന്ന മത്തായി 10:5–16 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: സ്വർഗ്ഗരാജ്യം ഘോഷിക്കാനും സൌഖ്യമാക്കാനും യേശു പന്ത്രണ്ടുപേരെ യിസ്രായേൽഗൃഹത്തിലെ കാണാതെപോയ ആടുകളുടെ അടുക്കലേക്ക് അയക്കുന്നു. അവർ പണമോ അധികം വസ്ത്രമോ കരുതരുത്; യോഗ്യരായ ആതിഥേയരോടുകൂടെ പാർക്കണം; തങ്ങളെ നിരസിക്കുന്ന പട്ടണങ്ങളുടെ പൊടി കാലിൽനിന്നു തട്ടിക്കളയണം. ചെന്നായ്ക്കളുടെ നടുവിൽ ആടിനെപ്പോലെയാണ് അവൻ അവരെ അയക്കുന്നത്.
      why_this_sunday: പെന്തിക്കോസ്തിക്കു ശേഷം സഭ തന്റെ ദൌത്യത്തെക്കുറിച്ചു ചിന്തിക്കുന്നു. യേശു പന്ത്രണ്ടുപേരെ തിരഞ്ഞെടുത്തത് സന്ധ്യാസുവിശേഷം പറയുന്നു; ഇന്ന് അവൻ അവരെ അയക്കുന്നു.
      take_with_you: അവർക്കു കൊടുക്കാനുണ്ടായിരുന്നതെല്ലാം ആദ്യം അവർക്കു ലഭിച്ചതായിരുന്നു. “സൗജന്യമായി നിങ്ങൾക്കു ലഭിച്ചു സൗജന്യമായി കൊടുപ്പിൻ”.
    readings_thread: ദൈവം വിശുദ്ധനായിരിക്കുന്നതുപോലെ വിശുദ്ധരായിരിക്കുവാൻ ലേവ്യപുസ്തകം യിസ്രായേലിനെ വിളിക്കുന്നു; ദാവീദ് എല്ലാ യിസ്രായേലിന്മേലും രാജാവാകുന്നു. ദാനീയേലിന്റെ ദൈവത്തെ ഒരു അന്യരാജാവു സ്തുതിക്കുന്നു. അപ്പൊസ്തലപ്രവൃത്തികളിൽ വിശ്വാസികൾ ധൈര്യത്തിനായി പ്രാർത്ഥിക്കുന്നു; ജനങ്ങൾക്കിടയിലെ മതിൽ ഇടിച്ചുകളഞ്ഞിരിക്കുന്നു എന്ന് എഫെസ്യലേഖനം പറയുന്നു.
    scenes:
    - verses: മത്തായി 10:5–6
      title: കാണാതെ പോയ ആടുകളുടെ അടുക്കൽ
      text: 'യേശു പന്ത്രണ്ടുപേരെയും നിർദ്ദേശങ്ങളോടെ അയക്കുന്നു: ജാതികളുടെ അടുക്കൽ പോകാതെയും ശമര്യരുടെ പട്ടണത്തിൽ കടക്കാതെയും യിസ്രായേൽ ഗൃഹത്തിലെ കാണാതെ പോയ ആടുകളുടെ അടുക്കൽ തന്നേ ചെല്ലുവിൻ.'
      easy_to_miss: ദൌത്യം വീടിനടുത്തുനിന്നു തുടങ്ങുന്നു. ഉയിർപ്പിനു ശേഷം അതു സകലജാതികളിലേക്കും വിശാലമാകുന്നു (മത്തായി 28:19).
    - verses: മത്തായി 10:7–8
      title: സൗജന്യമായി കൊടുപ്പിൻ
      text: സ്വർഗ്ഗരാജ്യം സമീപിച്ചിരിക്കുന്നു എന്നു ഘോഷിപ്പിൻ. രോഗികളെ സൗഖ്യമാക്കുവിൻ; മരിച്ചവരെ ഉയിർപ്പിപ്പിൻ; കുഷ്ഠരോഗികളെ ശുദ്ധമാക്കുവിൻ; ഭൂതങ്ങളെ പുറത്താക്കുവിൻ. സൗജന്യമായി നിങ്ങൾക്കു ലഭിച്ചു; സൗജന്യമായി കൊടുപ്പിൻ.
      easy_to_miss: 'അവരുടെ സന്ദേശം യേശുവിന്റെയും യോഹന്നാന്റെയും സന്ദേശംതന്നെ: രാജ്യം സമീപിച്ചിരിക്കുന്നു (മത്തായി 3:2; 4:17).'
    - verses: മത്തായി 10:9–10
      title: ഭാരമില്ലാതെ യാത്ര ചെയ്യുക
      text: മടിശ്ശീലയിൽ പൊന്നും വെള്ളിയും ചെമ്പും, വഴിക്കു പൊക്കണവും രണ്ടു ഉടുപ്പും ചെരിപ്പും വടിയും കരുതരുതു; വേലക്കാരൻ തന്റെ ആഹാരത്തിന്നു യോഗ്യനല്ലോ.
      easy_to_miss: തങ്ങൾ ശുശ്രൂഷിക്കുന്ന ജനത്തെ അവർ ആശ്രയിക്കേണ്ടിവരും. ആതിഥ്യം സ്വീകരിക്കുന്നതിലൂടെയാണ് ദൌത്യം തുടങ്ങുന്നത്.
    - verses: മത്തായി 10:11–15
      title: വീട്ടിന്നു സമാധാനം
      text: ഓരോ പട്ടണത്തിലും യോഗ്യൻ ആർ എന്ന് അന്വേഷിച്ച് അവിടെ പാർപ്പിൻ. ആ വീട്ടിൽ ചെല്ലുമ്പോൾ അതിന്നു വന്ദനം പറവിൻ. ആരെങ്കിലും നിങ്ങളെ കൈക്കൊള്ളാതിരുന്നാൽ, വിട്ടുപോകുമ്പോൾ നിങ്ങളുടെ കാലിലെ പൊടി തട്ടിക്കളവിൻ.
      easy_to_miss: വീട്ടിന്നു യോഗ്യതയില്ലെങ്കിൽ “സമാധാനം നിങ്ങളിലേക്കു മടങ്ങിപ്പോരട്ടെ” എന്ന് യേശു പറയുന്നു. നല്കപ്പെട്ട സമാധാനം ഒരിക്കലും പാഴാകുന്നില്ല.
    - verses: മത്തായി 10:16
      title: ചെന്നായ്ക്കളുടെ നടുവിൽ ആടുകൾ
      text: ചെന്നായ്ക്കളുടെ നടുവിൽ ആടിനെപ്പോലെ ഞാൻ നിങ്ങളെ അയക്കുന്നു. ആകയാൽ പാമ്പിനെപ്പോലെ ബുദ്ധിയുള്ളവരും പ്രാവിനെപ്പോലെ കളങ്കമില്ലാത്തവരും ആയിരിപ്പിൻ.
      easy_to_miss: യേശു സുരക്ഷിതത്വം വാഗ്ദത്തം ചെയ്യുന്നില്ല. അപൂർവ്വമായി മാത്രം ഒരുമിച്ചുപോകുന്ന ബുദ്ധിയും നിഷ്കളങ്കതയും അവൻ ആവശ്യപ്പെടുന്നു.
    people:
    - name: പന്ത്രണ്ട് അപ്പൊസ്തലന്മാർ
      role: ശിഷ്യന്മാരിൽനിന്നു തിരഞ്ഞെടുക്കപ്പെട്ട്, ഇപ്പോൾ ആദ്യമായി അയക്കപ്പെടുന്നവർ.
      name_meaning: അപ്പൊസ്തലൻ എന്നാൽ “അയക്കപ്പെട്ടവൻ”
      ml: The twelve apostles
    phrases:
    - term: യിസ്രായേലിലെ കാണാതെ പോയ ആടുകൾ
      explanation: ദൈവത്തിൽനിന്ന് അകന്നുപോയ യിസ്രായേൽജനം. യേശുവിന്റെ ആദ്യദൌത്യം അവരിലേക്കായിരുന്നു.
    - term: കാലിലെ പൊടി തട്ടിക്കളയുക
      explanation: സന്ദേശവാഹകർ തങ്ങളുടെ പങ്കു ചെയ്തുവെന്നും, പട്ടണം നിരസിച്ചതിന് അവർ ഉത്തരവാദികളല്ലെന്നുമുള്ള അടയാളം.
    - term: പാമ്പിനെപ്പോലെ ബുദ്ധിയുള്ളവർ
      explanation: അപകടങ്ങളെക്കുറിച്ചു ജാഗ്രതയുള്ളവരും വിവേകികളും; അതേസമയം പ്രാവിനെപ്പോലെ നിരുപദ്രവികളും.
    reflection:
      title_en: ഭാരമില്ലാത്ത യാത്ര
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        യേശു പന്ത്രണ്ടുപേരെ ഏതാണ്ട് ഒന്നുമില്ലാതെയാണ് അയക്കുന്നത്. പണമില്ല, ഭാണ്ഡമില്ല, ഒരു മാറ്റുവസ്ത്രംപോലുമില്ല. അവർ സന്ദർശിക്കുന്ന ജനത്തിന്റെ ദയയെ അവർക്ക് ആശ്രയിക്കേണ്ടിവരും. അതു പ്രായോഗികമല്ലെന്നു തോന്നുന്നു; അങ്ങനെതന്നെയാണ് ഉദ്ദേശ്യവും. ദൈവം കരുതുന്നു എന്നതാണ് അവരുടെ സന്ദേശം; അതു സത്യമെന്നപോലെ അവർ ജീവിക്കണം.

        എന്താണ് കൊടുക്കേണ്ടതെന്നും അവരോടു പറയുന്നു: സൌഖ്യം, സമാധാനം, ദൈവരാജ്യം സമീപിച്ചിരിക്കുന്നു എന്ന വാർത്ത. ഇതെല്ലാം അവർക്കു യേശുവിൽനിന്ന് ഒന്നും കൊടുക്കാതെ ലഭിച്ചതാണ്. ഇപ്പോൾ അതേ വിധത്തിൽ അവർ അതു കൈമാറുന്നു. സൗജന്യമായി നിങ്ങൾക്കു ലഭിച്ചു; സൗജന്യമായി കൊടുപ്പിൻ.

        നാം എല്ലാവരും ഗ്രാമങ്ങൾതോറും നടന്നുപോകുവാൻ വിളിക്കപ്പെട്ടവരല്ല. എന്നാൽ സഭയിലെ ഓരോരുത്തർക്കും സൌജന്യമായി എന്തെങ്കിലും ലഭിച്ചിട്ടുണ്ട്: ക്ഷമ, വിശ്വാസം, ഒരു സമൂഹം, മേശയ്ക്കൽ ഒരിടം. അതുകൊണ്ടു നാം എന്തു ചെയ്യുന്നു എന്ന് ഈ സുവിശേഷം ചോദിക്കുന്നു. തങ്ങൾക്കു ലഭിച്ചതു സാധാരണക്കാർ പ്രതിഫലം വാങ്ങാതെ കൊടുക്കുമ്പോഴാണ് സഭ വളരുന്നത്.
      title_ml: Travelling light
    week:
      question: മറ്റൊരാൾക്കു കൊടുക്കാൻ കഴിയുന്ന, ദൈവം നിങ്ങൾക്കു സൌജന്യമായി തന്നത് എന്താണ്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: 'ഈ ആഴ്ച എന്തെങ്കിലും കൊടുക്കുക: സമയം, ഒരു കഴിവ്, നിങ്ങൾക്ക് ആവശ്യമില്ലാത്ത ഒരു വസ്തു; തിരികെ ഒന്നും പ്രതീക്ഷിക്കാതെ.'
      prayer: കർത്താവായ യേശുവേ, നിന്റെ വചനവും നിന്റെ സമാധാനവും മാത്രം നല്കി നീ നിന്റെ അപ്പൊസ്തലന്മാരെ അയച്ചു. സൌജന്യമായി ലഭിച്ചതു കൊടുക്കുന്നതിൽ ഞങ്ങളെ ഉദാരരാക്കേണമേ; ഞങ്ങളെ സ്വീകരിക്കാത്തവരുടെ ഇടയിൽ ഞങ്ങളെ ബുദ്ധിയുള്ളവരും സൌമ്യരുമാക്കേണമേ. ആമേൻ.
