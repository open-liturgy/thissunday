standfirst: A foreign mother follows Jesus, shouting for her sick daughter. He does not answer. The disciples want her gone. She keeps asking, and Jesus calls her faith great.
description: Readings for the fourth Sunday of Great Lent, with Matthew 15:21–31, the Canaanite woman, explained in five scenes. Reflection and a family question.
