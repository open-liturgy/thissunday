one_minute:
  what_happens: In the region of Tyre and Sidon, a Canaanite woman begs Jesus to heal her daughter. He is silent, then says he was sent to Israel. She kneels and answers his hard words with humility and wit. He praises her faith and her daughter is healed.
  why_this_sunday: On the fourth Sunday of Lent the Church reads a miracle for a foreigner. The morning Gospel tells of another outsider, the Roman centurion.
  take_with_you: She was not put off by silence. Keep praying when it feels as if nobody is answering.
readings_thread: Isaiah says foreigners who hold fast to God will be welcomed into his house of prayer for all peoples. Aaron’s staff blossoms, and Samuel sets up a stone to say the Lord has helped us. Peter says there is no other name by which we are saved.
key_verse:
  ref: Matthew 15:28
  ml: 'യേശു അവളോടു: സ്ത്രീയേ, നിന്റെ വിശ്വാസം വലിയതു; നിന്റെ ഇഷ്ടംപോലെ നിനക്കു ഭവിക്കട്ടെ എന്നു ഉത്തരം പറഞ്ഞു. ആ നാഴികമുതൽ അവളുടെ മകൾക്കു സൗഖ്യം വന്നു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: Then Jesus answered her, “Woman, great is your faith! Be it done to you even as you desire.” And her daughter was healed from that hour.
  en_translation: World English Bible
scenes:
- verses: Matthew 15:21–22
  title: A mother cries out
  text: 'Jesus goes to the region of Tyre and Sidon. A Canaanite woman comes out shouting: have mercy on me, Lord, Son of David! My daughter is badly troubled by a demon.'
  easy_to_miss: She calls him “Son of David”, a title many in Israel would not give him. A foreigner sees who he is.
- verses: Matthew 15:23
  title: Not a word
  text: 'Jesus does not answer her at all. His disciples urge him: send her away, she keeps shouting after us.'
  easy_to_miss: His silence is not the end of the story. Matthew lets it sit there before anything else happens.
- verses: Matthew 15:24–26
  title: The children’s bread
  text: 'Jesus says he was sent only to the lost sheep of Israel. She kneels: Lord, help me. He says it is not right to take the children’s bread and throw it to the dogs.'
  easy_to_miss: 'Her prayer becomes shorter each time: from a long plea to “Lord, help me”. Many of the best prayers are that short.'
- verses: Matthew 15:27–28
  title: Great is your faith
  text: 'She answers: yes, Lord, but even the dogs eat the crumbs that fall from their master’s table. Jesus says: woman, great is your faith. Let it be as you wish. Her daughter is healed at that hour.'
  easy_to_miss: 'A chapter earlier Jesus called Peter “you of little faith” (Matthew 14:31). The two people he praises for great faith in Matthew are both outsiders: a Roman centurion (8:10) and this woman.'
- verses: Matthew 15:29–31
  title: Crowds by the lake
  text: Back by the Sea of Galilee, crowds bring the lame, the blind, the maimed and the mute. He heals them, and the people glorify the God of Israel.
  easy_to_miss: The crumbs she asked for turn out to be a whole meal. Right after this, Jesus feeds four thousand.
people:
- name: The Canaanite woman
  ml: കനാന്യസ്ത്രീ
  role: A mother from the coast of Phoenicia, outside Israel.
  name_meaning: —
- name: Her daughter
  ml: അവളുടെ മകൾ
  role: Healed without meeting Jesus, from a distance.
  name_meaning: —
phrases:
- term: Tyre and Sidon
  explanation: Two port cities on the Mediterranean coast, north of Galilee, in modern Lebanon. Gentile territory.
- term: Canaanite
  explanation: The old name for the people of the land before Israel. Matthew uses it to underline that she is an outsider.
- term: Lost sheep of Israel
  explanation: Jesus’ mission began with Israel. After the resurrection he sends the disciples to all nations (Matthew 28:19).
reflection:
  title_en: Faith that keeps asking
  title_ml: പിന്മാറാതെ ചോദിക്കുന്ന വിശ്വാസം
  read_time: A three-minute read
  body: |-
    This is one of the hardest conversations in the Gospels. A mother asks for help for her sick child, and Jesus first says nothing, then says he was not sent to her, then uses a word that sounds like an insult. It is uncomfortable to read, and it is meant to be.

    What stands out is the woman. She does not leave in anger, and she does not argue that she deserves help. She takes Jesus’ own picture and turns it into a prayer: even the dogs get the crumbs. She trusts that there is enough at his table for her daughter too. Jesus praises her faith above anyone else’s in Matthew.

    Most of us have prayed and heard nothing. It is tempting to stop. This woman shows another way: keep coming, keep kneeling, keep it short if you must, “Lord, help me”. Silence is not always a no. Sometimes it is room for faith to grow.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Is there something you have prayed about for a long time without an answer? How do you keep going?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Choose one long-standing family prayer and pray it together every night this week, even if it is just “Lord, help us”.
  prayer: Lord, help me. Like the Canaanite mother, teach us to keep asking when you seem silent, to trust that there is enough at your table, and to bring our children to you. Amen.
translations:
  ml:
    name:
      en: കനാന്യസ്ത്രീയുടെ ഞായർ
      ml: Sunday of the Canaanite Woman
    season:
      en: വലിയ നോമ്പ്
      gloss: ഉയിർപ്പിനു മുമ്പുള്ള അമ്പതു നോമ്പുദിവസങ്ങൾ
    tagline: “നായ്ക്കുട്ടികളും … നുറുക്കുകൾ തിന്നുന്നുണ്ടല്ലോ”
    standfirst: ഒരു വിദേശിയായ അമ്മ രോഗിയായ മകൾക്കുവേണ്ടി നിലവിളിച്ചുകൊണ്ട് യേശുവിന്റെ പിന്നാലെ ചെല്ലുന്നു. അവൻ ഉത്തരം പറയുന്നില്ല. അവളെ പറഞ്ഞയയ്ക്കണമെന്നു ശിഷ്യന്മാർ ആഗ്രഹിക്കുന്നു. അവൾ ചോദിച്ചുകൊണ്ടേയിരിക്കുന്നു; അവളുടെ വിശ്വാസം വലിയതെന്ന് യേശു പറയുന്നു.
    description: 'വലിയ നോമ്പിലെ നാലാം ഞായറിലെ വായനകൾ, കനാന്യസ്ത്രീ: മത്തായി 15:21–31 അഞ്ചു രംഗങ്ങളിൽ. ഒരു ധ്യാനവും കുടുംബത്തിനായി ഒരു ചോദ്യവും.'
    one_minute:
      what_happens: സോർ, സീദോൻ ദേശങ്ങളിൽവെച്ച് ഒരു കനാന്യസ്ത്രീ തന്റെ മകളെ സൌഖ്യമാക്കാൻ യേശുവിനോടു കെഞ്ചുന്നു. അവൻ മിണ്ടുന്നില്ല; പിന്നെ താൻ യിസ്രായേലിലേക്ക് അയയ്ക്കപ്പെട്ടവനാണ് എന്നു പറയുന്നു. അവൾ മുട്ടുകുത്തി, അവന്റെ കഠിനവാക്കുകൾക്ക് താഴ്മയോടും സമയോചിതമായും ഉത്തരം നല്കുന്നു. അവൻ അവളുടെ വിശ്വാസത്തെ പുകഴ്ത്തുന്നു; മകൾ സൌഖ്യം പ്രാപിക്കുന്നു.
      why_this_sunday: നോമ്പിലെ നാലാം ഞായറാഴ്ച സഭ ഒരു വിദേശിക്കുവേണ്ടിയുള്ള അത്ഭുതം വായിക്കുന്നു. പ്രഭാതസുവിശേഷം മറ്റൊരു പുറമേക്കാരനായ റോമൻ ശതാധിപനെക്കുറിച്ചു പറയുന്നു.
      take_with_you: മൌനം അവളെ പിന്തിരിപ്പിച്ചില്ല. ആരും ഉത്തരം തരുന്നില്ലെന്നു തോന്നുമ്പോഴും പ്രാർത്ഥിച്ചുകൊണ്ടിരിക്കുക.
    readings_thread: ദൈവത്തോടു പറ്റിനില്ക്കുന്ന അന്യജാതിക്കാർ സകലജാതികൾക്കുമുള്ള അവന്റെ പ്രാർത്ഥനാലയത്തിലേക്കു സ്വാഗതം ചെയ്യപ്പെടും എന്നു യെശയ്യാവ് പറയുന്നു. അഹരോന്റെ വടി തളിർക്കുന്നു; കർത്താവു നമ്മെ സഹായിച്ചു എന്നു പറഞ്ഞ് ശമൂവേൽ ഒരു കല്ലു നാട്ടുന്നു. നാം രക്ഷിക്കപ്പെടുവാൻ മറ്റൊരു നാമം ഇല്ല എന്നു പത്രൊസ് പറയുന്നു.
    scenes:
    - verses: മത്തായി 15:21–22
      title: ഒരു അമ്മ നിലവിളിക്കുന്നു
      text: 'യേശു സോർ, സീദോൻ എന്ന ദേശങ്ങളിലേക്കു പോകുന്നു. ഒരു കനാന്യസ്ത്രീ പുറപ്പെട്ടുവന്നു നിലവിളിക്കുന്നു: കർത്താവേ, ദാവീദ്പുത്രാ, എന്നോടു കരുണ തോന്നേണമേ; എന്റെ മകൾക്കു ഭൂതോപദ്രവം കഠിനമായിരിക്കുന്നു.'
      easy_to_miss: യിസ്രായേലിലെ പലരും അവനു കൊടുക്കാത്ത “ദാവീദ്പുത്രൻ” എന്ന സ്ഥാനപ്പേരാണ് അവൾ വിളിക്കുന്നത്. ഒരു വിദേശി അവൻ ആരെന്നു കാണുന്നു.
    - verses: മത്തായി 15:23
      title: ഒരു വാക്കും ഇല്ല
      text: 'യേശു അവളോട് ഒരു വാക്കും ഉത്തരം പറയുന്നില്ല. ശിഷ്യന്മാർ അവനോടു അപേക്ഷിക്കുന്നു: അവളെ പറഞ്ഞയക്കേണം; അവൾ നമ്മുടെ പിന്നാലെ നിലവിളിച്ചുകൊണ്ടു വരുന്നുവല്ലോ.'
      easy_to_miss: അവന്റെ മൌനം കഥയുടെ അവസാനമല്ല. മറ്റെന്തെങ്കിലും സംഭവിക്കുന്നതിനു മുമ്പ് മത്തായി അതിനെ അങ്ങനെതന്നെ നിർത്തുന്നു.
    - verses: മത്തായി 15:24–26
      title: മക്കളുടെ അപ്പം
      text: 'യിസ്രായേൽഗൃഹത്തിലെ കാണാതെ പോയ ആടുകളുടെ അടുക്കലേക്കു മാത്രമാണ് തന്നെ അയച്ചിരിക്കുന്നത് എന്നു യേശു പറയുന്നു. അവൾ നമസ്കരിക്കുന്നു: കർത്താവേ, എന്നെ സഹായിക്കേണമേ. മക്കളുടെ അപ്പം എടുത്തു നായ്ക്കുട്ടികൾക്കു ഇട്ടുകൊടുക്കുന്നതു നന്നല്ല എന്ന് അവൻ പറയുന്നു.'
      easy_to_miss: 'ഓരോ തവണയും അവളുടെ പ്രാർത്ഥന ചെറുതാകുന്നു: ഒരു നീണ്ട അപേക്ഷയിൽനിന്ന് “കർത്താവേ, എന്നെ സഹായിക്കേണമേ” എന്നതിലേക്ക്. ഏറ്റവും നല്ല പല പ്രാർത്ഥനകളും അത്രയും ചെറുതാണ്.'
    - verses: മത്തായി 15:27–28
      title: നിന്റെ വിശ്വാസം വലിയതു
      text: 'അവൾ ഉത്തരം പറയുന്നു: അതേ, കർത്താവേ, നായ്ക്കുട്ടികളും ഉടയവരുടെ മേശയിൽനിന്നു വീഴുന്ന നുറുക്കുകൾ തിന്നുന്നുണ്ടല്ലോ. യേശു പറയുന്നു: സ്ത്രീയേ, നിന്റെ വിശ്വാസം വലിയതു; നിന്റെ ഇഷ്ടംപോലെ നിനക്കു ഭവിക്കട്ടെ. ആ നാഴികമുതൽ അവളുടെ മകൾക്കു സൌഖ്യം വന്നു.'
      easy_to_miss: 'ഒരു അദ്ധ്യായം മുമ്പ് യേശു പത്രൊസിനെ “അല്പവിശ്വാസിയേ” എന്നു വിളിച്ചു (മത്തായി 14:31). മത്തായിയിൽ വലിയ വിശ്വാസത്തിന് യേശു പുകഴ്ത്തുന്ന രണ്ടുപേരും പുറമേക്കാരാണ്: ഒരു റോമൻ ശതാധിപനും (8:10) ഈ സ്ത്രീയും.'
    - verses: മത്തായി 15:29–31
      title: തടാകക്കരയിലെ പുരുഷാരം
      text: ഗലീലക്കടല്ക്കരയിൽ തിരികെയെത്തുമ്പോൾ പുരുഷാരം മുടന്തർ, കുരുടർ, കൂനർ, ഊമർ എന്നിവരെ കൊണ്ടുവരുന്നു. അവൻ അവരെ സൌഖ്യമാക്കുന്നു; ജനം യിസ്രായേലിന്റെ ദൈവത്തെ മഹത്വപ്പെടുത്തുന്നു.
      easy_to_miss: അവൾ ചോദിച്ച നുറുക്കുകൾ ഒരു മുഴുഭക്ഷണമായി മാറുന്നു. ഇതിനു തൊട്ടുപിന്നാലെ യേശു നാലായിരം പേരെ പോഷിപ്പിക്കുന്നു.
    people:
    - name: കനാന്യസ്ത്രീ
      role: യിസ്രായേലിനു പുറത്തുള്ള ഫൊയ്നീക്യതീരത്തുനിന്നുള്ള ഒരു അമ്മ.
      name_meaning: —
      ml: The Canaanite woman
    - name: അവളുടെ മകൾ
      role: യേശുവിനെ കാണാതെ, ദൂരത്തുനിന്നു സൌഖ്യം പ്രാപിച്ചവൾ.
      name_meaning: —
      ml: Her daughter
    phrases:
    - term: സോരും സീദോനും
      explanation: ഗലീലയ്ക്കു വടക്ക്, ഇന്നത്തെ ലെബനോനിൽ, മദ്ധ്യധരണ്യാഴിയുടെ തീരത്തുള്ള രണ്ടു തുറമുഖപട്ടണങ്ങൾ. ജാതികളുടെ ദേശം.
    - term: കനാന്യർ
      explanation: യിസ്രായേലിനു മുമ്പ് ആ ദേശത്തു പാർത്ത ജനത്തിന്റെ പഴയ പേര്. അവൾ പുറമേക്കാരിയാണ് എന്ന് ഊന്നിപ്പറയാൻ മത്തായി അത് ഉപയോഗിക്കുന്നു.
    - term: യിസ്രായേൽഗൃഹത്തിലെ കാണാതെ പോയ ആടുകൾ
      explanation: യേശുവിന്റെ ദൌത്യം യിസ്രായേലിൽനിന്നാണ് തുടങ്ങിയത്. പുനരുത്ഥാനത്തിനു ശേഷം അവൻ ശിഷ്യന്മാരെ സകലജാതികളിലേക്കും അയയ്ക്കുന്നു (മത്തായി 28:19).
    reflection:
      title_en: പിന്മാറാതെ ചോദിക്കുന്ന വിശ്വാസം
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        സുവിശേഷങ്ങളിലെ ഏറ്റവും പ്രയാസമുള്ള സംഭാഷണങ്ങളിൽ ഒന്നാണിത്. ഒരു അമ്മ രോഗിയായ കുഞ്ഞിനുവേണ്ടി സഹായം ചോദിക്കുന്നു; യേശു ആദ്യം ഒന്നും പറയുന്നില്ല, പിന്നെ തന്നെ അവളുടെ അടുക്കലേക്ക് അയച്ചിട്ടില്ല എന്നു പറയുന്നു, പിന്നെ ഒരു അധിക്ഷേപംപോലെ തോന്നുന്ന ഒരു വാക്ക് ഉപയോഗിക്കുന്നു. വായിക്കാൻ അസ്വസ്ഥത തോന്നുന്നു; അങ്ങനെ തോന്നാൻ തന്നെയാണ്.

        ശ്രദ്ധേയമായത് ആ സ്ത്രീയാണ്. അവൾ കോപിച്ചു പോകുന്നില്ല; താൻ സഹായം അർഹിക്കുന്നു എന്നു വാദിക്കുന്നുമില്ല. യേശുവിന്റെ സ്വന്തം ചിത്രം എടുത്ത് അവൾ ഒരു പ്രാർത്ഥനയാക്കുന്നു: നായ്ക്കുട്ടികൾക്കും നുറുക്കുകൾ കിട്ടുന്നുണ്ടല്ലോ. അവന്റെ മേശയിൽ തന്റെ മകൾക്കും വേണ്ടത്ര ഉണ്ട് എന്ന് അവൾ വിശ്വസിക്കുന്നു. മത്തായിയിൽ മറ്റാരുടേതിലും ഉപരിയായി യേശു അവളുടെ വിശ്വാസത്തെ പുകഴ്ത്തുന്നു.

        നമ്മിൽ മിക്കവരും പ്രാർത്ഥിച്ചിട്ട് ഒന്നും കേൾക്കാതിരുന്നിട്ടുണ്ട്. നിർത്താനാണ് പ്രലോഭനം. ഈ സ്ത്രീ മറ്റൊരു വഴി കാണിക്കുന്നു: വന്നുകൊണ്ടേയിരിക്കുക, മുട്ടുകുത്തിക്കൊണ്ടേയിരിക്കുക; വേണമെങ്കിൽ ചുരുക്കി പറയുക: “കർത്താവേ, എന്നെ സഹായിക്കേണമേ”. മൌനം എപ്പോഴും ഇല്ല എന്ന ഉത്തരമല്ല. ചിലപ്പോൾ അതു വിശ്വാസത്തിനു വളരാനുള്ള ഇടമാണ്.
      title_ml: Faith that keeps asking
    week:
      question: ഏറെക്കാലമായി ഉത്തരം കിട്ടാതെ നിങ്ങൾ പ്രാർത്ഥിക്കുന്ന എന്തെങ്കിലും ഉണ്ടോ? എങ്ങനെയാണ് നിങ്ങൾ തുടർന്നുപോകുന്നത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: കുടുംബം ഏറെക്കാലമായി പ്രാർത്ഥിക്കുന്ന ഒരു കാര്യം തിരഞ്ഞെടുത്ത്, ഈ ആഴ്ച എല്ലാ രാത്രിയും ഒരുമിച്ച് അതിനായി പ്രാർത്ഥിക്കുക; കർത്താവേ, ഞങ്ങളെ സഹായിക്കേണമേ എന്നു മാത്രമായാലും.
      prayer: കർത്താവേ, എന്നെ സഹായിക്കേണമേ. കനാന്യമാതാവിനെപ്പോലെ, നീ മൌനമായിരിക്കുന്നതായി തോന്നുമ്പോഴും ചോദിച്ചുകൊണ്ടിരിക്കാനും, നിന്റെ മേശയിൽ വേണ്ടത്ര ഉണ്ടെന്നു വിശ്വസിക്കാനും, ഞങ്ങളുടെ മക്കളെ നിന്റെ അടുക്കൽ കൊണ്ടുവരാനും ഞങ്ങളെ പഠിപ്പിക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Mark 7:24–37
        ml: മർക്കൊസ് 7:24–37
        note: 'സുറൊഫൊയീക്യക്കാരിയായ ഒരു അമ്മയുടെ വിശ്വാസം; ഒരു ചെകിടൻ കേൾക്കുന്നു: എഫഥാ, തുറന്നുവരിക.'
        printed: St. Mark 7:24-37
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 7:1–10
        ml: ലൂക്കൊസ് 7:1–10
        note: 'റോമൻ ശതാധിപന്റെ വിശ്വാസം: ഒരു വാക്കു കല്പിച്ചാൽ മതി, എന്റെ ബാല്യക്കാരന്നു സൗഖ്യം വരും.'
        printed: St. Luke 7:1-10
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: 1 Samuel 7:10–17
        ml: 1 ശമൂവേൽ 7:10–17
        note: 'ശമൂവേൽ ഒരു കല്ലു നാട്ടി അതിന് ഏബെൻ-എസെർ എന്നു പേരിടുന്നു: ഇത്രത്തോളം യഹോവ നമ്മെ സഹായിച്ചു.'
        printed: I Samuel 7:10-17
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Numbers 17:1–8
        ml: സംഖ്യാപുസ്തകം 17:1–8
        note: ഒറ്റ രാത്രികൊണ്ട് അഹരോന്റെ വടി തളിർത്തു പൂത്തു ബദാംഫലം കായ്ക്കുന്നു.
        printed: Numbers 17:1-8
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 56:1–7
        ml: യെശയ്യാവ് 56:1–7
        note: എന്റെ ആലയം സകലജാതികൾക്കും ഉള്ള പ്രാർത്ഥനാലയം എന്നു വിളിക്കപ്പെടും.
        printed: Isaiah 56:1-7
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 4:1–12
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 4:1–12
        note: 'ന്യായാധിപസംഘത്തിനു മുമ്പിൽ പത്രൊസ്: നാം രക്ഷിക്കപ്പെടുവാൻ മറ്റൊരു നാമവും നല്കപ്പെട്ടിട്ടില്ല.'
        printed: Acts 4:1-12
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Romans 7:14–25
        ml: റോമർ 7:14–25
        note: ഞാൻ ഇച്ഛിക്കുന്ന നന്മ ചെയ്യുന്നില്ല; എന്നെ ആർ വിടുവിക്കും? നമ്മുടെ കർത്താവായ യേശുക്രിസ്തു മുഖാന്തരം ദൈവത്തിനു സ്തോത്രം.
        printed: Romans 7:14-25
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 15:21–31
        ml: മത്തായി 15:21–31
        note: ഒരു കനാന്യ അമ്മയുടെ വലിയ വിശ്വാസം; ഗലീലക്കടലരികെ പുരുഷാരങ്ങൾ സൗഖ്യം പ്രാപിക്കുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Matthew 15:21-31
        main: true
    key_verse:
      ref: മത്തായി 15:28
    hero_quote:
      text: അതേ, കർത്താവേ, നായ്ക്കുട്ടികളും ഉടയവരുടെ മേശയിൽ നിന്നു വീഴുന്ന നുറുക്കുകൾ തിന്നുന്നുണ്ടല്ലോ.
      ref: മത്തായി 15:27
