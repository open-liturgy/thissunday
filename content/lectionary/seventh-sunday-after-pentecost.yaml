one_minute:
  what_happens: Crowds press in so that Jesus cannot even eat. His family comes to take him home, saying he is out of his mind. Scribes say he drives out demons by Beelzebul. Jesus says a divided house cannot stand, and that he has come to tie up the strong man.
  why_this_sunday: This Sunday’s readings are about where real power lies. The morning Gospel follows on, with Jesus naming his true family.
  take_with_you: Calling God’s work evil is the one thing that shuts the door on forgiveness, because it refuses the one who forgives.
readings_thread: Leviticus describes the Day of Atonement, when the people’s sins are carried away. Hosea warns leaders who have led the people astray, and Isaiah says God lives with the humble. Acts shows a community of one heart, and Ephesians a wall broken down.
key_verse:
  ref: Mark 3:25
  ml: ഒരു വീടു തന്നിൽ തന്നേ ഛിദ്രിച്ചു എങ്കിൽ ആ വീട്ടിന്നു നിലനില്പാൻ കഴികയില്ല.
  ml_translation: Sathyavedapusthakam, 1910
  en: If a house is divided against itself, that house cannot stand.
  en_translation: World English Bible
scenes:
- verses: Mark 3:20–21
  title: Out of his mind
  text: 'Jesus goes home, and the crowd is so great they cannot even eat. When his family hears, they set out to seize him, saying: he is out of his mind.'
  easy_to_miss: His own family misunderstands him before his enemies do.
- verses: Mark 3:22
  title: He has Beelzebul
  text: 'Scribes who have come down from Jerusalem say: he is possessed by Beelzebul, and he casts out demons by the prince of demons.'
  easy_to_miss: They do not deny the miracles. They argue about where the power comes from.
- verses: Mark 3:23–26
  title: A divided house
  text: Jesus calls them over and speaks in parables. How can Satan cast out Satan? A kingdom divided against itself cannot stand, nor a house divided against itself.
  easy_to_miss: This is the first time Mark says Jesus spoke “in parables”.
- verses: Mark 3:27
  title: Tying up the strong man
  text: No one can enter a strong man’s house and plunder it unless he first ties up the strong man.
  easy_to_miss: Jesus is describing himself as a burglar who breaks into the devil’s house to set the prisoners free.
- verses: Mark 3:28–30
  title: The sin that cannot be forgiven
  text: 'All sins and blasphemies will be forgiven, but whoever blasphemes against the Holy Spirit never has forgiveness. He said this because they said: he has an unclean spirit.'
  easy_to_miss: Mark explains the warning himself in verse 30. It is about calling the Spirit’s work evil, not about a sin people commit by accident.
people:
- name: Jesus’ family
  ml: യേശുവിന്റെ ചാർച്ചക്കാർ
  role: Relatives who come to take him home, thinking he is out of his mind.
  name_meaning: —
- name: The scribes from Jerusalem
  ml: ശാസ്ത്രിമാർ
  role: Teachers of the law sent to investigate him.
  name_meaning: —
phrases:
- term: Beelzebul
  explanation: A name for the prince of demons, possibly meaning “lord of the house”, which fits Jesus’ picture of a house.
- term: Parable
  explanation: A short story or comparison that makes the listener think. Mark uses the word for the first time here.
- term: Blasphemy against the Holy Spirit
  explanation: Deliberately calling the work of God’s Spirit evil, and so refusing the forgiveness the Spirit brings.
reflection:
  title_en: A house that stands
  title_ml: നിലനില്ക്കുന്ന ഒരു വീട്
  read_time: A three-minute read
  body: |-
    Jesus is surrounded by misunderstanding. His family thinks he has gone mad. Religious experts say he is in league with the devil. He is so busy healing people that he cannot eat. In the middle of it all, he tells a simple story: a house divided against itself cannot stand.

    He means that Satan is not fighting himself. Something stronger has arrived. Jesus has come to tie up the strong man and set his captives free. Every healing and every demon driven out is a sign that the house of evil is being emptied.

    The saying also applies to our homes. A family divided by grudges, silence or competition struggles to stand. So does a parish. Jesus’ power is not only for driving out demons. It is for healing divisions and bringing people back under one roof. That kind of house can stand.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Where are we divided at home? What would help us stand together?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Settle one disagreement at home this week, even a small one, before the day ends.
  prayer: Lord Jesus, you bound the strong man and set his captives free. Free us from what divides our home and our Church, and make us a house that stands. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം ഏഴാം ഞായർ
      ml: Seventh Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: ഛിദ്രിച്ച വീട്ടിന്നു നിലനില്പാൻ കഴികയില്ല
    standfirst: യേശുവിനു ബുദ്ധിഭ്രമം ഉണ്ടെന്ന് അവന്റെ ചാർച്ചക്കാർ കരുതുന്നു; അവൻ പിശാചിനുവേണ്ടി പ്രവർത്തിക്കുന്നുവെന്ന് യെരൂശലേമിൽനിന്നുള്ള ശാസ്ത്രിമാർ പറയുന്നു. ഒരു ബലവാനെയും ഛിദ്രിച്ച ഒരു വീടിനെയും കുറിച്ചുള്ള ഉപമകൊണ്ട് അവൻ ഇരുകൂട്ടർക്കും ഉത്തരം നല്കുന്നു.
    description: 'പെന്തിക്കോസ്തിക്കു ശേഷം ഏഴാം ഞായറിലെ വായനകൾ, ഛിദ്രിച്ച വീടും ബലവാനും: മർക്കൊസ് 3:20–30 വിശദമായി. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: ഭക്ഷണം കഴിപ്പാൻപോലും കഴിയാത്തവിധം പുരുഷാരം യേശുവിനു ചുറ്റും തിങ്ങിക്കൂടുന്നു. അവനു ബുദ്ധിഭ്രമം ഉണ്ടെന്നു പറഞ്ഞ് അവന്റെ ചാർച്ചക്കാർ അവനെ കൊണ്ടുപോകാൻ വരുന്നു. ബെയെത്സെബൂലിനെക്കൊണ്ടാണ് അവൻ ഭൂതങ്ങളെ പുറത്താക്കുന്നതെന്നു ശാസ്ത്രിമാർ പറയുന്നു. ഛിദ്രിച്ച വീട്ടിന്നു നിലനില്പാൻ കഴികയില്ലെന്നും, ബലവാനെ പിടിച്ചുകെട്ടാനാണ് താൻ വന്നതെന്നും യേശു പറയുന്നു.
      why_this_sunday: യഥാർത്ഥ ശക്തി എവിടെയാണ് എന്നതിനെക്കുറിച്ചാണ് ഈ ഞായറിലെ വായനകൾ. പ്രഭാതസുവിശേഷം ഇതിന്റെ തുടർച്ചയാണ്; അവിടെ യേശു തന്റെ യഥാർത്ഥ കുടുംബം ആരെന്നു പറയുന്നു.
      take_with_you: ദൈവത്തിന്റെ പ്രവൃത്തിയെ തിന്മ എന്നു വിളിക്കുന്നതാണ് ക്ഷമയുടെ വാതിൽ അടയ്ക്കുന്ന ഒരേയൊരു കാര്യം; കാരണം അതു ക്ഷമിക്കുന്നവനെത്തന്നെ നിരസിക്കുന്നു.
    readings_thread: ജനത്തിന്റെ പാപങ്ങൾ നീക്കിക്കളയുന്ന പാപപരിഹാരദിവസത്തെക്കുറിച്ചു ലേവ്യപുസ്തകം വിവരിക്കുന്നു. ജനത്തെ വഴിതെറ്റിച്ച നേതാക്കന്മാർക്കു ഹോശേയ മുന്നറിയിപ്പു നല്കുന്നു; താഴ്മയുള്ളവരോടുകൂടെ ദൈവം വസിക്കുന്നു എന്നു യെശയ്യാവു പറയുന്നു. ഏകമനസ്സുള്ള ഒരു സമൂഹത്തെ അപ്പൊസ്തലപ്രവൃത്തികളും, ഇടിച്ചുകളഞ്ഞ ഒരു മതിലിനെ എഫെസ്യലേഖനവും കാണിക്കുന്നു.
    scenes:
    - verses: മർക്കൊസ് 3:20–21
      title: ബുദ്ധിഭ്രമം
      text: യേശു വീട്ടിൽ വരുന്നു; അവർക്കു ഭക്ഷണം കഴിപ്പാൻപോലും വഹിയാതവണ്ണം പുരുഷാരം തിങ്ങിക്കൂടുന്നു. അവന്റെ ചാർച്ചക്കാർ അതു കേട്ട്, അവന്നു ബുദ്ധിഭ്രമം ഉണ്ട് എന്നു പറഞ്ഞ് അവനെ പിടിപ്പാൻ വരുന്നു.
      easy_to_miss: ശത്രുക്കൾക്കു മുമ്പേ സ്വന്തം കുടുംബം അവനെ തെറ്റിദ്ധരിക്കുന്നു.
    - verses: മർക്കൊസ് 3:22
      title: അവന്നു ബെയെത്സെബൂൽ ഉണ്ട്
      text: 'യെരൂശലേമിൽനിന്നു വന്ന ശാസ്ത്രിമാർ പറയുന്നു: അവന്നു ബെയെത്സെബൂൽ ഉണ്ടു; ഭൂതങ്ങളുടെ തലവനെക്കൊണ്ടു അവൻ ഭൂതങ്ങളെ പുറത്താക്കുന്നു.'
      easy_to_miss: അവർ അത്ഭുതങ്ങൾ നിഷേധിക്കുന്നില്ല. ശക്തി എവിടെനിന്നു വരുന്നു എന്നതിനെക്കുറിച്ചാണ് അവരുടെ തർക്കം.
    - verses: മർക്കൊസ് 3:23–26
      title: ഛിദ്രിച്ച വീട്
      text: 'യേശു അവരെ അടുക്കെ വിളിച്ച് ഉപമകളാൽ സംസാരിക്കുന്നു: സാത്താന്നു സാത്താനെ എങ്ങനെ പുറത്താക്കുവാൻ കഴിയും? ഒരു രാജ്യം തന്നിൽതന്നേ ഛിദ്രിച്ചു എങ്കിൽ ആ രാജ്യത്തിനു നിലനില്പാൻ കഴികയില്ല. ഒരു വീടു തന്നിൽ തന്നേ ഛിദ്രിച്ചു എങ്കിൽ ആ വീട്ടിന്നു നിലനില്പാൻ കഴികയില്ല.'
      easy_to_miss: യേശു “ഉപമകളാൽ” സംസാരിച്ചു എന്നു മർക്കൊസ് ആദ്യമായി പറയുന്നത് ഇവിടെയാണ്.
    - verses: മർക്കൊസ് 3:27
      title: ബലവാനെ പിടിച്ചുകെട്ടുക
      text: ബലവാനെ പിടിച്ചുകെട്ടീട്ടല്ലാതെ അവന്റെ വീട്ടിൽ കടന്ന് അവന്റെ കോപ്പു കവർന്നുകളവാൻ ആർക്കും കഴികയില്ല.
      easy_to_miss: തടവുകാരെ സ്വതന്ത്രരാക്കാൻ പിശാചിന്റെ വീട്ടിൽ അതിക്രമിച്ചുകടക്കുന്ന ഒരു കവർച്ചക്കാരനായിട്ടാണ് യേശു തന്നെത്തന്നെ വിവരിക്കുന്നത്.
    - verses: മർക്കൊസ് 3:28–30
      title: ക്ഷമ കിട്ടാത്ത പാപം
      text: മനുഷ്യരോടു സകല പാപങ്ങളും സകല ദൂഷണങ്ങളും ക്ഷമിക്കും; പരിശുദ്ധാത്മാവിന്റെ നേരെ ദൂഷണം പറയുന്നവനോ ഒരുനാളും ക്ഷമ കിട്ടുകയില്ല. അവന്നു ഒരു അശുദ്ധാത്മാവു ഉണ്ടു എന്ന് അവർ പറഞ്ഞിരുന്നതുകൊണ്ടാണ് അവൻ ഇതു പറഞ്ഞത്.
      easy_to_miss: 30-ാം വാക്യത്തിൽ മർക്കൊസ് തന്നെ ഈ മുന്നറിയിപ്പു വിശദീകരിക്കുന്നു. ആത്മാവിന്റെ പ്രവൃത്തിയെ തിന്മ എന്നു വിളിക്കുന്നതിനെക്കുറിച്ചാണിത്; അറിയാതെ ചെയ്തുപോകുന്ന ഒരു പാപത്തെക്കുറിച്ചല്ല.
    people:
    - name: യേശുവിന്റെ ചാർച്ചക്കാർ
      role: അവനു ബുദ്ധിഭ്രമം ഉണ്ടെന്നു കരുതി അവനെ വീട്ടിലേക്കു കൊണ്ടുപോകാൻ വരുന്ന ബന്ധുക്കൾ.
      name_meaning: —
      ml: Jesus’ family
    - name: യെരൂശലേമിൽനിന്നുള്ള ശാസ്ത്രിമാർ
      role: അവനെക്കുറിച്ച് അന്വേഷിക്കാൻ അയക്കപ്പെട്ട ന്യായപ്രമാണ ഉപദേഷ്ടാക്കൾ.
      name_meaning: —
      ml: The scribes from Jerusalem
    phrases:
    - term: ബെയെത്സെബൂൽ
      explanation: ഭൂതങ്ങളുടെ തലവന്റെ ഒരു പേര്; ഒരുപക്ഷേ ‘വീട്ടിന്റെ യജമാനൻ’ എന്നർത്ഥം. യേശുവിന്റെ വീടിന്റെ ചിത്രത്തോട് അതു ചേരുന്നു.
    - term: ഉപമ
      explanation: കേൾക്കുന്നവരെ ചിന്തിപ്പിക്കുന്ന ഒരു ചെറിയ കഥയോ താരതമ്യമോ. മർക്കൊസ് ഈ വാക്ക് ആദ്യമായി ഉപയോഗിക്കുന്നത് ഇവിടെയാണ്.
    - term: പരിശുദ്ധാത്മാവിന്റെ നേരെയുള്ള ദൂഷണം
      explanation: ദൈവാത്മാവിന്റെ പ്രവൃത്തിയെ മനഃപൂർവ്വം തിന്മ എന്നു വിളിക്കുക; അങ്ങനെ ആത്മാവു കൊണ്ടുവരുന്ന ക്ഷമയെ നിരസിക്കുക.
    reflection:
      title_en: നിലനില്ക്കുന്ന ഒരു വീട്
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        യേശുവിനു ചുറ്റും തെറ്റിദ്ധാരണയാണ്. അവനു ഭ്രാന്താണെന്ന് അവന്റെ കുടുംബം കരുതുന്നു. അവൻ പിശാചുമായി കൂട്ടുചേർന്നിരിക്കുന്നുവെന്നു മതപണ്ഡിതന്മാർ പറയുന്നു. ആളുകളെ സൌഖ്യമാക്കുന്ന തിരക്കിൽ അവനു ഭക്ഷണം കഴിക്കാൻപോലും കഴിയുന്നില്ല. ഇതിനെല്ലാം നടുവിൽ അവൻ ഒരു ലളിതമായ കഥ പറയുന്നു: ഒരു വീടു തന്നിൽതന്നേ ഛിദ്രിച്ചാൽ അതിനു നിലനില്പാൻ കഴികയില്ല.

        സാത്താൻ തന്നോടുതന്നെ പോരാടുകയല്ല എന്നാണ് അവൻ അർത്ഥമാക്കുന്നത്. അതിലും ബലമുള്ള ഒന്ന് എത്തിയിരിക്കുന്നു. ബലവാനെ പിടിച്ചുകെട്ടി അവന്റെ തടവുകാരെ സ്വതന്ത്രരാക്കാനാണ് യേശു വന്നത്. ഓരോ സൌഖ്യവും പുറത്താക്കപ്പെടുന്ന ഓരോ ഭൂതവും തിന്മയുടെ വീട് ഒഴിഞ്ഞുകൊണ്ടിരിക്കുന്നു എന്നതിന്റെ അടയാളമാണ്.

        ഈ വചനം നമ്മുടെ വീടുകൾക്കും ബാധകമാണ്. പക, മൌനം, മത്സരം എന്നിവയാൽ ഛിദ്രിച്ച ഒരു കുടുംബത്തിനു നിലനില്ക്കാൻ പ്രയാസമാണ്. ഒരു ഇടവകയ്ക്കും അങ്ങനെതന്നെ. യേശുവിന്റെ ശക്തി ഭൂതങ്ങളെ പുറത്താക്കാൻ മാത്രമുള്ളതല്ല. ഭിന്നതകൾ സൌഖ്യമാക്കി ആളുകളെ ഒരു മേല്ക്കൂരയ്ക്കു കീഴിൽ തിരികെ കൊണ്ടുവരാനുള്ളതാണ്. അത്തരം ഒരു വീടിനു നിലനില്ക്കാൻ കഴിയും.
      title_ml: A house that stands
    week:
      question: വീട്ടിൽ നാം എവിടെയാണ് ഭിന്നിച്ചിരിക്കുന്നത്? ഒരുമിച്ചു നില്ക്കാൻ നമ്മെ എന്തു സഹായിക്കും?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച വീട്ടിലെ ഒരു അഭിപ്രായഭിന്നത, ചെറുതാണെങ്കിലും, ആ ദിവസം തീരുംമുമ്പേ പരിഹരിക്കുക.
      prayer: കർത്താവായ യേശുവേ, നീ ബലവാനെ പിടിച്ചുകെട്ടി അവന്റെ തടവുകാരെ സ്വതന്ത്രരാക്കി. ഞങ്ങളുടെ വീടിനെയും സഭയെയും ഭിന്നിപ്പിക്കുന്നവയിൽനിന്നു ഞങ്ങളെ സ്വതന്ത്രരാക്കേണമേ; നിലനില്ക്കുന്ന ഒരു വീടായി ഞങ്ങളെ തീർക്കേണമേ. ആമേൻ.
