one_minute:
  what_happens: Crowds press in so that Jesus cannot even eat. His family comes to take him home, saying he is out of his mind. Scribes say he drives out demons by Beelzebul. Jesus says a divided house cannot stand, and that he has come to tie up the strong man.
  why_this_sunday: This Sunday’s readings are about where real power lies. The morning Gospel follows on, with Jesus naming his true family.
  take_with_you: Calling God’s work evil is the one thing that shuts the door on forgiveness, because it refuses the one who forgives.
readings_thread: Leviticus describes the Day of Atonement, when the people’s sins are carried away. Hosea warns leaders who have led the people astray, and Isaiah says God lives with the humble. Acts shows a community of one heart, and Ephesians a wall broken down.
key_verse:
  ref: Mark 3:25
  ml: '[ML VERSE: Sathyavedapusthakam 1910, Mark 3:25]'
  ml_translation: Sathyavedapusthakam, 1910
  en: If a house is divided against itself, that house cannot stand.
  en_translation: World English Bible
scenes:
- verses: Mark 3:20–21
  title: Out of his mind
  text: 'Jesus goes home, and the crowd is so great they cannot even eat. When his family hears, they set out to seize him, saying: he is out of his mind.'
  easy_to_miss: His own family misunderstands him before his enemies do.
- verses: Mark 3:22
  title: He has Beelzebul
  text: 'Scribes who have come down from Jerusalem say: he is possessed by Beelzebul, and he casts out demons by the prince of demons.'
  easy_to_miss: They do not deny the miracles. They argue about where the power comes from.
- verses: Mark 3:23–26
  title: A divided house
  text: Jesus calls them over and speaks in parables. How can Satan cast out Satan? A kingdom divided against itself cannot stand, nor a house divided against itself.
  easy_to_miss: This is the first time Mark says Jesus spoke “in parables”.
- verses: Mark 3:27
  title: Tying up the strong man
  text: No one can enter a strong man’s house and plunder it unless he first ties up the strong man.
  easy_to_miss: Jesus is describing himself as a burglar who breaks into the devil’s house to set the prisoners free.
- verses: Mark 3:28–30
  title: The sin that cannot be forgiven
  text: 'All sins and blasphemies will be forgiven, but whoever blasphemes against the Holy Spirit never has forgiveness. He said this because they said: he has an unclean spirit.'
  easy_to_miss: Mark explains the warning himself in verse 30. It is about calling the Spirit’s work evil, not about a sin people commit by accident.
