title_as_printed: Seventh Sunday after Pentecost
season:
  en: Pentecost
  gloss: The season of the Holy Spirit
  syr: ܦܢܛܩܘܣܛܐ
tagline: A house divided cannot stand
standfirst: Jesus’ family thinks he has lost his mind, and teachers from Jerusalem say he is working for the devil. He answers both with a story about a strong man and a divided house.
description: Readings for the Seventh Sunday after Pentecost, with Mark 3:20–30, the house divided and the strong man, explained. Reflection and question.
hero_quote:
  text: If a kingdom is divided against itself, that kingdom cannot stand.
  ref: Mark 3:24
