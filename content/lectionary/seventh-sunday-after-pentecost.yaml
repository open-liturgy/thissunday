phrases:
- term: Beelzebul
  explanation: A name for the prince of demons, possibly meaning “lord of the house”, which fits Jesus’ picture of a house.
- term: Parable
  explanation: A short story or comparison that makes the listener think. Mark uses the word for the first time here.
- term: Blasphemy against the Holy Spirit
  explanation: Deliberately calling the work of God’s Spirit evil, and so refusing the forgiveness the Spirit brings.
reflection:
  title_en: A house that stands
  title_ml: '[TITLE ML]'
  read_time: A three-minute read
  body: |-
    Jesus is surrounded by misunderstanding. His family thinks he has gone mad. Religious experts say he is in league with the devil. He is so busy healing people that he cannot eat. In the middle of it all, he tells a simple story: a house divided against itself cannot stand.

    He means that Satan is not fighting himself. Something stronger has arrived. Jesus has come to tie up the strong man and set his captives free. Every healing and every demon driven out is a sign that the house of evil is being emptied.

    The saying also applies to our homes. A family divided by grudges, silence or competition struggles to stand. So does a parish. Jesus’ power is not only for driving out demons. It is for healing divisions and bringing people back under one roof. That kind of house can stand.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Where are we divided at home? What would help us stand together?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Settle one disagreement at home this week, even a small one, before the day ends.
  prayer: Lord Jesus, you bound the strong man and set his captives free. Free us from what divides our home and our Church, and make us a house that stands. Amen.
