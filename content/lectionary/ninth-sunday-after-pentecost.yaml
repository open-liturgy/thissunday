one_minute:
  what_happens: At a Sabbath meal in the house of a leading Pharisee, Jesus notices how the guests choose the places of honour. He advises them to take the lowest place, so the host may invite them higher. Whoever exalts himself will be humbled, and whoever humbles himself will be exalted.
  why_this_sunday: The readings today are about humility and the honour that comes from God rather than from ourselves.
  take_with_you: Real honour is given, not taken.
readings_thread: The psalm cries “My God, why have you forsaken me?”, the prayer of the one who was humbled most. Proverbs says a wise child listens. Isaiah warns of a world turned upside down. Paul tells the Corinthians not to take one another to court.
key_verse:
  ref: Luke 14:11
  ml: തന്നെത്താൻ ഉയർത്തുന്നവൻ എല്ലാം താഴ്ത്തപ്പെടും; തന്നെത്താൻ താഴ്ത്തുന്നവൻ ഉയർത്തപ്പെടും.
  ml_translation: Sathyavedapusthakam, 1910
  en: For everyone who exalts himself will be humbled, and whoever humbles himself will be exalted.”
  en_translation: World English Bible
scenes:
- verses: Luke 14:7
  title: Watching the guests
  text: Jesus notices how the guests are choosing the places of honour, and tells them a parable.
  easy_to_miss: The Pharisees were watching Jesus closely at this meal (Luke 14:1). Jesus was watching them too.
- verses: Luke 14:8
  title: Not the best seat
  text: When someone invites you to a wedding feast, do not sit in the place of honour. Someone more important may have been invited.
  easy_to_miss: Jesus starts with plain social sense. Nobody wants to be embarrassed at a wedding.
- verses: Luke 14:9
  title: Moved down in front of everyone
  text: 'The host will come and say: give this person your seat. Then, ashamed, you will have to take the lowest place.'
  easy_to_miss: By then the only seat left is the lowest. The one who grabbed the top ends at the bottom.
- verses: Luke 14:10
  title: Friend, move up higher
  text: 'Instead, sit in the lowest place, so that when the host comes he will say: friend, move up higher. Then you will be honoured in front of all the guests.'
  easy_to_miss: The host calls the humble guest “friend”. That is the real honour.
- verses: Luke 14:11
  title: Humbled and exalted
  text: For everyone who exalts himself will be humbled, and whoever humbles himself will be exalted.
  easy_to_miss: Luke uses this saying again after the parable of the Pharisee and the tax collector (Luke 18:14).
people:
- name: The host
  ml: വിരുന്നിനു ക്ഷണിച്ചവൻ
  role: A leader of the Pharisees who invited Jesus to a Sabbath meal.
  name_meaning: —
- name: The guests
  ml: വിരുന്നുകാർ
  role: Diners competing quietly for the best places.
  name_meaning: —
phrases:
- term: Places of honour
  explanation: At formal meals people reclined on couches, and the places nearest the host showed rank.
- term: Parable
  explanation: Jesus uses a dinner-party rule to describe how God’s kingdom works.
- term: Exalted
  explanation: Lifted up. In the end it is God who lifts the humble (Luke 1:52).
reflection:
  title_en: The lowest seat
  title_ml: ഒടുക്കത്തെ സ്ഥലം
  read_time: A three-minute read
  body: |-
    We may not fight over seats at dinners, but we know the feeling Jesus describes. Wanting to be noticed. Mentioning our achievements. Making sure people know who we are related to. Feeling slighted when someone else is honoured. It happens at weddings, in offices, in parish committees and on social media.

    Jesus does not tell us to pretend we have no worth. He tells us to leave the honour to the host. Take the lower seat, and let the one who invited you decide where you belong. Being called up by the host is better than being sent down in front of everyone.

    Jesus lived this himself. He took the lowest place of all, the cross, and the Father lifted him up. In a culture that teaches us to promote ourselves, this Gospel is quietly radical. It asks us to stop grabbing and start trusting that God sees, and will honour us in his time.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Where do you most want to be noticed or honoured? What would it look like to take the lower seat there?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Let someone else go first this week, take the credit, or have the better seat, and do not mention it.
  prayer: Lord Jesus, you took the lowest place for our sake. Free us from the need to be noticed, teach us to take the lower seat, and let us hear you say “friend, move up higher”. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം ഒമ്പതാം ഞായർ
      ml: Ninth Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: കല്യാണവിരുന്നിൽ ഒടുക്കത്തെ സ്ഥലത്ത് ഇരിക്കുക
    standfirst: ഒരു വിരുന്നിൽ, ക്ഷണിക്കപ്പെട്ടവർ മുഖ്യാസനങ്ങൾക്കായി തിക്കിത്തിരക്കുന്നതു യേശു കാണുന്നു. ഒരു കല്യാണവിരുന്നിനെക്കുറിച്ചും, എല്ലാവരുടെയും മുമ്പിൽവെച്ചു താഴേക്കു മാറ്റിയിരുത്തപ്പെടുന്നതിന്റെ നാണക്കേടിനെക്കുറിച്ചും അവൻ ഒരു കഥ പറയുന്നു.
    description: പെന്തിക്കോസ്തിക്കു ശേഷം ഒമ്പതാം ഞായറിലെ വായനകൾ, വിരുന്നിലെ ഒടുക്കത്തെ സ്ഥലത്തെക്കുറിച്ചുള്ള ലൂക്കൊസ് 14:7–11 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: പരീശന്മാരുടെ ഒരു പ്രമാണിയുടെ വീട്ടിലെ ശബ്ബത്തുവിരുന്നിൽ, ക്ഷണിക്കപ്പെട്ടവർ മുഖ്യാസനങ്ങൾ തിരഞ്ഞെടുക്കുന്നതു യേശു ശ്രദ്ധിക്കുന്നു. ക്ഷണിച്ചവൻ തങ്ങളെ മുമ്പോട്ടു വിളിക്കേണ്ടതിന്ന് ഒടുക്കത്തെ സ്ഥലത്ത് ഇരിക്കുവാൻ അവൻ ഉപദേശിക്കുന്നു. തന്നെത്താൻ ഉയർത്തുന്നവൻ താഴ്ത്തപ്പെടും; തന്നെത്താൻ താഴ്ത്തുന്നവൻ ഉയർത്തപ്പെടും.
      why_this_sunday: താഴ്മയെക്കുറിച്ചും, നമ്മിൽനിന്നല്ല ദൈവത്തിൽനിന്നു വരുന്ന മാനത്തെക്കുറിച്ചുമാണ് ഇന്നത്തെ വായനകൾ.
      take_with_you: യഥാർത്ഥ മാനം പിടിച്ചെടുക്കുന്നതല്ല, നല്കപ്പെടുന്നതാണ്.
    readings_thread: “എന്റെ ദൈവമേ, എന്റെ ദൈവമേ, നീ എന്നെ കൈവിട്ടതെന്തു?” എന്നു സങ്കീർത്തനം നിലവിളിക്കുന്നു; ഏറ്റവും അധികം താഴ്ത്തപ്പെട്ടവന്റെ പ്രാർത്ഥന. ജ്ഞാനമുള്ള മകൻ കേട്ടനുസരിക്കുന്നു എന്നു സദൃശവാക്യങ്ങൾ പറയുന്നു. തലകീഴായ ഒരു ലോകത്തെക്കുറിച്ചു യെശയ്യാവു മുന്നറിയിപ്പു നല്കുന്നു. അന്യോന്യം ന്യായാസനത്തിലേക്കു കൊണ്ടുപോകരുതെന്നു പൌലൊസ് കൊരിന്ത്യരോടു പറയുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 14:7
      title: അതിഥികളെ ശ്രദ്ധിക്കുന്നു
      text: ക്ഷണിക്കപ്പെട്ടവർ മുഖ്യാസനങ്ങളെ തിരഞ്ഞെടുക്കുന്നതു കണ്ടിട്ട് യേശു അവരോട് ഒരുപമ പറയുന്നു.
      easy_to_miss: ഈ വിരുന്നിൽ പരീശന്മാർ യേശുവിനെ സൂക്ഷിച്ചുനോക്കിക്കൊണ്ടിരുന്നു (ലൂക്കൊസ് 14:1). യേശുവും അവരെ ശ്രദ്ധിക്കുന്നുണ്ടായിരുന്നു.
    - verses: ലൂക്കൊസ് 14:8
      title: മുഖ്യാസനത്തിൽ അല്ല
      text: ഒരുത്തൻ നിന്നെ കല്യാണത്തിന്നു വിളിച്ചാൽ മുഖ്യാസനത്തിൽ ഇരിക്കരുതു; പക്ഷെ നിന്നിലും മാനമേറിയവനെ അവൻ വിളിച്ചിരിക്കാം.
      easy_to_miss: യേശു സാധാരണ സാമൂഹികബോധത്തിൽനിന്നു തുടങ്ങുന്നു. ഒരു കല്യാണത്തിൽ നാണംകെടാൻ ആരും ആഗ്രഹിക്കുന്നില്ല.
    - verses: ലൂക്കൊസ് 14:9
      title: എല്ലാവരുടെയും മുമ്പിൽ താഴേക്ക്
      text: 'നിന്നെയും അവനെയും ക്ഷണിച്ചവൻ വന്ന്: ഇവന്നു ഇടം കൊടുക്ക എന്നു പറയും. അപ്പോൾ നീ നാണത്തോടെ ഒടുക്കത്തെ സ്ഥലത്തു പോയി ഇരിക്കേണ്ടിവരും.'
      easy_to_miss: അപ്പോഴേക്കും ബാക്കിയുള്ളത് ഒടുക്കത്തെ സ്ഥലം മാത്രം. മുകളിലെ ഇരിപ്പിടം പിടിച്ചെടുത്തവൻ ഏറ്റവും താഴെ എത്തുന്നു.
    - verses: ലൂക്കൊസ് 14:10
      title: സ്നേഹിതാ, മുമ്പോട്ടു വന്നു ഇരിക്ക
      text: 'പകരം, ചെന്ന് ഒടുക്കത്തെ സ്ഥലത്തു ഇരിക്ക; നിന്നെ ക്ഷണിച്ചവൻ വരുമ്പോൾ: സ്നേഹിതാ, മുമ്പോട്ടു വന്നു ഇരിക്ക എന്നു പറവാൻ ഇടവരട്ടെ. അപ്പോൾ പന്തിയിൽ ഇരിക്കുന്നവരുടെ മുമ്പിൽ നിനക്കു മാനം ഉണ്ടാകും.'
      easy_to_miss: ക്ഷണിച്ചവൻ താഴ്മയുള്ള അതിഥിയെ “സ്നേഹിതാ” എന്നു വിളിക്കുന്നു. യഥാർത്ഥ മാനം അതാണ്.
    - verses: ലൂക്കൊസ് 14:11
      title: താഴ്ത്തപ്പെടും, ഉയർത്തപ്പെടും
      text: തന്നെത്താൻ ഉയർത്തുന്നവൻ എല്ലാം താഴ്ത്തപ്പെടും; തന്നെത്താൻ താഴ്ത്തുന്നവൻ ഉയർത്തപ്പെടും.
      easy_to_miss: പരീശന്റെയും ചുങ്കക്കാരന്റെയും ഉപമയ്ക്കു ശേഷം ലൂക്കൊസ് ഈ വചനം വീണ്ടും ഉപയോഗിക്കുന്നു (ലൂക്കൊസ് 18:14).
