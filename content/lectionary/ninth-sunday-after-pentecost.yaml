tagline: Take the lowest seat at the wedding
standfirst: At a dinner, Jesus watches the guests jostle for the best seats. He tells them a story about a wedding feast and the embarrassment of being moved down in front of everyone.
description: Readings for the Ninth Sunday after Pentecost, with Luke 14:7–11, the lowest seat at the feast, explained in five scenes. Reflection and question.
