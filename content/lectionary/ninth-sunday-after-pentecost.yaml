      explanation: ദൈവരാജ്യം എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്നു വിവരിക്കാൻ യേശു ഒരു വിരുന്നുമര്യാദ ഉപയോഗിക്കുന്നു.
    - term: ഉയർത്തപ്പെടുക
      explanation: മേലോട്ട് ഉയർത്തപ്പെടുക. ഒടുവിൽ താഴ്മയുള്ളവരെ ഉയർത്തുന്നതു ദൈവമാണ് (ലൂക്കൊസ് 1:52).
    reflection:
      title_en: ഒടുക്കത്തെ സ്ഥലം
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        വിരുന്നുകളിൽ ഇരിപ്പിടത്തിനുവേണ്ടി നാം വഴക്കിടാറില്ലായിരിക്കാം; എന്നാൽ യേശു വിവരിക്കുന്ന ആ തോന്നൽ നമുക്കറിയാം. ശ്രദ്ധിക്കപ്പെടാനുള്ള ആഗ്രഹം. നമ്മുടെ നേട്ടങ്ങൾ എടുത്തുപറയൽ. നാം ആരുടെ ബന്ധുക്കളാണെന്ന് ആളുകൾ അറിയുന്നുവെന്ന് ഉറപ്പാക്കൽ. മറ്റൊരാൾ ബഹുമാനിക്കപ്പെടുമ്പോൾ അവഗണിക്കപ്പെട്ടതായി തോന്നൽ. കല്യാണങ്ങളിലും ഓഫീസുകളിലും ഇടവകക്കമ്മിറ്റികളിലും സോഷ്യൽ മീഡിയയിലും ഇതു സംഭവിക്കുന്നു.

        നമുക്കു വിലയില്ലെന്നു ഭാവിക്കാൻ യേശു പറയുന്നില്ല. മാനം ആതിഥേയനു വിട്ടുകൊടുക്കാനാണ് അവൻ പറയുന്നത്. താഴെയുള്ള ഇരിപ്പിടം എടുക്കുക; നിങ്ങൾ എവിടെയാണ് ഇരിക്കേണ്ടതെന്നു നിങ്ങളെ ക്ഷണിച്ചവൻ തീരുമാനിക്കട്ടെ. എല്ലാവരുടെയും മുമ്പിൽവെച്ചു താഴേക്കു മാറ്റപ്പെടുന്നതിനെക്കാൾ നല്ലത് ആതിഥേയൻ മുമ്പോട്ടു വിളിക്കുന്നതാണ്.

        യേശു തന്നെ ഇങ്ങനെ ജീവിച്ചു. എല്ലാറ്റിലും ഒടുക്കത്തെ സ്ഥലമായ ക്രൂശ് അവൻ ഏറ്റെടുത്തു; പിതാവ് അവനെ ഉയർത്തി. സ്വയം ഉയർത്തിക്കാട്ടാൻ പഠിപ്പിക്കുന്ന ഒരു സംസ്കാരത്തിൽ, ഈ സുവിശേഷം നിശ്ശബ്ദമായി വിപ്ലവകരമാണ്. പിടിച്ചെടുക്കുന്നതു നിർത്തി, ദൈവം കാണുന്നുവെന്നും തന്റെ സമയത്ത് അവൻ നമ്മെ മാനിക്കുമെന്നും ആശ്രയിക്കാൻ അതു നമ്മോടു ചോദിക്കുന്നു.
      title_ml: The lowest seat
    week:
      question: എവിടെയാണ് നിങ്ങൾ ഏറ്റവും ശ്രദ്ധിക്കപ്പെടാനോ ബഹുമാനിക്കപ്പെടാനോ ആഗ്രഹിക്കുന്നത്? അവിടെ താഴെയുള്ള ഇരിപ്പിടം എടുക്കുക എന്നാൽ എങ്ങനെയായിരിക്കും?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച മറ്റൊരാൾ ആദ്യം പോകട്ടെ, അംഗീകാരം നേടട്ടെ, അല്ലെങ്കിൽ നല്ല ഇരിപ്പിടം എടുക്കട്ടെ; അതേക്കുറിച്ച് ഒന്നും പറയാതിരിക്കുക.
      prayer: കർത്താവായ യേശുവേ, ഞങ്ങൾക്കുവേണ്ടി നീ ഒടുക്കത്തെ സ്ഥലം എടുത്തു. ശ്രദ്ധിക്കപ്പെടാനുള്ള ആവശ്യത്തിൽനിന്നു ഞങ്ങളെ സ്വതന്ത്രരാക്കേണമേ; താഴെയുള്ള ഇരിപ്പിടം എടുക്കാൻ ഞങ്ങളെ പഠിപ്പിക്കേണമേ; “സ്നേഹിതാ, മുമ്പോട്ടു വന്നു ഇരിക്ക” എന്നു നീ പറയുന്നതു ഞങ്ങൾ കേൾക്കുമാറാകേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 13:24–35
        ml: മത്തായി 13:24–35
        note: കോതമ്പിന്റെ ഇടയിലെ കള, കടുകുമണി, മാവിലെ പുളിമാവ്.
        printed: St. Matthew 13:24-35
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 13:36–43
        ml: മത്തായി 13:36–43
        note: 'യേശു കളയുടെ ഉപമ വിശദീകരിക്കുന്നു: നീതിമാന്മാർ സൂര്യനെപ്പോലെ പ്രകാശിക്കും.'
        printed: St. Matthew 13:36-43
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Psalm 22:1–21
        ml: സങ്കീർത്തനങ്ങൾ 22:1–21
        note: എന്റെ ദൈവമേ, എന്റെ ദൈവമേ, നീ എന്നെ ഉപേക്ഷിച്ചതു എന്ത്?
        printed: Psalms 22:1-21
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Deuteronomy 4:1–6
        ml: ആവർത്തനം 4:1–6
        note: ഈ ചട്ടങ്ങൾ പ്രമാണിപ്പിൻ; ജാതികളുടെ ദൃഷ്ടിയിൽ ഇതു നിങ്ങളുടെ ജ്ഞാനമായിരിക്കും.
        printed: Deuteronomy 4:1-6
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Proverbs 13:1–7
        ml: സദൃശവാക്യങ്ങൾ 13:1–7
        note: ജ്ഞാനമുള്ള മകൻ അപ്പന്റെ പ്രബോധനം കേൾക്കുന്നു.
        printed: Proverbs 13:1-7
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 24:1–5
        ml: യെശയ്യാവ് 24:1–5
        note: നിവാസികൾ നിത്യനിയമം ലംഘിച്ചതുകൊണ്ടു ഭൂമി അശുദ്ധമായിരിക്കുന്നു.
        printed: Isaiah 24:1-5
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 28:11–22
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 28:11–22
        note: പൌലൊസ് റോമയിൽ എത്തി അവിടത്തെ യെഹൂദപ്രമാണികളെ കാണുന്നു.
        printed: Acts 28:11-22
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 1 Corinthians 6:1–11
        ml: 1 കൊരിന്ത്യർ 6:1–11
        note: തമ്മിൽ തമ്മിൽ വ്യവഹാരത്തിനു പോകുന്നത് എന്തിന്? നിങ്ങൾ കഴുകപ്പെട്ടു, വിശുദ്ധീകരിക്കപ്പെട്ടു.
        printed: I Corinthians 6:1-11
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 14:7–11
        ml: ലൂക്കൊസ് 14:7–11
        note: കല്യാണവിരുന്നിൽ ഒടുക്കത്തെ സ്ഥലത്തു ചെന്നിരിക്ക. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Luke 14:7-11
        main: true
    key_verse:
      ref: ലൂക്കൊസ് 14:11
    hero_quote:
      text: 'നിന്നെ വിളിച്ചാൽ ചെന്നു ഒടുക്കത്തെ സ്ഥലത്തു ഇരിക്ക; നിന്നെ ക്ഷണിച്ചവൻ വരുമ്പോൾ നിന്നോടു: സ്നേഹിതാ, മുമ്പോട്ടു വന്നു ഇരിക്ക എന്നു പറവാൻ ഇടവരട്ടെ.'
      ref: ലൂക്കൊസ് 14:10
