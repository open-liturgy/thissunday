scenes:
- verses: Luke 14:7
  title: Watching the guests
  text: Jesus notices how the guests are choosing the places of honour, and tells them a parable.
  easy_to_miss: The Pharisees were watching Jesus closely at this meal (Luke 14:1). Jesus was watching them too.
- verses: Luke 14:8
  title: Not the best seat
  text: When someone invites you to a wedding feast, do not sit in the place of honour. Someone more important may have been invited.
  easy_to_miss: Jesus starts with plain social sense. Nobody wants to be embarrassed at a wedding.
- verses: Luke 14:9
  title: Moved down in front of everyone
  text: 'The host will come and say: give this person your seat. Then, ashamed, you will have to take the lowest place.'
  easy_to_miss: By then the only seat left is the lowest. The one who grabbed the top ends at the bottom.
- verses: Luke 14:10
  title: Friend, move up higher
  text: 'Instead, sit in the lowest place, so that when the host comes he will say: friend, move up higher. Then you will be honoured in front of all the guests.'
  easy_to_miss: The host calls the humble guest “friend”. That is the real honour.
- verses: Luke 14:11
  title: Humbled and exalted
  text: For everyone who exalts himself will be humbled, and whoever humbles himself will be exalted.
  easy_to_miss: Luke uses this saying again after the parable of the Pharisee and the tax collector (Luke 18:14).
