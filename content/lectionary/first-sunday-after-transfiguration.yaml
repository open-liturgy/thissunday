  name_meaning: —
phrases:
- term: Vineyard
  explanation: A common Old Testament picture of God’s people (Isaiah 5:1–7).
- term: Tax collectors
  explanation: Jews who collected taxes for Rome, often dishonestly. They were seen as traitors.
- term: Koodara Perunnal
  explanation: The Malankara name for the feast of the Transfiguration on 6 August, after the tents (koodaram) Peter offered to build (Matthew 17:4).
reflection:
  title_en: Yes and no
  title_ml: ഉവ്വും ഇല്ലയും
  read_time: A three-minute read
  body: |-
    Most of us are more like the second son than we would like to admit. We say yes easily. Yes, I will pray more. Yes, I will visit. Yes, I will help with that. The yes is sincere when we say it, and then life gets busy, and we never go.

    The first son is not a model either. He was rude to his father. But he thought again and went. Jesus says that is what counts. The tax collectors and prostitutes had said no to God for years. When John the Baptist came, they changed their minds. The respectable people said all the right things and changed nothing.

    This parable is good news for anyone who has said no to God. It is never too late to change your mind and go. And it is a gentle warning for those of us who are good at saying yes. God is not looking for polite answers. He is looking for workers in the vineyard today.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Is there something you said yes to but have not done yet?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Do one thing this week that you promised to do and have been putting off.
  prayer: Father, you call us to work in your vineyard today. Forgive our empty yeses and our stubborn noes. Change our minds, and send us to do your will. Amen.
translations:
  ml:
    name:
      en: മറുരൂപപ്പെരുന്നാളിനു ശേഷം ഒന്നാം ഞായർ
      ml: First Sunday after Transfiguration
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: 'രണ്ടു പുത്രന്മാർ: ഒരാൾ ഇല്ല എന്നു പറഞ്ഞിട്ടു പോകുന്നു, മറ്റേയാൾ പോകാം എന്നു പറഞ്ഞിട്ടു പോകുന്നില്ല'
    standfirst: ഒരു അപ്പൻ തന്റെ രണ്ടു പുത്രന്മാരോടു മുന്തിരിത്തോട്ടത്തിൽ വേല ചെയ്യാൻ പറയുന്നു. ഒരാൾ വിസമ്മതിക്കുന്നു; പിന്നീട് മനസ്സുമാറി പോകുന്നു. മറ്റേയാൾ “ഞാൻ പോകാം അപ്പാ” എന്നു പറയുന്നു; ഒരിക്കലും ചെല്ലുന്നില്ല.
    description: മറുരൂപപ്പെരുന്നാളിനു ശേഷം ഒന്നാം ഞായറിലെ വായനകൾ, രണ്ടു പുത്രന്മാരുടെ ഉപമയായ മത്തായി 21:28–32 വിശദമായി. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: ദൈവാലയത്തിൽവെച്ച് യേശു മഹാപുരോഹിതന്മാരോടും മൂപ്പന്മാരോടും ഒരു ഉപമ പറയുന്നു. ഒരു അപ്പൻ രണ്ടു പുത്രന്മാരോടു തന്റെ മുന്തിരിത്തോട്ടത്തിൽ വേല ചെയ്യാൻ പറയുന്നു. ഒന്നാമൻ ഇല്ല എന്നു പറയുന്നു; പിന്നീടു പോകുന്നു. രണ്ടാമൻ പോകാം എന്നു പറയുന്നു; പോകുന്നില്ല. ചുങ്കക്കാരും വേശ്യമാരും അവർക്കു മുമ്പായി ദൈവരാജ്യത്തിൽ കടക്കുന്നു എന്നു യേശു പറയുന്നു.
      why_this_sunday: മറുരൂപപ്പെരുന്നാളിനു ശേഷം, സഭ മലയിറങ്ങി സാധാരണ അനുസരണത്തിലേക്കു മടങ്ങുന്നു. ഈ ഉപമ പറയുന്നതിനെക്കുറിച്ചല്ല, ചെയ്യുന്നതിനെക്കുറിച്ചാണ്.
      take_with_you: നമ്മുടെ ആദ്യ ഉത്തരത്തെക്കാൾ, പിന്നീടു നാം എന്തു ചെയ്യുന്നു എന്നതാണ് ദൈവം ശ്രദ്ധിക്കുന്നത്.
    readings_thread: ശരിയായ തൂക്കവും അളവും ആവർത്തനം ആവശ്യപ്പെടുന്നു; യഹോവ എന്റെ വെളിച്ചം എന്നു സങ്കീർത്തനം പറയുന്നു. മാറാൻ മനസ്സില്ലാത്തവർക്ക് അവസാനം വന്നിരിക്കുന്നു എന്നു യെഹെസ്കേൽ മുന്നറിയിപ്പു നല്കുന്നു. ദൈവത്തിനു കീഴ്പെടുവാൻ യാക്കോബും, സത്യവും നല്ലതുമായതു ചിന്തിപ്പാൻ ഫിലിപ്പിയലേഖനവും നമ്മോടു പറയുന്നു.
    scenes:
    - verses: മത്തായി 21:28
      title: ഇന്നു പോയി വേല ചെയ്ക
      text: 'നിങ്ങൾക്കു എന്തു തോന്നുന്നു? ഒരു മനുഷ്യന്നു രണ്ടു പുത്രന്മാർ ഉണ്ടായിരുന്നു. അവൻ ഒന്നാമത്തവന്റെ അടുക്കൽ ചെന്നു: മകനേ, ഇന്നു എന്റെ മുന്തിരിത്തോട്ടത്തിൽ പോയി വേല ചെയ്ക എന്നു പറഞ്ഞു.'
      easy_to_miss: തന്റെ അധികാരത്തെ ഇപ്പോൾതന്നെ ചോദ്യം ചെയ്ത മതനേതാക്കന്മാർക്കാണ് യേശു മറുപടി നല്കുന്നത് (മത്തായി 21:23).
    - verses: മത്തായി 21:29
      title: എനിക്കു മനസ്സില്ല
      text: എനിക്കു മനസ്സില്ല എന്ന് അവൻ ഉത്തരം പറഞ്ഞു; എങ്കിലും പിന്നത്തേതിൽ അനുതപിച്ച് അവൻ പോയി.
      easy_to_miss: ‘അനുതപിച്ചു’ എന്നതിന്റെ ഗ്രീക്ക് വാക്കുതന്നെയാണ് യൂദായുടെ മനസ്താപത്തിനും മത്തായി ഉപയോഗിക്കുന്നത് (27:3). ഇവിടെ അതു നല്ലതിലേക്കു നയിക്കുന്നു.
    - verses: മത്തായി 21:30
      title: ഞാൻ പോകാം അപ്പാ
      text: അപ്പൻ രണ്ടാമത്തവന്റെ അടുക്കൽ ചെന്ന് അങ്ങനെ തന്നേ പറഞ്ഞു. ഞാൻ പോകാം അപ്പാ എന്ന് അവൻ ഉത്തരം പറഞ്ഞു; പോയില്ലതാനും.
      easy_to_miss: രണ്ടാമത്തെ പുത്രൻ മര്യാദയോടെ സംസാരിക്കുന്നു. നല്ല പെരുമാറ്റവും അനുസരണവും ഒന്നല്ല.
    - verses: മത്തായി 21:31
      title: ആർ അപ്പന്റെ ഇഷ്ടം ചെയ്തു?
      text: 'ഈ രണ്ടുപേരിൽ ആർ ആകുന്നു അപ്പന്റെ ഇഷ്ടം ചെയ്തത്? ഒന്നാമത്തവൻ എന്ന് അവർ പറയുന്നു. യേശു ഉത്തരം പറയുന്നു: ചുങ്കക്കാരും വേശ്യമാരും നിങ്ങൾക്കു മുമ്പായി ദൈവരാജ്യത്തിൽ കടക്കുന്നു.'
      easy_to_miss: നേതാക്കന്മാർ ശരിയായ ഉത്തരം പറയുന്നു; അതുകൊണ്ടുതന്നെ അവർ തങ്ങളെത്തന്നെ കുറ്റം വിധിക്കുന്നു.
    - verses: മത്തായി 21:32
      title: നിങ്ങൾ അനുതപിച്ചില്ല
      text: യോഹന്നാൻ നീതിമാർഗ്ഗം ഉപദേശിച്ചുകൊണ്ടു നിങ്ങളുടെ അടുക്കൽ വന്നു; നിങ്ങൾ അവനെ വിശ്വസിച്ചില്ല; എന്നാൽ ചുങ്കക്കാരും വേശ്യമാരും അവനെ വിശ്വസിച്ചു. അതു കണ്ടിട്ടും നിങ്ങൾ പിന്നത്തേതിൽ അനുതപിച്ചില്ല.
      easy_to_miss: ആദ്യത്തെ ‘ഇല്ല’ അല്ല യഥാർത്ഥ പരാജയം. മറ്റുള്ളവരിൽ ദൈവം പ്രവർത്തിക്കുന്നതു കണ്ടിട്ടും മനസ്സുമാറ്റാൻ വിസമ്മതിക്കുന്നതാണ്.
    people:
