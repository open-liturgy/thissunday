    phrases:
    - term: മുന്തിരിത്തോട്ടം
      explanation: ദൈവജനത്തിനുള്ള ഒരു സാധാരണ പഴയനിയമചിത്രം (യെശയ്യാവു 5:1–7).
    - term: ചുങ്കക്കാർ
      explanation: റോമിനുവേണ്ടി നികുതി പിരിച്ചിരുന്ന യെഹൂദന്മാർ; പലപ്പോഴും സത്യസന്ധതയില്ലാതെ. അവരെ ദ്രോഹികളായി കണക്കാക്കിയിരുന്നു.
    - term: കൂടാരപ്പെരുന്നാൾ
      explanation: ആഗസ്റ്റ് 6-ലെ മറുരൂപപ്പെരുന്നാളിനുള്ള മലങ്കരപ്പേര്; പത്രൊസ് ഉണ്ടാക്കാമെന്നു പറഞ്ഞ കുടിലുകളിൽനിന്ന് (മത്തായി 17:4).
    reflection:
      title_en: ഉവ്വും ഇല്ലയും
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        സമ്മതിക്കാൻ ഇഷ്ടപ്പെടുന്നതിലും അധികം നമ്മിൽ മിക്കവരും രണ്ടാമത്തെ പുത്രനെപ്പോലെയാണ്. നാം എളുപ്പത്തിൽ ഉവ്വ് എന്നു പറയുന്നു. ഉവ്വ്, ഞാൻ കൂടുതൽ പ്രാർത്ഥിക്കും. ഉവ്വ്, ഞാൻ സന്ദർശിക്കും. ഉവ്വ്, ഞാൻ അതിനു സഹായിക്കും. പറയുമ്പോൾ ആ ഉവ്വ് ആത്മാർത്ഥമാണ്; പിന്നെ ജീവിതം തിരക്കിലാകുന്നു, നാം ഒരിക്കലും പോകുന്നില്ല.

        ഒന്നാമത്തെ പുത്രനും ഒരു മാതൃകയല്ല. അവൻ അപ്പനോടു മര്യാദയില്ലാതെ സംസാരിച്ചു. പക്ഷേ അവൻ വീണ്ടും ചിന്തിച്ചു, പോയി. അതാണ് പ്രധാനം എന്നു യേശു പറയുന്നു. ചുങ്കക്കാരും വേശ്യമാരും വർഷങ്ങളായി ദൈവത്തോട് ഇല്ല എന്നു പറഞ്ഞവരായിരുന്നു. യോഹന്നാൻ സ്നാപകൻ വന്നപ്പോൾ അവർ മനസ്സുമാറ്റി. മാന്യരായവർ ശരിയായതെല്ലാം പറഞ്ഞു; ഒന്നും മാറ്റിയില്ല.

        ദൈവത്തോട് ഇല്ല എന്നു പറഞ്ഞിട്ടുള്ള ഏവർക്കും ഈ ഉപമ സുവാർത്തയാണ്. മനസ്സുമാറ്റി പോകാൻ ഒരിക്കലും വൈകിയിട്ടില്ല. ഉവ്വ് എന്നു പറയുന്നതിൽ മിടുക്കരായ നമുക്ക് ഇതൊരു സൌമ്യമായ മുന്നറിയിപ്പുമാണ്. ദൈവം മര്യാദയുള്ള ഉത്തരങ്ങളല്ല തേടുന്നത്. ഇന്നു മുന്തിരിത്തോട്ടത്തിൽ വേല ചെയ്യുന്നവരെയാണ്.
      title_ml: Yes and no
    week:
      question: ഉവ്വ് എന്നു പറഞ്ഞിട്ട് ഇതുവരെ ചെയ്യാത്ത എന്തെങ്കിലും ഉണ്ടോ?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ചെയ്യാമെന്നു വാക്കുകൊടുത്തിട്ടു മാറ്റിവെച്ചുകൊണ്ടിരുന്ന ഒരു കാര്യം ഈ ആഴ്ച ചെയ്യുക.
      prayer: പിതാവേ, ഇന്നു നിന്റെ മുന്തിരിത്തോട്ടത്തിൽ വേല ചെയ്യാൻ നീ ഞങ്ങളെ വിളിക്കുന്നു. ഞങ്ങളുടെ പൊള്ളയായ ഉവ്വുകളും ശാഠ്യമുള്ള ഇല്ലകളും ക്ഷമിക്കേണമേ. ഞങ്ങളുടെ മനസ്സു മാറ്റേണമേ; നിന്റെ ഇഷ്ടം ചെയ്യാൻ ഞങ്ങളെ അയക്കേണമേ. ആമേൻ.
