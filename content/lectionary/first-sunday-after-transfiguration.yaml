    hero_quote:
      text: 'ഒരു മനുഷ്യന്നു രണ്ടു പുത്രന്മാർ ഉണ്ടായിരുന്നു; അവൻ ഒന്നാമത്തവന്റെ അടുക്കൽ ചെന്നു: മകനേ ഇന്നു എന്റെ മുന്തിരിത്തോട്ടത്തിൽ പോയി വേല ചെയ്ക എന്നു പറഞ്ഞു.'
