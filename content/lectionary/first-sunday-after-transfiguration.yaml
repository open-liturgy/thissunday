tagline: 'Two sons: one says no and goes, one says yes and doesn’t'
standfirst: A father asks his two sons to work in the vineyard. One refuses, then changes his mind and goes. The other says “yes, sir” and never turns up.
description: Readings for the First Sunday after Transfiguration, with Matthew 21:28–32, the parable of the two sons, explained. Reflection and question.
