one_minute:
  what_happens: In the Temple, Jesus tells the chief priests and elders a parable. A father asks two sons to work in his vineyard. The first says no but later goes. The second says yes but does not go. Tax collectors and prostitutes, Jesus says, are entering God’s kingdom ahead of them.
  why_this_sunday: After the feast of the Transfiguration, the Church comes back down the mountain to ordinary obedience. This parable is about doing, not saying.
  take_with_you: God cares less about our first answer than about what we do next.
readings_thread: Deuteronomy demands honest weights and measures, and the psalm says the Lord is my light. Ezekiel warns that the end has come for those who will not change. James tells us to submit to God, and Philippians to think on whatever is true and good.
key_verse:
  ref: Matthew 21:31
  ml: '[ML VERSE: Sathyavedapusthakam 1910, Matthew 21:31]'
  ml_translation: Sathyavedapusthakam, 1910
  en: Which of the two did the will of his father?” They said to him, “The first.” Jesus said to them, “Most certainly I tell you that the tax collectors and the prostitutes are entering into God’s Kingdom before you.
  en_translation: World English Bible
scenes:
- verses: Matthew 21:28
  title: Go and work today
  text: 'What do you think? A man had two sons. He went to the first and said: son, go and work in the vineyard today.'
  easy_to_miss: Jesus is answering religious leaders who have just questioned his authority (Matthew 21:23).
- verses: Matthew 21:29
  title: I will not
  text: 'The son answered: I will not. But later he changed his mind and went.'
  easy_to_miss: The word for “changed his mind” is the same Matthew uses for Judas’ regret (27:3). Here it leads somewhere good.
- verses: Matthew 21:30
  title: I go, sir
  text: 'The father went to the second son and said the same. He answered: I go, sir. But he did not go.'
  easy_to_miss: The second son is polite and calls his father “sir”. Good manners are not the same as obedience.
- verses: Matthew 21:31
  title: Which one did the father’s will?
  text: 'Which of the two did his father’s will? The first, they say. Jesus answers: tax collectors and prostitutes are going into the kingdom of God ahead of you.'
  easy_to_miss: The leaders give the right answer and condemn themselves with it.
- verses: Matthew 21:32
  title: You did not change your minds
  text: John came showing the way of righteousness, and you did not believe him, but tax collectors and prostitutes did. Even after seeing that, you did not change your minds.
  easy_to_miss: The real failure is not the first “no”. It is refusing to change your mind after seeing God at work in others.
