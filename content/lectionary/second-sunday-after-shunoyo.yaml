one_minute:
  what_happens: Jesus says to keep asking, seeking and knocking. A father gives his child good things, and the heavenly Father gives the Holy Spirit. When he drives out a demon, some say he does it by Beelzebul. He answers that he drives them out by the finger of God.
  why_this_sunday: This teaching on prayer comes right after the Lord’s Prayer in Luke 11. The evening Gospel is the parable of the persistent widow.
  take_with_you: The best gift God gives in answer to prayer is himself, the Holy Spirit.
readings_thread: God sees the earth filled with violence and finds Noah, and Ecclesiastes says sorrow can teach the heart. The psalm trusts God’s pure words. Peter says a day is like a thousand years to the Lord, and Thessalonians tells us to stay awake.
key_verse:
  ref: Luke 11:9
  ml: യാചിപ്പിൻ, എന്നാൽ നിങ്ങൾക്കു കിട്ടും; അന്വേഷിപ്പിൻ, എന്നാൽ നിങ്ങൾ കണ്ടെത്തും; മുട്ടുവിൻ എന്നാൽ നിങ്ങൾക്കു തുറക്കും.
  ml_translation: Sathyavedapusthakam, 1910
  en: “I tell you, keep asking, and it will be given you. Keep seeking, and you will find. Keep knocking, and it will be opened to you.
  en_translation: World English Bible
scenes:
- verses: Luke 11:9–10
  title: Ask, seek, knock
  text: Ask and it will be given; seek and you will find; knock and the door will be opened. Everyone who asks receives.
  easy_to_miss: The Greek verbs mean keep on asking, keep on seeking, keep on knocking. Prayer is a habit, not a single try.
- verses: Luke 11:11–13
  title: Fish, not a snake
  text: Which father would give his child a snake instead of a fish, or a scorpion instead of an egg? If you know how to give good gifts, how much more will the Father give the Holy Spirit to those who ask.
  easy_to_miss: 'Matthew’s version says the Father gives “good things” (Matthew 7:11). Luke names the best good thing: the Holy Spirit.'
- verses: Luke 11:14–16
  title: By Beelzebul?
  text: Jesus drives out a demon that made a man mute, and the man speaks. Some say he does it by Beelzebul; others test him by asking for a sign from heaven.
  easy_to_miss: The man who could not speak now speaks, right after a lesson on asking God in prayer.
- verses: Luke 11:17–19
  title: A divided kingdom
  text: Jesus knows their thoughts. Every kingdom divided against itself falls. If Satan is divided, how will his kingdom stand?
  easy_to_miss: Mark tells the same exchange in last month’s Gospel for the Seventh Sunday after Pentecost (Mark 3:20–30).
- verses: Luke 11:20
  title: The finger of God
  text: But if I drive out demons by the finger of God, then the kingdom of God has come upon you.
  easy_to_miss: Pharaoh’s magicians said “this is the finger of God” when they could not copy Moses’ signs (Exodus 8:19).
