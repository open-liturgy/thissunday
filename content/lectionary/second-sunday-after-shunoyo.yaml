  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What have you stopped praying for because it seemed God was not answering?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Start a family prayer list on the fridge, and keep praying for each item until something changes.
  prayer: Heavenly Father, you give good gifts to your children. Teach us to keep asking, seeking and knocking, and above all, give us your Holy Spirit. Amen.
