    key_verse:
      ref: ലൂക്കൊസ് 11:9
    hero_quote:
      text: അങ്ങനെ ദോഷികളായ നിങ്ങൾ നിങ്ങളുടെ മക്കൾക്കു നല്ല ദാനങ്ങളെ കൊടുപ്പാൻ അറിയുന്നു എങ്കിൽ സ്വർഗ്ഗസ്ഥനായ പിതാവു തന്നോടു യാചിക്കുന്നവർക്കു പരിശുദ്ധാത്മാവിനെ എത്ര അധികം കൊടുക്കും.
      ref: ലൂക്കൊസ് 11:13
