one_minute:
  what_happens: Jesus says to keep asking, seeking and knocking. A father gives his child good things, and the heavenly Father gives the Holy Spirit. When he drives out a demon, some say he does it by Beelzebul. He answers that he drives them out by the finger of God.
  why_this_sunday: This teaching on prayer comes right after the Lord’s Prayer in Luke 11. The evening Gospel is the parable of the persistent widow.
  take_with_you: The best gift God gives in answer to prayer is himself, the Holy Spirit.
readings_thread: God sees the earth filled with violence and finds Noah, and Ecclesiastes says sorrow can teach the heart. The psalm trusts God’s pure words. Peter says a day is like a thousand years to the Lord, and Thessalonians tells us to stay awake.
key_verse:
  ref: Luke 11:9
  ml: യാചിപ്പിൻ, എന്നാൽ നിങ്ങൾക്കു കിട്ടും; അന്വേഷിപ്പിൻ, എന്നാൽ നിങ്ങൾ കണ്ടെത്തും; മുട്ടുവിൻ എന്നാൽ നിങ്ങൾക്കു തുറക്കും.
  ml_translation: Sathyavedapusthakam, 1910
  en: “I tell you, keep asking, and it will be given you. Keep seeking, and you will find. Keep knocking, and it will be opened to you.
  en_translation: World English Bible
scenes:
- verses: Luke 11:9–10
  title: Ask, seek, knock
  text: Ask and it will be given; seek and you will find; knock and the door will be opened. Everyone who asks receives.
  easy_to_miss: The Greek verbs mean keep on asking, keep on seeking, keep on knocking. Prayer is a habit, not a single try.
- verses: Luke 11:11–13
  title: Fish, not a snake
  text: Which father would give his child a snake instead of a fish, or a scorpion instead of an egg? If you know how to give good gifts, how much more will the Father give the Holy Spirit to those who ask.
  easy_to_miss: 'Matthew’s version says the Father gives “good things” (Matthew 7:11). Luke names the best good thing: the Holy Spirit.'
- verses: Luke 11:14–16
  title: By Beelzebul?
  text: Jesus drives out a demon that made a man mute, and the man speaks. Some say he does it by Beelzebul; others test him by asking for a sign from heaven.
  easy_to_miss: The man who could not speak now speaks, right after a lesson on asking God in prayer.
- verses: Luke 11:17–19
  title: A divided kingdom
  text: Jesus knows their thoughts. Every kingdom divided against itself falls. If Satan is divided, how will his kingdom stand?
  easy_to_miss: Mark tells the same exchange in last month’s Gospel for the Seventh Sunday after Pentecost (Mark 3:20–30).
- verses: Luke 11:20
  title: The finger of God
  text: But if I drive out demons by the finger of God, then the kingdom of God has come upon you.
  easy_to_miss: Pharaoh’s magicians said “this is the finger of God” when they could not copy Moses’ signs (Exodus 8:19).
people:
- name: The mute man
  ml: ഊമൻ
  role: Freed from a demon that kept him from speaking.
  name_meaning: —
- name: The critics
  ml: കുറ്റം പറഞ്ഞവർ
  role: Some in the crowd who say Jesus works by the power of Beelzebul.
  name_meaning: —
phrases:
- term: Scorpion
  explanation: A curled-up scorpion could look a little like an egg. No loving father would mix them up on purpose.
- term: Finger of God
  explanation: A picture of God’s direct power, used in Exodus for the plagues and the tablets of the law (Exodus 31:18).
- term: Beelzebul
  explanation: A name for the prince of demons.
reflection:
  title_en: Keep knocking
  title_ml: മുട്ടിക്കൊണ്ടേയിരിക്കുക
  read_time: A three-minute read
  body: |-
    Jesus teaches about prayer like a parent talking about parenting. Would you give your hungry child a snake? Of course not. Even imperfect parents give their children what is good. So, he says, think how much more your Father in heaven wants to give you.

    He tells us to keep asking. Not once, but over and over, like a child who keeps coming back to the kitchen. Prayer is not a vending machine, and not every request is granted as we imagine. But nobody who keeps knocking is left standing outside for ever.

    And Luke tells us what God most wants to give: the Holy Spirit. We often ask for things, and that is fine. But the deepest answer to prayer is not a thing. It is God himself, living in us, changing us from inside. That is a gift worth knocking for every day.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What have you stopped praying for because it seemed God was not answering?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Start a family prayer list on the fridge, and keep praying for each item until something changes.
  prayer: Heavenly Father, you give good gifts to your children. Teach us to keep asking, seeking and knocking, and above all, give us your Holy Spirit. Amen.
translations:
  ml:
    name:
      en: ശൂനോയോയ്ക്കു ശേഷം രണ്ടാം ഞായർ
      ml: Second Sunday after Shunoyo
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: 'യാചിപ്പിൻ, അന്വേഷിപ്പിൻ, മുട്ടുവിൻ: പിതാവു പരിശുദ്ധാത്മാവിനെ നല്കുന്നു'
    standfirst: യാചിച്ചും അന്വേഷിച്ചും മുട്ടിയുംകൊണ്ടിരിക്കുവാൻ യേശു തന്റെ സ്നേഹിതരോടു പറയുന്നു. ഒരു മനുഷ്യപിതാവു തന്റെ മകനു മീനിനു പകരം പാമ്പിനെ കൊടുക്കുന്നില്ലെങ്കിൽ, തന്നോടു യാചിക്കുന്നവർക്കു ദൈവം പരിശുദ്ധാത്മാവിനെ എത്ര അധികം കൊടുക്കും?
    description: ശൂനോയോയ്ക്കു ശേഷം രണ്ടാം ഞായറിലെ വായനകൾ, ‘യാചിപ്പിൻ, അന്വേഷിപ്പിൻ, മുട്ടുവിൻ’ എന്ന ലൂക്കൊസ് 11:9–20 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: യാചിച്ചും അന്വേഷിച്ചും മുട്ടിയുംകൊണ്ടിരിക്കുവാൻ യേശു പറയുന്നു. ഒരു അപ്പൻ തന്റെ മകനു നല്ലതു കൊടുക്കുന്നു; സ്വർഗ്ഗസ്ഥനായ പിതാവു പരിശുദ്ധാത്മാവിനെ കൊടുക്കുന്നു. അവൻ ഒരു ഭൂതത്തെ പുറത്താക്കുമ്പോൾ, ബെയെത്സെബൂലിനെക്കൊണ്ടാണ് അതു ചെയ്യുന്നതെന്നു ചിലർ പറയുന്നു. ദൈവത്തിന്റെ ശക്തികൊണ്ടാണ് താൻ അവയെ പുറത്താക്കുന്നതെന്ന് അവൻ ഉത്തരം പറയുന്നു.
      why_this_sunday: ലൂക്കൊസ് 11-ൽ കർത്തൃപ്രാർത്ഥനയ്ക്കു തൊട്ടുപിന്നാലെയാണ് പ്രാർത്ഥനയെക്കുറിച്ചുള്ള ഈ ഉപദേശം. സന്ധ്യയിലെ സുവിശേഷം മടുത്തുപോകാത്ത വിധവയുടെ ഉപമയാണ്.
      take_with_you: 'പ്രാർത്ഥനയ്ക്കു മറുപടിയായി ദൈവം നല്കുന്ന ഏറ്റവും നല്ല ദാനം അവൻ തന്നെയാണ്: പരിശുദ്ധാത്മാവ്.'
    readings_thread: ഭൂമി സാഹസംകൊണ്ടു നിറഞ്ഞിരിക്കുന്നതു ദൈവം കാണുന്നു; അവൻ നോഹയെ കണ്ടെത്തുന്നു. ദുഃഖം ഹൃദയത്തെ പഠിപ്പിക്കുമെന്നു സഭാപ്രസംഗി പറയുന്നു. ദൈവത്തിന്റെ നിർമ്മലവചനങ്ങളിൽ സങ്കീർത്തനം ആശ്രയിക്കുന്നു. കർത്താവിന് ഒരു ദിവസം ആയിരം സംവത്സരംപോലെ എന്നു പത്രൊസ് പറയുന്നു; ഉണർന്നിരിക്കുവാൻ തെസ്സലൊനീക്യലേഖനം പറയുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 11:9–10
      title: യാചിപ്പിൻ, അന്വേഷിപ്പിൻ, മുട്ടുവിൻ
      text: യാചിപ്പിൻ, എന്നാൽ നിങ്ങൾക്കു കിട്ടും; അന്വേഷിപ്പിൻ, എന്നാൽ നിങ്ങൾ കണ്ടെത്തും; മുട്ടുവിൻ, എന്നാൽ നിങ്ങൾക്കു തുറക്കും. യാചിക്കുന്നവന്നു ഏവന്നും ലഭിക്കുന്നു.
      easy_to_miss: ഗ്രീക്ക് ക്രിയകൾക്ക്, യാചിച്ചുകൊണ്ടേയിരിക്കുക, അന്വേഷിച്ചുകൊണ്ടേയിരിക്കുക, മുട്ടിക്കൊണ്ടേയിരിക്കുക എന്നാണ് അർത്ഥം. പ്രാർത്ഥന ഒരു ശീലമാണ്; ഒറ്റത്തവണത്തെ ശ്രമമല്ല.
    - verses: ലൂക്കൊസ് 11:11–13
      title: മീനിനു പകരം പാമ്പോ?
      text: നിങ്ങളിൽ ഒരു അപ്പനോടു മകൻ മീൻ ചോദിച്ചാൽ മീനിന്നു പകരം പാമ്പിനെ കൊടുക്കുമോ? മുട്ട ചോദിച്ചാൽ തേളിനെ കൊടുക്കുമോ? ദോഷികളായ നിങ്ങൾ നിങ്ങളുടെ മക്കൾക്കു നല്ല ദാനങ്ങളെ കൊടുപ്പാൻ അറിയുന്നു എങ്കിൽ, സ്വർഗ്ഗസ്ഥനായ പിതാവു തന്നോടു യാചിക്കുന്നവർക്കു പരിശുദ്ധാത്മാവിനെ എത്ര അധികം കൊടുക്കും.
      easy_to_miss: 'പിതാവു ‘നല്ല ദാനങ്ങൾ’ നല്കുന്നു എന്നാണ് മത്തായി പറയുന്നത് (മത്തായി 7:11). ലൂക്കൊസ് ഏറ്റവും നല്ല ദാനത്തിന്റെ പേരു പറയുന്നു: പരിശുദ്ധാത്മാവ്.'
    - verses: ലൂക്കൊസ് 11:14–16
      title: ബെയെത്സെബൂലിനെക്കൊണ്ടോ?
      text: യേശു ഊമയായോരു ഭൂതത്തെ പുറത്താക്കുന്നു; ഊമൻ സംസാരിക്കുന്നു. ഭൂതങ്ങളുടെ തലവനായ ബെയെത്സെബൂലിനെക്കൊണ്ടാണ് അവൻ അതു ചെയ്യുന്നതെന്നു ചിലർ പറയുന്നു; വേറെ ചിലർ അവനെ പരീക്ഷിച്ച് ആകാശത്തുനിന്ന് ഒരടയാളം ചോദിക്കുന്നു.
      easy_to_miss: സംസാരിക്കാൻ കഴിയാതിരുന്നവൻ ഇപ്പോൾ സംസാരിക്കുന്നു; പ്രാർത്ഥനയിൽ ദൈവത്തോടു ചോദിക്കുന്നതിനെക്കുറിച്ചുള്ള പാഠത്തിനു തൊട്ടുപിന്നാലെ.
    - verses: ലൂക്കൊസ് 11:17–19
      title: ഛിദ്രിച്ച രാജ്യം
      text: യേശു അവരുടെ വിചാരം അറിയുന്നു. തന്നിൽതന്നേ ഛിദ്രിച്ച രാജ്യം എല്ലാം പാഴായ്പോകും. സാത്താനും തന്നോടു തന്നേ ഛിദ്രിച്ചു എങ്കിൽ, അവന്റെ രാജ്യം എങ്ങനെ നിലനില്ക്കും?
      easy_to_miss: പെന്തിക്കോസ്തിക്കു ശേഷം ഏഴാം ഞായറിലെ സുവിശേഷത്തിൽ (മർക്കൊസ് 3:20–30) മർക്കൊസ് ഇതേ സംഭാഷണം പറയുന്നു.
    - verses: ലൂക്കൊസ് 11:20
      title: ദൈവത്തിന്റെ ശക്തികൊണ്ട്
      text: എന്നാൽ ദൈവത്തിന്റെ ശക്തികൊണ്ടു ഞാൻ ഭൂതങ്ങളെ പുറത്താക്കുന്നു എങ്കിൽ ദൈവരാജ്യം നിങ്ങളുടെ അടുക്കൽ വന്നിരിക്കുന്നു സ്പഷ്ടം.
      easy_to_miss: 'ഗ്രീക്കിൽ ഇവിടെ ‘ദൈവത്തിന്റെ വിരൽ’ എന്നാണ്. മോശെയുടെ അടയാളങ്ങൾ അനുകരിക്കാൻ കഴിയാതെവന്നപ്പോൾ ഫറവോന്റെ മന്ത്രവാദികൾ പറഞ്ഞു: “ഇതു ദൈവത്തിന്റെ വിരൽ ആകുന്നു” (പുറപ്പാടു 8:19).'
    people:
    - name: ഊമൻ
      role: സംസാരിക്കാൻ കഴിയാതാക്കിയ ഒരു ഭൂതത്തിൽനിന്നു സ്വതന്ത്രനാക്കപ്പെട്ടവൻ.
      name_meaning: —
      ml: The mute man
    - name: വിമർശകർ
      role: ബെയെത്സെബൂലിന്റെ ശക്തികൊണ്ടാണ് യേശു പ്രവർത്തിക്കുന്നതെന്നു പറയുന്ന, പുരുഷാരത്തിലെ ചിലർ.
      name_meaning: —
      ml: The critics
    phrases:
    - term: തേൾ
      explanation: ചുരുണ്ടുകിടക്കുന്ന തേൾ ഒരു മുട്ടയോട് അല്പം സാമ്യമുള്ളതായി തോന്നാം. സ്നേഹമുള്ള ഒരു അപ്പനും മനഃപൂർവ്വം അവ മാറിക്കൊടുക്കുകയില്ല.
    - term: ദൈവത്തിന്റെ വിരൽ
      explanation: ദൈവത്തിന്റെ നേരിട്ടുള്ള ശക്തിയുടെ ചിത്രം; ബാധകൾക്കും ന്യായപ്രമാണത്തിന്റെ കല്പലകകൾക്കും പുറപ്പാടിൽ ഉപയോഗിക്കുന്നു (പുറപ്പാടു 31:18). 1910 വിവർത്തനം ലൂക്കൊസ് 11:20-ൽ ‘ദൈവത്തിന്റെ ശക്തി’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
    - term: ബെയെത്സെബൂൽ
      explanation: ഭൂതങ്ങളുടെ തലവന്റെ ഒരു പേര്.
    reflection:
      title_en: മുട്ടിക്കൊണ്ടേയിരിക്കുക
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        മാതാപിതാക്കൾ കുട്ടികളെ വളർത്തുന്നതിനെക്കുറിച്ചു സംസാരിക്കുന്നതുപോലെയാണ് യേശു പ്രാർത്ഥനയെക്കുറിച്ചു പഠിപ്പിക്കുന്നത്. വിശക്കുന്ന നിങ്ങളുടെ കുട്ടിക്കു നിങ്ങൾ പാമ്പിനെ കൊടുക്കുമോ? ഒരിക്കലുമില്ല. കുറവുകളുള്ള മാതാപിതാക്കൾപോലും മക്കൾക്കു നല്ലതു കൊടുക്കുന്നു. അങ്ങനെയെങ്കിൽ, അവൻ പറയുന്നു, സ്വർഗ്ഗസ്ഥനായ നിങ്ങളുടെ പിതാവു നിങ്ങൾക്കു തരാൻ എത്ര അധികം ആഗ്രഹിക്കുന്നു എന്നു ചിന്തിക്കുക.

        യാചിച്ചുകൊണ്ടേയിരിക്കുവാൻ അവൻ നമ്മോടു പറയുന്നു. ഒരിക്കൽ മാത്രമല്ല, അടുക്കളയിലേക്കു വീണ്ടും വീണ്ടും വരുന്ന ഒരു കുട്ടിയെപ്പോലെ, പിന്നെയും പിന്നെയും. പ്രാർത്ഥന ഒരു വെൻഡിംഗ് മെഷീനല്ല; ഓരോ അപേക്ഷയും നാം സങ്കല്പിക്കുന്ന വിധത്തിൽ സാധിക്കുന്നുമില്ല. എന്നാൽ മുട്ടിക്കൊണ്ടേയിരിക്കുന്ന ആരും എന്നേക്കും പുറത്തു നില്ക്കേണ്ടിവരുന്നില്ല.

        ദൈവം ഏറ്റവും നല്കാൻ ആഗ്രഹിക്കുന്നത് എന്താണെന്നു ലൂക്കൊസ് നമ്മോടു പറയുന്നു: പരിശുദ്ധാത്മാവിനെ. നാം പലപ്പോഴും കാര്യങ്ങൾ ചോദിക്കുന്നു; അതിൽ തെറ്റില്ല. എന്നാൽ പ്രാർത്ഥനയ്ക്കുള്ള ഏറ്റവും ആഴമുള്ള ഉത്തരം ഒരു വസ്തുവല്ല. നമ്മിൽ വസിച്ച്, ഉള്ളിൽനിന്നു നമ്മെ മാറ്റുന്ന ദൈവംതന്നെയാണ്. ദിവസവും മുട്ടാൻ തക്ക മൂല്യമുള്ള ദാനമാണത്.
      title_ml: Keep knocking
    week:
      question: ദൈവം ഉത്തരം നല്കുന്നില്ലെന്നു തോന്നിയതുകൊണ്ട്, എന്തിനുവേണ്ടി പ്രാർത്ഥിക്കുന്നതാണ് നിങ്ങൾ നിർത്തിയത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഫ്രിഡ്ജിൽ ഒരു കുടുംബപ്രാർത്ഥനാപട്ടിക തുടങ്ങുക; എന്തെങ്കിലും മാറ്റം വരുന്നതുവരെ ഓരോന്നിനുംവേണ്ടി പ്രാർത്ഥിച്ചുകൊണ്ടിരിക്കുക.
      prayer: സ്വർഗ്ഗസ്ഥനായ പിതാവേ, നിന്റെ മക്കൾക്കു നീ നല്ല ദാനങ്ങൾ നല്കുന്നു. യാചിച്ചും അന്വേഷിച്ചും മുട്ടിയുംകൊണ്ടിരിക്കുവാൻ ഞങ്ങളെ പഠിപ്പിക്കേണമേ; എല്ലാറ്റിനും ഉപരിയായി, നിന്റെ പരിശുദ്ധാത്മാവിനെ ഞങ്ങൾക്കു തരേണമേ. ആമേൻ.
