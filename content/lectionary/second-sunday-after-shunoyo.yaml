        ml: ഉല്പത്തി 6:3–12
        printed: Genesis 6:3-12
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Ecclesiastes 7:1–7
        ml: സഭാപ്രസംഗി 7:1–7
        printed: Ecclesiastes 7:1-7
      - kind: Old Testament
        kind_ml: പഴയനിയമം
