  en: Second Sunday after Shunoyo
  ml: ശൂനോയോയ്ക്കു ശേഷം രണ്ടാം ഞായർ
title_as_printed: Second Sunday after the Festival of the Ascension of St. Mary
season:
  en: Pentecost
  gloss: The season of the Holy Spirit
  syr: ܦܢܛܩܘܣܛܐ
tagline: 'Ask, seek, knock: the Father gives the Holy Spirit'
standfirst: Jesus tells his friends to keep asking, seeking and knocking. If a human father gives his child a fish, not a snake, how much more will God give the Holy Spirit to those who ask?
description: Readings for the Second Sunday after Shunoyo, with Luke 11:9–20, “ask, seek, knock”, explained in five scenes. A reflection and a family question.
hero_quote:
  text: If you then, being evil, know how to give good gifts to your children, how much more will your heavenly Father give the Holy Spirit to those who ask him?
  ref: Luke 11:13
