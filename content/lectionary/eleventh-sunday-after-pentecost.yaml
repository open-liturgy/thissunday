one_minute:
  what_happens: Jesus calls the twelve and sends them out in pairs with authority over unclean spirits. They take nothing but a staff. They stay where they are welcomed and leave where they are not. They preach repentance, cast out demons and anoint many sick people with oil.
  why_this_sunday: The readings today join faith and action. James says faith without works is dead, and in the Gospel the apostles’ faith takes them out on the road.
  take_with_you: Jesus sent them in twos. Nobody is meant to do this alone.
readings_thread: Leviticus says love your neighbour as yourself, and Joshua urges Israel to hold fast to the Lord. Malachi promises Elijah will turn the hearts of parents to their children. James insists that real faith shows itself in action.
key_verse:
  ref: Mark 6:12–13
  ml: അങ്ങനെ അവർ പുറപ്പെട്ടു മാനസാന്തരപ്പെടേണം എന്നു പ്രസംഗിച്ചു; വളരെ ഭൂതങ്ങളെ പുറത്താക്കുകയും അനേകം രോഗികൾക്കു എണ്ണതേച്ചു സൗഖ്യം വരുത്തുകയും ചെയ്തു.
  ml_translation: Sathyavedapusthakam, 1910
  en: They went out and preached that people should repent. They cast out many demons, and anointed many with oil who were sick, and healed them.
  en_translation: World English Bible
scenes:
- verses: Mark 6:7
  title: Two by two
  text: Jesus calls the twelve and begins to send them out two by two, giving them authority over unclean spirits.
  easy_to_miss: Jewish law required two witnesses to confirm a testimony (Deuteronomy 19:15).
- verses: Mark 6:8–9
  title: A staff and sandals
  text: 'Take nothing for the journey except a staff: no bread, no bag, no money. Wear sandals, but not two tunics.'
  easy_to_miss: Israel ate the Passover with sandals on and staff in hand, ready to leave (Exodus 12:11).
- verses: Mark 6:10
  title: Stay where you are welcomed
  text: Wherever you enter a house, stay there until you leave that place.
  easy_to_miss: Moving to a richer host would insult the first one. Loyalty to those who receive you is part of the mission.
- verses: Mark 6:11
  title: Shake off the dust
  text: If any place will not welcome you or listen, shake the dust off your feet as you leave, as a testimony against them.
  easy_to_miss: The apostles are not told to argue or force anyone. They move on.
- verses: Mark 6:12–13
  title: Anointed with oil
  text: They go out and preach that people should repent. They cast out many demons and anoint many sick people with oil and heal them.
  easy_to_miss: Anointing the sick with oil continues in the Church (James 5:14). The Malankara Church calls it the Kantheela service.
people:
- name: The twelve
  ml: പന്ത്രണ്ടു പേർ
  role: Sent out in pairs for the first time in Mark.
  name_meaning: Apostle means “one who is sent”
phrases:
- term: Unclean spirits
  explanation: Mark’s usual name for demons, which harm people and keep them from God.
- term: Tunic
  explanation: The basic garment worn next to the skin. A spare one was a small luxury.
- term: Anointing with oil
  explanation: Olive oil was used as medicine and as a sign of God’s blessing. The Church still prays over the sick with oil.
reflection:
  title_en: Faith on the road
  title_ml: വഴിയിലെ വിശ്വാസം
  read_time: A three-minute read
  body: |-
    James says in today’s epistle that faith without works is dead. In the Gospel we see what he means. The twelve have listened to Jesus for months. Now he sends them out to do what they have seen him do: preach, heal and set people free. Their faith has to walk.

    He sends them in pairs, with almost nothing. They will be tired, sometimes rejected, often unsure. But they will not be alone, and they will have to rely on God and on the people who welcome them. They come back having seen God work through them.

    Faith that stays in our heads is easy to keep and easy to lose. Faith that goes out to visit the sick, pray with the troubled and help the needy grows stronger. Find a partner, as the apostles did. Doing good with someone else is easier to keep up and more fun.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What is one good work we could do this week as a pair, two of us together?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Pair up with someone in your family and visit a sick or housebound person from your parish.
  prayer: Lord Jesus, you sent your apostles out two by two. Send us out too, with faith that works, hands that heal and hearts that trust you for everything we need. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം പതിനൊന്നാം ഞായർ
      ml: Eleventh Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: ഈരണ്ടായി അയക്കപ്പെടുന്നു; രോഗികൾക്കായി എണ്ണയുമായി
    standfirst: ഒരു വടിയും ചെരിപ്പും ധരിച്ചിരിക്കുന്ന വസ്ത്രവും മാത്രമായി യേശു പന്ത്രണ്ടുപേരെ ഈരണ്ടായി അയക്കുന്നു. അവർ പ്രസംഗിക്കുന്നു, ഭൂതങ്ങളെ പുറത്താക്കുന്നു, രോഗികൾക്ക് എണ്ണ തേക്കുന്നു.
    description: പെന്തിക്കോസ്തിക്കു ശേഷം പതിനൊന്നാം ഞായറിലെ വായനകൾ, പന്ത്രണ്ടുപേരെ ഈരണ്ടായി അയക്കുന്ന മർക്കൊസ് 6:7–13 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: യേശു പന്തിരുവരെ വിളിച്ച്, അശുദ്ധാത്മാക്കളുടെമേൽ അധികാരം കൊടുത്ത്, ഈരണ്ടായി അയക്കുന്നു. ഒരു വടി അല്ലാതെ അവർ ഒന്നും എടുക്കുന്നില്ല. സ്വീകരിക്കപ്പെടുന്നിടത്ത് അവർ പാർക്കുന്നു; സ്വീകരിക്കപ്പെടാത്തിടം വിട്ടുപോകുന്നു. മാനസാന്തരപ്പെടേണം എന്ന് അവർ പ്രസംഗിക്കുന്നു, ഭൂതങ്ങളെ പുറത്താക്കുന്നു, അനേകം രോഗികൾക്ക് എണ്ണ തേച്ചു സൌഖ്യം വരുത്തുന്നു.
      why_this_sunday: ഇന്നത്തെ വായനകൾ വിശ്വാസത്തെയും പ്രവൃത്തിയെയും ഒന്നിപ്പിക്കുന്നു. പ്രവൃത്തിയില്ലാത്ത വിശ്വാസം നിർജ്ജീവമെന്നു യാക്കോബ് പറയുന്നു; സുവിശേഷത്തിൽ അപ്പൊസ്തലന്മാരുടെ വിശ്വാസം അവരെ വഴിയിലേക്കിറക്കുന്നു.
      take_with_you: യേശു അവരെ ഈരണ്ടായി അയച്ചു. ഇതു തനിയെ ചെയ്യേണ്ടതല്ല.
    readings_thread: കൂട്ടുകാരനെ നിന്നെപ്പോലെ തന്നേ സ്നേഹിക്കേണം എന്നു ലേവ്യപുസ്തകം പറയുന്നു; കർത്താവിനോടു പറ്റിനില്ക്കുവാൻ യോശുവ യിസ്രായേലിനെ ഉദ്ബോധിപ്പിക്കുന്നു. അപ്പന്മാരുടെ ഹൃദയം മക്കളിലേക്കു തിരിക്കുന്ന ഏലീയാവിനെ മലാഖി വാഗ്ദത്തം ചെയ്യുന്നു. യഥാർത്ഥ വിശ്വാസം പ്രവൃത്തിയിൽ വെളിപ്പെടുന്നു എന്നു യാക്കോബ് തറപ്പിച്ചുപറയുന്നു.
    scenes:
    - verses: മർക്കൊസ് 6:7
      title: ഈരണ്ടായി
      text: യേശു പന്തിരുവരെ അടുക്കെ വിളിച്ച്, അവർക്കു അശുദ്ധാത്മാക്കളുടെമേൽ അധികാരം കൊടുത്ത്, അവരെ ഈരണ്ടായി അയച്ചുതുടങ്ങുന്നു.
      easy_to_miss: ഒരു സാക്ഷ്യം ഉറപ്പിക്കാൻ രണ്ടു സാക്ഷികൾ വേണമെന്നു യെഹൂദ ന്യായപ്രമാണം ആവശ്യപ്പെട്ടിരുന്നു (ആവർത്തനം 19:15).
    - verses: മർക്കൊസ് 6:8–9
      title: ഒരു വടിയും ചെരിപ്പും
      text: വഴിക്കു വടി അല്ലാതെ ഒന്നും എടുക്കരുതു; അപ്പവും പൊക്കണവും മടിശ്ശീലയിൽ കാശും അരുതു. ചെരിപ്പു ഇട്ടുകൊള്ളാം; രണ്ടു വസ്ത്രം ധരിക്കരുതു.
      easy_to_miss: ചെരിപ്പിട്ട്, വടി കയ്യിൽ പിടിച്ച്, പുറപ്പെടാൻ ഒരുങ്ങിയാണ് യിസ്രായേൽ പെസഹ ഭക്ഷിച്ചത് (പുറപ്പാടു 12:11).
    - verses: മർക്കൊസ് 6:10
      title: സ്വീകരിക്കുന്നിടത്തു പാർക്കുക
      text: നിങ്ങൾ എവിടെയെങ്കിലും ഒരു വീട്ടിൽ ചെന്നാൽ അവിടം വിട്ടു പുറപ്പെടുവോളം അതിൽ തന്നേ പാർപ്പിൻ.
      easy_to_miss: കൂടുതൽ സമ്പന്നനായ ഒരു ആതിഥേയന്റെ അടുക്കലേക്കു മാറുന്നത് ആദ്യത്തെയാളെ അപമാനിക്കലാകും. സ്വീകരിക്കുന്നവരോടുള്ള വിശ്വസ്തത ദൌത്യത്തിന്റെ ഭാഗമാണ്.
    - verses: മർക്കൊസ് 6:11
      title: പൊടി കുടഞ്ഞുകളവിൻ
      text: ആരെങ്കിലും നിങ്ങളെ കൈക്കൊള്ളാതെയും നിങ്ങളുടെ വാക്കു കേൾക്കാതെയും ഇരുന്നാൽ, അവിടം വിട്ടു പോകുമ്പോൾ നിങ്ങളുടെ കാലിലെ പൊടി അവർക്കു സാക്ഷ്യത്തിന്നായി കുടഞ്ഞുകളവിൻ.
      easy_to_miss: തർക്കിക്കാനോ ആരെയെങ്കിലും നിർബന്ധിക്കാനോ അപ്പൊസ്തലന്മാരോടു പറയുന്നില്ല. അവർ മുമ്പോട്ടു പോകുന്നു.
    - verses: മർക്കൊസ് 6:12–13
      title: എണ്ണ തേച്ചു
      text: അങ്ങനെ അവർ പുറപ്പെട്ട്, മാനസാന്തരപ്പെടേണം എന്നു പ്രസംഗിക്കുന്നു. വളരെ ഭൂതങ്ങളെ പുറത്താക്കുകയും അനേകം രോഗികൾക്കു എണ്ണതേച്ചു സൗഖ്യം വരുത്തുകയും ചെയ്യുന്നു.
      easy_to_miss: രോഗികളെ എണ്ണ പൂശുന്നതു സഭയിൽ തുടരുന്നു (യാക്കോബ് 5:14). മലങ്കരസഭ അതിനെ കന്തീല ശുശ്രൂഷ എന്നു വിളിക്കുന്നു.
    people:
    - name: പന്തിരുവർ
      role: മർക്കൊസിൽ ആദ്യമായി ഈരണ്ടായി അയക്കപ്പെടുന്നവർ.
      name_meaning: അപ്പൊസ്തലൻ എന്നാൽ “അയക്കപ്പെട്ടവൻ”
      ml: The twelve
    phrases:
    - term: അശുദ്ധാത്മാക്കൾ
      explanation: ഭൂതങ്ങൾക്കു മർക്കൊസ് സാധാരണ ഉപയോഗിക്കുന്ന പേര്; അവ മനുഷ്യരെ ദ്രോഹിക്കുകയും ദൈവത്തിൽനിന്ന് അകറ്റുകയും ചെയ്യുന്നു.
    - term: വസ്ത്രം
      explanation: ദേഹത്തോടു ചേർന്നു ധരിക്കുന്ന അടിസ്ഥാന വസ്ത്രം. ഒരു മാറ്റുവസ്ത്രം ചെറിയൊരു ആഡംബരമായിരുന്നു.
    - term: എണ്ണ തേക്കുക
      explanation: ഒലിവെണ്ണ മരുന്നായും ദൈവാനുഗ്രഹത്തിന്റെ അടയാളമായും ഉപയോഗിച്ചിരുന്നു. സഭ ഇന്നും രോഗികൾക്കുവേണ്ടി എണ്ണയോടെ പ്രാർത്ഥിക്കുന്നു.
    reflection:
      title_en: വഴിയിലെ വിശ്വാസം
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        പ്രവൃത്തിയില്ലാത്ത വിശ്വാസം നിർജ്ജീവമാകുന്നു എന്ന് ഇന്നത്തെ ലേഖനത്തിൽ യാക്കോബ് പറയുന്നു. അവൻ എന്താണ് അർത്ഥമാക്കുന്നതെന്നു സുവിശേഷത്തിൽ നാം കാണുന്നു. മാസങ്ങളായി പന്തിരുവർ യേശുവിനെ കേട്ടുകൊണ്ടിരിക്കുന്നു. അവൻ ചെയ്യുന്നതായി അവർ കണ്ടതു ചെയ്യാൻ ഇപ്പോൾ അവൻ അവരെ അയക്കുന്നു: പ്രസംഗിക്കുക, സൌഖ്യമാക്കുക, ആളുകളെ സ്വതന്ത്രരാക്കുക. അവരുടെ വിശ്വാസം നടക്കണം.

        ഏതാണ്ട് ഒന്നുമില്ലാതെ, ഈരണ്ടായി അവൻ അവരെ അയക്കുന്നു. അവർ ക്ഷീണിക്കും, ചിലപ്പോൾ തിരസ്കരിക്കപ്പെടും, പലപ്പോഴും ഉറപ്പില്ലാതിരിക്കും. എന്നാൽ അവർ തനിച്ചായിരിക്കയില്ല; ദൈവത്തെയും തങ്ങളെ സ്വീകരിക്കുന്നവരെയും അവർക്ക് ആശ്രയിക്കേണ്ടിവരും. തങ്ങളിലൂടെ ദൈവം പ്രവർത്തിക്കുന്നതു കണ്ടിട്ടാണ് അവർ മടങ്ങിവരുന്നത്.

        തലയിൽ മാത്രം ഒതുങ്ങുന്ന വിശ്വാസം സൂക്ഷിക്കാൻ എളുപ്പമാണ്, നഷ്ടപ്പെടാനും എളുപ്പമാണ്. രോഗികളെ സന്ദർശിക്കാനും, വിഷമിക്കുന്നവരോടൊപ്പം പ്രാർത്ഥിക്കാനും, ആവശ്യക്കാരെ സഹായിക്കാനും പുറത്തേക്കിറങ്ങുന്ന വിശ്വാസം കൂടുതൽ ബലപ്പെടുന്നു. അപ്പൊസ്തലന്മാരെപ്പോലെ ഒരു കൂട്ടാളിയെ കണ്ടെത്തുക. മറ്റൊരാളോടൊപ്പം നന്മ ചെയ്യുന്നതു തുടർന്നുകൊണ്ടുപോകാൻ എളുപ്പവും കൂടുതൽ സന്തോഷകരവുമാണ്.
      title_ml: Faith on the road
    week:
      question: ഈ ആഴ്ച നമ്മിൽ രണ്ടുപേർ ഒരുമിച്ച്, ഒരു ജോടിയായി, ചെയ്യാവുന്ന ഒരു നല്ല പ്രവൃത്തി എന്താണ്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: കുടുംബത്തിലെ ഒരാളോടൊപ്പം ചേർന്ന്, ഇടവകയിലെ രോഗിയായ അല്ലെങ്കിൽ വീട്ടിൽനിന്നു പുറത്തിറങ്ങാൻ കഴിയാത്ത ഒരാളെ സന്ദർശിക്കുക.
      prayer: കർത്താവായ യേശുവേ, നീ നിന്റെ അപ്പൊസ്തലന്മാരെ ഈരണ്ടായി അയച്ചു. പ്രവൃത്തിയുള്ള വിശ്വാസത്തോടും, സൌഖ്യമാക്കുന്ന കൈകളോടും, ആവശ്യമുള്ളതിനെല്ലാം നിന്നെ ആശ്രയിക്കുന്ന ഹൃദയത്തോടുംകൂടെ ഞങ്ങളെയും അയക്കേണമേ. ആമേൻ.
