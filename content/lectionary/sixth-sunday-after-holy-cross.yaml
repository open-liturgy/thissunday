  explanation: What is given to God and to the poor, which cannot be lost.
reflection:
  title_en: One thing you lack
  title_ml: ഇനി ഒരു കുറവ്
  read_time: A three-minute read
  body: |-
    The rich ruler is easy to like. He is sincere, devout and serious about eternal life. He has kept the commandments since he was a boy. He comes to Jesus with a good question. And he goes away sad, because the answer costs more than he can give.

    Jesus puts his finger on one thing. For this man, it was his wealth. It might have been something else for someone else: a relationship, an ambition, a comfort, a grudge. Whatever we cannot let go of to follow Jesus has quietly become our master.

    The Church year is ending, and soon it begins again at Koodosh Eetho. It is a good moment to ask what one thing stands between us and following Jesus more closely. Letting go feels impossible. Jesus does not deny that. He says only that with God, it is possible.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: If Jesus said to you “you lack one thing”, what do you think he would name?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Give away one thing you are attached to, to someone who needs it more.
  prayer: Lord Jesus, you looked at the rich young ruler with love. Look at us with love, show us the one thing we lack, and give us grace to let go and follow you, for with God all things are possible. Amen.
translations:
  ml:
    name:
      en: സ്ലീബാ പെരുന്നാളിനു ശേഷം ആറാം ഞായർ
      ml: Sixth Sunday after Holy Cross
    season:
      en: സ്ലീബാ
      gloss: സ്ലീബായുടെ കാലം
    tagline: ധനവാനായ പ്രമാണിയും സൂചിക്കുഴയും
    standfirst: ധനവാനും ഭക്തനുമായ ഒരാൾ നിത്യജീവനെ അവകാശമാക്കാൻ എന്തു ചെയ്യണം എന്ന് യേശുവിനോടു ചോദിക്കുന്നു. ജീവിതകാലം മുഴുവൻ അവൻ കല്പനകൾ കാത്തിരിക്കുന്നു. “ഇനി ഒരു കുറവു നിനക്കുണ്ടു” എന്ന് യേശു അവനോടു പറയുന്നു.
    description: 'സ്ലീബാ പെരുന്നാളിനു ശേഷം ആറാം ഞായറിലെ വായനകൾ, ധനവാനായ പ്രമാണി: ലൂക്കൊസ് 18:18–27 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും കുടുംബചോദ്യവും.'
    one_minute:
      what_happens: നിത്യജീവനെ എങ്ങനെ അവകാശമാക്കാം എന്ന് ഒരു പ്രമാണി യേശുവിനോടു ചോദിക്കുന്നു. യേശു കല്പനകൾ എണ്ണിപ്പറയുന്നു; ചെറുപ്പംമുതൽ അവ കാത്തിരിക്കുന്നു എന്ന് അവൻ പറയുന്നു. എല്ലാം വിറ്റു ദരിദ്രർക്കു കൊടുത്ത് തന്നെ അനുഗമിക്കാൻ യേശു പറയുന്നു. എത്രയും ധനവാനാകകൊണ്ട് അവൻ അതിദുഃഖിതനായിത്തീരുന്നു. മനുഷ്യരാൽ അസാദ്ധ്യമായതു ദൈവത്താൽ സാദ്ധ്യമാകുന്നു എന്ന് യേശു പറയുന്നു.
      why_this_sunday: സഭാവർഷത്തിലെ അവസാന ഞായറാഴ്ചകളിൽ ഒന്നാണിത്. നാം ഇപ്പോഴും എന്തിനെ മുറുകെപ്പിടിക്കുന്നു എന്നു സുവിശേഷം ചോദിക്കുന്നു.
      take_with_you: ആ പ്രമാണി വളരെ അടുത്തായിരുന്നു. അവനും യേശുവിനെ അനുഗമിക്കുന്നതിനും ഇടയിൽ ഒരു കാര്യം മാത്രം. നമ്മിൽ മിക്കവർക്കും അങ്ങനെ ഒന്നുണ്ട്.
    readings_thread: തനിക്കു ശേഷിച്ച മകനെ മുറുകെപ്പിടിച്ചുകൊണ്ട്, ബെന്യാമീനെ മിസ്രയീമിലേക്ക് അയയ്ക്കാൻ യാക്കോബ് വിസമ്മതിക്കുന്നു. യഹോവയുടെ പ്രാകാരങ്ങൾക്കായി സങ്കീർത്തനം വാഞ്ഛിക്കുന്നു; ദൈവം ഒരു പുതിയ കാര്യം ചെയ്യുന്നു എന്ന് യെശയ്യാവു പറയുന്നു. പഴയ പുളിമാവിനെ നീക്കിക്കളയാൻ പൌലൊസ് കൊരിന്ത്യരോടു പറയുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 18:18–19
      title: നല്ല ഗുരോ
      text: 'ഒരു പ്രമാണി ചോദിക്കുന്നു: നല്ല ഗുരോ, ഞാൻ നിത്യജീവനെ അവകാശമാക്കേണ്ടതിന്നു എന്തു ചെയ്യേണം? യേശു: എന്നെ നല്ലവൻ എന്നു പറയുന്നതു എന്തു? ദൈവം ഒരുവനല്ലാതെ നല്ലവൻ ആരും ഇല്ല.'
      easy_to_miss: താൻ നല്ലവനല്ല എന്നല്ല യേശു പറയുന്നത്. താൻ ആരോടാണു സംസാരിക്കുന്നത് എന്ന് ആ മനുഷ്യൻ തിരിച്ചറിയുന്നുണ്ടോ എന്ന് അവൻ ചോദിക്കുകയാണ്.
    - verses: ലൂക്കൊസ് 18:20–21
      title: ഇവ ഒക്കെയും ഞാൻ കാത്തിരിക്കുന്നു
      text: 'വ്യഭിചാരം ചെയ്യരുതു; കൊല ചെയ്യരുതു; മോഷ്ടിക്കരുതു; കള്ളസ്സാക്ഷ്യം പറയരുതു; നിന്റെ അപ്പനെയും അമ്മയെയും ബഹുമാനിക്ക എന്നീ കല്പനകളെ നീ അറിയുന്നുവല്ലോ. അവൻ പറയുന്നു: ഇവ ഒക്കെയും ഞാൻ ചെറുപ്പംമുതൽ കാത്തുകൊണ്ടിരിക്കുന്നു.'
      easy_to_miss: മറ്റു മനുഷ്യരെക്കുറിച്ചുള്ള കല്പനകൾ മാത്രമാണ് യേശു എണ്ണിപ്പറയുന്നത്. ദൈവത്തെക്കുറിച്ചുള്ളവയും മോഹിക്കരുത് എന്നതും അവൻ വിട്ടുകളയുന്നു.
    - verses: ലൂക്കൊസ് 18:22–23
      title: ഇനി ഒരു കുറവ്
      text: 'യേശു പറയുന്നു: ഇനി ഒരു കുറവു നിനക്കുണ്ടു; നിനക്കുള്ളതൊക്കെയും വിറ്റു ദരിദ്രന്മാർക്കു പകുത്തുകൊടുക്ക; എന്നാൽ സ്വർഗ്ഗത്തിൽ നിനക്കു നിക്ഷേപം ഉണ്ടാകും; പിന്നെ വന്നു എന്നെ അനുഗമിക്ക. അവൻ എത്രയും ധനവാനാകകൊണ്ടു ഇതു കേട്ടിട്ടു അതിദുഃഖിതനായിത്തീർന്നു.'
      easy_to_miss: കല്പന അവസാനിക്കുന്നത് “എന്നെ അനുഗമിക്ക” എന്നാണ്. ഉപേക്ഷിക്കുന്നതു വാതിലാണ്, ലക്ഷ്യസ്ഥാനമല്ല.
    - verses: ലൂക്കൊസ് 18:24–25
      title: സൂചിക്കുഴ
      text: 'യേശു അവനെ കണ്ടിട്ടു പറയുന്നു: സമ്പത്തുള്ളവർ ദൈവരാജ്യത്തിൽ കടക്കുന്നതു എത്ര പ്രയാസം! ധനവാൻ ദൈവരാജ്യത്തിൽ കടക്കുന്നതിനെക്കാൾ ഒട്ടകം സൂചിക്കുഴയൂടെ കടക്കുന്നതു എളുപ്പം.'
      easy_to_miss: 'മർക്കൊസ് പറയുന്നു: “യേശു അവനെ നോക്കി അവനെ സ്നേഹിച്ചു” (മർക്കൊസ് 10:21). അവന്റെ വാക്കുകൾ സ്നേഹത്തിൽനിന്നാണ്, ന്യായവിധിയിൽനിന്നല്ല.'
    - verses: ലൂക്കൊസ് 18:26–27
      title: ദൈവത്താൽ സാദ്ധ്യം
      text: 'ഇതു കേട്ടവർ ചോദിക്കുന്നു: എന്നാൽ രക്ഷിക്കപ്പെടുവാൻ ആർക്കു കഴിയും? അവൻ ഉത്തരം പറയുന്നു: മനുഷ്യരാൽ അസാദ്ധ്യമായതു ദൈവത്താൽ സാദ്ധ്യമാകുന്നു.'
      easy_to_miss: തൊട്ടടുത്ത അദ്ധ്യായത്തിൽ സക്കായി എന്ന ധനവാൻ തന്റെ വസ്തുവകയിൽ പാതി ദരിദ്രർക്കു കൊടുക്കുന്നു (ലൂക്കൊസ് 19:8). അസാദ്ധ്യമായതു സംഭവിക്കുന്നു.
    people:
    - name: ധനവാനായ പ്രമാണി
      role: നിത്യജീവൻ ആഗ്രഹിക്കുന്ന, ന്യായപ്രമാണം പാലിക്കുന്ന ധനികനായ ഒരു നേതാവ്.
