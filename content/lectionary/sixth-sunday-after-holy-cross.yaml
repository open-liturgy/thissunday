tagline: The rich ruler and the eye of a needle
standfirst: A wealthy, devout man asks Jesus what he must do to inherit eternal life. He has kept the commandments all his life. Jesus tells him he lacks one thing.
description: Readings for the Sixth Sunday after Holy Cross, with Luke 18:18–27, the rich ruler, explained in five scenes. A reflection and a family question.
