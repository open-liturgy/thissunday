      ml: The rich ruler
    - name: പത്രൊസ്
      role: ശിഷ്യന്മാർ സ്വന്തമായതു വിട്ടു എന്നു തൊട്ടുപിന്നാലെ പറയുന്നു (ലൂക്കൊസ് 18:28).
      name_meaning: “പാറ”
      ml: Peter
    phrases:
    - term: പ്രമാണി
      explanation: ഒരുപക്ഷേ പള്ളിയിലെ ഒരു നേതാവോ പ്രാദേശിക സംഘത്തിലെ അംഗമോ. അവൻ യൌവനക്കാരനായിരുന്നു എന്നു മത്തായി പറയുന്നു (മത്തായി 19:20).
    - term: സൂചിക്കുഴ
      explanation: 'മനഃപൂർവ്വം അസാദ്ധ്യമാക്കിയ ഒരു ചിത്രം: നാട്ടിലെ ഏറ്റവും വലിയ മൃഗം ഏറ്റവും ചെറിയ ദ്വാരത്തിലൂടെ.'
    - term: സ്വർഗ്ഗത്തിലെ നിക്ഷേപം
      explanation: ദൈവത്തിനും ദരിദ്രർക്കും കൊടുക്കുന്നത്; അതു നഷ്ടപ്പെടുകയില്ല.
    reflection:
      title_en: ഇനി ഒരു കുറവ്
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ധനവാനായ പ്രമാണിയെ ഇഷ്ടപ്പെടാൻ എളുപ്പമാണ്. അവൻ ആത്മാർത്ഥതയുള്ളവനും ഭക്തനും നിത്യജീവനെക്കുറിച്ചു ഗൗരവമുള്ളവനുമാണ്. ബാല്യംമുതൽ അവൻ കല്പനകൾ കാത്തിരിക്കുന്നു. നല്ലൊരു ചോദ്യവുമായി അവൻ യേശുവിന്റെ അടുക്കൽ വരുന്നു. എന്നിട്ട് ദുഃഖിതനായി അവൻ മടങ്ങിപ്പോകുന്നു; കാരണം, ഉത്തരത്തിന്റെ വില അവനു കൊടുക്കാൻ കഴിയുന്നതിലും അധികമാണ്.

        യേശു ഒരു കാര്യത്തിൽ വിരൽ വെക്കുന്നു. ഈ മനുഷ്യന് അത് അവന്റെ സമ്പത്തായിരുന്നു. മറ്റൊരാൾക്ക് അതു മറ്റൊന്നായിരിക്കാം: ഒരു ബന്ധം, ഒരു മോഹം, ഒരു സുഖം, ഒരു പക. യേശുവിനെ അനുഗമിക്കാൻ നമുക്കു വിട്ടുകൊടുക്കാൻ കഴിയാത്തത് എന്തും നിശ്ശബ്ദമായി നമ്മുടെ യജമാനനായിത്തീർന്നിരിക്കുന്നു.

        സഭാവർഷം അവസാനിക്കുകയാണ്; വൈകാതെ കൂദോശ് ഈത്തോയിൽ അതു വീണ്ടും തുടങ്ങും. യേശുവിനെ കൂടുതൽ അടുത്ത് അനുഗമിക്കുന്നതിനു നമുക്കിടയിൽ നില്ക്കുന്ന ആ ഒരു കാര്യം എന്ത് എന്നു ചോദിക്കാൻ നല്ല സമയമാണിത്. വിട്ടുകൊടുക്കുന്നത് അസാദ്ധ്യമായി തോന്നുന്നു. യേശു അതു നിഷേധിക്കുന്നില്ല. ദൈവത്താൽ അതു സാദ്ധ്യമാകുന്നു എന്നു മാത്രം അവൻ പറയുന്നു.
      title_ml: One thing you lack
    week:
      question: “ഇനി ഒരു കുറവു നിനക്കുണ്ടു” എന്ന് യേശു നിന്നോടു പറഞ്ഞാൽ, അവൻ എന്തിനെ ആയിരിക്കും പേരെടുത്തു പറയുക?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: നിനക്കു പ്രിയമുള്ള ഒരു വസ്തു, അതു നിന്നെക്കാൾ ആവശ്യമുള്ള ഒരാൾക്കു കൊടുക്കുക.
      prayer: കർത്താവായ യേശുവേ, ധനവാനായ ആ പ്രമാണിയെ നീ സ്നേഹത്തോടെ നോക്കി. ഞങ്ങളെയും സ്നേഹത്തോടെ നോക്കേണമേ; ഞങ്ങൾക്കുള്ള ആ ഒരു കുറവ് ഞങ്ങൾക്കു കാണിച്ചുതരേണമേ; വിട്ടുകൊടുത്തു നിന്നെ അനുഗമിക്കാൻ കൃപ നല്കേണമേ; ദൈവത്താൽ എല്ലാം സാദ്ധ്യമാകുന്നുവല്ലോ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 19:13–26
        ml: മത്തായി 19:13–26
        note: യേശു ശിശുക്കളെ അനുഗ്രഹിക്കുന്നു; ധനവാനായ യൌവനക്കാരൻ; ദൈവത്താൽ സകലവും സാദ്ധ്യം.
        printed: St. Matthew 19:13-26
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Mark 10:17–27
        ml: മർക്കൊസ് 10:17–27
        note: ധനവാൻ ദൈവരാജ്യത്തിൽ കടക്കുന്നതിനെക്കാൾ ഒട്ടകം സൂചിക്കുഴയൂടെ കടക്കുന്നത് എളുപ്പം.
        printed: St. Mark 10:17-27
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 42:29–36
        ml: ഉല്പത്തി 42:29–36
        note: 'ബെന്യാമീനെ വിട്ടയയ്ക്കാൻ യാക്കോബ് സമ്മതിക്കുന്നില്ല: ഇതൊക്കെയും എനിക്കു പ്രതികൂലമായിരിക്കുന്നു.'
        printed: Genesis 42:29-36
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Psalm 84
        ml: സങ്കീർത്തനങ്ങൾ 84
        note: നിന്റെ തിരുനിവാസം എത്ര മനോഹരം; നിന്റെ പ്രാകാരങ്ങളിൽ കഴിക്കുന്ന ഒരു ദിവസം ആയിരത്തെക്കാൾ ഉത്തമം.
        printed: Psalms 84
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 43:16–25
        ml: യെശയ്യാവ് 43:16–25
        note: മുമ്പുള്ളവയെ ഓർക്കേണ്ടാ; ഞാൻ ഒരു പുതിയ കാര്യം ചെയ്യുന്നു.
        printed: Isaiah 43:16-25
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 21:27–40
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 21:27–40
        note: പൌലൊസിനെ ദൈവാലയത്തിൽവെച്ചു പിടിക്കുന്നു; റോമൻ പടയാളികൾ അവനെ രക്ഷിക്കുന്നു.
        printed: Acts 21:27-40
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 1 Corinthians 5:6–13
        ml: 1 കൊരിന്ത്യർ 5:6–13
        note: അല്പം പുളിമാവു പിണ്ഡത്തെ മുഴുവനും പുളിപ്പിക്കുന്നു; നമ്മുടെ പെസഹയായി ക്രിസ്തു അറുക്കപ്പെട്ടിരിക്കുന്നു.
        printed: I Corinthians 5:6-13
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 18:18–27
        ml: ലൂക്കൊസ് 18:18–27
        note: 'ധനവാനായ പ്രമാണി: ഇനി ഒരു കുറവു നിനക്കുണ്ട്; ദൈവത്താൽ സകലവും സാദ്ധ്യം. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.'
        printed: St. Luke 18:18-27
        main: true
    key_verse:
      ref: ലൂക്കൊസ് 18:27
    hero_quote:
      text: ഇനി ഒരു കുറവു നിനക്കുണ്ടു; നിനക്കുള്ളതൊക്കെയും വിറ്റു ദരിദ്രന്മാർക്കു പകുത്തുകൊടുക്ക; എന്നാൽ സ്വർഗ്ഗത്തിൽ നിനക്കു നിക്ഷേപം ഉണ്ടാകും; പിന്നെ വന്നു എന്നെ അനുഗമിക്ക.
      ref: ലൂക്കൊസ് 18:22
