one_minute:
  what_happens: A ruler asks Jesus how to inherit eternal life. Jesus lists commandments, and the man says he has kept them since youth. Jesus tells him to sell everything, give to the poor and follow him. The man goes away very sad, because he is very rich. Jesus says what is impossible for people is possible for God.
  why_this_sunday: This is one of the last Sundays of the Church year. The Gospel asks what we still hold on to.
  take_with_you: The ruler was close. One thing stood between him and following Jesus. Most of us have one thing too.
readings_thread: Jacob refuses to let Benjamin go to Egypt, holding on to the son he has left. The psalm longs for the courts of the Lord, and Isaiah says God is doing a new thing. Paul tells the Corinthians to clear out the old yeast.
key_verse:
  ref: Luke 18:27
  ml: 'അതിന്നു അവൻ: മനുഷ്യരാൽ അസാദ്ധ്യമായതു ദൈവത്താൽ സാദ്ധ്യമാകുന്നു എന്നു പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: But he said, “The things which are impossible with men are possible with God.”
  en_translation: World English Bible
scenes:
- verses: Luke 18:18–19
  title: Good Teacher
  text: 'A ruler asks: Good Teacher, what must I do to inherit eternal life? Jesus answers: why do you call me good? No one is good but God alone.'
  easy_to_miss: Jesus is not denying he is good. He is asking whether the man realises who he is talking to.
- verses: Luke 18:20–21
  title: All these I have kept
  text: 'You know the commandments: do not commit adultery, do not murder, do not steal, do not lie, honour your father and mother. He replies: I have kept all these since I was young.'
  easy_to_miss: Jesus lists only the commandments about other people. He leaves out the ones about God, and about coveting.
- verses: Luke 18:22–23
  title: One thing you lack
  text: 'Jesus says: you still lack one thing. Sell all you have, give to the poor, and you will have treasure in heaven. Then come, follow me. The man becomes very sad, for he is very rich.'
  easy_to_miss: The command ends with “follow me”. Giving things up is the door, not the destination.
- verses: Luke 18:24–25
  title: The eye of a needle
  text: 'Jesus looks at him and says: how hard it is for the rich to enter the kingdom of God. It is easier for a camel to go through the eye of a needle.'
  easy_to_miss: Mark says Jesus looked at him and loved him (Mark 10:21). His words come from love, not judgment.
- verses: Luke 18:26–27
  title: Possible with God
  text: 'Those listening ask: then who can be saved? Jesus answers: what is impossible for people is possible for God.'
  easy_to_miss: In the very next chapter, a rich man, Zacchaeus, gives half his goods to the poor (Luke 19:8). The impossible happens.
