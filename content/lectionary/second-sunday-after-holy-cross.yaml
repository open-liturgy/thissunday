week:
  question: What “yeast” gets into our thinking during the week? Is it good or bad?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Replace fifteen minutes of scrolling each day this week with reading one chapter of a Gospel.
  prayer: Lord Jesus, guard our minds from teaching that leads us away from you. When we worry, remind us of all you have already done, and fill us with your truth. Amen.
