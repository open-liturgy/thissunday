tagline: Forgotten bread and the yeast of the Pharisees
standfirst: The disciples cross the lake and realise they forgot to bring bread. Jesus warns them about yeast, and they think he is talking about lunch.
description: Readings for the Second Sunday after Holy Cross, with Matthew 16:5–12, the yeast of the Pharisees, explained in five scenes. A reflection and a question.
