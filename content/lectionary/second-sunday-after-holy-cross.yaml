one_minute:
  what_happens: The disciples forget to bring bread across the lake. Jesus warns them about the yeast of the Pharisees and Sadducees. They think he is complaining about the bread. He reminds them of the two feedings, and they understand he means the Pharisees’ teaching.
  why_this_sunday: The readings today are about wisdom and understanding, and what we let shape our thinking.
  take_with_you: A little wrong teaching, like a little yeast, spreads through everything.
readings_thread: Joseph tests his brothers in Egypt, and Solomon asks God for an understanding heart. Wisdom says power is given by God. The apostles are freed from prison and keep teaching, and Paul says the Corinthians are still ready only for milk.
key_verse:
  ref: Matthew 16:12
  ml: അങ്ങനെ അപ്പത്തിന്റെ പുളിച്ച മാവല്ല, പരീശന്മാരുടെയും സദൂക്യരുടെയും ഉപദേശമത്രേ സൂക്ഷിച്ചുകൊൾവാൻ അവൻ പറഞ്ഞു എന്നു അവർ ഗ്രഹിച്ചു.
  ml_translation: Sathyavedapusthakam, 1910
  en: Then they understood that he didn’t tell them to beware of the yeast of bread, but of the teaching of the Pharisees and Sadducees.
  en_translation: World English Bible
scenes:
- verses: Matthew 16:5
  title: No bread
  text: The disciples reach the other side of the lake and find they have forgotten to bring bread.
  easy_to_miss: This comes straight after the Pharisees demanded a sign from heaven (Matthew 16:1–4).
- verses: Matthew 16:6–7
  title: Beware the yeast
  text: 'Jesus says: watch out, beware of the yeast of the Pharisees and Sadducees. They say among themselves: it is because we brought no bread.'
  easy_to_miss: The disciples are worried about lunch while Jesus is worried about their minds.
- verses: Matthew 16:8–10
  title: Do you not remember?
  text: You of little faith, why talk about having no bread? Do you not remember the five loaves for five thousand, or the seven for four thousand, and how many baskets you gathered?
  easy_to_miss: Jesus asks them to remember. Forgetting what God has done is how worry starts.
- verses: Matthew 16:11
  title: Not about bread
  text: How can you not understand that I was not talking about bread? Beware the yeast of the Pharisees and Sadducees.
  easy_to_miss: Jesus repeats the warning rather than dropping it. He thinks it matters.
- verses: Matthew 16:12
  title: Then they understood
  text: Then they understand that he meant the teaching of the Pharisees and Sadducees, not the yeast in bread.
  easy_to_miss: Pharisees and Sadducees disagreed about much. Jesus groups them together as both refusing to see God at work in him.
people:
- name: The Pharisees
  ml: പരീശന്മാർ
  role: A movement devoted to strict keeping of the law and its traditions.
  name_meaning: Probably “the separated ones”
- name: The Sadducees
  ml: സദൂക്യർ
  role: A priestly party that denied the resurrection.
  name_meaning: Probably from Zadok, the priest
phrases:
- term: Yeast
  explanation: A little yeast works through a whole lump of dough. Usually a picture of corruption spreading (1 Corinthians 5:6).
- term: Little faith
  explanation: Matthew’s gentle rebuke for disciples who trust Jesus, but not enough to stop worrying.
- term: Teaching
  explanation: What the Pharisees and Sadducees taught, which kept people from recognising Jesus.
reflection:
  title_en: Watch what you take in
  title_ml: ഉള്ളിലേക്കെടുക്കുന്നതു സൂക്ഷിക്കുക
  read_time: A three-minute read
  body: |-
    The disciples’ mistake is funny and familiar. Jesus says something serious, and all they can think about is that they forgot the bread. Their stomachs are louder than his words. He has to remind them of two miracles of bread they have already forgotten.

    His warning is about yeast. A small amount, worked into dough, changes the whole loaf. Ideas are like that. A cynical habit of mind, a bitter way of talking about others, a teaching that makes God small: a little of it gets into everything.

    We take in a great deal every day through screens, conversations and what we read. This Gospel asks us to be careful what yeast we let into our minds and homes. And when worry crowds out faith, to do what Jesus told the disciples: remember what God has already done.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What “yeast” gets into our thinking during the week? Is it good or bad?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Replace fifteen minutes of scrolling each day this week with reading one chapter of a Gospel.
  prayer: Lord Jesus, guard our minds from teaching that leads us away from you. When we worry, remind us of all you have already done, and fill us with your truth. Amen.
translations:
  ml:
    name:
      en: സ്ലീബാ പെരുന്നാളിനു ശേഷം രണ്ടാം ഞായർ
      ml: Second Sunday after Holy Cross
    season:
      en: സ്ലീബാ
      gloss: സ്ലീബായുടെ കാലം
    tagline: മറന്നുപോയ അപ്പവും പരീശന്മാരുടെ പുളിച്ച മാവും
    standfirst: ശിഷ്യന്മാർ കടലിനക്കരെ എത്തുമ്പോൾ അപ്പം എടുക്കാൻ മറന്നുപോയി എന്നു മനസ്സിലാക്കുന്നു. യേശു പുളിച്ച മാവിനെക്കുറിച്ചു മുന്നറിയിപ്പു നല്കുന്നു; അവൻ ഉച്ചഭക്ഷണത്തെക്കുറിച്ചാണ് പറയുന്നതെന്ന് അവർ കരുതുന്നു.
    description: സ്ലീബാ പെരുന്നാളിനു ശേഷം രണ്ടാം ഞായറിലെ വായനകൾ, പരീശന്മാരുടെ പുളിച്ച മാവിനെക്കുറിച്ചുള്ള മത്തായി 16:5–12 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: കടലിനക്കരെ പോകുമ്പോൾ ശിഷ്യന്മാർ അപ്പം എടുക്കാൻ മറന്നുപോകുന്നു. പരീശന്മാരുടെയും സദൂക്യരുടെയും പുളിച്ച മാവിനെക്കുറിച്ചു യേശു മുന്നറിയിപ്പു നല്കുന്നു. അപ്പത്തെക്കുറിച്ചാണ് അവൻ പരാതിപ്പെടുന്നതെന്ന് അവർ കരുതുന്നു. രണ്ടു പോഷിപ്പിക്കലുകളെക്കുറിച്ച് അവൻ ഓർമ്മിപ്പിക്കുന്നു; പരീശന്മാരുടെ ഉപദേശമാണ് അവൻ ഉദ്ദേശിക്കുന്നതെന്ന് അവർ ഗ്രഹിക്കുന്നു.
      why_this_sunday: ഇന്നത്തെ വായനകൾ ജ്ഞാനത്തെയും വിവേകത്തെയും കുറിച്ചും, നമ്മുടെ ചിന്തയെ രൂപപ്പെടുത്താൻ നാം എന്തിനെ അനുവദിക്കുന്നു എന്നതിനെക്കുറിച്ചുമാണ്.
      take_with_you: അല്പം പുളിച്ച മാവുപോലെ, അല്പം തെറ്റായ ഉപദേശം എല്ലാറ്റിലും പടരുന്നു.
    readings_thread: യോസേഫ് മിസ്രയീമിൽവെച്ചു തന്റെ സഹോദരന്മാരെ പരീക്ഷിക്കുന്നു; ശലോമോൻ ദൈവത്തോടു വിവേകമുള്ള ഒരു ഹൃദയം ചോദിക്കുന്നു. അധികാരം ദൈവം നല്കുന്നതാണെന്നു ജ്ഞാനം പറയുന്നു. അപ്പൊസ്തലന്മാർ കാരാഗൃഹത്തിൽനിന്നു മോചിതരായി ഉപദേശം തുടരുന്നു; കൊരിന്ത്യർ ഇപ്പോഴും പാലിനു മാത്രമേ ഒരുങ്ങിയിട്ടുള്ളൂ എന്നു പൌലൊസ് പറയുന്നു.
    scenes:
    - verses: മത്തായി 16:5
      title: അപ്പമില്ല
      text: ശിഷ്യന്മാർ അക്കരെ എത്തുമ്പോൾ അപ്പം എടുപ്പാൻ മറന്നുപോയി എന്നു കാണുന്നു.
      easy_to_miss: ആകാശത്തുനിന്ന് ഒരടയാളം പരീശന്മാർ ആവശ്യപ്പെട്ടതിനു തൊട്ടുപിന്നാലെയാണിത് (മത്തായി 16:1–4).
    - verses: മത്തായി 16:6–7
      title: പുളിച്ച മാവു സൂക്ഷിച്ചുകൊൾവിൻ
      text: 'യേശു പറയുന്നു: നോക്കുവിൻ, പരീശന്മാരുടെയും സദൂക്യരുടെയും പുളിച്ച മാവു സൂക്ഷിച്ചുകൊൾവിൻ. അപ്പം കൊണ്ടുപോരായ്കയാൽ ആയിരിക്കും എന്ന് അവർ തമ്മിൽ തമ്മിൽ പറയുന്നു.'
      easy_to_miss: ശിഷ്യന്മാർ ഉച്ചഭക്ഷണത്തെക്കുറിച്ചു വിഷമിക്കുന്നു; യേശു അവരുടെ മനസ്സിനെക്കുറിച്ചാണ് വിഷമിക്കുന്നത്.
    - verses: മത്തായി 16:8–10
      title: നിങ്ങൾ ഓർക്കുന്നില്ലയോ?
      text: അല്പവിശ്വാസികളേ, അപ്പം കൊണ്ടുവരായ്കയാൽ തമ്മിൽ തമ്മിൽ പറയുന്നത് എന്ത്? അയ്യായിരം പേർക്കു അഞ്ചു അപ്പം കൊടുത്തിട്ട് എത്ര കൊട്ട എടുത്തു എന്നും, നാലായിരം പേർക്കു ഏഴു അപ്പം കൊടുത്തിട്ട് എത്ര വട്ടി എടുത്തു എന്നും ഓർക്കുന്നില്ലയോ?
      easy_to_miss: ഓർക്കാൻ യേശു അവരോട് ആവശ്യപ്പെടുന്നു. ദൈവം ചെയ്തതു മറക്കുന്നിടത്താണ് ആകുലത തുടങ്ങുന്നത്.
    - verses: മത്തായി 16:11
      title: അപ്പത്തെക്കുറിച്ചല്ല
      text: പരീശന്മാരുടെയും സദൂക്യരുടെയും പുളിച്ച മാവു സൂക്ഷിച്ചുകൊള്ളേണം എന്നു പറഞ്ഞത് അപ്പത്തെക്കുറിച്ചല്ല എന്നു തിരിച്ചറിയാത്തത് എന്ത്?
      easy_to_miss: മുന്നറിയിപ്പ് ഉപേക്ഷിക്കുന്നതിനു പകരം യേശു അത് ആവർത്തിക്കുന്നു. അതു പ്രധാനമാണെന്ന് അവൻ കരുതുന്നു.
    - verses: മത്തായി 16:12
      title: അപ്പോൾ അവർ ഗ്രഹിച്ചു
      text: അപ്പത്തിന്റെ പുളിച്ച മാവല്ല, പരീശന്മാരുടെയും സദൂക്യരുടെയും ഉപദേശമത്രേ സൂക്ഷിച്ചുകൊൾവാൻ അവൻ പറഞ്ഞത് എന്ന് അപ്പോൾ അവർ ഗ്രഹിക്കുന്നു.
      easy_to_miss: പരീശന്മാരും സദൂക്യരും പലതിലും ഭിന്നിച്ചിരുന്നു. തന്നിൽ ദൈവം പ്രവർത്തിക്കുന്നതു കാണാൻ ഇരുകൂട്ടരും വിസമ്മതിക്കുന്നതിനാൽ യേശു അവരെ ഒന്നിച്ചു പറയുന്നു.
    people:
    - name: പരീശന്മാർ
      role: ന്യായപ്രമാണവും അതിന്റെ പാരമ്പര്യങ്ങളും കർശനമായി പാലിക്കുന്നതിൽ സമർപ്പിതരായ ഒരു പ്രസ്ഥാനം.
      name_meaning: ഒരുപക്ഷേ “വേർതിരിക്കപ്പെട്ടവർ”
      ml: The Pharisees
    - name: സദൂക്യർ
      role: പുനരുത്ഥാനം നിഷേധിച്ച ഒരു പുരോഹിതകക്ഷി.
      name_meaning: ഒരുപക്ഷേ സാദോക്ക് എന്ന പുരോഹിതന്റെ പേരിൽനിന്ന്
      ml: The Sadducees
    phrases:
    - term: പുളിച്ച മാവ്
      explanation: അല്പം പുളിച്ച മാവ് മാവിനെ മുഴുവനും പുളിപ്പിക്കുന്നു. സാധാരണയായി ദുഷിപ്പ് പടരുന്നതിന്റെ ചിത്രം (1 കൊരിന്ത്യർ 5:6).
    - term: അല്പവിശ്വാസികൾ
      explanation: യേശുവിൽ ആശ്രയിക്കുന്നുവെങ്കിലും ആകുലത നിർത്താൻ മാത്രം ആശ്രയിക്കാത്ത ശിഷ്യന്മാരോടുള്ള മത്തായിയുടെ സൌമ്യമായ ശാസന.
    - term: ഉപദേശം
      explanation: യേശുവിനെ തിരിച്ചറിയുന്നതിൽനിന്ന് ആളുകളെ തടഞ്ഞ, പരീശന്മാരും സദൂക്യരും പഠിപ്പിച്ചത്.
    reflection:
      title_en: ഉള്ളിലേക്കെടുക്കുന്നതു സൂക്ഷിക്കുക
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ശിഷ്യന്മാരുടെ തെറ്റ് രസകരവും പരിചിതവുമാണ്. യേശു ഗൌരവമുള്ള ഒരു കാര്യം പറയുന്നു; അവർക്കു ചിന്തിക്കാൻ കഴിയുന്നത് അപ്പം മറന്നുപോയി എന്നതു മാത്രമാണ്. അവന്റെ വാക്കുകളെക്കാൾ ഉച്ചത്തിലാണ് അവരുടെ വിശപ്പ്. അവർ ഇതിനകം മറന്നുപോയ അപ്പത്തിന്റെ രണ്ട് അത്ഭുതങ്ങൾ അവന് അവരെ ഓർമ്മിപ്പിക്കേണ്ടിവരുന്നു.

        അവന്റെ മുന്നറിയിപ്പു പുളിച്ച മാവിനെക്കുറിച്ചാണ്. മാവിൽ ചേർക്കുന്ന ചെറിയൊരു അളവ് അപ്പത്തെ മുഴുവൻ മാറ്റുന്നു. ആശയങ്ങളും അങ്ങനെയാണ്. എല്ലാറ്റിനെയും സംശയത്തോടെ കാണുന്ന ഒരു മനോഭാവം, മറ്റുള്ളവരെക്കുറിച്ചു കയ്പോടെ സംസാരിക്കുന്ന ഒരു ശീലം, ദൈവത്തെ ചെറുതാക്കുന്ന ഒരു ഉപദേശം: അല്പം മതി, അത് എല്ലാറ്റിലും കടക്കും.

        സ്ക്രീനുകളിലൂടെയും സംഭാഷണങ്ങളിലൂടെയും വായിക്കുന്നവയിലൂടെയും ഓരോ ദിവസവും നാം ഏറെ ഉള്ളിലേക്കെടുക്കുന്നു. നമ്മുടെ മനസ്സിലേക്കും വീടുകളിലേക്കും ഏതു പുളിച്ച മാവു കടത്തിവിടുന്നു എന്നു സൂക്ഷിക്കാൻ ഈ സുവിശേഷം ആവശ്യപ്പെടുന്നു. ആകുലത വിശ്വാസത്തെ ഞെരുക്കുമ്പോൾ, യേശു ശിഷ്യന്മാരോടു പറഞ്ഞതു ചെയ്യുക: ദൈവം ഇതിനകം ചെയ്തത് ഓർക്കുക.
      title_ml: Watch what you take in
    week:
      question: ആഴ്ചയിൽ നമ്മുടെ ചിന്തയിലേക്ക് ഏതു ‘പുളിച്ച മാവ്’ ആണ് കടക്കുന്നത്? അതു നല്ലതോ ചീത്തയോ?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച ദിവസവും പതിനഞ്ചു മിനിറ്റ് സ്ക്രോളിംഗിനു പകരം ഒരു സുവിശേഷത്തിലെ ഒരു അദ്ധ്യായം വായിക്കുക.
      prayer: കർത്താവായ യേശുവേ, നിന്നിൽനിന്നു ഞങ്ങളെ അകറ്റുന്ന ഉപദേശങ്ങളിൽനിന്നു ഞങ്ങളുടെ മനസ്സിനെ കാക്കേണമേ. ഞങ്ങൾ ആകുലപ്പെടുമ്പോൾ, നീ ഇതിനകം ചെയ്തതെല്ലാം ഞങ്ങളെ ഓർമ്മിപ്പിക്കേണമേ; നിന്റെ സത്യംകൊണ്ടു ഞങ്ങളെ നിറയ്ക്കേണമേ. ആമേൻ.
