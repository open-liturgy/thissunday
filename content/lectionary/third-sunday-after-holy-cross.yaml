    phrases:
    - term: ശബ്ബത്ത്
      explanation: വിശ്രമത്തിനായി വേർതിരിച്ച ഏഴാം ദിവസം, ശനിയാഴ്ച. ഉയിർപ്പിന്റെ ദിവസമായി ക്രിസ്ത്യാനികൾ ഞായറാഴ്ച ആചരിക്കുന്നു.
    - term: കാഴ്ചയപ്പം
      explanation: ഓരോ ആഴ്ചയും വിശുദ്ധസ്ഥലത്തു ദൈവസന്നിധിയിൽ വെച്ചിരുന്ന പന്ത്രണ്ട് അപ്പം; പുരോഹിതന്മാർ മാത്രമേ അതു തിന്നിരുന്നുള്ളൂ (ലേവ്യപുസ്തകം 24:5–9).
    - term: മനുഷ്യപുത്രൻ
      explanation: ദാനീയേൽ 7:13-ൽനിന്ന്, യേശു തനിക്കുതന്നെ ഉപയോഗിക്കുന്ന സ്ഥാനപ്പേര്.
