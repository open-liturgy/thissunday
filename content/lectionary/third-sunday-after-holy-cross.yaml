phrases:
- term: Sabbath
  explanation: The seventh day, Saturday, set apart for rest. Christians keep Sunday as the day of resurrection.
- term: Bread of the Presence
  explanation: Twelve loaves set out before God in the sanctuary each week, eaten only by priests (Leviticus 24:5–9).
- term: Son of Man
  explanation: Jesus’ title for himself, from Daniel 7:13.
reflection:
  title_en: A day made for us
  title_ml: നമുക്കായി ഉണ്ടായ ദിവസം
  read_time: A three-minute read
  body: |-
    The Pharisees were not wrong to love the Sabbath. It was one of God’s great gifts to Israel: a day when no one, not even a slave, had to work. But they had surrounded it with so many rules that it had become a burden. They watched hungry men pick grain and saw only a broken rule.

    Jesus reminds them why the day exists. God made it for people: for rest, worship and being together. It was never meant to make life harder for the hungry. And he says he is its lord, which means he decides what it is for.

    For Christians, Sunday has become our day of rest and worship. It is easy to let it become either a burden of obligations or just another busy day. Jesus offers a better way: let it be a gift. Come to the Qurbana, rest, eat together, and look out for anyone who is hungry.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: How do we keep Sunday? Does it feel like a gift or a burden?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: 'Plan next Sunday afternoon as real rest for the whole family: no chores, no work, a meal together.'
  prayer: Lord of the Sabbath, you made a day of rest for us. Teach us to receive Sunday as your gift, to worship you with joy, and to care for those in need. Amen.
translations:
  ml:
    name:
      en: സ്ലീബാ പെരുന്നാളിനു ശേഷം മൂന്നാം ഞായർ
      ml: Third Sunday after Holy Cross
    season:
      en: സ്ലീബാ
      gloss: സ്ലീബായുടെ കാലം
    tagline: ശബ്ബത്ത് മനുഷ്യൻ നിമിത്തം ഉണ്ടായി
    standfirst: ശബ്ബത്തിൽ ഒരു വിളഭൂമിയിലൂടെ നടക്കുമ്പോൾ ശിഷ്യന്മാർ തിന്നാനായി കതിർ പറിക്കുന്നു. പരീശന്മാർ എതിർക്കുന്നു. വിശന്നപ്പോൾ ദാവീദ് ഒരിക്കൽ ചെയ്തതിനെക്കുറിച്ച് യേശു അവരെ ഓർമ്മിപ്പിക്കുന്നു.
    description: 'സ്ലീബാ പെരുന്നാളിനു ശേഷം മൂന്നാം ഞായറിലെ വായനകൾ, ശബ്ബത്തിലെ കതിർ: മർക്കൊസ് 2:23–28 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും കുടുംബചോദ്യവും.'
    one_minute:
      what_happens: ശബ്ബത്തിൽ നടക്കുമ്പോൾ ശിഷ്യന്മാർ കതിർ പറിക്കുന്നു. ഇതു വിഹിതമല്ല എന്നു പരീശന്മാർ പറയുന്നു. ദാവീദും കൂടെയുള്ളവരും വിശന്നപ്പോൾ അവൻ കാഴ്ചയപ്പം തിന്നതു യേശു ചൂണ്ടിക്കാണിക്കുന്നു; ശബ്ബത്ത് മനുഷ്യൻ നിമിത്തം ഉണ്ടായി എന്നും മനുഷ്യപുത്രൻ ശബ്ബത്തിന്നും കർത്താവു ആകുന്നു എന്നും പറയുന്നു.
      why_this_sunday: ദൈവകല്പനകൾ എന്തിനുവേണ്ടിയാണ് എന്ന് ഇന്നത്തെ വായനകൾ ചോദിക്കുന്നു. ക്രിസ്തുയേശുവിലുള്ളവർക്ക് ഇപ്പോൾ ശിക്ഷാവിധി ഇല്ല എന്നു റോമർ പറയുന്നു.
      take_with_you: ദൈവത്തിന്റെ വിശ്രമദിവസം ഒരു ദാനമാണ്, ഒരു കെണിയല്ല.
    readings_thread: തങ്ങളുടെ ചാക്കുകളിൽ പണം തിരികെ വെച്ചിരിക്കുന്നതു കണ്ട് യോസേഫിന്റെ സഹോദരന്മാർ ഭയപ്പെടുന്നു. യഹോവാഭക്തി പരിജ്ഞാനത്തിന്റെ ആരംഭം എന്നു സദൃശവാക്യങ്ങൾ പറയുന്നു. ദൈവം അബ്രാഹാമിനെ വിളിച്ചതു സ്തെഫാനൊസ് വിവരിക്കുന്നു; ന്യായപ്രമാണത്തിനു മാത്രം കഴിയാതിരുന്നിടത്ത് ആത്മാവു ജീവൻ നല്കുന്നു എന്നു പൌലൊസ് പറയുന്നു.
    scenes:
    - verses: മർക്കൊസ് 2:23
      title: വിളഭൂമിയിൽകൂടി
      text: ഒരു ശബ്ബത്തിൽ യേശു വിളഭൂമിയിൽകൂടി കടന്നുപോകുമ്പോൾ അവന്റെ ശിഷ്യന്മാർ വഴിനടക്കയിൽ കതിർ പറിച്ചുതുടങ്ങുന്നു.
      easy_to_miss: അയൽക്കാരന്റെ വയലിൽനിന്നു കൈകൊണ്ടു കതിർ പറിക്കാൻ ന്യായപ്രമാണം വഴിയാത്രക്കാരെ അനുവദിച്ചിരുന്നു (ആവർത്തനം 23:25). ദിവസത്തെക്കുറിച്ചു മാത്രമാണ് ചോദ്യം.
    - verses: മർക്കൊസ് 2:24
      title: ഇവർ ഇതു ചെയ്യുന്നത് എന്ത്?
      text: 'പരീശന്മാർ അവനോടു പറയുന്നു: നോക്കു, ഇവർ ശബ്ബത്തിൽ വിഹിതമല്ലാത്തതു ചെയ്യുന്നത് എന്ത്?'
      easy_to_miss: അവരുടെ പാരമ്പര്യം കതിർ പറിക്കുന്നതിനെ കൊയ്ത്തായി, ശബ്ബത്തിൽ വിലക്കപ്പെട്ട വേലകളിൽ ഒന്നായി, കണക്കാക്കി.
    - verses: മർക്കൊസ് 2:25–26
      title: ദാവീദ് ചെയ്തത്
      text: ദാവീദ്, തനിക്കും കൂടെയുള്ളവർക്കും മുട്ടുണ്ടായി വിശന്നപ്പോൾ ചെയ്തത് എന്ത്? അവൻ ദൈവാലയത്തിൽ ചെന്ന്, പുരോഹിതന്മാർക്കല്ലാതെ ആർക്കും തിന്മാൻ വിഹിതമല്ലാത്ത കാഴ്ചയപ്പം തിന്നു കൂടെയുള്ളവർക്കും കൊടുത്തു എന്നു നിങ്ങൾ ഒരിക്കലും വായിച്ചിട്ടില്ലയോ?
      easy_to_miss: ഈ കഥ 1 ശമൂവേൽ 21:1–6-ൽ ആണ്. പഴയനിയമത്തിൽപോലും മനുഷ്യന്റെ ആവശ്യം അനുഷ്ഠാനത്തിനു മുമ്പേ വന്നു.
    - verses: മർക്കൊസ് 2:27
      title: മനുഷ്യൻ നിമിത്തം
      text: മനുഷ്യൻ ശബ്ബത്ത് നിമിത്തമല്ല; ശബ്ബത്ത് മനുഷ്യൻ നിമിത്തമത്രേ ഉണ്ടായത്.
      easy_to_miss: ദാസന്മാർക്കും മൃഗങ്ങൾക്കുംപോലും വിശ്രമമായിട്ടാണ് ദൈവം ശബ്ബത്ത് നല്കിയത് (ആവർത്തനം 5:14). അത് എപ്പോഴും ഒരു ദാനമായിരുന്നു.
    - verses: മർക്കൊസ് 2:28
      title: ശബ്ബത്തിന്നും കർത്താവ്
      text: അങ്ങനെ മനുഷ്യപുത്രൻ ശബ്ബത്തിന്നും കർത്താവു ആകുന്നു.
      easy_to_miss: താൻ ഉണ്ടാക്കിയ ശബ്ബത്തിനു കർത്താവാകാൻ ദൈവത്തിനു മാത്രമേ കഴിയൂ. യേശു ശാന്തമായി ആ സ്ഥാനം അവകാശപ്പെടുന്നു.
    people:
