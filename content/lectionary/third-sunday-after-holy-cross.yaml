      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ശബ്ബത്തിനെ സ്നേഹിച്ചതിൽ പരീശന്മാർക്കു തെറ്റുപറ്റിയില്ല. യിസ്രായേലിനു ദൈവം നല്കിയ മഹത്തായ ദാനങ്ങളിൽ ഒന്നായിരുന്നു അത്: ആർക്കും, ഒരു അടിമയ്ക്കുപോലും, വേല ചെയ്യേണ്ടാത്ത ഒരു ദിവസം. എന്നാൽ അവർ അതിനു ചുറ്റും അനേകം നിയമങ്ങൾ കെട്ടിപ്പൊക്കി, അത് ഒരു ഭാരമായി മാറി. വിശന്ന മനുഷ്യർ കതിർ പറിക്കുന്നതു കണ്ടപ്പോൾ ഒരു ലംഘിക്കപ്പെട്ട നിയമം മാത്രമേ അവർ കണ്ടുള്ളൂ.

        ആ ദിവസം എന്തിനുവേണ്ടിയാണ് എന്ന് യേശു അവരെ ഓർമ്മിപ്പിക്കുന്നു. ദൈവം അതു മനുഷ്യർക്കുവേണ്ടി ഉണ്ടാക്കി: വിശ്രമത്തിനും ആരാധനയ്ക്കും ഒരുമിച്ചായിരിക്കുന്നതിനും. വിശക്കുന്നവരുടെ ജീവിതം കൂടുതൽ പ്രയാസമാക്കാൻ അത് ഒരിക്കലും ഉദ്ദേശിച്ചിരുന്നില്ല. താൻ അതിന്റെ കർത്താവാണെന്നും അവൻ പറയുന്നു; അതായത്, അത് എന്തിനുവേണ്ടിയാണെന്നു തീരുമാനിക്കുന്നത് അവനാണ്.

        ക്രിസ്ത്യാനികൾക്കു ഞായറാഴ്ച നമ്മുടെ വിശ്രമത്തിന്റെയും ആരാധനയുടെയും ദിവസമായിരിക്കുന്നു. അതിനെ ബാദ്ധ്യതകളുടെ ഒരു ഭാരമോ, തിരക്കുള്ള മറ്റൊരു ദിവസമോ ആക്കി മാറ്റാൻ എളുപ്പമാണ്. യേശു ഒരു നല്ല വഴി നല്കുന്നു: അതൊരു ദാനമായിരിക്കട്ടെ. കുർബ്ബാനയ്ക്കു വരിക, വിശ്രമിക്കുക, ഒരുമിച്ചു ഭക്ഷിക്കുക, വിശക്കുന്ന ആരെങ്കിലുമുണ്ടോ എന്നു ശ്രദ്ധിക്കുക.
      title_ml: A day made for us
    week:
      question: നാം ഞായറാഴ്ച എങ്ങനെയാണ് ആചരിക്കുന്നത്? അതൊരു ദാനമായിട്ടാണോ ഭാരമായിട്ടാണോ തോന്നുന്നത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: 'അടുത്ത ഞായറാഴ്ച ഉച്ചകഴിഞ്ഞ്, കുടുംബത്തിനു മുഴുവൻ യഥാർത്ഥ വിശ്രമമായി ആസൂത്രണം ചെയ്യുക: വീട്ടുജോലിയില്ല, ജോലിയില്ല, ഒരുമിച്ച് ഒരു ഭക്ഷണം.'
      prayer: ശബ്ബത്തിന്റെ കർത്താവേ, നീ ഞങ്ങൾക്കായി ഒരു വിശ്രമദിവസം ഉണ്ടാക്കി. ഞായറാഴ്ചയെ നിന്റെ ദാനമായി സ്വീകരിക്കാനും, സന്തോഷത്തോടെ നിന്നെ ആരാധിക്കാനും, ആവശ്യത്തിലിരിക്കുന്നവരെ കരുതാനും ഞങ്ങളെ പഠിപ്പിക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 18:23–35
        ml: മത്തായി 18:23–35
        note: വലിയ കടം ഇളെച്ചുകിട്ടിയിട്ടും ചെറിയ കടം ഇളെച്ചുകൊടുക്കാത്ത കരുണയില്ലാത്ത ദാസൻ.
        printed: St. Matthew 18:23-35
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 16:1–13
        ml: ലൂക്കൊസ് 16:1–13
        note: അനീതിയുള്ള കാര്യവിചാരകൻ; ദൈവത്തെയും മമ്മോനെയും സേവിപ്പാൻ കഴികയില്ല.
        printed: St. Luke 16:1-13
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 42:18–35
        ml: ഉല്പത്തി 42:18–35
        note: യോസേഫ് ശിമെയോനെ പിടിച്ചുവെക്കുന്നു; ചാക്കുകളിൽ പണവുമായി സഹോദരന്മാരെ നാട്ടിലേക്ക് അയയ്ക്കുന്നു.
        printed: Genesis 42:18-35
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Proverbs 1:2–9
        ml: സദൃശവാക്യങ്ങൾ 1:2–9
        note: യഹോവാഭക്തി പരിജ്ഞാനത്തിന്റെ ആരംഭം.
        printed: Proverbs 1:2-9
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 48:12–16
        ml: യെശയ്യാവ് 48:12–16
        note: ഞാൻ ആദ്യനും ഞാൻ അന്ത്യനും ആകുന്നു; എന്റെ കൈ ഭൂമിക്ക് അടിസ്ഥാനമിട്ടു.
        printed: Isaiah 48:12-16
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 7:2–5
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 7:2–5
        note: സ്വന്തദേശം വിട്ടുപോകാൻ ദൈവം അബ്രാഹാമിനെ വിളിച്ചതു സ്തെഫാനൊസ് വിവരിക്കുന്നു.
        printed: Acts 7:2-5
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Romans 8:1–11
        ml: റോമർ 8:1–11
        note: ക്രിസ്തുയേശുവിലുള്ളവർക്ക് ഇപ്പോൾ ശിക്ഷാവിധി ഇല്ല.
        printed: Romans 8:1-11
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Mark 2:23–28
        ml: മർക്കൊസ് 2:23–28
        note: ശബ്ബത്ത് മനുഷ്യൻ നിമിത്തമത്രേ ഉണ്ടായത്, മനുഷ്യൻ ശബ്ബത്ത് നിമിത്തമല്ല. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Mark 2:23-28
        main: true
    key_verse:
      ref: മർക്കൊസ് 2:27
    hero_quote:
      text: അങ്ങനെ മനുഷ്യപുത്രൻ ശബ്ബത്തിന്നും കർത്താവു ആകുന്നു എന്നു പറഞ്ഞു.
      ref: മർക്കൊസ് 2:28
sources:
  lectionary: https://mosc.in/lectionary/kyomtho-easter-to-koodosh-edtho/
reviewed: false
