one_minute:
  what_happens: On the Sabbath the disciples pick grain as they walk. The Pharisees say this is unlawful. Jesus points to David eating the holy bread when he and his men were hungry, and says the Sabbath was made for people, and the Son of Man is lord of the Sabbath.
  why_this_sunday: The readings today ask what God’s commands are for. Romans says there is no condemnation for those in Christ.
  take_with_you: God’s day of rest is a gift, not a trap.
readings_thread: Joseph’s brothers find their money returned in their sacks and are afraid. Proverbs says the fear of the Lord is the beginning of knowledge. Stephen tells how God called Abraham, and Paul says the Spirit gives life where the law alone could not.
key_verse:
  ref: Mark 2:27
  ml: 'പിന്നെ അവൻ അവരോടു: മനുഷ്യൻ ശബ്ബത്ത് നിമിത്തമല്ല; ശബ്ബത്ത് മനുഷ്യൻ നിമിത്തമത്രേ ഉണ്ടായതു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: He said to them, “The Sabbath was made for man, not man for the Sabbath.
  en_translation: World English Bible
scenes:
- verses: Mark 2:23
  title: Through the grain fields
  text: On a Sabbath Jesus is going through the grain fields, and as they walk his disciples begin to pick heads of grain.
  easy_to_miss: The law allowed travellers to pick grain by hand from a neighbour’s field (Deuteronomy 23:25). The question is only about the day.
- verses: Mark 2:24
  title: Why are they doing this?
  text: 'The Pharisees say: look, why are they doing what is not lawful on the Sabbath?'
  easy_to_miss: Their tradition counted picking grain as harvesting, one of the kinds of work forbidden on the Sabbath.
- verses: Mark 2:25–26
  title: What David did
  text: Have you never read what David did when he and his men were hungry? He entered the house of God and ate the holy bread, which only priests could eat, and gave some to his men.
  easy_to_miss: The story is in 1 Samuel 21:1–6. Human need came before ritual even in the Old Testament.
- verses: Mark 2:27
  title: Made for people
  text: The Sabbath was made for people, not people for the Sabbath.
  easy_to_miss: God gave the Sabbath as rest for everyone, including servants and animals (Deuteronomy 5:14). It was always a gift.
- verses: Mark 2:28
  title: Lord of the Sabbath
  text: So the Son of Man is lord even of the Sabbath.
  easy_to_miss: Only God could be lord of the Sabbath he made. Jesus quietly claims that place.
