reflection:
  title_en: Awake at the door
  title_ml: '[TITLE ML]'
  read_time: A three-minute read
  body: |-
    People have always wanted to know when the world will end. Jesus refuses to tell us. Not even the Son knows, he says, only the Father. Instead of a date, he gives a single instruction for everyone: watch.

    Watching in his picture is not staring at the sky. It is servants getting on with the work they have been given, while the doorkeeper stays alert. The house runs as the master would want, because any moment he might walk through the door.

    The Church year is drawing to a close, and the readings turn to the end of all things. That can sound frightening. Jesus means it to make us faithful. If the master came tonight, would he find us doing what he asked: loving, forgiving, praying, serving? That is what it means to be awake.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: If Jesus came back tonight, what would you want him to find you doing?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Do one job you have been neglecting, at home or at church, as if the master were coming tomorrow.
  prayer: Lord Jesus, your words will never pass away. Keep us awake and faithful at our work, so that whenever you come, you find us ready. Amen.
