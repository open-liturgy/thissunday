one_minute:
  what_happens: 'On the Mount of Olives, Jesus tells his disciples to learn from the fig tree: when its leaves appear, summer is near. His words will outlast heaven and earth. Nobody knows the day or hour, so they must stay awake, like servants whose master may return at any time.'
  why_this_sunday: After the Feast of the Holy Cross on 14 September, the last weeks of the Church year look towards Christ’s return.
  take_with_you: Jesus does not ask us to guess the date. He asks us to be found awake.
readings_thread: Joseph’s brothers go down to Egypt for grain, not knowing who they will meet. Isaiah says wash yourselves, learn to do good. Peter says heaven must hold Jesus until all things are restored, and Paul says the Spirit searches the depths of God.
key_verse:
  ref: Mark 13:31
  ml: '[ML VERSE: Sathyavedapusthakam 1910, Mark 13:31]'
  ml_translation: Sathyavedapusthakam, 1910
  en: Heaven and earth will pass away, but my words will not pass away.
  en_translation: World English Bible
scenes:
- verses: Mark 13:28–29
  title: The fig tree
  text: Learn from the fig tree. When its branch becomes tender and puts out leaves, you know summer is near. So when you see these things, know that he is near, at the door.
  easy_to_miss: Most trees in Israel stay green all year. The fig loses its leaves, so its new leaves are a clear sign of a new season.
- verses: Mark 13:30–31
  title: My words will not pass away
  text: This generation will not pass away until all these things happen. Heaven and earth will pass away, but my words will not.
  easy_to_miss: 'Jesus claims for his own words what Isaiah said of God’s word: it stands for ever (Isaiah 40:8).'
- verses: Mark 13:32
  title: No one knows
  text: But about that day or hour no one knows, not the angels in heaven, nor the Son, but only the Father.
  easy_to_miss: Jesus shares our human limits even here. Anyone who claims to know the date knows more than he chose to.
- verses: Mark 13:33–34
  title: The doorkeeper
  text: Be on guard, stay awake. It is like a man going on a journey who leaves his servants in charge, each with work, and tells the doorkeeper to stay awake.
  easy_to_miss: Each servant has their own work. Watching does not mean doing nothing; it means doing your job well.
- verses: Mark 13:35–37
  title: Watch
  text: 'Watch, because you do not know when the master is coming: evening, midnight, cockcrow or morning. Do not let him find you asleep. What I say to you, I say to all: watch.'
  easy_to_miss: 'Evening, midnight, cockcrow, morning: these become the hours of Jesus’ passion in Mark 14–15, when the disciples fall asleep.'
