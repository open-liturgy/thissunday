one_minute:
  what_happens: 'On the Mount of Olives, Jesus tells his disciples to learn from the fig tree: when its leaves appear, summer is near. His words will outlast heaven and earth. Nobody knows the day or hour, so they must stay awake, like servants whose master may return at any time.'
  why_this_sunday: After the Feast of the Holy Cross on 14 September, the last weeks of the Church year look towards Christ’s return.
  take_with_you: Jesus does not ask us to guess the date. He asks us to be found awake.
readings_thread: Joseph’s brothers go down to Egypt for grain, not knowing who they will meet. Isaiah says wash yourselves, learn to do good. Peter says heaven must hold Jesus until all things are restored, and Paul says the Spirit searches the depths of God.
key_verse:
  ref: Mark 13:31
  ml: ആകാശവും ഭൂമിയും ഒഴിഞ്ഞുപോകും; എന്റെ വചനങ്ങളോ ഒഴിഞ്ഞു പോകയില്ല.
  ml_translation: Sathyavedapusthakam, 1910
  en: Heaven and earth will pass away, but my words will not pass away.
  en_translation: World English Bible
scenes:
- verses: Mark 13:28–29
  title: The fig tree
  text: Learn from the fig tree. When its branch becomes tender and puts out leaves, you know summer is near. So when you see these things, know that he is near, at the door.
  easy_to_miss: Most trees in Israel stay green all year. The fig loses its leaves, so its new leaves are a clear sign of a new season.
- verses: Mark 13:30–31
  title: My words will not pass away
  text: This generation will not pass away until all these things happen. Heaven and earth will pass away, but my words will not.
  easy_to_miss: 'Jesus claims for his own words what Isaiah said of God’s word: it stands for ever (Isaiah 40:8).'
- verses: Mark 13:32
  title: No one knows
  text: But about that day or hour no one knows, not the angels in heaven, nor the Son, but only the Father.
  easy_to_miss: Jesus shares our human limits even here. Anyone who claims to know the date knows more than he chose to.
- verses: Mark 13:33–34
  title: The doorkeeper
  text: Be on guard, stay awake. It is like a man going on a journey who leaves his servants in charge, each with work, and tells the doorkeeper to stay awake.
  easy_to_miss: Each servant has their own work. Watching does not mean doing nothing; it means doing your job well.
- verses: Mark 13:35–37
  title: Watch
  text: 'Watch, because you do not know when the master is coming: evening, midnight, cockcrow or morning. Do not let him find you asleep. What I say to you, I say to all: watch.'
  easy_to_miss: 'Evening, midnight, cockcrow, morning: these become the hours of Jesus’ passion in Mark 14–15, when the disciples fall asleep.'
people:
- name: Peter, James, John and Andrew
  ml: പത്രൊസ്, യാക്കോബ്, യോഹന്നാൻ, അന്ത്രെയാസ്
  role: The four disciples who ask Jesus privately about the end (Mark 13:3).
  name_meaning: —
phrases:
- term: Mount of Olives
  explanation: A hill east of Jerusalem facing the Temple, where Jesus gave this teaching.
- term: Doorkeeper
  explanation: The servant who guards the house door and opens it when the master returns.
- term: Sleeba
  explanation: Syriac for “cross”. The Sundays after 14 September are counted from the Feast of the Holy Cross.
reflection:
  title_en: Awake at the door
  title_ml: വാതിൽക്കൽ ഉണർന്നിരിക്കുക
  read_time: A three-minute read
  body: |-
    People have always wanted to know when the world will end. Jesus refuses to tell us. Not even the Son knows, he says, only the Father. Instead of a date, he gives a single instruction for everyone: watch.

    Watching in his picture is not staring at the sky. It is servants getting on with the work they have been given, while the doorkeeper stays alert. The house runs as the master would want, because any moment he might walk through the door.

    The Church year is drawing to a close, and the readings turn to the end of all things. That can sound frightening. Jesus means it to make us faithful. If the master came tonight, would he find us doing what he asked: loving, forgiving, praying, serving? That is what it means to be awake.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: If Jesus came back tonight, what would you want him to find you doing?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Do one job you have been neglecting, at home or at church, as if the master were coming tomorrow.
  prayer: Lord Jesus, your words will never pass away. Keep us awake and faithful at our work, so that whenever you come, you find us ready. Amen.
translations:
  ml:
    name:
      en: സ്ലീബാ പെരുന്നാളിനു ശേഷം ഒന്നാം ഞായർ
      ml: First Sunday after Holy Cross
    season:
      en: സ്ലീബാ
      gloss: സ്ലീബായുടെ കാലം
    tagline: അത്തിയെ നോക്കി പഠിപ്പിൻ; ഉണർന്നിരിപ്പിൻ
    standfirst: 'ആ നാളും നാഴികയും സ്വർഗ്ഗത്തിലെ ദൂതന്മാർപോലും അറിയുന്നില്ലെന്ന് യേശു തന്റെ ശിഷ്യന്മാരോടു പറയുന്നു. അതുകൊണ്ട് എല്ലാവർക്കുമായി അവൻ ഒരു വാക്കു നല്കുന്നു: ഉണർന്നിരിപ്പിൻ.'
    description: 'സ്ലീബാ പെരുന്നാളിനു ശേഷം ഒന്നാം ഞായറിലെ വായനകൾ, അത്തിയും ഉണർന്നിരിക്കാനുള്ള വിളിയും: മർക്കൊസ് 13:28–37 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: 'ഒലിവുമലയിൽവെച്ച് യേശു ശിഷ്യന്മാരോട് അത്തിയെ നോക്കി പഠിക്കാൻ പറയുന്നു: ഇല തളിർക്കുമ്പോൾ വേനൽ അടുത്തു. തന്റെ വചനങ്ങൾ ആകാശത്തെയും ഭൂമിയെയുംകാൾ നിലനില്ക്കും. ആ നാളും നാഴികയും ആരും അറിയുന്നില്ല; അതുകൊണ്ട്, യജമാനൻ എപ്പോൾ മടങ്ങിവരുമെന്ന് അറിയാത്ത ദാസന്മാരെപ്പോലെ, അവർ ഉണർന്നിരിക്കണം.'
      why_this_sunday: സെപ്റ്റംബർ 14-ലെ സ്ലീബാ പെരുന്നാളിനു ശേഷം, സഭാവർഷത്തിന്റെ അവസാന ആഴ്ചകൾ ക്രിസ്തുവിന്റെ മടങ്ങിവരവിലേക്കു നോക്കുന്നു.
      take_with_you: തീയതി ഊഹിക്കാൻ യേശു നമ്മോട് ആവശ്യപ്പെടുന്നില്ല. ഉണർന്നിരിക്കുന്നവരായി കാണപ്പെടാനാണ് അവൻ ആവശ്യപ്പെടുന്നത്.
    readings_thread: ആരെ കണ്ടുമുട്ടുമെന്ന് അറിയാതെ യോസേഫിന്റെ സഹോദരന്മാർ ധാന്യത്തിനായി മിസ്രയീമിലേക്കു പോകുന്നു. കഴുകി വെടിപ്പാക്കുവിൻ, നന്മ ചെയ്‌വാൻ പഠിപ്പിൻ എന്നു യെശയ്യാവു പറയുന്നു. സകലത്തിന്റെയും യഥാസ്ഥാപനംവരെ സ്വർഗ്ഗം യേശുവിനെ കൈക്കൊള്ളേണ്ടതാകുന്നു എന്നു പത്രൊസും, ആത്മാവു ദൈവത്തിന്റെ ആഴങ്ങളെയും ആരായുന്നു എന്നു പൌലൊസും പറയുന്നു.
    scenes:
    - verses: മർക്കൊസ് 13:28–29
      title: അത്തി
      text: അത്തിയെ നോക്കി ഒരു ഉപമ പഠിപ്പിൻ; അതിന്റെ കൊമ്പു ഇളതായി ഇല തളിർക്കുമ്പോൾ വേനൽ അടുത്തു എന്നു നിങ്ങൾ അറിയുന്നുവല്ലോ. അങ്ങനെ നിങ്ങളും ഇതു സംഭവിക്കുന്നതു കാണുമ്പോൾ അവൻ അടുക്കെ വാതിൽക്കൽ തന്നേ ആയിരിക്കുന്നു എന്നു അറിഞ്ഞുകൊൾവിൻ.
      easy_to_miss: യിസ്രായേലിലെ മിക്ക മരങ്ങളും വർഷം മുഴുവൻ പച്ചയായിരിക്കും. അത്തിയുടെ ഇല കൊഴിയുന്നു; അതുകൊണ്ട് അതിന്റെ പുതിയ ഇലകൾ ഒരു പുതിയ കാലത്തിന്റെ വ്യക്തമായ അടയാളമാണ്.
    - verses: മർക്കൊസ് 13:30–31
      title: എന്റെ വചനങ്ങൾ ഒഴിഞ്ഞുപോകയില്ല
      text: ഇതു ഒക്കെയും സംഭവിക്കുവോളം ഈ തലമുറ ഒഴിഞ്ഞുപോകയില്ല. ആകാശവും ഭൂമിയും ഒഴിഞ്ഞുപോകും; എന്റെ വചനങ്ങളോ ഒഴിഞ്ഞുപോകയില്ല.
      easy_to_miss: ദൈവവചനത്തെക്കുറിച്ചു യെശയ്യാവു പറഞ്ഞത്, അത് എന്നേക്കും നിലനില്ക്കും എന്നത് (യെശയ്യാവു 40:8), യേശു തന്റെ സ്വന്തം വചനങ്ങളെക്കുറിച്ച് അവകാശപ്പെടുന്നു.
    - verses: മർക്കൊസ് 13:32
      title: ആരും അറിയുന്നില്ല
      text: ആ നാളും നാഴികയും സംബന്ധിച്ചോ പിതാവല്ലാതെ ആരും, സ്വർഗ്ഗത്തിലെ ദൂതന്മാരും, പുത്രനും കൂടെ അറിയുന്നില്ല.
      easy_to_miss: ഇവിടെപ്പോലും യേശു നമ്മുടെ മാനുഷികപരിമിതികൾ പങ്കിടുന്നു. തീയതി അറിയാമെന്ന് അവകാശപ്പെടുന്നവൻ, അവൻ അറിയാൻ തിരഞ്ഞെടുത്തതിലും അധികം അറിയുന്നു എന്നാണ് പറയുന്നത്.
    - verses: മർക്കൊസ് 13:33–34
      title: വാതിൽകാവൽക്കാരൻ
      text: സൂക്ഷിച്ചുകൊൾവിൻ; ഉണർന്നും പ്രാർത്ഥിച്ചുംകൊണ്ടിരിപ്പിൻ. ഒരു മനുഷ്യൻ വീടുവിട്ടു പരദേശത്തുപോകുമ്പോൾ ദാസന്മാർക്കു അധികാരവും അവനവന്നു അതതു വേലയും കൊടുത്തിട്ടു വാതിൽകാവൽക്കാരനോടു ഉണർന്നിരിപ്പാൻ കല്പിച്ചതുപോലെ തന്നേ.
      easy_to_miss: ഓരോ ദാസനും അവനവന്റെ വേലയുണ്ട്. ഉണർന്നിരിക്കുക എന്നാൽ ഒന്നും ചെയ്യാതിരിക്കുക എന്നല്ല; സ്വന്തം ജോലി നന്നായി ചെയ്യുക എന്നാണ്.
    - verses: മർക്കൊസ് 13:35–37
      title: ഉണർന്നിരിപ്പിൻ
      text: 'യജമാനൻ സന്ധ്യക്കോ അർദ്ധരാത്രിക്കോ കോഴികൂകുന്ന നേരത്തോ രാവിലെയോ എപ്പോൾ വരും എന്ന് അറിയായ്കകൊണ്ട്, അവൻ പെട്ടെന്നു വന്നു നിങ്ങളെ ഉറങ്ങുന്നവരായി കണ്ടെത്താതിരിക്കേണ്ടതിന്നു ഉണർന്നിരിപ്പിൻ. ഞാൻ നിങ്ങളോടു പറയുന്നതോ എല്ലാവരോടും പറയുന്നു: ഉണർന്നിരിപ്പിൻ.'
      easy_to_miss: 'സന്ധ്യ, അർദ്ധരാത്രി, കോഴികൂകുന്ന നേരം, രാവിലെ: മർക്കൊസ് 14–15-ൽ ഇവ യേശുവിന്റെ കഷ്ടാനുഭവത്തിന്റെ നാഴികകളാകുന്നു; അപ്പോൾ ശിഷ്യന്മാർ ഉറങ്ങിപ്പോകുന്നു.'
    people:
    - name: പത്രൊസ്, യാക്കോബ്, യോഹന്നാൻ, അന്ത്രെയാസ്
      role: അവസാനത്തെക്കുറിച്ചു യേശുവിനോടു സ്വകാര്യമായി ചോദിക്കുന്ന നാലു ശിഷ്യന്മാർ (മർക്കൊസ് 13:3).
      name_meaning: —
      ml: Peter, James, John and Andrew
    phrases:
    - term: ഒലിവുമല
      explanation: ദൈവാലയത്തിന് അഭിമുഖമായി യെരൂശലേമിനു കിഴക്കുള്ള കുന്ന്; അവിടെവെച്ചാണ് യേശു ഈ ഉപദേശം നല്കിയത്.
    - term: വാതിൽകാവൽക്കാരൻ
      explanation: വീടിന്റെ വാതിൽ കാക്കുകയും യജമാനൻ മടങ്ങിവരുമ്പോൾ തുറക്കുകയും ചെയ്യുന്ന ദാസൻ.
    - term: സ്ലീബാ
      explanation: ‘ക്രൂശ്’ എന്നതിന്റെ സുറിയാനി. സെപ്റ്റംബർ 14-നു ശേഷമുള്ള ഞായറാഴ്ചകൾ സ്ലീബാ പെരുന്നാളിൽനിന്ന് എണ്ണുന്നു.
    reflection:
      title_en: വാതിൽക്കൽ ഉണർന്നിരിക്കുക
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ലോകം എപ്പോൾ അവസാനിക്കുമെന്ന് അറിയാൻ ആളുകൾ എപ്പോഴും ആഗ്രഹിച്ചിട്ടുണ്ട്. അതു പറഞ്ഞുതരാൻ യേശു വിസമ്മതിക്കുന്നു. പുത്രൻപോലും അറിയുന്നില്ല, പിതാവു മാത്രം, അവൻ പറയുന്നു. ഒരു തീയതിക്കു പകരം, എല്ലാവർക്കുമായി ഒരൊറ്റ നിർദ്ദേശം അവൻ നല്കുന്നു: ഉണർന്നിരിപ്പിൻ.

        അവന്റെ ചിത്രത്തിൽ ഉണർന്നിരിക്കുക എന്നാൽ ആകാശത്തേക്കു തുറിച്ചുനോക്കുകയല്ല. ഏല്പിക്കപ്പെട്ട വേല ദാസന്മാർ ചെയ്തുകൊണ്ടിരിക്കുന്നു; വാതിൽകാവൽക്കാരൻ ജാഗ്രതയോടെ നില്ക്കുന്നു. ഏതു നിമിഷവും യജമാനൻ വാതിൽ കടന്നുവന്നേക്കാം എന്നതിനാൽ, അവൻ ആഗ്രഹിക്കുന്നതുപോലെ വീടു നടക്കുന്നു.

        സഭാവർഷം അവസാനത്തോട് അടുക്കുന്നു; വായനകൾ സകലത്തിന്റെയും അവസാനത്തിലേക്കു തിരിയുന്നു. അതു ഭയപ്പെടുത്തുന്നതായി തോന്നാം. നമ്മെ വിശ്വസ്തരാക്കാനാണ് യേശു അത് ഉദ്ദേശിക്കുന്നത്. ഇന്നു രാത്രി യജമാനൻ വന്നാൽ, അവൻ ആവശ്യപ്പെട്ടതു ചെയ്യുന്നവരായി അവൻ നമ്മെ കണ്ടെത്തുമോ: സ്നേഹിക്കുന്നവരായി, ക്ഷമിക്കുന്നവരായി, പ്രാർത്ഥിക്കുന്നവരായി, ശുശ്രൂഷിക്കുന്നവരായി? അതാണ് ഉണർന്നിരിക്കുക എന്നതിന്റെ അർത്ഥം.
      title_ml: Awake at the door
    week:
      question: ഇന്നു രാത്രി യേശു മടങ്ങിവന്നാൽ, നിങ്ങൾ എന്തു ചെയ്യുന്നതായി അവൻ കാണണമെന്നാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: വീട്ടിലോ പള്ളിയിലോ നിങ്ങൾ അവഗണിച്ചുകൊണ്ടിരുന്ന ഒരു ജോലി, യജമാനൻ നാളെ വരുന്നു എന്നപോലെ ചെയ്യുക.
      prayer: കർത്താവായ യേശുവേ, നിന്റെ വചനങ്ങൾ ഒരിക്കലും ഒഴിഞ്ഞുപോകയില്ല. ഞങ്ങളുടെ വേലയിൽ ഞങ്ങളെ ഉണർന്നിരിക്കുന്നവരും വിശ്വസ്തരുമായി കാത്തുകൊള്ളേണമേ; നീ എപ്പോൾ വന്നാലും ഞങ്ങളെ ഒരുങ്ങിയിരിക്കുന്നവരായി കാണുമാറാകട്ടെ. ആമേൻ.
