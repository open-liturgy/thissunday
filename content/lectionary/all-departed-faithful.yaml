one_minute:
  what_happens: Jesus tells his disciples not to fear, because the Father is giving them the kingdom. They should store treasure in heaven and be ready like servants waiting with lamps lit. A master who finds them ready will serve them himself.
  why_this_sunday: The last Sunday before Great Lent is for all who have died in the faith. The Church remembers them before it begins the fast.
  take_with_you: In this parable the master comes home and serves his servants at table. That is the hope we hold for those who have died.
readings_thread: Jacob dies and is carried home to be buried. God promises to shepherd his scattered sheep himself, Hezekiah prays when he thinks he is dying, and Paul calls Christ the first fruits of those who have fallen asleep.
key_verse:
  ref: Luke 12:32
  ml: ചെറിയ ആട്ടിൻ കൂട്ടമേ, ഭയപ്പെടരുതു; നിങ്ങളുടെ പിതാവു രാജ്യം നിങ്ങൾക്കു നല്കുവാൻ പ്രസാദിച്ചിരിക്കുന്നു.
  ml_translation: Sathyavedapusthakam, 1910
  en: Don’t be afraid, little flock, for it is your Father’s good pleasure to give you the Kingdom.
  en_translation: World English Bible
scenes:
- verses: Luke 12:32–34
  title: Don’t be afraid, little flock
  text: Your Father is glad to give you the kingdom. Sell your possessions and give to the poor. Make purses that do not wear out, a treasure in heaven, because where your treasure is, your heart will be.
  easy_to_miss: 'Jesus speaks gently here: “little flock”. The command to let go of possessions comes after the promise, not before.'
- verses: Luke 12:35–38
  title: Lamps burning
  text: Be dressed for action with lamps lit, like servants waiting for their master to come home from a wedding. Blessed are those he finds awake. He will put on an apron, seat them at table and serve them.
  easy_to_miss: No master in that world served his servants. Jesus does exactly this at the Last Supper (Luke 22:27).
- verses: Luke 12:39–40
  title: An hour you do not expect
  text: If the owner knew when the thief was coming, he would not let his house be broken into. Be ready, for the Son of Man is coming at an unexpected hour.
  easy_to_miss: The same picture is used in last week’s Gospel for the departed priests.
- verses: Luke 12:41–46
  title: Is this for us?
  text: Peter asks who the parable is for. Jesus answers with a story of a faithful steward who feeds the household, and one who abuses the servants and is caught when the master returns.
  easy_to_miss: 'Jesus does not answer Peter directly. The parable answers: it is for whoever has been trusted with something.'
- verses: Luke 12:47–48
  title: Much given, much required
  text: The servant who knew what the master wanted and did not do it will be judged more severely. To whom much is given, much will be required.
  easy_to_miss: Jesus judges by what each person knew and was given, not by one standard for all.
