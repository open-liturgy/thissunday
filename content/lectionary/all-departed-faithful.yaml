  syr: '[SYRIAC]'
tagline: Where your treasure is, your heart will be
standfirst: The Church remembers everyone who has died in the faith. Jesus tells his little flock not to be afraid, and to keep their lamps burning like servants waiting for their master to come home.
description: Readings for the Sunday of All the Departed Faithful, with Luke 12:32–48 explained in five scenes, a reflection and one question for the family.
