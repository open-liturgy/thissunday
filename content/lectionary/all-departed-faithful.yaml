  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Who in our family has died whom we would like to remember tonight? Share one memory of them.
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Write the names of your family’s departed on a slip of paper and give it to the priest for the Thubden, or visit a grave and pray there.
  prayer: Lord, give rest to all who have died in faith, especially those we name before you now. Keep their memory in our hearts, keep our lamps burning, and bring us together again at your table. Amen.
