one_minute:
  what_happens: Jesus tells his disciples not to fear, because the Father is giving them the kingdom. They should store treasure in heaven and be ready like servants waiting with lamps lit. A master who finds them ready will serve them himself.
  why_this_sunday: The last Sunday before Great Lent is for all who have died in the faith. The Church remembers them before it begins the fast.
  take_with_you: In this parable the master comes home and serves his servants at table. That is the hope we hold for those who have died.
readings_thread: Jacob dies and is carried home to be buried. God promises to shepherd his scattered sheep himself, Hezekiah prays when he thinks he is dying, and Paul calls Christ the first fruits of those who have fallen asleep.
key_verse:
  ref: Luke 12:32
  ml: ചെറിയ ആട്ടിൻ കൂട്ടമേ, ഭയപ്പെടരുതു; നിങ്ങളുടെ പിതാവു രാജ്യം നിങ്ങൾക്കു നല്കുവാൻ പ്രസാദിച്ചിരിക്കുന്നു.
  ml_translation: Sathyavedapusthakam, 1910
  en: Don’t be afraid, little flock, for it is your Father’s good pleasure to give you the Kingdom.
  en_translation: World English Bible
scenes:
- verses: Luke 12:32–34
  title: Don’t be afraid, little flock
  text: Your Father is glad to give you the kingdom. Sell your possessions and give to the poor. Make purses that do not wear out, a treasure in heaven, because where your treasure is, your heart will be.
  easy_to_miss: 'Jesus speaks gently here: “little flock”. The command to let go of possessions comes after the promise, not before.'
- verses: Luke 12:35–38
  title: Lamps burning
  text: Be dressed for action with lamps lit, like servants waiting for their master to come home from a wedding. Blessed are those he finds awake. He will put on an apron, seat them at table and serve them.
  easy_to_miss: No master in that world served his servants. Jesus does exactly this at the Last Supper (Luke 22:27).
- verses: Luke 12:39–40
  title: An hour you do not expect
  text: If the owner knew when the thief was coming, he would not let his house be broken into. Be ready, for the Son of Man is coming at an unexpected hour.
  easy_to_miss: The same picture is used in last week’s Gospel for the departed priests.
- verses: Luke 12:41–46
  title: Is this for us?
  text: Peter asks who the parable is for. Jesus answers with a story of a faithful steward who feeds the household, and one who abuses the servants and is caught when the master returns.
  easy_to_miss: 'Jesus does not answer Peter directly. The parable answers: it is for whoever has been trusted with something.'
- verses: Luke 12:47–48
  title: Much given, much required
  text: The servant who knew what the master wanted and did not do it will be judged more severely. To whom much is given, much will be required.
  easy_to_miss: Jesus judges by what each person knew and was given, not by one standard for all.
people:
- name: The little flock
  ml: ചെറിയ ആട്ടിൻകൂട്ടം
  role: Jesus’ name for his disciples, few and vulnerable.
  name_meaning: —
- name: Peter
  ml: പത്രൊസ്
  role: Asks whether the parable is for the disciples or for everyone.
  name_meaning: “Rock”
- name: Jacob
  ml: യാക്കോബ്
  role: Whose death and burial are read before Qurbana today.
  name_meaning: “He grasps the heel”
phrases:
- term: Dressed for action
  explanation: 'Literally “let your waist be girded”: long robes tucked into the belt so you can move quickly.'
- term: Purses that do not wear out
  explanation: Treasure given away to the poor, which Jesus says is kept safe in heaven.
- term: Departed faithful
  explanation: All who have died in Christ. The Church prays for them in every Qurbana and keeps this Sunday for them.
reflection:
  title_en: Where our treasure is
  title_ml: നമ്മുടെ നിക്ഷേപം ഉള്ളേടത്ത്
  read_time: A three-minute read
  body: |-
    On this Sunday every family brings its own list of names. Grandparents, parents, perhaps a child or a friend who died too soon. The Church gathers them all into one prayer before Great Lent begins. It does so with a Gospel that begins: do not be afraid, little flock.

    Jesus tells a strange story. Servants wait up late for their master. When he finally comes home and finds them ready, he does not sit down to be served. He ties on an apron and serves them. That is the picture of heaven he gives us: the Lord himself at the table, caring for those who waited for him.

    Our treasure is often where our grief is. The people we loved and lost hold a part of our hearts. Jesus says to keep that treasure in heaven, where it cannot be stolen. Praying for the departed is one way we do that. It keeps our hearts pointed towards the place where they are waiting, and where we hope to see them again.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Who in our family has died whom we would like to remember tonight? Share one memory of them.
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Write the names of your family’s departed on a slip of paper and give it to the priest for the Thubden, or visit a grave and pray there.
  prayer: Lord, give rest to all who have died in faith, especially those we name before you now. Keep their memory in our hearts, keep our lamps burning, and bring us together again at your table. Amen.
translations:
  ml:
    name:
      en: വാങ്ങിപ്പോയ സകല വിശ്വാസികളുടെയും ഞായർ
      ml: Sunday of All the Departed Faithful
    season:
      en: വാങ്ങിപ്പോയവരുടെ ഓർമ്മ
      gloss: വലിയ നോമ്പിനു മുമ്പുള്ള ഞായറാഴ്ചകൾ
    tagline: നിങ്ങളുടെ നിക്ഷേപം ഉള്ളേടത്തു നിങ്ങളുടെ ഹൃദയവും
    standfirst: വിശ്വാസത്തിൽ മരിച്ച എല്ലാവരെയും സഭ ഓർക്കുന്നു. ഭയപ്പെടരുത് എന്ന് യേശു തന്റെ ചെറിയ ആട്ടിൻകൂട്ടത്തോടു പറയുന്നു; യജമാനൻ വീട്ടിൽ വരുന്നതു കാത്തിരിക്കുന്ന ദാസന്മാരെപ്പോലെ വിളക്കു കത്തിച്ചു വെക്കാനും.
    description: വാങ്ങിപ്പോയ സകല വിശ്വാസികളുടെയും ഞായറിലെ വായനകൾ, ലൂക്കൊസ് 12:32–48 അഞ്ചു രംഗങ്ങളിൽ, ഒരു ധ്യാനം, കുടുംബത്തിനായി ഒരു ചോദ്യം.
    one_minute:
      what_happens: പിതാവ് അവർക്കു രാജ്യം നല്കുന്നതുകൊണ്ട് ഭയപ്പെടരുത് എന്ന് യേശു ശിഷ്യന്മാരോടു പറയുന്നു. അവർ സ്വർഗ്ഗത്തിൽ നിക്ഷേപം ഉണ്ടാക്കുകയും വിളക്കു കത്തിച്ചു കാത്തിരിക്കുന്ന ദാസന്മാരെപ്പോലെ ഒരുങ്ങിയിരിക്കുകയും വേണം. അവരെ ഒരുങ്ങിയവരായി കാണുന്ന യജമാനൻ തന്നെ അവർക്കു ശുശ്രൂഷ ചെയ്യും.
      why_this_sunday: വലിയ നോമ്പിനു മുമ്പുള്ള അവസാനത്തെ ഞായറാഴ്ച വിശ്വാസത്തിൽ മരിച്ച എല്ലാവർക്കുമുള്ളതാണ്. നോമ്പു തുടങ്ങുംമുമ്പ് സഭ അവരെ ഓർക്കുന്നു.
      take_with_you: ഈ ഉപമയിൽ യജമാനൻ വീട്ടിൽ വന്ന് മേശയ്ക്കരികിൽ തന്റെ ദാസന്മാർക്കു ശുശ്രൂഷ ചെയ്യുന്നു. മരിച്ചുപോയവരെക്കുറിച്ചു നാം മുറുകെപ്പിടിക്കുന്ന പ്രത്യാശ അതാണ്.
    readings_thread: യാക്കോബ് മരിക്കുന്നു; അടക്കം ചെയ്യാൻ അവനെ നാട്ടിലേക്കു കൊണ്ടുപോകുന്നു. ചിതറിപ്പോയ തന്റെ ആടുകളെ താൻതന്നെ മേയിക്കും എന്നു ദൈവം വാഗ്ദാനം ചെയ്യുന്നു; താൻ മരിക്കാൻ പോകുന്നു എന്നു കരുതി ഹിസ്കീയാവ് പ്രാർത്ഥിക്കുന്നു. നിദ്രകൊണ്ടവരുടെ ആദ്യഫലം എന്നു പൗലോസ് ക്രിസ്തുവിനെ വിളിക്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 12:32–34
      title: ചെറിയ ആട്ടിൻകൂട്ടമേ, ഭയപ്പെടരുതു
      text: നിങ്ങളുടെ പിതാവു രാജ്യം നിങ്ങൾക്കു നല്കുവാൻ പ്രസാദിച്ചിരിക്കുന്നു. നിങ്ങൾക്കുള്ളതു വിറ്റു ഭിക്ഷ കൊടുപ്പിൻ. പഴകിപ്പോകാത്ത മടിശ്ശീലകളും സ്വർഗ്ഗത്തിൽ തീർന്നുപോകാത്ത നിക്ഷേപവും ഉണ്ടാക്കിക്കൊൾവിൻ; നിങ്ങളുടെ നിക്ഷേപം ഉള്ളേടത്തു നിങ്ങളുടെ ഹൃദയവും ഇരിക്കും.
      easy_to_miss: 'ഇവിടെ യേശു സൌമ്യമായി സംസാരിക്കുന്നു: “ചെറിയ ആട്ടിൻ കൂട്ടമേ”. വസ്തുവകകൾ വിട്ടുകൊടുക്കാനുള്ള കല്പന വരുന്നത് വാഗ്ദാനത്തിനു ശേഷമാണ്, മുമ്പല്ല.'
    - verses: ലൂക്കൊസ് 12:35–38
      title: വിളക്കു കത്തിക്കൊണ്ടിരിക്കട്ടെ
      text: കല്യാണം കഴിഞ്ഞു യജമാനൻ വീട്ടിൽ വരുന്നതു കാത്തിരിക്കുന്ന ദാസന്മാരെപ്പോലെ അര കെട്ടിയും വിളക്കു കത്തിച്ചും ഇരിപ്പിൻ. അവൻ ഉണർന്നിരിക്കുന്നവരായി കാണുന്നവർ ഭാഗ്യവാന്മാർ. അവൻ അര കെട്ടി അവരെ ഭക്ഷണത്തിനിരുത്തി അവർക്കു ശുശ്രൂഷ ചെയ്യും.
      easy_to_miss: ആ ലോകത്തിൽ ഒരു യജമാനനും തന്റെ ദാസന്മാർക്കു ശുശ്രൂഷ ചെയ്തിരുന്നില്ല. അന്ത്യഅത്താഴത്തിൽ യേശു കൃത്യമായി ഇതു ചെയ്യുന്നു (ലൂക്കൊസ് 22:27).
    - verses: ലൂക്കൊസ് 12:39–40
      title: നിനെക്കാത്ത നാഴികയിൽ
      text: കള്ളൻ ഏതു നാഴികയിൽ വരുന്നു എന്നു വീട്ടുടയവൻ അറിഞ്ഞിരുന്നെങ്കിൽ തന്റെ വീടു തുരക്കുവാൻ സമ്മതിക്കയില്ലായിരുന്നു. ഒരുങ്ങിയിരിപ്പിൻ; നിങ്ങൾ നിനെക്കാത്ത നാഴികയിൽ മനുഷ്യപുത്രൻ വരുന്നു.
      easy_to_miss: വാങ്ങിപ്പോയ പട്ടക്കാർക്കായുള്ള കഴിഞ്ഞ ആഴ്ചത്തെ സുവിശേഷത്തിലും ഇതേ ചിത്രം ഉപയോഗിക്കുന്നു.
    - verses: ലൂക്കൊസ് 12:41–46
      title: ഇത് ഞങ്ങളോടോ?
      text: ഈ ഉപമ ആരോടാണ് എന്ന് പത്രൊസ് ചോദിക്കുന്നു. വീട്ടുകാർക്കു ഭക്ഷണം കൊടുക്കുന്ന വിശ്വസ്തനായ ഒരു ഗൃഹവിചാരകന്റെയും, ദാസന്മാരെ ദ്രോഹിച്ച് യജമാനൻ മടങ്ങിവരുമ്പോൾ പിടിക്കപ്പെടുന്ന മറ്റൊരുവന്റെയും കഥകൊണ്ട് യേശു ഉത്തരം പറയുന്നു.
      easy_to_miss: 'യേശു പത്രൊസിനു നേരിട്ട് ഉത്തരം പറയുന്നില്ല. ഉപമ ഉത്തരം പറയുന്നു: എന്തെങ്കിലും ഏല്പിക്കപ്പെട്ട ഏവർക്കുമുള്ളതാണ് ഇത്.'
    - verses: ലൂക്കൊസ് 12:47–48
      title: വളരെ ലഭിച്ചവനോടു വളരെ ആവശ്യപ്പെടും
      text: യജമാനന്റെ ഇഷ്ടം അറിഞ്ഞിട്ടും അതു ചെയ്യാത്ത ദാസൻ കഠിനമായി വിധിക്കപ്പെടും. വളരെ ലഭിച്ചവനോടു വളരെ ആവശ്യപ്പെടും.
      easy_to_miss: എല്ലാവർക്കും ഒരേ അളവുകോലല്ല; ഓരോരുത്തരും എന്ത് അറിഞ്ഞു, എന്തു ലഭിച്ചു എന്നതനുസരിച്ചാണ് യേശു വിധിക്കുന്നത്.
    people:
    - name: ചെറിയ ആട്ടിൻകൂട്ടം
      role: എണ്ണത്തിൽ കുറഞ്ഞവരും ബലഹീനരുമായ തന്റെ ശിഷ്യന്മാർക്ക് യേശു നല്കുന്ന പേര്.
      name_meaning: —
      ml: The little flock
    - name: പത്രൊസ്
      role: ഉപമ ശിഷ്യന്മാരോടോ എല്ലാവരോടുമോ എന്നു ചോദിക്കുന്നവൻ.
      name_meaning: “പാറ”
      ml: Peter
    - name: യാക്കോബ്
      role: അവന്റെ മരണവും ശവസംസ്കാരവും ഇന്നു കുർബ്ബാനയ്ക്കു മുമ്പു വായിക്കുന്നു.
      name_meaning: “കുതികാൽ പിടിക്കുന്നവൻ”
      ml: Jacob
    phrases:
    - term: അര കെട്ടിയിരിക്കുക
      explanation: നീണ്ട വസ്ത്രം അരപ്പട്ടയിൽ തിരുകി, വേഗം നീങ്ങാൻ ഒരുങ്ങിയിരിക്കുക.
    - term: പഴകിപ്പോകാത്ത മടിശ്ശീലകൾ
      explanation: ദരിദ്രർക്കു കൊടുത്ത നിക്ഷേപം; അതു സ്വർഗ്ഗത്തിൽ സുരക്ഷിതമായി സൂക്ഷിക്കപ്പെടുന്നു എന്ന് യേശു പറയുന്നു.
    - term: വാങ്ങിപ്പോയ വിശ്വാസികൾ
      explanation: ക്രിസ്തുവിൽ മരിച്ച എല്ലാവരും. ഓരോ കുർബ്ബാനയിലും സഭ അവർക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നു; ഈ ഞായറാഴ്ച അവർക്കായി ആചരിക്കുന്നു.
    reflection:
      title_en: നമ്മുടെ നിക്ഷേപം ഉള്ളേടത്ത്
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ഈ ഞായറാഴ്ച ഓരോ കുടുംബവും സ്വന്തം പേരുകളുടെ പട്ടികയുമായി വരുന്നു. അപ്പാപ്പന്മാരും അമ്മാമ്മമാരും, മാതാപിതാക്കൾ, ഒരുപക്ഷേ നേരത്തേ മരിച്ചുപോയ ഒരു കുഞ്ഞോ സ്നേഹിതനോ. വലിയ നോമ്പു തുടങ്ങുംമുമ്പ് സഭ അവരെയെല്ലാം ഒരു പ്രാർത്ഥനയിൽ ചേർക്കുന്നു. അതു ചെയ്യുന്നത് ഇങ്ങനെ തുടങ്ങുന്ന ഒരു സുവിശേഷംകൊണ്ടാണ്: ചെറിയ ആട്ടിൻകൂട്ടമേ, ഭയപ്പെടരുതു.

        യേശു ഒരു വിചിത്രമായ കഥ പറയുന്നു. ദാസന്മാർ രാത്രി വൈകുംവരെ യജമാനനെ കാത്തിരിക്കുന്നു. ഒടുവിൽ അവൻ വീട്ടിൽ വന്ന് അവരെ ഒരുങ്ങിയവരായി കാണുമ്പോൾ, ശുശ്രൂഷ സ്വീകരിക്കാൻ അവൻ ഇരിക്കുന്നില്ല. അവൻ അര കെട്ടി അവർക്കു ശുശ്രൂഷ ചെയ്യുന്നു. അവൻ നമുക്കു തരുന്ന സ്വർഗ്ഗത്തിന്റെ ചിത്രം അതാണ്: തന്നെ കാത്തിരുന്നവരെ പരിപാലിച്ചുകൊണ്ട് കർത്താവുതന്നെ മേശയ്ക്കരികിൽ.

        നമ്മുടെ നിക്ഷേപം പലപ്പോഴും നമ്മുടെ ദുഃഖം ഉള്ളിടത്താണ്. നാം സ്നേഹിച്ച് നഷ്ടപ്പെട്ടവർ നമ്മുടെ ഹൃദയത്തിന്റെ ഒരു ഭാഗം കൈവശം വെച്ചിരിക്കുന്നു. ആ നിക്ഷേപം കള്ളൻ അടുക്കാത്ത സ്വർഗ്ഗത്തിൽ സൂക്ഷിക്കാൻ യേശു പറയുന്നു. വാങ്ങിപ്പോയവർക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നത് അതിനുള്ള ഒരു വഴിയാണ്. അവർ കാത്തിരിക്കുന്ന, നാം അവരെ വീണ്ടും കാണുമെന്നു പ്രത്യാശിക്കുന്ന സ്ഥലത്തേക്ക് അതു നമ്മുടെ ഹൃദയങ്ങളെ തിരിച്ചുനിർത്തുന്നു.
      title_ml: Where our treasure is
    week:
      question: നമ്മുടെ കുടുംബത്തിൽ മരിച്ചുപോയവരിൽ ഇന്നു രാത്രി ആരെയാണ് നാം ഓർക്കാൻ ആഗ്രഹിക്കുന്നത്? അവരെക്കുറിച്ച് ഒരു ഓർമ്മ പങ്കുവെക്കുക.
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: നിങ്ങളുടെ കുടുംബത്തിലെ വാങ്ങിപ്പോയവരുടെ പേരുകൾ ഒരു കടലാസിൽ എഴുതി തുബ്ദേനിനായി അച്ചനെ ഏല്പിക്കുക; അല്ലെങ്കിൽ ഒരു കല്ലറ സന്ദർശിച്ച് അവിടെ പ്രാർത്ഥിക്കുക.
      prayer: കർത്താവേ, വിശ്വാസത്തിൽ മരിച്ച എല്ലാവർക്കും, പ്രത്യേകിച്ച് ഇപ്പോൾ നിന്റെ മുമ്പാകെ ഞങ്ങൾ പേരുചൊല്ലുന്നവർക്കും, വിശ്രമം നല്കേണമേ. അവരുടെ ഓർമ്മ ഞങ്ങളുടെ ഹൃദയങ്ങളിൽ സൂക്ഷിക്കേണമേ; ഞങ്ങളുടെ വിളക്കുകൾ കത്തിക്കൊണ്ടിരിക്കട്ടെ; നിന്റെ മേശയ്ക്കരികിൽ ഞങ്ങളെ വീണ്ടും ഒരുമിച്ചു ചേർക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 25:31–46
        ml: മത്തായി 25:31–46
        note: ഈ ഏറ്റവും ചെറിയവരിൽ ഒരുത്തന്നു നിങ്ങൾ ചെയ്തേടത്തോളം എനിക്കു ചെയ്തു.
        printed: St. Matthew 25:31-46
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 5:19–29
        ml: യോഹന്നാൻ 5:19–29
        note: മരിച്ചവർ ദൈവപുത്രന്റെ ശബ്ദം കേൾക്കുന്ന നാഴിക വരുന്നു.
        printed: St. John 5:19-29
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 49:33–50:13
        ml: ഉല്പത്തി 49:33–50:13
        note: യാക്കോബ് മരിക്കുന്നു; യോസേഫും സഹോദരന്മാരും അവനെ അടക്കം ചെയ്യാൻ നാട്ടിലേക്കു കൊണ്ടുപോകുന്നു.
        printed: Genesis 49:33-50:13
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Ezekiel 34:1–14
        ml: യെഹെസ്കേൽ 34:1–14
        note: ഞാൻ തന്നേ എന്റെ ആടുകളെ അന്വേഷിച്ചു നോക്കിക്കൊള്ളും.
        printed: Ezekiel 34:1-14
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 38:10–20
        ml: യെശയ്യാവ് 38:10–20
        note: താൻ മരിക്കും എന്നു കരുതിയപ്പോൾ ഹിസ്കീയാവു കഴിച്ച പ്രാർത്ഥനയും, രക്ഷപ്പെട്ടപ്പോഴുള്ള സ്തോത്രവും.
        printed: Isaiah 38:10-20
      - kind: '[KIND]'
        kind_ml: '[KIND ML]'
        ref: '[CHECK SOURCE: Maccabians : 12: 38 -45]'
        ml: '[CHECK SOURCE: Maccabians : 12: 38 -45]'
        printed: 'Maccabians : 12: 38 -45'
        check: 'Printed as ''Maccabians : 12: 38 -45'' with no book number.'
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: James 3:1–12
        ml: യാക്കോബ് 3:1–12
        note: നാവു ചെറിയ അവയവം എങ്കിലും ഒരു വലിയ വനം മുഴുവൻ കത്തിക്കാൻ അതിനു കഴിയും.
        printed: James 3:1-12
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 1 Corinthians 15:20–28
        ml: 1 കൊരിന്ത്യർ 15:20–28
        note: ക്രിസ്തു നിദ്രകൊണ്ടവരിൽ ആദ്യഫലമായി മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു.
        printed: I Corinthians 15:20-28
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 12:32–48
        ml: ലൂക്കൊസ് 12:32–48
        note: ചെറിയ ആട്ടിൻകൂട്ടമേ, ഭയപ്പെടേണ്ട; നിങ്ങളുടെ വിളക്കുകൾ കത്തിക്കൊണ്ടിരിക്കട്ടെ. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Luke 12:32-48
        main: true
    key_verse:
      ref: ലൂക്കൊസ് 12:32
    hero_quote:
      text: നിങ്ങളുടെ നിക്ഷേപം ഉള്ളേടത്തു നിങ്ങളുടെ ഹൃദയവും ഇരിക്കും.
      ref: ലൂക്കൊസ് 12:34
