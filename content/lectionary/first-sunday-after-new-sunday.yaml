one_minute:
  what_happens: Seven disciples go fishing on the Sea of Galilee and catch nothing. At dawn Jesus, unrecognised, tells them to cast on the right side. The net fills with 153 fish. John recognises him, Peter jumps into the water, and Jesus gives them bread and fish for breakfast.
  why_this_sunday: The Sundays after Easter read the appearances of the risen Jesus. This is the third time he showed himself to the disciples.
  take_with_you: The risen Lord meets his friends at work, after a failed night, and feeds them before he asks anything of them.
readings_thread: Israel walks through the sea while the Egyptians drown, and the walls of Jericho fall. Paul preaches that God raised Jesus and did not let him see decay. Ephesians says to put on the whole armour of God.
key_verse:
  ref: John 21:12
  ml: 'യേശു അവരോടു: വന്നു പ്രാതൽ കഴിച്ചുകൊൾവിൻ എന്നു പറഞ്ഞു; കർത്താവാകുന്നു എന്നു അറിഞ്ഞിട്ടു ശിഷ്യന്മാരിൽ ഒരുത്തനും: നീ ആർ എന്നു അവനോടു ചോദിപ്പാൻ തുനിഞ്ഞില്ല.'
  ml_translation: Sathyavedapusthakam, 1910
  en: Jesus said to them, “Come and eat breakfast!” None of the disciples dared inquire of him, “Who are you?” knowing that it was the Lord.
  en_translation: World English Bible
scenes:
- verses: John 21:1–3
  title: I am going fishing
  text: 'Peter, Thomas, Nathanael, the sons of Zebedee and two others are by the Sea of Tiberias. Peter says: I am going fishing. They go with him and catch nothing all night.'
  easy_to_miss: After everything that has happened, Peter goes back to what he knows. Grief and confusion often send us home.
- verses: John 21:4–6
  title: Cast on the right side
  text: At dawn Jesus stands on the shore, but they do not know it is him. Children, have you any fish? No. Cast the net on the right side of the boat. They do, and cannot haul it in for the number of fish.
  easy_to_miss: He calls these grown fishermen “children”. It is a tender word.
- verses: John 21:7–8
  title: It is the Lord
  text: 'The disciple whom Jesus loved says to Peter: it is the Lord! Peter throws on his outer garment and jumps into the sea. The others follow in the boat, dragging the net.'
  easy_to_miss: John recognises him first; Peter reaches him first. Each disciple has his own gift.
- verses: John 21:9–11
  title: A charcoal fire
  text: 'On shore there is a charcoal fire with fish on it, and bread. Bring some of the fish you caught, says Jesus. Peter hauls the net ashore: 153 large fish, and the net is not torn.'
  easy_to_miss: The last charcoal fire in John was in the high priest’s courtyard, where Peter denied Jesus (John 18:18).
- verses: John 21:12–14
  title: Come and have breakfast
  text: 'Jesus says: come and have breakfast. None of them dares ask who he is; they know it is the Lord. He takes the bread and gives it to them, and the fish too. This is the third time he appears to them after rising.'
  easy_to_miss: He takes bread and gives it to them, the same actions as at the feeding of the five thousand (John 6:11).
people:
- name: Peter
  ml: പത്രൊസ്
  role: Leads the others back to fishing and jumps into the sea to reach Jesus.
  name_meaning: “Rock”
- name: The disciple whom Jesus loved
  ml: യേശു സ്നേഹിച്ച ശിഷ്യൻ
  role: Traditionally John, son of Zebedee. The first to recognise Jesus.
  name_meaning: —
- name: Nathanael
  ml: നഥനയേൽ
  role: From Cana, the doubter who came and saw (John 1:46).
  name_meaning: “God has given”
phrases:
- term: Sea of Tiberias
  explanation: Another name for the Sea of Galilee, after the city Herod Antipas built on its shore in honour of the emperor.
- term: 153 fish
  explanation: John records the exact number. Early Christian writers saw in it the fullness of all nations gathered into one unbroken net.
- term: Charcoal fire
  explanation: 'The Greek word appears only twice in the New Testament: here and at Peter’s denial.'
reflection:
  title_en: Breakfast after a long night
  title_ml: നീണ്ട രാത്രിക്കു ശേഷം ഒരു പ്രാതൽ
  read_time: A three-minute read
  body: |-
    Peter has had a terrible few weeks. He denied Jesus three times, watched him die, and then saw him risen, without yet having a chance to put things right. So he does what many of us do when life is confusing: he goes back to work. He fishes all night and catches nothing.

    At dawn, Jesus is waiting. He does not start with a lecture. He asks if they have eaten, tells them where to fish, and has a fire going with bread and fish already on it when they arrive. Before anything else is said, he feeds them.

    There will be a hard conversation next Sunday. Jesus will ask Peter three times if he loves him. But it comes after breakfast. That is worth remembering in our own homes. When someone has had a long night, the first thing they may need is a warm meal and a kind word, and the rest can follow.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: When have you worked hard and got nowhere? Did anyone help you see things differently?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Make breakfast or a meal for someone in your family who has had a hard week, before asking them anything.
  prayer: Risen Lord, you waited on the shore after a long night and fed your tired friends. Meet us when our nets are empty, show us where to cast them, and feed us at your table. Amen.
translations:
  ml:
    name:
      en: പുതുഞായറിനു ശേഷം ഒന്നാം ഞായർ
      ml: First Sunday after New Sunday
    season:
      en: ക്യംതാ
      gloss: ഉയിർപ്പുകാലം
    tagline: ഉയിർത്തെഴുന്നേറ്റ കർത്താവിനോടൊപ്പം കടല്ക്കരയിൽ പ്രാതൽ
    standfirst: പത്രൊസ് വീണ്ടും മീൻപിടുത്തത്തിനു പോകുന്നു; രാത്രി മുഴുവൻ ഒന്നും കിട്ടുന്നില്ല. പുലർച്ചെ കരയിൽ നില്ക്കുന്ന ഒരു അപരിചിതൻ എവിടെ വല വീശണമെന്ന് അവരോടു പറയുന്നു; പിന്നെ അവർക്കായി പ്രാതൽ ഒരുക്കുന്നു.
    description: പുതുഞായറിനു ശേഷം ഒന്നാം ഞായറിലെ വായനകൾ, ഗലീലക്കടല്ക്കരയിലെ പ്രാതലിനെക്കുറിച്ചുള്ള യോഹന്നാൻ 21:1–14 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: ഏഴു ശിഷ്യന്മാർ ഗലീലക്കടലിൽ മീൻ പിടിപ്പാൻ പോകുന്നു; ഒന്നും കിട്ടുന്നില്ല. പുലർച്ചെ, അവർ തിരിച്ചറിയാത്ത യേശു വലത്തുഭാഗത്തു വല വീശുവാൻ പറയുന്നു. വലയിൽ നൂറ്റമ്പത്തുമൂന്നു മീൻ നിറയുന്നു. യോഹന്നാൻ അവനെ തിരിച്ചറിയുന്നു, പത്രൊസ് കടലിൽ ചാടുന്നു, യേശു അവർക്കു പ്രാതലിന് അപ്പവും മീനും കൊടുക്കുന്നു.
      why_this_sunday: ഉയിർപ്പിനു ശേഷമുള്ള ഞായറാഴ്ചകളിൽ ഉയിർത്തെഴുന്നേറ്റ യേശുവിന്റെ പ്രത്യക്ഷതകൾ വായിക്കുന്നു. ഇതു മൂന്നാംപ്രാവശ്യമാണ് അവൻ ശിഷ്യന്മാർക്കു പ്രത്യക്ഷനാകുന്നത്.
      take_with_you: ഉയിർത്തെഴുന്നേറ്റ കർത്താവ് തന്റെ സ്നേഹിതരെ അവരുടെ ജോലിസ്ഥലത്ത്, ഒരു പരാജയപ്പെട്ട രാത്രിക്കു ശേഷം, കണ്ടുമുട്ടുന്നു; എന്തെങ്കിലും ആവശ്യപ്പെടുംമുമ്പ് അവരെ ഊട്ടുന്നു.
    readings_thread: മിസ്രയീമ്യർ മുങ്ങുമ്പോൾ യിസ്രായേൽ കടലിന്റെ നടുവിലൂടെ നടക്കുന്നു; യെരീഹോവിന്റെ മതിലുകൾ വീഴുന്നു. ദൈവം യേശുവിനെ ഉയിർപ്പിച്ചു, അവൻ ദ്രവത്വം കണ്ടില്ല എന്നു പൌലൊസ് പ്രസംഗിക്കുന്നു. ദൈവത്തിന്റെ സർവ്വായുധവർഗ്ഗം ധരിപ്പിൻ എന്ന് എഫെസ്യലേഖനം പറയുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 21:1–3
      title: ഞാൻ മീൻ പിടിപ്പാൻ പോകുന്നു
      text: 'പത്രൊസ്, തോമാ, നഥനയേൽ, സെബെദിമക്കൾ, വേറെ രണ്ടുപേർ എന്നിവർ തിബെര്യാസ് കടല്ക്കരയിൽ ഉണ്ട്. പത്രൊസ് പറയുന്നു: ഞാൻ മീൻ പിടിപ്പാൻ പോകുന്നു. അവരും കൂടെ പോകുന്നു; ആ രാത്രി ഒന്നും പിടിക്കുന്നില്ല.'
      easy_to_miss: സംഭവിച്ചതെല്ലാം കഴിഞ്ഞ്, പത്രൊസ് തനിക്കറിയാവുന്നതിലേക്കു മടങ്ങുന്നു. ദുഃഖവും ആശയക്കുഴപ്പവും പലപ്പോഴും നമ്മെ പഴയ വഴികളിലേക്കു തിരിച്ചയക്കുന്നു.
    - verses: യോഹന്നാൻ 21:4–6
      title: വലത്തുഭാഗത്തു വല വീശുവിൻ
      text: പുലർച്ചെ യേശു കരയിൽ നില്ക്കുന്നു; അത് അവനാണെന്ന് അവർ അറിയുന്നില്ല. കുഞ്ഞുങ്ങളേ, കൂട്ടുവാൻ വല്ലതും ഉണ്ടോ? ഇല്ല. പടകിന്റെ വലത്തുഭാഗത്തു വല വീശുവിൻ. അവർ വീശുന്നു; മീനിന്റെ പെരുപ്പം നിമിത്തം അതു വലിച്ചുകയറ്റാൻ കഴിയുന്നില്ല.
      easy_to_miss: മുതിർന്ന ഈ മീൻപിടുത്തക്കാരെ അവൻ “കുഞ്ഞുങ്ങളേ” എന്നു വിളിക്കുന്നു. അതൊരു ആർദ്രമായ വാക്കാണ്.
    - verses: യോഹന്നാൻ 21:7–8
      title: അതു കർത്താവു ആകുന്നു
      text: 'യേശു സ്നേഹിച്ച ശിഷ്യൻ പത്രൊസിനോടു പറയുന്നു: അതു കർത്താവു ആകുന്നു! പത്രൊസ് അങ്കി അരയിൽ ചുറ്റി കടലിൽ ചാടുന്നു. മറ്റുള്ളവർ വല ഇഴച്ചുകൊണ്ടു പടകിൽ പിന്നാലെ വരുന്നു.'
      easy_to_miss: യോഹന്നാൻ അവനെ ആദ്യം തിരിച്ചറിയുന്നു; പത്രൊസ് ആദ്യം അവന്റെ അടുക്കൽ എത്തുന്നു. ഓരോ ശിഷ്യനും അവന്റേതായ വരമുണ്ട്.
    - verses: യോഹന്നാൻ 21:9–11
      title: തീക്കനൽ
      text: 'കരയിൽ തീക്കനലും അതിന്മേൽ മീനും അപ്പവും ഉണ്ട്. ഇപ്പോൾ പിടിച്ച മീൻ ചിലതു കൊണ്ടുവരുവിൻ എന്നു യേശു പറയുന്നു. പത്രൊസ് വല കരയ്ക്കു വലിച്ചുകയറ്റുന്നു: നൂറ്റമ്പത്തുമൂന്നു വലിയ മീൻ; എന്നിട്ടും വല കീറിയില്ല.'
      easy_to_miss: യോഹന്നാനിൽ ഇതിനു മുമ്പുള്ള കനൽത്തീ മഹാപുരോഹിതന്റെ നടുമുറ്റത്തായിരുന്നു; അവിടെവെച്ചാണ് പത്രൊസ് യേശുവിനെ തള്ളിപ്പറഞ്ഞത് (യോഹന്നാൻ 18:18).
    - verses: യോഹന്നാൻ 21:12–14
      title: വന്നു പ്രാതൽ കഴിച്ചുകൊൾവിൻ
      text: 'യേശു പറയുന്നു: വന്നു പ്രാതൽ കഴിച്ചുകൊൾവിൻ. നീ ആർ എന്ന് അവനോടു ചോദിപ്പാൻ ആരും തുനിയുന്നില്ല; അതു കർത്താവാണെന്ന് അവർക്ക് അറിയാം. അവൻ അപ്പം എടുത്ത് അവർക്കു കൊടുക്കുന്നു; മീനും അങ്ങനെ തന്നേ. ഉയിർത്തെഴുന്നേറ്റശേഷം മൂന്നാംപ്രാവശ്യമാണ് അവൻ അവർക്കു പ്രത്യക്ഷനാകുന്നത്.'
      easy_to_miss: അവൻ അപ്പം എടുത്ത് അവർക്കു കൊടുക്കുന്നു; അയ്യായിരം പേരെ പോഷിപ്പിച്ചപ്പോൾ ചെയ്ത അതേ പ്രവൃത്തികൾ (യോഹന്നാൻ 6:11).
    people:
    - name: പത്രൊസ്
      role: മറ്റുള്ളവരെ വീണ്ടും മീൻപിടുത്തത്തിലേക്കു നയിക്കുന്നു; യേശുവിന്റെ അടുക്കൽ എത്താൻ കടലിൽ ചാടുന്നു.
      name_meaning: “പാറ”
      ml: Peter
    - name: യേശു സ്നേഹിച്ച ശിഷ്യൻ
      role: പാരമ്പര്യമനുസരിച്ച് സെബെദിയുടെ മകനായ യോഹന്നാൻ. യേശുവിനെ ആദ്യം തിരിച്ചറിയുന്നവൻ.
      name_meaning: —
      ml: The disciple whom Jesus loved
    - name: നഥനയേൽ
      role: കാനയിൽനിന്നുള്ളവൻ; സംശയിച്ചിട്ടും വന്നു കണ്ടവൻ (യോഹന്നാൻ 1:46).
      name_meaning: “ദൈവം തന്നു”
      ml: Nathanael
    phrases:
    - term: തിബെര്യാസ് കടൽ
      explanation: ഗലീലക്കടലിന്റെ മറ്റൊരു പേര്; ചക്രവർത്തിയുടെ ബഹുമാനാർത്ഥം ഹെരോദാ അന്തിപ്പാസ് അതിന്റെ തീരത്തു പണിത പട്ടണത്തിന്റെ പേരിൽനിന്ന്.
    - term: നൂറ്റമ്പത്തുമൂന്നു മീൻ
      explanation: യോഹന്നാൻ കൃത്യമായ എണ്ണം രേഖപ്പെടുത്തുന്നു. കീറാത്ത ഒരു വലയിലേക്കു സകലജാതികളും ചേർക്കപ്പെടുന്നതിന്റെ പൂർണ്ണത ആദിമ ക്രൈസ്തവ എഴുത്തുകാർ അതിൽ കണ്ടു.
    - term: കനൽത്തീ
      explanation: 'ഈ ഗ്രീക്ക് വാക്ക് പുതിയനിയമത്തിൽ രണ്ടു തവണ മാത്രമേ വരുന്നുള്ളൂ: ഇവിടെയും പത്രൊസ് തള്ളിപ്പറഞ്ഞിടത്തും.'
    reflection:
      title_en: നീണ്ട രാത്രിക്കു ശേഷം ഒരു പ്രാതൽ
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        പത്രൊസിന് ഏതാനും ആഴ്ചകൾ ഭയങ്കരമായിരുന്നു. അവൻ യേശുവിനെ മൂന്നു പ്രാവശ്യം തള്ളിപ്പറഞ്ഞു, അവൻ മരിക്കുന്നതു കണ്ടു, പിന്നെ അവൻ ഉയിർത്തെഴുന്നേറ്റതായി കണ്ടു; കാര്യങ്ങൾ നേരെയാക്കാൻ ഇതുവരെ അവസരം കിട്ടിയില്ല. അതുകൊണ്ട് ജീവിതം ആശയക്കുഴപ്പത്തിലാകുമ്പോൾ നമ്മിൽ പലരും ചെയ്യുന്നതുതന്നെ അവൻ ചെയ്യുന്നു: ജോലിയിലേക്കു മടങ്ങുന്നു. രാത്രി മുഴുവൻ അവൻ മീൻ പിടിക്കുന്നു; ഒന്നും കിട്ടുന്നില്ല.

        പുലർച്ചെ യേശു കാത്തുനില്ക്കുന്നു. അവൻ ഒരു പ്രസംഗത്തോടെയല്ല തുടങ്ങുന്നത്. അവർക്കു വല്ലതും ഉണ്ടോ എന്നു ചോദിക്കുന്നു, എവിടെ വല വീശണമെന്നു പറയുന്നു; അവർ എത്തുമ്പോൾ തീ കത്തിച്ച് അതിന്മേൽ അപ്പവും മീനും ഒരുക്കിവെച്ചിരിക്കുന്നു. മറ്റെന്തെങ്കിലും പറയുന്നതിനു മുമ്പ് അവൻ അവരെ ഊട്ടുന്നു.

        അടുത്ത ഞായറാഴ്ച ഒരു കഠിനമായ സംഭാഷണം ഉണ്ടാകും. നിനക്ക് എന്നോടു സ്നേഹമുണ്ടോ എന്നു യേശു പത്രൊസിനോടു മൂന്നു പ്രാവശ്യം ചോദിക്കും. പക്ഷേ അതു പ്രാതലിനു ശേഷമാണ്. നമ്മുടെ വീടുകളിൽ ഓർത്തിരിക്കേണ്ട കാര്യമാണിത്. ഒരാൾക്ക് ഒരു നീണ്ട രാത്രി കഴിഞ്ഞിരിക്കുമ്പോൾ, ആദ്യം വേണ്ടത് ഒരുപക്ഷേ ചൂടുള്ള ഭക്ഷണവും ഒരു നല്ല വാക്കുമായിരിക്കും; ബാക്കി പിന്നാലെ വരും.
      title_ml: Breakfast after a long night
    week:
      question: കഠിനമായി അദ്ധ്വാനിച്ചിട്ടും ഒന്നും നേടാതെപോയത് എപ്പോഴാണ്? കാര്യങ്ങൾ മറ്റൊരു വിധത്തിൽ കാണാൻ ആരെങ്കിലും നിങ്ങളെ സഹായിച്ചോ?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: കഠിനമായ ഒരാഴ്ചയിലൂടെ കടന്നുപോയ കുടുംബാംഗത്തിന്, അവരോട് ഒന്നും ചോദിക്കുന്നതിനു മുമ്പ്, പ്രാതലോ ഒരു നേരത്തെ ഭക്ഷണമോ ഒരുക്കിക്കൊടുക്കുക.
      prayer: ഉയിർത്തെഴുന്നേറ്റ കർത്താവേ, നീണ്ട രാത്രിക്കു ശേഷം നീ കരയിൽ കാത്തുനിന്ന് ക്ഷീണിച്ച നിന്റെ സ്നേഹിതരെ ഊട്ടി. ഞങ്ങളുടെ വലകൾ ഒഴിഞ്ഞിരിക്കുമ്പോൾ ഞങ്ങളെ എതിരേല്ക്കേണമേ; എവിടെ വീശണമെന്നു കാണിച്ചുതരേണമേ; നിന്റെ മേശയിൽ ഞങ്ങളെ ഊട്ടേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 21:15–25
        ml: യോഹന്നാൻ 21:15–25
        note: നീ എന്നെ സ്നേഹിക്കുന്നുവോ എന്നു യേശു മൂന്നു പ്രാവശ്യം പത്രൊസിനോടു ചോദിച്ച്, തന്നെ അനുഗമിക്കാൻ പറയുന്നു.
        printed: St. John 21:15-25
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 21:1–14
        ml: യോഹന്നാൻ 21:1–14
        note: ഉയിർത്തെഴുന്നേറ്റ യേശു ശിഷ്യന്മാരുടെ വല നിറയ്ക്കുന്നു; കടപ്പുറത്ത് അവർക്കു പ്രാതൽ ഒരുക്കുന്നു.
        printed: St. John 21:1-14
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Exodus 14:26–31
        ml: പുറപ്പാട് 14:26–31
        note: കടൽ ഫറവോന്റെ സൈന്യത്തിന്മേൽ മടങ്ങിവരുന്നു; യിസ്രായേൽ യഹോവയിൽ വിശ്വസിക്കുന്നു.
        printed: Exodus 14:26-31
      - kind: '[KIND]'
        kind_ml: '[KIND ML]'
        ref: '[CHECK SOURCE: Joshua6, 9 – 21]'
        ml: '[CHECK SOURCE: Joshua6, 9 – 21]'
        printed: Joshua6, 9 – 21
        check: Printed as 'Joshua6, 9 – 21'. Possibly Joshua 6:9-21.
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Wisdom 1:1–8
        ml: '[ML BOOK NAME: Wisdom] 1:1–8'
        note: നീതിയെ സ്നേഹിച്ച്, നിഷ്കപടഹൃദയത്തോടെ കർത്താവിനെ അന്വേഷിക്കുക.
        printed: 'GreatWisdom 1: 1-8'
        check: 'Printed as ''GreatWisdom 1: 1-8'' (Wisdom of Solomon).'
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 13:26–39
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 13:26–39
        note: ദൈവം യേശുവിനെ ഉയിർപ്പിച്ചു, അവൻ ദ്രവത്വം കാണാൻ ഇടവരുത്തിയില്ല എന്നു പൌലൊസ് പ്രസംഗിക്കുന്നു.
        printed: Acts 13:26-39
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Ephesians 6:10–20
        ml: എഫെസ്യർ 6:10–20
        note: ദൈവത്തിന്റെ സർവ്വായുധവർഗ്ഗം ധരിച്ചുകൊൾവിൻ.
        printed: Ephesians 6:10-20
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 21:1–14
        ml: യോഹന്നാൻ 21:1–14
        note: ഉയിർത്തെഴുന്നേറ്റ യേശു ശിഷ്യന്മാരുടെ വല നിറയ്ക്കുന്നു; കടപ്പുറത്ത് അവർക്കു പ്രാതൽ ഒരുക്കുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. John 21:1-14
        main: true
    key_verse:
      ref: യോഹന്നാൻ 21:12
    hero_quote:
      text: 'യേശു സ്നേഹിച്ച ശിഷ്യൻ പത്രൊസിനോടു: അതു കർത്താവു ആകുന്നു എന്നു പറഞ്ഞു.'
      ref: യോഹന്നാൻ 21:7
