tagline: Breakfast on the beach with the risen Lord
standfirst: Peter goes back to fishing and catches nothing all night. At dawn a stranger on the shore tells them where to cast the net, and then cooks them breakfast.
description: Readings for the First Sunday after New Sunday, with John 21:1–14, breakfast by the Sea of Galilee, explained in five scenes. Reflection and question.
