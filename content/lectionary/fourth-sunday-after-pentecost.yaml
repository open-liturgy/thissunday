sunday_slug: fourth-sunday-after-pentecost
is_sunday: true
name:
  en: Fourth Sunday after Pentecost
  ml: പെന്തിക്കോസ്തിക്കു ശേഷം നാലാം ഞായർ
title_as_printed: Fourth Sunday after Pentecost
season:
  en: Pentecost
  gloss: The season of the Holy Spirit
  syr: ܦܢܛܩܘܣܛܐ
tagline: 'Seventy sent out in pairs: the harvest is plentiful'
standfirst: Jesus sends seventy followers ahead of him, two by two, into every town he plans to visit. The harvest is huge, he says, and the workers are few.
description: Readings for the Fourth Sunday after Pentecost, with Luke 10:1–16, the sending of the seventy, explained in five scenes. Reflection and question.
hero_quote:
  text: The harvest is indeed plentiful, but the laborers are few. Pray therefore to the Lord of the harvest, that he may send out laborers into his harvest.
  ref: Luke 10:2
