one_minute:
  what_happens: Jesus appoints seventy others and sends them in pairs ahead of him. They are to pray for more workers, travel light, bring peace to each house, heal the sick and announce the kingdom. Towns that reject them reject him.
  why_this_sunday: Two Sundays ago Jesus sent the twelve. Today he sends a much larger group, which shows that mission is not only for apostles.
  take_with_you: The first thing Jesus tells the workers to do is pray for more workers.
readings_thread: Moses blesses the tribes, and the psalm asks who may live on God’s holy hill. Isaiah says God will not destroy the whole vine for the sake of a few good grapes. In Acts seven are chosen to serve tables, and Paul ends a letter by greeting fellow workers.
