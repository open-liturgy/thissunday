    printed: St. Luke 10:1-16
    main: true
one_minute:
  what_happens: Jesus appoints seventy others and sends them in pairs ahead of him. They are to pray for more workers, travel light, bring peace to each house, heal the sick and announce the kingdom. Towns that reject them reject him.
  why_this_sunday: Two Sundays ago Jesus sent the twelve. Today he sends a much larger group, which shows that mission is not only for apostles.
  take_with_you: The first thing Jesus tells the workers to do is pray for more workers.
readings_thread: Moses blesses the tribes, and the psalm asks who may live on God’s holy hill. Isaiah says God will not destroy the whole vine for the sake of a few good grapes. In Acts seven are chosen to serve tables, and Paul ends a letter by greeting fellow workers.
key_verse:
  ref: Luke 10:2
  ml: 'അവരോടു പറഞ്ഞതു: കൊയ്ത്തു വളരെ ഉണ്ടു സത്യം; വേലക്കാരോ ചുരുക്കം; ആകയാൽ കൊയ്ത്തിന്റെ യജമാനനോടു തന്റെ കൊയ്ത്തിന്നു വേലക്കാരെ അയക്കേണ്ടതിന്നു അപേക്ഷിപ്പിൻ.'
  ml_translation: Sathyavedapusthakam, 1910
  en: Then he said to them, “The harvest is indeed plentiful, but the laborers are few. Pray therefore to the Lord of the harvest, that he may send out laborers into his harvest.
  en_translation: World English Bible
scenes:
- verses: Luke 10:1
  title: Two by two
  text: The Lord appoints seventy others and sends them ahead of him in pairs to every town and place he is about to go.
  easy_to_miss: 'Some ancient manuscripts say seventy-two. Either way, the number recalls the seventy nations of Genesis 10: the whole world.'
- verses: Luke 10:2–3
  title: Few workers
  text: The harvest is plentiful but the workers are few. Pray the Lord of the harvest to send workers. Go; I am sending you like lambs among wolves.
  easy_to_miss: The ones told to pray for workers are the workers. Prayer and going belong together.
- verses: Luke 10:4–7
  title: Peace to this house
  text: 'Carry no purse, bag or sandals, and do not stop to greet people on the road. In each house say: peace to this house. Stay there and eat what is given.'
  easy_to_miss: “Do not move from house to house.” They are to stay with the family that receives them, not look for better lodging.
- verses: Luke 10:8–12
  title: The kingdom has come near
  text: In a town that welcomes you, eat what is set before you, heal the sick and say the kingdom of God has come near. Where they do not welcome you, wipe off the dust and say the same thing.
  easy_to_miss: 'The message is the same whether they are welcomed or not: the kingdom has come near.'
- verses: Luke 10:13–16
  title: Whoever listens to you
  text: Jesus warns Chorazin, Bethsaida and Capernaum, towns that saw his works and did not repent. Whoever listens to you listens to me; whoever rejects you rejects me.
  easy_to_miss: Jesus identifies completely with his messengers, however ordinary they are.
people:
- name: The seventy
  ml: എഴുപതു പേർ
  role: Followers of Jesus beyond the twelve. Church tradition lists their names.
  name_meaning: —
phrases:
- term: Lord of the harvest
  explanation: God, who owns the field and decides who works in it.
- term: Chorazin and Bethsaida
  explanation: Towns near Capernaum on the Sea of Galilee where Jesus did many miracles.
- term: Son of peace
  explanation: Luke’s phrase (10:6) for a person who welcomes God’s peace.
reflection:
  title_en: Pray, then go
  title_ml: ആദ്യം പ്രാർത്ഥിക്കുക, പിന്നെ പോകുക
  read_time: A three-minute read
  body: |-
    The twelve were not enough. Jesus appoints seventy more, ordinary followers whose names Luke does not give us, and sends them out in pairs. The work was always meant to be shared. A Church where only the priest does the mission has misunderstood the Gospel.

    Their first instruction is to pray for more workers. Then they are told to go. They bring peace into homes, eat what they are given, heal the sick and say that God’s kingdom has come near. Some towns welcome them and some do not. Either way, the message is the same.

    Every parish needs people to teach Sunday School, visit the sick, sing, cook, organise and welcome. Many of these jobs fall on a few tired shoulders. This Gospel asks two things of the rest of us: pray that God will send workers, and be open to the possibility that he is sending you.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What is one way our family could help with the work of our parish?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Offer to help with one parish task this month, and do it with a partner, as the seventy did.
  prayer: Lord of the harvest, send workers into your field. Make us willing to go where you send us, to bring peace to every house, and to tell everyone that your kingdom has come near. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം നാലാം ഞായർ
      ml: Fourth Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: 'എഴുപതുപേർ ഈരണ്ടായി അയക്കപ്പെടുന്നു: കൊയ്ത്തു വളരെ ഉണ്ട്'
    standfirst: താൻ ചെല്ലുവാനുള്ള ഓരോ പട്ടണത്തിലേക്കും യേശു എഴുപത് അനുയായികളെ ഈരണ്ടായി തനിക്കു മുമ്പായി അയക്കുന്നു. കൊയ്ത്തു വളരെ ഉണ്ട്, വേലക്കാരോ ചുരുക്കം എന്ന് അവൻ പറയുന്നു.
    description: പെന്തിക്കോസ്തിക്കു ശേഷം നാലാം ഞായറിലെ വായനകൾ, എഴുപതുപേരെ അയക്കുന്ന ലൂക്കൊസ് 10:1–16 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: യേശു വേറെ എഴുപതുപേരെ നിയമിച്ച് ഈരണ്ടായി തനിക്കു മുമ്പായി അയക്കുന്നു. കൂടുതൽ വേലക്കാർക്കായി അവർ പ്രാർത്ഥിക്കണം, ഭാരമില്ലാതെ യാത്ര ചെയ്യണം, ഓരോ വീട്ടിലും സമാധാനം കൊണ്ടുചെല്ലണം, രോഗികളെ സൌഖ്യമാക്കണം, ദൈവരാജ്യം അറിയിക്കണം. അവരെ തള്ളുന്ന പട്ടണങ്ങൾ അവനെ തള്ളുന്നു.
      why_this_sunday: രണ്ടു ഞായറാഴ്ച മുമ്പ് യേശു പന്ത്രണ്ടുപേരെ അയച്ചു. ഇന്ന് അതിലും വലിയ ഒരു കൂട്ടത്തെ അയക്കുന്നു; ദൌത്യം അപ്പൊസ്തലന്മാർക്കു മാത്രമുള്ളതല്ലെന്ന് ഇതു കാണിക്കുന്നു.
      take_with_you: വേലക്കാരോടു യേശു ആദ്യം പറയുന്നത്, കൂടുതൽ വേലക്കാർക്കായി പ്രാർത്ഥിക്കാനാണ്.
    readings_thread: മോശെ ഗോത്രങ്ങളെ അനുഗ്രഹിക്കുന്നു; ദൈവത്തിന്റെ വിശുദ്ധപർവ്വതത്തിൽ ആർ വസിക്കും എന്നു സങ്കീർത്തനം ചോദിക്കുന്നു. ഏതാനും നല്ല മുന്തിരിക്കുലകൾ നിമിത്തം ദൈവം മുന്തിരിവള്ളി മുഴുവനും നശിപ്പിക്കുകയില്ലെന്നു യെശയ്യാവു പറയുന്നു. അപ്പൊസ്തലപ്രവൃത്തികളിൽ മേശകളിൽ ശുശ്രൂഷിക്കാൻ ഏഴുപേരെ തിരഞ്ഞെടുക്കുന്നു; സഹപ്രവർത്തകരെ വന്ദനം ചെയ്തുകൊണ്ടു പൌലൊസ് ഒരു ലേഖനം അവസാനിപ്പിക്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 10:1
      title: ഈരണ്ടായി
      text: കർത്താവു വേറെ എഴുപതുപേരെ നിയമിച്ച്, താൻ ചെല്ലുവാനുള്ള ഓരോ പട്ടണത്തിലേക്കും സ്ഥലത്തിലേക്കും അവരെ തനിക്കു മുമ്പായി ഈരണ്ടായി അയക്കുന്നു.
      easy_to_miss: ചില പുരാതന കൈയെഴുത്തുപ്രതികളിൽ എഴുപത്തിരണ്ട് എന്നാണ്. ഏതായാലും, ഉല്പത്തി 10-ലെ എഴുപതു ജാതികളെ, അതായത് ലോകം മുഴുവനെയും, ഈ സംഖ്യ ഓർമ്മിപ്പിക്കുന്നു.
    - verses: ലൂക്കൊസ് 10:2–3
      title: വേലക്കാരോ ചുരുക്കം
      text: കൊയ്ത്തു വളരെ ഉണ്ടു സത്യം; വേലക്കാരോ ചുരുക്കം. ആകയാൽ കൊയ്ത്തിന്റെ യജമാനനോടു തന്റെ കൊയ്ത്തിന്നു വേലക്കാരെ അയക്കേണ്ടതിന്നു അപേക്ഷിപ്പിൻ. പോകുവിൻ; ചെന്നായ്ക്കളുടെ നടുവിൽ കുഞ്ഞാടുകളെപ്പോലെ ഞാൻ നിങ്ങളെ അയക്കുന്നു.
      easy_to_miss: വേലക്കാർക്കായി പ്രാർത്ഥിക്കാൻ പറയപ്പെടുന്നവർതന്നെയാണ് വേലക്കാർ. പ്രാർത്ഥനയും പോകലും ഒന്നിച്ചുപോകുന്നു.
    - verses: ലൂക്കൊസ് 10:4–7
      title: ഈ വീട്ടിന്നു സമാധാനം
      text: 'സഞ്ചിയും പൊക്കണവും ചെരിപ്പും എടുക്കരുത്; വഴിയിൽ നിന്ന് ആരെയും വന്ദനം ചെയ്യരുത്. ഏതു വീട്ടിൽ ചെന്നാലും: ഈ വീട്ടിന്നു സമാധാനം എന്ന് ആദ്യം പറവിൻ. അവർ തരുന്നതു തിന്നും കുടിച്ചുംകൊണ്ട് ആ വീട്ടിൽ തന്നേ പാർപ്പിൻ.'
      easy_to_miss: “വീട്ടിൽനിന്നു വീട്ടിലേക്കു മാറിപ്പോകരുതു.” തങ്ങളെ സ്വീകരിക്കുന്ന കുടുംബത്തോടുകൂടെ അവർ പാർക്കണം; കൂടുതൽ നല്ല താമസസ്ഥലം തേടരുത്.
    - verses: ലൂക്കൊസ് 10:8–12
      title: ദൈവരാജ്യം സമീപിച്ചുവന്നിരിക്കുന്നു
      text: നിങ്ങളെ കൈക്കൊള്ളുന്ന പട്ടണത്തിൽ, നിങ്ങളുടെ മുമ്പിൽ വെക്കുന്നതു ഭക്ഷിപ്പിൻ; രോഗികളെ സൗഖ്യമാക്കി, ദൈവരാജ്യം നിങ്ങൾക്കു സമീപിച്ചുവന്നിരിക്കുന്നു എന്നു പറവിൻ. നിങ്ങളെ കൈക്കൊള്ളാത്തിടത്ത്, കാലിന്നു പറ്റിയ പൊടി കുടഞ്ഞുകളഞ്ഞ് അതുതന്നെ പറവിൻ.
      easy_to_miss: 'സ്വീകരിക്കപ്പെട്ടാലും ഇല്ലെങ്കിലും സന്ദേശം ഒന്നുതന്നെ: ദൈവരാജ്യം സമീപിച്ചുവന്നിരിക്കുന്നു.'
    - verses: ലൂക്കൊസ് 10:13–16
      title: നിങ്ങളുടെ വാക്കു കേൾക്കുന്നവൻ
      text: തന്റെ വീര്യപ്രവൃത്തികൾ കണ്ടിട്ടും മാനസാന്തരപ്പെടാത്ത കോരസീൻ, ബേത്ത്സയിദ, കഫർന്നഹൂം എന്നീ പട്ടണങ്ങൾക്കു യേശു മുന്നറിയിപ്പു നല്കുന്നു. നിങ്ങളുടെ വാക്കു കേൾക്കുന്നവൻ എന്റെ വാക്കു കേൾക്കുന്നു; നിങ്ങളെ തള്ളുന്നവൻ എന്നെ തള്ളുന്നു.
      easy_to_miss: തന്റെ സന്ദേശവാഹകർ എത്ര സാധാരണക്കാരായാലും യേശു അവരോടു പൂർണ്ണമായി താദാത്മ്യപ്പെടുന്നു.
    people:
    - name: എഴുപതുപേർ
      role: പന്ത്രണ്ടുപേർക്കു പുറമെയുള്ള യേശുവിന്റെ അനുയായികൾ. സഭാപാരമ്പര്യം അവരുടെ പേരുകൾ രേഖപ്പെടുത്തുന്നു.
      name_meaning: —
      ml: The seventy
    phrases:
    - term: കൊയ്ത്തിന്റെ യജമാനൻ
      explanation: വയലിന്റെ ഉടമയും അതിൽ ആർ വേല ചെയ്യണമെന്നു തീരുമാനിക്കുന്നവനുമായ ദൈവം.
    - term: കോരസീനും ബേത്ത്സയിദയും
      explanation: യേശു അനേകം അത്ഭുതങ്ങൾ ചെയ്ത, ഗലീലക്കടല്ക്കരയിൽ കഫർന്നഹൂമിനടുത്തുള്ള പട്ടണങ്ങൾ.
    - term: സമാധാനപുത്രൻ
      explanation: ദൈവത്തിന്റെ സമാധാനം സ്വീകരിക്കുന്ന വ്യക്തിക്കു ലൂക്കൊസ് ഉപയോഗിക്കുന്ന പ്രയോഗം (10:6).
    reflection:
      title_en: ആദ്യം പ്രാർത്ഥിക്കുക, പിന്നെ പോകുക
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        പന്ത്രണ്ടുപേർ മതിയായിരുന്നില്ല. യേശു എഴുപതുപേരെക്കൂടി നിയമിക്കുന്നു; ലൂക്കൊസ് പേരുകൾ പറയാത്ത സാധാരണ അനുയായികൾ. അവൻ അവരെ ഈരണ്ടായി അയക്കുന്നു. ഈ വേല എപ്പോഴും പങ്കുവെക്കപ്പെടേണ്ടതായിരുന്നു. പുരോഹിതൻ മാത്രം ദൌത്യം ചെയ്യുന്ന ഒരു സഭ സുവിശേഷത്തെ തെറ്റിദ്ധരിച്ചിരിക്കുന്നു.

        അവർക്കുള്ള ആദ്യ നിർദ്ദേശം കൂടുതൽ വേലക്കാർക്കായി പ്രാർത്ഥിക്കുക എന്നതാണ്. പിന്നെ പോകുവാൻ പറയുന്നു. അവർ വീടുകളിലേക്കു സമാധാനം കൊണ്ടുചെല്ലുന്നു, നല്കുന്നതു ഭക്ഷിക്കുന്നു, രോഗികളെ സൌഖ്യമാക്കുന്നു, ദൈവരാജ്യം സമീപിച്ചുവന്നിരിക്കുന്നു എന്നു പറയുന്നു. ചില പട്ടണങ്ങൾ അവരെ സ്വീകരിക്കുന്നു, ചിലതു സ്വീകരിക്കുന്നില്ല. ഏതായാലും സന്ദേശം ഒന്നുതന്നെ.

        ഓരോ ഇടവകയ്ക്കും സൺഡേസ്കൂളിൽ പഠിപ്പിക്കാനും രോഗികളെ സന്ദർശിക്കാനും പാടാനും പാചകം ചെയ്യാനും ക്രമീകരിക്കാനും സ്വാഗതം ചെയ്യാനും ആളുകൾ വേണം. ഈ ജോലികളിൽ പലതും ക്ഷീണിതരായ ഏതാനും പേരുടെ ചുമലിലാണ്. ബാക്കിയുള്ളവരോട് ഈ സുവിശേഷം രണ്ടു കാര്യങ്ങൾ ചോദിക്കുന്നു: ദൈവം വേലക്കാരെ അയക്കേണ്ടതിനു പ്രാർത്ഥിക്കുക; അവൻ അയക്കുന്നതു നിങ്ങളെയായിരിക്കാം എന്നതിനോടു തുറവിയുള്ളവരായിരിക്കുക.
      title_ml: Pray, then go
    week:
      question: നമ്മുടെ ഇടവകയുടെ വേലയിൽ നമ്മുടെ കുടുംബത്തിനു സഹായിക്കാൻ കഴിയുന്ന ഒരു വഴി എന്താണ്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ മാസം ഇടവകയിലെ ഒരു ജോലിയിൽ സഹായിക്കാമെന്ന് ഏല്ക്കുക; എഴുപതുപേരെപ്പോലെ, ഒരു കൂട്ടാളിയോടൊപ്പം അതു ചെയ്യുക.
      prayer: കൊയ്ത്തിന്റെ യജമാനനേ, നിന്റെ വയലിലേക്കു വേലക്കാരെ അയക്കേണമേ. നീ അയക്കുന്നിടത്തേക്കു പോകാനും, എല്ലാ വീട്ടിലും സമാധാനം കൊണ്ടുചെല്ലാനും, നിന്റെ രാജ്യം സമീപിച്ചുവന്നിരിക്കുന്നു എന്ന് എല്ലാവരോടും പറയാനും ഞങ്ങളെ മനസ്സുള്ളവരാക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 14:14–23
        ml: മത്തായി 14:14–23
        note: യേശുവിനു പുരുഷാരത്തോട് അലിവു തോന്നുന്നു; അയ്യായിരം പേരെ പോഷിപ്പിക്കുന്നു.
        printed: St. Matthew 14:14-23
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 10:17–24
        ml: ലൂക്കൊസ് 10:17–24
        note: എഴുപതു പേർ സന്തോഷത്തോടെ മടങ്ങിവരുന്നു; നിങ്ങളുടെ പേർ സ്വർഗ്ഗത്തിൽ എഴുതിയിരിക്കുന്നതിനാൽ സന്തോഷിപ്പിൻ.
        printed: St. Luke 10:17-24
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Deuteronomy 33:23–29
        ml: ആവർത്തനം 33:23–29
        note: നിത്യനായ ദൈവം നിന്റെ സങ്കേതം; താഴെ നിത്യഭുജങ്ങൾ ഉണ്ട്.
        printed: Deuteronomy 33:23-29
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Psalm 15
        ml: സങ്കീർത്തനങ്ങൾ 15
        note: നിന്റെ വിശുദ്ധപർവ്വതത്തിൽ ആർ വസിക്കും? നിഷ്കളങ്കനായി നടന്നു സത്യം സംസാരിക്കുന്നവൻ.
        printed: Psalms 15
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 65:8–12
        ml: യെശയ്യാവ് 65:8–12
        note: മുന്തിരിക്കുലയിൽ പുതുവീഞ്ഞു കാണുന്നതുപോലെ, ഞാൻ അവരെ എല്ലാം നശിപ്പിക്കയില്ല.
        printed: Isaiah 65:8-12
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 6:1–7
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 6:1–7
        note: മേശകളിൽ വിധവമാരെ ശുശ്രൂഷിക്കാൻ ആത്മാവു നിറഞ്ഞ ഏഴു പേരെ തിരഞ്ഞെടുക്കുന്നു.
        printed: Acts 6:1-7
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 1 Corinthians 16:14–22
        ml: 1 കൊരിന്ത്യർ 16:14–22
        note: നിങ്ങൾ ചെയ്യുന്നതൊക്കെയും സ്നേഹത്തിൽ ചെയ്‌വിൻ; മാറാനാഥാ, നമ്മുടെ കർത്താവേ, വരേണമേ.
        printed: I Corinthians 16:14-22
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 10:1–16
        ml: ലൂക്കൊസ് 10:1–16
        note: 'യേശു തനിക്കു മുമ്പായി എഴുപതു പേരെ അയയ്ക്കുന്നു: കൊയ്ത്തു വളരെ, വേലക്കാരോ ചുരുക്കം. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.'
        printed: St. Luke 10:1-16
        main: true
    key_verse:
      ref: ലൂക്കൊസ് 10:2
    hero_quote:
      text: കൊയ്ത്തു വളരെ ഉണ്ടു സത്യം; വേലക്കാരോ ചുരുക്കം; ആകയാൽ കൊയ്ത്തിന്റെ യജമാനനോടു തന്റെ കൊയ്ത്തിന്നു വേലക്കാരെ അയക്കേണ്ടതിന്നു അപേക്ഷിപ്പിൻ.
      ref: ലൂക്കൊസ് 10:2
sources:
