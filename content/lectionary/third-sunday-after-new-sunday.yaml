one_minute:
  what_happens: On Easter afternoon two disciples walk to Emmaus. The risen Jesus joins them, but they do not recognise him. He explains how the Scriptures speak of the Christ. At supper he breaks the bread, they recognise him, and he vanishes. They run back to Jerusalem.
  why_this_sunday: Another appearance of the risen Lord. The morning Gospel is about Jesus the bread of life, and this one ends with the breaking of bread.
  take_with_you: They recognised him at the table. Every Qurbana is a supper at Emmaus.
readings_thread: Moses goes up the mountain a second time and God passes by, and Micah sees nations streaming to the Lord’s house. Zechariah pictures old people and children in Jerusalem’s streets again. John writes so that we may know we have eternal life.
key_verse:
  ref: Luke 24:32
  ml: അവൻ വഴിയിൽ നമ്മോടു സംസാരിച്ചു തിരുവെഴുത്തുകളെ തെളിയിക്കുമ്പോൾ നമ്മുടെ ഹൃദയം നമ്മുടെ ഉള്ളിൽ കത്തിക്കൊണ്ടിരുന്നില്ലയോ എന്നു അവർ തമ്മിൽ പറഞ്ഞു.
  ml_translation: Sathyavedapusthakam, 1910
  en: They said to one another, “Weren’t our hearts burning within us, while he spoke to us along the way, and while he opened the Scriptures to us?”
  en_translation: World English Bible
scenes:
- verses: Luke 24:13–16
  title: A stranger on the road
  text: Two disciples are walking to Emmaus, about seven miles from Jerusalem, talking about everything that has happened. Jesus comes and walks with them, but their eyes are kept from recognising him.
  easy_to_miss: Only one of the two is named, Cleopas. The other could be any of us.
- verses: Luke 24:17–24
  title: We had hoped
  text: He asks what they are discussing. They stop, sad. Cleopas tells him about Jesus, the crucifixion, and the women’s report of an empty tomb. “We had hoped he was the one to redeem Israel.”
  easy_to_miss: They have heard the Easter news already and still walk away sad. Information is not the same as meeting him.
- verses: Luke 24:25–27
  title: Beginning with Moses
  text: 'He says: how slow you are to believe. Was it not necessary for the Christ to suffer and enter his glory? Beginning with Moses and all the prophets, he explains what the Scriptures say about himself.'
  easy_to_miss: The first thing the risen Jesus does for them is teach the Old Testament. That is why the Church reads it at every Qurbana.
- verses: Luke 24:28–32
  title: Stay with us
  text: As they arrive, he acts as if he will go on. They urge him to stay. At table he takes bread, blesses it, breaks it and gives it to them. Their eyes are opened, and he vanishes. Did not our hearts burn within us?
  easy_to_miss: 'Took, blessed, broke, gave: the same four actions as the Last Supper (Luke 22:19).'
- verses: Luke 24:33–35
  title: Back to Jerusalem
  text: 'They get up at once and go back to Jerusalem, where the eleven tell them: the Lord has risen and has appeared to Simon. They tell how he was known to them in the breaking of the bread.'
  easy_to_miss: They walked seven miles out in sorrow and seven miles back in the dark. Joy gives strength.
