tagline: On the road to Emmaus, known in the breaking of bread
standfirst: Two disciples walk home from Jerusalem, sad and confused. A stranger joins them and explains the Scriptures. They only recognise him when he breaks the bread.
description: Readings for the Third Sunday after New Sunday, with Luke 24:13–35, the road to Emmaus, explained in five scenes. A reflection and a family question.
