one_minute:
  what_happens: On Easter afternoon two disciples walk to Emmaus. The risen Jesus joins them, but they do not recognise him. He explains how the Scriptures speak of the Christ. At supper he breaks the bread, they recognise him, and he vanishes. They run back to Jerusalem.
  why_this_sunday: Another appearance of the risen Lord. The morning Gospel is about Jesus the bread of life, and this one ends with the breaking of bread.
  take_with_you: They recognised him at the table. Every Qurbana is a supper at Emmaus.
readings_thread: Moses goes up the mountain a second time and God passes by, and Micah sees nations streaming to the Lord’s house. Zechariah pictures old people and children in Jerusalem’s streets again. John writes so that we may know we have eternal life.
key_verse:
  ref: Luke 24:32
  ml: അവൻ വഴിയിൽ നമ്മോടു സംസാരിച്ചു തിരുവെഴുത്തുകളെ തെളിയിക്കുമ്പോൾ നമ്മുടെ ഹൃദയം നമ്മുടെ ഉള്ളിൽ കത്തിക്കൊണ്ടിരുന്നില്ലയോ എന്നു അവർ തമ്മിൽ പറഞ്ഞു.
  ml_translation: Sathyavedapusthakam, 1910
  en: They said to one another, “Weren’t our hearts burning within us, while he spoke to us along the way, and while he opened the Scriptures to us?”
  en_translation: World English Bible
scenes:
- verses: Luke 24:13–16
  title: A stranger on the road
  text: Two disciples are walking to Emmaus, about seven miles from Jerusalem, talking about everything that has happened. Jesus comes and walks with them, but their eyes are kept from recognising him.
  easy_to_miss: Only one of the two is named, Cleopas. The other could be any of us.
- verses: Luke 24:17–24
  title: We had hoped
  text: He asks what they are discussing. They stop, sad. Cleopas tells him about Jesus, the crucifixion, and the women’s report of an empty tomb. “We had hoped he was the one to redeem Israel.”
  easy_to_miss: They have heard the Easter news already and still walk away sad. Information is not the same as meeting him.
- verses: Luke 24:25–27
  title: Beginning with Moses
  text: 'He says: how slow you are to believe. Was it not necessary for the Christ to suffer and enter his glory? Beginning with Moses and all the prophets, he explains what the Scriptures say about himself.'
  easy_to_miss: The first thing the risen Jesus does for them is teach the Old Testament. That is why the Church reads it at every Qurbana.
- verses: Luke 24:28–32
  title: Stay with us
  text: As they arrive, he acts as if he will go on. They urge him to stay. At table he takes bread, blesses it, breaks it and gives it to them. Their eyes are opened, and he vanishes. Did not our hearts burn within us?
  easy_to_miss: 'Took, blessed, broke, gave: the same four actions as the Last Supper (Luke 22:19).'
- verses: Luke 24:33–35
  title: Back to Jerusalem
  text: 'They get up at once and go back to Jerusalem, where the eleven tell them: the Lord has risen and has appeared to Simon. They tell how he was known to them in the breaking of the bread.'
  easy_to_miss: They walked seven miles out in sorrow and seven miles back in the dark. Joy gives strength.
people:
- name: Cleopas
  ml: ക്ലെയൊപ്പാവ്
  role: One of the two disciples walking to Emmaus.
  name_meaning: Probably short for Cleopatros, “glory of the father”
- name: The other disciple
  ml: മറ്റേ ശിഷ്യൻ
  role: Unnamed. Some early writers suggest Cleopas’ wife.
  name_meaning: —
phrases:
- term: Emmaus
  explanation: A village about sixty stadia, around seven miles or eleven kilometres, from Jerusalem. Its exact location is uncertain.
- term: Breaking of bread
  explanation: An early Christian name for the Eucharist (Acts 2:42).
- term: Moses and all the prophets
  explanation: The whole Old Testament. Jesus reads it as pointing to himself.
reflection:
  title_en: Known in the breaking of bread
  title_ml: അപ്പം നുറുക്കുമ്പോൾ തിരിച്ചറിഞ്ഞു
  read_time: A three-minute read
  body: |-
    The two disciples on the road to Emmaus had all the facts. They knew about the cross and the empty tomb. They had heard the women’s story about angels. They were still walking away from Jerusalem, sad, saying “we had hoped”. Facts had not turned into faith.

    What changed things was time with Jesus. He walked with them, listened to their disappointment, explained the Scriptures, and sat at their table. Their hearts burned while he talked, but they only recognised him when he broke the bread.

    This is the shape of every Qurbana. We come with our own disappointments. We hear the Scriptures read and explained. Then bread is taken, blessed, broken and given. The risen Lord is made known to us at the table, as he was at Emmaus, and we are sent back out, however late it is, to tell others.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: When have you felt your heart “burning” in church or while reading the Bible?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Invite someone to share a meal at your home this week, and say grace together before you eat.
  prayer: Stay with us, Lord, for it is evening. Walk with us when we are sad, open the Scriptures to us, and make yourself known to us in the breaking of the bread. Amen.
translations:
  ml:
    name:
      en: പുതുഞായറിനു ശേഷം മൂന്നാം ഞായർ
      ml: Third Sunday after New Sunday
    season:
      en: ക്യംതാ
      gloss: ഉയിർപ്പുകാലം
    tagline: എമ്മവുസ്സിലേക്കുള്ള വഴിയിൽ; അപ്പം നുറുക്കുകയിൽ തിരിച്ചറിഞ്ഞു
    standfirst: ദുഃഖിതരും ആശയക്കുഴപ്പത്തിലുമായ രണ്ടു ശിഷ്യന്മാർ യെരൂശലേമിൽനിന്നു വീട്ടിലേക്കു നടക്കുന്നു. ഒരു അപരിചിതൻ അവരോടു ചേർന്ന് തിരുവെഴുത്തുകൾ വ്യാഖ്യാനിക്കുന്നു. അവൻ അപ്പം നുറുക്കുമ്പോൾ മാത്രമാണ് അവർ അവനെ തിരിച്ചറിയുന്നത്.
    description: പുതുഞായറിനു ശേഷം മൂന്നാം ഞായറിലെ വായനകൾ, എമ്മവുസ്സിലേക്കുള്ള വഴിയെക്കുറിച്ചുള്ള ലൂക്കൊസ് 24:13–35 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും കുടുംബചോദ്യവും.
    one_minute:
      what_happens: ഉയിർപ്പു ദിവസം ഉച്ചകഴിഞ്ഞ് രണ്ടു ശിഷ്യന്മാർ എമ്മവുസ്സിലേക്കു നടക്കുന്നു. ഉയിർത്തെഴുന്നേറ്റ യേശു അവരോടു ചേരുന്നു; അവർ അവനെ തിരിച്ചറിയുന്നില്ല. തിരുവെഴുത്തുകൾ ക്രിസ്തുവിനെക്കുറിച്ച് എന്തു പറയുന്നു എന്ന് അവൻ വ്യാഖ്യാനിക്കുന്നു. അത്താഴത്തിന് അവൻ അപ്പം നുറുക്കുന്നു; അവർ അവനെ അറിയുന്നു, അവൻ അപ്രത്യക്ഷനാകുന്നു. അവർ യെരൂശലേമിലേക്കു മടങ്ങിയോടുന്നു.
      why_this_sunday: ഉയിർത്തെഴുന്നേറ്റ കർത്താവിന്റെ മറ്റൊരു പ്രത്യക്ഷത. പ്രഭാതത്തിലെ സുവിശേഷം ജീവന്റെ അപ്പമായ യേശുവിനെക്കുറിച്ചാണ്; ഇത് അപ്പം നുറുക്കുന്നതോടെ അവസാനിക്കുന്നു.
      take_with_you: മേശയ്ക്കൽവെച്ചാണ് അവർ അവനെ തിരിച്ചറിഞ്ഞത്. ഓരോ കുർബ്ബാനയും എമ്മവുസ്സിലെ ഒരു അത്താഴമാണ്.
    readings_thread: മോശെ രണ്ടാമതും മലമുകളിൽ കയറുന്നു; ദൈവം അവന്റെ മുമ്പിലൂടെ കടന്നുപോകുന്നു. ജാതികൾ കർത്താവിന്റെ ആലയത്തിലേക്ക് ഒഴുകിവരുന്നതു മീഖാ കാണുന്നു. വൃദ്ധരും കുട്ടികളും വീണ്ടും യെരൂശലേമിന്റെ വീഥികളിൽ ഉള്ളതായി സെഖര്യാവു ചിത്രീകരിക്കുന്നു. നമുക്കു നിത്യജീവൻ ഉണ്ടെന്നു നാം അറിയേണ്ടതിനു യോഹന്നാൻ എഴുതുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 24:13–16
      title: വഴിയിൽ ഒരു അപരിചിതൻ
      text: യെരൂശലേമിൽനിന്ന് ഏഴു നാഴിക ദൂരമുള്ള എമ്മവുസ്സിലേക്കു രണ്ടു ശിഷ്യന്മാർ നടക്കുന്നു; സംഭവിച്ചതിനെക്കുറിച്ചൊക്കെയും അവർ സംസാരിക്കുന്നു. യേശു അടുത്തുചെന്ന് അവരോടു ചേർന്നുനടക്കുന്നു; എന്നാൽ അവനെ അറിയാതവണ്ണം അവരുടെ കണ്ണു നിരോധിച്ചിരുന്നു.
      easy_to_miss: 'രണ്ടുപേരിൽ ഒരാളുടെ പേരു മാത്രമേ പറയുന്നുള്ളൂ: ക്ലെയൊപ്പാവ്. മറ്റേയാൾ നമ്മിൽ ആരുമാകാം.'
    - verses: ലൂക്കൊസ് 24:17–24
      title: ഞങ്ങളോ ആശിച്ചിരുന്നു
      text: എന്തിനെക്കുറിച്ചാണ് അവർ സംസാരിക്കുന്നത് എന്ന് അവൻ ചോദിക്കുന്നു. അവർ വാടിയ മുഖത്തോടെ നില്ക്കുന്നു. ക്ലെയൊപ്പാവ് യേശുവിനെക്കുറിച്ചും ക്രൂശീകരണത്തെക്കുറിച്ചും കല്ലറ ഒഴിഞ്ഞുകിടന്നു എന്ന സ്ത്രീകളുടെ വാർത്തയെക്കുറിച്ചും പറയുന്നു. “ഞങ്ങളോ അവൻ യിസ്രായേലിനെ വീണ്ടെടുപ്പാനുള്ളവൻ എന്നു ആശിച്ചിരുന്നു”.
      easy_to_miss: ഉയിർപ്പിന്റെ വാർത്ത അവർ കേട്ടുകഴിഞ്ഞിരുന്നു; എന്നിട്ടും ദുഃഖിതരായി നടന്നകലുന്നു. വിവരം അറിയുന്നതും അവനെ കണ്ടുമുട്ടുന്നതും ഒന്നല്ല.
    - verses: ലൂക്കൊസ് 24:25–27
      title: മോശെ തുടങ്ങി
      text: 'അവൻ പറയുന്നു: പ്രവാചകന്മാർ പറഞ്ഞിരിക്കുന്നതു എല്ലാം വിശ്വസിക്കാത്ത മന്ദബുദ്ധികളേ, ക്രിസ്തു ഇങ്ങനെ കഷ്ടം അനുഭവിച്ചിട്ടു തന്റെ മഹത്വത്തിൽ കടക്കേണ്ടതല്ലയോ? മോശെ തുടങ്ങി സകലപ്രവാചകന്മാരിൽനിന്നും തന്നെക്കുറിച്ചുള്ളത് അവൻ അവർക്കു വ്യാഖ്യാനിച്ചുകൊടുക്കുന്നു.'
      easy_to_miss: ഉയിർത്തെഴുന്നേറ്റ യേശു അവർക്കായി ആദ്യം ചെയ്യുന്നതു പഴയനിയമം പഠിപ്പിക്കുകയാണ്. അതുകൊണ്ടാണ് ഓരോ കുർബ്ബാനയിലും സഭ അതു വായിക്കുന്നത്.
    - verses: ലൂക്കൊസ് 24:28–32
      title: ഞങ്ങളോടുകൂടെ പാർക്കുക
      text: ഗ്രാമത്തോട് അടുത്തപ്പോൾ അവൻ മുമ്പോട്ടു പോകുന്ന ഭാവം കാണിക്കുന്നു. ഞങ്ങളോടുകൂടെ പാർക്കുക എന്ന് അവർ അവനെ നിർബന്ധിക്കുന്നു. ഭക്ഷണത്തിന് ഇരിക്കുമ്പോൾ അവൻ അപ്പം എടുത്ത് അനുഗ്രഹിച്ചു നുറുക്കി അവർക്കു കൊടുക്കുന്നു. അവരുടെ കണ്ണു തുറക്കുന്നു; അവൻ അപ്രത്യക്ഷനാകുന്നു. നമ്മുടെ ഹൃദയം നമ്മുടെ ഉള്ളിൽ കത്തിക്കൊണ്ടിരുന്നില്ലയോ?
      easy_to_miss: 'എടുത്തു, അനുഗ്രഹിച്ചു, നുറുക്കി, കൊടുത്തു: അന്ത്യഅത്താഴത്തിലെ അതേ നാലു പ്രവൃത്തികൾ (ലൂക്കൊസ് 22:19).'
    - verses: ലൂക്കൊസ് 24:33–35
      title: യെരൂശലേമിലേക്കു മടങ്ങി
      text: 'ആ നാഴികയിൽ തന്നേ അവർ എഴുന്നേറ്റ് യെരൂശലേമിലേക്കു മടങ്ങുന്നു. അവിടെ പതിനൊരുവർ അവരോടു പറയുന്നു: കർത്താവു വാസ്തവമായി ഉയിർത്തെഴുന്നേറ്റു ശിമോന്നു പ്രത്യക്ഷനായി. അവൻ അപ്പം നുറുക്കുകയിൽ തങ്ങൾക്ക് അറിയായ്‌വന്നത് അവർ വിവരിച്ചുപറയുന്നു.'
      easy_to_miss: ദുഃഖത്തോടെ ഏഴു നാഴിക നടന്നുപോയവർ ഇരുട്ടത്ത് ഏഴു നാഴിക തിരികെ നടക്കുന്നു. സന്തോഷം ശക്തി നല്കുന്നു.
    people:
    - name: ക്ലെയൊപ്പാവ്
      role: എമ്മവുസ്സിലേക്കു നടന്ന രണ്ടു ശിഷ്യന്മാരിൽ ഒരാൾ.
      name_meaning: ഒരുപക്ഷേ ക്ലെയൊപാത്രൊസ് എന്നതിന്റെ ചുരുക്കം, “പിതാവിന്റെ മഹത്വം”
      ml: Cleopas
    - name: മറ്റേ ശിഷ്യൻ
      role: പേരു പറയാത്തയാൾ. ക്ലെയൊപ്പാവിന്റെ ഭാര്യയായിരിക്കാമെന്നു ചില ആദിമ എഴുത്തുകാർ സൂചിപ്പിക്കുന്നു.
      name_meaning: —
      ml: The other disciple
    phrases:
    - term: എമ്മവുസ്സ്
      explanation: യെരൂശലേമിൽനിന്ന് ഏകദേശം അറുപതു സ്താദിയ, ഏകദേശം പതിനൊന്നു കിലോമീറ്റർ, ദൂരെയുള്ള ഒരു ഗ്രാമം. അതിന്റെ കൃത്യമായ സ്ഥാനം ഉറപ്പില്ല.
    - term: അപ്പം നുറുക്കൽ
      explanation: വിശുദ്ധ കുർബ്ബാനയ്ക്കുള്ള ഒരു ആദിമ ക്രൈസ്തവ പേര് (അപ്പൊസ്തലപ്രവൃത്തികൾ 2:42).
    - term: മോശെയും സകലപ്രവാചകന്മാരും
      explanation: പഴയനിയമം മുഴുവനും. അതു തന്നിലേക്കു വിരൽചൂണ്ടുന്നതായി യേശു വായിക്കുന്നു.
    reflection:
      title_en: അപ്പം നുറുക്കുമ്പോൾ തിരിച്ചറിഞ്ഞു
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        എമ്മവുസ്സിലേക്കുള്ള വഴിയിലെ രണ്ടു ശിഷ്യന്മാർക്ക് എല്ലാ വസ്തുതകളും അറിയാമായിരുന്നു. ക്രൂശിനെക്കുറിച്ചും ഒഴിഞ്ഞ കല്ലറയെക്കുറിച്ചും അവർ അറിഞ്ഞിരുന്നു. ദൂതന്മാരെക്കുറിച്ചുള്ള സ്ത്രീകളുടെ കഥ അവർ കേട്ടിരുന്നു. എന്നിട്ടും ‘ഞങ്ങൾ ആശിച്ചിരുന്നു’ എന്നു പറഞ്ഞുകൊണ്ട്, ദുഃഖിതരായി, അവർ യെരൂശലേമിൽനിന്നു നടന്നകലുകയായിരുന്നു. വസ്തുതകൾ വിശ്വാസമായി മാറിയിരുന്നില്ല.

        കാര്യങ്ങൾ മാറ്റിയതു യേശുവിനോടൊപ്പമുള്ള സമയമാണ്. അവൻ അവരോടൊപ്പം നടന്നു, അവരുടെ നിരാശ കേട്ടു, തിരുവെഴുത്തുകൾ വ്യാഖ്യാനിച്ചു, അവരുടെ മേശയ്ക്കൽ ഇരുന്നു. അവൻ സംസാരിക്കുമ്പോൾ അവരുടെ ഹൃദയം കത്തിക്കൊണ്ടിരുന്നു; എന്നാൽ അവൻ അപ്പം നുറുക്കിയപ്പോൾ മാത്രമാണ് അവർ അവനെ തിരിച്ചറിഞ്ഞത്.

        ഓരോ കുർബ്ബാനയുടെയും രൂപം ഇതാണ്. നാം നമ്മുടെ നിരാശകളുമായി വരുന്നു. തിരുവെഴുത്തുകൾ വായിക്കപ്പെടുന്നതും വ്യാഖ്യാനിക്കപ്പെടുന്നതും കേൾക്കുന്നു. പിന്നെ അപ്പം എടുക്കപ്പെടുന്നു, അനുഗ്രഹിക്കപ്പെടുന്നു, നുറുക്കപ്പെടുന്നു, നല്കപ്പെടുന്നു. എമ്മവുസ്സിലെന്നപോലെ ഉയിർത്തെഴുന്നേറ്റ കർത്താവ് മേശയ്ക്കൽ നമുക്കു വെളിപ്പെടുന്നു; എത്ര വൈകിയാലും, മറ്റുള്ളവരോടു പറയുവാൻ നാം വീണ്ടും പുറത്തേക്ക് അയക്കപ്പെടുന്നു.
      title_ml: Known in the breaking of bread
    week:
      question: പള്ളിയിൽവെച്ചോ ബൈബിൾ വായിക്കുമ്പോഴോ നിങ്ങളുടെ ഹൃദയം ‘കത്തിക്കൊണ്ടിരുന്നത്’ എപ്പോഴാണ്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച ഒരാളെ നിങ്ങളുടെ വീട്ടിൽ ഭക്ഷണത്തിനു ക്ഷണിക്കുക; ഭക്ഷിക്കുന്നതിനു മുമ്പ് ഒരുമിച്ചു പ്രാർത്ഥിക്കുക.
      prayer: കർത്താവേ, നേരം വൈകിയിരിക്കുന്നതിനാൽ ഞങ്ങളോടുകൂടെ പാർക്കേണമേ. ഞങ്ങൾ ദുഃഖിതരായിരിക്കുമ്പോൾ ഞങ്ങളോടൊപ്പം നടക്കേണമേ; തിരുവെഴുത്തുകൾ ഞങ്ങൾക്കു തുറന്നുതരേണമേ; അപ്പം നുറുക്കുകയിൽ ഞങ്ങൾക്കു നിന്നെത്തന്നെ വെളിപ്പെടുത്തേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 5:27–39
        ml: ലൂക്കൊസ് 5:27–39
        note: യേശു ചുങ്കക്കാരനായ ലേവിയെ വിളിച്ച് പാപികളോടുകൂടെ ഭക്ഷിക്കുന്നു.
        printed: St. Luke 5:27-39
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 6:47–58
        ml: യോഹന്നാൻ 6:47–58
        note: ഞാൻ ജീവനുള്ള അപ്പം ആകുന്നു; ഈ അപ്പം തിന്നുന്നവൻ എന്നേക്കും ജീവിക്കും.
        printed: St. John 6:47-58
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Exodus 34:4–12
        ml: പുറപ്പാട് 34:4–12
        note: 'യഹോവ മോശെയുടെ മുമ്പിലൂടെ കടന്നുപോകുന്നു: കരുണയും കൃപയുമുള്ളവൻ, ദീർഘക്ഷമയുള്ളവൻ.'
        printed: Exodus 34:4-12
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Micah 4:1–7
        ml: മീഖാ 4:1–7
        note: അനേകം ജാതികൾ യഹോവയുടെ പർവ്വതത്തിലേക്കു വരും.
        printed: Micah 4:1-7
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Zechariah 8:4–9
        ml: സെഖര്യാവ് 8:4–9
        note: വൃദ്ധന്മാരും വൃദ്ധമാരും യെരൂശലേമിന്റെ വീഥികളിൽ ഇരിക്കും; ബാലന്മാരും ബാലമാരും അവിടെ കളിക്കും.
        printed: Zechariah 8:4-9
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 37:8–17
        ml: യെശയ്യാവ് 37:8–17
        note: ശത്രുവിന്റെ എഴുത്ത് ഹിസ്കീയാവു യഹോവയുടെ സന്നിധിയിൽ വിരിച്ചു പ്രാർത്ഥിക്കുന്നു.
        printed: Isaiah 37:8-17
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: 1 John 5:13–21
        ml: 1 യോഹന്നാൻ 5:13–21
        note: നിങ്ങൾക്കു നിത്യജീവൻ ഉണ്ട് എന്നു നിങ്ങൾ അറിയേണ്ടതിനു ഞാൻ എഴുതുന്നു.
        printed: I John 5:13-21
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Hebrews 11:3–6
        ml: എബ്രായർ 11:3–6
        note: വിശ്വാസം കൂടാതെ ദൈവത്തെ പ്രസാദിപ്പിപ്പാൻ കഴിയുന്നതല്ല.
        printed: Hebrews 11:3-6
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 24:13–35
        ml: ലൂക്കൊസ് 24:13–35
        note: എമ്മവുസിലേക്കുള്ള വഴിയിൽ, അപ്പം നുറുക്കുന്നതിൽ ഉയിർത്തെഴുന്നേറ്റ കർത്താവിനെ തിരിച്ചറിയുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Luke 24:13-35
        main: true
    key_verse:
      ref: ലൂക്കൊസ് 24:32
