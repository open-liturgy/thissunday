  name_meaning: —
phrases:
- term: Sign
  explanation: John calls Jesus’ miracles signs. Each one points to who he is. This is the first of seven in the Gospel.
- term: My hour
  explanation: In John, Jesus’ “hour” is his death and glorification. It finally comes in John 12:23.
- term: Great Lent
  explanation: In the Malankara Church, the fifty-day fast from the Monday after Kothne Sunday to Easter.
reflection:
  title_en: Lent begins at a wedding
  title_ml: ഒരു കല്യാണവീട്ടിൽ തുടങ്ങുന്ന നോമ്പ്
  read_time: A three-minute read
  body: |-
    It might seem odd that the Church begins Great Lent with a wedding. Tomorrow we start fifty days of fasting, and today we read about Jesus making more than five hundred litres of wine for a party. The choice is deliberate. The fast is not the point. It is a road, and at the end of it is a feast.

    At Cana, the people who know what Jesus did are the servants. They did the plain work of carrying water and filling heavy jars, without understanding why. Mary’s instruction was simple: do whatever he tells you. They did, and they saw the sign before anyone else.

    Lent can be like that. We give up food, pray more, give alms, without always feeling anything change. Mary’s words are a good rule for the next fifty days. Do what he tells you, even when it feels like carrying water. The best wine is kept for later.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What will each of us take on or give up for Great Lent, and why?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Agree as a family on one Lenten practice you will keep together, such as an evening prayer at a fixed time.
  prayer: Lord Jesus, at Cana you turned water into wine. As we begin this fast, teach us to do whatever you tell us, and keep the best for the end. Amen.
translations:
  ml:
    name:
      en: കോത്തിനെ ഞായർ
      ml: Kothne Sunday
    season:
      en: വലിയ നോമ്പ്
      gloss: ഉയിർപ്പിനു മുമ്പുള്ള അമ്പതു നോമ്പുദിവസങ്ങൾ
    tagline: വലിയ നോമ്പ് ഒരു കല്യാണവീട്ടിൽ തുടങ്ങുന്നു
    standfirst: നോമ്പു തുടങ്ങാറായി; വീഞ്ഞു തീർന്നുപോയ ഒരു കല്യാണത്തെക്കുറിച്ചു സഭ വായിക്കുന്നു. യേശുവിന്റെ ആദ്യത്തെ അടയാളം ആറു കല്ഭരണികളിലെ വെള്ളത്തെ വിരുന്നിലെ ഏറ്റവും നല്ല വീഞ്ഞാക്കുന്നു.
    description: 'വലിയ നോമ്പിന്റെ തുടക്കമായ കോത്തിനെ ഞായറിലെ വായനകൾ, കാനാവിലെ കല്യാണം: യോഹന്നാൻ 2:1–11 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: കാനാവിലെ ഒരു കല്യാണത്തിൽ വീഞ്ഞു തീർന്നുപോകുന്നു. മറിയ യേശുവിനോടു പറയുന്നു; പിന്നെ അവൻ പറയുന്നതു ചെയ്യാൻ ശുശ്രൂഷക്കാരോടു പറയുന്നു. അവൻ ആറു കല്ഭരണികളിൽ വെള്ളം നിറയ്ക്കാൻ പറയുന്നു; അതു വിശിഷ്ടമായ വീഞ്ഞാകുന്നു. ഇതാണ് അവന്റെ ആദ്യത്തെ അടയാളം.
      why_this_sunday: വലിയ നോമ്പ് നാളെ തുടങ്ങുന്നു. നോമ്പിലെ ഓരോ ഞായറാഴ്ചയും യേശുവിന്റെ ഓരോ അത്ഭുതം വായിക്കുന്നു; ആദ്യത്തേത് അവൻ ചെയ്ത ആദ്യത്തെ അടയാളമാണ്.
      take_with_you: നോമ്പു തുടങ്ങുന്നത് ഒരു ശവസംസ്കാരത്തോടെയല്ല, ഒരു വിരുന്നോടെയാണ്. നോമ്പ് സന്തോഷത്തിലേക്കുള്ള ഒരു വഴിയാണ്.
    readings_thread: ദൈവം പത്തു കല്പനകൾ നല്കുന്നു; വസ്ത്രമല്ല ഹൃദയം കീറുവാൻ യോവേൽ ജനത്തെ വിളിക്കുന്നു; ദൈവം ആഗ്രഹിക്കുന്ന ഉപവാസം യെശയ്യാവ് വിവരിക്കുന്നു. മനസ്സലിവും ദയയും ദീർഘക്ഷമയും ധരിപ്പാൻ കൊലൊസ്സ്യലേഖനം പറയുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 2:1–2
      title: കാനാവിൽ ഒരു കല്യാണം
      text: മൂന്നാം നാൾ ഗലീലയിലെ കാനാവിൽ ഒരു കല്യാണം നടക്കുന്നു. യേശുവിന്റെ അമ്മ അവിടെ ഉണ്ട്; യേശുവിനെയും ശിഷ്യന്മാരെയും ക്ഷണിച്ചിരിക്കുന്നു.
      easy_to_miss: '“മൂന്നാം നാൾ”: യോഹന്നാനിലെ ആദ്യത്തെ അടയാളവും പുനരുത്ഥാനവും ഒരേ സമയസൂചന പങ്കിടുന്നു.'
    - verses: യോഹന്നാൻ 2:3–4
      title: അവർക്കു വീഞ്ഞു ഇല്ല
      text: 'വീഞ്ഞു തീർന്നുപോകുന്നു. മറിയ യേശുവിനോടു പറയുന്നു. അവൻ ഉത്തരം പറയുന്നു: സ്ത്രീയേ, എനിക്കും നിനക്കും തമ്മിൽ എന്തു? എന്റെ നാഴിക ഇതുവരെ വന്നിട്ടില്ല.'
      easy_to_miss: വീഞ്ഞു തീർന്നുപോകുന്നത് വർഷങ്ങളോളം കുടുംബത്തിന് അപമാനമാകുമായിരുന്നു. മറ്റാരും പറയാത്ത ഒരു പ്രശ്നം മറിയ ശ്രദ്ധിക്കുന്നു.
    - verses: യോഹന്നാൻ 2:5
      title: അവൻ പറയുന്നതു ചെയ്‌വിൻ
      text: 'അവന്റെ അമ്മ ശുശ്രൂഷക്കാരോടു പറയുന്നു: അവൻ നിങ്ങളോടു എന്തെങ്കിലും കല്പിച്ചാൽ അതു ചെയ്‌വിൻ.'
      easy_to_miss: യോഹന്നാന്റെ സുവിശേഷത്തിൽ രേഖപ്പെടുത്തിയിരിക്കുന്ന മറിയയുടെ അവസാനവാക്കുകളാണിവ. ഓരോ ക്രിസ്ത്യാനിക്കുമുള്ള നല്ല ഉപദേശം.
    - verses: യോഹന്നാൻ 2:6–8
      title: ആറു കല്ഭരണികൾ
      text: യെഹൂദന്മാരുടെ ശുദ്ധീകരണത്തിനുള്ള ആറു കല്ഭരണികൾ അവിടെ ഉണ്ട്; ഓരോന്നിലും രണ്ടോ മൂന്നോ പറ കൊള്ളും. അവ വക്കോളം വെള്ളം നിറയ്ക്കാനും, പിന്നെ കോരി വിരുന്നുവാഴിക്കു കൊണ്ടുപോകാനും യേശു പറയുന്നു.
      easy_to_miss: അത് ഏകദേശം 500 മുതൽ 700 ലിറ്റർ വരും. എല്ലാ ജോലിയും ചെയ്തത് ശുശ്രൂഷക്കാരാണ്; എന്തു സംഭവിച്ചു എന്ന് അറിയാവുന്നതും അവർക്കു മാത്രം.
    - verses: യോഹന്നാൻ 2:9–11
      title: നല്ല വീഞ്ഞു ഇതുവരെയും സൂക്ഷിച്ചുവെച്ചു
      text: 'വിരുന്നുവാഴി രുചിച്ചുനോക്കി മണവാളനോടു പറയുന്നു: എല്ലാവരും ആദ്യം നല്ല വീഞ്ഞു കൊടുക്കുന്നു; നീ നല്ല വീഞ്ഞു ഇതുവരെയും സൂക്ഷിച്ചുവെച്ചുവല്ലോ. ഇതു യേശുവിന്റെ അടയാളങ്ങളുടെ ആരംഭമാണ്; അവൻ തന്റെ മഹത്വം വെളിപ്പെടുത്തി; അവന്റെ ശിഷ്യന്മാർ അവനിൽ വിശ്വസിച്ചു.'
      easy_to_miss: ശുദ്ധീകരണത്തിനുള്ള ഭരണികൾ വിരുന്നിന്റെ വീഞ്ഞുകൊണ്ടു നിറയുന്നു. പഴയതൊന്നും എറിഞ്ഞുകളയുന്നില്ല; പുതിയതുകൊണ്ടു നിറയ്ക്കുന്നു.
