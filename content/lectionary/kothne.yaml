week:
  question: What will each of us take on or give up for Great Lent, and why?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Agree as a family on one Lenten practice you will keep together, such as an evening prayer at a fixed time.
  prayer: Lord Jesus, at Cana you turned water into wine. As we begin this fast, teach us to do whatever you tell us, and keep the best for the end. Amen.
