tagline: Great Lent begins at a wedding
standfirst: The fast is about to begin, and the Church reads about a wedding where the wine ran out. Jesus’ first sign turns six jars of water into the best wine of the feast.
description: Readings for Kothne Sunday, the start of Great Lent, with John 2:1–11, the wedding at Cana, explained in five scenes. Reflection and question.
