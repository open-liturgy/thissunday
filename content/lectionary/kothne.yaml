one_minute:
  what_happens: At a wedding in Cana, the wine runs out. Mary tells Jesus, then tells the servants to do whatever he says. He has them fill six stone jars with water, which becomes excellent wine. It is his first sign.
  why_this_sunday: Great Lent begins tomorrow. Every Sunday of the fast reads one of Jesus’ miracles, and the first is the first sign he ever did.
  take_with_you: Lent begins with a feast, not a funeral. The fast is a road towards joy.
readings_thread: God gives the ten commandments, Joel calls the people to tear their hearts and not their clothes, and Isaiah describes the fast God wants. Colossians says to put on compassion, kindness and patience.
key_verse:
  ref: John 2:5
  ml: 'അവന്റെ അമ്മ ശുശ്രൂഷക്കാരോടു: അവൻ നിങ്ങളോടു എന്തെങ്കിലും കല്പിച്ചാൽ അതു ചെയ്‌വിൻ എന്നു പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: His mother said to the servants, “Whatever he says to you, do it.”
  en_translation: World English Bible
scenes:
- verses: John 2:1–2
  title: A wedding in Cana
  text: On the third day there is a wedding in Cana in Galilee. Jesus’ mother is there, and Jesus and his disciples are invited.
  easy_to_miss: '“On the third day”: John’s first sign and the resurrection share the same marker of time.'
- verses: John 2:3–4
  title: They have no wine
  text: 'The wine runs out. Mary tells Jesus. He answers: woman, what is that to me? My hour has not yet come.'
  easy_to_miss: Running out of wine would have shamed the family for years. Mary notices a problem nobody else has spoken of.
- verses: John 2:5
  title: Do whatever he tells you
  text: 'His mother says to the servants: whatever he says to you, do it.'
  easy_to_miss: These are Mary’s last recorded words in John’s Gospel. They are good advice for every Christian.
- verses: John 2:6–8
  title: Six stone jars
  text: Six stone water jars stand there for Jewish washing rituals, each holding twenty or thirty gallons. Jesus has them filled to the brim with water, then drawn out and taken to the steward of the feast.
  easy_to_miss: That is around 500 to 700 litres. The servants did all the work, and they are the only ones who know what happened.
- verses: John 2:9–11
  title: The best wine kept till now
  text: 'The steward tastes it and tells the bridegroom: everyone serves the good wine first, but you have kept the best until now. This is the first of Jesus’ signs; he reveals his glory and his disciples believe.'
  easy_to_miss: The jars for ritual washing are filled with the wine of a feast. Something old is not thrown away but filled with something new.
