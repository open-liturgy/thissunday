    hero_quote:
      text: യേശു ഇതിനെ അടയാളങ്ങളുടെ ആരംഭമായി ഗലീലയിലെ കാനാവിൽവെച്ചു ചെയ്തു തന്റെ മഹത്വം വെളിപ്പെടുത്തി; അവന്റെ ശിഷ്യന്മാർ അവനിൽ വിശ്വസിച്ചു.
