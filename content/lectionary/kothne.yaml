    phrases:
    - term: അടയാളം
      explanation: യോഹന്നാൻ യേശുവിന്റെ അത്ഭുതങ്ങളെ അടയാളങ്ങൾ എന്നു വിളിക്കുന്നു. ഓരോന്നും അവൻ ആരെന്നു ചൂണ്ടിക്കാണിക്കുന്നു. സുവിശേഷത്തിലെ ഏഴെണ്ണത്തിൽ ആദ്യത്തേതാണിത്.
    - term: എന്റെ നാഴിക
      explanation: യോഹന്നാനിൽ യേശുവിന്റെ “നാഴിക” അവന്റെ മരണവും മഹത്വീകരണവുമാണ്. ഒടുവിൽ യോഹന്നാൻ 12:23-ൽ അതു വരുന്നു.
    - term: വലിയ നോമ്പ്
      explanation: മലങ്കരസഭയിൽ, കോത്തിനെ ഞായറിനു ശേഷമുള്ള തിങ്കളാഴ്ചമുതൽ ഉയിർപ്പുവരെയുള്ള അമ്പതുദിവസത്തെ നോമ്പ്.
    reflection:
      title_en: ഒരു കല്യാണവീട്ടിൽ തുടങ്ങുന്ന നോമ്പ്
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        സഭ വലിയ നോമ്പ് ഒരു കല്യാണത്തോടെ തുടങ്ങുന്നത് വിചിത്രമായി തോന്നിയേക്കാം. നാളെ നാം അമ്പതു ദിവസത്തെ ഉപവാസം തുടങ്ങുന്നു; ഇന്ന് ഒരു വിരുന്നിനായി അഞ്ഞൂറിലധികം ലിറ്റർ വീഞ്ഞ് യേശു ഉണ്ടാക്കുന്നതിനെക്കുറിച്ചു വായിക്കുന്നു. ഈ തിരഞ്ഞെടുപ്പ് മനഃപൂർവ്വമാണ്. ഉപവാസമല്ല ലക്ഷ്യം. അതൊരു വഴിയാണ്; അതിന്റെ അറ്റത്ത് ഒരു വിരുന്നുണ്ട്.

        കാനാവിൽ യേശു ചെയ്തത് അറിയാവുന്നത് ശുശ്രൂഷക്കാർക്കാണ്. എന്തിനെന്നു മനസ്സിലാകാതെ, വെള്ളം ചുമക്കുകയും ഭാരമുള്ള ഭരണികൾ നിറയ്ക്കുകയും ചെയ്യുന്ന സാധാരണ ജോലി അവർ ചെയ്തു. മറിയയുടെ നിർദ്ദേശം ലളിതമായിരുന്നു: അവൻ കല്പിക്കുന്നതു ചെയ്‌വിൻ. അവർ ചെയ്തു; മറ്റാർക്കും മുമ്പേ അവർ അടയാളം കണ്ടു.

        നോമ്പും അങ്ങനെയാകാം. നാം ഭക്ഷണം ഉപേക്ഷിക്കുന്നു, കൂടുതൽ പ്രാർത്ഥിക്കുന്നു, ദാനം ചെയ്യുന്നു; എന്തെങ്കിലും മാറുന്നതായി എപ്പോഴും തോന്നാതെ. അടുത്ത അമ്പതു ദിവസത്തേക്ക് മറിയയുടെ വാക്കുകൾ നല്ലൊരു നിയമമാണ്. വെള്ളം ചുമക്കുന്നതുപോലെ തോന്നുമ്പോഴും അവൻ പറയുന്നതു ചെയ്യുക. നല്ല വീഞ്ഞ് പിന്നത്തേക്കു സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നു.
      title_ml: Lent begins at a wedding
    week:
      question: വലിയ നോമ്പിൽ നമ്മൾ ഓരോരുത്തരും എന്ത് ഏറ്റെടുക്കും അല്ലെങ്കിൽ ഉപേക്ഷിക്കും? എന്തുകൊണ്ട്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഒരുമിച്ചു പാലിക്കാവുന്ന ഒരു നോമ്പുശീലം കുടുംബമായി തീരുമാനിക്കുക; ഉദാഹരണത്തിന്, നിശ്ചിതസമയത്ത് ഒരു സന്ധ്യാപ്രാർത്ഥന.
      prayer: കർത്താവായ യേശുവേ, കാനാവിൽ നീ വെള്ളം വീഞ്ഞാക്കി. ഈ നോമ്പു തുടങ്ങുമ്പോൾ, നീ കല്പിക്കുന്നതെല്ലാം ചെയ്യാൻ ഞങ്ങളെ പഠിപ്പിക്കേണമേ; ഏറ്റവും നല്ലത് അവസാനത്തേക്കു സൂക്ഷിക്കേണമേ. ആമേൻ.
