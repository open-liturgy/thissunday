    hero_quote:
      text: പിതാവു എനിക്കു തരുന്നതു ഒക്കെയും എന്റെ അടുക്കൽ വരും; എന്റെ അടുക്കൽ വരുന്നവനെ ഞാൻ ഒരുനാളും തള്ളിക്കളകയില്ല.
      ref: യോഹന്നാൻ 6:37
