one_minute:
  what_happens: 'Jesus says he is the bread of life and will not turn away anyone who comes to him. He came to do the Father’s will: that he lose none of those given to him and raise them on the last day. The crowd grumbles that they know his parents.'
  why_this_sunday: This continues the bread of life teaching from two Sundays ago. The Church reads John 6 in stages through this season.
  take_with_you: Jesus promises he will never throw out anyone who comes to him. There is no one he is looking for a reason to reject.
readings_thread: Joseph tests his brothers in Egypt, and Jeremiah calls an unfaithful people to return. In Daniel, God rescues his servants from the furnace. Paul preaches forgiveness through Jesus, and Galatians says what counts is a new creation.
key_verse:
  ref: John 6:37
  ml: പിതാവു എനിക്കു തരുന്നതു ഒക്കെയും എന്റെ അടുക്കൽ വരും; എന്റെ അടുക്കൽ വരുന്നവനെ ഞാൻ ഒരുനാളും തള്ളിക്കളകയില്ല.
  ml_translation: Sathyavedapusthakam, 1910
  en: All those whom the Father gives me will come to me. He who comes to me I will in no way throw out.
  en_translation: World English Bible
scenes:
- verses: John 6:35–36
  title: Seen, and not believed
  text: I am the bread of life, Jesus says. Whoever comes to me will never hunger. But you have seen me and still do not believe.
  easy_to_miss: Seeing and believing are not the same. Thomas will learn the reverse at Easter (John 20:29).
- verses: John 6:37–38
  title: I will not drive anyone away
  text: Everyone the Father gives me will come to me, and whoever comes to me I will never drive away. I came down not to do my own will but the will of the one who sent me.
  easy_to_miss: 'The promise is absolute. John uses a strong double negative in Greek: “I will certainly not throw out”.'
- verses: John 6:39–40
  title: Raised on the last day
  text: 'This is the Father’s will: that I lose none of those he has given me, but raise them up on the last day. Everyone who sees the Son and believes has eternal life.'
  easy_to_miss: Jesus repeats “I will raise him up on the last day” four times in this chapter.
- verses: John 6:41–42
  title: Isn’t this Joseph’s son?
  text: The people grumble because he said he came down from heaven. Isn’t this Jesus, son of Joseph? We know his father and mother.
  easy_to_miss: “Grumble” is the same word used of Israel complaining about manna in the wilderness (Exodus 16).
- verses: John 6:43–46
  title: Drawn by the Father
  text: 'Stop grumbling, says Jesus. No one can come to me unless the Father who sent me draws them. The prophets wrote: they will all be taught by God.'
  easy_to_miss: Faith is not only our search for God. It begins with God drawing us.
people:
- name: The crowd in Capernaum
  ml: കഫർന്നഹൂമിലെ പുരുഷാരം
  role: Listeners in the synagogue who know Jesus’ family and cannot believe he came from heaven.
  name_meaning: —
- name: Joseph
  ml: യോസേഫ്
  role: Named by the crowd as Jesus’ father.
  name_meaning: “He will add”
phrases:
- term: The last day
  explanation: The day of resurrection and judgment at the end of time.
- term: Draw
  explanation: The same Greek word is used for hauling a net (John 21:6). God pulls people towards Christ.
- term: Taught by God
  explanation: A quotation of Isaiah 54:13, where God promises to teach all his children himself.
reflection:
  title_en: Never driven away
  title_ml: ഒരുനാളും തള്ളിക്കളയുകയില്ല
  read_time: A three-minute read
  body: |-
    Many people carry a fear that they are not good enough for God. They think they have done something too bad, or come too late, or doubted too much. Jesus answers that fear in one line: whoever comes to me I will never drive away.

    The crowd in Capernaum grumbles because Jesus seems too ordinary. They know his family. How can he come from heaven? Jesus does not argue. He says faith begins with the Father drawing people to him, and that he will lose none of those the Father gives him.

    That is good news for anyone who feels on the edge of the Church, and for parents worried about children who have drifted. It is not up to us to drag anyone back. God is already drawing them. Our part is to keep the door open, and to trust that Jesus will not turn away anyone who comes.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Is there anyone you know who feels unwelcome in church? How could we make them feel welcome?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Pray each day for one person who has drifted from faith, trusting that the Father is drawing them.
  prayer: Lord Jesus, you will never drive away anyone who comes to you. Draw us and those we love to yourself, and raise us up on the last day. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം മൂന്നാം ഞായർ
      ml: Third Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: “എന്റെ അടുക്കൽ വരുന്നവനെ ഞാൻ ഒരുനാളും തള്ളിക്കളകയില്ല”
    standfirst: 'യേശു ജീവന്റെ അപ്പത്തെക്കുറിച്ചു തുടർന്ന് ഉപദേശിക്കുന്നു. പുരുഷാരം പിറുപിറുത്തുതുടങ്ങുന്നു: ഇവൻ യോസേഫിന്റെ പുത്രനല്ലയോ? പിതാവ് ആകർഷിച്ചിട്ടല്ലാതെ ആർക്കും തന്റെ അടുക്കൽ വരുവാൻ കഴികയില്ല എന്നു യേശു പറയുന്നു.'
    description: 'പെന്തിക്കോസ്തിക്കു ശേഷം മൂന്നാം ഞായറിലെ വായനകൾ, ജീവന്റെ അപ്പവും ആകർഷിക്കുന്ന പിതാവും: യോഹന്നാൻ 6:35–46 വിശദമായി. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: 'താൻ ജീവന്റെ അപ്പമാണെന്നും തന്റെ അടുക്കൽ വരുന്ന ആരെയും തള്ളിക്കളകയില്ലെന്നും യേശു പറയുന്നു. പിതാവിന്റെ ഇഷ്ടം ചെയ്യാനാണ് അവൻ വന്നത്: തനിക്കു തന്നവരിൽ ഒന്നും കളയാതെ അവരെ ഒടുക്കത്തെ നാളിൽ ഉയിർത്തെഴുന്നേല്പിക്കുക. അവന്റെ അപ്പനെയും അമ്മയെയും തങ്ങൾ അറിയുന്നുവല്ലോ എന്നു പുരുഷാരം പിറുപിറുക്കുന്നു.'
      why_this_sunday: രണ്ടു ഞായറാഴ്ച മുമ്പ് ആരംഭിച്ച ജീവന്റെ അപ്പത്തെക്കുറിച്ചുള്ള ഉപദേശത്തിന്റെ തുടർച്ചയാണിത്. ഈ കാലത്ത് സഭ യോഹന്നാൻ 6 പല ഘട്ടങ്ങളായി വായിക്കുന്നു.
      take_with_you: തന്റെ അടുക്കൽ വരുന്ന ആരെയും ഒരുനാളും പുറത്തുകളയുകയില്ല എന്ന് യേശു വാഗ്ദത്തം ചെയ്യുന്നു. തള്ളിക്കളയാൻ ഒരു കാരണം തേടി അവൻ ആരെയും നോക്കിയിരിക്കുന്നില്ല.
    readings_thread: യോസേഫ് മിസ്രയീമിൽവെച്ചു തന്റെ സഹോദരന്മാരെ പരീക്ഷിക്കുന്നു; അവിശ്വസ്തരായ ജനത്തെ മടങ്ങിവരുവാൻ യിരെമ്യാവു വിളിക്കുന്നു. ദാനീയേലിൽ, ദൈവം തന്റെ ദാസന്മാരെ തീച്ചൂളയിൽനിന്നു വിടുവിക്കുന്നു. യേശുവിലൂടെയുള്ള പാപമോചനം പൌലൊസ് പ്രസംഗിക്കുന്നു; പുതിയ സൃഷ്ടിയത്രേ കാര്യം എന്നു ഗലാത്യലേഖനം പറയുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 6:35–36
      title: കണ്ടിട്ടും വിശ്വസിക്കുന്നില്ല
      text: ഞാൻ ജീവന്റെ അപ്പം ആകുന്നു, യേശു പറയുന്നു; എന്റെ അടുക്കൽ വരുന്നവന്നു വിശക്കയില്ല. എന്നാൽ നിങ്ങൾ എന്നെ കണ്ടിട്ടും വിശ്വസിക്കുന്നില്ല.
      easy_to_miss: കാണുന്നതും വിശ്വസിക്കുന്നതും ഒന്നല്ല. ഉയിർപ്പിനു ശേഷം തോമാ ഇതിന്റെ മറുവശം പഠിക്കും (യോഹന്നാൻ 20:29).
    - verses: യോഹന്നാൻ 6:37–38
      title: ഞാൻ ഒരുനാളും തള്ളിക്കളകയില്ല
      text: പിതാവു എനിക്കു തരുന്നതു ഒക്കെയും എന്റെ അടുക്കൽ വരും; എന്റെ അടുക്കൽ വരുന്നവനെ ഞാൻ ഒരുനാളും തള്ളിക്കളകയില്ല. ഞാൻ എന്റെ ഇഷ്ടമല്ല, എന്നെ അയച്ചവന്റെ ഇഷ്ടമത്രേ ചെയ്‌വാൻ സ്വർഗ്ഗത്തിൽനിന്നു ഇറങ്ങിവന്നിരിക്കുന്നത്.
      easy_to_miss: 'ഈ വാഗ്ദത്തം നിരുപാധികമാണ്. ഗ്രീക്കിൽ യോഹന്നാൻ ശക്തമായ ഇരട്ടനിഷേധം ഉപയോഗിക്കുന്നു: ‘ഒരു പ്രകാരത്തിലും പുറത്തുകളയുകയില്ല’.'
    - verses: യോഹന്നാൻ 6:39–40
      title: ഒടുക്കത്തെ നാളിൽ ഉയിർത്തെഴുന്നേല്പിക്കും
      text: അവൻ എനിക്കു തന്നതിൽ ഒന്നും ഞാൻ കളയാതെ എല്ലാം ഒടുക്കത്തെ നാളിൽ ഉയിർത്തെഴുന്നേല്പിക്കേണം എന്നാകുന്നു എന്നെ അയച്ചവന്റെ ഇഷ്ടം. പുത്രനെ നോക്കിക്കൊണ്ട് അവനിൽ വിശ്വസിക്കുന്ന ഏവന്നും നിത്യജീവൻ ഉണ്ടാകേണം.
      easy_to_miss: “ഞാൻ അവനെ ഒടുക്കത്തെ നാളിൽ ഉയിർത്തെഴുന്നേല്പിക്കും” എന്ന് ഈ അദ്ധ്യായത്തിൽ യേശു നാലു തവണ ആവർത്തിക്കുന്നു.
    - verses: യോഹന്നാൻ 6:41–42
      title: ഇവൻ യോസേഫിന്റെ പുത്രനല്ലയോ?
      text: 'താൻ സ്വർഗ്ഗത്തിൽനിന്നു ഇറങ്ങിവന്നു എന്ന് അവൻ പറഞ്ഞതുകൊണ്ട് ജനം പിറുപിറുക്കുന്നു: ഇവൻ യോസേഫിന്റെ പുത്രനായ യേശു അല്ലയോ? അവന്റെ അപ്പനെയും അമ്മയെയും നാം അറിയുന്നുവല്ലോ.'
      easy_to_miss: മരുഭൂമിയിൽ മന്നയെക്കുറിച്ചു യിസ്രായേൽ പരാതിപ്പെട്ടതിനെക്കുറിച്ചു പറയുന്ന അതേ വാക്കാണ് ‘പിറുപിറുക്കുക’ (പുറപ്പാടു 16).
    - verses: യോഹന്നാൻ 6:43–46
      title: പിതാവ് ആകർഷിക്കുന്നു
      text: നിങ്ങൾ തമ്മിൽ പിറുപിറുക്കേണ്ടാ, യേശു പറയുന്നു. എന്നെ അയച്ച പിതാവു ആകർഷിച്ചിട്ടല്ലാതെ ആർക്കും എന്റെ അടുക്കൽ വരുവാൻ കഴികയില്ല. എല്ലാവരും ദൈവത്താൽ ഉപദേശിക്കപ്പെട്ടവർ ആകും എന്നു പ്രവാചകപുസ്തകങ്ങളിൽ എഴുതിയിരിക്കുന്നു.
      easy_to_miss: വിശ്വാസം ദൈവത്തിനായുള്ള നമ്മുടെ അന്വേഷണം മാത്രമല്ല. ദൈവം നമ്മെ ആകർഷിക്കുന്നതിലൂടെയാണ് അതു തുടങ്ങുന്നത്.
    people:
    - name: കഫർന്നഹൂമിലെ പുരുഷാരം
      role: പള്ളിയിൽ കേട്ടുകൊണ്ടിരുന്നവർ; യേശുവിന്റെ കുടുംബത്തെ അറിയാവുന്നതിനാൽ അവൻ സ്വർഗ്ഗത്തിൽനിന്നു വന്നുവെന്നു വിശ്വസിക്കാൻ കഴിയാത്തവർ.
      name_meaning: —
      ml: The crowd in Capernaum
    - name: യോസേഫ്
      role: യേശുവിന്റെ അപ്പനായി പുരുഷാരം പേരുപറയുന്നവൻ.
      name_meaning: “അവൻ കൂട്ടിച്ചേർക്കും”
      ml: Joseph
    phrases:
    - term: ഒടുക്കത്തെ നാൾ
      explanation: കാലാവസാനത്തിലെ പുനരുത്ഥാനത്തിന്റെയും ന്യായവിധിയുടെയും ദിവസം.
    - term: ആകർഷിക്കുക
      explanation: വല വലിച്ചുകയറ്റുന്നതിനും ഇതേ ഗ്രീക്ക് വാക്ക് ഉപയോഗിക്കുന്നു (യോഹന്നാൻ 21:6). ദൈവം ആളുകളെ ക്രിസ്തുവിലേക്കു വലിച്ചടുപ്പിക്കുന്നു.
    - term: ദൈവത്താൽ ഉപദേശിക്കപ്പെട്ടവർ
      explanation: യെശയ്യാവു 54:13-ൽനിന്നുള്ള ഉദ്ധരണി; തന്റെ മക്കളെ എല്ലാവരെയും താൻതന്നെ ഉപദേശിക്കുമെന്നു ദൈവം അവിടെ വാഗ്ദത്തം ചെയ്യുന്നു.
    reflection:
      title_en: ഒരുനാളും തള്ളിക്കളയുകയില്ല
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ദൈവത്തിനു മുമ്പിൽ തങ്ങൾ മതിയായവരല്ല എന്ന ഒരു ഭയം പലരും ചുമക്കുന്നു. വളരെ മോശമായ എന്തോ ചെയ്തുപോയി, അല്ലെങ്കിൽ വളരെ വൈകിപ്പോയി, അല്ലെങ്കിൽ അധികം സംശയിച്ചുപോയി എന്ന് അവർ കരുതുന്നു. ആ ഭയത്തിനു യേശു ഒറ്റ വാക്യത്തിൽ ഉത്തരം നല്കുന്നു: എന്റെ അടുക്കൽ വരുന്നവനെ ഞാൻ ഒരുനാളും തള്ളിക്കളകയില്ല.

        യേശു വളരെ സാധാരണക്കാരനായി തോന്നുന്നതുകൊണ്ട് കഫർന്നഹൂമിലെ പുരുഷാരം പിറുപിറുക്കുന്നു. അവന്റെ കുടുംബത്തെ അവർക്കറിയാം. അവൻ എങ്ങനെ സ്വർഗ്ഗത്തിൽനിന്നു വരും? യേശു തർക്കിക്കുന്നില്ല. പിതാവ് ആളുകളെ തന്നിലേക്ക് ആകർഷിക്കുന്നതിലൂടെയാണ് വിശ്വാസം തുടങ്ങുന്നതെന്നും, പിതാവു തനിക്കു തരുന്നവരിൽ ഒന്നിനെയും താൻ കളയുകയില്ലെന്നും അവൻ പറയുന്നു.

        സഭയുടെ അരികിലാണെന്നു തോന്നുന്ന ഏവർക്കും, അകന്നുപോയ മക്കളെക്കുറിച്ചു വ്യാകുലപ്പെടുന്ന മാതാപിതാക്കൾക്കും ഇതു സുവാർത്തയാണ്. ആരെയും വലിച്ചിഴച്ചു മടക്കിക്കൊണ്ടുവരേണ്ടതു നമ്മളല്ല. ദൈവം ഇപ്പോൾതന്നെ അവരെ ആകർഷിച്ചുകൊണ്ടിരിക്കുന്നു. വാതിൽ തുറന്നിടുകയും, വരുന്ന ആരെയും യേശു തള്ളിക്കളകയില്ല എന്ന് ആശ്രയിക്കുകയുമാണ് നമ്മുടെ പങ്ക്.
      title_ml: Never driven away
    week:
      question: പള്ളിയിൽ സ്വാഗതം ലഭിക്കുന്നില്ലെന്നു തോന്നുന്ന ആരെയെങ്കിലും നിങ്ങൾക്ക് അറിയാമോ? അവരെ എങ്ങനെ സ്വാഗതം ചെയ്യാം?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: വിശ്വാസത്തിൽനിന്ന് അകന്നുപോയ ഒരാൾക്കുവേണ്ടി, പിതാവ് അവരെ ആകർഷിച്ചുകൊണ്ടിരിക്കുന്നു എന്ന് ആശ്രയിച്ചുകൊണ്ട്, എല്ലാ ദിവസവും പ്രാർത്ഥിക്കുക.
      prayer: കർത്താവായ യേശുവേ, നിന്റെ അടുക്കൽ വരുന്ന ആരെയും നീ ഒരുനാളും തള്ളിക്കളകയില്ല. ഞങ്ങളെയും ഞങ്ങൾ സ്നേഹിക്കുന്നവരെയും നിന്നിലേക്ക് ആകർഷിക്കേണമേ; ഒടുക്കത്തെ നാളിൽ ഞങ്ങളെ ഉയിർത്തെഴുന്നേല്പിക്കേണമേ. ആമേൻ.
