one_minute:
  what_happens: Mary is found to be with child before she and Joseph live together. Joseph, a just man, plans to divorce her quietly. An angel tells him in a dream to take Mary as his wife and name the child Jesus. He wakes and obeys.
  why_this_sunday: 'Zechariah, Mary and now Joseph: each hears from God in turn. This is the last announcement before Christmas.'
  take_with_you: Joseph was right by the rules and still willing to be told something new. Being good and being teachable belong together.
readings_thread: Abram lets Lot choose first rather than quarrel, and Isaiah grieves over a people who do not understand. Paul tells how God revealed his Son to him, and Peter urges believers to live honourably. Joseph listens and acts.
key_verse:
  ref: Matthew 1:21
  ml: അവൾ ഒരു മകനെ പ്രസവിക്കും; അവൻ തന്റെ ജനത്തെ അവരുടെ പാപങ്ങളിൽ നിന്നു രക്ഷിപ്പാനിരിക്കകൊണ്ടു നീ അവന്നു യേശു എന്നു പേർ ഇടേണം എന്നു പറഞ്ഞു.
  ml_translation: Sathyavedapusthakam, 1910
  en: She shall give birth to a son. You shall name him Jesus, for it is he who shall save his people from their sins.
  en_translation: World English Bible
scenes:
- verses: Matthew 1:18
  title: Before they came together
  text: Mary is engaged to Joseph. Before they live together she is found to be with child from the Holy Spirit.
  easy_to_miss: Matthew tells the reader where the child is from at once. Joseph does not know yet.
- verses: Matthew 1:19
  title: A just man’s plan
  text: Joseph is a righteous man and does not want to shame her in public. He decides to end the engagement quietly.
  easy_to_miss: The law allowed a public case. Joseph chooses mercy before he knows the truth.
- verses: Matthew 1:20–21
  title: Do not be afraid
  text: 'An angel appears to him in a dream: Joseph, son of David, do not be afraid to take Mary as your wife. She will bear a son, and you will name him Jesus, for he will save his people from their sins.'
  easy_to_miss: By naming the child, Joseph adopts him into the house of David. That is how Jesus becomes David’s heir.
- verses: Matthew 1:22–23
  title: God with us
  text: 'Matthew says this fulfils Isaiah: a virgin will conceive and bear a son, and they will call him Immanuel, which means God with us.'
  easy_to_miss: 'Matthew’s Gospel ends with the same promise: “I am with you always” (Matthew 28:20).'
- verses: Matthew 1:24–25
  title: Joseph wakes and obeys
  text: Joseph wakes, does as the angel commanded and takes Mary as his wife. When the son is born, he names him Jesus.
  easy_to_miss: Joseph never speaks a single recorded word in the Gospels. Everything we know about him is what he did.
people:
- name: Joseph
  ml: യോസേഫ്
  role: A carpenter of Nazareth from the line of David, engaged to Mary.
  name_meaning: “He will add”
- name: Mary
  ml: മറിയം
  role: Betrothed to Joseph, carrying the child of the Holy Spirit.
  name_meaning: Hebrew Miriam; the meaning is uncertain
- name: Jesus
  ml: യേശു
  role: The child Joseph is told to name.
  name_meaning: “The Lord saves”
phrases:
- term: Immanuel
  explanation: Hebrew for “God with us”, from Isaiah 7:14.
- term: Righteous man
  explanation: Someone who keeps God’s law faithfully. Joseph shows that keeping the law and showing mercy go together.
- term: Son of David
  explanation: The angel greets Joseph by his royal ancestry. Through Joseph’s adoption, Jesus belongs to David’s line.
reflection:
  title_en: The quiet obedience of Joseph
  title_ml: യോസേഫിന്റെ നിശ്ശബ്ദമായ അനുസരണം
  read_time: A three-minute read
  body: |-
    Joseph had a plan, and it was a good one. He would not shame Mary. He would end things quietly and let her go. Nobody could have blamed him. Matthew calls him righteous, and the plan shows it.

    Then God spoke, and Joseph changed his mind. He gave up the reasonable plan for one that would cost him his reputation and his peace. He took Mary home, named a child who was not his by blood, and later took the family to Egypt and back, each time because God told him to.

    Most of us like our plans, especially when they are fair and sensible. Joseph shows that a good plan can still be the wrong one. He did not argue or ask for proof. He woke up and did what he was told. In a home, that kind of quiet obedience often holds more together than anything anyone says.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: When did you last change your mind about something important? What made you change it?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Do one helpful job at home this week without being asked and without mentioning it.
  prayer: Lord, you spoke to Joseph in a dream and he obeyed. Make us just and merciful like him, ready to set aside our own plans when you show us a better way. Amen.
translations:
  ml:
    name:
      en: യോസേഫിനോടുള്ള അറിയിപ്പിന്റെ ഞായർ
      ml: Annunciation to St. Joseph
    season:
      en: സൂബോറോ
      gloss: അറിയിപ്പുകളുടെ കാലം
    tagline: യോസേഫിന് ഒരു പദ്ധതിയുണ്ട്; ദൈവത്തിന് അതിലും നല്ലതൊന്ന്
    standfirst: മറിയ ഗർഭിണിയാണെന്ന് അറിഞ്ഞ യോസേഫ് വിവാഹനിശ്ചയം രഹസ്യമായി ഉപേക്ഷിക്കാൻ തീരുമാനിക്കുന്നു. അപ്പോൾ ഒരു ദൂതൻ സ്വപ്നത്തിൽ അവനോടു സംസാരിക്കുന്നു; സുവിശേഷങ്ങളിൽ ഒരു വാക്കുപോലും പറയാത്ത ആ മനുഷ്യൻ പറഞ്ഞതുപോലെ തന്നെ ചെയ്യുന്നു.
    description: യോസേഫിനോടുള്ള അറിയിപ്പിന്റെ ഞായറിലെ വായനകൾ, മത്തായി 1:18–25 അഞ്ചു രംഗങ്ങളിൽ, ഒരു ധ്യാനം, കുടുംബത്തിനായി ഒരു ചോദ്യം.
    one_minute:
      what_happens: യോസേഫും മറിയയും ഒന്നിച്ചു താമസിക്കുന്നതിനു മുമ്പ് മറിയ ഗർഭിണിയായി കാണപ്പെടുന്നു. നീതിമാനായ യോസേഫ് അവളെ രഹസ്യമായി ഉപേക്ഷിക്കാൻ ഭാവിക്കുന്നു. മറിയയെ ഭാര്യയായി ചേർത്തുകൊള്ളാനും കുഞ്ഞിന് യേശു എന്നു പേരിടാനും ഒരു ദൂതൻ സ്വപ്നത്തിൽ അവനോടു പറയുന്നു. അവൻ ഉണർന്ന് അനുസരിക്കുന്നു.
      why_this_sunday: 'സെഖര്യാവ്, മറിയ, ഇപ്പോൾ യോസേഫ്: ഓരോരുത്തരും മാറിമാറി ദൈവത്തിൽനിന്നു കേൾക്കുന്നു. ക്രിസ്തുമസിനു മുമ്പുള്ള അവസാനത്തെ അറിയിപ്പാണിത്.'
      take_with_you: നിയമപ്രകാരം യോസേഫ് ശരിയായിരുന്നു; എന്നിട്ടും പുതിയൊരു കാര്യം കേൾക്കാൻ അവൻ തയ്യാറായിരുന്നു. നല്ലവനായിരിക്കുന്നതും പഠിക്കാൻ മനസ്സുള്ളവനായിരിക്കുന്നതും ഒന്നിച്ചു പോകുന്നു.
    readings_thread: കലഹിക്കാതിരിക്കാൻ അബ്രാം ആദ്യം തിരഞ്ഞെടുക്കാൻ ലോത്തിനെ അനുവദിക്കുന്നു; ഗ്രഹിക്കാത്ത ഒരു ജനത്തെക്കുറിച്ച് യെശയ്യാവ് ദുഃഖിക്കുന്നു. ദൈവം തന്റെ പുത്രനെ തന്നിൽ വെളിപ്പെടുത്തിയതെങ്ങനെ എന്ന് പൗലോസ് പറയുന്നു; മാന്യമായി ജീവിക്കാൻ പത്രൊസ് വിശ്വാസികളെ ഉപദേശിക്കുന്നു. യോസേഫ് കേൾക്കുകയും പ്രവർത്തിക്കുകയും ചെയ്യുന്നു.
    scenes:
    - verses: മത്തായി 1:18
      title: അവർ കൂടിവരുംമുമ്പെ
      text: മറിയയ്ക്ക് യോസേഫുമായി വിവാഹം നിശ്ചയിച്ചിരിക്കുന്നു. അവർ ഒന്നിച്ചു താമസിക്കുന്നതിനു മുമ്പ് അവൾ പരിശുദ്ധാത്മാവിനാൽ ഗർഭിണിയായി കാണപ്പെടുന്നു.
      easy_to_miss: കുഞ്ഞ് എവിടെനിന്ന് എന്ന് മത്തായി വായനക്കാരനോട് ഉടനെ പറയുന്നു. യോസേഫ് അത് ഇനിയും അറിഞ്ഞിട്ടില്ല.
    - verses: മത്തായി 1:19
      title: ഒരു നീതിമാന്റെ പദ്ധതി
      text: യോസേഫ് നീതിമാനാണ്; അവളെ പരസ്യമായി അപമാനിക്കാൻ അവന് ഇഷ്ടമില്ല. വിവാഹനിശ്ചയം രഹസ്യമായി ഉപേക്ഷിക്കാൻ അവൻ തീരുമാനിക്കുന്നു.
      easy_to_miss: ഒരു പരസ്യവിചാരണയ്ക്ക് നിയമം അനുവദിച്ചിരുന്നു. സത്യം അറിയുന്നതിനു മുമ്പേ യോസേഫ് കരുണ തിരഞ്ഞെടുക്കുന്നു.
    - verses: മത്തായി 1:20–21
      title: ശങ്കിക്കേണ്ടാ
      text: 'ഒരു ദൂതൻ സ്വപ്നത്തിൽ അവനു പ്രത്യക്ഷനാകുന്നു: ദാവീദിന്റെ മകനായ യോസേഫേ, നിന്റെ ഭാര്യയായ മറിയയെ ചേർത്തുകൊൾവാൻ ശങ്കിക്കേണ്ടാ. അവൾ ഒരു മകനെ പ്രസവിക്കും; അവൻ തന്റെ ജനത്തെ അവരുടെ പാപങ്ങളിൽനിന്നു രക്ഷിപ്പാനിരിക്കകൊണ്ടു നീ അവന്നു യേശു എന്നു പേർ ഇടേണം.'
      easy_to_miss: കുഞ്ഞിനു പേരിടുന്നതിലൂടെ യോസേഫ് അവനെ ദാവീദിന്റെ ഗൃഹത്തിലേക്കു ദത്തെടുക്കുന്നു. അങ്ങനെയാണ് യേശു ദാവീദിന്റെ അവകാശിയാകുന്നത്.
    - verses: മത്തായി 1:22–23
      title: ദൈവം നമ്മോടുകൂടെ
      text: 'ഇതു യെശയ്യാവിന്റെ വാക്കിന്റെ നിവൃത്തിയാണ് എന്ന് മത്തായി പറയുന്നു: കന്യക ഗർഭിണിയായി ഒരു മകനെ പ്രസവിക്കും; അവന്നു ദൈവം നമ്മോടുകൂടെ എന്നർത്ഥമുള്ള ഇമ്മാനൂവേൽ എന്നു പേർ വിളിക്കും.'
      easy_to_miss: 'മത്തായിയുടെ സുവിശേഷം അവസാനിക്കുന്നതും ഇതേ വാഗ്ദാനത്തോടെയാണ്: “ഞാനോ ലോകാവസാനത്തോളം എല്ലാനാളും നിങ്ങളോടുകൂടെ ഉണ്ടു” (മത്തായി 28:20).'
    - verses: മത്തായി 1:24–25
      title: യോസേഫ് ഉണർന്ന് അനുസരിക്കുന്നു
      text: യോസേഫ് ഉണർന്ന്, ദൂതൻ കല്പിച്ചതുപോലെ ചെയ്ത്, മറിയയെ ഭാര്യയായി ചേർത്തുകൊള്ളുന്നു. മകൻ ജനിച്ചപ്പോൾ അവൻ അവനു യേശു എന്നു പേരിടുന്നു.
      easy_to_miss: സുവിശേഷങ്ങളിൽ യോസേഫിന്റേതായി ഒരു വാക്കുപോലും രേഖപ്പെടുത്തിയിട്ടില്ല. അവനെക്കുറിച്ചു നമുക്കറിയാവുന്നതെല്ലാം അവൻ ചെയ്തതാണ്.
    people:
    - name: യോസേഫ്
      role: ദാവീദിന്റെ വംശത്തിൽപ്പെട്ട നസറെത്തിലെ ഒരു തച്ചൻ; മറിയയ്ക്കു വിവാഹം നിശ്ചയിച്ചിരുന്നവൻ.
      name_meaning: “അവൻ കൂട്ടിച്ചേർക്കും”
      ml: Joseph
    - name: മറിയം
      role: യോസേഫിനു വിവാഹം നിശ്ചയിക്കപ്പെട്ടവൾ; പരിശുദ്ധാത്മാവിനാലുള്ള ശിശുവിനെ വഹിക്കുന്നവൾ.
      name_meaning: എബ്രായയിൽ മിര്യാം; അർത്ഥം ഉറപ്പില്ല
      ml: Mary
    - name: യേശു
      role: യോസേഫ് പേരിടാൻ കല്പന കിട്ടിയ ശിശു.
      name_meaning: “കർത്താവ് രക്ഷിക്കുന്നു”
      ml: Jesus
    phrases:
    - term: ഇമ്മാനൂവേൽ
      explanation: “ദൈവം നമ്മോടുകൂടെ” എന്നർത്ഥമുള്ള എബ്രായ പേര്; യെശയ്യാവ് 7:14-ൽനിന്ന്.
    - term: നീതിമാൻ
      explanation: ദൈവത്തിന്റെ ന്യായപ്രമാണം വിശ്വസ്തതയോടെ പാലിക്കുന്നവൻ. ന്യായപ്രമാണം പാലിക്കുന്നതും കരുണ കാണിക്കുന്നതും ഒന്നിച്ചു പോകുന്നു എന്ന് യോസേഫ് കാണിക്കുന്നു.
    - term: ദാവീദിന്റെ മകൻ
      explanation: ദൂതൻ യോസേഫിനെ അവന്റെ രാജവംശം ചൊല്ലി അഭിസംബോധന ചെയ്യുന്നു. യോസേഫിന്റെ ദത്തെടുപ്പിലൂടെ യേശു ദാവീദിന്റെ വംശത്തിൽ ഉൾപ്പെടുന്നു.
    reflection:
      title_en: യോസേഫിന്റെ നിശ്ശബ്ദമായ അനുസരണം
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        യോസേഫിന് ഒരു പദ്ധതിയുണ്ടായിരുന്നു; അതു നല്ലൊരു പദ്ധതിയുമായിരുന്നു. അവൻ മറിയയെ അപമാനിക്കുകയില്ല. കാര്യങ്ങൾ നിശ്ശബ്ദമായി അവസാനിപ്പിച്ച് അവളെ വിട്ടയയ്ക്കും. ആർക്കും അവനെ കുറ്റപ്പെടുത്താൻ കഴിയുമായിരുന്നില്ല. മത്തായി അവനെ നീതിമാൻ എന്നു വിളിക്കുന്നു; ആ പദ്ധതി അതു തെളിയിക്കുന്നു.

        പിന്നെ ദൈവം സംസാരിച്ചു; യോസേഫ് മനസ്സു മാറ്റി. തന്റെ പേരും സമാധാനവും നഷ്ടപ്പെടുത്താവുന്ന ഒന്നിനുവേണ്ടി അവൻ ന്യായമായ പദ്ധതി ഉപേക്ഷിച്ചു. അവൻ മറിയയെ വീട്ടിലേക്കു കൊണ്ടുവന്നു; രക്തബന്ധത്താൽ തന്റേതല്ലാത്ത ഒരു കുഞ്ഞിനു പേരിട്ടു; പിന്നീട് കുടുംബത്തെ മിസ്രയീമിലേക്കും തിരികെയും കൊണ്ടുപോയി; ഓരോ തവണയും ദൈവം പറഞ്ഞതുകൊണ്ട്.

        നമ്മിൽ മിക്കവർക്കും നമ്മുടെ പദ്ധതികൾ ഇഷ്ടമാണ്; പ്രത്യേകിച്ച് അവ ന്യായവും യുക്തിസഹവുമാകുമ്പോൾ. ഒരു നല്ല പദ്ധതിയും തെറ്റായതാകാം എന്ന് യോസേഫ് കാണിക്കുന്നു. അവൻ തർക്കിച്ചില്ല, തെളിവു ചോദിച്ചില്ല. അവൻ ഉണർന്ന്, പറഞ്ഞതുപോലെ ചെയ്തു. ഒരു ഭവനത്തിൽ, ആരുടെയും വാക്കുകളെക്കാൾ കൂടുതൽ കാര്യങ്ങളെ ചേർത്തുനിർത്തുന്നത് പലപ്പോഴും ഇത്തരം നിശ്ശബ്ദമായ അനുസരണമാണ്.
      title_ml: The quiet obedience of Joseph
    week:
      question: പ്രധാനപ്പെട്ട ഒരു കാര്യത്തിൽ നിങ്ങൾ അവസാനമായി മനസ്സു മാറ്റിയത് എപ്പോഴാണ്? എന്താണ് നിങ്ങളെ മാറ്റിയത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച ആരും ആവശ്യപ്പെടാതെ, ആരോടും പറയാതെ, വീട്ടിൽ സഹായകരമായ ഒരു ജോലി ചെയ്യുക.
      prayer: കർത്താവേ, നീ യോസേഫിനോടു സ്വപ്നത്തിൽ സംസാരിച്ചു; അവൻ അനുസരിച്ചു. അവനെപ്പോലെ ഞങ്ങളെ നീതിയും കരുണയും ഉള്ളവരാക്കേണമേ; നീ ഒരു നല്ല വഴി കാണിക്കുമ്പോൾ ഞങ്ങളുടെ പദ്ധതികൾ മാറ്റിവെക്കാൻ ഒരുക്കമുള്ളവരാക്കേണമേ. ആമേൻ.
