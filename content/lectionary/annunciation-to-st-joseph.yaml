    hero_quote:
      text: ദാവീദിന്റെ മകനായ യോസേഫേ, നിന്റെ ഭാര്യയായ മറിയയെ ചേർത്തുകൊൾവാൻ ശങ്കിക്കേണ്ടാ; അവളിൽ ഉല്പാദിതമായതു പരിശുദ്ധാത്മാവിനാൽ ആകുന്നു.
