- term: Immanuel
  explanation: Hebrew for “God with us”, from Isaiah 7:14.
- term: Righteous man
  explanation: Someone who keeps God’s law faithfully. Joseph shows that keeping the law and showing mercy go together.
- term: Son of David
  explanation: The angel greets Joseph by his royal ancestry. Through Joseph’s adoption, Jesus belongs to David’s line.
reflection:
  title_en: The quiet obedience of Joseph
  title_ml: '[TITLE ML]'
  read_time: A three-minute read
  body: |-
    Joseph had a plan, and it was a good one. He would not shame Mary. He would end things quietly and let her go. Nobody could have blamed him. Matthew calls him righteous, and the plan shows it.

    Then God spoke, and Joseph changed his mind. He gave up the reasonable plan for one that would cost him his reputation and his peace. He took Mary home, named a child who was not his by blood, and later took the family to Egypt and back, each time because God told him to.

    Most of us like our plans, especially when they are fair and sensible. Joseph shows that a good plan can still be the wrong one. He did not argue or ask for proof. He woke up and did what he was told. In a home, that kind of quiet obedience often holds more together than anything anyone says.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: When did you last change your mind about something important? What made you change it?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Do one helpful job at home this week without being asked and without mentioning it.
  prayer: Lord, you spoke to Joseph in a dream and he obeyed. Make us just and merciful like him, ready to set aside our own plans when you show us a better way. Amen.
