tagline: Joseph has a plan, and God has a better one
standfirst: Joseph finds out that Mary is pregnant and decides to end the engagement quietly. Then an angel speaks to him in a dream, and a man who never says a word in the Gospels does exactly what he is told.
description: Readings for the Annunciation to St. Joseph, with Matthew 1:18–25 explained in five scenes, a reflection and one question for the family.
