one_minute:
  what_happens: Mary is found to be with child before she and Joseph live together. Joseph, a just man, plans to divorce her quietly. An angel tells him in a dream to take Mary as his wife and name the child Jesus. He wakes and obeys.
  why_this_sunday: 'Zechariah, Mary and now Joseph: each hears from God in turn. This is the last announcement before Christmas.'
  take_with_you: Joseph was right by the rules and still willing to be told something new. Being good and being teachable belong together.
readings_thread: Abram lets Lot choose first rather than quarrel, and Isaiah grieves over a people who do not understand. Paul tells how God revealed his Son to him, and Peter urges believers to live honourably. Joseph listens and acts.
key_verse:
  ref: Matthew 1:21
  ml: '[ML VERSE: Sathyavedapusthakam 1910, Matthew 1:21]'
  ml_translation: Sathyavedapusthakam, 1910
  en: She shall give birth to a son. You shall name him Jesus, for it is he who shall save his people from their sins.
  en_translation: World English Bible
scenes:
- verses: Matthew 1:18
  title: Before they came together
  text: Mary is engaged to Joseph. Before they live together she is found to be with child from the Holy Spirit.
  easy_to_miss: Matthew tells the reader where the child is from at once. Joseph does not know yet.
- verses: Matthew 1:19
  title: A just man’s plan
  text: Joseph is a righteous man and does not want to shame her in public. He decides to end the engagement quietly.
  easy_to_miss: The law allowed a public case. Joseph chooses mercy before he knows the truth.
- verses: Matthew 1:20–21
  title: Do not be afraid
  text: 'An angel appears to him in a dream: Joseph, son of David, do not be afraid to take Mary as your wife. She will bear a son, and you will name him Jesus, for he will save his people from their sins.'
  easy_to_miss: By naming the child, Joseph adopts him into the house of David. That is how Jesus becomes David’s heir.
- verses: Matthew 1:22–23
  title: God with us
  text: 'Matthew says this fulfils Isaiah: a virgin will conceive and bear a son, and they will call him Immanuel, which means God with us.'
  easy_to_miss: 'Matthew’s Gospel ends with the same promise: “I am with you always” (Matthew 28:20).'
- verses: Matthew 1:24–25
  title: Joseph wakes and obeys
  text: Joseph wakes, does as the angel commanded and takes Mary as his wife. When the son is born, he names him Jesus.
  easy_to_miss: Joseph never speaks a single recorded word in the Gospels. Everything we know about him is what he did.
