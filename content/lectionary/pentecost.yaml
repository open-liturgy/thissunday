      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    also_kept_as: സൺഡേസ്കൂൾ ദിനം
    tagline: മുന്തിരിവള്ളിയും കൊമ്പുകളും; പകരപ്പെട്ട ആത്മാവും
    standfirst: 'ഉയിർപ്പിനു ശേഷം അമ്പതാം ദിവസം കാറ്റായും തീയായും പരിശുദ്ധാത്മാവു ശിഷ്യന്മാരുടെമേൽ വരുന്നു. കുർബ്ബാനയിലെ സുവിശേഷം അന്ത്യഅത്താഴത്തിലേക്കു മടങ്ങിപ്പോകുന്നു; അവിടെ യേശു പറഞ്ഞു: ഞാൻ മുന്തിരിവള്ളിയും നിങ്ങൾ കൊമ്പുകളും ആകുന്നു.'
    description: പെന്തിക്കോസ്തിയിലെ വായനകൾ, അപ്പൊസ്തലപ്രവൃത്തികൾ 2-ഉം മുന്തിരിവള്ളിയെക്കുറിച്ചുള്ള യോഹന്നാൻ 15:1–14-ഉം അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും കുടുംബചോദ്യവും.
    one_minute:
      what_happens: 'അപ്പൊസ്തലപ്രവൃത്തികളിൽ, പരിശുദ്ധാത്മാവു കാറ്റുപോലെയും തീനാവുകൾപോലെയും ശിഷ്യന്മാരുടെമേൽ വരുന്നു; ഓരോ തീർത്ഥാടകനും മനസ്സിലാകുന്ന ഭാഷകളിൽ അവർ സംസാരിക്കുന്നു. സുവിശേഷത്തിൽ, താൻ മുന്തിരിവള്ളിയും അവർ കൊമ്പുകളും ആകുന്നു എന്ന് യേശു പറയുന്നു: എന്നിൽ വസിപ്പിൻ; എന്നാൽ നിങ്ങൾ വളരെ ഫലം കായ്ക്കും.'
      why_this_sunday: ആത്മാവു സഭയുടെമേൽ വന്ന, ഉയിർപ്പിനു ശേഷമുള്ള അമ്പതാം ദിവസമാണ് പെന്തിക്കോസ്തി. ഇതോടെ ഉയിർപ്പുകാലം അവസാനിക്കുന്നു. സഭ ഈ ദിവസം സൺഡേസ്കൂൾ ദിനമായും ആചരിക്കുന്നു.
      take_with_you: ഫലം കായ്ക്കാൻ കൊമ്പ് കഠിനമായി ശ്രമിക്കുന്നില്ല. അതു മുന്തിരിവള്ളിയോടു ചേർന്നുനില്ക്കുന്നു. ആ ബന്ധം നിലനിർത്തുന്നത് ആത്മാവാണ്.
    readings_thread: 'എഴുപതു മൂപ്പന്മാരുടെമേൽ ദൈവം തന്റെ ആത്മാവിനെ പകരുന്നു; ആത്മാവു വരുമ്പോൾ ശൌൽ മറ്റൊരു മനുഷ്യനാകുന്നു. പുതിയ ഹൃദയവും പുതിയ ആത്മാവും യെഹെസ്കേൽ വാഗ്ദത്തം ചെയ്യുന്നു. അപ്പൊസ്തലപ്രവൃത്തികളിൽ ആ വാഗ്ദത്തം നിവൃത്തിയാകുന്നു; ആത്മാവിന്റെ ഫലം ഗലാത്യലേഖനം എണ്ണിപ്പറയുന്നു: “സ്നേഹം, സന്തോഷം, സമാധാനം, ദീർഘക്ഷമ”.'
