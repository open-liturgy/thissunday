one_minute:
  what_happens: 'In Acts, the Holy Spirit comes on the disciples like wind and tongues of fire, and they speak in languages every pilgrim can understand. In the Gospel, Jesus says he is the vine and they are the branches: remain in me and you will bear much fruit.'
  why_this_sunday: Pentecost is the fiftieth day after Easter, when the Spirit came on the Church. It ends the Easter season. The Church also keeps it as Sunday School Day.
  take_with_you: A branch does not try hard to bear fruit. It stays connected to the vine. The Spirit is how we stay connected.
readings_thread: 'God puts his Spirit on seventy elders, and Saul is changed when the Spirit comes on him. Ezekiel promises a new heart and a new spirit. In Acts the promise is kept, and Galatians lists the fruit of the Spirit: love, joy, peace, patience.'
key_verse:
  ref: John 15:5
  ml: ഞാൻ മുന്തിരിവള്ളിയും നിങ്ങൾ കൊമ്പുകളും ആകുന്നു; ഒരുത്തൻ എന്നിലും ഞാൻ അവനിലും വസിക്കുന്നു എങ്കിൽ അവൻ വളരെ ഫലം കായ്ക്കും; എന്നെ പിരിഞ്ഞു നിങ്ങൾക്കു ഒന്നും ചെയ്‌വാൻ കഴികയില്ല.
  ml_translation: Sathyavedapusthakam, 1910
  en: I am the vine. You are the branches. He who remains in me and I in him bears much fruit, for apart from me you can do nothing.
  en_translation: World English Bible
scenes:
- verses: John 15:1–2
  title: The true vine
  text: I am the true vine, and my Father is the gardener. He cuts away every branch that bears no fruit, and prunes every branch that does, so that it bears more.
  easy_to_miss: Israel was often called God’s vine (Isaiah 5:1–7). Jesus calls himself the true one.
- verses: John 15:3–4
  title: Remain in me
  text: You are already clean because of the word I have spoken. Remain in me, and I in you. A branch cannot bear fruit by itself unless it stays on the vine.
  easy_to_miss: The Greek word for “remain” (or “abide”) comes again and again in these verses. It is the key word of the passage.
- verses: John 15:5–8
  title: Apart from me, nothing
  text: I am the vine, you are the branches. Whoever remains in me bears much fruit, for apart from me you can do nothing. My Father is glorified when you bear much fruit and so prove to be my disciples.
  easy_to_miss: The fruit is not for the branch. Branches bear fruit for others to eat.
- verses: John 15:9–11
  title: Remain in my love
  text: As the Father has loved me, so I have loved you. Remain in my love by keeping my commandments. I tell you this so my joy may be in you and your joy may be full.
  easy_to_miss: Jesus speaks of joy on the night of his betrayal, as in John 17.
- verses: John 15:12–14
  title: Friends
  text: 'This is my commandment: love one another as I have loved you. No one has greater love than to lay down their life for their friends. You are my friends if you do what I command.'
  easy_to_miss: Jesus calls his disciples friends, not servants (verse 15). Friendship with God is the fruit of the Spirit.
