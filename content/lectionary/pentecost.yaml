      title: സാക്ഷാൽ മുന്തിരിവള്ളി
      text: ഞാൻ സാക്ഷാൽ മുന്തിരിവള്ളിയും എന്റെ പിതാവു തോട്ടക്കാരനും ആകുന്നു. കായ്ക്കാത്ത കൊമ്പ് ഒക്കെയും അവൻ നീക്കിക്കളയുന്നു; കായ്ക്കുന്നത് ഒക്കെയും അധികം ഫലം കായ്ക്കേണ്ടതിന്നു ചെത്തി വെടിപ്പാക്കുന്നു.
      easy_to_miss: യിസ്രായേലിനെ പലപ്പോഴും ദൈവത്തിന്റെ മുന്തിരിത്തോട്ടം എന്നു വിളിച്ചിരുന്നു (യെശയ്യാവു 5:1–7). യേശു തന്നെത്താൻ സാക്ഷാൽ മുന്തിരിവള്ളി എന്നു വിളിക്കുന്നു.
    - verses: യോഹന്നാൻ 15:3–4
      title: എന്നിൽ വസിപ്പിൻ
      text: ഞാൻ നിങ്ങളോടു സംസാരിച്ച വചനംനിമിത്തം നിങ്ങൾ ഇപ്പോൾ ശുദ്ധിയുള്ളവരാകുന്നു. എന്നിൽ വസിപ്പിൻ; ഞാൻ നിങ്ങളിലും വസിക്കും. മുന്തിരിവള്ളിയിൽ വസിച്ചിട്ടല്ലാതെ കൊമ്പിന്നു സ്വയമായി കായ്പാൻ കഴിയുകയില്ല.
      easy_to_miss: ‘വസിക്കുക’ എന്നതിന്റെ ഗ്രീക്ക് വാക്ക് ഈ വാക്യങ്ങളിൽ വീണ്ടും വീണ്ടും വരുന്നു. ഈ ഭാഗത്തിന്റെ താക്കോൽവാക്ക് അതാണ്.
    - verses: യോഹന്നാൻ 15:5–8
      title: എന്നെ പിരിഞ്ഞ് ഒന്നും ഇല്ല
      text: ഞാൻ മുന്തിരിവള്ളിയും നിങ്ങൾ കൊമ്പുകളും ആകുന്നു. എന്നിൽ വസിക്കുന്നവൻ വളരെ ഫലം കായ്ക്കും; എന്നെ പിരിഞ്ഞു നിങ്ങൾക്കു ഒന്നും ചെയ്‌വാൻ കഴികയില്ല. നിങ്ങൾ വളരെ ഫലം കായ്ക്കുന്നതിനാൽ എന്റെ പിതാവു മഹത്വപ്പെടുന്നു; അങ്ങനെ നിങ്ങൾ എന്റെ ശിഷ്യന്മാർ ആകും.
      easy_to_miss: ഫലം കൊമ്പിനുവേണ്ടിയല്ല. മറ്റുള്ളവർക്കു ഭക്ഷിക്കാനാണ് കൊമ്പുകൾ ഫലം കായ്ക്കുന്നത്.
    - verses: യോഹന്നാൻ 15:9–11
      title: എന്റെ സ്നേഹത്തിൽ വസിപ്പിൻ
      text: പിതാവു എന്നെ സ്നേഹിക്കുന്നതുപോലെ ഞാനും നിങ്ങളെ സ്നേഹിക്കുന്നു. എന്റെ കല്പനകൾ പ്രമാണിച്ച് എന്റെ സ്നേഹത്തിൽ വസിപ്പിൻ. എന്റെ സന്തോഷം നിങ്ങളിൽ ഇരിപ്പാനും നിങ്ങളുടെ സന്തോഷം പൂർണ്ണമാകുവാനും ഞാൻ ഇതു നിങ്ങളോടു സംസാരിച്ചിരിക്കുന്നു.
      easy_to_miss: യോഹന്നാൻ 17-ലെന്നപോലെ, തന്നെ ഒറ്റിക്കൊടുക്കുന്ന രാത്രിയിലാണ് യേശു സന്തോഷത്തെക്കുറിച്ചു പറയുന്നത്.
    - verses: യോഹന്നാൻ 15:12–14
      title: സ്നേഹിതന്മാർ
      text: ഞാൻ നിങ്ങളെ സ്നേഹിച്ചിരിക്കുന്നതുപോലെ നിങ്ങളും തമ്മിൽ തമ്മിൽ സ്നേഹിക്കേണം എന്നാകുന്നു എന്റെ കല്പന. സ്നേഹിതന്മാർക്കുവേണ്ടി ജീവനെ കൊടുക്കുന്നതിലും അധികമുള്ള സ്നേഹം ആർക്കും ഇല്ല. ഞാൻ നിങ്ങളോടു കല്പിക്കുന്നതു ചെയ്താൽ നിങ്ങൾ എന്റെ സ്നേഹിതന്മാർ തന്നേ.
      easy_to_miss: യേശു തന്റെ ശിഷ്യന്മാരെ ദാസന്മാർ എന്നല്ല, സ്നേഹിതന്മാർ എന്നു വിളിക്കുന്നു (15-ാം വാക്യം). ദൈവത്തോടുള്ള സ്നേഹബന്ധമാണ് ആത്മാവിന്റെ ഫലം.
    people:
    - name: അപ്പൊസ്തലന്മാർ
      role: ആത്മാവു വന്ന പെന്തിക്കോസ്തി നാളിൽ യെരൂശലേമിൽ കൂടിയിരുന്നവർ.
      name_meaning: “അയക്കപ്പെട്ടവർ”
      ml: The apostles
    - name: തീർത്ഥാടകർ
      role: പെരുന്നാളിനു യെരൂശലേമിൽ വന്ന, സകലജാതികളിൽനിന്നുമുള്ള യെഹൂദന്മാർ; അപ്പൊസ്തലന്മാർ സംസാരിക്കുന്നതു സ്വന്തം ഭാഷകളിൽ അവർ കേൾക്കുന്നു.
      name_meaning: —
      ml: The pilgrims
    phrases:
    - term: പെന്തിക്കോസ്തി
      explanation: ‘അമ്പതാമത്തേത്’ എന്നതിന്റെ ഗ്രീക്ക്. പെസഹയ്ക്ക് അമ്പതു ദിവസത്തിനു ശേഷമുള്ള യെഹൂദന്മാരുടെ കൊയ്ത്തുപെരുന്നാൾ; അന്നാണ് ആത്മാവു വന്നത്.
    - term: മുട്ടുകുത്തൽ ശുശ്രൂഷ
      explanation: പെന്തിക്കോസ്തി നാളിൽ മലങ്കരസഭ പരിശുദ്ധാത്മാവിനായി മുട്ടുകുത്തിയുള്ള പ്രാർത്ഥനയുടെ മൂന്നു ശുശ്രൂഷകൾ നടത്തുന്നു.
    - term: ചെത്തി വെടിപ്പാക്കുക
      explanation: കൂടുതൽ ഫലം കായ്ക്കാൻ മുന്തിരിവള്ളി വെട്ടിയൊരുക്കുക. തന്റെ ജനത്തിൽ ദൈവം ചെയ്യുന്ന വേലയ്ക്കു യേശു ഈ ചിത്രം ഉപയോഗിക്കുന്നു.
    reflection:
      title_en: വൃക്ഷങ്ങളല്ല, കൊമ്പുകൾ
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ഇന്നു സഭ രണ്ടു ചിത്രങ്ങൾ വായിക്കുന്നു. അപ്പൊസ്തലപ്രവൃത്തികളിൽ, ആത്മാവു ചീറ്റുന്ന കാറ്റുപോലെയും തീനാവുകൾപോലെയും വരുന്നു; ഭയന്നിരുന്ന ശിഷ്യന്മാർ ധൈര്യമുള്ള പ്രസംഗകരാകുന്നു. സുവിശേഷത്തിൽ, യേശു വളരെ ശാന്തമായ ഒരു ചിത്രം നല്കുന്നു: ഒരു മുന്തിരിവള്ളിയും അതിന്റെ കൊമ്പുകളും. രണ്ടും ഒരേ കാര്യത്തെക്കുറിച്ചാണ്. സഭയുടെ ജീവൻ അതിനു പുറത്തുനിന്നു വരുന്നു.

        മുന്തിരിവള്ളിയിൽനിന്നു മുറിച്ചുമാറ്റിയ കൊമ്പ് ഒരു ദിവസത്തേക്കു കുഴപ്പമില്ലാത്തതായി തോന്നാം; പക്ഷേ അത് ഇതിനകം ഉണങ്ങിത്തുടങ്ങിയിരിക്കുന്നു. ചേർന്നുനില്ക്കുന്ന കൊമ്പ് പ്രയാസപ്പെടാതെ ഫലം കായ്ക്കുന്നു. യേശു അതു തുറന്നുപറയുന്നു: എന്നെ പിരിഞ്ഞു നിങ്ങൾക്കു ഒന്നും ചെയ്‌വാൻ കഴികയില്ല. പെന്തിക്കോസ്തിയിൽ പകരപ്പെട്ട ആത്മാവാണ് മുന്തിരിവള്ളിയിൽനിന്നു നമ്മിലേക്ക് ഒഴുകുന്ന ജീവരസം.

        സൺഡേസ്കൂൾ ദിനത്തിൽ, എല്ലാ ആഴ്ചയും ഒരുമിച്ചുകൂടുന്ന കുട്ടികളെയും അദ്ധ്യാപകരെയും നാം ഓർക്കുന്നു. അവർക്കായി നാം ഏറ്റവും ആഗ്രഹിക്കുന്നത്, അവർക്ക് എല്ലാ ഉത്തരങ്ങളും അറിയണമെന്നല്ല, ജീവിതകാലം മുഴുവൻ അവർ ക്രിസ്തുവിനോടു ചേർന്നുനില്ക്കണമെന്നാണ്. പ്രാർത്ഥനയിലൂടെയും കുർബ്ബാനയിലൂടെയും അവനിൽ വസിക്കുന്ന ഒരു സഭയിലൂടെയും അതു ചെയ്യുന്നത് ആത്മാവാണ്.
      title_ml: Branches, not trees
    week:
      question: ആഴ്ചയിൽ യേശുവിനോടു ചേർന്നുനില്ക്കാൻ നിങ്ങളെ സഹായിക്കുന്നത് എന്താണ്? നിങ്ങളെ അകറ്റുന്നത് എന്താണ്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച ഒരു സൺഡേസ്കൂൾ അദ്ധ്യാപകനോടു നന്ദി പറയുക; കുട്ടികൾ എന്താണ് പഠിക്കുന്നതെന്ന് അവരോടു ചോദിക്കുക.
      prayer: പരിശുദ്ധാത്മാവേ, എഴുന്നള്ളിവരേണമേ. സാക്ഷാൽ മുന്തിരിവള്ളിയായ ക്രിസ്തുവിനോടു ഞങ്ങളെ ചേർത്തുനിർത്തേണമേ; ഞങ്ങളിൽ ഉണങ്ങിപ്പോയതു ചെത്തിമാറ്റേണമേ; ഞങ്ങളുടെ വീട്ടിലും സഭയിലും നിലനില്ക്കുന്ന ഫലം, സ്നേഹവും സന്തോഷവും സമാധാനവും, കായ്ക്കുമാറാക്കേണമേ. ആമേൻ.
