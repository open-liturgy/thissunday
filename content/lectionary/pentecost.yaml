phrases:
- term: Pentecost
  explanation: Greek for “fiftieth”. The Jewish harvest feast fifty days after Passover, when the Spirit came.
- term: Kneeling services
  explanation: On Pentecost the Malankara Church holds three services of kneeling prayer for the Holy Spirit.
- term: Pruning
  explanation: Cutting back a vine so it bears more fruit. Jesus uses it for God’s work in his people.
reflection:
  title_en: Branches, not trees
  title_ml: വൃക്ഷങ്ങളല്ല, കൊമ്പുകൾ
  read_time: A three-minute read
  body: |-
    The Church reads two pictures today. In Acts, the Spirit comes like a rushing wind and tongues of fire, and frightened disciples become bold preachers. In the Gospel, Jesus gives a much quieter picture: a vine and its branches. Both are about the same thing. The life of the Church comes from outside itself.

    A branch cut off from the vine may look fine for a day, but it is already dying. A branch that stays connected bears fruit without straining. Jesus says it bluntly: apart from me you can do nothing. The Spirit poured out at Pentecost is the sap that runs from the vine into us.

    On Sunday School Day we think of the children and teachers who meet every week. What we most want for them is not that they know all the answers, but that they stay connected to Christ for life. That is the work of the Spirit, through prayer, the Qurbana and a Church that remains in him.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What helps you stay connected to Jesus during the week? What tends to cut you off?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Thank a Sunday School teacher this week, and ask the children what they are learning.
  prayer: 'Come, Holy Spirit. Keep us joined to Christ the true vine, prune what is dead in us, and let us bear fruit that lasts: love, joy and peace in our home and our Church. Amen.'
