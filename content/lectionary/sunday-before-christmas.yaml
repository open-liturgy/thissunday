phrases:
- term: Genealogy
  explanation: A family tree. Jewish families kept them carefully, and they mattered for inheritance and for priests.
- term: As was supposed
  explanation: Luke’s way of saying that people thought Jesus was Joseph’s son, while the reader knows otherwise.
- term: Son of God
  explanation: Luke places this list right after the baptism, where the Father says “You are my beloved Son” (Luke 3:22).
reflection:
  title_en: Every name counted
  title_ml: '[TITLE ML]'
  read_time: A three-minute read
  body: |-
    It is tempting to skip a genealogy. It is a long list of names, many hard to pronounce, most of them people we know nothing about. Yet the Church reads one on the Sunday before Christmas, and Luke places it at the very start of Jesus’ work. The list is telling us something.

    It says that the Son of God did not drop into the world from nowhere. He was born into a family with a long and complicated history: kings and nobodies, exiles and foreigners, faithful people and failures. Luke takes the line all the way back to Adam, so that no one can say Jesus belongs only to one people.

    Every family has a list like this, even if nobody has written it down. There are grandparents we remember and great-grandparents we never knew. Christmas tells us that God came into a family like ours. He knows every name on the list, including the ones we have forgotten.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: How far back can we name our own family? Who is the oldest ancestor anyone at the table knows about?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Before Christmas, ask a grandparent or older relative to tell you about their parents, and write down the names.
  prayer: Lord Jesus, you were born into a family with a long history. Remember all our ancestors, those we know and those we have forgotten, and make us faithful in our generation. Amen.
