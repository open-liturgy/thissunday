one_minute:
  what_happens: Luke lists the ancestors of Jesus, from Joseph back through David, Abraham and Noah to Adam, and ends by calling Adam the son of God.
  why_this_sunday: Before the birth itself, the Church reads who Jesus is born from. Christmas happens inside a long family history.
  take_with_you: Most names in this list did nothing anyone remembers. God still counted every one.
readings_thread: Genesis lists Jacob’s family going down to Egypt, and Kings and Isaiah promise a king from David’s line. Paul says the promise to Abraham was for all his children by faith, and Matthew gives his own family tree the evening before.
key_verse:
  ref: Luke 3:38
  ml: കയിനാൻ എനോശിന്റെ മകൻ, എനോശ് ശേത്തിന്റെ മകൻ, ശേത്ത് ആദാമിന്റെ മകൻ, ആദാം ദൈവത്തിന്റെ മകൻ.
  ml_translation: Sathyavedapusthakam, 1910
  en: the son of Enos, the son of Seth, the son of Adam, the son of God.
  en_translation: World English Bible
scenes:
- verses: Luke 3:23
  title: About thirty years old
  text: Jesus begins his work at about thirty. People suppose he is Joseph’s son, and Luke begins the list there.
  easy_to_miss: “As was supposed” is Luke’s quiet reminder that Jesus’ true Father is God.
- verses: Luke 3:24–27
  title: Names nobody remembers
  text: The list climbs back through generations most readers have never heard of, to Zerubbabel and Shealtiel, who lived around the exile in Babylon.
  easy_to_miss: Zerubbabel led the return from exile and rebuilt the Temple. The family of Jesus passed through the darkest time in Israel’s history.
- verses: Luke 3:28–31
  title: Through Nathan to David
  text: Luke traces the line back to David, through David’s son Nathan.
  easy_to_miss: Matthew’s list goes through Solomon. Luke’s goes through Nathan, a son of David otherwise almost unknown.
- verses: Luke 3:31–34
  title: From David to Abraham
  text: Jesse, Obed, Boaz, and on to Judah, Jacob, Isaac and Abraham.
  easy_to_miss: Boaz is the husband of Ruth, a foreigner from Moab, whose story was read on Parents’ Day.
- verses: Luke 3:34–38
  title: Son of Adam, son of God
  text: 'The list goes past Abraham, past Noah and Enoch, to Seth and Adam, and ends: “the son of God.”'
  easy_to_miss: Matthew starts with Abraham, father of Israel. Luke goes back to Adam, father of everyone. Jesus belongs to the whole human race.
people:
- name: Adam
  ml: ആദാം
  role: The first man. Luke’s list ends with him.
  name_meaning: “Human”, from the word for earth
- name: Abraham
  ml: അബ്രാഹാം
  role: The father of Israel, to whom God promised a blessing for all nations.
  name_meaning: “Father of many”
- name: David
  ml: ദാവീദ്
  role: The shepherd king, promised a son whose throne would last for ever.
  name_meaning: “Beloved”
phrases:
- term: Genealogy
  explanation: A family tree. Jewish families kept them carefully, and they mattered for inheritance and for priests.
- term: As was supposed
  explanation: Luke’s way of saying that people thought Jesus was Joseph’s son, while the reader knows otherwise.
- term: Son of God
  explanation: Luke places this list right after the baptism, where the Father says “You are my beloved Son” (Luke 3:22).
reflection:
  title_en: Every name counted
  title_ml: ഓരോ പേരും എണ്ണപ്പെട്ടിരിക്കുന്നു
  read_time: A three-minute read
  body: |-
    It is tempting to skip a genealogy. It is a long list of names, many hard to pronounce, most of them people we know nothing about. Yet the Church reads one on the Sunday before Christmas, and Luke places it at the very start of Jesus’ work. The list is telling us something.

    It says that the Son of God did not drop into the world from nowhere. He was born into a family with a long and complicated history: kings and nobodies, exiles and foreigners, faithful people and failures. Luke takes the line all the way back to Adam, so that no one can say Jesus belongs only to one people.

    Every family has a list like this, even if nobody has written it down. There are grandparents we remember and great-grandparents we never knew. Christmas tells us that God came into a family like ours. He knows every name on the list, including the ones we have forgotten.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: How far back can we name our own family? Who is the oldest ancestor anyone at the table knows about?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Before Christmas, ask a grandparent or older relative to tell you about their parents, and write down the names.
  prayer: Lord Jesus, you were born into a family with a long history. Remember all our ancestors, those we know and those we have forgotten, and make us faithful in our generation. Amen.
translations:
  ml:
    name:
      en: ജനനപ്പെരുന്നാളിനു മുമ്പുള്ള ഞായർ
      ml: Sunday before Christmas
    season:
      en: സൂബോറോ
      gloss: അറിയിപ്പുകളുടെ കാലം
    tagline: യേശുവിന്റെ വംശാവലി, ആദാം വരെ
    standfirst: ക്രിസ്തുമസിനു മുമ്പുള്ള ഞായറാഴ്ച ഒരു പേരുകളുടെ പട്ടിക വായിക്കുന്നു. ദാവീദിലൂടെയും അബ്രാഹാമിലൂടെയും ആദാം വരെ ലൂക്കൊസ് യേശുവിന്റെ വംശം പിന്നോട്ടു കണ്ടെത്തുന്നു; പിന്നെ ഒരു പടികൂടെ.
    description: ജനനപ്പെരുന്നാളിനു മുമ്പുള്ള ഞായറിലെ വായനകൾ, ലൂക്കൊസ് 3:23–38-ലെ യേശുവിന്റെ വംശാവലി വിശദീകരിച്ചത്, ഒരു ധ്യാനം, കുടുംബത്തിനായി ഒരു ചോദ്യം.
    one_minute:
      what_happens: യോസേഫിൽനിന്നു തുടങ്ങി ദാവീദ്, അബ്രാഹാം, നോഹ എന്നിവരിലൂടെ ആദാം വരെയുള്ള യേശുവിന്റെ പൂർവ്വികരുടെ പട്ടിക ലൂക്കൊസ് നല്കുന്നു; ആദാമിനെ ദൈവത്തിന്റെ മകൻ എന്നു വിളിച്ച് അവസാനിപ്പിക്കുന്നു.
      why_this_sunday: ജനനത്തിനു മുമ്പ്, യേശു ആരിൽനിന്നു ജനിക്കുന്നു എന്നു സഭ വായിക്കുന്നു. ക്രിസ്തുമസ് സംഭവിക്കുന്നത് നീണ്ട ഒരു കുടുംബചരിത്രത്തിനുള്ളിലാണ്.
      take_with_you: ഈ പട്ടികയിലെ മിക്ക പേരുകാരും ആരും ഓർക്കുന്ന ഒന്നും ചെയ്തില്ല. എന്നിട്ടും ദൈവം ഓരോരുത്തരെയും എണ്ണി.
    readings_thread: മിസ്രയീമിലേക്കു പോകുന്ന യാക്കോബിന്റെ കുടുംബത്തിന്റെ പട്ടിക ഉല്പത്തി നല്കുന്നു; ദാവീദിന്റെ വംശത്തിൽനിന്ന് ഒരു രാജാവിനെ രാജാക്കന്മാരും യെശയ്യാവും വാഗ്ദാനം ചെയ്യുന്നു. അബ്രാഹാമിനോടുള്ള വാഗ്ദാനം വിശ്വാസത്താലുള്ള അവന്റെ എല്ലാ മക്കൾക്കുമാണ് എന്ന് പൗലോസ് പറയുന്നു; തലേന്നു വൈകുന്നേരം മത്തായി തന്റെ വംശാവലി നല്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 3:23
      title: ഏകദേശം മുപ്പതു വയസ്സ്
      text: ഏകദേശം മുപ്പതാം വയസ്സിൽ യേശു തന്റെ പ്രവൃത്തി ആരംഭിക്കുന്നു. അവൻ യോസേഫിന്റെ മകൻ എന്നു ജനം വിചാരിക്കുന്നു; ലൂക്കൊസ് പട്ടിക അവിടെനിന്നു തുടങ്ങുന്നു.
      easy_to_miss: “എന്നു ജനം വിചാരിച്ചു” എന്നത് യേശുവിന്റെ യഥാർത്ഥ പിതാവ് ദൈവമാണ് എന്നതിന്റെ ലൂക്കൊസിന്റെ നിശ്ശബ്ദമായ ഓർമ്മപ്പെടുത്തലാണ്.
    - verses: ലൂക്കൊസ് 3:24–27
      title: ആരും ഓർക്കാത്ത പേരുകൾ
      text: മിക്ക വായനക്കാരും കേട്ടിട്ടില്ലാത്ത തലമുറകളിലൂടെ പട്ടിക പിന്നോട്ടു കയറി, ബാബേൽപ്രവാസകാലത്തു ജീവിച്ച സെരുബ്ബാബേലിലും ശെയല്തീയേലിലും എത്തുന്നു.
      easy_to_miss: പ്രവാസത്തിൽനിന്നുള്ള മടക്കം നയിച്ച് ദൈവാലയം പുതുക്കിപ്പണിതത് സെരുബ്ബാബേലാണ്. യിസ്രായേലിന്റെ ചരിത്രത്തിലെ ഏറ്റവും ഇരുണ്ട കാലത്തിലൂടെയാണ് യേശുവിന്റെ കുടുംബം കടന്നുപോയത്.
    - verses: ലൂക്കൊസ് 3:28–31
      title: നാഥാനിലൂടെ ദാവീദിലേക്ക്
      text: ദാവീദിന്റെ മകനായ നാഥാനിലൂടെ ലൂക്കൊസ് വംശം ദാവീദ് വരെ പിന്നോട്ടു കണ്ടെത്തുന്നു.
      easy_to_miss: മത്തായിയുടെ പട്ടിക ശലോമോനിലൂടെയാണ് പോകുന്നത്. ലൂക്കൊസിന്റേത് മറ്റൊരിടത്തും അധികം അറിയപ്പെടാത്ത ദാവീദിന്റെ മകനായ നാഥാനിലൂടെ.
    - verses: ലൂക്കൊസ് 3:31–34
      title: ദാവീദിൽനിന്ന് അബ്രാഹാമിലേക്ക്
      text: യിശ്ശായി, ഓബേദ്, ബോവസ്; പിന്നെ യെഹൂദാ, യാക്കോബ്, യിസ്ഹാക്ക്, അബ്രാഹാം.
      easy_to_miss: മാതാപിതാക്കളുടെ ദിനത്തിൽ കഥ വായിച്ച, മോവാബിൽനിന്നുള്ള വിദേശിയായ രൂത്തിന്റെ ഭർത്താവാണ് ബോവസ്.
    - verses: ലൂക്കൊസ് 3:34–38
      title: ആദാമിന്റെ മകൻ, ദൈവത്തിന്റെ മകൻ
      text: 'പട്ടിക അബ്രാഹാമിനെയും നോഹയെയും ഹാനോക്കിനെയും കടന്ന് ശേത്തിലും ആദാമിലും എത്തി ഇങ്ങനെ അവസാനിക്കുന്നു: “ആദാം ദൈവത്തിന്റെ മകൻ.”'
      easy_to_miss: മത്തായി തുടങ്ങുന്നത് യിസ്രായേലിന്റെ പിതാവായ അബ്രാഹാമിൽനിന്നാണ്. ലൂക്കൊസ് എല്ലാവരുടെയും പിതാവായ ആദാം വരെ പോകുന്നു. യേശു മനുഷ്യവംശത്തിനു മുഴുവനുമുള്ളവനാണ്.
    people:
