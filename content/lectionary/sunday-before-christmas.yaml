    hero_quote:
      text: യേശുവിന്നു താൻ പ്രവൃത്തി ആരംഭിക്കുമ്പോൾ ഏകദേശം മുപ്പതു വയസ്സായിരുന്നു. അവൻ യോസേഫിന്റെ മകൻ എന്നു ജനം വിചാരിച്ചു.
