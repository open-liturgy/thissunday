    - name: അബ്രാഹാം
      role: സകല ജാതികൾക്കും അനുഗ്രഹം ദൈവം വാഗ്ദാനം ചെയ്ത യിസ്രായേലിന്റെ പിതാവ്.
      name_meaning: “ബഹുജാതികളുടെ പിതാവ്”
      ml: Abraham
    - name: ദാവീദ്
      role: സിംഹാസനം എന്നേക്കും നിലനില്ക്കുന്ന ഒരു പുത്രനെ വാഗ്ദാനം ലഭിച്ച ഇടയരാജാവ്.
      name_meaning: “പ്രിയൻ”
      ml: David
    phrases:
    - term: വംശാവലി
      explanation: ഒരു കുടുംബവൃക്ഷം. യെഹൂദകുടുംബങ്ങൾ അവ ശ്രദ്ധയോടെ സൂക്ഷിച്ചിരുന്നു; അവകാശത്തിനും പുരോഹിതന്മാർക്കും അവ പ്രധാനമായിരുന്നു.
    - term: എന്നു ജനം വിചാരിച്ചു
      explanation: യേശു യോസേഫിന്റെ മകനാണെന്ന് ജനം കരുതി, എന്നാൽ വായനക്കാരന് മറിച്ചറിയാം എന്നു പറയുന്ന ലൂക്കൊസിന്റെ രീതി.
    - term: ദൈവത്തിന്റെ മകൻ
      explanation: “നീ എന്റെ പ്രിയപുത്രൻ” എന്നു പിതാവ് പറയുന്ന സ്നാനത്തിനു തൊട്ടുപിന്നാലെയാണ് ലൂക്കൊസ് ഈ പട്ടിക വെക്കുന്നത് (ലൂക്കൊസ് 3:22).
    reflection:
      title_en: ഓരോ പേരും എണ്ണപ്പെട്ടിരിക്കുന്നു
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ഒരു വംശാവലി വായിക്കാതെ വിടാൻ തോന്നുക സ്വാഭാവികമാണ്. പേരുകളുടെ ഒരു നീണ്ട പട്ടിക; പലതും ഉച്ചരിക്കാൻ പ്രയാസം; മിക്കവരെക്കുറിച്ചും നമുക്ക് ഒന്നും അറിയില്ല. എന്നിട്ടും ക്രിസ്തുമസിനു മുമ്പുള്ള ഞായറാഴ്ച സഭ ഒന്നു വായിക്കുന്നു; യേശുവിന്റെ പ്രവൃത്തിയുടെ തുടക്കത്തിൽത്തന്നെ ലൂക്കൊസ് അതു വെക്കുന്നു. ഈ പട്ടിക നമ്മോട് എന്തോ പറയുന്നുണ്ട്.

        ദൈവപുത്രൻ എവിടെനിന്നോ ലോകത്തിലേക്കു വന്നുവീണതല്ല എന്ന് അതു പറയുന്നു. നീണ്ടതും സങ്കീർണ്ണവുമായ ചരിത്രമുള്ള ഒരു കുടുംബത്തിലാണ് അവൻ ജനിച്ചത്: രാജാക്കന്മാരും ആരുമല്ലാത്തവരും, പ്രവാസികളും വിദേശികളും, വിശ്വസ്തരും പരാജയപ്പെട്ടവരും. യേശു ഒരു ജനത്തിനു മാത്രമുള്ളവനാണ് എന്ന് ആർക്കും പറയാൻ കഴിയാത്തവിധം ലൂക്കൊസ് വംശം ആദാം വരെ കൊണ്ടുപോകുന്നു.

        ആരും എഴുതിവെച്ചിട്ടില്ലെങ്കിലും ഓരോ കുടുംബത്തിനും ഇങ്ങനെയൊരു പട്ടികയുണ്ട്. നാം ഓർക്കുന്ന അപ്പാപ്പന്മാരും അമ്മാമ്മമാരും, നാം ഒരിക്കലും അറിഞ്ഞിട്ടില്ലാത്ത അവരുടെ മാതാപിതാക്കളും. നമ്മുടേതുപോലെയുള്ള ഒരു കുടുംബത്തിലേക്കാണ് ദൈവം വന്നത് എന്ന് ക്രിസ്തുമസ് പറയുന്നു. നാം മറന്നുപോയവ ഉൾപ്പെടെ, പട്ടികയിലെ ഓരോ പേരും അവന് അറിയാം.
      title_ml: Every name counted
    week:
      question: നമ്മുടെ കുടുംബത്തിൽ എത്ര തലമുറ പിന്നോട്ടു പേരു പറയാൻ നമുക്കു കഴിയും? മേശയ്ക്കരികിൽ ആർക്കെങ്കിലും അറിയാവുന്ന ഏറ്റവും പഴയ പൂർവ്വികൻ ആരാണ്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ക്രിസ്തുമസിനു മുമ്പ്, ഒരു അപ്പാപ്പനോടോ അമ്മാമ്മയോടോ പ്രായമുള്ള ഒരു ബന്ധുവിനോടോ അവരുടെ മാതാപിതാക്കളെക്കുറിച്ചു പറയാൻ ആവശ്യപ്പെട്ട്, ആ പേരുകൾ എഴുതിവെക്കുക.
      prayer: കർത്താവായ യേശുവേ, നീണ്ട ചരിത്രമുള്ള ഒരു കുടുംബത്തിൽ നീ ജനിച്ചു. ഞങ്ങൾ അറിയുന്നവരും മറന്നുപോയവരുമായ ഞങ്ങളുടെ എല്ലാ പൂർവ്വികരെയും ഓർക്കേണമേ; ഞങ്ങളുടെ തലമുറയിൽ ഞങ്ങളെ വിശ്വസ്തരാക്കേണമേ. ആമേൻ.
