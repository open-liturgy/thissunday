one_minute:
  what_happens: 'After John is arrested, Jesus settles in Capernaum and begins to preach: repent, for the kingdom of heaven is near. Walking by the Sea of Galilee, he calls Peter and Andrew, then James and John, and they leave everything to follow him.'
  why_this_sunday: At Denha the Church celebrated the baptism of Jesus. The Sundays after it follow what he did next, starting with the first light in Galilee.
  take_with_you: Jesus called fishermen at work, in the middle of an ordinary day. The call usually comes where we already are.
readings_thread: Jacob and Esau struggle from birth, and Naaman is healed by washing in the Jordan. Isaiah promises a light to the nations. Peter tells the crowd at Pentecost to repent and be baptised, and Ephesians says we were chosen in Christ.
key_verse:
  ref: Matthew 4:19
  ml: എന്റെ പിന്നാലെ വരുവിൻ; ഞാൻ നിങ്ങളെ മനുഷ്യരെ പിടിക്കുന്നവരാക്കും എന്നു അവരോടു പറഞ്ഞു.
  ml_translation: Sathyavedapusthakam, 1910
  en: He said to them, “Come after me, and I will make you fishers for men.”
  en_translation: World English Bible
scenes:
- verses: Matthew 4:12–13
  title: Moving to Capernaum
  text: When Jesus hears that John has been arrested, he leaves Nazareth and settles in Capernaum, a fishing town on the shore of the Sea of Galilee.
  easy_to_miss: Jesus starts preaching just as John is silenced. The voice in the wilderness hands over to the Word.
- verses: Matthew 4:14–16
  title: Light in Galilee of the nations
  text: 'Matthew quotes Isaiah: the people who sat in darkness have seen a great light.'
  easy_to_miss: Zebulun and Naphtali were the first tribes taken into exile by Assyria (Isaiah 9:1). The first to fall into darkness are the first to see the light.
- verses: Matthew 4:17
  title: The kingdom is near
  text: 'From then on Jesus preaches: repent, for the kingdom of heaven is at hand.'
  easy_to_miss: These are exactly John the Baptist’s words in Matthew 3:2. Jesus takes up the message where John left it.
- verses: Matthew 4:18–20
  title: Fishers for people
  text: Jesus sees Simon Peter and Andrew casting a net. Come after me, he says, and I will make you fishers for people. They leave their nets at once.
  easy_to_miss: Jesus does not ask them to stop being fishermen. He tells them what they will now fish for.
- verses: Matthew 4:21–22
  title: Leaving the boat and their father
  text: Further on he sees James and John mending nets in a boat with their father Zebedee. He calls them, and they leave the boat and their father and follow him.
  easy_to_miss: The first pair leave their nets; the second pair leave their father too. Matthew shows the cost rising.
people:
- name: Peter and Andrew
  ml: പത്രൊസും അന്ത്രെയാസും
  role: Brothers from Bethsaida who fished on the Sea of Galilee.
  name_meaning: Andrew means “manly”
- name: James and John
  ml: യാക്കോബും യോഹന്നാനും
  role: Sons of Zebedee, partners in a family fishing business.
  name_meaning: James is Jacob, “he grasps the heel”
- name: Zebedee
  ml: സെബെദി
  role: Their father, left in the boat with the hired men.
  name_meaning: “Gift of the Lord”
phrases:
- term: Repent
  explanation: 'The Greek word means a change of mind and direction: turning round, not only feeling sorry.'
- term: Kingdom of heaven
  explanation: Matthew’s usual phrase for the kingdom of God. Many Jews avoided saying God’s name out of reverence.
- term: Denha
  explanation: Syriac for “dawn” or “rising”. The feast of Jesus’ baptism on 6 January, also called Epiphany.
reflection:
  title_en: Called in the middle of the day
  title_ml: പകൽ ജോലിക്കിടയിലെ വിളി
  read_time: A three-minute read
  body: |-
    Peter and Andrew are not praying when Jesus finds them. They are working, throwing a net into the lake as they did every day. James and John are mending torn nets with their father. Nothing about the scene is religious, and that is exactly where the call comes.

    Jesus does not take away what they know. They were fishermen and they will still be fishers, now of people. Everything they learned about patience, weather, teamwork and hauling in a heavy net will be put to new use. Following him changes the direction of a life without wasting what came before.

    Most of us will not leave our jobs or families. But the call still comes in ordinary places: an office, a classroom, a kitchen. The question is whether we hear it there and let it change what we are working for. The first disciples answered at once. We can at least answer this week.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What are you good at, and how could that skill be used for God?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Use one thing you are good at to help someone this week, at school, at work or at church.
  prayer: Lord Jesus, you called fishermen at their nets. Call us where we are, in our work and our homes, and make us ready to follow you at once. Amen.
translations:
  ml:
    name:
      en: ദനഹായ്ക്കു ശേഷം ഒന്നാം ഞായർ
      ml: First Sunday after Denha
    season:
      en: ദനഹാ
      gloss: ദനഹാക്കാലം
    tagline: ഗലീലയിൽ വലിയൊരു വെളിച്ചം; ആദ്യത്തെ നാലു ശിഷ്യന്മാർ
    standfirst: യോഹന്നാൻ തടവിലായിരിക്കുന്നു. യേശു ഒരു തടാകതീരപട്ടണത്തിലേക്കു താമസം മാറ്റി, പ്രസംഗിച്ചു തുടങ്ങി, രണ്ടു ജോടി സഹോദരന്മാരെ അവരുടെ വലകളിൽനിന്നു വിളിക്കുന്നു.
    description: 'ദനഹായ്ക്കു ശേഷം ഒന്നാം ഞായറിലെ വായനകൾ, മത്തായി 4:12–22 വിശദീകരിച്ചത്: ഗലീലയിലെ വലിയ വെളിച്ചവും ആദ്യശിഷ്യന്മാരും. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: 'യോഹന്നാൻ തടവിലായശേഷം യേശു കഫർന്നഹൂമിൽ പാർത്ത് പ്രസംഗിച്ചു തുടങ്ങുന്നു: സ്വർഗ്ഗരാജ്യം സമീപിച്ചിരിക്കയാൽ മാനസാന്തരപ്പെടുവിൻ. ഗലീലക്കടല്ക്കരയിൽ നടക്കുമ്പോൾ അവൻ പത്രൊസിനെയും അന്ത്രെയാസിനെയും, പിന്നെ യാക്കോബിനെയും യോഹന്നാനെയും വിളിക്കുന്നു; അവർ എല്ലാം വിട്ട് അവനെ അനുഗമിക്കുന്നു.'
      why_this_sunday: ദനഹായിൽ സഭ യേശുവിന്റെ മാമോദീസ ആഘോഷിച്ചു. അതിനുശേഷമുള്ള ഞായറാഴ്ചകൾ അവൻ പിന്നെ ചെയ്തതു പിന്തുടരുന്നു; ഗലീലയിലെ ആദ്യവെളിച്ചത്തിൽനിന്നു തുടങ്ങി.
      take_with_you: ഒരു സാധാരണ ദിവസത്തിന്റെ നടുവിൽ, ജോലി ചെയ്തുകൊണ്ടിരുന്ന മീൻപിടുത്തക്കാരെയാണ് യേശു വിളിച്ചത്. വിളി സാധാരണ വരുന്നത് നാം ഇപ്പോൾ ആയിരിക്കുന്നിടത്താണ്.
    readings_thread: യാക്കോബും ഏശാവും ജനനംമുതൽ മല്ലിടുന്നു; യോർദ്ദാനിൽ കുളിച്ച് നയമാൻ സൌഖ്യം പ്രാപിക്കുന്നു. ജാതികൾക്ക് ഒരു വെളിച്ചം യെശയ്യാവ് വാഗ്ദാനം ചെയ്യുന്നു. മാനസാന്തരപ്പെട്ടു സ്നാനം ഏല്ക്കാൻ പെന്തിക്കോസ്തിൽ പത്രൊസ് പുരുഷാരത്തോടു പറയുന്നു; നാം ക്രിസ്തുവിൽ തിരഞ്ഞെടുക്കപ്പെട്ടു എന്ന് എഫെസ്യലേഖനം പറയുന്നു.
    scenes:
    - verses: മത്തായി 4:12–13
      title: കഫർന്നഹൂമിലേക്ക്
      text: യോഹന്നാൻ തടവിലായി എന്നു കേട്ടപ്പോൾ യേശു നസറെത്ത് വിട്ട്, ഗലീലക്കടലിന്റെ തീരത്തുള്ള മീൻപിടുത്തപട്ടണമായ കഫർന്നഹൂമിൽ ചെന്നു പാർക്കുന്നു.
      easy_to_miss: യോഹന്നാൻ നിശ്ശബ്ദനാക്കപ്പെടുമ്പോൾത്തന്നെ യേശു പ്രസംഗിച്ചു തുടങ്ങുന്നു. മരുഭൂമിയിലെ ശബ്ദം വചനത്തിനു വഴി മാറുന്നു.
    - verses: മത്തായി 4:14–16
      title: ജാതികളുടെ ഗലീലയിൽ വെളിച്ചം
      text: 'മത്തായി യെശയ്യാവിനെ ഉദ്ധരിക്കുന്നു: ഇരുട്ടിൽ ഇരിക്കുന്ന ജനം വലിയോരു വെളിച്ചം കണ്ടു.'
      easy_to_miss: അശ്ശൂർ ആദ്യം പ്രവാസത്തിലേക്കു കൊണ്ടുപോയ ഗോത്രങ്ങളായിരുന്നു സെബൂലൂനും നഫ്താലിയും (യെശയ്യാവ് 9:1). ആദ്യം ഇരുളിൽ വീണവർ ആദ്യം വെളിച്ചം കാണുന്നു.
    - verses: മത്തായി 4:17
      title: രാജ്യം സമീപിച്ചിരിക്കുന്നു
      text: 'അന്നുമുതൽ യേശു പ്രസംഗിക്കുന്നു: സ്വർഗ്ഗരാജ്യം സമീപിച്ചിരിക്കയാൽ മാനസാന്തരപ്പെടുവിൻ.'
      easy_to_miss: മത്തായി 3:2-ൽ യോഹന്നാൻ സ്നാപകൻ പറഞ്ഞ അതേ വാക്കുകളാണിവ. യോഹന്നാൻ നിർത്തിയിടത്തുനിന്ന് യേശു സന്ദേശം ഏറ്റെടുക്കുന്നു.
    - verses: മത്തായി 4:18–20
      title: മനുഷ്യരെ പിടിക്കുന്നവർ
      text: ശിമോൻ പത്രൊസും അന്ത്രെയാസും വല വീശുന്നത് യേശു കാണുന്നു. എന്റെ പിന്നാലെ വരുവിൻ; ഞാൻ നിങ്ങളെ മനുഷ്യരെ പിടിക്കുന്നവരാക്കും എന്ന് അവൻ പറയുന്നു. ഉടനെ അവർ വല വിട്ടു.
      easy_to_miss: മീൻപിടുത്തക്കാരായിരിക്കുന്നതു നിർത്താൻ യേശു അവരോടു പറയുന്നില്ല. ഇനി അവർ എന്തിനെയാണ് പിടിക്കുക എന്ന് അവൻ പറയുന്നു.
    - verses: മത്തായി 4:21–22
      title: പടകും അപ്പനെയും വിട്ട്
      text: കുറെ മുന്നോട്ടു ചെന്നപ്പോൾ യാക്കോബും യോഹന്നാനും അപ്പനായ സെബെദിയോടുകൂടെ പടകിൽ വല നന്നാക്കുന്നത് അവൻ കാണുന്നു. അവൻ അവരെ വിളിക്കുന്നു; അവർ പടകും അപ്പനെയും വിട്ട് അവനെ അനുഗമിക്കുന്നു.
      easy_to_miss: ആദ്യജോടി വല വിടുന്നു; രണ്ടാമത്തെ ജോടി അപ്പനെയും വിടുന്നു. വില ഉയരുന്നതായി മത്തായി കാണിക്കുന്നു.
    people:
    - name: പത്രൊസും അന്ത്രെയാസും
      role: ഗലീലക്കടലിൽ മീൻ പിടിച്ചിരുന്ന ബേത്ത്സയിദക്കാരായ സഹോദരന്മാർ.
      name_meaning: അന്ത്രെയാസ് എന്നാൽ “പൌരുഷമുള്ളവൻ”
      ml: Peter and Andrew
    - name: യാക്കോബും യോഹന്നാനും
      role: കുടുംബമായി നടത്തിയിരുന്ന മീൻപിടുത്തത്തിൽ പങ്കാളികളായ സെബെദിയുടെ മക്കൾ.
      name_meaning: യാക്കോബ് എന്നാൽ “കുതികാൽ പിടിക്കുന്നവൻ”
      ml: James and John
    - name: സെബെദി
      role: കൂലിക്കാരോടുകൂടെ പടകിൽ ശേഷിച്ച അവരുടെ അപ്പൻ.
      name_meaning: “കർത്താവിന്റെ ദാനം”
      ml: Zebedee
    phrases:
    - term: മാനസാന്തരം
      explanation: 'മനസ്സിന്റെയും ദിശയുടെയും മാറ്റം എന്നാണ് ഗ്രീക്കുവാക്കിന്റെ അർത്ഥം: ദുഃഖം തോന്നുന്നതു മാത്രമല്ല, തിരിഞ്ഞുനടക്കുന്നതും.'
    - term: സ്വർഗ്ഗരാജ്യം
      explanation: ദൈവരാജ്യത്തിന് മത്തായി സാധാരണ ഉപയോഗിക്കുന്ന പ്രയോഗം. ഭക്തിനിമിത്തം പല യെഹൂദന്മാരും ദൈവത്തിന്റെ നാമം ഉച്ചരിക്കാതിരുന്നു.
    - term: ദനഹാ
      explanation: “ഉദയം” അഥവാ “പ്രകാശനം” എന്നർത്ഥമുള്ള സുറിയാനി വാക്ക്. ജനുവരി 6-ലെ യേശുവിന്റെ മാമോദീസയുടെ പെരുന്നാൾ; പ്രത്യക്ഷതയുടെ പെരുന്നാൾ എന്നും വിളിക്കുന്നു.
    reflection:
      title_en: പകൽ ജോലിക്കിടയിലെ വിളി
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        യേശു അവരെ കണ്ടെത്തുമ്പോൾ പത്രൊസും അന്ത്രെയാസും പ്രാർത്ഥിക്കുകയല്ല. എല്ലാ ദിവസത്തെയുംപോലെ തടാകത്തിൽ വല വീശി അവർ ജോലി ചെയ്യുകയാണ്. യാക്കോബും യോഹന്നാനും അപ്പനോടുകൂടെ കീറിയ വലകൾ നന്നാക്കുന്നു. ആ രംഗത്തിൽ മതപരമായി ഒന്നുമില്ല; അവിടെത്തന്നെയാണ് വിളി വരുന്നത്.

        അവർക്ക് അറിയാവുന്നത് യേശു എടുത്തുകളയുന്നില്ല. അവർ മീൻപിടുത്തക്കാരായിരുന്നു; ഇനിയും അവർ പിടിക്കുന്നവരായിരിക്കും, ഇനി മനുഷ്യരെ. ക്ഷമ, കാലാവസ്ഥ, കൂട്ടായ്മ, ഭാരമുള്ള വല വലിച്ചുകയറ്റൽ എന്നിവയെക്കുറിച്ച് അവർ പഠിച്ചതെല്ലാം പുതിയ ഉപയോഗത്തിനു വരും. അവനെ അനുഗമിക്കുന്നത് മുമ്പുണ്ടായിരുന്നതൊന്നും പാഴാക്കാതെ ഒരു ജീവിതത്തിന്റെ ദിശ മാറ്റുന്നു.

        നമ്മിൽ മിക്കവരും ജോലിയോ കുടുംബമോ ഉപേക്ഷിക്കാൻ പോകുന്നില്ല. എന്നാൽ വിളി ഇന്നും സാധാരണ സ്ഥലങ്ങളിൽ വരുന്നു: ഒരു ഓഫീസിൽ, ഒരു ക്ലാസ്സുമുറിയിൽ, ഒരു അടുക്കളയിൽ. അവിടെവെച്ച് നാം അതു കേൾക്കുമോ, നാം എന്തിനുവേണ്ടി അദ്ധ്വാനിക്കുന്നു എന്നതിനെ മാറ്റാൻ അതിനെ അനുവദിക്കുമോ എന്നതാണ് ചോദ്യം. ആദ്യശിഷ്യന്മാർ ഉടനെ ഉത്തരം നല്കി. നമുക്ക് ഈ ആഴ്ചയെങ്കിലും ഉത്തരം നല്കാം.
      title_ml: Called in the middle of the day
    week:
      question: നിങ്ങൾക്ക് എന്തിലാണ് മിടുക്ക്? ആ കഴിവ് ദൈവത്തിനുവേണ്ടി എങ്ങനെ ഉപയോഗിക്കാം?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: നിങ്ങൾക്കു മിടുക്കുള്ള ഒരു കാര്യം ഉപയോഗിച്ച് ഈ ആഴ്ച സ്കൂളിലോ ജോലിസ്ഥലത്തോ പള്ളിയിലോ ഒരാളെ സഹായിക്കുക.
      prayer: കർത്താവായ യേശുവേ, വലകൾക്കരികെ നീ മീൻപിടുത്തക്കാരെ വിളിച്ചു. ഞങ്ങളുടെ ജോലിയിലും ഭവനങ്ങളിലും, ഞങ്ങൾ ആയിരിക്കുന്നിടത്ത് ഞങ്ങളെ വിളിക്കേണമേ; ഉടനെ നിന്നെ അനുഗമിക്കാൻ ഞങ്ങളെ ഒരുക്കേണമേ. ആമേൻ.
