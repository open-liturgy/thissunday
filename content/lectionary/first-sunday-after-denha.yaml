    ml: ഉല്പത്തി 25:19–34; 30:36–31:2
    note: Jacob and Esau struggle from birth; Esau sells his birthright.
    printed: Genesis 25:19-34, 30:36-31:2
  - kind: Old Testament
    kind_ml: പഴയനിയമം
