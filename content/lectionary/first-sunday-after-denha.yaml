sunday_slug: first-sunday-after-denha
is_sunday: true
name:
  en: First Sunday after Denha
  ml: ദനഹായ്ക്കു ശേഷം ഒന്നാം ഞായർ
title_as_printed: First Sunday after Baptism of our Lord
season:
  en: Denha
  gloss: The Epiphany season
  syr: ܕܢܚܐ
tagline: A great light in Galilee, and the first four disciples
standfirst: John has been arrested. Jesus moves to a lakeside town, starts preaching and calls two pairs of brothers away from their fishing nets.
description: 'Readings for the First Sunday after Denha, with Matthew 4:12–22 explained: a great light in Galilee and the first disciples. Reflection and question.'
hero_quote:
  text: The people who sat in darkness saw a great light, to those who sat in the region and shadow of death, to them light has dawned.
  ref: Matthew 4:16
