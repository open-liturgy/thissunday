    hero_quote:
      text: ഇങ്ങനെ ഇരുട്ടിൽ ഇരിക്കുന്ന ജനം വലിയോരു വെളിച്ചം കണ്ടു; മരണത്തിന്റെ ദേശത്തിലും നിഴലിലും ഇരിക്കുന്നവർക്കു പ്രകാശം ഉദിച്ചു.
