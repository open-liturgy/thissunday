one_minute:
  what_happens: 'Jesus prays to the Father for his disciples: that they may have his joy, be kept from evil while they remain in the world, and be made holy in the truth. Then he prays for all future believers, that they may be one and see his glory.'
  why_this_sunday: Between the Ascension and Pentecost the Church waits and prays. It reads Jesus’ own prayer for his Church, and also remembers the monks who give their lives to prayer.
  take_with_you: 'Before he died, Jesus prayed for you by name in every way that mattered: “those who will believe in me through their word”.'
readings_thread: Leviticus describes the Sabbath year when the land rests, and Joshua is told to be strong and courageous. Acts mentions Philip’s four daughters who prophesied. Paul writes about giving one’s life undivided to the Lord.
key_verse:
  ref: John 17:21
  ml: നീ എന്നെ അയച്ചിരിക്കുന്നു എന്നു ലോകം വിശ്വസിപ്പാൻ അവർ എല്ലാവരും ഒന്നാകേണ്ടതിന്നു, പിതാവേ, നീ എന്നിലും ഞാൻ നിന്നിലും ആകുന്നതുപോലെ അവരും നമ്മിൽ ആകേണ്ടതിന്നു തന്നേ.
  ml_translation: Sathyavedapusthakam, 1910
  en: that they may all be one; even as you, Father, are in me, and I in you, that they also may be one in us; that the world may believe that you sent me.
  en_translation: World English Bible
scenes:
- verses: John 17:13–14
  title: That they may have my joy
  text: Now I am coming to you, Jesus prays, and I say these things so that they may have my joy complete in them. The world has hated them, because they are not of the world.
  easy_to_miss: Jesus prays for joy on the night of his arrest. Joy is not the same as an easy life.
- verses: John 17:15–16
  title: Not out of the world
  text: I do not ask you to take them out of the world, but to keep them from the evil one. They are not of the world, as I am not.
  easy_to_miss: Even the monks remembered today are not taken out of the world. They pray for it from inside.
- verses: John 17:17–19
  title: Sanctify them
  text: Make them holy in the truth; your word is truth. As you sent me into the world, I send them. For them I sanctify myself.
  easy_to_miss: “Sanctify” is the word at the root of Koodosh Eetho, the first Sunday of the year. The year that began with it now returns to it.
- verses: John 17:20–23
  title: That they may all be one
  text: I pray not only for these, but for those who will believe through their word, that they may all be one, as you, Father, are in me and I in you, so the world may believe you sent me.
  easy_to_miss: Jesus links unity directly with mission. A divided Church makes it harder for the world to believe.
- verses: John 17:24–26
  title: Where I am
  text: Father, I want those you have given me to be with me where I am, to see my glory. I have made your name known, so that the love you have for me may be in them.
  easy_to_miss: The last thing Jesus asks for in this prayer is that the Father’s love may live in us.
