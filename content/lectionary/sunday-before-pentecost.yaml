tagline: Jesus prays for his friends, and for us
standfirst: On the night before he dies, Jesus prays aloud for his disciples. Then he prays for everyone who will believe through them, which includes every reader of this page.
description: Readings for the Sunday before Pentecost, with John 17:13–26, Jesus’ prayer for his disciples and for unity, explained. Reflection and question.
