  name_meaning: —
phrases:
- term: High Priestly Prayer
  explanation: A traditional name for John 17, where Jesus intercedes for his people like a priest.
- term: The world
  explanation: In John, both the people God loves (John 3:16) and the human order that rejects him.
- term: Sunday of the Monks
  explanation: On this Sunday the Church remembers those who have given their lives to prayer in monasteries and dayaras.
reflection:
  title_en: Jesus prays for us
  title_ml: യേശു നമുക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നു
  read_time: A three-minute read
  body: |-
    It is moving to overhear someone pray for you. A grandmother at night, a parent at a bedside, a friend in hospital. In John 17 we overhear Jesus praying, and at verse 20 he turns to us: not only for these, but for those who will believe through their word. That is every Christian since.

    What does he ask for? Not that we be taken out of the world, but kept from evil within it. That we be made holy by the truth. That we be one, as he and the Father are one. That we see his glory and know the Father’s love. It is a prayer for a Church that is united, holy and full of love.

    Our Church today is not always that. We know our divisions too well. But this prayer has not stopped. Between Ascension and Pentecost, the Church waits for the Spirit and prays with Jesus. It is a good week to pray for unity in our parish and our family, starting with one relationship that needs mending.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: 'Where do we need unity most right now: in our family, our parish, or our Church?'
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Pray for unity every evening until Pentecost, and take one step to mend a relationship that has cooled.
  prayer: Holy Father, keep us in your name, as your Son prayed. Make us holy in your truth, make us one as you are one, and let your love live in us, so the world may believe. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു മുമ്പുള്ള ഞായർ
      ml: Sunday before Pentecost
    season:
      en: ക്യംതാ
      gloss: ഉയിർപ്പുകാലം
    also_kept_as: സന്യാസികളുടെ ഞായർ
    tagline: യേശു തന്റെ സ്നേഹിതർക്കുവേണ്ടിയും നമുക്കുവേണ്ടിയും പ്രാർത്ഥിക്കുന്നു
    standfirst: മരിക്കുന്നതിന്റെ തലേരാത്രി യേശു തന്റെ ശിഷ്യന്മാർക്കുവേണ്ടി ഉറക്കെ പ്രാർത്ഥിക്കുന്നു. പിന്നെ അവരിലൂടെ വിശ്വസിപ്പാനിരിക്കുന്ന എല്ലാവർക്കുംവേണ്ടി പ്രാർത്ഥിക്കുന്നു; ഈ താൾ വായിക്കുന്ന ഓരോരുത്തരും അതിൽ ഉൾപ്പെടുന്നു.
    description: പെന്തിക്കോസ്തിക്കു മുമ്പുള്ള ഞായറിലെ വായനകൾ, ശിഷ്യന്മാർക്കുവേണ്ടിയുള്ള യേശുവിന്റെ പ്രാർത്ഥന (യോഹന്നാൻ 17:13–26) വിശദമായി. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: 'യേശു തന്റെ ശിഷ്യന്മാർക്കുവേണ്ടി പിതാവിനോടു പ്രാർത്ഥിക്കുന്നു: അവർക്കു തന്റെ സന്തോഷം ഉണ്ടാകുവാൻ, ലോകത്തിൽ ആയിരിക്കുമ്പോൾ ദുഷ്ടനിൽനിന്നു കാക്കപ്പെടുവാൻ, സത്യത്താൽ വിശുദ്ധീകരിക്കപ്പെടുവാൻ. പിന്നെ ഭാവിയിൽ വിശ്വസിക്കുന്ന എല്ലാവർക്കുംവേണ്ടി, അവർ ഒന്നാകുവാനും തന്റെ മഹത്വം കാണുവാനും, പ്രാർത്ഥിക്കുന്നു.'
      why_this_sunday: സ്വർഗ്ഗാരോഹണത്തിനും പെന്തിക്കോസ്തിക്കും ഇടയിൽ സഭ കാത്തിരിക്കുകയും പ്രാർത്ഥിക്കുകയും ചെയ്യുന്നു. സ്വന്തം സഭയ്ക്കുവേണ്ടിയുള്ള യേശുവിന്റെ പ്രാർത്ഥന സഭ വായിക്കുന്നു; ജീവിതം പ്രാർത്ഥനയ്ക്കായി സമർപ്പിക്കുന്ന സന്യാസികളെയും ഓർക്കുന്നു.
      take_with_you: 'മരിക്കുംമുമ്പ് യേശു നിങ്ങൾക്കുവേണ്ടി പ്രാർത്ഥിച്ചു: “ഇവരുടെ വചനത്താൽ എന്നിൽ വിശ്വസിപ്പാനിരിക്കുന്നവർക്കു വേണ്ടിയും”.'
    readings_thread: ദേശം വിശ്രമിക്കുന്ന ശബ്ബത്തുവർഷത്തെക്കുറിച്ചു ലേവ്യപുസ്തകം വിവരിക്കുന്നു; ബലവും ധൈര്യവുമുള്ളവനായിരിക്ക എന്നു യോശുവയോടു കല്പിക്കുന്നു. പ്രവചിച്ചിരുന്ന ഫിലിപ്പൊസിന്റെ നാലു പുത്രിമാരെക്കുറിച്ച് അപ്പൊസ്തലപ്രവൃത്തികൾ പറയുന്നു. വിഭജിതമല്ലാത്ത ഒരു ജീവിതം കർത്താവിനു സമർപ്പിക്കുന്നതിനെക്കുറിച്ചു പൌലൊസ് എഴുതുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 17:13–14
      title: എന്റെ സന്തോഷം അവർക്കു ഉണ്ടാകേണ്ടതിന്ന്
      text: ഇപ്പോഴോ ഞാൻ നിന്റെ അടുക്കൽ വരുന്നു, യേശു പ്രാർത്ഥിക്കുന്നു; എന്റെ സന്തോഷം അവർക്കു ഉള്ളിൽ പൂർണ്ണമാകേണ്ടതിന്നു ഞാൻ ഇതു സംസാരിക്കുന്നു. അവർ ലൗകികന്മാരല്ലായ്കകൊണ്ടു ലോകം അവരെ പകെച്ചു.
      easy_to_miss: തന്നെ പിടിക്കുന്ന രാത്രിയിലാണ് യേശു സന്തോഷത്തിനായി പ്രാർത്ഥിക്കുന്നത്. സന്തോഷം എളുപ്പമുള്ള ജീവിതമല്ല.
    - verses: യോഹന്നാൻ 17:15–16
      title: ലോകത്തിൽനിന്ന് എടുക്കേണം എന്നല്ല
      text: അവരെ ലോകത്തിൽനിന്നു എടുക്കേണം എന്നല്ല, ദുഷ്ടന്റെ കയ്യിൽ അകപ്പെടാതവണ്ണം അവരെ കാത്തുകൊള്ളേണം എന്നത്രേ ഞാൻ അപേക്ഷിക്കുന്നതു. ഞാൻ ലൗകികനല്ലാത്തതുപോലെ അവരും ലൗകികന്മാരല്ല.
      easy_to_miss: ഇന്ന് ഓർക്കുന്ന സന്യാസികളെപ്പോലും ലോകത്തിൽനിന്ന് എടുത്തുമാറ്റുന്നില്ല. ലോകത്തിന്റെ ഉള്ളിൽനിന്നുകൊണ്ട് അവർ അതിനായി പ്രാർത്ഥിക്കുന്നു.
    - verses: യോഹന്നാൻ 17:17–19
      title: അവരെ വിശുദ്ധീകരിക്കേണമേ
      text: സത്യത്താൽ അവരെ വിശുദ്ധീകരിക്കേണമേ, നിന്റെ വചനം സത്യം ആകുന്നു. നീ എന്നെ ലോകത്തിലേക്കു അയച്ചതുപോലെ ഞാൻ അവരെയും ലോകത്തിലേക്കു അയച്ചിരിക്കുന്നു. അവർക്കുവേണ്ടി ഞാൻ എന്നെത്തന്നേ വിശുദ്ധീകരിക്കുന്നു.
      easy_to_miss: സഭാവർഷത്തിലെ ആദ്യ ഞായറായ കൂദോശ് ഈത്തോയുടെ മൂലത്തിലുള്ള വാക്കാണ് ‘വിശുദ്ധീകരിക്കുക’. അതോടെ തുടങ്ങിയ വർഷം ഇപ്പോൾ അതിലേക്കുതന്നെ മടങ്ങിവരുന്നു.
    - verses: യോഹന്നാൻ 17:20–23
      title: അവർ എല്ലാവരും ഒന്നാകേണ്ടതിന്ന്
      text: 'ഇവർക്കു വേണ്ടിമാത്രമല്ല, ഇവരുടെ വചനത്താൽ എന്നിൽ വിശ്വസിപ്പാനിരിക്കുന്നവർക്കു വേണ്ടിയും ഞാൻ അപേക്ഷിക്കുന്നു: പിതാവേ, നീ എന്നിലും ഞാൻ നിന്നിലും ആകുന്നതുപോലെ അവർ എല്ലാവരും ഒന്നാകേണ്ടതിന്ന്; നീ എന്നെ അയച്ചിരിക്കുന്നു എന്നു ലോകം വിശ്വസിപ്പാൻ.'
      easy_to_miss: യേശു ഐക്യത്തെ ദൌത്യവുമായി നേരിട്ടു ബന്ധിപ്പിക്കുന്നു. ഭിന്നിച്ച ഒരു സഭ ലോകത്തിനു വിശ്വസിക്കുന്നതു പ്രയാസമാക്കുന്നു.
    - verses: യോഹന്നാൻ 17:24–26
      title: ഞാൻ ഇരിക്കുന്ന ഇടത്ത്
      text: പിതാവേ, നീ എനിക്കു തന്നിട്ടുള്ളവർ എന്റെ മഹത്വം കാണേണ്ടതിന്നു ഞാൻ ഇരിക്കുന്ന ഇടത്തു അവരും എന്നോടുകൂടെ ഇരിക്കേണം എന്നു ഞാൻ ഇച്ഛിക്കുന്നു. നീ എന്നെ സ്നേഹിക്കുന്ന സ്നേഹം അവരിൽ ആകുവാൻ ഞാൻ നിന്റെ നാമം അവർക്കു വെളിപ്പെടുത്തിയിരിക്കുന്നു.
      easy_to_miss: ഈ പ്രാർത്ഥനയിൽ യേശു അവസാനമായി ചോദിക്കുന്നത്, പിതാവിന്റെ സ്നേഹം നമ്മിൽ വസിക്കണമെന്നാണ്.
    people:
    - name: യേശു
      role: മരിക്കുന്നതിന്റെ തലേരാത്രി പിതാവിനോട് ഉറക്കെ പ്രാർത്ഥിക്കുന്നു.
      name_meaning: “കർത്താവു രക്ഷിക്കുന്നു”
      ml: Jesus
    - name: ശിഷ്യന്മാർ
      role: യേശു തങ്ങൾക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നതു കേട്ടുകൊണ്ടിരിക്കുന്നവർ.
      name_meaning: —
      ml: The disciples
    - name: ഫിലിപ്പൊസിന്റെ പുത്രിമാർ
      role: പ്രവചിച്ചിരുന്ന, സുവിശേഷകനായ ഫിലിപ്പൊസിന്റെ അവിവാഹിതരായ നാലു പുത്രിമാർ (അപ്പൊസ്തലപ്രവൃത്തികൾ 21:9).
      name_meaning: —
      ml: Philip’s daughters
    phrases:
    - term: മഹാപുരോഹിതപ്രാർത്ഥന
      explanation: യോഹന്നാൻ 17-നുള്ള പരമ്പരാഗത പേര്. ഇവിടെ യേശു ഒരു പുരോഹിതനെപ്പോലെ തന്റെ ജനത്തിനുവേണ്ടി മദ്ധ്യസ്ഥത ചെയ്യുന്നു.
    - term: ലോകം
      explanation: യോഹന്നാനിൽ, ദൈവം സ്നേഹിക്കുന്ന മനുഷ്യരും (യോഹന്നാൻ 3:16) അവനെ തള്ളിക്കളയുന്ന മാനുഷിക ക്രമവും.
    - term: സന്യാസികളുടെ ഞായർ
      explanation: ആശ്രമങ്ങളിലും ദയറാകളിലും ജീവിതം പ്രാർത്ഥനയ്ക്കായി സമർപ്പിച്ചവരെ ഈ ഞായറാഴ്ച സഭ ഓർക്കുന്നു.
    reflection:
      title_en: യേശു നമുക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നു
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ഒരാൾ നമുക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നതു കേൾക്കുന്നതു ഹൃദയസ്പർശിയാണ്. രാത്രിയിൽ ഒരു വല്യമ്മച്ചി, കട്ടിലിനരികിൽ ഒരു മാതാവോ പിതാവോ, ആശുപത്രിയിൽ ഒരു സ്നേഹിതൻ. യോഹന്നാൻ 17-ൽ യേശു പ്രാർത്ഥിക്കുന്നതു നാം കേൾക്കുന്നു; ഇരുപതാം വാക്യത്തിൽ അവൻ നമ്മിലേക്കു തിരിയുന്നു: ഇവർക്കു വേണ്ടിമാത്രമല്ല, ഇവരുടെ വചനത്താൽ എന്നിൽ വിശ്വസിപ്പാനിരിക്കുന്നവർക്കു വേണ്ടിയും. അന്നുമുതലുള്ള ഓരോ ക്രിസ്ത്യാനിയും അതിൽപ്പെടുന്നു.

        അവൻ എന്താണ് ചോദിക്കുന്നത്? നമ്മെ ലോകത്തിൽനിന്ന് എടുത്തുമാറ്റണമെന്നല്ല, ലോകത്തിനുള്ളിൽ ദുഷ്ടനിൽനിന്നു കാക്കണമെന്ന്. സത്യത്താൽ നാം വിശുദ്ധീകരിക്കപ്പെടണമെന്ന്. അവനും പിതാവും ഒന്നായിരിക്കുന്നതുപോലെ നാം ഒന്നാകണമെന്ന്. നാം അവന്റെ മഹത്വം കാണുകയും പിതാവിന്റെ സ്നേഹം അറിയുകയും ചെയ്യണമെന്ന്. ഐക്യമുള്ളതും വിശുദ്ധവും സ്നേഹം നിറഞ്ഞതുമായ ഒരു സഭയ്ക്കുവേണ്ടിയുള്ള പ്രാർത്ഥനയാണിത്.

        ഇന്നത്തെ നമ്മുടെ സഭ എപ്പോഴും അങ്ങനെയല്ല. നമ്മുടെ ഭിന്നതകൾ നമുക്കു നന്നായി അറിയാം. എന്നാൽ ഈ പ്രാർത്ഥന നിലച്ചിട്ടില്ല. സ്വർഗ്ഗാരോഹണത്തിനും പെന്തിക്കോസ്തിക്കും ഇടയിൽ സഭ ആത്മാവിനായി കാത്തിരിക്കുകയും യേശുവിനോടൊപ്പം പ്രാർത്ഥിക്കുകയും ചെയ്യുന്നു. നമ്മുടെ ഇടവകയിലും കുടുംബത്തിലും ഐക്യത്തിനായി പ്രാർത്ഥിക്കാൻ പറ്റിയ ആഴ്ചയാണിത്; പരിഹരിക്കപ്പെടേണ്ട ഒരു ബന്ധത്തിൽനിന്നു തുടങ്ങാം.
      title_ml: Jesus prays for us
    week:
      question: 'ഇപ്പോൾ ഐക്യം ഏറ്റവും ആവശ്യമുള്ളത് എവിടെയാണ്: നമ്മുടെ കുടുംബത്തിലോ, ഇടവകയിലോ, സഭയിലോ?'
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: പെന്തിക്കോസ്തിവരെ എല്ലാ സന്ധ്യയ്ക്കും ഐക്യത്തിനായി പ്രാർത്ഥിക്കുക; തണുത്തുപോയ ഒരു ബന്ധം നന്നാക്കാൻ ഒരു ചുവടുവെക്കുക.
      prayer: പരിശുദ്ധപിതാവേ, നിന്റെ പുത്രൻ പ്രാർത്ഥിച്ചതുപോലെ ഞങ്ങളെ നിന്റെ നാമത്തിൽ കാത്തുകൊള്ളേണമേ. നിന്റെ സത്യത്താൽ ഞങ്ങളെ വിശുദ്ധീകരിക്കേണമേ; നീ ഒന്നായിരിക്കുന്നതുപോലെ ഞങ്ങളെ ഒന്നാക്കേണമേ; ലോകം വിശ്വസിക്കേണ്ടതിന്നു നിന്റെ സ്നേഹം ഞങ്ങളിൽ വസിക്കുമാറാക്കേണമേ. ആമേൻ.
