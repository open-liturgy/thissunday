one_minute:
  what_happens: While Jesus teaches in a synagogue on the Sabbath, he sees a woman bent over for eighteen years. He calls her, lays his hands on her, and she stands straight and praises God. The synagogue leader objects; Jesus answers that she deserved freedom on the Sabbath.
  why_this_sunday: Kpiptho is the Syriac name for the bent woman. The fifth Sunday of Lent reads her healing.
  take_with_you: Nobody asked Jesus to heal her. He saw her, and he called her over.
readings_thread: God blesses Noah and protects every human life. Isaiah’s servant is given words to sustain the weary. The Good Samaritan and the widow of Nain show mercy that does not wait to be asked, and Romans calls us to rejoice and weep with others.
key_verse:
  ref: Luke 13:16
  ml: എന്നാൽ സാത്താൻ പതിനെട്ടു സംവത്സരമായി ബന്ധിച്ചിരുന്ന അബ്രാഹാമിന്റെ മകളായ ഇവളെ ശബ്ബത്തുനാളിൽ ഈ ബന്ധനം അഴിച്ചു വിടേണ്ടതല്ലയോ എന്നു ഉത്തരം പറഞ്ഞു.
  ml_translation: Sathyavedapusthakam, 1910
  en: Ought not this woman, being a daughter of Abraham whom Satan had bound eighteen long years, be freed from this bondage on the Sabbath day?
  en_translation: World English Bible
scenes:
- verses: Luke 13:10–11
  title: Bent over for eighteen years
  text: Jesus is teaching in a synagogue on the Sabbath. A woman is there who has had a spirit of weakness for eighteen years. She is bent over and cannot straighten up at all.
  easy_to_miss: She is in the synagogue on the Sabbath. After eighteen years she is still coming to worship.
- verses: Luke 13:12–13
  title: You are freed
  text: 'Jesus sees her and calls her over: woman, you are freed from your weakness. He lays his hands on her, and at once she straightens up and glorifies God.'
  easy_to_miss: She did not ask for anything. Jesus is the one who notices her.
- verses: Luke 13:14
  title: Six days for work
  text: 'The leader of the synagogue is indignant. He tells the crowd: there are six days for work. Come and be healed on those days, not on the Sabbath.'
  easy_to_miss: He speaks to the crowd, not to Jesus. It is easier to scold the people than the healer.
- verses: Luke 13:15–16
  title: A daughter of Abraham
  text: Jesus calls them hypocrites. Each of you unties your ox or donkey on the Sabbath to give it water. Should not this daughter of Abraham, bound eighteen years, be untied on the Sabbath?
  easy_to_miss: “Daughter of Abraham” is a title of honour found nowhere else in the New Testament. Jesus restores her standing as well as her back.
- verses: Luke 13:17
  title: The crowd rejoices
  text: His opponents are put to shame, and the whole crowd rejoices at all the wonderful things he is doing.
  easy_to_miss: The leader worried about the crowd; the crowd turns out to be on the woman’s side.
