phrases:
- term: Kpiptho
  explanation: Syriac for the bent or bowed-down woman. This Sunday takes its name from her.
- term: Sabbath
  explanation: The seventh day, a day of rest from work. Jesus treats it as the right day to set people free.
- term: Spirit of weakness
  explanation: Luke’s phrase for her illness. He describes it as a kind of bondage that Jesus unties.
reflection:
  title_en: Seen, called and set free
  title_ml: കണ്ടു, വിളിച്ചു, സ്വതന്ത്രയാക്കി
  read_time: A three-minute read
  body: |-
    For eighteen years this woman saw mostly the ground. She could not look people in the face. She still came to the synagogue every Sabbath, bent over, probably sitting at the back. Nobody expected anything to change, perhaps not even her.

    Jesus sees her. That is the first thing Luke tells us. He calls her to come forward, in front of everyone, and lays his hands on her. She stands up straight for the first time in eighteen years, and the first thing she does with her new posture is praise God.

    The synagogue leader is more worried about rules than about her. Jesus answers that the Sabbath is exactly the day for setting people free. Many people around us are bent under something heavy: grief, debt, shame, illness. Lent is a time to look up, notice them and ask what we can do to help them stand.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What weighs you down at the moment? What would help you stand up straighter?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Notice one person who seems weighed down this week, and do one practical thing to lighten their load.
  prayer: Lord Jesus, you saw the bent woman and set her free. See what bends us down, lift us up to praise you, and open our eyes to those around us who cannot stand. Amen.
translations:
  ml:
    name:
      en: കൂനിയുടെ ഞായർ
      ml: Kpiptho Sunday
    season:
      en: വലിയ നോമ്പ്
      gloss: ഉയിർപ്പിനു മുമ്പുള്ള അമ്പതു നോമ്പുദിവസങ്ങൾ
    tagline: പതിനെട്ടു വർഷം കൂനിയായിരുന്ന ഒരു സ്ത്രീ നിവർന്നുനില്ക്കുന്നു
    standfirst: ശബ്ബത്തിൽ പള്ളിയിൽ, പതിനെട്ടു വർഷമായി നിവർന്നുനില്ക്കാൻ കഴിയാത്ത ഒരു സ്ത്രീ ഉണ്ട്. യേശു അവളെ അടുക്കെ വിളിച്ച് സ്വതന്ത്രയാക്കുന്നു; പള്ളിപ്രമാണി കോപിക്കുന്നു.
    description: വലിയ നോമ്പിലെ അഞ്ചാം ഞായറായ കൂനിയുടെ ഞായറിലെ വായനകൾ, ലൂക്കൊസ് 13:10–17 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: ശബ്ബത്തിൽ ഒരു പള്ളിയിൽ യേശു ഉപദേശിക്കുമ്പോൾ പതിനെട്ടു വർഷമായി കൂനിയായിരുന്ന ഒരു സ്ത്രീയെ അവൻ കാണുന്നു. അവൻ അവളെ വിളിച്ച് അവളുടെമേൽ കൈവെക്കുന്നു; അവൾ നിവർന്ന് ദൈവത്തെ മഹത്വപ്പെടുത്തുന്നു. പള്ളിപ്രമാണി എതിർക്കുന്നു; ശബ്ബത്തിൽ അവൾ സ്വാതന്ത്ര്യം അർഹിച്ചിരുന്നു എന്നു യേശു ഉത്തരം പറയുന്നു.
      why_this_sunday: കൂനിയായ സ്ത്രീയുടെ സുറിയാനിപ്പേരാണ് ക്പീപ്തോ. നോമ്പിലെ അഞ്ചാം ഞായറാഴ്ച അവളുടെ സൌഖ്യം വായിക്കുന്നു.
      take_with_you: അവളെ സൌഖ്യമാക്കാൻ ആരും യേശുവിനോടു ചോദിച്ചില്ല. അവൻ അവളെ കണ്ടു; അവളെ അടുക്കെ വിളിച്ചു.
    readings_thread: ദൈവം നോഹയെ അനുഗ്രഹിച്ച് ഓരോ മനുഷ്യജീവനെയും സംരക്ഷിക്കുന്നു. തളർന്നവനെ വാക്കുകൊണ്ടു താങ്ങുവാൻ യെശയ്യാവിന്റെ ദാസനു വാക്കു നല്കപ്പെടുന്നു. ആരും ചോദിക്കുന്നതു കാത്തിരിക്കാത്ത കരുണ നല്ല ശമര്യക്കാരനും നയിനിലെ വിധവയുടെ കഥയും കാണിക്കുന്നു; മറ്റുള്ളവരോടുകൂടെ സന്തോഷിപ്പാനും കരവാനും റോമർ നമ്മെ വിളിക്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 13:10–11
      title: പതിനെട്ടു വർഷം കൂനിയായി
      text: ശബ്ബത്തിൽ യേശു ഒരു പള്ളിയിൽ ഉപദേശിക്കുന്നു. പതിനെട്ടു വർഷമായി ഒരു രോഗാത്മാവു ബാധിച്ച ഒരു സ്ത്രീ അവിടെ ഉണ്ട്. അവൾ കൂനിയാണ്; ഒട്ടും നിവിരുവാൻ കഴിയുന്നില്ല.
      easy_to_miss: ശബ്ബത്തിൽ അവൾ പള്ളിയിലുണ്ട്. പതിനെട്ടു വർഷത്തിനു ശേഷവും അവൾ ആരാധനയ്ക്കു വരുന്നു.
    - verses: ലൂക്കൊസ് 13:12–13
      title: നിന്റെ രോഗബന്ധനം അഴിഞ്ഞിരിക്കുന്നു
      text: 'യേശു അവളെ കണ്ട് അടുക്കെ വിളിക്കുന്നു: സ്ത്രീയേ, നിന്റെ രോഗബന്ധനം അഴിഞ്ഞിരിക്കുന്നു. അവൻ അവളുടെമേൽ കൈവെക്കുന്നു; ഉടനെ അവൾ നിവിർന്നു ദൈവത്തെ മഹത്വപ്പെടുത്തുന്നു.'
      easy_to_miss: അവൾ ഒന്നും ചോദിച്ചില്ല. അവളെ ശ്രദ്ധിക്കുന്നത് യേശുവാണ്.
    - verses: ലൂക്കൊസ് 13:14
      title: വേല ചെയ്‌വാൻ ആറു ദിവസം
      text: 'പള്ളിപ്രമാണി നീരസപ്പെട്ട് പുരുഷാരത്തോടു പറയുന്നു: വേല ചെയ്‌വാൻ ആറു ദിവസം ഉണ്ടല്ലോ. ആ ദിവസങ്ങളിൽ വന്നു സൌഖ്യം വരുത്തിക്കൊൾവിൻ; ശബ്ബത്തിൽ അരുതു.'
      easy_to_miss: അവൻ സംസാരിക്കുന്നത് യേശുവിനോടല്ല, പുരുഷാരത്തോടാണ്. സൌഖ്യമാക്കുന്നവനെക്കാൾ ജനത്തെ ശകാരിക്കാൻ എളുപ്പമാണ്.
    - verses: ലൂക്കൊസ് 13:15–16
      title: അബ്രാഹാമിന്റെ മകൾ
      text: യേശു അവരെ കപടഭക്തിക്കാർ എന്നു വിളിക്കുന്നു. നിങ്ങളിൽ ഓരോരുത്തൻ ശബ്ബത്തിൽ തന്റെ കാളയെയോ കഴുതയെയോ വെള്ളം കുടിപ്പാൻ അഴിച്ചുകൊണ്ടുപോകുന്നില്ലയോ? പതിനെട്ടു സംവത്സരമായി ബന്ധിക്കപ്പെട്ടിരുന്ന ഈ അബ്രാഹാമിന്റെ മകളെ ശബ്ബത്തിൽ അഴിച്ചുവിടേണ്ടതല്ലയോ?
      easy_to_miss: “അബ്രാഹാമിന്റെ മകൾ” എന്നത് പുതിയനിയമത്തിൽ മറ്റൊരിടത്തും കാണാത്ത ഒരു ബഹുമാനപ്പേരാണ്. യേശു അവളുടെ മുതുകു മാത്രമല്ല, അവളുടെ മാന്യതയും വീണ്ടെടുക്കുന്നു.
    - verses: ലൂക്കൊസ് 13:17
      title: പുരുഷാരം സന്തോഷിക്കുന്നു
      text: അവന്റെ എതിരാളികൾ എല്ലാവരും ലജ്ജിക്കുന്നു; അവൻ ചെയ്യുന്ന എല്ലാ മഹിമകളെയും കുറിച്ചു പുരുഷാരം മുഴുവൻ സന്തോഷിക്കുന്നു.
      easy_to_miss: പ്രമാണി പുരുഷാരത്തെക്കുറിച്ചു വിഷമിച്ചു; പുരുഷാരം ആ സ്ത്രീയുടെ പക്ഷത്താണെന്നു തെളിയുന്നു.
