      explanation: കൂനിയായ, കുനിഞ്ഞുപോയ സ്ത്രീ എന്നതിന്റെ സുറിയാനി. ഈ ഞായറാഴ്ചയ്ക്ക് അവളുടെ പേരാണ്.
    - term: ശബ്ബത്ത്
      explanation: ഏഴാം ദിവസം, ജോലിയിൽനിന്നു വിശ്രമിക്കുന്ന ദിവസം. ആളുകളെ സ്വതന്ത്രരാക്കാനുള്ള ശരിയായ ദിവസമായി യേശു അതിനെ കാണുന്നു.
    - term: രോഗാത്മാവ്
      explanation: അവളുടെ രോഗത്തിനു ലൂക്കൊസ് നല്കുന്ന പേര്. യേശു അഴിച്ചുവിടുന്ന ഒരുതരം ബന്ധനമായി അവൻ അതിനെ വിവരിക്കുന്നു.
    reflection:
      title_en: കണ്ടു, വിളിച്ചു, സ്വതന്ത്രയാക്കി
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        പതിനെട്ടു വർഷം ഈ സ്ത്രീ കണ്ടത് ഏറെയും നിലം മാത്രമാണ്. ആളുകളുടെ മുഖത്തു നോക്കാൻ അവൾക്കു കഴിഞ്ഞിരുന്നില്ല. എന്നിട്ടും എല്ലാ ശബ്ബത്തിലും കുനിഞ്ഞുകൊണ്ട്, ഒരുപക്ഷേ ഏറ്റവും പിന്നിൽ ഇരുന്നുകൊണ്ട്, അവൾ പള്ളിയിൽ വന്നു. എന്തെങ്കിലും മാറുമെന്ന് ആരും പ്രതീക്ഷിച്ചില്ല; ഒരുപക്ഷേ അവൾപോലും.

        യേശു അവളെ കാണുന്നു. ലൂക്കൊസ് നമ്മോട് ആദ്യം പറയുന്നത് അതാണ്. എല്ലാവരുടെയും മുമ്പിൽ മുന്നോട്ടു വരാൻ അവൻ അവളെ വിളിച്ച് അവളുടെമേൽ കൈവെക്കുന്നു. പതിനെട്ടു വർഷത്തിനിടയിൽ ആദ്യമായി അവൾ നിവർന്നുനില്ക്കുന്നു; പുതിയ നിലയിൽ അവൾ ആദ്യം ചെയ്യുന്നത് ദൈവത്തെ സ്തുതിക്കുകയാണ്.

        പള്ളിപ്രമാണിക്ക് അവളെക്കാൾ ആശങ്ക നിയമങ്ങളെക്കുറിച്ചാണ്. ആളുകളെ സ്വതന്ത്രരാക്കാനുള്ള ദിവസംതന്നെയാണ് ശബ്ബത്ത് എന്നു യേശു ഉത്തരം നല്കുന്നു. നമുക്കു ചുറ്റുമുള്ള പലരും ഭാരമുള്ള എന്തിന്റെയോ കീഴിൽ കുനിഞ്ഞിരിക്കുന്നു: ദുഃഖം, കടം, ലജ്ജ, രോഗം. മുഖമുയർത്തി അവരെ ശ്രദ്ധിക്കാനും, അവരെ നിവർന്നുനില്ക്കാൻ സഹായിക്കാൻ നമുക്ക് എന്തു ചെയ്യാനാകും എന്നു ചോദിക്കാനുമുള്ള സമയമാണ് നോമ്പ്.
      title_ml: Seen, called and set free
    week:
      question: ഇപ്പോൾ നിങ്ങളെ ഭാരപ്പെടുത്തുന്നത് എന്താണ്? കൂടുതൽ നിവർന്നുനില്ക്കാൻ നിങ്ങളെ എന്തു സഹായിക്കും?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച ഭാരപ്പെട്ടിരിക്കുന്നതായി തോന്നുന്ന ഒരാളെ ശ്രദ്ധിച്ച്, അവരുടെ ഭാരം കുറയ്ക്കാൻ പ്രായോഗികമായ ഒരു കാര്യം ചെയ്യുക.
      prayer: കർത്താവായ യേശുവേ, നീ കൂനിയായ സ്ത്രീയെ കണ്ട് സ്വതന്ത്രയാക്കി. ഞങ്ങളെ കുനിക്കുന്നവയെ നീ കാണേണമേ; നിന്നെ സ്തുതിക്കാൻ ഞങ്ങളെ ഉയർത്തേണമേ; നിവർന്നുനില്ക്കാൻ കഴിയാത്ത ഞങ്ങൾക്കു ചുറ്റുമുള്ളവരിലേക്കു ഞങ്ങളുടെ കണ്ണുകൾ തുറക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 10:25–37
        ml: ലൂക്കൊസ് 10:25–37
        note: 'നല്ല ശമര്യക്കാരൻ: ആരാണ് അയൽക്കാരനായിത്തീർന്നത്?'
        printed: St. Luke 10:25-37
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 7:11–17
        ml: ലൂക്കൊസ് 7:11–17
        note: നയിനിൽ ഒരു വിധവയുടെ ഏകമകനെ യേശു ഉയിർപ്പിച്ച് അവന്റെ അമ്മയെ ഏല്പിക്കുന്നു.
        printed: St. Luke 7:11-17
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 9:1–7
        ml: ഉല്പത്തി 9:1–7
        note: 'ദൈവം നോഹയെ അനുഗ്രഹിക്കുന്നു: ഓരോ മനുഷ്യജീവനും വിലയേറിയതാണ്, കാരണം മനുഷ്യൻ ദൈവസ്വരൂപത്തിൽ ഉണ്ടാക്കപ്പെട്ടിരിക്കുന്നു.'
        printed: Genesis 9:1-7
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Jeremiah 51:1–9
        ml: യിരെമ്യാവ് 51:1–9
        note: ബാബേൽ വീഴുന്നു; ഞങ്ങൾ അവളെ സൗഖ്യമാക്കാൻ നോക്കി, അവൾക്കു സൗഖ്യം വന്നില്ല.
        printed: Jeremiah 51:1-9
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 50:1–5
        ml: യെശയ്യാവ് 50:1–5
        note: തളർന്നിരിക്കുന്നവനെ വാക്കുകൊണ്ടു താങ്ങുവാൻ യഹോവ എനിക്കു ശിഷ്യന്മാരുടെ നാവു തന്നിരിക്കുന്നു.
        printed: Isaiah 50:1-5
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Sirach 51:13–30
        ml: '[ML BOOK NAME: Sirach / Ben Sira] 51:13–30'
        note: ബാല്യംമുതൽ താൻ ജ്ഞാനം അന്വേഷിച്ചതെങ്ങനെ എന്ന് ഒരു ഗുരു പറയുന്നു.
        printed: Barazeera 51:13-30
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: 1 Peter 3:8–16
        ml: 1 പത്രൊസ് 3:8–16
        note: മനസ്സലിവുള്ളവരായിരിപ്പിൻ; തിന്മെക്കു പകരം തിന്മ ചെയ്യാതെ അനുഗ്രഹിപ്പിൻ.
        printed: I Peter 3:8-16
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Romans 12:1–15
        ml: റോമർ 12:1–15
        note: നിങ്ങളെത്തന്നേ ജീവനുള്ള യാഗമായി സമർപ്പിപ്പിൻ; സന്തോഷിക്കുന്നവരോടുകൂടെ സന്തോഷിപ്പിൻ, കരയുന്നവരോടുകൂടെ കരവിൻ.
        printed: Romans 12:1-15
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 13:10–17
        ml: ലൂക്കൊസ് 13:10–17
        note: പതിനെട്ടു വർഷം കൂനിയായിരുന്ന ഒരു സ്ത്രീയെ യേശു ശബ്ബത്തിൽ സ്വതന്ത്രയാക്കുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Luke 13:10-17
        main: true
