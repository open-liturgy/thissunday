tagline: A woman bent double for eighteen years stands up straight
standfirst: In the synagogue on the Sabbath there is a woman who has not been able to stand up straight for eighteen years. Jesus calls her over and sets her free, and the synagogue leader is furious.
description: Readings for Kpiptho Sunday, the fifth Sunday of Great Lent, with Luke 13:10–17, the bent woman, explained in five scenes. Reflection and question.
