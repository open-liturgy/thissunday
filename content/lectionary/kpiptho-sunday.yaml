one_minute:
  what_happens: While Jesus teaches in a synagogue on the Sabbath, he sees a woman bent over for eighteen years. He calls her, lays his hands on her, and she stands straight and praises God. The synagogue leader objects; Jesus answers that she deserved freedom on the Sabbath.
  why_this_sunday: Kpiptho is the Syriac name for the bent woman. The fifth Sunday of Lent reads her healing.
  take_with_you: Nobody asked Jesus to heal her. He saw her, and he called her over.
readings_thread: God blesses Noah and protects every human life. Isaiah’s servant is given words to sustain the weary. The Good Samaritan and the widow of Nain show mercy that does not wait to be asked, and Romans calls us to rejoice and weep with others.
