phrases:
- term: Kpiptho
  explanation: Syriac for the bent or bowed-down woman. This Sunday takes its name from her.
- term: Sabbath
  explanation: The seventh day, a day of rest from work. Jesus treats it as the right day to set people free.
- term: Spirit of weakness
  explanation: Luke’s phrase for her illness. He describes it as a kind of bondage that Jesus unties.
reflection:
  title_en: Seen, called and set free
  title_ml: '[TITLE ML]'
  read_time: A three-minute read
  body: |-
    For eighteen years this woman saw mostly the ground. She could not look people in the face. She still came to the synagogue every Sabbath, bent over, probably sitting at the back. Nobody expected anything to change, perhaps not even her.

    Jesus sees her. That is the first thing Luke tells us. He calls her to come forward, in front of everyone, and lays his hands on her. She stands up straight for the first time in eighteen years, and the first thing she does with her new posture is praise God.

    The synagogue leader is more worried about rules than about her. Jesus answers that the Sabbath is exactly the day for setting people free. Many people around us are bent under something heavy: grief, debt, shame, illness. Lent is a time to look up, notice them and ask what we can do to help them stand.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What weighs you down at the moment? What would help you stand up straighter?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Notice one person who seems weighed down this week, and do one practical thing to lighten their load.
  prayer: Lord Jesus, you saw the bent woman and set her free. See what bends us down, lift us up to praise you, and open our eyes to those around us who cannot stand. Amen.
