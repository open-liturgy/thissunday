one_minute:
  what_happens: At sunset people bring all their sick to Jesus and he lays hands on each one. Later a man full of leprosy begs to be made clean. Jesus touches him and says, I want to. The man is healed and Jesus sends him to the priest.
  why_this_sunday: Each Sunday of Great Lent reads one of Jesus’ miracles. The second is the cleansing of a leper, someone shut out from everyone else.
  take_with_you: Jesus touched the man before he was clean. Nobody had touched him in years.
readings_thread: Naaman, a foreign general, is healed of leprosy by washing in the Jordan, and Noah is shut in the ark while the flood rises. In Acts the sick are carried out so Peter’s shadow might fall on them, and Saul, once feared, is welcomed by Barnabas.
key_verse:
  ref: Luke 5:13
  ml: 'യേശു കൈ നീട്ടി അവനെ തൊട്ടു: എനിക്കു മനസ്സുണ്ടു; ശുദ്ധമാക എന്നു പറഞ്ഞു. ഉടനെ കുഷ്ഠം അവനെ വിട്ടു മാറി.'
  ml_translation: Sathyavedapusthakam, 1910
  en: He stretched out his hand, and touched him, saying, “I want to. Be made clean.” Immediately the leprosy left him.
  en_translation: World English Bible
scenes:
- verses: Luke 4:40–41
  title: At sunset
  text: As the sun sets, everyone with sick friends brings them to Jesus. He lays his hands on each one and heals them.
  easy_to_miss: Luke says Jesus laid hands on “each one”. Even in a crowd, he healed people one at a time.
- verses: Luke 5:12
  title: Full of leprosy
  text: 'In one of the towns a man covered in leprosy sees Jesus, falls on his face and begs: Lord, if you want to, you can make me clean.'
  easy_to_miss: Luke the physician says “full of” leprosy. This was an advanced case, not a small patch.
- verses: Luke 5:13
  title: I want to
  text: 'Jesus stretches out his hand and touches him: I want to. Be made clean. At once the leprosy leaves him.'
  easy_to_miss: 'Touching a leper made a person ritually unclean. Here the touch runs the other way: Jesus is not made unclean; the man is made clean.'
- verses: Luke 5:14
  title: Show yourself to the priest
  text: Jesus tells him not to tell anyone, but to go to the priest and make the offering Moses commanded, as a testimony to them.
  easy_to_miss: Only a priest could declare someone clean and let them back into the community (Leviticus 14). Jesus heals the body and then restores him to his people.
- verses: Luke 5:15–16
  title: He withdrew to pray
  text: News about Jesus spreads further, and great crowds come to hear him and be healed. But he often withdraws to lonely places and prays.
  easy_to_miss: The busier Jesus becomes, the more Luke notes that he went away to pray.
people:
- name: The leper
  ml: കുഷ്ഠരോഗി
  role: A man with advanced leprosy, living outside the town as the law required.
  name_meaning: —
- name: Naaman
  ml: നയമാൻ
  role: Commander of the Syrian army, healed of leprosy in the Jordan (2 Kings 5).
  name_meaning: “Pleasant”
phrases:
- term: Leprosy
  explanation: In the Bible, a name for several skin diseases. Anyone with it had to live apart and cry “unclean” (Leviticus 13:45–46).
- term: Clean
  explanation: Fit to take part in worship and community life. Being made clean meant being allowed back home.
- term: Testimony to them
  explanation: The priest’s inspection would show the religious leaders what Jesus had done.
reflection:
  title_en: Touched before he was clean
  title_ml: ശുദ്ധനാകും മുമ്പേ തൊട്ടു
  read_time: A three-minute read
  body: |-
    The man with leprosy did not doubt Jesus’ power. He said so: you can make me clean. His question was whether Jesus would want to. People had kept their distance from him for years. He may have stopped believing that anyone wanted him near.

    Jesus answers the real question before he heals the disease. He reaches out and touches him. Only then does he say the words: I want to. Be made clean. The touch comes first. For a man nobody had touched, that may have been as much of a healing as the clean skin.

    Lent is a good time to ask who around us is kept at a distance. Some are lonely, some are ill, some have done something that others will not forget. We cannot heal like Jesus. But we can do the first thing he did, which is to come close, and let them know that someone wants them near.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Who in our school, workplace or parish is often left out, and how could we include them?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Sit with, call or visit someone who is often alone. Stay long enough for a real conversation.
  prayer: Lord Jesus, you touched the leper and made him clean. Touch what is unclean in us, give us the courage to come close to those who are left out, and bring us home to you this Lent. Amen.
translations:
  ml:
    name:
      en: കുഷ്ഠരോഗിയുടെ ഞായർ
      ml: Lepers’ Sunday
    season:
      en: വലിയ നോമ്പ്
      gloss: ഉയിർപ്പിനു മുമ്പുള്ള അമ്പതു നോമ്പുദിവസങ്ങൾ
    tagline: “നിനക്കു മനസ്സുണ്ടെങ്കിൽ എന്നെ ശുദ്ധമാക്കുവാൻ കഴിയും”
    standfirst: കുഷ്ഠം നിറഞ്ഞ ഒരു മനുഷ്യൻ യേശുവിന്റെ കാല്ക്കൽ വീഴുന്നു. യേശുവിന് തന്നെ സൌഖ്യമാക്കാൻ കഴിയും എന്നതിൽ അവനു സംശയമില്ല. യേശുവിന് അതിനു മനസ്സുണ്ടോ എന്നതാണ് അവന് അറിയാത്തത്.
    description: വലിയ നോമ്പിലെ രണ്ടാം ഞായറായ കുഷ്ഠരോഗിയുടെ ഞായറിലെ വായനകൾ, ലൂക്കൊസ് 5:12–16; 4:40–41 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: സൂര്യാസ്തമയത്തിൽ ആളുകൾ തങ്ങളുടെ എല്ലാ രോഗികളെയും യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവരുന്നു; അവൻ ഓരോരുത്തന്റെയും മേൽ കൈവെക്കുന്നു. പിന്നീട് കുഷ്ഠം നിറഞ്ഞ ഒരു മനുഷ്യൻ ശുദ്ധമാക്കേണമേ എന്ന് അപേക്ഷിക്കുന്നു. യേശു അവനെ തൊട്ട്, എനിക്കു മനസ്സുണ്ടു എന്നു പറയുന്നു. അവൻ സൌഖ്യം പ്രാപിക്കുന്നു; യേശു അവനെ പുരോഹിതന്റെ അടുക്കൽ അയയ്ക്കുന്നു.
      why_this_sunday: വലിയ നോമ്പിലെ ഓരോ ഞായറാഴ്ചയും യേശുവിന്റെ ഓരോ അത്ഭുതം വായിക്കുന്നു. രണ്ടാമത്തേത് മറ്റെല്ലാവരിൽനിന്നും അകറ്റിനിർത്തപ്പെട്ട ഒരു കുഷ്ഠരോഗിയുടെ ശുദ്ധീകരണമാണ്.
      take_with_you: ശുദ്ധനാകുന്നതിനു മുമ്പേ യേശു ആ മനുഷ്യനെ തൊട്ടു. വർഷങ്ങളായി ആരും അവനെ തൊട്ടിട്ടില്ലായിരുന്നു.
    readings_thread: വിദേശിയായ സേനാപതി നയമാൻ യോർദ്ദാനിൽ കുളിച്ച് കുഷ്ഠത്തിൽനിന്നു സൌഖ്യം പ്രാപിക്കുന്നു; ജലപ്രളയം ഉയരുമ്പോൾ നോഹ പെട്ടകത്തിൽ അടയ്ക്കപ്പെടുന്നു. പത്രൊസിന്റെ നിഴലെങ്കിലും വീഴേണ്ടതിന് രോഗികളെ പുറത്തു കൊണ്ടുവരുന്നതായി അപ്പൊസ്തലപ്രവൃത്തികൾ പറയുന്നു; ഒരിക്കൽ എല്ലാവരും ഭയപ്പെട്ടിരുന്ന ശൌലിനെ ബർന്നബാസ് സ്വീകരിക്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 4:40–41
      title: സൂര്യൻ അസ്തമിക്കുമ്പോൾ
      text: സൂര്യൻ അസ്തമിക്കുമ്പോൾ ദീനക്കാർ ഉള്ളവർ ഒക്കെയും അവരെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവരുന്നു. അവൻ ഓരോരുത്തന്റെയും മേൽ കൈവെച്ച് അവരെ സൌഖ്യമാക്കുന്നു.
      easy_to_miss: യേശു “ഓരോരുത്തന്റെയും മേൽ” കൈവെച്ചു എന്നു ലൂക്കൊസ് പറയുന്നു. ഒരു പുരുഷാരത്തിനിടയിലും അവൻ ആളുകളെ ഓരോരുത്തരായി സൌഖ്യമാക്കി.
    - verses: ലൂക്കൊസ് 5:12
      title: കുഷ്ഠം നിറഞ്ഞവൻ
      text: 'ഒരു പട്ടണത്തിൽവെച്ച് കുഷ്ഠം നിറഞ്ഞോരു മനുഷ്യൻ യേശുവിനെ കണ്ട്, കവിണ്ണുവീണ് അപേക്ഷിക്കുന്നു: കർത്താവേ, നിനക്കു മനസ്സുണ്ടെങ്കിൽ എന്നെ ശുദ്ധമാക്കുവാൻ കഴിയും.'
      easy_to_miss: വൈദ്യനായ ലൂക്കൊസ് “കുഷ്ഠം നിറഞ്ഞ” എന്നു പറയുന്നു. ഇതൊരു ചെറിയ പാടല്ല, മൂർച്ഛിച്ച രോഗമായിരുന്നു.
    - verses: ലൂക്കൊസ് 5:13
      title: എനിക്കു മനസ്സുണ്ടു
      text: 'യേശു കൈ നീട്ടി അവനെ തൊട്ടു: എനിക്കു മനസ്സുണ്ടു; ശുദ്ധമാക. ഉടനെ കുഷ്ഠം അവനെ വിട്ടുമാറി.'
      easy_to_miss: 'ഒരു കുഷ്ഠരോഗിയെ തൊടുന്നത് ഒരാളെ ആചാരപരമായി അശുദ്ധനാക്കിയിരുന്നു. ഇവിടെ സ്പർശം മറുദിശയിലേക്കാണ്: യേശു അശുദ്ധനാകുന്നില്ല; ആ മനുഷ്യൻ ശുദ്ധനാകുന്നു.'
    - verses: ലൂക്കൊസ് 5:14
      title: പുരോഹിതന്നു കാണിക്ക
      text: ഇത് ആരോടും പറയരുത് എന്നും, പോയി പുരോഹിതന്നു തന്നെത്താൻ കാണിച്ച്, അവർക്കു സാക്ഷ്യത്തിനായി മോശെ കല്പിച്ച വഴിപാട് അർപ്പിക്കാനും യേശു അവനോടു കല്പിക്കുന്നു.
      easy_to_miss: ഒരാളെ ശുദ്ധനെന്നു പ്രഖ്യാപിച്ച് സമൂഹത്തിലേക്കു തിരികെ പ്രവേശിപ്പിക്കാൻ പുരോഹിതനു മാത്രമേ കഴിയുമായിരുന്നുള്ളൂ (ലേവ്യപുസ്തകം 14). യേശു ശരീരം സൌഖ്യമാക്കുന്നു; പിന്നെ അവനെ അവന്റെ ജനത്തിലേക്കു തിരികെ ചേർക്കുന്നു.
    - verses: ലൂക്കൊസ് 5:15–16
      title: അവൻ പ്രാർത്ഥിപ്പാൻ മാറിപ്പോയി
      text: യേശുവിനെക്കുറിച്ചുള്ള വാർത്ത കൂടുതൽ പരക്കുന്നു; അവനെ കേൾക്കാനും സൌഖ്യം പ്രാപിക്കാനും വലിയ പുരുഷാരങ്ങൾ വരുന്നു. എന്നാൽ അവൻ പലപ്പോഴും നിർജ്ജനസ്ഥലങ്ങളിലേക്കു മാറിപ്പോയി പ്രാർത്ഥിക്കുന്നു.
      easy_to_miss: യേശുവിന്റെ തിരക്കു കൂടുന്തോറും, അവൻ പ്രാർത്ഥിക്കാൻ മാറിപ്പോയി എന്നു ലൂക്കൊസ് കൂടുതൽ ശ്രദ്ധിച്ചു രേഖപ്പെടുത്തുന്നു.
    people:
    - name: കുഷ്ഠരോഗി
      role: ന്യായപ്രമാണം ആവശ്യപ്പെട്ടതുപോലെ പട്ടണത്തിനു പുറത്തു പാർത്തിരുന്ന, മൂർച്ഛിച്ച കുഷ്ഠമുള്ള ഒരു മനുഷ്യൻ.
      name_meaning: —
      ml: The leper
    - name: നയമാൻ
      role: അരാം സൈന്യത്തിന്റെ സേനാപതി; യോർദ്ദാനിൽ കുഷ്ഠത്തിൽനിന്നു സൌഖ്യം പ്രാപിച്ചവൻ (2 രാജാക്കന്മാർ 5).
      name_meaning: “മനോഹരൻ”
      ml: Naaman
    phrases:
    - term: കുഷ്ഠം
      explanation: ബൈബിളിൽ പല ത്വഗ്രോഗങ്ങൾക്കുമുള്ള പേര്. അതുള്ള ഏവരും വേറിട്ടു പാർക്കുകയും “അശുദ്ധൻ” എന്നു വിളിച്ചുപറയുകയും വേണമായിരുന്നു (ലേവ്യപുസ്തകം 13:45–46).
    - term: ശുദ്ധൻ
      explanation: ആരാധനയിലും സമൂഹജീവിതത്തിലും പങ്കുചേരാൻ യോഗ്യൻ. ശുദ്ധനാക്കപ്പെടുക എന്നാൽ വീട്ടിലേക്കു മടങ്ങാൻ അനുവാദം ലഭിക്കുക എന്നായിരുന്നു.
    - term: അവർക്കു സാക്ഷ്യത്തിന്നായി
      explanation: പുരോഹിതന്റെ പരിശോധന യേശു ചെയ്തത് മതനേതാക്കന്മാർക്കു കാണിച്ചുകൊടുക്കും.
    reflection:
      title_en: ശുദ്ധനാകും മുമ്പേ തൊട്ടു
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        കുഷ്ഠരോഗിക്ക് യേശുവിന്റെ ശക്തിയിൽ സംശയമുണ്ടായിരുന്നില്ല. അവൻ അതു പറഞ്ഞു: എന്നെ ശുദ്ധമാക്കുവാൻ കഴിയും. യേശുവിന് അതിനു മനസ്സുണ്ടോ എന്നതായിരുന്നു അവന്റെ ചോദ്യം. വർഷങ്ങളായി ആളുകൾ അവനിൽനിന്ന് അകലം പാലിച്ചിരുന്നു. തന്നെ അടുത്തു വേണമെന്ന് ആർക്കെങ്കിലും ആഗ്രഹമുണ്ടെന്ന് അവൻ വിശ്വസിക്കാതായിട്ടുണ്ടാകാം.

        രോഗം സൌഖ്യമാക്കുന്നതിനു മുമ്പേ യേശു യഥാർത്ഥ ചോദ്യത്തിന് ഉത്തരം നല്കുന്നു. അവൻ കൈ നീട്ടി അവനെ തൊടുന്നു. അതിനു ശേഷം മാത്രമാണ് ആ വാക്കുകൾ പറയുന്നത്: എനിക്കു മനസ്സുണ്ടു; ശുദ്ധമാക. സ്പർശമാണ് ആദ്യം. ആരും തൊടാതിരുന്ന ഒരു മനുഷ്യന്, ശുദ്ധമായ ത്വക്കിനോളംതന്നെ സൌഖ്യം ആ സ്പർശമായിരുന്നിരിക്കാം.

        നമുക്കു ചുറ്റും ആരെയാണ് അകറ്റിനിർത്തിയിരിക്കുന്നത് എന്നു ചോദിക്കാൻ നോമ്പ് നല്ല സമയമാണ്. ചിലർ ഏകാന്തരാണ്, ചിലർ രോഗികളാണ്, ചിലർ മറ്റുള്ളവർ മറക്കാത്ത എന്തെങ്കിലും ചെയ്തവരാണ്. യേശുവിനെപ്പോലെ സൌഖ്യമാക്കാൻ നമുക്കു കഴിയില്ല. എന്നാൽ അവൻ ആദ്യം ചെയ്തതു നമുക്കു ചെയ്യാം: അടുത്തു ചെല്ലുക; അവരെ അടുത്തു വേണമെന്ന് ആർക്കോ ആഗ്രഹമുണ്ടെന്ന് അവരെ അറിയിക്കുക.
      title_ml: Touched before he was clean
    week:
      question: നമ്മുടെ സ്കൂളിലോ ജോലിസ്ഥലത്തോ ഇടവകയിലോ പലപ്പോഴും ഒഴിവാക്കപ്പെടുന്നത് ആരാണ്? അവരെ എങ്ങനെ ഉൾപ്പെടുത്താം?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: പലപ്പോഴും തനിച്ചായിരിക്കുന്ന ഒരാളോടുകൂടെ ഇരിക്കുക, അവരെ വിളിക്കുക, അല്ലെങ്കിൽ സന്ദർശിക്കുക. ഒരു യഥാർത്ഥ സംഭാഷണത്തിനു വേണ്ടത്ര നേരം അവിടെ ചെലവഴിക്കുക.
      prayer: കർത്താവായ യേശുവേ, നീ കുഷ്ഠരോഗിയെ തൊട്ടു ശുദ്ധമാക്കി. ഞങ്ങളിലെ അശുദ്ധമായതിനെ തൊടേണമേ. ഒഴിവാക്കപ്പെട്ടവരുടെ അടുത്തു ചെല്ലാൻ ഞങ്ങൾക്കു ധൈര്യം തരേണമേ; ഈ നോമ്പിൽ ഞങ്ങളെ നിന്റെ അടുക്കലേക്കു തിരികെ കൊണ്ടുവരേണമേ. ആമേൻ.
