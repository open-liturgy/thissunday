one_minute:
  what_happens: At sunset people bring all their sick to Jesus and he lays hands on each one. Later a man full of leprosy begs to be made clean. Jesus touches him and says, I want to. The man is healed and Jesus sends him to the priest.
  why_this_sunday: Each Sunday of Great Lent reads one of Jesus’ miracles. The second is the cleansing of a leper, someone shut out from everyone else.
  take_with_you: Jesus touched the man before he was clean. Nobody had touched him in years.
readings_thread: Naaman, a foreign general, is healed of leprosy by washing in the Jordan, and Noah is shut in the ark while the flood rises. In Acts the sick are carried out so Peter’s shadow might fall on them, and Saul, once feared, is welcomed by Barnabas.
key_verse:
  ref: Luke 5:13
  ml: 'യേശു കൈ നീട്ടി അവനെ തൊട്ടു: എനിക്കു മനസ്സുണ്ടു; ശുദ്ധമാക എന്നു പറഞ്ഞു. ഉടനെ കുഷ്ഠം അവനെ വിട്ടു മാറി.'
  ml_translation: Sathyavedapusthakam, 1910
  en: He stretched out his hand, and touched him, saying, “I want to. Be made clean.” Immediately the leprosy left him.
  en_translation: World English Bible
scenes:
- verses: Luke 4:40–41
  title: At sunset
  text: As the sun sets, everyone with sick friends brings them to Jesus. He lays his hands on each one and heals them.
  easy_to_miss: Luke says Jesus laid hands on “each one”. Even in a crowd, he healed people one at a time.
- verses: Luke 5:12
  title: Full of leprosy
  text: 'In one of the towns a man covered in leprosy sees Jesus, falls on his face and begs: Lord, if you want to, you can make me clean.'
  easy_to_miss: Luke the physician says “full of” leprosy. This was an advanced case, not a small patch.
- verses: Luke 5:13
  title: I want to
  text: 'Jesus stretches out his hand and touches him: I want to. Be made clean. At once the leprosy leaves him.'
  easy_to_miss: 'Touching a leper made a person ritually unclean. Here the touch runs the other way: Jesus is not made unclean; the man is made clean.'
- verses: Luke 5:14
  title: Show yourself to the priest
  text: Jesus tells him not to tell anyone, but to go to the priest and make the offering Moses commanded, as a testimony to them.
  easy_to_miss: Only a priest could declare someone clean and let them back into the community (Leviticus 14). Jesus heals the body and then restores him to his people.
- verses: Luke 5:15–16
  title: He withdrew to pray
  text: News about Jesus spreads further, and great crowds come to hear him and be healed. But he often withdraws to lonely places and prays.
  easy_to_miss: The busier Jesus becomes, the more Luke notes that he went away to pray.
