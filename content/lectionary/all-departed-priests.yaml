phrases:
- term: Household
  explanation: A large household included family, servants and workers. A trusted steward ran it for the master.
- term: Food in due season
  explanation: Daily rations handed out at the right time. The Church has long read it as the Word and the sacraments.
- term: Departed priests
  explanation: The Church prays for its priests who have died, by name in the Thubden of the Qurbana and on this Sunday.
reflection:
  title_en: The priests who fed us
  title_ml: '[TITLE ML]'
  read_time: A three-minute read
  body: |-
    Most of us can name the priests who baptised us, married us, or buried someone we loved. Many of them have now died. On this Sunday the Church remembers them and prays for them, and the Gospel it chooses tells us what they were for: feeding the household at the right time.

    That is not glamorous work. It means celebrating the Qurbana in rain and heat, visiting the sick, sitting with the dying and teaching children who would rather be elsewhere. It means doing it for years, often for little thanks. Jesus calls a servant like that blessed, and promises he will be found doing it when the master comes.

    This Sunday is a good time to give thanks for the priests who fed us, and to pray for them by name. It is also a good time to pray for those who serve us now. They are not perfect, and the Gospel is honest about servants who fail. But the faithful ones deserve our gratitude while they are still with us.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Which priest has made a difference in our family’s life? What do we remember about them?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Pray by name for one priest who has died, and send a short note of thanks to a priest who serves you now.
  prayer: Lord, remember the priests who served your Church and have fallen asleep. Give them rest with your saints. Bless those who serve us now, and find them faithful when you come. Amen.
