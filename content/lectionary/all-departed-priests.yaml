# Readings transcribed from https://mosc.in/lectionary/421-2/. Everything else is a DRAFT for priest/editor review.
sunday_slug: all-departed-priests
is_sunday: true
name:
  en: Sunday of All Departed Priests
  ml: വാങ്ങിപ്പോയ പട്ടക്കാരുടെ ഞായർ
title_as_printed: All Departed Priests
season:
  en: Remembrance of the departed
  gloss: The Sundays before Great Lent
  syr: '[SYRIAC]'
tagline: The faithful servant who feeds the household
standfirst: Before Great Lent the Church remembers the priests who served it and have died. Jesus tells a story about a servant left in charge of a household while the master is away.
description: Readings for the Sunday of All Departed Priests, with Matthew 24:42–51 explained in five scenes, a reflection and a question for the family.
hero_quote:
  text: Who then is the faithful and wise servant, whom his lord has set over his household, to give them their food in due season?
  ref: Matthew 24:45
readings:
  evening:
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: Matthew 25:13–30
    ml: മത്തായി 25:13–30
    note: 'The parable of the talents: well done, good and faithful servant.'
    printed: St. Matthew 25:13-30
  morning:
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: Luke 19:11–28
    ml: ലൂക്കൊസ് 19:11–28
    note: A nobleman leaves money with his servants and returns to see what they did with it.
    printed: St. Luke 19:11-28
  before_qurbana:
  - kind: Old Testament
    kind_ml: പഴയനിയമം
    ref: Numbers 20:23–29
    ml: സംഖ്യാപുസ്തകം 20:23–29
    note: Aaron dies on Mount Hor, and his priestly robes pass to his son Eleazar.
    printed: Numbers 20:23-29
  - kind: Old Testament
    kind_ml: പഴയനിയമം
    ref: Deuteronomy 34:1–8
    ml: ആവർത്തനം 34:1–8
    note: Moses sees the promised land from Mount Nebo and dies there.
    printed: Deuteronomy 34:1-8
  - kind: Old Testament
    kind_ml: പഴയനിയമം
    ref: Isaiah 65:13–20
    ml: യെശയ്യാവ് 65:13–20
    note: I create new heavens and a new earth; no more weeping will be heard.
    printed: Isaiah 65:13-20
  holy_qurbana:
  - kind: Acts of the Apostles
    kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
    ref: Acts 20:26–38
    ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 20:26–38
    note: 'Paul’s farewell to the elders of Ephesus: keep watch over the flock.'
    printed: Acts 20:26-38
  - kind: Pauline Epistle
    kind_ml: പൗലോസിന്റെ ലേഖനം
    ref: 1 Thessalonians 4:13–5:11
    ml: 1 തെസ്സലൊനീക്യർ 4:13–5:11
    note: Do not grieve as those without hope; the day of the Lord comes like a thief.
    printed: I Thessalonians 4:13-5:11
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: Matthew 24:42–51
    ml: മത്തായി 24:42–51
    note: 'Keep watch: the faithful servant gives the household food at the proper time. This is the Gospel of the day.'
    printed: St. Matthew 24:42-51
    main: true
one_minute:
  what_happens: 'Jesus tells his disciples to keep watch, because they do not know when he will come. He describes two servants: one feeds the household faithfully and is rewarded, the other abuses his position and is caught out.'
  why_this_sunday: On the two Sundays before Great Lent the Church remembers the departed, first its priests and then all the faithful. This Sunday is for the priests.
  take_with_you: The faithful servant is not doing anything dramatic. He is giving people their food at the right time, day after day.
readings_thread: Aaron dies on Mount Hor and his son takes his robes, and Moses sees the promised land before he dies. Paul says goodbye to the elders of Ephesus and tells them to guard the flock. Thessalonians tells us not to grieve without hope.
key_verse:
  ref: Matthew 24:46
  ml: യജമാനൻ വരുമ്പോൾ അങ്ങനെ ചെയ്തു കാണുന്ന ദാസൻ ഭാഗ്യവാൻ.
  ml_translation: Sathyavedapusthakam, 1910
  en: Blessed is that servant whom his lord finds doing so when he comes.
  en_translation: World English Bible
scenes:
- verses: Matthew 24:42
  title: Keep watch
  text: Watch, Jesus says, because you do not know on what day your Lord is coming.
  easy_to_miss: This comes at the end of Jesus’ last long teaching before his Passion. He is preparing them for his absence.
- verses: Matthew 24:43–44
  title: Like a thief
  text: If a householder knew when a thief was coming, he would stay awake. So be ready, because the Son of Man comes when you do not expect him.
  easy_to_miss: Paul uses the same picture in 1 Thessalonians 5:2, read before this Gospel.
- verses: Matthew 24:45
  title: Food at the right time
  text: Who is the faithful and wise servant the master puts in charge of his household, to give them food at the proper time?
  easy_to_miss: The servant is in charge of the others, but his task is to serve them. Authority here means feeding people.
- verses: Matthew 24:46–47
  title: Found doing his work
  text: Blessed is the servant the master finds doing this when he comes. He will put him in charge of all he has.
  easy_to_miss: The reward for faithful service is more service.
- verses: Matthew 24:48–51
  title: The master is delayed
  text: But if the servant says “my master is taking his time” and begins beating the others and drinking, the master will come on a day he does not expect and punish him.
  easy_to_miss: 'The wicked servant’s mistake starts in his heart: “my master is delayed”. Forgetting that the master will return is what lets him abuse the household.'
people:
- name: The faithful servant
  ml: വിശ്വസ്തനായ ദാസൻ
  role: Left in charge of the household, he keeps feeding everyone on time.
  name_meaning: —
- name: Aaron
  ml: അഹരോൻ
  role: The first high priest, whose death is read before Qurbana.
  name_meaning: Uncertain; often given as “mountain of strength”
phrases:
- term: Household
  explanation: A large household included family, servants and workers. A trusted steward ran it for the master.
- term: Food in due season
  explanation: Daily rations handed out at the right time. The Church has long read it as the Word and the sacraments.
- term: Departed priests
  explanation: The Church prays for its priests who have died, by name in the Thubden of the Qurbana and on this Sunday.
reflection:
  title_en: The priests who fed us
  title_ml: നമ്മെ പോഷിപ്പിച്ച പട്ടക്കാർ
  read_time: A three-minute read
  body: |-
    Most of us can name the priests who baptised us, married us, or buried someone we loved. Many of them have now died. On this Sunday the Church remembers them and prays for them, and the Gospel it chooses tells us what they were for: feeding the household at the right time.

    That is not glamorous work. It means celebrating the Qurbana in rain and heat, visiting the sick, sitting with the dying and teaching children who would rather be elsewhere. It means doing it for years, often for little thanks. Jesus calls a servant like that blessed, and promises he will be found doing it when the master comes.

    This Sunday is a good time to give thanks for the priests who fed us, and to pray for them by name. It is also a good time to pray for those who serve us now. They are not perfect, and the Gospel is honest about servants who fail. But the faithful ones deserve our gratitude while they are still with us.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Which priest has made a difference in our family’s life? What do we remember about them?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Pray by name for one priest who has died, and send a short note of thanks to a priest who serves you now.
  prayer: Lord, remember the priests who served your Church and have fallen asleep. Give them rest with your saints. Bless those who serve us now, and find them faithful when you come. Amen.
translations:
  ml:
    name:
      en: വാങ്ങിപ്പോയ പട്ടക്കാരുടെ ഞായർ
      ml: Sunday of All Departed Priests
    season:
      en: വാങ്ങിപ്പോയവരുടെ ഓർമ്മ
      gloss: വലിയ നോമ്പിനു മുമ്പുള്ള ഞായറാഴ്ചകൾ
    tagline: വീട്ടുകാർക്കു ഭക്ഷണം കൊടുക്കുന്ന വിശ്വസ്തദാസൻ
    standfirst: വലിയ നോമ്പിനു മുമ്പ്, തന്നെ ശുശ്രൂഷിച്ച് മരണമടഞ്ഞ പട്ടക്കാരെ സഭ ഓർക്കുന്നു. യജമാനൻ ദൂരെയായിരിക്കുമ്പോൾ വീടിന്റെ ചുമതല ഏല്പിക്കപ്പെട്ട ഒരു ദാസനെക്കുറിച്ച് യേശു ഒരു കഥ പറയുന്നു.
    description: വാങ്ങിപ്പോയ പട്ടക്കാരുടെ ഞായറിലെ വായനകൾ, മത്തായി 24:42–51 അഞ്ചു രംഗങ്ങളിൽ, ഒരു ധ്യാനം, കുടുംബത്തിനായി ഒരു ചോദ്യം.
    one_minute:
      what_happens: 'തങ്ങളുടെ കർത്താവ് ഏതു ദിവസം വരുന്നു എന്ന് അറിയായ്കകൊണ്ട് ഉണർന്നിരിക്കാൻ യേശു ശിഷ്യന്മാരോടു പറയുന്നു. അവൻ രണ്ടു ദാസന്മാരെ വിവരിക്കുന്നു: ഒരുവൻ വീട്ടുകാർക്കു വിശ്വസ്തതയോടെ ഭക്ഷണം കൊടുത്ത് പ്രതിഫലം പ്രാപിക്കുന്നു; മറ്റവൻ തന്റെ സ്ഥാനം ദുരുപയോഗം ചെയ്ത് പിടിക്കപ്പെടുന്നു.'
      why_this_sunday: വലിയ നോമ്പിനു മുമ്പുള്ള രണ്ടു ഞായറാഴ്ചകളിൽ സഭ വാങ്ങിപ്പോയവരെ ഓർക്കുന്നു; ആദ്യം പട്ടക്കാരെയും പിന്നെ സകല വിശ്വാസികളെയും. ഈ ഞായറാഴ്ച പട്ടക്കാർക്കുള്ളതാണ്.
      take_with_you: വിശ്വസ്തദാസൻ നാടകീയമായി ഒന്നും ചെയ്യുന്നില്ല. ദിവസംതോറും തക്കസമയത്ത് ആളുകൾക്ക് അവരുടെ ഭക്ഷണം കൊടുക്കുന്നു; അത്രമാത്രം.
    readings_thread: ഹോർ പർവ്വതത്തിൽ അഹരോൻ മരിക്കുന്നു; അവന്റെ മകൻ അവന്റെ വസ്ത്രം ധരിക്കുന്നു. മരിക്കുംമുമ്പ് മോശെ വാഗ്ദത്തദേശം കാണുന്നു. എഫെസൊസിലെ മൂപ്പന്മാരോടു യാത്ര പറഞ്ഞ് ആട്ടിൻകൂട്ടത്തെ സൂക്ഷിപ്പാൻ പൗലോസ് അവരോടു പറയുന്നു. പ്രത്യാശയില്ലാതെ ദുഃഖിക്കരുത് എന്ന് തെസ്സലൊനീക്യലേഖനം പറയുന്നു.
    scenes:
    - verses: മത്തായി 24:42
      title: ഉണർന്നിരിപ്പിൻ
      text: നിങ്ങളുടെ കർത്താവു ഏതു ദിവസത്തിൽ വരുന്നു എന്നു നിങ്ങൾ അറിയായ്കകൊണ്ട് ഉണർന്നിരിപ്പിൻ എന്ന് യേശു പറയുന്നു.
      easy_to_miss: കഷ്ടാനുഭവത്തിനു മുമ്പുള്ള യേശുവിന്റെ അവസാനത്തെ നീണ്ട ഉപദേശത്തിന്റെ ഒടുവിലാണിത്. തന്റെ അസാന്നിദ്ധ്യത്തിനായി അവൻ അവരെ ഒരുക്കുകയാണ്.
    - verses: മത്തായി 24:43–44
      title: കള്ളനെപ്പോലെ
      text: കള്ളൻ എപ്പോൾ വരുന്നു എന്ന് ഒരു വീട്ടുടയവൻ അറിഞ്ഞിരുന്നെങ്കിൽ അവൻ ഉണർന്നിരിക്കുമായിരുന്നു. അതുകൊണ്ട് ഒരുങ്ങിയിരിപ്പിൻ; നിങ്ങൾ നിനെക്കാത്ത നാഴികയിലാണ് മനുഷ്യപുത്രൻ വരുന്നത്.
      easy_to_miss: ഈ സുവിശേഷത്തിനു മുമ്പു വായിക്കുന്ന 1 തെസ്സലൊനീക്യർ 5:2-ൽ പൗലോസ് ഇതേ ചിത്രം ഉപയോഗിക്കുന്നു.
    - verses: മത്തായി 24:45
      title: തക്കസമയത്തു ഭക്ഷണം
      text: യജമാനൻ തന്റെ വീട്ടുകാർക്കു തത്സമയത്തു ഭക്ഷണം കൊടുക്കേണ്ടതിന്നു അവരുടെ മേൽ ആക്കിവെച്ച വിശ്വസ്തനും ബുദ്ധിമാനും ആയ ദാസൻ ആർ?
      easy_to_miss: ദാസൻ മറ്റുള്ളവരുടെ മേൽ അധികാരിയാണ്; എങ്കിലും അവന്റെ ജോലി അവരെ സേവിക്കലാണ്. ഇവിടെ അധികാരം എന്നാൽ ആളുകൾക്കു ഭക്ഷണം കൊടുക്കലാണ്.
    - verses: മത്തായി 24:46–47
      title: തന്റെ ജോലി ചെയ്യുന്നവനായി കാണപ്പെടുന്നു
      text: യജമാനൻ വരുമ്പോൾ അങ്ങനെ ചെയ്തു കാണുന്ന ദാസൻ ഭാഗ്യവാൻ. അവൻ തനിക്കുള്ള സകലത്തിന്മേലും അവനെ ആക്കിവെക്കും.
      easy_to_miss: വിശ്വസ്തശുശ്രൂഷയ്ക്കുള്ള പ്രതിഫലം കൂടുതൽ ശുശ്രൂഷയാണ്.
    - verses: മത്തായി 24:48–51
      title: യജമാനൻ താമസിക്കുന്നു
      text: എന്നാൽ “യജമാനൻ വരുവാൻ താമസിക്കുന്നു” എന്നു ഹൃദയംകൊണ്ടു പറഞ്ഞ് ദാസൻ മറ്റുള്ളവരെ അടിക്കാനും കുടിക്കാനും തുടങ്ങിയാൽ, അവൻ നിനെക്കാത്ത നാളിൽ യജമാനൻ വന്ന് അവനെ ശിക്ഷിക്കും.
      easy_to_miss: 'ദുഷ്ടദാസന്റെ തെറ്റ് അവന്റെ ഹൃദയത്തിലാണ് തുടങ്ങുന്നത്: “യജമാനൻ വരുവാൻ താമസിക്കുന്നു”. യജമാനൻ മടങ്ങിവരും എന്നു മറക്കുന്നതാണ് വീട്ടുകാരെ ദ്രോഹിക്കാൻ അവനെ അനുവദിക്കുന്നത്.'
    people:
    - name: വിശ്വസ്തനായ ദാസൻ
      role: വീടിന്റെ ചുമതല ഏല്പിക്കപ്പെട്ട്, എല്ലാവർക്കും തക്കസമയത്തു ഭക്ഷണം കൊടുത്തുകൊണ്ടിരിക്കുന്നവൻ.
      name_meaning: —
      ml: The faithful servant
    - name: അഹരോൻ
      role: ആദ്യത്തെ മഹാപുരോഹിതൻ; അവന്റെ മരണം കുർബ്ബാനയ്ക്കു മുമ്പു വായിക്കുന്നു.
      name_meaning: ഉറപ്പില്ല; “ബലത്തിന്റെ പർവ്വതം” എന്നു പലപ്പോഴും പറയാറുണ്ട്
      ml: Aaron
    phrases:
    - term: വീട്ടുകാർ
      explanation: ഒരു വലിയ ഭവനത്തിൽ കുടുംബവും ദാസന്മാരും വേലക്കാരും ഉൾപ്പെട്ടിരുന്നു. വിശ്വസ്തനായ ഒരു ഗൃഹവിചാരകൻ യജമാനനുവേണ്ടി അതു നടത്തി.
    - term: തത്സമയത്തു ഭക്ഷണം
      explanation: ശരിയായ സമയത്തു വിതരണം ചെയ്യുന്ന ദിവസേനയുള്ള ഓഹരി. വചനവും കൂദാശകളുമായി സഭ ഇതിനെ പണ്ടേ വായിച്ചിരിക്കുന്നു.
    - term: വാങ്ങിപ്പോയ പട്ടക്കാർ
      explanation: കുർബ്ബാനയിലെ തുബ്ദേനിൽ പേരുചൊല്ലിയും ഈ ഞായറാഴ്ചയും, മരിച്ചുപോയ തന്റെ പട്ടക്കാർക്കുവേണ്ടി സഭ പ്രാർത്ഥിക്കുന്നു.
    reflection:
      title_en: നമ്മെ പോഷിപ്പിച്ച പട്ടക്കാർ
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        നമ്മെ മാമോദീസ മുക്കിയ, നമ്മുടെ വിവാഹം നടത്തിയ, നാം സ്നേഹിച്ച ഒരാളെ സംസ്കരിച്ച പട്ടക്കാരുടെ പേരുകൾ നമ്മിൽ മിക്കവർക്കും പറയാൻ കഴിയും. അവരിൽ പലരും ഇന്നു മരിച്ചുപോയി. ഈ ഞായറാഴ്ച സഭ അവരെ ഓർക്കുകയും അവർക്കുവേണ്ടി പ്രാർത്ഥിക്കുകയും ചെയ്യുന്നു; അതു തിരഞ്ഞെടുക്കുന്ന സുവിശേഷം അവർ എന്തിനായിരുന്നു എന്നു നമ്മോടു പറയുന്നു: തക്കസമയത്തു വീട്ടുകാർക്കു ഭക്ഷണം കൊടുക്കാൻ.

        അതു തിളക്കമുള്ള ജോലിയല്ല. മഴയിലും വെയിലിലും കുർബ്ബാന അർപ്പിക്കുക, രോഗികളെ സന്ദർശിക്കുക, മരണാസന്നരോടുകൂടെ ഇരിക്കുക, മറ്റെവിടെയെങ്കിലും ആയിരിക്കാൻ ആഗ്രഹിക്കുന്ന കുട്ടികളെ പഠിപ്പിക്കുക എന്നൊക്കെയാണ് അതിന്റെ അർത്ഥം. വർഷങ്ങളോളം, പലപ്പോഴും അധികം നന്ദി കിട്ടാതെ, അതു ചെയ്യുക. അങ്ങനെയുള്ള ഒരു ദാസനെ യേശു ഭാഗ്യവാൻ എന്നു വിളിക്കുന്നു; യജമാനൻ വരുമ്പോൾ അവൻ അതു ചെയ്യുന്നവനായി കാണപ്പെടും എന്നു വാഗ്ദാനം ചെയ്യുന്നു.

        നമ്മെ പോഷിപ്പിച്ച പട്ടക്കാർക്കായി നന്ദി പറയാനും അവർക്കുവേണ്ടി പേരുചൊല്ലി പ്രാർത്ഥിക്കാനും ഈ ഞായറാഴ്ച നല്ല സമയമാണ്. ഇപ്പോൾ നമ്മെ ശുശ്രൂഷിക്കുന്നവർക്കുവേണ്ടി പ്രാർത്ഥിക്കാനും നല്ല സമയമാണ്. അവർ പൂർണ്ണരല്ല; പരാജയപ്പെടുന്ന ദാസന്മാരെക്കുറിച്ച് സുവിശേഷം സത്യസന്ധമായി പറയുന്നുമുണ്ട്. എന്നാൽ വിശ്വസ്തരായവർ നമ്മോടുകൂടെ ഉള്ളപ്പോൾത്തന്നെ നമ്മുടെ നന്ദി അർഹിക്കുന്നു.
      title_ml: The priests who fed us
    week:
      question: ഏതു പട്ടക്കാരനാണ് നമ്മുടെ കുടുംബത്തിന്റെ ജീവിതത്തിൽ ഒരു മാറ്റം വരുത്തിയത്? അവരെക്കുറിച്ച് നാം എന്താണ് ഓർക്കുന്നത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: മരിച്ചുപോയ ഒരു പട്ടക്കാരനുവേണ്ടി പേരുചൊല്ലി പ്രാർത്ഥിക്കുക; ഇപ്പോൾ നിങ്ങളെ ശുശ്രൂഷിക്കുന്ന ഒരു പട്ടക്കാരന് നന്ദി അറിയിച്ച് ഒരു ചെറിയ കുറിപ്പ് അയയ്ക്കുക.
      prayer: കർത്താവേ, നിന്റെ സഭയെ ശുശ്രൂഷിച്ച് നിദ്ര പ്രാപിച്ച പട്ടക്കാരെ ഓർക്കേണമേ. നിന്റെ വിശുദ്ധന്മാരോടുകൂടെ അവർക്കു വിശ്രമം നല്കേണമേ. ഇപ്പോൾ ഞങ്ങളെ ശുശ്രൂഷിക്കുന്നവരെ അനുഗ്രഹിക്കേണമേ; നീ വരുമ്പോൾ അവരെ വിശ്വസ്തരായി കാണുമാറാകട്ടെ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 25:13–30
        ml: മത്തായി 25:13–30
        note: 'താലന്തുകളുടെ ഉപമ: നന്നു, നല്ലവനും വിശ്വസ്തനുമായ ദാസനേ.'
        printed: St. Matthew 25:13-30
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 19:11–28
        ml: ലൂക്കൊസ് 19:11–28
        note: ഒരു കുലീനൻ തന്റെ ദാസന്മാരെ പണം ഏല്പിച്ചു യാത്രയാകുന്നു; മടങ്ങിവന്ന് അവർ അതുകൊണ്ട് എന്തു ചെയ്തു എന്നു നോക്കുന്നു.
        printed: St. Luke 19:11-28
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Numbers 20:23–29
        ml: സംഖ്യാപുസ്തകം 20:23–29
        note: ഹോർ പർവ്വതത്തിൽ അഹരോൻ മരിക്കുന്നു; അവന്റെ പൌരോഹിത്യവസ്ത്രങ്ങൾ മകനായ എലെയാസാരിനു കൈമാറുന്നു.
        printed: Numbers 20:23-29
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Deuteronomy 34:1–8
        ml: ആവർത്തനം 34:1–8
        note: നെബോ പർവ്വതത്തിൽനിന്നു മോശെ വാഗ്ദത്തദേശം കാണുന്നു; അവിടെ മരിക്കുന്നു.
        printed: Deuteronomy 34:1-8
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 65:13–20
        ml: യെശയ്യാവ് 65:13–20
        note: ഞാൻ പുതിയ ആകാശവും പുതിയ ഭൂമിയും സൃഷ്ടിക്കുന്നു; ഇനി കരച്ചലിന്റെ ശബ്ദം കേൾക്കയില്ല.
        printed: Isaiah 65:13-20
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 20:26–38
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 20:26–38
        note: 'എഫെസൊസിലെ മൂപ്പന്മാരോടു പൌലൊസിന്റെ യാത്രാമൊഴി: ആട്ടിൻകൂട്ടത്തെ സൂക്ഷിച്ചുകൊൾവിൻ.'
        printed: Acts 20:26-38
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 1 Thessalonians 4:13–5:11
        ml: 1 തെസ്സലൊനീക്യർ 4:13–5:11
        note: പ്രത്യാശയില്ലാത്തവരെപ്പോലെ ദുഃഖിക്കരുത്; കർത്താവിന്റെ ദിവസം കള്ളനെപ്പോലെ വരുന്നു.
        printed: I Thessalonians 4:13-5:11
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 24:42–51
        ml: മത്തായി 24:42–51
        note: 'ഉണർന്നിരിപ്പിൻ: വിശ്വസ്തനായ ദാസൻ തക്കസമയത്തു വീട്ടുകാർക്കു ഭക്ഷണം കൊടുക്കുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.'
        printed: St. Matthew 24:42-51
        main: true
    key_verse:
      ref: മത്തായി 24:46
    hero_quote:
      text: എന്നാൽ യജമാനൻ തന്റെ വീട്ടുകാർക്കു തത്സമയത്തു ഭക്ഷണം കൊടുക്കേണ്ടതിന്നു അവരുടെ മേൽ ആക്കിവെച്ച വിശ്വസ്തനും ബുദ്ധിമാനും ആയ ദാസൻ ആർ?
      ref: മത്തായി 24:45
sources:
