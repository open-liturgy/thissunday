phrases:
- term: Pool of Siloam
  explanation: A pool in the south of Jerusalem fed by Hezekiah’s tunnel. Its name means “Sent”.
- term: Put out of the synagogue
  explanation: Excluded from the local Jewish community and its worship, a severe social punishment.
- term: Catholicate Day
  explanation: The Sunday on which the Malankara Church prays for the Catholicate and its work.
reflection:
  title_en: One thing I know
  title_ml: ഒന്നു ഞാൻ അറിയുന്നു
  read_time: A three-minute read
  body: |-
    John 9 is a long chapter, and most of it is not about the healing. It is about what happens afterwards. The neighbours argue, the Pharisees interrogate, the parents back away. Everyone has a theory about Jesus. The man who was healed has only his experience.

    He does not pretend to know more than he does. Asked if Jesus is a sinner, he says he does not know. What he knows is simple and cannot be taken away: I was blind, and now I see. Under pressure, his faith gets clearer, not weaker. He is thrown out for it, and Jesus comes looking for him.

    We do not need to win every argument about faith. We do need to be honest about what God has done for us. A young person asked hard questions at college, or an adult mocked at work, can still say: this is what I know. That kind of witness is quiet, but it is very hard to argue with.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What is one thing you know God has done for you, even if you cannot explain it all?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Tell one person this week a short story of something God has done in your life.
  prayer: Lord Jesus, light of the world, you gave sight to the man born blind. Open the eyes of our hearts, give us courage to speak of what you have done, and come and find us when we are left alone. Amen.
