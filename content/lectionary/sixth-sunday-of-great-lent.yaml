tagline: A man born blind sees, and is thrown out for it
standfirst: Jesus heals a man who has never seen. Everyone around him argues about how it happened and who is to blame. The man himself sticks to one thing he knows.
description: Readings for the Sixth Sunday of Great Lent, with John 9:1–41, the man born blind, explained in five scenes. A reflection and a family question.
