- name: The man born blind
  ml: കുരുടനായി ജനിച്ചവൻ
  role: A beggar in Jerusalem who has never seen. He is healed and then thrown out of the synagogue.
  name_meaning: —
- name: His parents
  ml: അവന്റെ അമ്മയപ്പന്മാർ
  role: They confirm he was born blind but are too afraid to say more.
  name_meaning: —
- name: The Pharisees
  ml: പരീശന്മാർ
  role: Religious leaders who question him and argue among themselves.
  name_meaning: Probably “the separated ones”
phrases:
- term: Pool of Siloam
  explanation: A pool in the south of Jerusalem fed by Hezekiah’s tunnel. Its name means “Sent”.
- term: Put out of the synagogue
  explanation: Excluded from the local Jewish community and its worship, a severe social punishment.
- term: Catholicate Day
  explanation: The Sunday on which the Malankara Church prays for the Catholicate and its work.
reflection:
  title_en: One thing I know
  title_ml: ഒന്നു ഞാൻ അറിയുന്നു
  read_time: A three-minute read
  body: |-
    John 9 is a long chapter, and most of it is not about the healing. It is about what happens afterwards. The neighbours argue, the Pharisees interrogate, the parents back away. Everyone has a theory about Jesus. The man who was healed has only his experience.

    He does not pretend to know more than he does. Asked if Jesus is a sinner, he says he does not know. What he knows is simple and cannot be taken away: I was blind, and now I see. Under pressure, his faith gets clearer, not weaker. He is thrown out for it, and Jesus comes looking for him.

    We do not need to win every argument about faith. We do need to be honest about what God has done for us. A young person asked hard questions at college, or an adult mocked at work, can still say: this is what I know. That kind of witness is quiet, but it is very hard to argue with.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What is one thing you know God has done for you, even if you cannot explain it all?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Tell one person this week a short story of something God has done in your life.
  prayer: Lord Jesus, light of the world, you gave sight to the man born blind. Open the eyes of our hearts, give us courage to speak of what you have done, and come and find us when we are left alone. Amen.
translations:
  ml:
    name:
      en: വലിയ നോമ്പിലെ ആറാം ഞായർ
      ml: Sixth Sunday of Great Lent
    season:
      en: വലിയ നോമ്പ്
      gloss: ഉയിർപ്പിനു മുമ്പുള്ള അമ്പതു നോമ്പുദിവസങ്ങൾ
    also_kept_as: കാതോലിക്കാദിനം
    tagline: കുരുടനായി ജനിച്ചവൻ കാണുന്നു; അതിന്റെ പേരിൽ പുറത്താക്കപ്പെടുന്നു
    standfirst: ഒരിക്കലും കണ്ടിട്ടില്ലാത്ത ഒരു മനുഷ്യനെ യേശു സൌഖ്യമാക്കുന്നു. അത് എങ്ങനെ സംഭവിച്ചു, ആരാണ് കുറ്റക്കാരൻ എന്നു ചുറ്റുമുള്ളവർ തർക്കിക്കുന്നു. ആ മനുഷ്യൻ തനിക്ക് അറിയാവുന്ന ഒരു കാര്യത്തിൽ ഉറച്ചുനില്ക്കുന്നു.
    description: വലിയ നോമ്പിലെ ആറാം ഞായറിലെ വായനകൾ, കുരുടനായി ജനിച്ചവനെക്കുറിച്ചുള്ള യോഹന്നാൻ 9:1–41 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും കുടുംബചോദ്യവും.
    one_minute:
      what_happens: യേശു ചേറുണ്ടാക്കി ഒരു കുരുടന്റെ കണ്ണിന്മേൽ പൂശി, ശിലോഹാംകുളത്തിൽ കഴുകുവാൻ അവനെ അയക്കുന്നു. അവൻ കാഴ്ച പ്രാപിച്ചു മടങ്ങിവരുന്നു. അയല്ക്കാരും പരീശന്മാരും അവന്റെ അമ്മയപ്പന്മാർപോലും അതിനെക്കുറിച്ചു തർക്കിക്കുന്നു. അവനെ പള്ളിയിൽനിന്നു പുറത്താക്കുന്നു; യേശു അവനെ കണ്ടെത്തുന്നു.
      why_this_sunday: നോമ്പിലെ ആറാം ഞായറാഴ്ച മൂന്നു സുവിശേഷവായനകളും കുരുടന്മാർക്കു കാഴ്ച ലഭിക്കുന്നതിനെക്കുറിച്ചാണ്. സഭ ഈ ഞായർ കാതോലിക്കാദിനമായും ആചരിക്കുന്നു.
      take_with_you: 'ആ മനുഷ്യന് എല്ലാ ഉത്തരങ്ങളും ഇല്ലായിരുന്നു. അവൻ ഒന്നിൽ മുറുകെപ്പിടിച്ചു: “ഞാൻ കുരുടനായിരുന്നു, ഇപ്പോൾ കണ്ണു കാണുന്നു”.'
    readings_thread: ശരിയായ തൂക്കക്കട്ടികളും വിളവിന്റെ ആദ്യഫലവും ആവർത്തനം ആവശ്യപ്പെടുന്നു; ദശാംശം മുഴുവനും കൊണ്ടുവരുവിൻ എന്നു മലാഖി പറയുന്നു. പരീക്ഷകൾക്കു ശേഷം ഇയ്യോബിന് എല്ലാം തിരികെ ലഭിക്കുന്നു. സന്തോഷത്തോടെ കൊടുക്കുന്നവനെ കൊരിന്ത്യലേഖനം പുകഴ്ത്തുന്നു; ഉണരുക, ക്രിസ്തു നിന്റെമേൽ പ്രകാശിക്കും എന്ന് എഫെസ്യലേഖനം പറയുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 9:1–7
      title: ചെന്നു കഴുകുക
      text: ആർ പാപം ചെയ്തിട്ടാണ് ഇവൻ കുരുടനായി പിറന്നത് എന്നു ശിഷ്യന്മാർ ചോദിക്കുന്നു. ആരുമല്ല, ദൈവപ്രവൃത്തി അവങ്കൽ വെളിവാകേണ്ടതിന്നത്രേ എന്നു യേശു പറയുന്നു. അവൻ നിലത്തു തുപ്പി ചേറുണ്ടാക്കി അവന്റെ കണ്ണിന്മേൽ പൂശി, ശിലോഹാംകുളത്തിൽ കഴുകുവാൻ പറയുന്നു. അവൻ കാഴ്ച പ്രാപിച്ചു മടങ്ങിവരുന്നു.
      easy_to_miss: ശിലോഹാം എന്നതിന്നു “അയക്കപ്പെട്ടവൻ” എന്നർത്ഥം എന്നു യോഹന്നാൻ കുറിക്കുന്നു. പിതാവിനാൽ അയക്കപ്പെട്ടവൻ ആ മനുഷ്യനെ അയക്കപ്പെട്ടവൻ എന്നു പേരുള്ള കുളത്തിലേക്ക് അയക്കുന്നു.
    - verses: യോഹന്നാൻ 9:8–17
      title: ഇവനല്ലയോ?
      text: 'ഇതു അവൻ തന്നെയോ എന്ന് അയല്ക്കാർക്കു തീർച്ചയില്ല. പരീശന്മാർ അവനെ ചോദ്യം ചെയ്യുന്നു: ശബ്ബത്തിൽ ചേറുണ്ടാക്കിയവൻ ദൈവത്തിന്റെ അടുക്കൽനിന്നു വന്നവനല്ല. പാപിയായ ഒരു മനുഷ്യന് ഇങ്ങനെയുള്ള അടയാളങ്ങൾ എങ്ങനെ ചെയ്യാൻ കഴിയും എന്നു മറ്റു ചിലർ ചോദിക്കുന്നു. അവൻ ഒരു പ്രവാചകൻ എന്ന് ആ മനുഷ്യൻ പറയുന്നു.'
      easy_to_miss: 'ഓരോ തവണ ചോദിക്കപ്പെടുമ്പോഴും യേശുവിനെക്കുറിച്ചുള്ള അവന്റെ കാഴ്ച വളരുന്നു: ആദ്യം “യേശു എന്നു പേരുള്ള മനുഷ്യൻ”, പിന്നെ “ഒരു പ്രവാചകൻ”.'
    - verses: യോഹന്നാൻ 9:18–23
      title: അവന്നു പ്രായം ഉണ്ടല്ലോ
      text: അധികാരികൾ അവന്റെ അമ്മയപ്പന്മാരെ വിളിക്കുന്നു. അവൻ കുരുടനായി ജനിച്ചു എന്ന് അവർ സമ്മതിക്കുന്നു; എന്നാൽ അവൻ എങ്ങനെ കാണുന്നു എന്നു പറയുന്നില്ല. അവനോടു ചോദിപ്പിൻ, അവന്നു പ്രായം ഉണ്ടല്ലോ എന്ന് അവർ പറയുന്നു. പള്ളിഭ്രഷ്ടരാകുമോ എന്ന് അവർ ഭയപ്പെടുന്നു.
      easy_to_miss: സ്വന്തം അമ്മയപ്പന്മാർ അവനിൽനിന്നു പിന്മാറുന്നു. സൌഖ്യം ലഭിച്ചവൻ തനിയെ നില്ക്കേണ്ടിവരുന്നു.
    - verses: യോഹന്നാൻ 9:24–34
      title: ഒന്നു അറിയുന്നു
      text: 'വീണ്ടും ചോദ്യം ചെയ്യപ്പെട്ടപ്പോൾ അവൻ പറയുന്നു: അവൻ പാപിയോ അല്ലയോ എന്നു ഞാൻ അറിയുന്നില്ല; ഒന്നു അറിയുന്നു; ഞാൻ കുരുടനായിരുന്നു, ഇപ്പോൾ കണ്ണു കാണുന്നു. നിങ്ങൾക്കും അവന്റെ ശിഷ്യന്മാർ ആകുവാൻ മനസ്സുണ്ടോ എന്ന് അവൻ ചോദിക്കുന്നു; അവർ അവനെ പുറത്താക്കിക്കളയുന്നു.'
      easy_to_miss: 'ആരും പഠിപ്പിച്ചിട്ടില്ലാത്തവൻ ഉപദേഷ്ടാക്കളെ പഠിപ്പിക്കുന്നു: “ദൈവത്തിന്റെ അടുക്കൽനിന്നു വന്നവൻ അല്ലെങ്കിൽ അവന്നു ഒന്നും ചെയ്‌വാൻ കഴികയില്ല”.'
    - verses: യോഹന്നാൻ 9:35–41
      title: കർത്താവേ, ഞാൻ വിശ്വസിക്കുന്നു
      text: 'അവനെ പുറത്താക്കി എന്നു യേശു കേട്ട് അവനെ കണ്ടെത്തുന്നു: നീ ദൈവപുത്രനിൽ വിശ്വസിക്കുന്നുവോ? കർത്താവേ, ഞാൻ വിശ്വസിക്കുന്നു എന്നു പറഞ്ഞ് അവൻ അവനെ നമസ്കരിക്കുന്നു. കാണാത്തവർ കാണ്മാനും കാണുന്നു എന്ന് അവകാശപ്പെടുന്നവർ കുരുടരാകുവാനും ആണ് താൻ വന്നത് എന്നു യേശു പറയുന്നു.'
      easy_to_miss: യേശുവിനെ ആദ്യം “മനുഷ്യൻ” എന്നും പിന്നെ “പ്രവാചകൻ” എന്നും കണ്ടവൻ ഒടുവിൽ അവനെ നമസ്കരിക്കുന്നു. അവന്റെ കാഴ്ച രണ്ടു വിധത്തിൽ വളരുന്നു.
    people:
    - name: കുരുടനായി ജനിച്ചവൻ
      role: ഒരിക്കലും കണ്ടിട്ടില്ലാത്ത, യെരൂശലേമിലെ ഒരു ഭിക്ഷക്കാരൻ. സൌഖ്യം ലഭിച്ചശേഷം അവനെ പള്ളിയിൽനിന്നു പുറത്താക്കുന്നു.
      name_meaning: —
      ml: The man born blind
    - name: അവന്റെ അമ്മയപ്പന്മാർ
      role: അവൻ കുരുടനായി ജനിച്ചു എന്ന് അവർ സമ്മതിക്കുന്നു; കൂടുതൽ പറയാൻ ഭയപ്പെടുന്നു.
      name_meaning: —
      ml: His parents
    - name: പരീശന്മാർ
      role: അവനെ ചോദ്യം ചെയ്യുകയും തമ്മിൽ തർക്കിക്കുകയും ചെയ്യുന്ന മതനേതാക്കൾ.
      name_meaning: ഒരുപക്ഷേ “വേർതിരിക്കപ്പെട്ടവർ”
      ml: The Pharisees
    phrases:
    - term: ശിലോഹാംകുളം
      explanation: യെരൂശലേമിന്റെ തെക്കുഭാഗത്ത്, ഹിസ്കീയാവിന്റെ തുരങ്കത്തിലൂടെ വെള്ളം എത്തുന്ന കുളം. അതിന്റെ പേരിന് “അയക്കപ്പെട്ടവൻ” എന്നർത്ഥം.
    - term: പള്ളിഭ്രഷ്ട്
      explanation: പ്രാദേശിക യെഹൂദസമൂഹത്തിൽനിന്നും അതിന്റെ ആരാധനയിൽനിന്നും പുറത്താക്കപ്പെടുക. കഠിനമായ ഒരു സാമൂഹികശിക്ഷ.
    - term: കാതോലിക്കാദിനം
      explanation: കാതോലിക്കേറ്റിനും അതിന്റെ പ്രവർത്തനങ്ങൾക്കും വേണ്ടി മലങ്കരസഭ പ്രാർത്ഥിക്കുന്ന ഞായർ.
    reflection:
      title_en: ഒന്നു ഞാൻ അറിയുന്നു
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        യോഹന്നാൻ 9 ഒരു നീണ്ട അദ്ധ്യായമാണ്; അതിൽ ഏറിയ പങ്കും സൌഖ്യത്തെക്കുറിച്ചല്ല, അതിനുശേഷം സംഭവിക്കുന്നതിനെക്കുറിച്ചാണ്. അയല്ക്കാർ തർക്കിക്കുന്നു, പരീശന്മാർ ചോദ്യം ചെയ്യുന്നു, അമ്മയപ്പന്മാർ പിന്മാറുന്നു. യേശുവിനെക്കുറിച്ച് എല്ലാവർക്കും ഒരു സിദ്ധാന്തമുണ്ട്. സൌഖ്യം ലഭിച്ചവന്റെ കൈയിൽ സ്വന്തം അനുഭവം മാത്രമേയുള്ളൂ.

        തനിക്കറിയാവുന്നതിൽ കൂടുതൽ അറിയാമെന്ന് അവൻ ഭാവിക്കുന്നില്ല. യേശു പാപിയാണോ എന്നു ചോദിച്ചപ്പോൾ, അറിയില്ല എന്ന് അവൻ പറയുന്നു. അവന് അറിയാവുന്നതു ലളിതമാണ്, ആർക്കും എടുത്തുകളയാനാവാത്തതും: ഞാൻ കുരുടനായിരുന്നു, ഇപ്പോൾ കണ്ണു കാണുന്നു. സമ്മർദ്ദത്തിൻകീഴിൽ അവന്റെ വിശ്വാസം ദുർബലമാകുകയല്ല, കൂടുതൽ തെളിയുകയാണ്. അതിന്റെ പേരിൽ അവനെ പുറത്താക്കുന്നു; യേശു അവനെ തേടിവരുന്നു.

        വിശ്വാസത്തെക്കുറിച്ചുള്ള എല്ലാ തർക്കങ്ങളും നാം ജയിക്കേണ്ടതില്ല. എന്നാൽ ദൈവം നമുക്കുവേണ്ടി ചെയ്തതിനെക്കുറിച്ചു സത്യസന്ധരായിരിക്കണം. കോളേജിൽ കടുത്ത ചോദ്യങ്ങൾ നേരിടുന്ന ഒരു ചെറുപ്പക്കാരനും, ജോലിസ്ഥലത്തു പരിഹസിക്കപ്പെടുന്ന ഒരു മുതിർന്നയാൾക്കും ഇങ്ങനെ പറയാം: എനിക്ക് അറിയാവുന്നത് ഇതാണ്. അത്തരം സാക്ഷ്യം ശാന്തമാണ്; പക്ഷേ അതിനെതിരെ വാദിക്കാൻ വളരെ പ്രയാസമാണ്.
      title_ml: One thing I know
    week:
      question: ദൈവം നിങ്ങൾക്കുവേണ്ടി ചെയ്തതായി നിങ്ങൾക്ക് ഉറപ്പുള്ള, മുഴുവനായി വിശദീകരിക്കാനാവില്ലെങ്കിലും, ഒരു കാര്യം എന്താണ്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ദൈവം നിങ്ങളുടെ ജീവിതത്തിൽ ചെയ്ത ഒരു കാര്യം ഈ ആഴ്ച ഒരാളോടു ചുരുക്കി പറയുക.
      prayer: ലോകത്തിന്റെ വെളിച്ചമായ കർത്താവായ യേശുവേ, കുരുടനായി ജനിച്ചവനു നീ കാഴ്ച നല്കി. ഞങ്ങളുടെ ഹൃദയത്തിന്റെ കണ്ണുകൾ തുറക്കേണമേ; നീ ചെയ്തതിനെക്കുറിച്ചു പറയാൻ ഞങ്ങൾക്കു ധൈര്യം തരേണമേ; ഞങ്ങൾ തനിച്ചാകുമ്പോൾ ഞങ്ങളെ തേടിവരേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Mark 10:46–52
        ml: മർക്കൊസ് 10:46–52
        printed: St. Mark 10:46-52
