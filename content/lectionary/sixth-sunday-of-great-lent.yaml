      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Deuteronomy 25:13–16; 26:1–13
        ml: ആവർത്തനം 25:13–16; 26:1–13
        printed: Deuteronomy 25:13-16, 26:1-13
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Job 42:1–10
        ml: ഇയ്യോബ് 42:1–10
        printed: Job 42:1-10
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Malachi 3:7–12
        ml: മലാഖി 3:7–12
        printed: Malachi 3:7-12
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: 1 Peter 4:12–19
        ml: 1 പത്രൊസ് 4:12–19
        printed: I Peter 4:12-19
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 2 Corinthians 9:6–15
        ml: 2 കൊരിന്ത്യർ 9:6–15
        printed: II Corinthians 9:6-15
        or:
          kind: Pauline Epistle
          kind_ml: പൗലോസിന്റെ ലേഖനം
          ref: Ephesians 5:1–14
          ml: എഫെസ്യർ 5:1–14
          printed: Ephesians 5:1-14
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 9:1–41
        ml: യോഹന്നാൻ 9:1–41
        printed: St. John 9:1-41
        main: true
    key_verse:
      ref: യോഹന്നാൻ 9:25
    hero_quote:
      text: ഞാൻ ലോകത്തിൽ ഇരിക്കുമ്പോൾ ലോകത്തിന്റെ വെളിച്ചം ആകുന്നു.
      ref: യോഹന്നാൻ 9:5
