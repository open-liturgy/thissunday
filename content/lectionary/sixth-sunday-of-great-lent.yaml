one_minute:
  what_happens: Jesus makes mud, puts it on a blind man’s eyes and sends him to wash in the pool of Siloam. He comes back seeing. Neighbours, Pharisees and even his parents argue about it. He is thrown out of the synagogue, and Jesus finds him.
  why_this_sunday: On the sixth Sunday of Lent all three Gospels are about blind men receiving sight. The Church also keeps this Sunday as Catholicate Day.
  take_with_you: 'The man did not have all the answers. He held on to one thing: I was blind, and now I see.'
readings_thread: 'Deuteronomy asks for honest weights and the first fruits of the harvest, and Malachi says bring the whole tithe. Job is restored after his trials. Corinthians praises a cheerful giver, and Ephesians says: wake up, and Christ will shine on you.'
key_verse:
  ref: John 9:25
  ml: 'അതിന്നു അവൻ: അവൻ പാപിയോ അല്ലയോ എന്നു ഞാൻ അറിയുന്നില്ല; ഒന്നു അറിയുന്നു; ഞാൻ കുരുടനായിരുന്നു, ഇപ്പോൾ കണ്ണു കാണുന്നു എന്നു ഉത്തരം പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: 'He therefore answered, “I don’t know if he is a sinner. One thing I do know: that though I was blind, now I see.”'
  en_translation: World English Bible
scenes:
- verses: John 9:1–7
  title: Go and wash
  text: The disciples ask whose sin made the man blind. Neither, says Jesus; this is so God’s works can be seen. He spits, makes mud, puts it on the man’s eyes and tells him to wash in the pool of Siloam. He comes back seeing.
  easy_to_miss: John notes that Siloam means “Sent”. Jesus, the one sent by the Father, sends the man to the pool called Sent.
- verses: John 9:8–17
  title: Is this the same man?
  text: 'The neighbours cannot agree if it is him. The Pharisees question him: Jesus made mud on the Sabbath, so he cannot be from God. Others ask how a sinner could do such signs. The man says: he is a prophet.'
  easy_to_miss: 'Each time he is asked, the man’s view of Jesus grows: “the man called Jesus”, then “a prophet”.'
- verses: John 9:18–23
  title: Ask him, he is of age
  text: The authorities call his parents. They confirm he was born blind but will not say how he sees. Ask him, they say, he is old enough. They are afraid of being put out of the synagogue.
  easy_to_miss: His own parents step back from him. The healed man is left to stand alone.
- verses: John 9:24–34
  title: One thing I know
  text: 'Questioned again, he says: I do not know if he is a sinner. One thing I know: I was blind, and now I see. He asks if they want to become his disciples too, and they throw him out.'
  easy_to_miss: 'The man who has never been taught teaches the teachers: if this man were not from God, he could do nothing.'
- verses: John 9:35–41
  title: Lord, I believe
  text: Jesus hears he has been thrown out and finds him. Do you believe in the Son of Man? Lord, I believe, he says, and worships him. Jesus says he came so the blind might see and those who claim to see might become blind.
  easy_to_miss: The man who first saw Jesus as “a man” and then “a prophet” ends by worshipping him. His sight grows in two ways.
