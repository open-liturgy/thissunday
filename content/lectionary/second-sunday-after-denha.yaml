    hero_quote:
      text: 'നഥനയേൽ അവനോടു: നസറെത്തിൽനിന്നു വല്ല നന്മയും വരുമോ എന്നു പറഞ്ഞു. ഫിലിപ്പൊസ് അവനോടു: വന്നു കാൺക എന്നു പറഞ്ഞു.'
