one_minute:
  what_happens: Jesus calls Philip, who finds Nathanael and tells him about Jesus of Nazareth. Nathanael is doubtful but comes. Jesus says he saw him under the fig tree, and Nathanael calls him Son of God and King of Israel.
  why_this_sunday: The Sundays after Denha show Jesus being made known. All three Gospel readings today come from John 1, where one person brings the next.
  take_with_you: Philip did not win an argument. He invited his friend to meet Jesus for himself.
readings_thread: In the evening John points to the Lamb of God; in the morning Andrew brings his brother Simon. At Qurbana Philip brings Nathanael. Proverbs pictures Wisdom calling people in, and Isaiah tells them to look to the rock they were cut from.
key_verse:
  ref: John 1:46
  ml: '[ML VERSE: Sathyavedapusthakam 1910, John 1:46]'
  ml_translation: Sathyavedapusthakam, 1910
  en: Nathanael said to him, “Can any good thing come out of Nazareth?” Philip said to him, “Come and see.”
  en_translation: World English Bible
scenes:
- verses: John 1:43–44
  title: Follow me
  text: 'The next day Jesus decides to go to Galilee. He finds Philip and says: follow me. Philip is from Bethsaida, the town of Andrew and Peter.'
  easy_to_miss: In John, Philip is the first person Jesus goes looking for. The others came to him.
- verses: John 1:45–46
  title: Come and see
  text: 'Philip finds Nathanael: we have found the one Moses and the prophets wrote about, Jesus of Nazareth. Nathanael asks if anything good can come from Nazareth. Philip says: come and see.'
  easy_to_miss: Nathanael’s home, Cana, was only a few miles from Nazareth. Neighbouring villages rarely think much of each other.
- verses: John 1:47–48
  title: No deceit in him
  text: Jesus sees Nathanael coming and calls him a true Israelite with no deceit. Nathanael asks how he knows him. Jesus says he saw him under the fig tree before Philip called him.
  easy_to_miss: Jacob, the father of Israel, was known for deceit (Genesis 27:35). Nathanael is an Israelite without it.
- verses: John 1:49
  title: Son of God, King of Israel
  text: 'Nathanael answers: Rabbi, you are the Son of God, you are the King of Israel.'
  easy_to_miss: The doubter of verse 46 makes one of the fullest confessions in the whole chapter.
- verses: John 1:50–51
  title: Heaven opened
  text: 'Jesus says he will see greater things: heaven opened and the angels of God going up and down on the Son of Man.'
  easy_to_miss: This is Jacob’s ladder (Genesis 28:12). Jesus himself is now the place where heaven and earth meet.
