tagline: '“Come and see”: Philip brings Nathanael'
standfirst: Philip is sure he has found the one Moses wrote about. His friend Nathanael doubts anything good can come from Nazareth. Philip does not argue. He says, come and see.
description: Readings for the Second Sunday after Denha, with John 1:43–51, Philip and Nathanael, explained in five scenes, a reflection and a family question.
