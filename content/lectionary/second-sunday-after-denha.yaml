one_minute:
  what_happens: Jesus calls Philip, who finds Nathanael and tells him about Jesus of Nazareth. Nathanael is doubtful but comes. Jesus says he saw him under the fig tree, and Nathanael calls him Son of God and King of Israel.
  why_this_sunday: The Sundays after Denha show Jesus being made known. All three Gospel readings today come from John 1, where one person brings the next.
  take_with_you: Philip did not win an argument. He invited his friend to meet Jesus for himself.
readings_thread: In the evening John points to the Lamb of God; in the morning Andrew brings his brother Simon. At Qurbana Philip brings Nathanael. Proverbs pictures Wisdom calling people in, and Isaiah tells them to look to the rock they were cut from.
key_verse:
  ref: John 1:46
  ml: 'നഥനയേൽ അവനോടു: നസറെത്തിൽനിന്നു വല്ല നന്മയും വരുമോ എന്നു പറഞ്ഞു. ഫിലിപ്പൊസ് അവനോടു: വന്നു കാൺക എന്നു പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: Nathanael said to him, “Can any good thing come out of Nazareth?” Philip said to him, “Come and see.”
  en_translation: World English Bible
scenes:
- verses: John 1:43–44
  title: Follow me
  text: 'The next day Jesus decides to go to Galilee. He finds Philip and says: follow me. Philip is from Bethsaida, the town of Andrew and Peter.'
  easy_to_miss: In John, Philip is the first person Jesus goes looking for. The others came to him.
- verses: John 1:45–46
  title: Come and see
  text: 'Philip finds Nathanael: we have found the one Moses and the prophets wrote about, Jesus of Nazareth. Nathanael asks if anything good can come from Nazareth. Philip says: come and see.'
  easy_to_miss: Nathanael’s home, Cana, was only a few miles from Nazareth. Neighbouring villages rarely think much of each other.
- verses: John 1:47–48
  title: No deceit in him
  text: Jesus sees Nathanael coming and calls him a true Israelite with no deceit. Nathanael asks how he knows him. Jesus says he saw him under the fig tree before Philip called him.
  easy_to_miss: Jacob, the father of Israel, was known for deceit (Genesis 27:35). Nathanael is an Israelite without it.
- verses: John 1:49
  title: Son of God, King of Israel
  text: 'Nathanael answers: Rabbi, you are the Son of God, you are the King of Israel.'
  easy_to_miss: The doubter of verse 46 makes one of the fullest confessions in the whole chapter.
- verses: John 1:50–51
  title: Heaven opened
  text: 'Jesus says he will see greater things: heaven opened and the angels of God going up and down on the Son of Man.'
  easy_to_miss: This is Jacob’s ladder (Genesis 28:12). Jesus himself is now the place where heaven and earth meet.
people:
- name: Philip
  ml: ഫിലിപ്പൊസ്
  role: From Bethsaida, called directly by Jesus. He brings Nathanael.
  name_meaning: “Lover of horses”
- name: Nathanael
  ml: നഥനയേൽ
  role: From Cana in Galilee. Often identified with the apostle Bartholomew.
  name_meaning: “God has given”
- name: Jesus of Nazareth
  ml: നസറായനായ യേശു
  role: Called by Philip “the son of Joseph, from Nazareth”.
  name_meaning: “The Lord saves”
phrases:
- term: Under the fig tree
  explanation: A common place to sit, pray and study the Scriptures. Micah 4:4 pictures peace as everyone under their own fig tree.
- term: Son of Man
  explanation: Jesus’ favourite way of speaking about himself, drawn from Daniel 7:13.
- term: Moses and the prophets
  explanation: 'A way of naming the whole of the Jewish Scriptures: the Law and the Prophets.'
reflection:
  title_en: Come and see
  title_ml: വന്നു കാൺക
  read_time: A three-minute read
  body: |-
    Nathanael’s first reaction is the one many people have: I doubt it. Nazareth was a nowhere place, and he had grown up nearby. Philip could have argued with him. He could have listed the Scriptures, or told him what Jesus had said. Instead he says three words: come and see.

    It works because Jesus already knows Nathanael. Before Philip called him, Jesus saw him under the fig tree. The invitation is not to an idea but to a person who has been paying attention all along. Nathanael’s doubts are not fought. They are simply overtaken by meeting Jesus.

    Many of us have a friend or a family member who doubts. The temptation is to argue. This Gospel suggests something gentler and harder: bring them where they can see for themselves, and trust that Jesus has already seen them. Our job is the invitation. What happens next is between them and him.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Who first brought you to Jesus or to church? What did they do that helped?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: 'Invite one friend to something at church this month: a Qurbana, a youth meeting or a feast.'
  prayer: Lord Jesus, you saw Nathanael under the fig tree before anyone called him. See the people we love who doubt, give us the courage to say “come and see”, and open heaven to us all. Amen.
translations:
  ml:
    name:
      en: ദനഹായ്ക്കു ശേഷം രണ്ടാം ഞായർ
      ml: Second Sunday after Denha
    season:
      en: ദനഹാ
      gloss: ദനഹാക്കാലം
    tagline: '“വന്നു കാൺക”: ഫിലിപ്പൊസ് നഥനയേലിനെ കൊണ്ടുവരുന്നു'
    standfirst: മോശെ എഴുതിയവനെ താൻ കണ്ടെത്തി എന്ന് ഫിലിപ്പൊസിന് ഉറപ്പാണ്. നസറെത്തിൽനിന്നു വല്ല നന്മയും വരുമോ എന്ന് അവന്റെ സ്നേഹിതൻ നഥനയേൽ സംശയിക്കുന്നു. ഫിലിപ്പൊസ് തർക്കിക്കുന്നില്ല. വന്നു കാൺക എന്ന് അവൻ പറയുന്നു.
    description: 'ദനഹായ്ക്കു ശേഷം രണ്ടാം ഞായറിലെ വായനകൾ, ഫിലിപ്പൊസും നഥനയേലും: യോഹന്നാൻ 1:43–51 അഞ്ചു രംഗങ്ങളിൽ, ഒരു ധ്യാനം, കുടുംബത്തിനായി ഒരു ചോദ്യം.'
    one_minute:
      what_happens: യേശു ഫിലിപ്പൊസിനെ വിളിക്കുന്നു; അവൻ നഥനയേലിനെ കണ്ടെത്തി നസറായനായ യേശുവിനെക്കുറിച്ചു പറയുന്നു. സംശയത്തോടെയാണെങ്കിലും നഥനയേൽ വരുന്നു. അത്തിയുടെ കീഴിൽ നീ ഇരിക്കുമ്പോൾ ഞാൻ നിന്നെ കണ്ടു എന്ന് യേശു പറയുന്നു; നഥനയേൽ അവനെ ദൈവപുത്രനെന്നും യിസ്രായേലിന്റെ രാജാവെന്നും വിളിക്കുന്നു.
      why_this_sunday: യേശു വെളിപ്പെടുന്നതാണ് ദനഹായ്ക്കു ശേഷമുള്ള ഞായറാഴ്ചകൾ കാണിക്കുന്നത്. ഇന്നത്തെ മൂന്നു സുവിശേഷവായനകളും ഒരാൾ അടുത്തയാളെ കൊണ്ടുവരുന്ന യോഹന്നാൻ 1-ൽനിന്നാണ്.
      take_with_you: ഫിലിപ്പൊസ് ഒരു തർക്കം ജയിക്കുകയല്ല ചെയ്തത്. യേശുവിനെ നേരിട്ടു കാണാൻ അവൻ തന്റെ സ്നേഹിതനെ ക്ഷണിച്ചു.
    readings_thread: സന്ധ്യയ്ക്ക് യോഹന്നാൻ ദൈവത്തിന്റെ കുഞ്ഞാടിനെ ചൂണ്ടിക്കാണിക്കുന്നു; പ്രഭാതത്തിൽ അന്ത്രെയാസ് തന്റെ സഹോദരൻ ശിമോനെ കൊണ്ടുവരുന്നു. കുർബ്ബാനയിൽ ഫിലിപ്പൊസ് നഥനയേലിനെ കൊണ്ടുവരുന്നു. ജ്ഞാനം ആളുകളെ അകത്തേക്കു വിളിക്കുന്നതായി സദൃശവാക്യങ്ങൾ ചിത്രീകരിക്കുന്നു; തങ്ങളെ വെട്ടിയെടുത്ത പാറയിലേക്കു നോക്കാൻ യെശയ്യാവ് പറയുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 1:43–44
      title: എന്നെ അനുഗമിക്ക
      text: 'പിറ്റേന്ന് യേശു ഗലീലയിലേക്കു പോകാൻ നിശ്ചയിക്കുന്നു. അവൻ ഫിലിപ്പൊസിനെ കണ്ടെത്തി പറയുന്നു: എന്നെ അനുഗമിക്ക. ഫിലിപ്പൊസ് അന്ത്രെയാസിന്റെയും പത്രൊസിന്റെയും പട്ടണമായ ബേത്ത്സയിദക്കാരനാണ്.'
      easy_to_miss: യോഹന്നാനിൽ യേശു തേടിപ്പോകുന്ന ആദ്യവ്യക്തി ഫിലിപ്പൊസാണ്. മറ്റുള്ളവർ അവന്റെ അടുക്കൽ വരികയായിരുന്നു.
    - verses: യോഹന്നാൻ 1:45–46
      title: വന്നു കാൺക
      text: 'ഫിലിപ്പൊസ് നഥനയേലിനെ കണ്ടെത്തുന്നു: മോശെയും പ്രവാചകന്മാരും എഴുതിയിരിക്കുന്നവനെ, നസറെത്തിൽനിന്നുള്ള യേശുവിനെ, ഞങ്ങൾ കണ്ടെത്തിയിരിക്കുന്നു. നസറെത്തിൽനിന്നു വല്ല നന്മയും വരുമോ എന്നു നഥനയേൽ ചോദിക്കുന്നു. ഫിലിപ്പൊസ് പറയുന്നു: വന്നു കാൺക.'
      easy_to_miss: നഥനയേലിന്റെ നാടായ കാനാ നസറെത്തിൽനിന്ന് ഏതാനും മൈൽ മാത്രം അകലെയായിരുന്നു. അയൽഗ്രാമങ്ങൾക്ക് പരസ്പരം വലിയ മതിപ്പുണ്ടാകാറില്ല.
    - verses: യോഹന്നാൻ 1:47–48
      title: ഉള്ളിൽ കപടമില്ലാത്തവൻ
      text: നഥനയേൽ വരുന്നതു കണ്ട് യേശു അവനെ കപടമില്ലാത്ത ഒരു സാക്ഷാൽ യിസ്രായേല്യൻ എന്നു വിളിക്കുന്നു. നീ എന്നെ എങ്ങനെ അറിയും എന്നു നഥനയേൽ ചോദിക്കുന്നു. ഫിലിപ്പൊസ് വിളിക്കുംമുമ്പെ അത്തിയുടെ കീഴിൽ അവനെ കണ്ടു എന്ന് യേശു പറയുന്നു.
      easy_to_miss: യിസ്രായേലിന്റെ പിതാവായ യാക്കോബ് ചതിക്കു പേരുകേട്ടവനായിരുന്നു (ഉല്പത്തി 27:35). നഥനയേൽ ചതിയില്ലാത്ത ഒരു യിസ്രായേല്യനാണ്.
    - verses: യോഹന്നാൻ 1:49
      title: ദൈവപുത്രൻ, യിസ്രായേലിന്റെ രാജാവ്
      text: 'നഥനയേൽ ഉത്തരം പറയുന്നു: റബ്ബീ, നീ ദൈവപുത്രൻ, നീ യിസ്രായേലിന്റെ രാജാവ്.'
      easy_to_miss: 46-ാം വാക്യത്തിലെ സംശയാലു ഈ അദ്ധ്യായത്തിലെ ഏറ്റവും നിറഞ്ഞ ഏറ്റുപറച്ചിലുകളിൽ ഒന്നു നടത്തുന്നു.
    - verses: യോഹന്നാൻ 1:50–51
      title: സ്വർഗ്ഗം തുറന്നിരിക്കുന്നു
      text: 'ഇതിലും വലിയവ നീ കാണും എന്ന് യേശു പറയുന്നു: സ്വർഗ്ഗം തുറന്നിരിക്കുന്നതും ദൈവദൂതന്മാർ മനുഷ്യപുത്രന്റെ അടുക്കൽ കയറുന്നതും ഇറങ്ങുന്നതും.'
      easy_to_miss: ഇതു യാക്കോബിന്റെ ഗോവണിയാണ് (ഉല്പത്തി 28:12). സ്വർഗ്ഗവും ഭൂമിയും കൂടിച്ചേരുന്ന സ്ഥലം ഇപ്പോൾ യേശുതന്നെയാണ്.
    people:
    - name: ഫിലിപ്പൊസ്
      role: ബേത്ത്സയിദക്കാരൻ; യേശു നേരിട്ടു വിളിച്ചവൻ. അവൻ നഥനയേലിനെ കൊണ്ടുവരുന്നു.
      name_meaning: “കുതിരകളെ സ്നേഹിക്കുന്നവൻ”
      ml: Philip
    - name: നഥനയേൽ
      role: ഗലീലയിലെ കാനായിൽനിന്നുള്ളവൻ. പലപ്പോഴും ബർത്തൊലൊമായി അപ്പൊസ്തലനുമായി ഒന്നായി കരുതപ്പെടുന്നു.
      name_meaning: “ദൈവം നല്കി”
      ml: Nathanael
    - name: നസറായനായ യേശു
      role: “യോസേഫിന്റെ പുത്രനായ യേശു എന്ന നസറെത്ത്കാരൻ” എന്ന് ഫിലിപ്പൊസ് വിളിക്കുന്നവൻ.
      name_meaning: “കർത്താവ് രക്ഷിക്കുന്നു”
      ml: Jesus of Nazareth
    phrases:
    - term: അത്തിയുടെ കീഴിൽ
      explanation: ഇരിക്കാനും പ്രാർത്ഥിക്കാനും തിരുവെഴുത്തു പഠിക്കാനുമുള്ള സാധാരണ ഇടം. ഓരോരുത്തരും താന്താന്റെ അത്തിയുടെ കീഴിൽ ഇരിക്കുന്നതായി മീഖാ 4:4 സമാധാനത്തെ ചിത്രീകരിക്കുന്നു.
    - term: മനുഷ്യപുത്രൻ
      explanation: തന്നെക്കുറിച്ചു പറയാൻ യേശുവിന് ഏറ്റവും ഇഷ്ടപ്പെട്ട രീതി; ദാനീയേൽ 7:13-ൽനിന്ന്.
    - term: മോശെയും പ്രവാചകന്മാരും
      explanation: 'യെഹൂദതിരുവെഴുത്തുകളെ മുഴുവനായി പേരുചൊല്ലുന്ന രീതി: ന്യായപ്രമാണവും പ്രവാചകന്മാരും.'
    reflection:
      title_en: വന്നു കാൺക
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        പലർക്കുമുള്ള ആദ്യപ്രതികരണം തന്നെയാണ് നഥനയേലിന്റേതും: എനിക്കു സംശയമുണ്ട്. നസറെത്ത് ഒരു പ്രാധാന്യവുമില്ലാത്ത സ്ഥലമായിരുന്നു; അവൻ വളർന്നത് അതിനടുത്തും. ഫിലിപ്പൊസിന് അവനോടു തർക്കിക്കാമായിരുന്നു. തിരുവെഴുത്തുകൾ എണ്ണിപ്പറയുകയോ യേശു പറഞ്ഞതു വിവരിക്കുകയോ ചെയ്യാമായിരുന്നു. പകരം അവൻ മൂന്നു വാക്കുകൾ പറയുന്നു: വന്നു കാൺക.

        അതു ഫലിക്കുന്നത് യേശു നഥനയേലിനെ ഇതിനകം അറിയുന്നതുകൊണ്ടാണ്. ഫിലിപ്പൊസ് അവനെ വിളിക്കുംമുമ്പെ അത്തിയുടെ കീഴിൽ യേശു അവനെ കണ്ടു. ക്ഷണം ഒരു ആശയത്തിലേക്കല്ല; എല്ലായ്പ്പോഴും ശ്രദ്ധിച്ചുകൊണ്ടിരുന്ന ഒരു വ്യക്തിയിലേക്കാണ്. നഥനയേലിന്റെ സംശയങ്ങളോടു പോരാടുന്നില്ല. യേശുവിനെ കണ്ടുമുട്ടുന്നതോടെ അവ മറികടക്കപ്പെടുന്നു; അത്രമാത്രം.

        നമ്മിൽ പലർക്കും സംശയിക്കുന്ന ഒരു സ്നേഹിതനോ കുടുംബാംഗമോ ഉണ്ട്. തർക്കിക്കാനാണ് പ്രലോഭനം. ഈ സുവിശേഷം കൂടുതൽ സൌമ്യവും കൂടുതൽ പ്രയാസമുള്ളതുമായ ഒന്നു നിർദ്ദേശിക്കുന്നു: അവർക്കു നേരിട്ടു കാണാൻ കഴിയുന്നിടത്തേക്ക് അവരെ കൊണ്ടുവരിക; യേശു അവരെ ഇതിനകം കണ്ടിരിക്കുന്നു എന്നു വിശ്വസിക്കുക. ക്ഷണമാണ് നമ്മുടെ ജോലി. പിന്നെ സംഭവിക്കുന്നത് അവരും അവനും തമ്മിലുള്ളതാണ്.
      title_ml: Come and see
    week:
      question: നിങ്ങളെ ആദ്യം യേശുവിന്റെ അടുക്കലേക്കോ പള്ളിയിലേക്കോ കൊണ്ടുവന്നത് ആരാണ്? അവർ ചെയ്ത എന്താണ് സഹായിച്ചത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: 'ഈ മാസം പള്ളിയിലെ ഒരു പരിപാടിക്ക് ഒരു സ്നേഹിതനെ ക്ഷണിക്കുക: ഒരു കുർബ്ബാന, ഒരു യുവജനസമ്മേളനം, അല്ലെങ്കിൽ ഒരു പെരുന്നാൾ.'
      prayer: കർത്താവായ യേശുവേ, ആരും വിളിക്കുംമുമ്പെ അത്തിയുടെ കീഴിൽ നീ നഥനയേലിനെ കണ്ടു. ഞങ്ങൾ സ്നേഹിക്കുന്ന സംശയിക്കുന്നവരെ നീ കാണേണമേ; “വന്നു കാൺക” എന്നു പറയാൻ ഞങ്ങൾക്കു ധൈര്യം തരേണമേ; ഞങ്ങൾക്കെല്ലാവർക്കും സ്വർഗ്ഗം തുറക്കേണമേ. ആമേൻ.
