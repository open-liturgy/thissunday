    hero_quote:
      text: ഈ പുരുഷാരം ഇപ്പോൾ മൂന്നു നാളായി എന്നോടുകൂടെ പാർക്കുന്നു; അവർക്കു ഭക്ഷിപ്പാൻ ഒന്നും ഇല്ലായ്കകൊണ്ടു അവരെക്കുറിച്ചു എനിക്കു മനസ്സലിവു തോന്നുന്നു.
