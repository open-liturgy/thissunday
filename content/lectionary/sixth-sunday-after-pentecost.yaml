tagline: 'Compassion for a hungry crowd: four thousand fed'
standfirst: A crowd has been with Jesus for three days and has nothing left to eat. He says he will not send them home hungry, in case they collapse on the way.
description: Readings for the Sixth Sunday after Pentecost, with Matthew 15:32–39, the feeding of the four thousand, explained in five scenes. Reflection and question.
