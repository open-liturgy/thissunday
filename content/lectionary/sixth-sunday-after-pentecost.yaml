    phrases:
    - term: മനസ്സലിവ്
      explanation: 'ആന്തരികാവയവങ്ങൾ ഇളകുക എന്നർത്ഥമുള്ള ഗ്രീക്ക് വാക്ക്: ആഴമേറിയ, ശരീരത്തിൽപോലും അനുഭവപ്പെടുന്ന കരുണ.'
    - term: വട്ടി
      explanation: അയ്യായിരം പേരെ പോഷിപ്പിച്ചപ്പോഴുള്ള കൊട്ടയിൽനിന്നു വ്യത്യസ്തമായ, വലിയ ഒരുതരം കുട്ട.
    - term: സ്തോത്രം ചെയ്തു
      explanation: ഗ്രീക്കിൽ യൂക്കരിസ്റ്റെയോ. സഭയുടെ ‘യൂക്കരിസ്റ്റ്’ (വിശുദ്ധ കുർബ്ബാന) എന്ന വാക്ക് ഇതിൽനിന്നാണ്.
    reflection:
      title_en: അവർക്കു വിശക്കുന്നതു അവൻ ശ്രദ്ധിച്ചു
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        മൂന്നു ദിവസമായി പുരുഷാരം യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്നു. അവർ തങ്ങളുടെ രോഗികളെ കൊണ്ടുവന്നു, അവർ സൌഖ്യമാകുന്നതു കണ്ടു, ദൈവത്തെ സ്തുതിച്ചു. അവരുടെ ആത്മാക്കൾ പോഷിപ്പിക്കപ്പെട്ടു, അതു മതി എന്നു പറയാൻ എളുപ്പമായിരുന്നു. യേശു അങ്ങനെ പറഞ്ഞില്ല. അവർക്കു വിശക്കുന്നുവെന്ന് അവൻ കണ്ടു; വീട്ടിലേക്കുള്ള നീണ്ട നടത്തത്തിൽ അവർ തളർന്നുപോകുമോ എന്ന് അവൻ ആകുലപ്പെട്ടു.

        അവന്റെ മനസ്സലിവു പ്രായോഗികമായിരുന്നു. ഭക്ഷണം, ദൂരം, ക്ഷീണിച്ച ശരീരങ്ങൾ എന്നിവയെക്കുറിച്ചായിരുന്നു അത്. ഒരു പുരുഷാരത്തെ അവൻ പോഷിപ്പിക്കുന്നതു ശിഷ്യന്മാർ മുമ്പു കണ്ടിരുന്നു; എന്നിട്ടും വീണ്ടും അത് എങ്ങനെ സാധിക്കുമെന്ന് അവർക്കു സങ്കല്പിക്കാൻ കഴിഞ്ഞില്ല. അവരുടെ പക്കൽ എന്തുണ്ട് എന്ന് യേശു ചോദിച്ചു, അതിനായി വാഴ്ത്തി, അതു മതിയായതാക്കി.

        വിശ്വാസം ചിലപ്പോൾ ആത്മീയം മാത്രമായി കണക്കാക്കപ്പെടുന്നു. ഈ സുവിശേഷം മറിച്ചാണ് പറയുന്നത്. ആളുകളുടെ ശരീരത്തെ പരിപാലിക്കുന്നതും, വിശക്കുന്നവരെ ഊട്ടുന്നതും, ഒരാളെ വീട്ടിലെത്തിക്കുന്നതും, പ്രായമായ ഒരു അയൽക്കാരൻ ഭക്ഷണം കഴിച്ചുവെന്ന് ഉറപ്പാക്കുന്നതും സുവിശേഷത്തിന്റെ ഭാഗമാണ്. ഒരേ മലഞ്ചെരിവിൽവെച്ച് യേശു ആത്മാക്കളെയും വയറുകളെയും പോഷിപ്പിച്ചു.
      title_ml: He noticed they were hungry
    week:
      question: നാം ഇതുവരെ ശ്രദ്ധിക്കാത്ത ഒരു പ്രായോഗിക ആവശ്യം നമുക്കു ചുറ്റും ആർക്കാണുള്ളത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: 'അതില്ലാതെ ബുദ്ധിമുട്ടുന്ന ഒരാളുടെ ഒരു പ്രായോഗിക ആവശ്യം ഈ ആഴ്ച നിറവേറ്റുക: ഒരു നേരത്തെ ഭക്ഷണം, ഒരു യാത്ര, ഒരു അറ്റകുറ്റപ്പണി.'
      prayer: കർത്താവായ യേശുവേ, വിശക്കുന്ന പുരുഷാരത്തോടു നിനക്കു മനസ്സലിവു തോന്നി. ഞങ്ങൾക്കു ചുറ്റുമുള്ള ആവശ്യങ്ങൾ കാണാൻ കണ്ണുകളും, അവ നിറവേറ്റാൻ കൈകളും, ലഭിച്ചതിനെല്ലാം നന്ദിയുള്ള ഹൃദയവും ഞങ്ങൾക്കു തരേണമേ. ആമേൻ.
