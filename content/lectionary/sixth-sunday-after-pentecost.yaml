one_minute:
  what_happens: After three days of teaching and healing by the Sea of Galilee, Jesus has compassion on the hungry crowd. The disciples have seven loaves and a few small fish. He gives thanks, breaks them, and four thousand men, plus women and children, are fed.
  why_this_sunday: A month after the feeding of the five thousand, the Church reads a second feeding. Jesus does it again, for a different crowd.
  take_with_you: Jesus noticed that people were hungry, and that some had a long way to go home. Faith pays attention to bodies too.
readings_thread: The cloud fills the tabernacle and leads Israel on its journey, and the psalm prays that God will answer in the day of trouble. Isaiah says the Lord’s purposes will stand. Paul writes that for us there is one God, from whom all things come.
key_verse:
  ref: Matthew 15:32
  ml: 'എന്നാൽ യേശു തന്റെ ശിഷ്യന്മാരെ അടുക്കെവിളിച്ചു: ഈ പുരുഷാരം ഇപ്പോൾ മൂന്നു നാളായി എന്നോടുകൂടെ പാർക്കുന്നു; അവർക്കു ഭക്ഷിപ്പാൻ ഒന്നും ഇല്ലായ്കകൊണ്ടു അവരെക്കുറിച്ചു എനിക്കു മനസ്സലിവു തോന്നുന്നു; അവരെ പട്ടിണിയായി വിട്ടയപ്പാൻ മനസ്സുമില്ല; അവർ വഴിയിൽവെച്ചു തളർന്നുപോയേക്കും എന്നു പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: Jesus summoned his disciples and said, “I have compassion on the multitude, because they continue with me now three days and have nothing to eat. I don’t want to send them away fasting, or they might faint on the way.”
  en_translation: World English Bible
scenes:
- verses: Matthew 15:32
  title: Three days with nothing
  text: 'Jesus calls his disciples: I have compassion on the crowd. They have been with me three days and have nothing to eat. I do not want to send them away hungry, in case they faint on the way.'
  easy_to_miss: This time Jesus raises the problem, not the disciples.
- verses: Matthew 15:33
  title: Where would we get bread?
  text: 'The disciples ask: where could we get enough bread in this deserted place to feed such a crowd?'
  easy_to_miss: They have already seen five thousand fed (Matthew 14). They still ask the same question.
- verses: Matthew 15:34–35
  title: Seven loaves
  text: How many loaves do you have? Seven, and a few small fish. He tells the crowd to sit on the ground.
  easy_to_miss: Jesus always starts with what they have.
- verses: Matthew 15:36
  title: He gave thanks
  text: He takes the seven loaves and the fish, gives thanks, breaks them and gives them to the disciples, who give them to the crowd.
  easy_to_miss: 'Here Matthew uses the word “gave thanks”: in Greek, eucharisteo, the root of “Eucharist”.'
- verses: Matthew 15:37–39
  title: Seven baskets
  text: All eat and are satisfied, and seven baskets of leftovers are collected. Four thousand men are fed, besides women and children. Then he sends them away and crosses by boat.
  easy_to_miss: This feeding comes right after Jesus healed the Canaanite woman’s daughter and many in the region. Crumbs for the outsiders became a full meal.
people:
- name: The crowd
  ml: പുരുഷാരം
  role: People who stayed with Jesus for three days, bringing the lame, blind and mute to be healed.
  name_meaning: —
phrases:
- term: Compassion
  explanation: 'The Greek word describes being moved in one’s inner organs: a deep, physical pity.'
- term: Baskets
  explanation: A different, larger kind of basket than in the feeding of the five thousand.
- term: Gave thanks
  explanation: Eucharisteo in Greek. The Church’s word Eucharist, the Qurbana, comes from it.
reflection:
  title_en: He noticed they were hungry
  title_ml: അവർക്കു വിശക്കുന്നതു അവൻ ശ്രദ്ധിച്ചു
  read_time: A three-minute read
  body: |-
    The crowd had been with Jesus for three days. They had brought their sick, watched them healed and praised God. It would be easy to say their souls had been fed and that was enough. Jesus did not say that. He saw they were hungry and worried they would faint on the long walk home.

    His compassion was practical. It was about food, distance and tired bodies. The disciples had seen him feed a crowd before, and still could not imagine how to do it again. Jesus asked what they had, gave thanks for it, and made it enough.

    Faith is sometimes treated as only spiritual. This Gospel says otherwise. Caring for people’s bodies, feeding the hungry, giving someone a lift home, making sure an elderly neighbour has eaten: these are part of the Gospel too. Jesus fed souls and stomachs on the same hillside.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Who around us has a practical need we have not noticed?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: 'Meet one practical need this week: a meal, a lift, a repair, for someone who would struggle without it.'
  prayer: Lord Jesus, you had compassion on the hungry crowd. Give us eyes to see the needs around us, hands to meet them, and thankful hearts for all we have been given. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം ആറാം ഞായർ
      ml: Sixth Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: 'വിശക്കുന്ന പുരുഷാരത്തോടു മനസ്സലിവ്: നാലായിരം പേർ പോഷിപ്പിക്കപ്പെടുന്നു'
    standfirst: ഒരു പുരുഷാരം മൂന്നു നാളായി യേശുവിനോടുകൂടെ ഉണ്ട്; ഭക്ഷിപ്പാൻ ഇനി ഒന്നും ബാക്കിയില്ല. വഴിയിൽവെച്ചു തളർന്നുപോയേക്കും എന്നതിനാൽ അവരെ പട്ടിണിയായി വിട്ടയപ്പാൻ തനിക്കു മനസ്സില്ല എന്ന് അവൻ പറയുന്നു.
    description: പെന്തിക്കോസ്തിക്കു ശേഷം ആറാം ഞായറിലെ വായനകൾ, നാലായിരം പേരെ പോഷിപ്പിക്കുന്ന മത്തായി 15:32–39 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: ഗലീലക്കടല്ക്കരയിൽ മൂന്നു ദിവസത്തെ ഉപദേശത്തിനും സൌഖ്യമാക്കലിനും ശേഷം, വിശക്കുന്ന പുരുഷാരത്തോടു യേശുവിനു മനസ്സലിവു തോന്നുന്നു. ശിഷ്യന്മാരുടെ പക്കൽ ഏഴ് അപ്പവും കുറെ ചെറുമീനും ഉണ്ട്. അവൻ അവയെ വാഴ്ത്തി നുറുക്കുന്നു; സ്ത്രീകളെയും പൈതങ്ങളെയും കൂടാതെ നാലായിരം പുരുഷന്മാർ ഭക്ഷിക്കുന്നു.
      why_this_sunday: അയ്യായിരം പേരെ പോഷിപ്പിച്ചതു വായിച്ച് ഒരു മാസത്തിനു ശേഷം, സഭ രണ്ടാമതൊരു പോഷിപ്പിക്കൽ വായിക്കുന്നു. മറ്റൊരു പുരുഷാരത്തിനുവേണ്ടി യേശു അതു വീണ്ടും ചെയ്യുന്നു.
      take_with_you: ആളുകൾക്കു വിശക്കുന്നുവെന്നും ചിലർക്കു വീട്ടിലേക്കു ദൂരം ഏറെയുണ്ടെന്നും യേശു ശ്രദ്ധിച്ചു. വിശ്വാസം ശരീരത്തെയും ശ്രദ്ധിക്കുന്നു.
    readings_thread: മേഘം സമാഗമനകൂടാരം നിറയ്ക്കുകയും യിസ്രായേലിനെ യാത്രയിൽ നയിക്കുകയും ചെയ്യുന്നു; കഷ്ടദിവസത്തിൽ ദൈവം ഉത്തരം അരുളേണം എന്നു സങ്കീർത്തനം പ്രാർത്ഥിക്കുന്നു. കർത്താവിന്റെ ആലോചന നിലനില്ക്കുമെന്നു യെശയ്യാവു പറയുന്നു. സകലവും ആരിൽനിന്നു വരുന്നുവോ ആ ഏകദൈവമേ നമുക്കുള്ളൂ എന്നു പൌലൊസ് എഴുതുന്നു.
    scenes:
    - verses: മത്തായി 15:32
      title: മൂന്നു നാൾ, ഒന്നുമില്ലാതെ
      text: 'യേശു ശിഷ്യന്മാരെ അടുക്കെ വിളിക്കുന്നു: ഈ പുരുഷാരം ഇപ്പോൾ മൂന്നു നാളായി എന്നോടുകൂടെ പാർക്കുന്നു; അവർക്കു ഭക്ഷിപ്പാൻ ഒന്നും ഇല്ലായ്കകൊണ്ടു അവരെക്കുറിച്ചു എനിക്കു മനസ്സലിവു തോന്നുന്നു. അവർ വഴിയിൽവെച്ചു തളർന്നുപോയേക്കും; അവരെ പട്ടിണിയായി വിട്ടയപ്പാൻ മനസ്സുമില്ല.'
      easy_to_miss: ഇത്തവണ പ്രശ്നം ഉന്നയിക്കുന്നതു ശിഷ്യന്മാരല്ല, യേശുവാണ്.
    - verses: മത്തായി 15:33
      title: അപ്പം എവിടെനിന്ന്?
      text: 'ശിഷ്യന്മാർ ചോദിക്കുന്നു: ഇത്ര വലിയ പുരുഷാരത്തിന്നു തൃപ്തിവരുത്തുവാൻ മതിയായ അപ്പം ഈ കാട്ടിൽ നമുക്കു എവിടെനിന്നു?'
      easy_to_miss: അയ്യായിരം പേർ പോഷിപ്പിക്കപ്പെടുന്നത് അവർ ഇതിനകം കണ്ടതാണ് (മത്തായി 14). എന്നിട്ടും അതേ ചോദ്യം അവർ ചോദിക്കുന്നു.
    - verses: മത്തായി 15:34–35
      title: ഏഴ് അപ്പം
      text: നിങ്ങളുടെ പക്കൽ എത്ര അപ്പം ഉണ്ടു? ഏഴ്; കുറെ ചെറുമീനും ഉണ്ട്. അവൻ പുരുഷാരത്തോടു നിലത്തു ഇരിപ്പാൻ കല്പിക്കുന്നു.
      easy_to_miss: അവരുടെ കൈയിലുള്ളതിൽനിന്നാണ് യേശു എപ്പോഴും തുടങ്ങുന്നത്.
    - verses: മത്തായി 15:36
      title: അവൻ വാഴ്ത്തി
      text: അവൻ ആ ഏഴു അപ്പവും മീനും എടുത്തു വാഴ്ത്തി നുറുക്കി ശിഷ്യന്മാരുടെ പക്കലും, ശിഷ്യന്മാർ പുരുഷാരത്തിന്നും കൊടുക്കുന്നു.
      easy_to_miss: ഇവിടെ മത്തായി ഉപയോഗിക്കുന്ന ഗ്രീക്ക് വാക്ക് ‘യൂക്കരിസ്റ്റെയോ’ (സ്തോത്രം ചെയ്തു) ആണ്; ‘യൂക്കരിസ്റ്റ്’ എന്ന വാക്കിന്റെ മൂലം.
    - verses: മത്തായി 15:37–39
      title: ഏഴു വട്ടി
      text: എല്ലാവരും തിന്നു തൃപ്തരാകുന്നു; ശേഷിച്ച കഷണം അവർ ഏഴു വട്ടി നിറച്ചെടുക്കുന്നു. തിന്നവർ സ്ത്രീകളെയും പൈതങ്ങളെയും കൂടാതെ നാലായിരം പുരുഷന്മാർ. പിന്നെ അവൻ പുരുഷാരത്തെ പറഞ്ഞയച്ചിട്ടു പടകിൽ കയറി അക്കരെ പോകുന്നു.
      easy_to_miss: കനാന്യസ്ത്രീയുടെ മകളെയും ആ പ്രദേശത്തെ അനേകരെയും സൌഖ്യമാക്കിയതിനു തൊട്ടുപിന്നാലെയാണ് ഈ പോഷിപ്പിക്കൽ. പുറത്തുള്ളവർക്കുള്ള നുറുക്കുകൾ ഒരു പൂർണ്ണഭക്ഷണമായി.
    people:
    - name: പുരുഷാരം
      role: മുടന്തരെയും കുരുടരെയും ഊമരെയും സൌഖ്യത്തിനായി കൊണ്ടുവന്ന്, മൂന്നു ദിവസം യേശുവിനോടുകൂടെ പാർത്തവർ.
      name_meaning: —
