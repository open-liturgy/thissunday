one_minute:
  what_happens: Mary Magdalene and the other Mary go to the tomb at dawn. An angel tells them Jesus is risen. Running to tell the disciples, they meet Jesus himself. The guards are paid to lie. On a mountain in Galilee Jesus sends the eleven to all nations.
  why_this_sunday: This is the feast of feasts, the resurrection of Christ, the centre of the whole Church year. Great Lent and Holy Week end here.
  take_with_you: The women ran from the tomb “with fear and great joy”. Easter does not remove fear at once. It puts joy beside it.
readings_thread: Leviticus describes the Day of Atonement, and Isaiah calls Jerusalem to arise and shine because its light has come. Peter tells the crowd that God raised Jesus from the dead, and Paul says that if Christ is not raised, our faith is empty.
key_verse:
  ref: Matthew 28:20
  ml: ഞാൻ നിങ്ങളോടു കല്പിച്ചതു ഒക്കെയും പ്രമാണിപ്പാൻ തക്കവണ്ണം ഉപദേശിച്ചുംകൊണ്ടു സകലജാതികളെയും ശിഷ്യരാക്കിക്കൊൾവിൻ; ഞാനോ ലോകാവസാനത്തോളം എല്ലാനാളും നിങ്ങളോടുകൂടെ ഉണ്ടു എന്നു അരുളിച്ചെയ്തു.
  ml_translation: Sathyavedapusthakam, 1910
  en: teaching them to observe all things that I commanded you. Behold, I am with you always, even to the end of the age.” Amen.
  en_translation: World English Bible
scenes:
- verses: Matthew 28:1–4
  title: An earthquake at dawn
  text: As the first day of the week dawns, the two Marys go to see the tomb. There is a great earthquake. An angel rolls back the stone and sits on it. The guards shake with fear and become like dead men.
  easy_to_miss: The stone is rolled away not to let Jesus out, but to let the women see in.
- verses: Matthew 28:5–7
  title: He is not here
  text: Do not be afraid, the angel tells the women. You are looking for Jesus who was crucified. He is not here; he has risen, as he said. Come and see the place, then go quickly and tell his disciples.
  easy_to_miss: The guards, who were armed, are the ones who collapse. The women are told not to be afraid.
- verses: Matthew 28:8–10
  title: Fear and great joy
  text: 'They run from the tomb with fear and great joy. Suddenly Jesus meets them: Rejoice! They take hold of his feet and worship him. Go and tell my brothers to go to Galilee, he says.'
  easy_to_miss: Jesus calls the disciples who ran away “my brothers”. Easter begins with forgiveness.
- verses: Matthew 28:11–15
  title: The guards’ story
  text: Some of the guards report to the chief priests, who pay them to say the disciples stole the body while they slept.
  easy_to_miss: Matthew says this story was still told “to this day”. The empty tomb was never in dispute, only the explanation.
- verses: Matthew 28:16–20
  title: To all nations
  text: 'The eleven go to the mountain in Galilee. They worship him, though some doubt. Jesus says: all authority has been given to me. Go and make disciples of all nations, baptising and teaching them. I am with you always.'
  easy_to_miss: “Some doubted”, even then, even there. Jesus sends them out anyway.
