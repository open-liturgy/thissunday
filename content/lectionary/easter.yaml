tagline: He is not here. He has risen
standfirst: At dawn two women come to see the tomb. The earth shakes, an angel rolls the stone away and sits on it, and the guards fall down like dead men. He is not here, the angel says.
description: Readings for Easter (Kyomtho), with Matthew 28:1–20, the resurrection and the Great Commission, explained in five scenes. Reflection and question.
