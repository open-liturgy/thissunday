  name_meaning: —
phrases:
- term: Kyomtho
  explanation: Syriac for resurrection. The Malankara Church’s name for Easter.
- term: First day of the week
  explanation: Sunday. Christians have gathered on this day ever since because it is the day of the resurrection.
- term: Great Commission
  explanation: 'Jesus’ last command in Matthew: make disciples of all nations. The Church in India traces its own beginning to it through St. Thomas.'
reflection:
  title_en: Fear and great joy
  title_ml: ഭയവും മഹാസന്തോഷവും
  read_time: A three-minute read
  body: |-
    The women came to the tomb expecting grief. They had watched Jesus die and seen where he was laid. They came to sit with a dead friend. Instead the ground shook, a stone rolled, and an angel told them to come and see that he was not there.

    Matthew says they ran away “with fear and great joy”. Both at once. Easter did not make their fear disappear in a moment. They had just been through the worst week of their lives. But joy came and stood beside the fear, and then Jesus himself met them on the road and said: rejoice.

    Many of us come to Easter carrying something: an illness, a loss, a worry that will still be there on Monday. The resurrection does not pretend those things are not real. It tells us they do not have the last word. Christ is risen, and he is with us always, to the end of the age.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What is one fear you are carrying today? What would it look like to carry joy alongside it?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Greet each person at home this week with the Easter greeting, and share an Easter meal with someone who would otherwise eat alone.
  prayer: Christ is risen from the dead! Lord Jesus, you met the women on the road and said “rejoice”. Meet us in our fear, fill us with your joy, and send us out to tell what we have seen. Amen.
translations:
  ml:
    name:
      en: ഉയിർപ്പു പെരുന്നാൾ (ക്യംതാ)
      ml: Easter (Kyomtho)
    season:
      en: ക്യംതാ
      gloss: ഉയിർപ്പുകാലം
    tagline: അവൻ ഇവിടെ ഇല്ല; ഉയിർത്തെഴുന്നേറ്റു
    standfirst: പുലർച്ചെ രണ്ടു സ്ത്രീകൾ കല്ലറ കാണ്മാൻ വരുന്നു. ഭൂമി കുലുങ്ങുന്നു, ഒരു ദൂതൻ കല്ലു ഉരുട്ടിനീക്കി അതിന്മേൽ ഇരിക്കുന്നു, കാവൽക്കാർ മരിച്ചവരെപ്പോലെ ആകുന്നു. അവൻ ഇവിടെ ഇല്ല എന്നു ദൂതൻ പറയുന്നു.
    description: ഉയിർപ്പു പെരുന്നാളിലെ (ക്യംതാ) വായനകൾ, ഉയിർപ്പിനെയും മഹാനിയോഗത്തെയും കുറിച്ചുള്ള മത്തായി 28:1–20 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: മഗ്ദലക്കാരത്തി മറിയയും മറ്റേ മറിയയും പുലർച്ചെ കല്ലറയ്ക്കൽ ചെല്ലുന്നു. യേശു ഉയിർത്തെഴുന്നേറ്റു എന്ന് ഒരു ദൂതൻ അവരോടു പറയുന്നു. ശിഷ്യന്മാരോട് അറിയിക്കാൻ ഓടുമ്പോൾ അവർ യേശുവിനെത്തന്നെ കണ്ടുമുട്ടുന്നു. കാവൽക്കാർക്കു കള്ളം പറയാൻ പണം കൊടുക്കുന്നു. ഗലീലയിലെ ഒരു മലയിൽവെച്ച് യേശു പതിനൊന്നു പേരെയും സകലജാതികളിലേക്കും അയക്കുന്നു.
      why_this_sunday: പെരുന്നാളുകളുടെ പെരുന്നാളായ ഇത് ക്രിസ്തുവിന്റെ ഉയിർപ്പാണ്, സഭാവർഷത്തിന്റെ മുഴുവൻ കേന്ദ്രം. വലിയ നോമ്പും കഷ്ടാനുഭവആഴ്ചയും ഇവിടെ അവസാനിക്കുന്നു.
      take_with_you: സ്ത്രീകൾ “ഭയത്തോടും മഹാസന്തോഷത്തോടും” കൂടി കല്ലറ വിട്ടോടി. ഉയിർപ്പ് ഭയത്തെ ഉടനെ നീക്കുന്നില്ല; അത് ഭയത്തിന്റെ അരികിൽ സന്തോഷത്തെ നിർത്തുന്നു.
    readings_thread: പാപപരിഹാരദിവസത്തെക്കുറിച്ചു ലേവ്യപുസ്തകം വിവരിക്കുന്നു; നിന്റെ പ്രകാശം വന്നിരിക്കുകയാൽ എഴുന്നേറ്റു പ്രകാശിക്ക എന്ന് യെശയ്യാവ് യെരൂശലേമിനെ വിളിക്കുന്നു. ദൈവം യേശുവിനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു എന്നു പത്രൊസ് പുരുഷാരത്തോടു പറയുന്നു; ക്രിസ്തു ഉയിർത്തെഴുന്നേറ്റിട്ടില്ലെങ്കിൽ നമ്മുടെ വിശ്വാസം വ്യർത്ഥം എന്നു പൌലൊസ് പറയുന്നു.
    scenes:
    - verses: മത്തായി 28:1–4
      title: പുലർച്ചെ ഒരു ഭൂകമ്പം
      text: ആഴ്ചവട്ടത്തിന്റെ ഒന്നാം ദിവസം വെളുക്കുമ്പോൾ രണ്ടു മറിയമാരും കല്ലറ കാണ്മാൻ ചെല്ലുന്നു. വലിയോരു ഭൂകമ്പം ഉണ്ടാകുന്നു. ഒരു ദൂതൻ കല്ലു ഉരുട്ടിനീക്കി അതിന്മേൽ ഇരിക്കുന്നു. കാവൽക്കാർ പേടിച്ചു വിറെച്ചു മരിച്ചവരെപ്പോലെ ആകുന്നു.
      easy_to_miss: കല്ലു ഉരുട്ടിനീക്കുന്നത് യേശുവിനെ പുറത്തിറക്കാനല്ല, സ്ത്രീകൾക്ക് അകത്തേക്കു കാണാനാണ്.
    - verses: മത്തായി 28:5–7
      title: അവൻ ഇവിടെ ഇല്ല
      text: ഭയപ്പെടേണ്ടാ എന്നു ദൂതൻ സ്ത്രീകളോടു പറയുന്നു. ക്രൂശിക്കപ്പെട്ട യേശുവിനെ നിങ്ങൾ അന്വേഷിക്കുന്നു. അവൻ ഇവിടെ ഇല്ല; താൻ പറഞ്ഞതുപോലെ ഉയിർത്തെഴുന്നേറ്റു. അവൻ കിടന്ന സ്ഥലം വന്നു കാണ്മിൻ; പിന്നെ വേഗം ചെന്ന് അവന്റെ ശിഷ്യന്മാരോടു പറവിൻ.
      easy_to_miss: ആയുധധാരികളായ കാവൽക്കാരാണ് വീണുപോകുന്നത്. ഭയപ്പെടേണ്ടാ എന്നു പറയപ്പെടുന്നത് സ്ത്രീകളോടാണ്.
    - verses: മത്തായി 28:8–10
      title: ഭയവും മഹാസന്തോഷവും
      text: അവർ ഭയത്തോടും മഹാസന്തോഷത്തോടും കൂടി കല്ലറ വിട്ട് ഓടുന്നു. പെട്ടെന്ന് യേശു അവരെ എതിരേറ്റ്, “നിങ്ങൾക്കു വന്ദനം” എന്നു പറയുന്നു. അവർ അവന്റെ കാൽ പിടിച്ച് അവനെ നമസ്കരിക്കുന്നു. നിങ്ങൾ പോയി എന്റെ സഹോദരന്മാരോടു ഗലീലെക്കു പോകുവാൻ പറവിൻ എന്ന് അവൻ പറയുന്നു.
      easy_to_miss: ഓടിപ്പോയ ശിഷ്യന്മാരെ യേശു “എന്റെ സഹോദരന്മാർ” എന്നു വിളിക്കുന്നു. ഉയിർപ്പ് ക്ഷമയോടെയാണ് ആരംഭിക്കുന്നത്.
    - verses: മത്തായി 28:11–15
      title: കാവൽക്കാരുടെ കഥ
      text: കാവല്ക്കൂട്ടത്തിൽ ചിലർ മഹാപുരോഹിതന്മാരോടു വിവരം അറിയിക്കുന്നു. തങ്ങൾ ഉറങ്ങുമ്പോൾ ശിഷ്യന്മാർ ശരീരം കട്ടുകൊണ്ടുപോയി എന്നു പറയാൻ അവർ പടയാളികൾക്കു പണം കൊടുക്കുന്നു.
      easy_to_miss: ഈ കഥ “ഇന്നുവരെ” പറഞ്ഞുവരുന്നു എന്നു മത്തായി പറയുന്നു. ഒഴിഞ്ഞ കല്ലറയെക്കുറിച്ച് ഒരിക്കലും തർക്കമുണ്ടായിരുന്നില്ല; വിശദീകരണത്തെക്കുറിച്ചു മാത്രം.
    - verses: മത്തായി 28:16–20
      title: സകലജാതികളിലേക്കും
      text: 'പതിനൊന്നു ശിഷ്യന്മാർ ഗലീലയിലെ മലയിലേക്കു പോകുന്നു. അവർ അവനെ നമസ്കരിക്കുന്നു; ചിലരോ സംശയിക്കുന്നു. യേശു പറയുന്നു: സ്വർഗ്ഗത്തിലും ഭൂമിയിലും സകല അധികാരവും എനിക്കു നല്കപ്പെട്ടിരിക്കുന്നു. പുറപ്പെട്ടു സ്നാനം കഴിപ്പിച്ചും ഉപദേശിച്ചുംകൊണ്ടു സകലജാതികളെയും ശിഷ്യരാക്കിക്കൊൾവിൻ. ഞാനോ ലോകാവസാനത്തോളം എല്ലാനാളും നിങ്ങളോടുകൂടെ ഉണ്ടു.'
      easy_to_miss: “ചിലരോ സംശയിച്ചു”; അപ്പോഴും, അവിടെയും. എന്നിട്ടും യേശു അവരെ അയക്കുന്നു.
    people:
    - name: മഗ്ദലക്കാരത്തി മറിയ
      role: മഗ്ദലയിൽനിന്നുള്ള യേശുവിന്റെ അനുയായി; കല്ലറയ്ക്കൽ ആദ്യം എത്തിയവൾ.
      name_meaning: “മഗ്ദലക്കാരി”; ഗലീലക്കടൽത്തീരത്തെ ഒരു പട്ടണം
      ml: Mary Magdalene
    - name: മറ്റേ മറിയ
      role: ഒരുപക്ഷേ യാക്കോബിന്റെയും യോസെയുടെയും അമ്മ (മത്തായി 27:56).
      name_meaning: എബ്രായയിൽ മിര്യാം
      ml: The other Mary
    - name: പതിനൊന്നു ശിഷ്യന്മാർ
      role: യൂദാ ഒഴികെയുള്ള അപ്പൊസ്തലന്മാർ; സകലജാതികളിലേക്കും അയക്കപ്പെട്ടവർ.
      name_meaning: —
      ml: The eleven
    phrases:
    - term: ക്യംതാ
      explanation: ഉയിർപ്പ് എന്നതിന്റെ സുറിയാനി. ഉയിർപ്പു പെരുന്നാളിനു മലങ്കരസഭ നല്കുന്ന പേര്.
    - term: ആഴ്ചവട്ടത്തിന്റെ ഒന്നാം ദിവസം
      explanation: ഞായറാഴ്ച. ഉയിർപ്പിന്റെ ദിവസമായതിനാൽ അന്നുമുതൽ ക്രിസ്ത്യാനികൾ ഈ ദിവസം ഒരുമിച്ചുകൂടുന്നു.
    - term: മഹാനിയോഗം
      explanation: 'മത്തായിയിൽ യേശുവിന്റെ അവസാന കല്പന: സകലജാതികളെയും ശിഷ്യരാക്കുക. മാർത്തോമ്മാശ്ലീഹാ വഴി ഭാരതസഭ തന്റെ ആരംഭം ഇതിലേക്കു കണ്ടെത്തുന്നു.'
    reflection:
      title_en: ഭയവും മഹാസന്തോഷവും
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ദുഃഖം പ്രതീക്ഷിച്ചുകൊണ്ടാണ് സ്ത്രീകൾ കല്ലറയ്ക്കൽ വന്നത്. യേശു മരിക്കുന്നത് അവർ കണ്ടിരുന്നു; അവനെ വെച്ച സ്ഥലവും കണ്ടിരുന്നു. മരിച്ചുപോയ ഒരു സ്നേഹിതന്റെ അരികിൽ ഇരിക്കാനാണ് അവർ വന്നത്. പകരം നിലം കുലുങ്ങി, ഒരു കല്ല് ഉരുണ്ടുമാറി, അവൻ അവിടെ ഇല്ല എന്നു വന്നു കാണുവാൻ ഒരു ദൂതൻ അവരോടു പറഞ്ഞു.

        അവർ “ഭയത്തോടും മഹാസന്തോഷത്തോടും” കൂടി ഓടിപ്പോയി എന്നു മത്തായി പറയുന്നു. രണ്ടും ഒരുമിച്ച്. ഉയിർപ്പ് അവരുടെ ഭയത്തെ ഒരു നിമിഷംകൊണ്ട് ഇല്ലാതാക്കിയില്ല. ജീവിതത്തിലെ ഏറ്റവും മോശമായ ആഴ്ചയിലൂടെയാണ് അവർ കടന്നുവന്നത്. പക്ഷേ സന്തോഷം വന്ന് ഭയത്തിന്റെ അരികിൽ നിന്നു; പിന്നെ യേശുതന്നെ വഴിയിൽ അവരെ എതിരേറ്റ്, നിങ്ങൾക്കു വന്ദനം എന്നു പറഞ്ഞു.

        നമ്മിൽ പലരും എന്തെങ്കിലും ചുമന്നുകൊണ്ടാണ് ഉയിർപ്പിലേക്കു വരുന്നത്: ഒരു രോഗം, ഒരു നഷ്ടം, തിങ്കളാഴ്ചയും മാറാതെ നില്ക്കുന്ന ഒരു ആകുലത. അവ യഥാർത്ഥമല്ല എന്ന് ഉയിർപ്പു ഭാവിക്കുന്നില്ല. അവയ്ക്കല്ല അവസാനവാക്ക് എന്ന് അതു പറയുന്നു. ക്രിസ്തു ഉയിർത്തെഴുന്നേറ്റു; ലോകാവസാനത്തോളം എല്ലാനാളും അവൻ നമ്മോടുകൂടെ ഉണ്ട്.
      title_ml: Fear and great joy
    week:
      question: ഇന്നു നിങ്ങൾ ചുമക്കുന്ന ഒരു ഭയം എന്താണ്? അതിനോടൊപ്പം സന്തോഷവും ചുമക്കുക എന്നാൽ എങ്ങനെയായിരിക്കും?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച വീട്ടിലെ ഓരോരുത്തരെയും ഉയിർപ്പിന്റെ അഭിവാദ്യത്തോടെ വന്ദനം ചെയ്യുക. ഒറ്റയ്ക്കു ഭക്ഷണം കഴിക്കേണ്ടിവരുന്ന ഒരാളോടൊപ്പം ഒരു ഉയിർപ്പുഭക്ഷണം പങ്കിടുക.
      prayer: ക്രിസ്തു മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേറ്റു! കർത്താവായ യേശുവേ, വഴിയിൽ സ്ത്രീകളെ എതിരേറ്റ് നീ നിങ്ങൾക്കു വന്ദനം എന്നു പറഞ്ഞു. ഞങ്ങളുടെ ഭയത്തിൽ ഞങ്ങളെ എതിരേല്ക്കേണമേ; നിന്റെ സന്തോഷംകൊണ്ടു ഞങ്ങളെ നിറയ്ക്കേണമേ; ഞങ്ങൾ കണ്ടതു പറയുവാൻ ഞങ്ങളെ അയക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Mark 16:1–8
        ml: മർക്കൊസ് 16:1–8
        note: 'കല്ലു ഉരുട്ടിക്കളഞ്ഞിരിക്കുന്നതു സ്ത്രീകൾ കാണുന്നു: അവൻ ഉയിർത്തെഴുന്നേറ്റു; ഇവിടെ ഇല്ല.'
        printed: St. Mark 16:1-8
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 20:1–18
        ml: യോഹന്നാൻ 20:1–18
        note: കല്ലറയ്ക്കൽ മഗ്ദലക്കാരത്തി മറിയ യേശു തന്നെ പേർചൊല്ലി വിളിക്കുന്നതു കേൾക്കുന്നു.
        printed: St. John 20:1-18
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Leviticus 23:26–32
        ml: ലേവ്യപുസ്തകം 23:26–32
        note: 'പാപപരിഹാരദിവസം: ദൈവസന്നിധിയിൽ നിങ്ങളെത്തന്നേ താഴ്ത്തേണ്ട ദിവസം.'
        printed: Leviticus 23:26-32
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 60:1–7, 11–16; 61:10–62:5
        ml: യെശയ്യാവ് 60:1–7, 11–16; 61:10–62:5
        note: എഴുന്നേറ്റു പ്രകാശിക്ക; നിന്റെ പ്രകാശം വന്നിരിക്കുന്നു.
        printed: Isaiah 60:1-7, 11-16, 61:10-62:5
      - kind: '[KIND]'
        kind_ml: '[KIND ML]'
        ref: '[CHECK SOURCE: Joel : 2:21 -3]'
        ml: '[CHECK SOURCE: Joel : 2:21 -3]'
        printed: 'Joel : 2:21 -3'
        check: 'Printed as ''Joel : 2:21 -3''; the end of the passage is incomplete.'
      holy_qurbana:
      - kind: Acts of the Apostles
        kind_ml: അപ്പൊസ്തലപ്രവൃത്തികൾ
        ref: Acts 2:22–36
        ml: അപ്പൊസ്തലപ്രവൃത്തികൾ 2:22–36
        note: 'പെന്തെക്കൊസ്തിൽ പത്രൊസ്: ദൈവം യേശുവിനെ ഉയിർപ്പിച്ച് കർത്താവും ക്രിസ്തുവുമാക്കി.'
        printed: Acts 2:22-36
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 1 Corinthians 15:1–19
        ml: 1 കൊരിന്ത്യർ 15:1–19
        note: ക്രിസ്തു മരിച്ചു, അടക്കപ്പെട്ടു, മൂന്നാം നാൾ ഉയിർത്തെഴുന്നേറ്റു; അല്ലെങ്കിൽ നമ്മുടെ വിശ്വാസം വ്യർത്ഥം.
        printed: I Corinthians 15:1-19
      - kind: Gospel
