  role: A follower of Jesus from Magdala, first at the tomb.
  name_meaning: “Of Magdala”, a town on the Sea of Galilee
- name: The other Mary
  ml: മറ്റേ മറിയ
  role: Probably the mother of James and Joseph (Matthew 27:56).
  name_meaning: Hebrew Miriam
- name: The eleven
  ml: പതിനൊന്നു ശിഷ്യന്മാർ
