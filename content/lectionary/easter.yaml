        ref: Matthew 28:1–20
        ml: മത്തായി 28:1–20
        note: അവൻ ഇവിടെ ഇല്ല, ഉയിർത്തെഴുന്നേറ്റു. നിങ്ങൾ പുറപ്പെട്ടു സകലജാതികളെയും ശിഷ്യരാക്കുവിൻ. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
