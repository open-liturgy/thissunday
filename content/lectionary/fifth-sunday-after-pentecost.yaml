    hero_quote:
      text: അവൻ ആ അഞ്ചു അപ്പവും രണ്ടു മീനും എടുത്തുകൊണ്ടു സ്വർഗ്ഗത്തേക്കു നോക്കി അവയെ അനുഗ്രഹിച്ചു നുറുക്കി പുരുഷാരത്തിന്നു വിളമ്പുവാൻ ശിഷ്യന്മാരുടെ കയ്യിൽ കൊടുത്തു.
