tagline: Five loaves, two fish, five thousand people
standfirst: The apostles come back tired, and Jesus takes them away to rest. The crowds follow. By evening there are five thousand hungry people and only five loaves and two fish.
description: Readings for the Fifth Sunday after Pentecost, with Luke 9:10–17, the feeding of the five thousand, explained in five scenes. Reflection and question.
hero_quote:
  text: He took the five loaves and the two fish, and looking up to the sky, he blessed them, broke them, and gave them to the disciples to set before the multitude.
  ref: Luke 9:16
