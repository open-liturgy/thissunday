one_minute:
  what_happens: Jesus tries to take the apostles away to rest near Bethsaida, but the crowds follow. He welcomes them, teaches and heals. In the evening the twelve want to send everyone away. He tells them to give the people food, and feeds five thousand with five loaves and two fish.
  why_this_sunday: The evening Gospel and the Qurbana Gospel are the same passage today, so the whole day turns on this one miracle.
  take_with_you: “You give them something to eat.” Jesus uses what we have, even when it is obviously not enough.
readings_thread: Israel brings the first fruits of harvest to God, and the psalm trusts God as the giver of every good thing. Isaiah says those who wait on the Lord will renew their strength. Ananias is sent to Saul, and Paul calls us ambassadors for Christ.
key_verse:
  ref: Luke 9:13
  ml: 'അവൻ അവരോടു: നിങ്ങൾ തന്നേ അവർക്കു ഭക്ഷിപ്പാൻ കൊടുപ്പിൻ എന്നു പറഞ്ഞതിന്നു: അഞ്ചപ്പവും രണ്ടുമീനും അല്ലാതെ അധികം ഞങ്ങളുടെ പക്കൽ ഇല്ല; ഞങ്ങൾ പോയി ഈ സകലജനത്തിന്നും വേണ്ടി ഭോജ്യങ്ങൾ കൊള്ളേണമോ എന്നു അവർ പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: But he said to them, “You give them something to eat.” They said, “We have no more than five loaves and two fish, unless we should go and buy food for all these people.”
  en_translation: World English Bible
scenes:
- verses: Luke 9:10–11
  title: No time to rest
  text: The apostles return and report. Jesus takes them away privately to Bethsaida, but the crowds find out and follow. He welcomes them, speaks about the kingdom and heals those who need it.
  easy_to_miss: Jesus “welcomed” the crowd that interrupted his rest. Luke chose that word carefully.
- verses: Luke 9:12
  title: Send them away
  text: 'Late in the day the twelve say: send the crowd away to find food and lodging, because we are in a deserted place.'
  easy_to_miss: The disciples’ suggestion is sensible and kind. It just leaves Jesus out.
- verses: Luke 9:13–14a
  title: You give them something
  text: You give them something to eat, says Jesus. We have only five loaves and two fish, they answer, unless we buy food for all these people. There are about five thousand men.
  easy_to_miss: Luke counts only the men. With women and children, the crowd was much larger.
- verses: Luke 9:14b–16
  title: Blessed and broken
  text: Jesus has them sit in groups of about fifty. He takes the loaves and fish, looks up to heaven, blesses and breaks them, and gives them to the disciples to serve.
  easy_to_miss: 'Took, blessed, broke, gave: the words of the Last Supper and of every Qurbana.'
- verses: Luke 9:17
  title: Twelve baskets left
  text: All eat and are satisfied. The leftovers fill twelve baskets.
  easy_to_miss: One basket for each apostle. The ones who doubted there was enough end up with more than they started with.
people:
- name: The twelve
  ml: പന്ത്രണ്ടു പേർ
  role: Just back from their mission, tired, and asked to feed a crowd.
  name_meaning: —
phrases:
- term: Bethsaida
  explanation: A fishing town on the north shore of the Sea of Galilee, home of Peter, Andrew and Philip.
- term: Deserted place
  explanation: Open country away from villages, like the wilderness where God fed Israel with manna.
- term: Groups of fifty
  explanation: An echo of Moses organising Israel in the wilderness in groups (Exodus 18:21).
reflection:
  title_en: Not enough, in his hands
  title_ml: തികയാത്തതും അവന്റെ കയ്യിൽ
  read_time: A three-minute read
  body: |-
    The disciples’ maths was correct. Five loaves and two fish do not feed five thousand people. Their suggestion to send everyone away to buy food was practical. Jesus asked something impossible instead: you give them something to eat.

    What they had was not enough, and Jesus did not pretend it was. He took it, looked up to heaven, blessed it and broke it, and gave it back to them to share. The disciples still did the serving. The miracle happened in their hands as they handed it out.

    We often look at a need and at what we have, and decide it is hopeless. A parish budget, a family’s energy, one person’s time. This Gospel does not promise that we will always see a miracle. It does say that small things given to Jesus are not small any more. Bring the loaves; let him bless them.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: When have you seen a small gift make a big difference?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Cook a little extra this week and share it with a neighbour, or give to a food collection.
  prayer: Lord Jesus, you took five loaves and two fish and fed a crowd. Take the little we have, bless it and break it, and let it feed many. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം അഞ്ചാം ഞായർ
      ml: Fifth Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: അഞ്ചപ്പം, രണ്ടു മീൻ, അയ്യായിരം പേർ
    standfirst: അപ്പൊസ്തലന്മാർ ക്ഷീണിതരായി മടങ്ങിവരുന്നു; യേശു അവരെ വിശ്രമിക്കാൻ കൂട്ടിക്കൊണ്ടുപോകുന്നു. പുരുഷാരം പിന്തുടരുന്നു. വൈകുന്നേരമായപ്പോൾ വിശക്കുന്ന അയ്യായിരം പേർ; കൈയിൽ അഞ്ചപ്പവും രണ്ടു മീനും മാത്രം.
    description: പെന്തിക്കോസ്തിക്കു ശേഷം അഞ്ചാം ഞായറിലെ വായനകൾ, അയ്യായിരം പേരെ പോഷിപ്പിക്കുന്ന ലൂക്കൊസ് 9:10–17 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: ബേത്ത്സയിദയ്ക്കടുത്തു വിശ്രമിക്കാൻ യേശു അപ്പൊസ്തലന്മാരെ കൂട്ടിക്കൊണ്ടുപോകുന്നു; എന്നാൽ പുരുഷാരം പിന്തുടരുന്നു. അവൻ അവരെ കൈക്കൊള്ളുന്നു, ഉപദേശിക്കുന്നു, സൌഖ്യമാക്കുന്നു. വൈകുന്നേരം എല്ലാവരെയും പറഞ്ഞയക്കണമെന്നു പന്തിരുവർ ആഗ്രഹിക്കുന്നു. ജനത്തിനു ഭക്ഷിപ്പാൻ കൊടുക്കുവാൻ അവൻ അവരോടു പറയുന്നു; അഞ്ചപ്പവും രണ്ടു മീനുംകൊണ്ട് അയ്യായിരം പേരെ പോഷിപ്പിക്കുന്നു.
      why_this_sunday: ഇന്നു സന്ധ്യയിലെയും കുർബ്ബാനയിലെയും സുവിശേഷം ഒരേ ഭാഗമാണ്; അതിനാൽ ദിവസം മുഴുവനും ഈ ഒരു അത്ഭുതത്തെ ചുറ്റിയാണ്.
      take_with_you: “നിങ്ങൾ തന്നേ അവർക്കു ഭക്ഷിപ്പാൻ കൊടുപ്പിൻ.” നമ്മുടെ കൈയിലുള്ളത്, തികയുകയില്ലെന്നു വ്യക്തമായാലും, യേശു ഉപയോഗിക്കുന്നു.
    readings_thread: കൊയ്ത്തിന്റെ ആദ്യഫലം യിസ്രായേൽ ദൈവത്തിനു കൊണ്ടുവരുന്നു; എല്ലാ നന്മയും നല്കുന്നവനായി സങ്കീർത്തനം ദൈവത്തെ ആശ്രയിക്കുന്നു. യഹോവയെ കാത്തിരിക്കുന്നവർ ശക്തിയെ പുതുക്കുമെന്നു യെശയ്യാവു പറയുന്നു. അനന്യാസ് ശൌലിന്റെ അടുക്കലേക്ക് അയക്കപ്പെടുന്നു; നാം ക്രിസ്തുവിന്റെ സ്ഥാനാപതികൾ എന്നു പൌലൊസ് പറയുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 9:10–11
      title: വിശ്രമിക്കാൻ സമയമില്ല
      text: അപ്പൊസ്തലന്മാർ മടങ്ങിവന്ന് തങ്ങൾ ചെയ്തതൊക്കെയും അറിയിക്കുന്നു. യേശു അവരെ കൂട്ടിക്കൊണ്ടു ബേത്ത്സയിദയിലേക്കു തനിച്ചു വാങ്ങിപ്പോകുന്നു; എന്നാൽ പുരുഷാരം അറിഞ്ഞ് അവനെ പിന്തുടരുന്നു. അവൻ അവരെ കൈക്കൊണ്ട് ദൈവരാജ്യത്തെക്കുറിച്ചു സംസാരിക്കുകയും രോഗശാന്തി വേണ്ടിയവരെ സൗഖ്യമാക്കുകയും ചെയ്യുന്നു.
      easy_to_miss: തന്റെ വിശ്രമം മുടക്കിയ പുരുഷാരത്തെ യേശു “കൈക്കൊണ്ടു”. ലൂക്കൊസ് ആ വാക്കു ശ്രദ്ധയോടെ തിരഞ്ഞെടുത്തതാണ്.
    - verses: ലൂക്കൊസ് 9:12
      title: അവരെ പറഞ്ഞയക്കേണം
      text: 'പകൽ കഴിവാറായപ്പോൾ പന്തിരുവർ പറയുന്നു: ഇവിടെ നാം മരുഭൂമിയിൽ ആയിരിക്കകൊണ്ടു, രാത്രി പാർപ്പാനും ആഹാരം വാങ്ങുവാനുംവേണ്ടി പുരുഷാരത്തെ പറഞ്ഞയക്കേണം.'
      easy_to_miss: ശിഷ്യന്മാരുടെ നിർദ്ദേശം യുക്തിസഹവും ദയാപൂർവ്വവുമാണ്. യേശുവിനെ അതു കണക്കിലെടുക്കുന്നില്ല എന്നേയുള്ളൂ.
    - verses: ലൂക്കൊസ് 9:13–14a
      title: നിങ്ങൾ തന്നേ കൊടുപ്പിൻ
      text: നിങ്ങൾ തന്നേ അവർക്കു ഭക്ഷിപ്പാൻ കൊടുപ്പിൻ, യേശു പറയുന്നു. അഞ്ചപ്പവും രണ്ടുമീനും അല്ലാതെ അധികം ഞങ്ങളുടെ പക്കൽ ഇല്ല; ഞങ്ങൾ പോയി ഈ സകലജനത്തിനുംവേണ്ടി ഭോജ്യങ്ങൾ കൊള്ളേണമോ? ഏകദേശം അയ്യായിരം പുരുഷന്മാർ ഉണ്ടായിരുന്നു.
      easy_to_miss: ലൂക്കൊസ് പുരുഷന്മാരെ മാത്രമേ എണ്ണുന്നുള്ളൂ. സ്ത്രീകളെയും കുട്ടികളെയും ചേർത്താൽ പുരുഷാരം ഇതിലും വളരെ വലുതായിരുന്നു.
    - verses: ലൂക്കൊസ് 9:14b–16
      title: അനുഗ്രഹിച്ചു നുറുക്കി
      text: അവരെ അമ്പതു വീതം പന്തിപന്തിയായി ഇരുത്തുവാൻ യേശു പറയുന്നു. അവൻ ആ അഞ്ചു അപ്പവും രണ്ടു മീനും എടുത്തുകൊണ്ടു സ്വർഗ്ഗത്തേക്കു നോക്കി അവയെ അനുഗ്രഹിച്ചു നുറുക്കി, പുരുഷാരത്തിന്നു വിളമ്പുവാൻ ശിഷ്യന്മാരുടെ കയ്യിൽ കൊടുക്കുന്നു.
      easy_to_miss: 'എടുത്തു, അനുഗ്രഹിച്ചു, നുറുക്കി, കൊടുത്തു: അന്ത്യഅത്താഴത്തിലെയും ഓരോ കുർബ്ബാനയിലെയും വാക്കുകൾ.'
    - verses: ലൂക്കൊസ് 9:17
      title: പന്ത്രണ്ടു കൊട്ട ശേഷിച്ചു
      text: എല്ലാവരും തിന്നു തൃപ്തരാകുന്നു; ശേഷിച്ച കഷണം പന്ത്രണ്ടു കൊട്ട എടുക്കുന്നു.
      easy_to_miss: ഓരോ അപ്പൊസ്തലനും ഓരോ കൊട്ട. മതിയാകുമോ എന്നു സംശയിച്ചവരുടെ കൈയിൽ, തുടങ്ങിയപ്പോൾ ഉണ്ടായിരുന്നതിലും അധികം ഒടുവിൽ ഉണ്ടാകുന്നു.
    people:
    - name: പന്തിരുവർ
      role: ദൌത്യം കഴിഞ്ഞ് ക്ഷീണിതരായി മടങ്ങിവന്നവർ; ഒരു പുരുഷാരത്തെ ഊട്ടാൻ അവരോട് ആവശ്യപ്പെടുന്നു.
      name_meaning: —
      ml: The twelve
    phrases:
    - term: ബേത്ത്സയിദ
      explanation: ഗലീലക്കടലിന്റെ വടക്കേ തീരത്തുള്ള ഒരു മീൻപിടുത്തപട്ടണം; പത്രൊസിന്റെയും അന്ത്രെയാസിന്റെയും ഫിലിപ്പൊസിന്റെയും നാട്.
    - term: മരുഭൂമി
      explanation: ഗ്രാമങ്ങളിൽനിന്നകലെയുള്ള തുറസ്സായ പ്രദേശം; ദൈവം യിസ്രായേലിനെ മന്നാകൊണ്ടു പോഷിപ്പിച്ച മരുഭൂമിപോലെ.
    - term: അമ്പതു വീതം പന്തിപന്തിയായി
      explanation: മരുഭൂമിയിൽ മോശെ യിസ്രായേലിനെ കൂട്ടങ്ങളായി ക്രമീകരിച്ചതിന്റെ പ്രതിധ്വനി (പുറപ്പാടു 18:21).
    reflection:
      title_en: തികയാത്തതും അവന്റെ കയ്യിൽ
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ശിഷ്യന്മാരുടെ കണക്കു ശരിയായിരുന്നു. അഞ്ചപ്പവും രണ്ടു മീനുംകൊണ്ട് അയ്യായിരം പേരെ ഊട്ടാനാവില്ല. ആഹാരം വാങ്ങാൻ എല്ലാവരെയും പറഞ്ഞയക്കണമെന്ന അവരുടെ നിർദ്ദേശം പ്രായോഗികമായിരുന്നു. പകരം യേശു അസാദ്ധ്യമായ ഒന്ന് ആവശ്യപ്പെട്ടു: നിങ്ങൾ തന്നേ അവർക്കു ഭക്ഷിപ്പാൻ കൊടുപ്പിൻ.

        അവരുടെ കൈയിലുണ്ടായിരുന്നതു തികയുമായിരുന്നില്ല; തികയും എന്നു യേശു ഭാവിച്ചതുമില്ല. അവൻ അതെടുത്ത്, സ്വർഗ്ഗത്തേക്കു നോക്കി, അനുഗ്രഹിച്ചു നുറുക്കി, പങ്കുവെക്കാൻ അവർക്കുതന്നെ തിരികെ കൊടുത്തു. വിളമ്പിയതു ശിഷ്യന്മാർതന്നെയാണ്. അവർ അതു കൈമാറിക്കൊണ്ടിരിക്കെ, അവരുടെ കൈകളിലാണ് അത്ഭുതം സംഭവിച്ചത്.

        പലപ്പോഴും നാം ഒരു ആവശ്യത്തെയും നമ്മുടെ കൈയിലുള്ളതിനെയും നോക്കി, പ്രതീക്ഷയില്ല എന്നു തീരുമാനിക്കുന്നു. ഒരു ഇടവകയുടെ ബജറ്റ്, ഒരു കുടുംബത്തിന്റെ ശക്തി, ഒരാളുടെ സമയം. നാം എപ്പോഴും ഒരു അത്ഭുതം കാണുമെന്ന് ഈ സുവിശേഷം വാഗ്ദത്തം ചെയ്യുന്നില്ല. എന്നാൽ യേശുവിനു കൊടുക്കുന്ന ചെറിയവ പിന്നെ ചെറിയവയല്ല എന്ന് അതു പറയുന്നു. അപ്പം കൊണ്ടുവരിക; അവൻ അതിനെ അനുഗ്രഹിക്കട്ടെ.
      title_ml: Not enough, in his hands
    week:
      question: ഒരു ചെറിയ ദാനം വലിയ മാറ്റം ഉണ്ടാക്കുന്നതു നിങ്ങൾ എപ്പോഴാണ് കണ്ടത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച അല്പം അധികം പാചകം ചെയ്ത് ഒരു അയൽക്കാരനുമായി പങ്കിടുക; അല്ലെങ്കിൽ ഒരു ഭക്ഷ്യശേഖരണത്തിനു സംഭാവന ചെയ്യുക.
      prayer: കർത്താവായ യേശുവേ, നീ അഞ്ചപ്പവും രണ്ടു മീനും എടുത്ത് ഒരു പുരുഷാരത്തെ പോഷിപ്പിച്ചു. ഞങ്ങളുടെ പക്കലുള്ള അല്പം എടുത്ത് അനുഗ്രഹിച്ചു നുറുക്കേണമേ; അത് അനേകരെ പോഷിപ്പിക്കുമാറാക്കേണമേ. ആമേൻ.
