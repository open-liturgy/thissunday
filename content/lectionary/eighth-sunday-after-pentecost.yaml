week:
  question: How do we prepare to receive Holy Qurbana? How could we prepare better?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: On Saturday evening, set aside a few minutes as a family to prepare for receiving Holy Qurbana.
  prayer: Lord Jesus, living bread from heaven, you give your flesh for the life of the world. Make us ready to receive you, and remain in us as we remain in you. Amen.
