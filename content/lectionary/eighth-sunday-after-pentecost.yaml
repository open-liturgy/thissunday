one_minute:
  what_happens: 'In the synagogue at Capernaum, Jesus says he is the living bread from heaven. Those who ate manna died, but whoever eats this bread will live for ever. The bread is his flesh. The crowd argues, and Jesus says: unless you eat my flesh and drink my blood, you have no life in you.'
  why_this_sunday: This is the third reading from John 6 in this season. It speaks most directly about the Holy Qurbana.
  take_with_you: In the Qurbana we do not only remember Jesus. We receive him, and he lives in us.
readings_thread: God reveals his name to Moses at the burning bush, and Jeremiah says God wants obedience more than sacrifice. Isaiah calls Jerusalem to wake and put on strength. Peter calls believers living stones, and Hebrews calls Jesus our great high priest.
key_verse:
  ref: John 6:51
  ml: സ്വർഗ്ഗത്തിൽനിന്നു ഇറങ്ങിയ ജീവനുള്ള അപ്പം ഞാൻ ആകുന്നു; ഈ അപ്പം തിന്നുന്നവൻ എല്ലാം എന്നേക്കും ജീവിക്കും; ഞാൻ കൊടുപ്പാനിരിക്കുന്ന അപ്പമോ ലോകത്തിന്റെ ജീവന്നു വേണ്ടി ഞാൻ കൊടുക്കുന്ന എന്റെ മാംസം ആകുന്നു.
  ml_translation: Sathyavedapusthakam, 1910
  en: I am the living bread which came down out of heaven. If anyone eats of this bread, he will live forever. Yes, the bread which I will give for the life of the world is my flesh.”
  en_translation: World English Bible
scenes:
- verses: John 6:47–50
  title: Manna and death
  text: Whoever believes has eternal life. I am the bread of life. Your ancestors ate manna in the wilderness and they died. This is the bread from heaven, so that whoever eats it will not die.
  easy_to_miss: Manna kept Israel alive for a day at a time. Jesus offers a life death cannot end.
- verses: John 6:51
  title: For the life of the world
  text: I am the living bread that came down from heaven. Whoever eats it will live for ever. The bread I will give for the life of the world is my flesh.
  easy_to_miss: “For the life of the world” points to the cross, where Jesus gives his flesh.
- verses: John 6:52–53
  title: How can he?
  text: 'The people argue: how can this man give us his flesh to eat? Jesus says: unless you eat the flesh of the Son of Man and drink his blood, you have no life in you.'
  easy_to_miss: Jesus does not soften his words when they object. He makes them stronger.
- verses: John 6:54–57
  title: True food, true drink
  text: Whoever eats my flesh and drinks my blood has eternal life, and I will raise them up on the last day. My flesh is true food and my blood true drink. They remain in me and I in them.
  easy_to_miss: John uses a blunt Greek verb here, trogo, “to chew”. It is hard to read as only a metaphor.
- verses: John 6:58–59
  title: In the synagogue at Capernaum
  text: This is the bread that came down from heaven, not like the bread your ancestors ate and died. Whoever eats this bread will live for ever. He said this while teaching in the synagogue in Capernaum.
  easy_to_miss: John notes the place. Ruins of a later synagogue built on the same site still stand in Capernaum.
people:
- name: The listeners in Capernaum
  ml: കഫർന്നഹൂമിലെ കേൾവിക്കാർ
  role: People in the synagogue, many of whom find this teaching too hard (John 6:60).
  name_meaning: —
phrases:
- term: Living bread
  explanation: Bread that is alive and gives life, as “living water” in John 4 is flowing water that gives life.
- term: Remain in me
  explanation: The same word as in the vine and the branches (John 15). Communion is how we remain in Christ.
- term: Holy Qurbana
  explanation: Syriac for “offering”. The Malankara Church’s name for the Eucharist.
reflection:
  title_en: He lives in us
  title_ml: അവൻ നമ്മിൽ വസിക്കുന്നു
  read_time: A three-minute read
  body: |-
    The people in the synagogue at Capernaum find Jesus’ words shocking. Eat his flesh? Drink his blood? Many of his own disciples leave after this conversation. Jesus does not call them back by softening what he said. He lets the words stand.

    The Church has always heard these words at the Holy Qurbana. The bread and wine offered and consecrated become for us the body and blood of Christ. We do not only think about him or remember him. We receive him, and Jesus says that whoever receives him remains in him, and he in them.

    It is easy to let the Qurbana become routine: something we attend, stand through and leave. This Gospel asks us to see it as Jesus saw it: food for eternal life, given for the life of the world. Preparing for it, through fasting, confession and prayer, is how we take it seriously.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: How do we prepare to receive Holy Qurbana? How could we prepare better?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: On Saturday evening, set aside a few minutes as a family to prepare for receiving Holy Qurbana.
  prayer: Lord Jesus, living bread from heaven, you give your flesh for the life of the world. Make us ready to receive you, and remain in us as we remain in you. Amen.
translations:
  ml:
    name:
      en: പെന്തിക്കോസ്തിക്കു ശേഷം എട്ടാം ഞായർ
      ml: Eighth Sunday after Pentecost
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: '“എന്റെ മാംസം സാക്ഷാൽ ഭക്ഷണവും എന്റെ രക്തം സാക്ഷാൽ പാനീയവും”: ജീവന്റെ അപ്പം, മൂന്നാം ഭാഗം'
    standfirst: 'താൻ കൊടുക്കുന്ന അപ്പം ലോകത്തിന്റെ ജീവന്നുവേണ്ടിയുള്ള തന്റെ മാംസമാണെന്നു യേശു പറയുന്നു. കേൾക്കുന്നവർ തമ്മിൽ വാദിക്കുന്നു: നമുക്കു തന്റെ മാംസം തിന്നേണ്ടതിന്നു തരുവാൻ ഇവന്നു എങ്ങനെ കഴിയും?'
    description: 'പെന്തിക്കോസ്തിക്കു ശേഷം എട്ടാം ഞായറിലെ വായനകൾ, ജീവനുള്ള അപ്പം, അവന്റെ മാംസവും രക്തവും: യോഹന്നാൻ 6:47–59 വിശദമായി. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: 'കഫർന്നഹൂമിലെ പള്ളിയിൽ, സ്വർഗ്ഗത്തിൽനിന്ന് ഇറങ്ങിയ ജീവനുള്ള അപ്പം താനാണെന്നു യേശു പറയുന്നു. മന്നാ തിന്നവർ മരിച്ചു; ഈ അപ്പം തിന്നുന്നവൻ എന്നേക്കും ജീവിക്കും. ആ അപ്പം അവന്റെ മാംസമാണ്. പുരുഷാരം തർക്കിക്കുന്നു; യേശു പറയുന്നു: മനുഷ്യപുത്രന്റെ മാംസം തിന്നാതെയും അവന്റെ രക്തം കുടിക്കാതെയും ഇരുന്നാൽ നിങ്ങൾക്കു ഉള്ളിൽ ജീവൻ ഇല്ല.'
      why_this_sunday: ഈ കാലത്ത് യോഹന്നാൻ 6-ൽനിന്നുള്ള മൂന്നാമത്തെ വായനയാണിത്. വിശുദ്ധ കുർബ്ബാനയെക്കുറിച്ച് ഏറ്റവും നേരിട്ടു സംസാരിക്കുന്നത് ഇതാണ്.
      take_with_you: കുർബ്ബാനയിൽ നാം യേശുവിനെ ഓർക്കുക മാത്രമല്ല ചെയ്യുന്നത്. നാം അവനെ സ്വീകരിക്കുന്നു; അവൻ നമ്മിൽ വസിക്കുന്നു.
    readings_thread: കത്തുന്ന മുൾപ്പടർപ്പിൽവെച്ചു ദൈവം തന്റെ നാമം മോശെക്കു വെളിപ്പെടുത്തുന്നു; യാഗത്തെക്കാൾ അനുസരണമാണ് ദൈവം ആഗ്രഹിക്കുന്നതെന്നു യിരെമ്യാവു പറയുന്നു. ഉണർന്നു ശക്തി ധരിക്കുവാൻ യെശയ്യാവു യെരൂശലേമിനെ വിളിക്കുന്നു. വിശ്വാസികളെ പത്രൊസ് ജീവനുള്ള കല്ലുകൾ എന്നും, യേശുവിനെ എബ്രായലേഖനം നമ്മുടെ മഹാപുരോഹിതൻ എന്നും വിളിക്കുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 6:47–50
      title: മന്നായും മരണവും
      text: വിശ്വസിക്കുന്നവന്നു നിത്യജീവൻ ഉണ്ടു. ഞാൻ ജീവന്റെ അപ്പം ആകുന്നു. നിങ്ങളുടെ പിതാക്കന്മാർ മരുഭൂമിയിൽ മന്നാ തിന്നിട്ടും മരിച്ചുവല്ലോ. ഇതോ തിന്നുന്നവൻ മരിക്കാതിരിക്കേണ്ടതിന്നു സ്വർഗ്ഗത്തിൽനിന്നു ഇറങ്ങുന്ന അപ്പം ആകുന്നു.
      easy_to_miss: മന്നാ യിസ്രായേലിനെ ഒരു ദിവസത്തേക്കു വീതം ജീവനോടെ നിലനിർത്തി. മരണത്തിന് അവസാനിപ്പിക്കാനാവാത്ത ഒരു ജീവനാണ് യേശു നല്കുന്നത്.
    - verses: യോഹന്നാൻ 6:51
      title: ലോകത്തിന്റെ ജീവന്നുവേണ്ടി
      text: സ്വർഗ്ഗത്തിൽനിന്നു ഇറങ്ങിയ ജീവനുള്ള അപ്പം ഞാൻ ആകുന്നു; ഈ അപ്പം തിന്നുന്നവൻ എല്ലാം എന്നേക്കും ജീവിക്കും. ഞാൻ കൊടുപ്പാനിരിക്കുന്ന അപ്പമോ ലോകത്തിന്റെ ജീവന്നുവേണ്ടി ഞാൻ കൊടുക്കുന്ന എന്റെ മാംസം ആകുന്നു.
      easy_to_miss: “ലോകത്തിന്റെ ജീവന്നു വേണ്ടി” എന്നതു ക്രൂശിലേക്കു വിരൽചൂണ്ടുന്നു; അവിടെ യേശു തന്റെ മാംസം കൊടുക്കുന്നു.
    - verses: യോഹന്നാൻ 6:52–53
      title: ഇവന്നു എങ്ങനെ കഴിയും?
      text: 'ജനം തമ്മിൽ വാദിക്കുന്നു: നമുക്കു തന്റെ മാംസം തിന്നേണ്ടതിന്നു തരുവാൻ ഇവന്നു എങ്ങനെ കഴിയും? യേശു പറയുന്നു: നിങ്ങൾ മനുഷ്യപുത്രന്റെ മാംസം തിന്നാതെയും അവന്റെ രക്തം കുടിക്കാതെയും ഇരുന്നാൽ നിങ്ങൾക്കു ഉള്ളിൽ ജീവൻ ഇല്ല.'
      easy_to_miss: അവർ എതിർക്കുമ്പോൾ യേശു തന്റെ വാക്കുകൾ മയപ്പെടുത്തുന്നില്ല. അവയെ കൂടുതൽ ശക്തമാക്കുന്നു.
    - verses: യോഹന്നാൻ 6:54–57
      title: സാക്ഷാൽ ഭക്ഷണം, സാക്ഷാൽ പാനീയം
      text: എന്റെ മാംസം തിന്നുകയും എന്റെ രക്തം കുടിക്കയും ചെയ്യുന്നവന്നു നിത്യജീവൻ ഉണ്ടു; ഞാൻ ഒടുക്കത്തെ നാളിൽ അവനെ ഉയിർത്തെഴുന്നേല്പിക്കും. എന്റെ മാംസം സാക്ഷാൽ ഭക്ഷണവും എന്റെ രക്തം സാക്ഷാൽ പാനീയവും ആകുന്നു. അവൻ എന്നിലും ഞാൻ അവനിലും വസിക്കുന്നു.
      easy_to_miss: ഇവിടെ യോഹന്നാൻ ‘ചവയ്ക്കുക’ എന്നർത്ഥമുള്ള ‘ത്രോഗോ’ എന്ന കടുത്ത ഗ്രീക്ക് ക്രിയ ഉപയോഗിക്കുന്നു. അതിനെ ഒരു രൂപകം മാത്രമായി വായിക്കാൻ പ്രയാസമാണ്.
    - verses: യോഹന്നാൻ 6:58–59
      title: കഫർന്നഹൂമിലെ പള്ളിയിൽ
      text: സ്വർഗ്ഗത്തിൽനിന്നു ഇറങ്ങിവന്ന അപ്പം ഇതു ആകുന്നു; പിതാക്കന്മാർ തിന്നുകയും മരിക്കയും ചെയ്തതുപോലെ അല്ല; ഈ അപ്പം തിന്നുന്നവൻ എന്നേക്കും ജീവിക്കും. കഫർന്നഹൂമിൽ ഉപദേശിക്കുമ്പോൾ പള്ളിയിൽവെച്ചാണ് അവൻ ഇതു പറഞ്ഞത്.
      easy_to_miss: യോഹന്നാൻ സ്ഥലം രേഖപ്പെടുത്തുന്നു. അതേ സ്ഥാനത്തു പിന്നീടു പണിത ഒരു പള്ളിയുടെ അവശിഷ്ടങ്ങൾ ഇന്നും കഫർന്നഹൂമിലുണ്ട്.
    people:
    - name: കഫർന്നഹൂമിലെ ശ്രോതാക്കൾ
      role: പള്ളിയിലുണ്ടായിരുന്നവർ; അവരിൽ പലർക്കും ഈ ഉപദേശം കഠിനമായി തോന്നുന്നു (യോഹന്നാൻ 6:60).
      name_meaning: —
      ml: The listeners in Capernaum
    phrases:
    - term: ജീവനുള്ള അപ്പം
      explanation: ജീവനുള്ളതും ജീവൻ നല്കുന്നതുമായ അപ്പം; യോഹന്നാൻ 4-ലെ ‘ജീവനുള്ള വെള്ളം’ ജീവൻ നല്കുന്ന ഒഴുകുന്ന വെള്ളമായിരിക്കുന്നതുപോലെ.
    - term: എന്നിൽ വസിക്കുന്നു
      explanation: മുന്തിരിവള്ളിയിലും കൊമ്പുകളിലും (യോഹന്നാൻ 15) വരുന്ന അതേ വാക്ക്. ക്രിസ്തുവിൽ നാം വസിക്കുന്നതു കുർബ്ബാനയിലൂടെയാണ്.
    - term: വിശുദ്ധ കുർബ്ബാന
      explanation: ‘കാഴ്ച’ (അർപ്പണം) എന്നർത്ഥമുള്ള സുറിയാനി വാക്ക്. യൂക്കരിസ്റ്റിനു മലങ്കരസഭ നല്കുന്ന പേര്.
    reflection:
      title_en: അവൻ നമ്മിൽ വസിക്കുന്നു
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        കഫർന്നഹൂമിലെ പള്ളിയിലുള്ളവർക്കു യേശുവിന്റെ വാക്കുകൾ ഞെട്ടിക്കുന്നതായി തോന്നുന്നു. അവന്റെ മാംസം തിന്നുക? അവന്റെ രക്തം കുടിക്കുക? ഈ സംഭാഷണത്തിനു ശേഷം അവന്റെ സ്വന്തം ശിഷ്യന്മാരിൽ പലരും വിട്ടുപോകുന്നു. പറഞ്ഞതു മയപ്പെടുത്തി യേശു അവരെ തിരികെ വിളിക്കുന്നില്ല. വാക്കുകൾ അങ്ങനെതന്നെ നില്ക്കാൻ അവൻ അനുവദിക്കുന്നു.

        വിശുദ്ധ കുർബ്ബാനയിൽ സഭ എപ്പോഴും ഈ വാക്കുകൾ കേട്ടിട്ടുണ്ട്. അർപ്പിക്കപ്പെട്ടു കൂദാശ ചെയ്യപ്പെടുന്ന അപ്പവും വീഞ്ഞും നമുക്കു ക്രിസ്തുവിന്റെ ശരീരവും രക്തവും ആകുന്നു. നാം അവനെക്കുറിച്ചു ചിന്തിക്കുകയോ ഓർക്കുകയോ മാത്രമല്ല. നാം അവനെ സ്വീകരിക്കുന്നു; അവനെ സ്വീകരിക്കുന്നവൻ അവനിലും അവൻ അവനിലും വസിക്കുന്നു എന്നു യേശു പറയുന്നു.

        കുർബ്ബാന ഒരു പതിവുകാര്യമായി മാറാൻ എളുപ്പമാണ്: പങ്കെടുക്കുന്നു, നിന്നു തീർക്കുന്നു, പോകുന്നു. യേശു കണ്ടതുപോലെ അതിനെ കാണാൻ ഈ സുവിശേഷം ആവശ്യപ്പെടുന്നു: ലോകത്തിന്റെ ജീവന്നുവേണ്ടി നല്കപ്പെട്ട, നിത്യജീവനുള്ള ആഹാരം. നോമ്പ്, കുമ്പസാരം, പ്രാർത്ഥന എന്നിവയിലൂടെ അതിനായി ഒരുങ്ങുന്നതാണ് അതിനെ ഗൌരവമായി എടുക്കുന്നതിന്റെ വഴി.
      title_ml: He lives in us
    week:
      question: വിശുദ്ധ കുർബ്ബാന സ്വീകരിക്കാൻ നാം എങ്ങനെയാണ് ഒരുങ്ങുന്നത്? എങ്ങനെ കൂടുതൽ നന്നായി ഒരുങ്ങാം?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ശനിയാഴ്ച സന്ധ്യയ്ക്ക്, വിശുദ്ധ കുർബ്ബാന സ്വീകരിക്കാൻ ഒരുങ്ങുന്നതിനായി കുടുംബമായി ഏതാനും മിനിറ്റ് മാറ്റിവെക്കുക.
      prayer: സ്വർഗ്ഗത്തിൽനിന്നുള്ള ജീവനുള്ള അപ്പമായ കർത്താവായ യേശുവേ, ലോകത്തിന്റെ ജീവന്നുവേണ്ടി നീ നിന്റെ മാംസം നല്കുന്നു. നിന്നെ സ്വീകരിക്കാൻ ഞങ്ങളെ ഒരുക്കേണമേ; ഞങ്ങൾ നിന്നിൽ വസിക്കുന്നതുപോലെ നീ ഞങ്ങളിൽ വസിക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Mark 4:1–23
        ml: മർക്കൊസ് 4:1–23
        note: വിതെക്കുന്നവൻ; പറയിൻകീഴിൽ മറെച്ചുവെക്കാനുള്ളതല്ലാത്ത വിളക്ക്.
        printed: St. Mark 4:1-23
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 13:10–23
        ml: മത്തായി 13:10–23
        note: യേശു ഉപമകളിൽ സംസാരിക്കുന്നത് എന്തുകൊണ്ട്, വിതെക്കുന്നവന്റെ ഉപമയുടെ അർത്ഥം.
        printed: St. Matthew 13:10-23
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Exodus 3:9–15
        ml: പുറപ്പാട് 3:9–15
        note: 'ദൈവം മോശെയോടു തന്റെ നാമം പറയുന്നു: ഞാൻ ആകുന്നവൻ ഞാൻ ആകുന്നു.'
        printed: Exodus 3:9-15
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Jeremiah 7:21–25
        ml: യിരെമ്യാവ് 7:21–25
        note: എന്റെ വാക്കു കേട്ടനുസരിപ്പിൻ; എന്നാൽ ഞാൻ നിങ്ങൾക്കു ദൈവമായിരിക്കും.
        printed: Jeremiah 7:21-25
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 52:1–6
        ml: യെശയ്യാവ് 52:1–6
        note: സീയോനേ, ഉണരുക, ഉണരുക; നിന്റെ ബലം ധരിച്ചുകൊൾക.
        printed: Isaiah 52:1-6
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: 1 Peter 2:4–10
        ml: 1 പത്രൊസ് 2:4–10
        note: ജീവനുള്ള കല്ലിന്റെ അടുക്കൽ വന്ന്, ആത്മീയഗൃഹമായി പണിയപ്പെടുവിൻ.
        printed: I Peter 2:4-10
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Hebrews 4:14–5:5
        ml: എബ്രായർ 4:14–5:5
        note: നമ്മുടെ ബലഹീനതകളിൽ സഹതാപം കാണിക്കുന്ന ഒരു മഹാപുരോഹിതൻ നമുക്കുണ്ട്; കൃപാസനത്തിന്നു അടുത്തുചെല്ലുക.
        printed: Hebrews 4:14-5:5
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 6:47–59
        ml: യോഹന്നാൻ 6:47–59
        note: എന്റെ മാംസം സാക്ഷാൽ ഭക്ഷണവും എന്റെ രക്തം സാക്ഷാൽ പാനീയവും ആകുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. John 6:47-59
        main: true
    key_verse:
      ref: യോഹന്നാൻ 6:51
    hero_quote:
      text: എന്റെ മാംസം തിന്നുകയും എന്റെ രക്തം കുടിക്കയും ചെയ്യുന്നവൻ എന്നിലും ഞാൻ അവനിലും വസിക്കുന്നു.
      ref: യോഹന്നാൻ 6:56
