one_minute:
  what_happens: 'In the synagogue at Capernaum, Jesus says he is the living bread from heaven. Those who ate manna died, but whoever eats this bread will live for ever. The bread is his flesh. The crowd argues, and Jesus says: unless you eat my flesh and drink my blood, you have no life in you.'
  why_this_sunday: This is the third reading from John 6 in this season. It speaks most directly about the Holy Qurbana.
  take_with_you: In the Qurbana we do not only remember Jesus. We receive him, and he lives in us.
readings_thread: God reveals his name to Moses at the burning bush, and Jeremiah says God wants obedience more than sacrifice. Isaiah calls Jerusalem to wake and put on strength. Peter calls believers living stones, and Hebrews calls Jesus our great high priest.
