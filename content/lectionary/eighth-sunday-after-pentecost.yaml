tagline: '“My flesh is true food”: the bread of life, part three'
standfirst: Jesus says the bread he gives is his own flesh, for the life of the world. The listeners argue among themselves. How can this man give us his flesh to eat?
description: 'Readings for the Eighth Sunday after Pentecost, with John 6:47–59 explained: the living bread, his flesh and blood. Reflection and question.'
