  ml_translation: Sathyavedapusthakam, 1910
  en: I am the living bread which came down out of heaven. If anyone eats of this bread, he will live forever. Yes, the bread which I will give for the life of the world is my flesh.”
  en_translation: World English Bible
scenes:
- verses: John 6:47–50
  title: Manna and death
  text: Whoever believes has eternal life. I am the bread of life. Your ancestors ate manna in the wilderness and they died. This is the bread from heaven, so that whoever eats it will not die.
  easy_to_miss: Manna kept Israel alive for a day at a time. Jesus offers a life death cannot end.
- verses: John 6:51
  title: For the life of the world
  text: I am the living bread that came down from heaven. Whoever eats it will live for ever. The bread I will give for the life of the world is my flesh.
  easy_to_miss: “For the life of the world” points to the cross, where Jesus gives his flesh.
- verses: John 6:52–53
  title: How can he?
  text: 'The people argue: how can this man give us his flesh to eat? Jesus says: unless you eat the flesh of the Son of Man and drink his blood, you have no life in you.'
  easy_to_miss: Jesus does not soften his words when they object. He makes them stronger.
- verses: John 6:54–57
  title: True food, true drink
  text: Whoever eats my flesh and drinks my blood has eternal life, and I will raise them up on the last day. My flesh is true food and my blood true drink. They remain in me and I in them.
  easy_to_miss: John uses a blunt Greek verb here, trogo, “to chew”. It is hard to read as only a metaphor.
- verses: John 6:58–59
  title: In the synagogue at Capernaum
  text: This is the bread that came down from heaven, not like the bread your ancestors ate and died. Whoever eats this bread will live for ever. He said this while teaching in the synagogue in Capernaum.
  easy_to_miss: John notes the place. Ruins of a later synagogue built on the same site still stand in Capernaum.
people:
- name: The listeners in Capernaum
  ml: കഫർന്നഹൂമിലെ കേൾവിക്കാർ
  role: People in the synagogue, many of whom find this teaching too hard (John 6:60).
  name_meaning: —
phrases:
- term: Living bread
  explanation: Bread that is alive and gives life, as “living water” in John 4 is flowing water that gives life.
- term: Remain in me
  explanation: The same word as in the vine and the branches (John 15). Communion is how we remain in Christ.
- term: Holy Qurbana
  explanation: Syriac for “offering”. The Malankara Church’s name for the Eucharist.
reflection:
  title_en: He lives in us
  title_ml: അവൻ നമ്മിൽ വസിക്കുന്നു
  read_time: A three-minute read
  body: |-
    The people in the synagogue at Capernaum find Jesus’ words shocking. Eat his flesh? Drink his blood? Many of his own disciples leave after this conversation. Jesus does not call them back by softening what he said. He lets the words stand.

    The Church has always heard these words at the Holy Qurbana. The bread and wine offered and consecrated become for us the body and blood of Christ. We do not only think about him or remember him. We receive him, and Jesus says that whoever receives him remains in him, and he in them.

    It is easy to let the Qurbana become routine: something we attend, stand through and leave. This Gospel asks us to see it as Jesus saw it: food for eternal life, given for the life of the world. Preparing for it, through fasting, confession and prayer, is how we take it seriously.
