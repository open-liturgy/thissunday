one_minute:
  what_happens: Mary travels to Judea to visit Elizabeth. When Elizabeth hears her greeting, the baby leaps in her womb and she blesses Mary. Mary replies with the Magnificat and stays about three months.
  why_this_sunday: After two announcements come two women who believed them. The Church also keeps this Sunday as Women’s Day.
  take_with_you: Mary’s first act after hearing the news was to go and be with someone else. Joy was meant to be shared.
readings_thread: Deborah judges Israel, Abigail stops a massacre with wisdom, Esther risks her life for her people, and a servant girl points her mistress to healing. Proverbs praises a capable woman, and the epistles speak to women in the Church.
key_verse:
  ref: Luke 1:45
  ml: കർത്താവു തന്നോടു അരുളിച്ചെയ്തതിന്നു നിവൃത്തിയുണ്ടാകും എന്നു വിശ്വസിച്ചവൾ ഭാഗ്യവതി.
  ml_translation: Sathyavedapusthakam, 1910
  en: Blessed is she who believed, for there will be a fulfillment of the things which have been spoken to her from the Lord!
  en_translation: World English Bible
scenes:
- verses: Luke 1:39–40
  title: Mary goes in a hurry
  text: Mary sets out quickly for a town in the hill country of Judah, enters Zechariah’s house and greets Elizabeth.
  easy_to_miss: The journey from Nazareth was several days on foot. Mary makes it as soon as she hears the news.
- verses: Luke 1:41–42
  title: The child leaps
  text: 'At Mary’s greeting the baby leaps in Elizabeth’s womb. Elizabeth is filled with the Holy Spirit and cries out: blessed are you among women, and blessed is the fruit of your womb.'
  easy_to_miss: Gabriel said John would be filled with the Holy Spirit even before birth (Luke 1:15). Here it happens.
- verses: Luke 1:43–45
  title: The mother of my Lord
  text: Elizabeth asks why she should be so honoured that the mother of her Lord comes to her. She blesses Mary for believing.
  easy_to_miss: Elizabeth is the older woman and the wife of a priest. She honours the younger one without any trace of envy.
- verses: Luke 1:46–50
  title: My soul magnifies the Lord
  text: Mary sings. God has looked on his servant in her lowliness, and all generations will call her blessed. His mercy is on those who fear him.
  easy_to_miss: Mary’s song closely follows Hannah’s prayer after Samuel was born (1 Samuel 2:1–10).
- verses: Luke 1:51–56
  title: The mighty and the lowly
  text: God scatters the proud, brings down the mighty and lifts up the lowly. He fills the hungry and sends the rich away empty. Mary stays about three months and goes home.
  easy_to_miss: Mary sings about these things as if they have already happened. Nothing has changed in the world yet, except that God has come.
