one_minute:
  what_happens: Mary travels to Judea to visit Elizabeth. When Elizabeth hears her greeting, the baby leaps in her womb and she blesses Mary. Mary replies with the Magnificat and stays about three months.
  why_this_sunday: After two announcements come two women who believed them. The Church also keeps this Sunday as Women’s Day.
  take_with_you: Mary’s first act after hearing the news was to go and be with someone else. Joy was meant to be shared.
readings_thread: Deborah judges Israel, Abigail stops a massacre with wisdom, Esther risks her life for her people, and a servant girl points her mistress to healing. Proverbs praises a capable woman, and the epistles speak to women in the Church.
key_verse:
  ref: Luke 1:45
  ml: കർത്താവു തന്നോടു അരുളിച്ചെയ്തതിന്നു നിവൃത്തിയുണ്ടാകും എന്നു വിശ്വസിച്ചവൾ ഭാഗ്യവതി.
  ml_translation: Sathyavedapusthakam, 1910
  en: Blessed is she who believed, for there will be a fulfillment of the things which have been spoken to her from the Lord!
  en_translation: World English Bible
scenes:
- verses: Luke 1:39–40
  title: Mary goes in a hurry
  text: Mary sets out quickly for a town in the hill country of Judah, enters Zechariah’s house and greets Elizabeth.
  easy_to_miss: The journey from Nazareth was several days on foot. Mary makes it as soon as she hears the news.
- verses: Luke 1:41–42
  title: The child leaps
  text: 'At Mary’s greeting the baby leaps in Elizabeth’s womb. Elizabeth is filled with the Holy Spirit and cries out: blessed are you among women, and blessed is the fruit of your womb.'
  easy_to_miss: Gabriel said John would be filled with the Holy Spirit even before birth (Luke 1:15). Here it happens.
- verses: Luke 1:43–45
  title: The mother of my Lord
  text: Elizabeth asks why she should be so honoured that the mother of her Lord comes to her. She blesses Mary for believing.
  easy_to_miss: Elizabeth is the older woman and the wife of a priest. She honours the younger one without any trace of envy.
- verses: Luke 1:46–50
  title: My soul magnifies the Lord
  text: Mary sings. God has looked on his servant in her lowliness, and all generations will call her blessed. His mercy is on those who fear him.
  easy_to_miss: Mary’s song closely follows Hannah’s prayer after Samuel was born (1 Samuel 2:1–10).
- verses: Luke 1:51–56
  title: The mighty and the lowly
  text: God scatters the proud, brings down the mighty and lifts up the lowly. He fills the hungry and sends the rich away empty. Mary stays about three months and goes home.
  easy_to_miss: Mary sings about these things as if they have already happened. Nothing has changed in the world yet, except that God has come.
people:
- name: Mary
  ml: മറിയം
  role: Newly pregnant, travelling from Nazareth to Judea.
  name_meaning: Hebrew Miriam; the meaning is uncertain
- name: Elizabeth
  ml: എലീശബെത്ത്
  role: In her sixth month, the first person to call Mary the mother of the Lord.
  name_meaning: “My God is an oath”
- name: John
  ml: യോഹന്നാൻ
  role: Still unborn, he leaps for joy at the sound of Mary’s voice.
  name_meaning: “The Lord is gracious”
phrases:
- term: Magnificat
  explanation: The Latin first word of Mary’s song, “magnifies”. It is sung in the prayers of the Church in many traditions.
- term: Hill country of Judah
  explanation: The hills around Jerusalem. Tradition places Zechariah’s home at Ein Karem, a village west of the city.
- term: Fruit of your womb
  explanation: A Hebrew way of saying “your child”. Elizabeth blesses the baby as well as the mother.
reflection:
  title_en: Joy that goes looking for someone
  title_ml: ആരെയോ തേടിപ്പോകുന്ന സന്തോഷം
  read_time: A three-minute read
  body: |-
    Mary has just heard the most astonishing news anyone has ever received. She does not stay home to think about it alone. She packs and goes, quickly, to the one other woman who will understand. Elizabeth is old and pregnant for the first time. Mary is young and pregnant in a way nobody will believe.

    When they meet, neither competes. Elizabeth, older and more respected, honours Mary. Mary, honoured, gives all the glory to God. Their meeting turns into a song about a God who notices the lowly and fills the hungry. It begins in an ordinary house with two women talking.

    On Women’s Day the Church remembers Deborah, Abigail, Esther and the unnamed girl who pointed Naaman to healing. Many of us also remember the women in our own families who held things together and handed on the faith. Mary and Elizabeth show what they often did: they made room for each other, and God was praised in the middle of it.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Which woman in your life has passed on faith to you, and how?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Visit or call an older woman in your family or parish and ask her to tell you about her life.
  prayer: Lord, you looked on the lowliness of your servant Mary. Bless the mothers, grandmothers, sisters and daughters of our homes and our Church, and let our souls magnify you together. Amen.
translations:
  ml:
    name:
      en: എലീശബെത്തിനെ സന്ദർശിച്ചതിന്റെ ഞായർ
      ml: St. Mary’s Visit to Elizabeth
    season:
      en: സൂബോറോ
      gloss: അറിയിപ്പുകളുടെ കാലം
    also_kept_as: വനിതാദിനം
    also_kept_as_note: സദൃശവാക്യങ്ങൾ 31:10–31 കാണുക
    tagline: ഗർഭിണികളായ രണ്ടു സ്ത്രീകൾ കണ്ടുമുട്ടുന്നു; മറിയ പാടുന്നു
    standfirst: മറിയ തന്റെ ബന്ധുവായ എലീശബെത്തിനെ കാണാൻ മലനാട്ടിലേക്കു ബദ്ധപ്പെട്ടു പോകുന്നു. മറിയ അധികം പറയുന്നതിനു മുമ്പേ എലീശബെത്തിന്റെ ഗർഭത്തിലെ ശിശു തുള്ളുന്നു. സഭ അന്നുമുതൽ പാടുന്ന ഒരു പാട്ടുകൊണ്ട് മറിയ മറുപടി പറയുന്നു.
    description: എലീശബെത്തിനെ സന്ദർശിച്ചതിന്റെ ഞായറിലെ വായനകൾ, ലൂക്കൊസ് 1:39–56-ഉം മറിയയുടെ പാട്ടും വിശദീകരിച്ചത്, ഒരു ധ്യാനം, കുടുംബത്തിനായി ഒരു ചോദ്യം.
    one_minute:
      what_happens: എലീശബെത്തിനെ കാണാൻ മറിയ യെഹൂദ്യയിലേക്കു യാത്ര ചെയ്യുന്നു. അവളുടെ വന്ദനം കേട്ടപ്പോൾ എലീശബെത്തിന്റെ ഗർഭത്തിൽ ശിശു തുള്ളുന്നു; അവൾ മറിയയെ അനുഗ്രഹിക്കുന്നു. മറിയ സ്തോത്രഗീതംകൊണ്ടു മറുപടി പറയുന്നു; ഏകദേശം മൂന്നു മാസം അവിടെ താമസിക്കുന്നു.
      why_this_sunday: രണ്ട് അറിയിപ്പുകൾക്കു ശേഷം അവ വിശ്വസിച്ച രണ്ടു സ്ത്രീകൾ. സഭ ഈ ഞായറാഴ്ച വനിതാദിനമായും ആചരിക്കുന്നു.
      take_with_you: വാർത്ത കേട്ടശേഷം മറിയ ആദ്യം ചെയ്തത് മറ്റൊരാളുടെ അടുത്തു ചെന്നിരിക്കുകയാണ്. സന്തോഷം പങ്കുവെക്കാനുള്ളതാണ്.
    readings_thread: ദെബോരാ യിസ്രായേലിനു ന്യായപാലനം ചെയ്യുന്നു; അബീഗയിൽ ജ്ഞാനംകൊണ്ട് ഒരു കൂട്ടക്കൊല തടയുന്നു; എസ്ഥേർ തന്റെ ജനത്തിനുവേണ്ടി ജീവൻ പണയം വെക്കുന്നു; ഒരു ദാസിപ്പെൺകുട്ടി തന്റെ യജമാനത്തിക്കു സൌഖ്യത്തിലേക്കുള്ള വഴി കാണിക്കുന്നു. സദൃശവാക്യങ്ങൾ സാമർത്ഥ്യമുള്ള സ്ത്രീയെ പുകഴ്ത്തുന്നു; ലേഖനങ്ങൾ സഭയിലെ സ്ത്രീകളോടു സംസാരിക്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 1:39–40
      title: മറിയ ബദ്ധപ്പെട്ടു പോകുന്നു
      text: മറിയ വേഗം യെഹൂദാമലനാട്ടിലെ ഒരു പട്ടണത്തിലേക്കു പുറപ്പെട്ട്, സെഖര്യാവിന്റെ വീട്ടിൽ ചെന്ന് എലീശബെത്തിനെ വന്ദിക്കുന്നു.
      easy_to_miss: നസറെത്തിൽനിന്നുള്ള യാത്ര കാൽനടയായി പല ദിവസങ്ങൾ വേണ്ടിയിരുന്നു. വാർത്ത കേട്ട ഉടനെ മറിയ പുറപ്പെടുന്നു.
    - verses: ലൂക്കൊസ് 1:41–42
      title: ശിശു തുള്ളുന്നു
      text: 'മറിയയുടെ വന്ദനം കേട്ടപ്പോൾ എലീശബെത്തിന്റെ ഗർഭത്തിൽ ശിശു തുള്ളുന്നു. എലീശബെത്ത് പരിശുദ്ധാത്മാവു നിറഞ്ഞവളായി ഉറക്കെ പറയുന്നു: സ്ത്രീകളിൽ നീ അനുഗ്രഹിക്കപ്പെട്ടവൾ; നിന്റെ ഗർഭഫലവും അനുഗ്രഹിക്കപ്പെട്ടതു.'
      easy_to_miss: ജനനത്തിനു മുമ്പേ യോഹന്നാൻ പരിശുദ്ധാത്മാവു നിറഞ്ഞവനാകും എന്ന് ഗബ്രിയേൽ പറഞ്ഞിരുന്നു (ലൂക്കൊസ് 1:15). ഇവിടെ അതു സംഭവിക്കുന്നു.
    - verses: ലൂക്കൊസ് 1:43–45
      title: എന്റെ കർത്താവിന്റെ മാതാവ്
      text: തന്റെ കർത്താവിന്റെ മാതാവ് തന്റെ അടുക്കൽ വരുവാൻ തനിക്ക് എവിടെനിന്ന് ഈ ബഹുമാനം എന്ന് എലീശബെത്ത് ചോദിക്കുന്നു. വിശ്വസിച്ചതിനാൽ അവൾ മറിയയെ അനുഗ്രഹിക്കുന്നു.
      easy_to_miss: എലീശബെത്ത് പ്രായമേറിയവളും ഒരു പുരോഹിതന്റെ ഭാര്യയുമാണ്. ഒരു തരിപോലും അസൂയയില്ലാതെ അവൾ ഇളയവളെ ബഹുമാനിക്കുന്നു.
    - verses: ലൂക്കൊസ് 1:46–50
      title: എന്റെ ഉള്ളം കർത്താവിനെ മഹിമപ്പെടുത്തുന്നു
      text: മറിയ പാടുന്നു. ദൈവം തന്റെ ദാസിയുടെ താഴ്ച കടാക്ഷിച്ചിരിക്കുന്നു; എല്ലാ തലമുറകളും അവളെ ഭാഗ്യവതി എന്നു വിളിക്കും. അവന്റെ കരുണ അവനെ ഭയപ്പെടുന്നവരുടെ മേൽ ഇരിക്കുന്നു.
      easy_to_miss: ശമൂവേൽ ജനിച്ചശേഷമുള്ള ഹന്നായുടെ പ്രാർത്ഥനയെ മറിയയുടെ പാട്ട് അടുത്തു പിന്തുടരുന്നു (1 ശമൂവേൽ 2:1–10).
    - verses: ലൂക്കൊസ് 1:51–56
      title: ബലവാന്മാരും എളിയവരും
      text: ദൈവം അഹങ്കാരികളെ ചിതറിക്കുന്നു, പ്രബലന്മാരെ താഴ്ത്തുന്നു, എളിയവരെ ഉയർത്തുന്നു. വിശന്നിരിക്കുന്നവരെ നിറയ്ക്കുന്നു, ധനവാന്മാരെ വെറുതെ അയയ്ക്കുന്നു. ഏകദേശം മൂന്നു മാസം താമസിച്ചിട്ട് മറിയ വീട്ടിലേക്കു മടങ്ങുന്നു.
      easy_to_miss: ഇവയെല്ലാം ഇതിനകം സംഭവിച്ചുകഴിഞ്ഞതുപോലെയാണ് മറിയ പാടുന്നത്. ദൈവം വന്നിരിക്കുന്നു എന്നതല്ലാതെ ലോകത്തിൽ ഇതുവരെ ഒന്നും മാറിയിട്ടില്ല.
    people:
    - name: മറിയം
      role: ഗർഭിണിയായിട്ട് അധികം നാളായിട്ടില്ല; നസറെത്തിൽനിന്ന് യെഹൂദ്യയിലേക്കു യാത്ര ചെയ്യുന്നു.
      name_meaning: എബ്രായയിൽ മിര്യാം; അർത്ഥം ഉറപ്പില്ല
      ml: Mary
    - name: എലീശബെത്ത്
      role: ആറാം മാസത്തിൽ; മറിയയെ കർത്താവിന്റെ മാതാവ് എന്ന് ആദ്യം വിളിച്ചവൾ.
      name_meaning: “എന്റെ ദൈവം ഒരു ആണയാകുന്നു”
      ml: Elizabeth
    - name: യോഹന്നാൻ
      role: ഇനിയും ജനിച്ചിട്ടില്ല; മറിയയുടെ ശബ്ദം കേട്ട് സന്തോഷത്താൽ തുള്ളുന്നു.
      name_meaning: “കർത്താവ് കൃപയുള്ളവൻ”
      ml: John
    phrases:
    - term: മാഗ്നിഫിക്കാത്ത്
      explanation: മറിയയുടെ പാട്ടിലെ ആദ്യവാക്കിന്റെ ലത്തീൻ രൂപം, “മഹിമപ്പെടുത്തുന്നു”. പല സഭാപാരമ്പര്യങ്ങളിലും ഇത് സഭയുടെ പ്രാർത്ഥനകളിൽ പാടുന്നു.
    - term: യെഹൂദാമലനാട്
      explanation: യെരൂശലേമിനു ചുറ്റുമുള്ള മലകൾ. നഗരത്തിനു പടിഞ്ഞാറുള്ള ഐൻ കാരേം എന്ന ഗ്രാമമാണ് സെഖര്യാവിന്റെ വീട് എന്ന് പാരമ്പര്യം പറയുന്നു.
    - term: ഗർഭഫലം
      explanation: “നിന്റെ കുഞ്ഞ്” എന്നു പറയുന്ന ഒരു എബ്രായ ശൈലി. എലീശബെത്ത് അമ്മയെ മാത്രമല്ല കുഞ്ഞിനെയും അനുഗ്രഹിക്കുന്നു.
    reflection:
      title_en: ആരെയോ തേടിപ്പോകുന്ന സന്തോഷം
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ഒരു മനുഷ്യനും ഇന്നോളം കേട്ടിട്ടില്ലാത്ത ഏറ്റവും അത്ഭുതകരമായ വാർത്തയാണ് മറിയ കേട്ടിരിക്കുന്നത്. അതേക്കുറിച്ചു തനിയെ ചിന്തിച്ച് അവൾ വീട്ടിൽ ഇരിക്കുന്നില്ല. ഇതു മനസ്സിലാകുന്ന മറ്റൊരേയൊരു സ്ത്രീയുടെ അടുക്കലേക്ക് അവൾ വേഗം പുറപ്പെടുന്നു. എലീശബെത്ത് വൃദ്ധയാണ്, ആദ്യമായി ഗർഭിണിയാണ്. മറിയ ചെറുപ്പമാണ്; ആരും വിശ്വസിക്കാത്ത വിധത്തിൽ ഗർഭിണിയാണ്.

        അവർ കണ്ടുമുട്ടുമ്പോൾ ആരും മത്സരിക്കുന്നില്ല. പ്രായവും ബഹുമാനവും കൂടുതലുള്ള എലീശബെത്ത് മറിയയെ ബഹുമാനിക്കുന്നു. ബഹുമാനിക്കപ്പെട്ട മറിയ മഹത്വം മുഴുവൻ ദൈവത്തിനു കൊടുക്കുന്നു. എളിയവരെ ശ്രദ്ധിക്കുകയും വിശന്നിരിക്കുന്നവരെ നിറയ്ക്കുകയും ചെയ്യുന്ന ദൈവത്തെക്കുറിച്ചുള്ള ഒരു പാട്ടായി അവരുടെ കൂടിക്കാഴ്ച മാറുന്നു. അതു തുടങ്ങുന്നത് ഒരു സാധാരണ വീട്ടിൽ രണ്ടു സ്ത്രീകൾ സംസാരിക്കുന്നിടത്താണ്.

        വനിതാദിനത്തിൽ സഭ ദെബോരായെയും അബീഗയിലിനെയും എസ്ഥേരിനെയും, നയമാനു സൌഖ്യത്തിലേക്കു വഴി കാണിച്ച പേരില്ലാത്ത പെൺകുട്ടിയെയും ഓർക്കുന്നു. കാര്യങ്ങൾ ഒന്നിച്ചു ചേർത്തുപിടിക്കുകയും വിശ്വാസം കൈമാറുകയും ചെയ്ത നമ്മുടെ കുടുംബങ്ങളിലെ സ്ത്രീകളെയും നമ്മിൽ പലരും ഓർക്കുന്നു. അവർ പലപ്പോഴും ചെയ്തത് മറിയയും എലീശബെത്തും കാണിച്ചുതരുന്നു: അവർ പരസ്പരം ഇടം കൊടുത്തു; അതിന്റെ നടുവിൽ ദൈവം സ്തുതിക്കപ്പെട്ടു.
      title_ml: Joy that goes looking for someone
    week:
      question: നിങ്ങളുടെ ജീവിതത്തിൽ ഏതു സ്ത്രീയാണ് നിങ്ങൾക്കു വിശ്വാസം കൈമാറിയത്? എങ്ങനെ?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: കുടുംബത്തിലോ ഇടവകയിലോ ഉള്ള പ്രായമുള്ള ഒരു സ്ത്രീയെ സന്ദർശിക്കുകയോ വിളിക്കുകയോ ചെയ്ത് അവരുടെ ജീവിതകഥ പറയാൻ ആവശ്യപ്പെടുക.
      prayer: കർത്താവേ, നിന്റെ ദാസിയായ മറിയയുടെ താഴ്ച നീ കടാക്ഷിച്ചുവല്ലോ. ഞങ്ങളുടെ ഭവനങ്ങളിലെയും സഭയിലെയും അമ്മമാരെയും വല്യമ്മമാരെയും സഹോദരിമാരെയും പുത്രിമാരെയും അനുഗ്രഹിക്കേണമേ. ഞങ്ങളുടെ ഉള്ളം ഒരുമിച്ചു നിന്നെ മഹിമപ്പെടുത്തുമാറാകട്ടെ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 8:1–3
        ml: ലൂക്കൊസ് 8:1–3
        note: യേശുവിനെ അനുഗമിച്ച് തങ്ങളുടെ വസ്തുവകകൊണ്ട് അവന്റെ ശുശ്രൂഷയെ താങ്ങിയ സ്ത്രീകൾ.
        printed: St. Luke 8:1-3
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 10:38–42
        ml: ലൂക്കൊസ് 10:38–42
        note: മാർത്ത ശുശ്രൂഷയിൽ തിരക്കിലാണ്; മറിയ ഇരുന്നു കേൾക്കുന്നു.
        printed: St. Luke 10:38-42
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 1:24–31; 24:15–38
        ml: ഉല്പത്തി 1:24–31; 24:15–38
        note: ദൈവസ്വരൂപത്തിൽ സൃഷ്ടിക്കപ്പെട്ട പുരുഷനും സ്ത്രീയും; കിണറ്റിങ്കൽ റിബെക്കയുടെ ദയ.
        printed: Genesis 1:24-31, 24:15-38
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Judges 4:4–16
        ml: ന്യായാധിപന്മാർ 4:4–16
        note: പ്രവാചകിയും ന്യായാധിപയുമായ ദെബോരാ യിസ്രായേലിനെ ജയത്തിലേക്കു നയിക്കുന്നു.
        printed: Judges 4:4-16
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: 1 Samuel 25:1–35
        ml: 1 ശമൂവേൽ 25:1–35
        note: അബീഗയിലിന്റെ ജ്ഞാനം ദാവീദിനെ പ്രതികാരത്തിൽനിന്നു തടയുന്നു.
        printed: 1 Samuel 25:1-35
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: 2 Kings 5:1–5
        ml: 2 രാജാക്കന്മാർ 5:1–5
        note: അടിമയായി പിടിക്കപ്പെട്ട ഒരു യിസ്രായേല്യബാലിക, നയമാനെ സൗഖ്യമാക്കാൻ കഴിയുന്ന പ്രവാചകനെ ചൂണ്ടിക്കാണിക്കുന്നു.
        printed: II Kings 5:1-5
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Esther 4:1–17
        ml: എസ്ഥേർ 4:1–17
        note: 'എസ്ഥേർ തന്റെ ജനത്തിനുവേണ്ടി ജീവൻ പണയപ്പെടുത്തുന്നു: ഇങ്ങനെയുള്ള കാലത്തിനായിട്ടായിരിക്കാം നീ രാജ്ഞിയായിരിക്കുന്നത്.'
        printed: Esther 4:1-17
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Proverbs 14:1; 19:14; 31:10–31
        ml: സദൃശവാക്യങ്ങൾ 14:1; 19:14; 31:10–31
        note: ജ്ഞാനമുള്ള സ്ത്രീ തന്റെ വീടു പണിയുന്നു; സാമർത്ഥ്യമുള്ള ഭാര്യയുടെ വില മുത്തുകളിലും ഏറും.
        printed: 'Proverbs14: 1 : 19 : 14 : 31 : 10 -31'
        check: 'Printed as ''Proverbs14: 1 : 19 : 14 : 31 : 10 -31''. Read here as 14:1; 19:14; 31:10-31.'
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: 1 Peter 3:1–7
        ml: 1 പത്രൊസ് 3:1–7
        note: 'ഭാര്യമാരും ഭർത്താക്കന്മാരും: സൗമ്യതയും സാവധാനതയുമുള്ള മനസ്സ്, പരസ്പരബഹുമാനം.'
        printed: I Peter 3:1-7
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 1 Timothy 2:9–15; 3:11–13
        ml: 1 തിമൊഥെയൊസ് 2:9–15; 3:11–13
        note: അടക്കവും സൽപ്രവൃത്തികളും; ശുശ്രൂഷിക്കുന്ന സ്ത്രീകളിൽനിന്ന് ആവശ്യപ്പെടുന്ന സ്വഭാവവും.
        printed: I Timothy 2:9-15, 3:11-13
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 1:39–56
        ml: ലൂക്കൊസ് 1:39–56
        note: മറിയ എലീശബെത്തിനെ സന്ദർശിക്കുന്നു; ശിശു തുള്ളുന്നു; മറിയ സ്തോത്രഗീതം പാടുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Luke 1:39-56
        main: true
    key_verse:
      ref: ലൂക്കൊസ് 1:45
    hero_quote:
      text: എന്റെ ഉള്ളം കർത്താവിനെ മഹിമപ്പെടുത്തുന്നു; എന്റെ ആത്മാവു എന്റെ രക്ഷിതാവായ ദൈവത്തിൽ ഉല്ലസിക്കുന്നു.
      ref: ലൂക്കൊസ് 1:46–47
