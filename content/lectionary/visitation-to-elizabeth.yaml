phrases:
- term: Magnificat
  explanation: The Latin first word of Mary’s song, “magnifies”. It is sung in the prayers of the Church in many traditions.
- term: Hill country of Judah
  explanation: The hills around Jerusalem. Tradition places Zechariah’s home at Ein Karem, a village west of the city.
- term: Fruit of your womb
  explanation: A Hebrew way of saying “your child”. Elizabeth blesses the baby as well as the mother.
reflection:
  title_en: Joy that goes looking for someone
  title_ml: ആരെയോ തേടിപ്പോകുന്ന സന്തോഷം
  read_time: A three-minute read
  body: |-
    Mary has just heard the most astonishing news anyone has ever received. She does not stay home to think about it alone. She packs and goes, quickly, to the one other woman who will understand. Elizabeth is old and pregnant for the first time. Mary is young and pregnant in a way nobody will believe.

    When they meet, neither competes. Elizabeth, older and more respected, honours Mary. Mary, honoured, gives all the glory to God. Their meeting turns into a song about a God who notices the lowly and fills the hungry. It begins in an ordinary house with two women talking.

    On Women’s Day the Church remembers Deborah, Abigail, Esther and the unnamed girl who pointed Naaman to healing. Many of us also remember the women in our own families who held things together and handed on the faith. Mary and Elizabeth show what they often did: they made room for each other, and God was praised in the middle of it.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Which woman in your life has passed on faith to you, and how?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Visit or call an older woman in your family or parish and ask her to tell you about her life.
  prayer: Lord, you looked on the lowliness of your servant Mary. Bless the mothers, grandmothers, sisters and daughters of our homes and our Church, and let our souls magnify you together. Amen.
