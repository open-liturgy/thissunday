  en: Don’t be afraid, Zacharias, because your request has been heard.
  en_translation: World English Bible
scenes:
- verses: Luke 1:5–7
  title: Righteous, and still waiting
  text: Luke opens with two facts held together. Zechariah and Elizabeth are “righteous before God”, and they have no child. Both are old.
  easy_to_miss: In their world a childless home was read as a reproach, and Elizabeth uses that word in verse 25. Luke rejects that reading in his first sentence about them.
- verses: Luke 1:8–10
  title: The lot falls on Zechariah
  text: His division is on duty, and the lot picks him to enter the sanctuary and burn incense. A crowd prays outside while he goes in alone.
  easy_to_miss: There were far more priests than turns. By tradition a priest offered the incense once in his life, and some never did.
- verses: Luke 1:11–17
  title: A voice at the altar
  text: Gabriel appears at the right side of the altar of incense. “Your request has been heard.” Elizabeth will bear a son named John, and he will turn many people back to God.
  easy_to_miss: Gabriel borrows the closing lines of the prophet Malachi (4:5–6). The New Testament story picks up where the last prophet stopped.
- verses: Luke 1:18–20
  title: How can I be sure?
  text: Zechariah asks for proof, because he and his wife are old. The sign he gets is one he did not ask for. He will be silent until the day the promise comes true.
  easy_to_miss: Abraham reacts the same way in Genesis 17:17, which is read before Qurbana this Sunday. The Old Testament readings are chosen to echo the Gospel.
- verses: Luke 1:21–25
  title: Silence, then a child
  text: The people outside wonder why he is taking so long. Zechariah comes out unable to speak, finishes his days of service and goes home. Elizabeth conceives.
  easy_to_miss: His silence lasts until the child is born and named John (Luke 1:57–64).
