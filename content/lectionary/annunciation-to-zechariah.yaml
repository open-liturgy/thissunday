      ml: Annunciation to Zechariah
    season:
      en: സൂബോറോ
      gloss: അറിയിപ്പുകളുടെ കാലം
    also_kept_as: മാതാപിതാക്കളുടെ ദിനം
    also_kept_as_note: എഫെസ്യർ 6:1–4 കാണുക
    tagline: വൃദ്ധനായ ഒരു പുരോഹിതന് ഒരു മകൻ ജനിക്കുമെന്ന് അറിയിപ്പ്
    standfirst: വൃദ്ധനായ ഒരു പുരോഹിതൻ ധൂപം കാട്ടാൻ ദൈവാലയത്തിൽ കടക്കുന്നു; പുറത്തുവരുന്നത് സംസാരിക്കാൻ കഴിയാതെയാണ്. ജീവിതത്തിന്റെ ഏറിയ പങ്കും ഒരു കുഞ്ഞിനായി പ്രാർത്ഥിച്ച ദമ്പതികളിൽനിന്നാണ് ക്രിസ്തുമസിന്റെ കഥ തുടങ്ങുന്നത്.
    description: സെഖര്യാവിനോടുള്ള അറിയിപ്പിന്റെ ഞായറിലെ വായനകൾ, ലൂക്കൊസ് 1:5–25 അഞ്ചു രംഗങ്ങളിൽ, ഒരു ധ്യാനം, കുടുംബത്തിനായി ഒരു ചോദ്യം.
    one_minute:
      what_happens: വൃദ്ധനായ പുരോഹിതൻ സെഖര്യാവ് ദൈവാലയത്തിൽ ധൂപം കാട്ടാൻ തിരഞ്ഞെടുക്കപ്പെടുന്നു. ഗബ്രിയേൽ ദൂതൻ അവിടെ അവനെ കണ്ട്, ഭാര്യ എലീശബെത്ത് യോഹന്നാൻ എന്ന ഒരു മകനെ പ്രസവിക്കും എന്നു പറയുന്നു. സെഖര്യാവ് തെളിവു ചോദിക്കുന്നു; സംസാരിക്കാൻ കഴിയാതെ മടങ്ങുന്നു.
      why_this_sunday: സഭാവർഷത്തിനു രണ്ടാഴ്ച പ്രായം. ഇന്നുമുതൽ ക്രിസ്തുമസ് വരെ ഓരോ ഞായറാഴ്ചയും ക്രിസ്തുവിന്റെ വരവിന്റെ കഥയിലെ അടുത്ത രംഗം വായിക്കുന്നു. ആദ്യരംഗം വഴി ഒരുക്കാനിരിക്കുന്ന യോഹന്നാന്റെ വാഗ്ദാനമാണ്.
      take_with_you: സെഖര്യാവും എലീശബെത്തും വർഷങ്ങളോളം പ്രാർത്ഥിച്ചു; ഒരു മറുപടിയും കേട്ടില്ല. എന്നിട്ടും ലൂക്കൊസ് അവരെ നീതിമാന്മാർ എന്നു വിളിക്കുന്നു. നീണ്ട കാത്തിരിപ്പ് ദൈവം നിങ്ങളെ മറന്നു എന്നതിന്റെ തെളിവല്ല.
    readings_thread: സാറായും ഹന്നായും എലീശബെത്തും ഒരു കുഞ്ഞിനായി വർഷങ്ങൾ കാത്തിരുന്നു. ഉല്പത്തി 2, രൂത്ത്, 133-ാം സങ്കീർത്തനം, എഫെസ്യർ എന്നിവ ഒരു കുടുംബം എങ്ങനെ ഒന്നിച്ചുനില്ക്കുന്നു എന്നു പറയുന്നു. സഭ ഈ ഞായറാഴ്ച മാതാപിതാക്കളുടെ ദിനമായും ആചരിക്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 1:5–7
      title: നീതിമാന്മാർ, എന്നിട്ടും കാത്തിരിക്കുന്നവർ
      text: രണ്ടു വസ്തുതകൾ ഒരുമിച്ചു പിടിച്ചുകൊണ്ടാണ് ലൂക്കൊസ് തുടങ്ങുന്നത്. സെഖര്യാവും എലീശബെത്തും ദൈവസന്നിധിയിൽ നീതിയുള്ളവർ ആയിരുന്നു; അവർക്കു മക്കളില്ലായിരുന്നു. ഇരുവരും വയസ്സുചെന്നവരും.
      easy_to_miss: അവരുടെ ലോകത്ത് മക്കളില്ലാത്ത വീട് ഒരു നിന്ദയായി കരുതപ്പെട്ടിരുന്നു; 25-ാം വാക്യത്തിൽ എലീശബെത്ത് ആ വാക്ക് ഉപയോഗിക്കുന്നു. അവരെക്കുറിച്ചുള്ള ആദ്യവാക്യത്തിൽത്തന്നെ ലൂക്കൊസ് ആ വായന തള്ളിക്കളയുന്നു.
    - verses: ലൂക്കൊസ് 1:8–10
      title: നറുക്കു സെഖര്യാവിനു വീഴുന്നു
      text: അവന്റെ കൂറിന്റെ ഊഴമാണ്; വിശുദ്ധമന്ദിരത്തിൽ കടന്നു ധൂപം കാട്ടാൻ നറുക്ക് അവനു വീഴുന്നു. അവൻ തനിയെ അകത്തു കടക്കുമ്പോൾ പുറത്ത് ഒരു പുരുഷാരം പ്രാർത്ഥിക്കുന്നു.
      easy_to_miss: ഊഴങ്ങളെക്കാൾ എത്രയോ അധികം പുരോഹിതന്മാർ ഉണ്ടായിരുന്നു. പാരമ്പര്യമനുസരിച്ച് ഒരു പുരോഹിതൻ ജീവിതത്തിൽ ഒരിക്കൽ മാത്രമേ ധൂപം അർപ്പിച്ചിരുന്നുള്ളൂ; ചിലർക്ക് ഒരിക്കലും അവസരം കിട്ടിയില്ല.
    - verses: ലൂക്കൊസ് 1:11–17
      title: യാഗപീഠത്തിനരികെ ഒരു ശബ്ദം
      text: ധൂപപീഠത്തിന്റെ വലത്തുഭാഗത്ത് ഗബ്രിയേൽ പ്രത്യക്ഷനാകുന്നു. “നിന്റെ പ്രാർത്ഥനെക്കു ഉത്തരമായി.” എലീശബെത്ത് യോഹന്നാൻ എന്ന ഒരു മകനെ പ്രസവിക്കും; അവൻ അനേകരെ ദൈവത്തിങ്കലേക്കു തിരിക്കും.
      easy_to_miss: മലാഖി പ്രവാചകന്റെ അവസാനവരികൾ (4:5–6) ഗബ്രിയേൽ കടമെടുക്കുന്നു. അവസാനത്തെ പ്രവാചകൻ നിർത്തിയിടത്തുനിന്നാണ് പുതിയനിയമത്തിന്റെ കഥ തുടരുന്നത്.
    - verses: ലൂക്കൊസ് 1:18–20
      title: ഞാൻ ഇതു എന്തൊന്നിനാൽ അറിയും?
      text: താനും ഭാര്യയും വൃദ്ധരായതുകൊണ്ട് സെഖര്യാവ് തെളിവു ചോദിക്കുന്നു. അവനു കിട്ടുന്ന അടയാളം അവൻ ചോദിച്ചതല്ല. വാഗ്ദാനം നിറവേറുന്ന ദിവസംവരെ അവൻ മൌനമായിരിക്കും.
      easy_to_miss: ഈ ഞായറാഴ്ച കുർബ്ബാനയ്ക്കു മുമ്പു വായിക്കുന്ന ഉല്പത്തി 17:17-ൽ അബ്രാഹാമും ഇതുപോലെ പ്രതികരിക്കുന്നു. പഴയനിയമവായനകൾ സുവിശേഷത്തിന്റെ പ്രതിധ്വനിയായി തിരഞ്ഞെടുത്തവയാണ്.
    - verses: ലൂക്കൊസ് 1:21–25
      title: മൌനം, പിന്നെ ഒരു കുഞ്ഞ്
      text: അവൻ എന്താണ് ഇത്ര താമസിക്കുന്നത് എന്ന് പുറത്തുള്ളവർ അതിശയിക്കുന്നു. സംസാരിക്കാൻ കഴിയാതെ സെഖര്യാവ് പുറത്തുവരുന്നു; ശുശ്രൂഷാദിവസങ്ങൾ തികച്ച് വീട്ടിലേക്കു പോകുന്നു. എലീശബെത്ത് ഗർഭം ധരിക്കുന്നു.
      easy_to_miss: കുഞ്ഞു ജനിച്ച് യോഹന്നാൻ എന്നു പേരിടുംവരെ അവന്റെ മൌനം നീളുന്നു (ലൂക്കൊസ് 1:57–64).
    people:
    - name: സെഖര്യാവ്
      role: അബീയാക്കൂറിലെ ഒരു പുരോഹിതൻ; യെരൂശലേമിൽ ശുശ്രൂഷയിൽ.
      name_meaning: “കർത്താവ് ഓർക്കുന്നു”
      ml: Zechariah
    - name: എലീശബെത്ത്
      role: അവന്റെ ഭാര്യ, അഹരോന്റെ കുടുംബത്തിൽനിന്ന്. മറിയയുടെ ബന്ധു.
      name_meaning: “എന്റെ ദൈവം ഒരു ആണയാകുന്നു”
      ml: Elizabeth
    - name: ഗബ്രിയേൽ
      role: “ദൈവസന്നിധിയിൽ നില്ക്കുന്ന” ദൂതൻ; സെഖര്യാവിനോടു സംസാരിക്കാൻ അയയ്ക്കപ്പെട്ടവൻ.
      name_meaning: “ദൈവം എന്റെ ബലം”
      ml: Gabriel
    - name: യോഹന്നാൻ
      role: വാഗ്ദത്തം ചെയ്യപ്പെട്ട മകൻ; പിന്നീട് സ്നാപകൻ എന്നു വിളിക്കപ്പെട്ടു. ക്രിസ്തുവിനു മുമ്പായി പോകുന്നവൻ.
      name_meaning: “കർത്താവ് കൃപയുള്ളവൻ”
      ml: John
    phrases:
    - term: അബീയാക്കൂറ്
      explanation: ദൈവാലയത്തിലെ പുരോഹിതന്മാർ 24 കൂറുകളായി ഊഴമനുസരിച്ച് ശുശ്രൂഷ ചെയ്തു. അബീയാവിന്റേത് എട്ടാമത്തേതായിരുന്നു (1 ദിനവൃത്താന്തം 24:10).
    - term: ധൂപപീഠം
      explanation: വിശുദ്ധമന്ദിരത്തിനുള്ളിൽ തിരശ്ശീലയ്ക്കു മുമ്പിലുള്ള പൊന്നുകൊണ്ടുള്ള ചെറിയ പീഠം. രാവിലെയും വൈകുന്നേരവും അതിൽ ധൂപം കത്തിച്ചിരുന്നു (പുറപ്പാട് 30:1–8).
    - term: ഏലീയാവിന്റെ ആത്മാവും ശക്തിയും
      explanation: കർത്താവിന്റെ ദിവസത്തിനു മുമ്പ് ഏലീയാവ് മടങ്ങിവരും എന്ന് മലാഖി പറഞ്ഞു. ഗബ്രിയേൽ ആ ദൌത്യം യോഹന്നാനു നല്കുന്നു (ലൂക്കൊസ് 1:17).
    reflection:
      title_en: കാത്തിരിപ്പിലും ദൈവം നമ്മെ മറക്കുന്നില്ല
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        എളുപ്പം വിട്ടുപോകാവുന്ന ഒരു വിശദാംശത്തോടെയാണ് ലൂക്കൊസ് സെഖര്യാവിനെയും എലീശബെത്തിനെയും പരിചയപ്പെടുത്തുന്നത്. ഇരുവരും നീതിമാന്മാരായിരുന്നു; അവർക്കു മക്കളില്ലായിരുന്നു. ഈ രണ്ടു വസ്തുതകളും അവൻ മനഃപൂർവ്വം അടുത്തടുത്തു വെക്കുന്നു. അവരുടെ നീണ്ട കാത്തിരിപ്പ് ഒരിക്കലും അവരുടെ വിശ്വാസത്തെക്കുറിച്ചുള്ള ഒരു വിധിയായിരുന്നില്ല. ദിവസവും പ്രാർത്ഥിക്കുന്നവരും വർഷങ്ങളോളം ഉത്തരം കിട്ടാത്ത ചോദ്യങ്ങൾ ചുമക്കുന്നുണ്ട്.

        ഉത്തരം വരുന്നത് ഒരു സാധാരണ ജോലിദിവസമാണ്. തന്റെ കൂറിനു നിശ്ചയിച്ച ജോലി ചെയ്തുകൊണ്ടിരിക്കുമ്പോഴാണ് ഗബ്രിയേൽ സെഖര്യാവിനോടു സംസാരിക്കുന്നത്. അവനു വാഗ്ദത്തം ചെയ്യപ്പെട്ട കുഞ്ഞ് മറ്റുള്ളവർക്കുവേണ്ടിക്കൂടി നല്കപ്പെടുന്നവനാണ്. ഒരു ജനത്തെ മുഴുവൻ യോഹന്നാൻ കർത്താവിനായി ഒരുക്കും; അതുകൊണ്ട് ഈ കുടുംബത്തിനു ലഭിക്കുന്നത് അതിനപ്പുറത്തേക്ക് എത്താനുള്ളതാണ്.

        ശ്രദ്ധിച്ചു വായിച്ചാൽ, ഓരോ പ്രാർത്ഥനയ്ക്കും പെട്ടെന്ന് ഉത്തരം കിട്ടുമെന്ന് ഈ സുവിശേഷം വാഗ്ദാനം ചെയ്യുന്നില്ല; മക്കളുണ്ടോ എന്നതുകൊണ്ട് ഒരു വീടിനെ അളക്കുന്നുമില്ല. അതിന്റെ അപേക്ഷ നമ്മോടാണ്. നിങ്ങൾക്കു ചുറ്റും ആരാണ് കാത്തിരിക്കുന്നത് എന്നു ശ്രദ്ധിക്കുക; അവരുടെ അടുത്തുണ്ടാകുക. വീട്ടിലെ ഒരാൾ തന്റെ കാര്യം മുഴുവൻ പറഞ്ഞുതീരുംവരെ മറുപടി പറയാതെ കേട്ടിരിക്കുന്നത് ഒരു തുടക്കമാണ്.
      title_ml: Even in the waiting, God does not forget us
    week:
      question: നിങ്ങളുടെ അടുത്ത് ഇപ്പോൾ എന്തിനെങ്കിലുമായി കാത്തിരിക്കുന്നത് ആരാണ്? അടുത്ത ഞായറാഴ്ചയ്ക്കു മുമ്പ് അവർക്കായി ചെയ്യാവുന്ന ഒരു ചെറിയ കാര്യം എന്ത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഒരു ഫലത്തിനോ ജോലിക്കോ രോഗസൌഖ്യത്തിനോ മറുപടിക്കോ കാത്തിരിക്കുന്ന ഒരാൾക്കു സന്ദേശം അയയ്ക്കുകയോ അവരെ സന്ദർശിക്കുകയോ ചെയ്യുക. സുഖമാണോ എന്നു ചോദിച്ച് കേട്ടിരിക്കുക.
      prayer: കർത്താവേ, നീ സെഖര്യാവിനെയും എലീശബെത്തിനെയും ഓർത്തു. ഇനിയും കാത്തിരിക്കുന്നവരെ ഓർക്കേണമേ. വിഷമിക്കുന്നവരെ കേൾക്കാൻ ഞങ്ങളെ പഠിപ്പിക്കേണമേ; ഞങ്ങളുടെ ഭവനത്തിൽ ക്ഷമയും കരുണയും വളരുമാറാകട്ടെ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 19:3–12
        ml: മത്തായി 19:3–12
        note: 'വിവാഹമോചനത്തെക്കുറിച്ചു ചോദിക്കുമ്പോൾ യേശു ആരംഭത്തിലേക്കു ചൂണ്ടുന്നു: ദൈവം യോജിപ്പിച്ചതിനെ മനുഷ്യൻ വേർപിരിക്കരുത്.'
        printed: St. Matthew 19:3-12
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 10:38–42
        ml: ലൂക്കൊസ് 10:38–42
        note: മാർത്ത ശുശ്രൂഷയിൽ തിരക്കിലാണ്; മറിയ ഇരുന്നു കേൾക്കുന്നു.
        printed: St. Luke 10:38-42
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 2:18–25
        ml: ഉല്പത്തി 2:18–25
        note: 'ആദ്യത്തെ കുടുംബം: മനുഷ്യൻ ഏകനായിരിക്കുന്നതു നന്നല്ല.'
        printed: Genesis 2:18-25
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 17:15–22
        ml: ഉല്പത്തി 17:15–22
        note: വാർദ്ധക്യത്തിൽ സാറെക്ക് ഒരു മകനെ വാഗ്ദാനം ചെയ്യുന്നു; അബ്രാഹാം ചിരിക്കുന്നു.
        printed: Genesis 17:15-22
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Numbers 8:13–20
        ml: സംഖ്യാപുസ്തകം 8:13–20
        note: വിശുദ്ധമന്ദിരത്തിൽ ശുശ്രൂഷിക്കാനായി ലേവ്യരെ വേർതിരിക്കുന്നു.
        printed: Numbers 8:13-20
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Ruth 1:11–18
        ml: രൂത്ത് 1:11–18
        note: 'നൊവൊമിയെ വിട്ടുപോകാൻ രൂത്ത് വിസമ്മതിക്കുന്നു: നീ പോകുന്നേടത്തു ഞാനും പോരും.'
        printed: Ruth 1:11-18
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: 1 Samuel 1:9–17
        ml: 1 ശമൂവേൽ 1:9–17
        note: ഒരു കുഞ്ഞിനുവേണ്ടി ഹന്നാ ദൈവാലയത്തിൽ പ്രാർത്ഥിക്കുന്നു.
        printed: I Samuel 1:9-17
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Psalm 133:1–3
        ml: സങ്കീർത്തനങ്ങൾ 133:1–3
        note: സഹോദരന്മാർ ഒത്തൊരുമിച്ചു വസിക്കുന്നത് എത്ര നല്ലതും മനോഹരവും.
        printed: Psalms 133:1-3
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 41:8–15
        ml: യെശയ്യാവ് 41:8–15
        note: ഞാൻ നിന്നോടുകൂടെ ഉള്ളതുകൊണ്ടു ഭയപ്പെടേണ്ട എന്നു ദൈവം യിസ്രായേലിനോടു പറയുന്നു.
        printed: Isaiah 41:8-15
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: 2 Peter 1:1–15
        ml: 2 പത്രൊസ് 1:1–15
        note: വിശ്വാസത്തോടു സദ്ഗുണം, പരിജ്ഞാനം, ഇന്ദ്രിയജയം, സഹിഷ്ണുത എന്നിവ കൂട്ടിച്ചേർക്കുക.
        printed: II Peter 1:1-15
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Ephesians 5:21–6:4
        ml: എഫെസ്യർ 5:21–6:4
        note: 'കർത്താവിൽ ഒരു ഭവനം എങ്ങനെ ജീവിക്കുന്നു: ഭാര്യാഭർത്താക്കന്മാർ, മക്കൾ, മാതാപിതാക്കൾ.'
        printed: Ephesians 5:21-6:4
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 1:5–25
        ml: ലൂക്കൊസ് 1:5–25
        note: എലീശബെത്ത് ഒരു മകനെ പ്രസവിക്കും എന്നു ഗബ്രിയേൽ സെഖര്യാവിനോടു പറയുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Luke 1:5-25
