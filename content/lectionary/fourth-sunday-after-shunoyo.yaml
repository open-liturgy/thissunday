one_minute:
  what_happens: In the Sermon on the Mount, Jesus tells his followers not to repay evil for evil, to turn the other cheek, give more than is demanded and go the extra mile. He tells them to love their enemies and pray for persecutors, as the Father sends sun and rain on everyone.
  why_this_sunday: These are some of the hardest words in the Gospels, read in the long season of growing in the Spirit.
  take_with_you: Loving enemies is not a feeling. It starts with praying for them.
readings_thread: God calls Moses from the burning bush and gives his name. Job prays for his children, and Isaiah says though your sins are like scarlet, they will be white as snow. Peter calls us living stones, and Paul says we are God’s temple.
key_verse:
  ref: Matthew 5:44
  ml: 'ഞാനോ നിങ്ങളോടു പറയുന്നതു: നിങ്ങളുടെ ശത്രുക്കളെ സ്നേഹിപ്പിൻ; നിങ്ങളെ ഉപദ്രവിക്കുന്നവർക്കു വേണ്ടി പ്രാർത്ഥിപ്പിൻ.'
  ml_translation: Sathyavedapusthakam, 1910
  en: But I tell you, love your enemies, bless those who curse you, do good to those who hate you, and pray for those who mistreat you and persecute you,
  en_translation: World English Bible
scenes:
- verses: Matthew 5:38–39
  title: The other cheek
  text: 'You have heard: an eye for an eye. But I say, do not resist an evil person. If someone strikes you on the right cheek, turn to him the other also.'
  easy_to_miss: “Eye for an eye” was meant to limit revenge, not require it (Exodus 21:24). Jesus goes further and ends revenge altogether.
- verses: Matthew 5:40–42
  title: The second mile
  text: If someone sues you for your shirt, give your coat too. If someone forces you to go one mile, go two. Give to the one who asks, and do not turn away the borrower.
  easy_to_miss: 'Roman soldiers could force civilians to carry their gear for a mile. Jesus says: carry it a second mile by choice.'
- verses: Matthew 5:43–45
  title: Love your enemies
  text: 'You have heard: love your neighbour and hate your enemy. But I say, love your enemies and pray for those who persecute you, so you may be children of your Father, who sends sun and rain on good and bad alike.'
  easy_to_miss: The Old Testament never says “hate your enemy”. Jesus is correcting a popular saying.
- verses: Matthew 5:46–47
  title: What reward?
  text: If you love only those who love you, what reward is there? Even tax collectors do that. If you greet only your friends, what more are you doing?
  easy_to_miss: Matthew, who wrote this, was himself a tax collector.
- verses: Matthew 5:48
  title: Perfect as your Father
  text: Be perfect, therefore, as your heavenly Father is perfect.
  easy_to_miss: The word means complete or whole. In context, it is about love that leaves no one out.
people:
- name: The crowd on the mountain
  ml: മലയിലെ പുരുഷാരം
  role: Disciples and crowds listening to the Sermon on the Mount.
  name_meaning: —
phrases:
- term: Eye for an eye
  explanation: A law that limited punishment to the harm done (Exodus 21:24). It stopped feuds from escalating.
- term: Second mile
  explanation: A Roman soldier could compel a civilian to carry his pack one mile. Going two was a free gift.
- term: Perfect
  explanation: 'Greek teleios: complete, mature, whole. Love that includes even enemies.'
reflection:
  title_en: Pray for them first
  title_ml: ആദ്യം അവർക്കുവേണ്ടി പ്രാർത്ഥിക്കുക
  read_time: A three-minute read
  body: |-
    These verses can feel impossible. Turn the other cheek? Love the people who hurt us? Many people read them and quietly decide they are meant for saints. But Jesus said them to ordinary people sitting on a hillside, and he lived them on the cross when he prayed for those killing him.

    It helps to notice where Jesus starts. He does not say “feel warmly towards your enemies”. He says pray for them. That is something we can actually do, even through gritted teeth. Praying for someone changes how we see them. It is hard to keep hating someone you bring before God every day.

    Most of us do not have enemies in the dramatic sense. We have a difficult relative, a colleague who undermines us, a neighbour who never returns a greeting. This week, start where Jesus starts. Pray for them by name. Then see if the second mile becomes a little easier to walk.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Who is hardest for you to love right now? Would you be willing to pray for them this week?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Pray every day this week, by name, for one person who has hurt you, and do one kind thing for them if you can.
  prayer: Father, you send sun and rain on good and bad alike. Give us hearts big enough to love our enemies and pray for those who hurt us, and make us your children in truth. Amen.
translations:
  ml:
    name:
      en: ശൂനോയോയ്ക്കു ശേഷം നാലാം ഞായർ
      ml: Fourth Sunday after Shunoyo
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: ശത്രുക്കളെ സ്നേഹിപ്പിൻ, ഉപദ്രവിക്കുന്നവർക്കുവേണ്ടി പ്രാർത്ഥിപ്പിൻ
    standfirst: ‘കണ്ണിനു പകരം കണ്ണ്’ എന്ന പഴയ നിയമം എടുത്ത് യേശു അതിനപ്പുറത്തേക്ക് ഏറെ പോകുന്നു. മറ്റേ ചെകിടും തിരിച്ചുകാണിക്കുക, രണ്ടാമത്തെ നാഴികയും പോകുക, ശത്രുക്കളെ സ്നേഹിക്കുക, സ്വർഗ്ഗീയപിതാവിനെപ്പോലെ സൽഗുണപൂർണ്ണരാകുക.
    description: ശൂനോയോയ്ക്കു ശേഷം നാലാം ഞായറിലെ വായനകൾ, “ശത്രുക്കളെ സ്നേഹിപ്പിൻ” എന്ന മത്തായി 5:38–48 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും കുടുംബചോദ്യവും.
    one_minute:
      what_happens: ഗിരിപ്രഭാഷണത്തിൽ, തിന്മയ്ക്കു പകരം തിന്മ ചെയ്യരുതെന്നും, മറ്റേ ചെകിടും തിരിച്ചുകാണിക്കണമെന്നും, ആവശ്യപ്പെടുന്നതിലും അധികം കൊടുക്കണമെന്നും, രണ്ടാമത്തെ നാഴികയും പോകണമെന്നും യേശു തന്റെ അനുയായികളോടു പറയുന്നു. പിതാവ് എല്ലാവരുടെമേലും സൂര്യനെ ഉദിപ്പിക്കുകയും മഴ പെയ്യിക്കുകയും ചെയ്യുന്നതുപോലെ, ശത്രുക്കളെ സ്നേഹിക്കാനും ഉപദ്രവിക്കുന്നവർക്കുവേണ്ടി പ്രാർത്ഥിക്കാനും അവൻ പറയുന്നു.
      why_this_sunday: സുവിശേഷങ്ങളിലെ ഏറ്റവും കഠിനമായ വാക്കുകളിൽ ചിലതാണിവ; ആത്മാവിൽ വളരുന്ന നീണ്ട കാലത്തു വായിക്കപ്പെടുന്നു.
      take_with_you: ശത്രുക്കളെ സ്നേഹിക്കുന്നത് ഒരു വികാരമല്ല. അവർക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നതിലൂടെ അതു തുടങ്ങുന്നു.
    readings_thread: കത്തുന്ന മുൾപ്പടർപ്പിൽനിന്നു ദൈവം മോശെയെ വിളിച്ച് തന്റെ നാമം വെളിപ്പെടുത്തുന്നു. ഇയ്യോബ് തന്റെ മക്കൾക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നു; നിങ്ങളുടെ പാപങ്ങൾ കടുഞ്ചുവപ്പായിരുന്നാലും ഹിമംപോലെ വെളുക്കും എന്നു യെശയ്യാവു പറയുന്നു. പത്രൊസ് നമ്മെ ജീവനുള്ള കല്ലുകൾ എന്നു വിളിക്കുന്നു; നാം ദൈവത്തിന്റെ മന്ദിരം എന്നു പൌലൊസ് പറയുന്നു.
    scenes:
    - verses: മത്തായി 5:38–39
      title: മറ്റേ ചെകിടും
      text: 'കണ്ണിനു പകരം കണ്ണും പല്ലിന്നു പകരം പല്ലും എന്ന് അരുളിച്ചെയ്തതു നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ. ഞാനോ നിങ്ങളോടു പറയുന്നതു: ദുഷ്ടനോടു എതിർക്കരുതു; നിന്നെ വലത്തെ ചെകിട്ടത്തു അടിക്കുന്നവന്നു മറ്റേതും തിരിച്ചുകാണിക്ക.'
      easy_to_miss: ‘കണ്ണിനു പകരം കണ്ണ്’ പ്രതികാരത്തിനു പരിധി വെക്കാനുള്ളതായിരുന്നു; അത് ആവശ്യപ്പെടാനുള്ളതല്ല (പുറപ്പാടു 21:24). യേശു കൂടുതൽ മുന്നോട്ടുപോയി പ്രതികാരം പൂർണ്ണമായി അവസാനിപ്പിക്കുന്നു.
    - verses: മത്തായി 5:40–42
      title: രണ്ടാമത്തെ നാഴിക
      text: നിന്നോടു വ്യവഹരിച്ചു നിന്റെ വസ്ത്രം എടുപ്പാൻ ഇച്ഛിക്കുന്നവനു നിന്റെ പുതപ്പും വിട്ടുകൊടുക്ക. ഒരുത്തൻ നിന്നെ ഒരു നാഴിക വഴി പോകുവാൻ നിർബ്ബന്ധിച്ചാൽ രണ്ടു അവനോടുകൂടെ പോക. നിന്നോടു യാചിക്കുന്നവനു കൊടുക്ക.
      easy_to_miss: 'തങ്ങളുടെ ഭാണ്ഡം ഒരു നാഴിക ചുമക്കാൻ റോമൻ പടയാളികൾക്കു സാധാരണക്കാരെ നിർബ്ബന്ധിക്കാമായിരുന്നു. യേശു പറയുന്നു: രണ്ടാമത്തെ നാഴിക സ്വമനസ്സാലെ ചുമക്കുക.'
    - verses: മത്തായി 5:43–45
      title: ശത്രുക്കളെ സ്നേഹിപ്പിൻ
      text: 'കൂട്ടുകാരനെ സ്നേഹിക്ക എന്നും ശത്രുവിനെ പകെക്ക എന്നും അരുളിച്ചെയ്തതു നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ. ഞാനോ നിങ്ങളോടു പറയുന്നതു: നിങ്ങളുടെ ശത്രുക്കളെ സ്നേഹിപ്പിൻ; നിങ്ങളെ ഉപദ്രവിക്കുന്നവർക്കു വേണ്ടി പ്രാർത്ഥിപ്പിൻ. അവൻ ദുഷ്ടന്മാരുടെമേലും നല്ലവരുടെമേലും തന്റെ സൂര്യനെ ഉദിപ്പിക്കുകയും മഴപെയ്യിക്കുകയും ചെയ്യുന്നു.'
      easy_to_miss: ‘ശത്രുവിനെ പകെക്ക’ എന്നു പഴയനിയമം ഒരിടത്തും പറയുന്നില്ല. യേശു ഒരു ജനകീയചൊല്ലിനെയാണ് തിരുത്തുന്നത്.
    - verses: മത്തായി 5:46–47
      title: എന്തു പ്രതിഫലം?
      text: നിങ്ങളെ സ്നേഹിക്കുന്നവരെ സ്നേഹിച്ചാൽ നിങ്ങൾക്കു എന്തു പ്രതിഫലം? ചുങ്കക്കാരും അങ്ങനെ തന്നേ ചെയ്യുന്നില്ലയോ? സഹോദരന്മാരെ മാത്രം വന്ദനം ചെയ്താൽ നിങ്ങൾ എന്തു വിശേഷം ചെയ്യുന്നു?
      easy_to_miss: ഇതെഴുതിയ മത്തായി തന്നെ ഒരു ചുങ്കക്കാരനായിരുന്നു.
    - verses: മത്തായി 5:48
      title: പിതാവിനെപ്പോലെ സൽഗുണപൂർണ്ണർ
      text: ആകയാൽ നിങ്ങളുടെ സ്വർഗ്ഗീയപിതാവു സൽഗുണപൂർണ്ണൻ ആയിരിക്കുന്നതുപോലെ നിങ്ങളും സൽഗുണപൂർണ്ണരാകുവിൻ.
      easy_to_miss: ഈ വാക്കിനു പൂർണ്ണം, സമഗ്രം എന്നാണ് അർത്ഥം. സന്ദർഭത്തിൽ, ആരെയും ഒഴിവാക്കാത്ത സ്നേഹത്തെക്കുറിച്ചാണ് ഇത്.
    people:
    - name: മലമേലുള്ള പുരുഷാരം
      role: ഗിരിപ്രഭാഷണം കേൾക്കുന്ന ശിഷ്യന്മാരും പുരുഷാരവും.
      name_meaning: —
      ml: The crowd on the mountain
    phrases:
    - term: കണ്ണിനു പകരം കണ്ണ്
      explanation: ശിക്ഷയെ ഉണ്ടായ ദ്രോഹത്തിന് ഒതുക്കിനിർത്തിയ ഒരു നിയമം (പുറപ്പാടു 21:24). കുടിപ്പകകൾ വളരുന്നത് അതു തടഞ്ഞു.
    - term: രണ്ടാമത്തെ നാഴിക
      explanation: ഒരു റോമൻ പടയാളിക്ക് ഒരു സാധാരണക്കാരനെക്കൊണ്ട് തന്റെ ഭാണ്ഡം ഒരു നാഴിക ചുമപ്പിക്കാമായിരുന്നു. രണ്ടു നാഴിക പോകുന്നതു സൌജന്യമായ ഒരു ദാനമായിരുന്നു.
    - term: സൽഗുണപൂർണ്ണൻ
      explanation: 'ഗ്രീക്കിൽ ‘തെലെയോസ്’: പൂർണ്ണം, പക്വം, സമഗ്രം. ശത്രുക്കളെപ്പോലും ഉൾക്കൊള്ളുന്ന സ്നേഹം.'
    reflection:
      title_en: ആദ്യം അവർക്കുവേണ്ടി പ്രാർത്ഥിക്കുക
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ഈ വാക്യങ്ങൾ അസാദ്ധ്യമെന്നു തോന്നാം. മറ്റേ ചെകിടും തിരിച്ചുകാണിക്കുക? നമ്മെ വേദനിപ്പിക്കുന്നവരെ സ്നേഹിക്കുക? പലരും ഇതു വായിച്ചിട്ട്, ഇതു വിശുദ്ധന്മാർക്കുള്ളതാണെന്നു നിശ്ശബ്ദമായി തീരുമാനിക്കുന്നു. എന്നാൽ ഒരു മലഞ്ചെരിവിൽ ഇരുന്ന സാധാരണക്കാരോടാണ് യേശു ഇതു പറഞ്ഞത്; തന്നെ കൊല്ലുന്നവർക്കുവേണ്ടി പ്രാർത്ഥിച്ചപ്പോൾ ക്രൂശിൽ അവൻ ഇതു ജീവിച്ചുകാണിക്കുകയും ചെയ്തു.

        യേശു എവിടെനിന്നു തുടങ്ങുന്നു എന്നു ശ്രദ്ധിക്കുന്നതു സഹായിക്കും. ‘ശത്രുക്കളോടു സ്നേഹവികാരം തോന്നട്ടെ’ എന്നല്ല അവൻ പറയുന്നത്. അവർക്കുവേണ്ടി പ്രാർത്ഥിക്കുക എന്നാണ്. പല്ലുകടിച്ചുകൊണ്ടാണെങ്കിലും നമുക്കു യഥാർത്ഥത്തിൽ ചെയ്യാൻ കഴിയുന്ന ഒന്നാണത്. ഒരാൾക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നതു നാം അവരെ കാണുന്ന വിധത്തെ മാറ്റുന്നു. എല്ലാ ദിവസവും ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന ഒരാളെ വെറുത്തുകൊണ്ടിരിക്കാൻ പ്രയാസമാണ്.

        നമ്മിൽ മിക്കവർക്കും നാടകീയമായ അർത്ഥത്തിൽ ശത്രുക്കളില്ല. ബുദ്ധിമുട്ടുള്ള ഒരു ബന്ധു, നമ്മെ താഴ്ത്തിക്കെട്ടുന്ന ഒരു സഹപ്രവർത്തകൻ, ഒരിക്കലും അഭിവാദ്യം മടക്കാത്ത ഒരു അയൽക്കാരൻ, അങ്ങനെയുള്ളവർ നമുക്കുണ്ട്. ഈ ആഴ്ച യേശു തുടങ്ങുന്നിടത്തുനിന്നു തുടങ്ങുക. അവരുടെ പേരു പറഞ്ഞ് അവർക്കുവേണ്ടി പ്രാർത്ഥിക്കുക. എന്നിട്ട് രണ്ടാമത്തെ നാഴിക നടക്കാൻ അല്പം എളുപ്പമാകുന്നുണ്ടോ എന്നു നോക്കുക.
      title_ml: Pray for them first
    week:
      question: ഇപ്പോൾ നിങ്ങൾക്കു സ്നേഹിക്കാൻ ഏറ്റവും പ്രയാസമുള്ളത് ആരെയാണ്? ഈ ആഴ്ച അവർക്കുവേണ്ടി പ്രാർത്ഥിക്കാൻ നിങ്ങൾ തയ്യാറാണോ?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: നിങ്ങളെ വേദനിപ്പിച്ച ഒരാൾക്കുവേണ്ടി ഈ ആഴ്ച എല്ലാ ദിവസവും പേരുപറഞ്ഞു പ്രാർത്ഥിക്കുക; കഴിയുമെങ്കിൽ അവർക്കായി ഒരു നന്മ ചെയ്യുക.
      prayer: പിതാവേ, നല്ലവരുടെമേലും ദുഷ്ടന്മാരുടെമേലും നീ സൂര്യനെ ഉദിപ്പിക്കുകയും മഴ പെയ്യിക്കുകയും ചെയ്യുന്നു. ഞങ്ങളുടെ ശത്രുക്കളെ സ്നേഹിക്കാനും ഞങ്ങളെ വേദനിപ്പിക്കുന്നവർക്കുവേണ്ടി പ്രാർത്ഥിക്കാനും തക്ക വിശാലമായ ഹൃദയം ഞങ്ങൾക്കു തരേണമേ; സത്യമായും നിന്റെ മക്കളാക്കി ഞങ്ങളെ തീർക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 18:1–11
        ml: മത്തായി 18:1–11
        note: നിങ്ങൾ ശിശുക്കളെപ്പോലെ ആകുന്നില്ല എങ്കിൽ…; ഈ ചെറിയവരിൽ ഒരുത്തനെ തുച്ഛീകരിക്കരുത്.
        printed: St. Matthew 18:1-11
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 18:12–22
        ml: മത്തായി 18:12–22
        note: കാണാതെപോയ ആട്, തെറ്റു പരിഹരിക്കൽ, ഏഴു എഴുപതു വട്ടം ക്ഷമിക്കൽ.
        printed: St. Matthew 18:12-22
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Exodus 3:1–6, 11–14
        ml: പുറപ്പാട് 3:1–6, 11–14
        note: 'എരിയുന്ന മുൾപ്പടർപ്പ്: നിന്റെ കാലിൽനിന്നു ചെരിപ്പ് അഴിക്ക; ഞാൻ ആകുന്നവൻ ഞാൻ ആകുന്നു.'
        printed: Exodus 3:1-6, 11-14
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Job 1:1–5
        ml: ഇയ്യോബ് 1:1–5
        note: നിഷ്കളങ്കനും നേരുള്ളവനുമായ ഇയ്യോബ് അതികാലത്ത് എഴുന്നേറ്റു മക്കൾക്കുവേണ്ടി യാഗം കഴിക്കുന്നു.
        printed: Job 1:1-5
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 1:15–20
        ml: യെശയ്യാവ് 1:15–20
        note: നിങ്ങളുടെ പാപങ്ങൾ കടുഞ്ചുവപ്പായിരുന്നാലും ഹിമംപോലെ വെളുക്കും.
        printed: Isaiah 1:15-20
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: 1 Peter 2:1–5
        ml: 1 പത്രൊസ് 2:1–5
        note: ഇപ്പോൾ ജനിച്ച ശിശുക്കളെപ്പോലെ മായമില്ലാത്ത ആത്മീയപാൽ കുടിപ്പാൻ വാഞ്ഛിപ്പിൻ; ജീവനുള്ള കല്ലുകളായി പണിയപ്പെടുവിൻ.
        printed: I Peter 2:1-5
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 1 Corinthians 3:16–23
        ml: 1 കൊരിന്ത്യർ 3:16–23
        note: നിങ്ങൾ ദൈവത്തിന്റെ മന്ദിരം; സകലവും നിങ്ങൾക്കുള്ളത്, നിങ്ങളോ ക്രിസ്തുവിനുള്ളവർ.
        printed: I Corinthians 3:16-23
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 5:38–48
        ml: മത്തായി 5:38–48
        note: മറ്റേ കവിളും തിരിച്ചുകാണിക്ക; ശത്രുക്കളെ സ്നേഹിപ്പിൻ, നിങ്ങളെ ഉപദ്രവിക്കുന്നവർക്കുവേണ്ടി പ്രാർത്ഥിപ്പിൻ. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Matthew 5:38-48
        main: true
    key_verse:
      ref: മത്തായി 5:44
    hero_quote:
      text: ആകയാൽ നിങ്ങളുടെ സ്വർഗ്ഗീയപിതാവു സൽഗുണപൂർണ്ണൻ ആയിരിക്കുന്നതുപോലെ നിങ്ങളും സൽഗുണപൂർണ്ണരാകുവിൻ.
      ref: മത്തായി 5:48
