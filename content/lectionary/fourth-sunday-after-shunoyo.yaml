name:
  en: Fourth Sunday after Shunoyo
  ml: ശൂനോയോയ്ക്കു ശേഷം നാലാം ഞായർ
title_as_printed: Fourth Sunday after the Festival of the Ascension of St. Mary
season:
  en: Pentecost
  gloss: The season of the Holy Spirit
  syr: ܦܢܛܩܘܣܛܐ
tagline: Love your enemies, pray for those who persecute you
standfirst: Jesus takes the old rule of “an eye for an eye” and goes far beyond it. Turn the other cheek, go the second mile, love your enemies, and be perfect as your Father is perfect.
description: Readings for the Fourth Sunday after Shunoyo, with Matthew 5:38–48, “love your enemies”, explained in five scenes. A reflection and a family question.
hero_quote:
  text: Therefore you shall be perfect, just as your Father in heaven is perfect.
  ref: Matthew 5:48
