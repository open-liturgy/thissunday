phrases:
- term: Temple tax
  explanation: A half-shekel, about two days’ wages, paid yearly by every Jewish man for the Temple (Exodus 30:13).
- term: Stater
  explanation: A silver coin worth four drachmas, exactly enough for two people’s Temple tax.
- term: Cause to stumble
  explanation: To put an obstacle in someone’s way that might lead them to sin or turn from God.
reflection:
  title_en: Free, and choosing not to offend
  title_ml: സ്വതന്ത്രൻ, എങ്കിലും ഇടർച്ച വരുത്താതെ
  read_time: A three-minute read
  body: |-
    This is one of the strangest stories in the Gospels, and one of the gentlest. Jesus has every right not to pay a tax for his Father’s house. He is the Son. But he does not insist on his rights. He pays, so as not to put an obstacle in anyone’s way.

    Many arguments in families and parishes are about rights. Who should apologise first. Whose turn it is. What I am owed. Often we are technically right. Jesus shows another way: knowing you are free, and choosing to give way for the sake of peace and other people’s faith.

    He also pays for Peter. One coin, for me and for you. It is a small picture of a much larger gift. On the cross Jesus paid what we could not, and included us with himself. Before we argue for our rights this week, it is worth remembering how much has been paid for us.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Is there a right you have been insisting on that you could give up for someone else’s sake?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Let one argument go this week, even if you are right, for the sake of peace.
  prayer: Lord Jesus, you were free and still paid the tax for yourself and Peter. Teach us to give up our rights for the sake of others, and thank you for paying what we owed. Amen.
