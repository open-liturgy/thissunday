tagline: A coin in a fish’s mouth
standfirst: Tax collectors ask Peter whether his teacher pays the Temple tax. Jesus says the king’s children should be free, but pays anyway, with a coin Peter finds in the mouth of a fish.
description: Readings for the Third Sunday after Shunoyo, with Matthew 17:22–27, the Temple tax and the coin in the fish, explained. Reflection and question.
