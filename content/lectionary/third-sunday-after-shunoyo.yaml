one_minute:
  what_happens: In Galilee Jesus tells his disciples he will be betrayed, killed and raised on the third day, and they are deeply grieved. In Capernaum the Temple tax collectors question Peter. Jesus says sons are free, but so as not to offend, sends Peter to catch a fish with a coin in its mouth.
  why_this_sunday: This is an unusual and gentle story about freedom and not giving needless offence.
  take_with_you: Jesus was free not to pay, and paid anyway, so as not to make anyone stumble.
readings_thread: Moses goes up the mountain into the cloud, and the boy Samuel becomes known as a prophet. Ezekiel says if the wicked turn from their ways they will live. James warns the rich who hold back wages, and Paul speaks with the gentleness of Christ.
key_verse:
  ref: Matthew 17:27
  ml: എങ്കിലും നാം അവർക്കു ഇടർച്ച വരുത്താതിരിക്കേണ്ടതിന്നു നീ കടലിലേക്കു ചെന്നു ചൂണ്ടൽ ഇട്ടു ആദ്യം കിട്ടുന്ന മീനിനെ എടുക്ക; അതിന്റെ വായ് തുറക്കുമ്പോൾ ഒരു ചതുർദ്രഹ്മപ്പണം കാണും; അതു എടുത്തു എനിക്കും നിനക്കും വേണ്ടി കൊടുക്ക എന്നു പറഞ്ഞു.
  ml_translation: Sathyavedapusthakam, 1910
  en: But, lest we cause them to stumble, go to the sea, cast a hook, and take up the first fish that comes up. When you have opened its mouth, you will find a stater coin. Take that, and give it to them for me and you.”
  en_translation: World English Bible
scenes:
- verses: Matthew 17:22–23
  title: On the third day
  text: 'As they gather in Galilee, Jesus says: the Son of Man will be handed over, they will kill him, and on the third day he will be raised. The disciples are greatly distressed.'
  easy_to_miss: They hear the death and miss the resurrection. Grief closes their ears to the last part.
- verses: Matthew 17:24–25a
  title: Does your teacher pay?
  text: 'In Capernaum the collectors of the Temple tax ask Peter: does your teacher not pay the tax? Yes, he does, says Peter.'
  easy_to_miss: Peter answers for Jesus without asking him first. He is often quick to speak.
- verses: Matthew 17:25b–26
  title: The children are free
  text: 'At home Jesus asks: from whom do kings collect taxes, from their own children or from others? From others. Then the children are free, says Jesus.'
  easy_to_miss: The tax was for God’s house. Jesus is the Son of the house, so he owes nothing.
- verses: Matthew 17:27a
  title: So as not to offend
  text: But so that we do not cause offence, go to the lake, throw out a hook and take the first fish you catch.
  easy_to_miss: Jesus chooses to give up a right so others are not hurt. Paul teaches the same in 1 Corinthians 8.
- verses: Matthew 17:27b
  title: For me and for you
  text: Open its mouth and you will find a coin. Take it and give it to them for me and for you.
  easy_to_miss: One coin pays for both. Jesus includes Peter with himself.
people:
- name: Peter
  ml: പത്രൊസ്
  role: A fisherman sent back to fishing for a coin.
  name_meaning: “Rock”
- name: The tax collectors
  ml: ദ്വിദ്രഹ്മപ്പണം വാങ്ങുന്നവർ
  role: Men collecting the yearly half-shekel for the Temple.
  name_meaning: —
phrases:
- term: Temple tax
  explanation: A half-shekel, about two days’ wages, paid yearly by every Jewish man for the Temple (Exodus 30:13).
- term: Stater
  explanation: A silver coin worth four drachmas, exactly enough for two people’s Temple tax.
- term: Cause to stumble
  explanation: To put an obstacle in someone’s way that might lead them to sin or turn from God.
reflection:
  title_en: Free, and choosing not to offend
  title_ml: സ്വതന്ത്രൻ, എങ്കിലും ഇടർച്ച വരുത്താതെ
  read_time: A three-minute read
  body: |-
    This is one of the strangest stories in the Gospels, and one of the gentlest. Jesus has every right not to pay a tax for his Father’s house. He is the Son. But he does not insist on his rights. He pays, so as not to put an obstacle in anyone’s way.

    Many arguments in families and parishes are about rights. Who should apologise first. Whose turn it is. What I am owed. Often we are technically right. Jesus shows another way: knowing you are free, and choosing to give way for the sake of peace and other people’s faith.

    He also pays for Peter. One coin, for me and for you. It is a small picture of a much larger gift. On the cross Jesus paid what we could not, and included us with himself. Before we argue for our rights this week, it is worth remembering how much has been paid for us.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: Is there a right you have been insisting on that you could give up for someone else’s sake?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Let one argument go this week, even if you are right, for the sake of peace.
  prayer: Lord Jesus, you were free and still paid the tax for yourself and Peter. Teach us to give up our rights for the sake of others, and thank you for paying what we owed. Amen.
translations:
  ml:
    name:
      en: ശൂനോയോയ്ക്കു ശേഷം മൂന്നാം ഞായർ
      ml: Third Sunday after Shunoyo
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: മീനിന്റെ വായിൽ ഒരു നാണയം
    standfirst: തങ്ങളുടെ ഗുരു ദൈവാലയക്കരം കൊടുക്കുന്നുണ്ടോ എന്നു കരം പിരിക്കുന്നവർ പത്രൊസിനോടു ചോദിക്കുന്നു. രാജാവിന്റെ പുത്രന്മാർ ഒഴിവുള്ളവരാണെന്നു യേശു പറയുന്നു; എങ്കിലും പത്രൊസ് ഒരു മീനിന്റെ വായിൽ കണ്ടെത്തുന്ന നാണയംകൊണ്ട് അവൻ അതു കൊടുക്കുന്നു.
    description: 'ശൂനോയോയ്ക്കു ശേഷം മൂന്നാം ഞായറിലെ വായനകൾ, ദൈവാലയക്കരവും മീനിലെ നാണയവും: മത്തായി 17:22–27 വിശദമായി. ധ്യാനവും ചോദ്യവും.'
    one_minute:
      what_happens: താൻ ഏല്പിക്കപ്പെടുമെന്നും കൊല്ലപ്പെടുമെന്നും മൂന്നാം നാൾ ഉയിർത്തെഴുന്നേല്ക്കുമെന്നും ഗലീലയിൽവെച്ചു യേശു ശിഷ്യന്മാരോടു പറയുന്നു; അവർ ഏറ്റവും ദുഃഖിക്കുന്നു. കഫർന്നഹൂമിൽ ദൈവാലയക്കരം പിരിക്കുന്നവർ പത്രൊസിനെ ചോദ്യം ചെയ്യുന്നു. പുത്രന്മാർ ഒഴിവുള്ളവരാണെന്നു യേശു പറയുന്നു; എങ്കിലും ഇടർച്ച വരുത്താതിരിക്കേണ്ടതിന്ന്, വായിൽ നാണയമുള്ള ഒരു മീനിനെ പിടിക്കാൻ പത്രൊസിനെ അയക്കുന്നു.
      why_this_sunday: സ്വാതന്ത്ര്യത്തെക്കുറിച്ചും അനാവശ്യമായി ഇടർച്ച വരുത്താതിരിക്കുന്നതിനെക്കുറിച്ചുമുള്ള അസാധാരണവും സൌമ്യവുമായ ഒരു കഥയാണിത്.
      take_with_you: യേശുവിനു കൊടുക്കാതിരിക്കാൻ സ്വാതന്ത്ര്യമുണ്ടായിരുന്നു; ആർക്കും ഇടർച്ച വരുത്താതിരിക്കേണ്ടതിന്ന് എന്നിട്ടും അവൻ കൊടുത്തു.
    readings_thread: മോശെ മലമുകളിൽ മേഘത്തിനുള്ളിലേക്കു കയറുന്നു; ബാലനായ ശമൂവേൽ ഒരു പ്രവാചകനായി അറിയപ്പെടുന്നു. ദുഷ്ടൻ തന്റെ വഴികളിൽനിന്നു തിരിഞ്ഞാൽ ജീവിക്കുമെന്നു യെഹെസ്കേൽ പറയുന്നു. കൂലി പിടിച്ചുവെക്കുന്ന ധനവാന്മാർക്കു യാക്കോബ് മുന്നറിയിപ്പു നല്കുന്നു; ക്രിസ്തുവിന്റെ സൌമ്യതയോടെ പൌലൊസ് സംസാരിക്കുന്നു.
    scenes:
    - verses: മത്തായി 17:22–23
      title: മൂന്നാം നാൾ
      text: 'അവർ ഗലീലയിൽ സഞ്ചരിക്കുമ്പോൾ യേശു പറയുന്നു: മനുഷ്യപുത്രൻ മനുഷ്യരുടെ കയ്യിൽ ഏല്പിക്കപ്പെടുവാറായിരിക്കുന്നു; അവർ അവനെ കൊല്ലുകയും മൂന്നാം നാൾ അവൻ ഉയിർത്തെഴുന്നേല്ക്കയും ചെയ്യും. ശിഷ്യന്മാർ ഏറ്റവും ദുഃഖിക്കുന്നു.'
      easy_to_miss: അവർ മരണത്തെക്കുറിച്ചു കേൾക്കുന്നു; ഉയിർപ്പിനെക്കുറിച്ചുള്ളതു ശ്രദ്ധിക്കുന്നില്ല. ദുഃഖം അവസാനഭാഗത്തിനു നേരെ അവരുടെ ചെവി അടയ്ക്കുന്നു.
    - verses: മത്തായി 17:24–25a
      title: നിങ്ങളുടെ ഗുരു കൊടുക്കുന്നില്ലയോ?
      text: 'കഫർന്നഹൂമിൽ ദ്വിദ്രഹ്മപ്പണം വാങ്ങുന്നവർ പത്രൊസിനോടു ചോദിക്കുന്നു: നിങ്ങളുടെ ഗുരു ദ്വിദ്രഹ്മപ്പണം കൊടുക്കുന്നില്ലയോ? ഉവ്വ്, പത്രൊസ് പറയുന്നു.'
      easy_to_miss: ആദ്യം യേശുവിനോടു ചോദിക്കാതെ പത്രൊസ് അവനുവേണ്ടി ഉത്തരം പറയുന്നു. അവൻ പലപ്പോഴും വേഗത്തിൽ സംസാരിക്കുന്നവനാണ്.
    - verses: മത്തായി 17:25b–26
      title: പുത്രന്മാർ ഒഴിവുള്ളവർ
      text: 'വീട്ടിൽവെച്ചു യേശു ചോദിക്കുന്നു: ശിമോനേ, നിനക്കു എന്തു തോന്നുന്നു? ഭൂമിയിലെ രാജാക്കന്മാർ ചുങ്കമോ കരമോ ആരോടു വാങ്ങുന്നു? പുത്രന്മാരോടോ അന്യരോടോ? അന്യരോട് എന്ന് അവൻ പറയുന്നു. എന്നാൽ പുത്രന്മാർ ഒഴിവുള്ളവരല്ലോ, യേശു പറയുന്നു.'
      easy_to_miss: ആ കരം ദൈവത്തിന്റെ ആലയത്തിനുവേണ്ടിയായിരുന്നു. യേശു ആ ഭവനത്തിന്റെ പുത്രനാണ്; അതുകൊണ്ട് അവൻ ഒന്നും കടപ്പെട്ടിട്ടില്ല.
    - verses: മത്തായി 17:27a
      title: ഇടർച്ച വരുത്താതിരിക്കേണ്ടതിന്ന്
      text: എങ്കിലും നാം അവർക്കു ഇടർച്ച വരുത്താതിരിക്കേണ്ടതിന്നു നീ കടലിലേക്കു ചെന്നു ചൂണ്ടൽ ഇട്ടു ആദ്യം കിട്ടുന്ന മീനിനെ എടുക്ക.
      easy_to_miss: മറ്റുള്ളവർക്കു മുറിവേല്ക്കാതിരിക്കാൻ യേശു ഒരു അവകാശം വേണ്ടെന്നുവെക്കുന്നു. 1 കൊരിന്ത്യർ 8-ൽ പൌലൊസും ഇതുതന്നെ പഠിപ്പിക്കുന്നു.
    - verses: മത്തായി 17:27b
      title: എനിക്കും നിനക്കും വേണ്ടി
      text: അതിന്റെ വായ് തുറക്കുമ്പോൾ ഒരു ചതുർദ്രഹ്മപ്പണം കാണും; അതു എടുത്തു എനിക്കും നിനക്കും വേണ്ടി കൊടുക്ക.
      easy_to_miss: ഒരു നാണയം രണ്ടുപേർക്കും വേണ്ടി. യേശു പത്രൊസിനെ തന്നോടുകൂടെ ചേർക്കുന്നു.
    people:
    - name: പത്രൊസ്
      role: ഒരു നാണയത്തിനായി വീണ്ടും മീൻപിടുത്തത്തിനു അയക്കപ്പെടുന്ന മീൻപിടുത്തക്കാരൻ.
      name_meaning: “പാറ”
      ml: Peter
    - name: കരം പിരിക്കുന്നവർ
      role: ദൈവാലയത്തിനുള്ള വാർഷിക അര ശേക്കെൽ പിരിക്കുന്നവർ.
      name_meaning: —
      ml: The tax collectors
    phrases:
    - term: ദ്വിദ്രഹ്മപ്പണം
      explanation: ഏകദേശം രണ്ടു ദിവസത്തെ കൂലിയായ അര ശേക്കെൽ; ദൈവാലയത്തിനുവേണ്ടി ഓരോ യെഹൂദപുരുഷനും വർഷംതോറും കൊടുക്കേണ്ടിയിരുന്നത് (പുറപ്പാടു 30:13).
    - term: ചതുർദ്രഹ്മപ്പണം
      explanation: നാലു ദ്രഹ്മയ്ക്കു തുല്യമായ ഒരു വെള്ളിനാണയം; രണ്ടുപേരുടെ ദൈവാലയക്കരത്തിനു കൃത്യമായി മതിയായത്.
    - term: ഇടർച്ച വരുത്തുക
      explanation: ഒരാളെ പാപത്തിലേക്കു നയിക്കുകയോ ദൈവത്തിൽനിന്ന് അകറ്റുകയോ ചെയ്യാവുന്ന ഒരു തടസ്സം അവരുടെ വഴിയിൽ വെക്കുക.
    reflection:
      title_en: സ്വതന്ത്രൻ, എങ്കിലും ഇടർച്ച വരുത്താതെ
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        സുവിശേഷങ്ങളിലെ ഏറ്റവും വിചിത്രമായ കഥകളിൽ ഒന്നാണിത്; ഏറ്റവും സൌമ്യമായവയിൽ ഒന്നും. തന്റെ പിതാവിന്റെ ആലയത്തിനുള്ള കരം കൊടുക്കാതിരിക്കാൻ യേശുവിനു പൂർണ്ണ അവകാശമുണ്ട്. അവൻ പുത്രനാണ്. എന്നാൽ അവൻ തന്റെ അവകാശങ്ങളിൽ ശഠിക്കുന്നില്ല. ആരുടെയും വഴിയിൽ ഒരു തടസ്സം വെക്കാതിരിക്കേണ്ടതിന്ന് അവൻ കൊടുക്കുന്നു.

        കുടുംബങ്ങളിലെയും ഇടവകകളിലെയും പല തർക്കങ്ങളും അവകാശങ്ങളെക്കുറിച്ചാണ്. ആര് ആദ്യം ക്ഷമ ചോദിക്കണം. ആരുടെ ഊഴമാണ്. എനിക്ക് എന്തു കിട്ടാനുണ്ട്. പലപ്പോഴും സാങ്കേതികമായി നാം ശരിയായിരിക്കും. യേശു മറ്റൊരു വഴി കാണിക്കുന്നു: നിങ്ങൾ സ്വതന്ത്രരാണെന്ന് അറിഞ്ഞുകൊണ്ട്, സമാധാനത്തിനും മറ്റുള്ളവരുടെ വിശ്വാസത്തിനുംവേണ്ടി വിട്ടുകൊടുക്കാൻ തീരുമാനിക്കുക.

        അവൻ പത്രൊസിനുവേണ്ടിയും കൊടുക്കുന്നു. ഒരു നാണയം, എനിക്കും നിനക്കും വേണ്ടി. അതിലും വളരെ വലിയ ഒരു ദാനത്തിന്റെ ചെറിയ ചിത്രമാണിത്. നമുക്കു കൊടുക്കാൻ കഴിയാത്തതു ക്രൂശിൽ യേശു കൊടുത്തു; നമ്മെ തന്നോടുകൂടെ ചേർത്തു. ഈ ആഴ്ച നമ്മുടെ അവകാശങ്ങൾക്കായി വാദിക്കുന്നതിനു മുമ്പ്, നമുക്കുവേണ്ടി എത്രമാത്രം കൊടുക്കപ്പെട്ടിരിക്കുന്നു എന്ന് ഓർക്കുന്നതു നല്ലതാണ്.
      title_ml: Free, and choosing not to offend
    week:
      question: മറ്റൊരാൾക്കുവേണ്ടി ഉപേക്ഷിക്കാൻ കഴിയുന്ന, നിങ്ങൾ ശഠിച്ചുകൊണ്ടിരിക്കുന്ന ഒരു അവകാശം ഉണ്ടോ?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച, നിങ്ങൾ ശരിയാണെങ്കിൽപോലും, സമാധാനത്തിനുവേണ്ടി ഒരു തർക്കം വിട്ടുകളയുക.
      prayer: കർത്താവായ യേശുവേ, നീ സ്വതന്ത്രനായിരുന്നിട്ടും നിനക്കും പത്രൊസിനും വേണ്ടി കരം കൊടുത്തു. മറ്റുള്ളവർക്കുവേണ്ടി ഞങ്ങളുടെ അവകാശങ്ങൾ ഉപേക്ഷിക്കാൻ ഞങ്ങളെ പഠിപ്പിക്കേണമേ. ഞങ്ങൾ കടപ്പെട്ടിരുന്നതു നീ കൊടുത്തതിനു നന്ദി. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 19:1–12
        ml: മത്തായി 19:1–12
        note: 'വിവാഹത്തെക്കുറിച്ചു യേശു: ദൈവം യോജിപ്പിച്ചതിനെ മനുഷ്യൻ വേർപിരിക്കരുത്.'
        printed: St. Matthew 19:1-12
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 19:11–27
        ml: ലൂക്കൊസ് 19:11–27
        note: 'റാത്തലിന്റെ ഉപമ: നന്ന്, നല്ല ദാസനേ, നീ അത്യല്പത്തിൽ വിശ്വസ്തനായി.'
        printed: St. Luke 19:11-27
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Exodus 24:12–18
        ml: പുറപ്പാട് 24:12–18
        note: നാല്പതു രാവും പകലും മോശെ സീനായിലെ മേഘത്തിനുള്ളിലേക്കു കയറുന്നു.
        printed: Exodus 24:12-18
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: 1 Samuel 3:16–21
        ml: 1 ശമൂവേൽ 3:16–21
        note: ശമൂവേൽ ഏലിയോട് എല്ലാം അറിയിക്കുന്നു; അവൻ യഹോവയുടെ പ്രവാചകൻ എന്നു യിസ്രായേൽ മുഴുവനും അറിയുന്നു.
        printed: I Samuel 3:16-21
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Ezekiel 18:21–24
        ml: യെഹെസ്കേൽ 18:21–24
        note: ദുഷ്ടൻ തന്റെ പാപങ്ങളെ വിട്ടുതിരിഞ്ഞാൽ അവൻ ജീവിക്കും, നിശ്ചയം.
        printed: Ezekiel 18:21-24
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: James 5:1–6
        ml: യാക്കോബ് 5:1–6
        note: 'ധനവാന്മാരേ, കരവിൻ: നിങ്ങൾ പിടിച്ചുവെച്ച കൂലി നിലവിളിക്കുന്നു.'
        printed: James 5:1-6
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 2 Corinthians 10:1–7
        ml: 2 കൊരിന്ത്യർ 10:1–7
        note: ക്രിസ്തുവിന്റെ സൗമ്യതയും ശാന്തതയുംകൊണ്ടു പൌലൊസ് അപേക്ഷിക്കുന്നു.
        printed: II Corinthians 10:1-7
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 17:22–27
        ml: മത്തായി 17:22–27
        note: യേശു തന്റെ മരണം മുൻകൂട്ടി പറയുന്നു; ദൈവാലയനികുതി പത്രൊസ് ഒരു മീനിന്റെ വായിൽ കണ്ടെത്തുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. Matthew 17:22-27
        main: true
    key_verse:
      ref: മത്തായി 17:27
    hero_quote:
      text: അവർ അവനെ കൊല്ലുകയും മൂന്നാം നാൾ അവൻ ഉയിർത്തെഴുന്നേൽക്കയും ചെയ്യും എന്നു പറഞ്ഞു; അവരോ ഏറ്റവും ദുഃഖിച്ചു.
      ref: മത്തായി 17:23
sources:
