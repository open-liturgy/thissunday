one_minute:
  what_happens: In Galilee Jesus tells his disciples he will be betrayed, killed and raised on the third day, and they are deeply grieved. In Capernaum the Temple tax collectors question Peter. Jesus says sons are free, but so as not to offend, sends Peter to catch a fish with a coin in its mouth.
  why_this_sunday: This is an unusual and gentle story about freedom and not giving needless offence.
  take_with_you: Jesus was free not to pay, and paid anyway, so as not to make anyone stumble.
readings_thread: Moses goes up the mountain into the cloud, and the boy Samuel becomes known as a prophet. Ezekiel says if the wicked turn from their ways they will live. James warns the rich who hold back wages, and Paul speaks with the gentleness of Christ.
key_verse:
  ref: Matthew 17:27
  ml: എങ്കിലും നാം അവർക്കു ഇടർച്ച വരുത്താതിരിക്കേണ്ടതിന്നു നീ കടലിലേക്കു ചെന്നു ചൂണ്ടൽ ഇട്ടു ആദ്യം കിട്ടുന്ന മീനിനെ എടുക്ക; അതിന്റെ വായ് തുറക്കുമ്പോൾ ഒരു ചതുർദ്രഹ്മപ്പണം കാണും; അതു എടുത്തു എനിക്കും നിനക്കും വേണ്ടി കൊടുക്ക എന്നു പറഞ്ഞു.
  ml_translation: Sathyavedapusthakam, 1910
  en: But, lest we cause them to stumble, go to the sea, cast a hook, and take up the first fish that comes up. When you have opened its mouth, you will find a stater coin. Take that, and give it to them for me and you.”
  en_translation: World English Bible
scenes:
- verses: Matthew 17:22–23
  title: On the third day
  text: 'As they gather in Galilee, Jesus says: the Son of Man will be handed over, they will kill him, and on the third day he will be raised. The disciples are greatly distressed.'
  easy_to_miss: They hear the death and miss the resurrection. Grief closes their ears to the last part.
- verses: Matthew 17:24–25a
  title: Does your teacher pay?
  text: 'In Capernaum the collectors of the Temple tax ask Peter: does your teacher not pay the tax? Yes, he does, says Peter.'
  easy_to_miss: Peter answers for Jesus without asking him first. He is often quick to speak.
- verses: Matthew 17:25b–26
  title: The children are free
  text: 'At home Jesus asks: from whom do kings collect taxes, from their own children or from others? From others. Then the children are free, says Jesus.'
  easy_to_miss: The tax was for God’s house. Jesus is the Son of the house, so he owes nothing.
- verses: Matthew 17:27a
  title: So as not to offend
  text: But so that we do not cause offence, go to the lake, throw out a hook and take the first fish you catch.
  easy_to_miss: Jesus chooses to give up a right so others are not hurt. Paul teaches the same in 1 Corinthians 8.
- verses: Matthew 17:27b
  title: For me and for you
  text: Open its mouth and you will find a coin. Take it and give it to them for me and for you.
  easy_to_miss: One coin pays for both. Jesus includes Peter with himself.
