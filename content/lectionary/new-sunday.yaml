one_minute:
  what_happens: 'On Easter evening Jesus stands among the frightened disciples, shows his wounds and breathes the Holy Spirit on them. Thomas is absent and refuses to believe. Eight days later Jesus returns, invites Thomas to touch his wounds, and Thomas says: my Lord and my God.'
  why_this_sunday: New Sunday is eight days after Easter, the day Jesus appeared to Thomas. Our Church, which traces its faith to St. Thomas, keeps it with special love. It is also Youth Sunday.
  take_with_you: Thomas’ doubt did not shut him out. Jesus came back for him.
readings_thread: Joseph is raised to power at thirty, and Ecclesiastes tells the young to remember their Creator. Jeremiah is told not to say “I am only a youth”. Paul urges young Timothy to be strong in grace.
key_verse:
  ref: John 20:28
  ml: 'തോമാസ് അവനോടു: എന്റെ കർത്താവും എന്റെ ദൈവവും ആയുള്ളോവേ എന്നു ഉത്തരം പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: Thomas answered him, “My Lord and my God!”
  en_translation: World English Bible
scenes:
- verses: John 20:19–20
  title: Peace be with you
  text: 'On Easter evening the disciples are behind locked doors for fear. Jesus stands among them: peace be with you. He shows them his hands and side, and they rejoice.'
  easy_to_miss: The risen body still has wounds. Jesus is known by his scars.
- verses: John 20:21–23
  title: He breathed on them
  text: 'As the Father sent me, so I send you. He breathes on them: receive the Holy Spirit. Whose sins you forgive are forgiven.'
  easy_to_miss: God breathed life into Adam (Genesis 2:7). Here Jesus breathes new life into his frightened friends.
- verses: John 20:24–25
  title: Unless I see
  text: 'Thomas was not there. When the others say they have seen the Lord, he says: unless I see the nail marks and put my hand in his side, I will not believe.'
  easy_to_miss: Thomas is the one who said earlier, “let us also go, that we may die with him” (John 11:16). He is brave, not weak.
- verses: John 20:26–29
  title: My Lord and my God
  text: 'Eight days later, doors locked again, Jesus comes and says to Thomas: put your finger here; do not doubt, but believe. Thomas answers: my Lord and my God! Blessed are those who have not seen and yet believe, says Jesus.'
  easy_to_miss: John never says Thomas actually touched the wounds. Seeing Jesus was enough.
- verses: John 20:30–31
  title: So that you may believe
  text: Jesus did many other signs not written here. These are written so that you may believe that Jesus is the Christ, the Son of God, and have life in his name.
  easy_to_miss: The blessing on “those who have not seen” is for every reader of this Gospel, including us.
people:
- name: Thomas
  ml: തോമാ
  role: One of the twelve, called the Twin. By tradition he brought the Gospel to India.
  name_meaning: “Twin” (Aramaic; Didymus in Greek)
- name: The disciples
  ml: ശിഷ്യന്മാർ
  role: Hiding behind locked doors on Easter evening.
  name_meaning: —
phrases:
- term: New Sunday
  explanation: The Sunday after Easter. In Malayalam it is called Puthunjayar.
- term: Eight days later
  explanation: 'Counting both Sundays, as people then did. It became the Church’s rhythm: meeting the risen Lord every Sunday.'
- term: Didymus
  explanation: Greek for “twin”, the name John gives Thomas.
reflection:
  title_en: Jesus came back for Thomas
  title_ml: തോമായ്ക്കായി യേശു വീണ്ടും വന്നു
  read_time: A three-minute read
  body: |-
    Thomas has a bad name he does not deserve. He was the one who once told the others they should go to Jerusalem and die with Jesus. He was not a coward. He was a man who had seen his friend crucified and could not bear to hope again on someone else’s word.

    Jesus does not scold him. He comes back, a week later, to the same locked room, and offers Thomas exactly what he asked for. Thomas does not need it. He sees Jesus and says more than anyone else in the Gospels has yet said: my Lord and my God.

    On Youth Sunday this matters. Young people often have honest doubts and are told to stop asking. Thomas shows that doubt brought to the community, and kept there, can end in the deepest faith of all. Our Church traces its own faith to Thomas. We can be patient with those who, like him, need to see for themselves.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What is a doubt or question about faith that you have never said out loud?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: 'Young people: ask one older person in your parish how they came to believe. Older people: listen to a young person’s question without correcting them.'
  prayer: My Lord and my God! Risen Jesus, you came back for Thomas. Come to us in our doubts, show us your wounds, and bless the young people of our Church with a faith that is truly their own. Amen.
translations:
  ml:
    name:
      en: പുതുഞായർ
      ml: New Sunday
    season:
      en: ക്യംതാ
      gloss: ഉയിർപ്പുകാലം
    also_kept_as: യുവജനദിനം
    also_kept_as_note: സഭാപ്രസംഗി 12:1 കാണുക
    tagline: 'തോമാ മുറിവുകൾ കാണുന്നു: “എന്റെ കർത്താവും എന്റെ ദൈവവും”'
    standfirst: യേശു ആദ്യം പ്രത്യക്ഷനായപ്പോൾ തോമാ അവിടെ ഉണ്ടായിരുന്നില്ല; മറ്റുള്ളവർ പറഞ്ഞതുകൊണ്ടു മാത്രം വിശ്വസിക്കാൻ അവൻ തയ്യാറല്ല. ഒരാഴ്ച കഴിഞ്ഞ്, അടച്ചിരിക്കുന്ന വാതിലുകളിലൂടെ യേശു വീണ്ടും വന്ന് അവനെ തന്റെ കൈകൾ കാണിക്കുന്നു.
    description: പുതുഞായറിലെ വായനകൾ, തോമായെയും ഉയിർത്തെഴുന്നേറ്റ ക്രിസ്തുവിനെയും കുറിച്ചുള്ള യോഹന്നാൻ 20:19–31 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: 'ഉയിർപ്പു ദിവസം വൈകുന്നേരം, പേടിച്ചിരിക്കുന്ന ശിഷ്യന്മാരുടെ നടുവിൽ യേശു നിന്ന് തന്റെ മുറിവുകൾ കാണിച്ച്, അവരുടെമേൽ ഊതി പരിശുദ്ധാത്മാവിനെ നല്കുന്നു. തോമാ അവിടെ ഇല്ല; അവൻ വിശ്വസിക്കാൻ കൂട്ടാക്കുന്നില്ല. എട്ടു ദിവസം കഴിഞ്ഞ് യേശു മടങ്ങിവന്ന് തന്റെ മുറിവുകൾ തൊടുവാൻ തോമായെ ക്ഷണിക്കുന്നു; തോമാ പറയുന്നു: എന്റെ കർത്താവും എന്റെ ദൈവവും.'
      why_this_sunday: യേശു തോമായ്ക്കു പ്രത്യക്ഷനായ ദിവസമായ, ഉയിർപ്പിനു ശേഷമുള്ള എട്ടാം ദിവസമാണ് പുതുഞായർ. മാർത്തോമ്മാശ്ലീഹായിൽനിന്നു വിശ്വാസം പ്രാപിച്ച നമ്മുടെ സഭ ഈ ദിവസം പ്രത്യേക സ്നേഹത്തോടെ ആചരിക്കുന്നു. ഇതു യുവജനദിനവുമാണ്.
      take_with_you: തോമായുടെ സംശയം അവനെ പുറത്താക്കിയില്ല. യേശു അവനുവേണ്ടി മടങ്ങിവന്നു.
    readings_thread: മുപ്പതാം വയസ്സിൽ യോസേഫ് അധികാരത്തിലേക്ക് ഉയർത്തപ്പെടുന്നു; “നിന്റെ യൗവനകാലത്തു നിന്റെ സ്രഷ്ടാവിനെ ഓർത്തുകൊൾക” എന്നു സഭാപ്രസംഗി പറയുന്നു. “ഞാൻ ബാലൻ എന്നു നീ പറയരുതു” എന്നു യിരെമ്യാവിനോടു കല്പന ലഭിക്കുന്നു. കൃപയിൽ ശക്തിപ്പെടുവാൻ പൌലൊസ് യുവാവായ തിമൊഥെയൊസിനെ ഉദ്ബോധിപ്പിക്കുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 20:19–20
      title: നിങ്ങൾക്കു സമാധാനം
      text: 'ഉയിർപ്പു ദിവസം വൈകുന്നേരം ശിഷ്യന്മാർ യെഹൂദന്മാരെ പേടിച്ചു വാതിൽ അടച്ചിരിക്കുന്നു. യേശു വന്നു നടുവിൽ നിന്നുകൊണ്ടു പറയുന്നു: നിങ്ങൾക്കു സമാധാനം. അവൻ കയ്യും വിലാപ്പുറവും അവരെ കാണിക്കുന്നു; അവർ സന്തോഷിക്കുന്നു.'
      easy_to_miss: ഉയിർത്തെഴുന്നേറ്റ ശരീരത്തിലും മുറിവുകളുണ്ട്. യേശുവിനെ തിരിച്ചറിയുന്നത് അവന്റെ മുറിപ്പാടുകളിലൂടെയാണ്.
    - verses: യോഹന്നാൻ 20:21–23
      title: അവൻ അവരുടെമേൽ ഊതി
      text: 'പിതാവു എന്നെ അയച്ചതുപോലെ ഞാനും നിങ്ങളെ അയക്കുന്നു. അവൻ അവരുടെമേൽ ഊതി പറയുന്നു: പരിശുദ്ധാത്മാവിനെ കൈക്കൊൾവിൻ. ആരുടെ പാപങ്ങൾ നിങ്ങൾ മോചിക്കുന്നുവോ, അവർക്കു മോചിക്കപ്പെട്ടിരിക്കുന്നു.'
      easy_to_miss: ദൈവം ആദാമിലേക്കു ജീവശ്വാസം ഊതി (ഉല്പത്തി 2:7). ഇവിടെ യേശു പേടിച്ചിരിക്കുന്ന തന്റെ സ്നേഹിതരിലേക്കു പുതുജീവൻ ഊതുന്നു.
    - verses: യോഹന്നാൻ 20:24–25
      title: കണ്ടിട്ടല്ലാതെ
      text: 'തോമാ അവിടെ ഉണ്ടായിരുന്നില്ല. ഞങ്ങൾ കർത്താവിനെ കണ്ടു എന്നു മറ്റുള്ളവർ പറയുമ്പോൾ അവൻ പറയുന്നു: അവന്റെ കൈകളിൽ ആണിപ്പഴുതു കാണുകയും അവന്റെ വിലാപ്പുറത്തു കൈ ഇടുകയും ചെയ്തിട്ടല്ലാതെ ഞാൻ വിശ്വസിക്കയില്ല.'
      easy_to_miss: “അവനോടുകൂടെ മരിക്കേണ്ടതിന്നു നാമും പോക” എന്നു മുമ്പു പറഞ്ഞവനാണ് തോമാ (യോഹന്നാൻ 11:16). അവൻ ധൈര്യശാലിയാണ്, ദുർബലനല്ല.
    - verses: യോഹന്നാൻ 20:26–29
      title: എന്റെ കർത്താവും എന്റെ ദൈവവും
      text: 'എട്ടു ദിവസം കഴിഞ്ഞ്, വാതിൽ വീണ്ടും അടച്ചിരിക്കെ, യേശു വന്നു തോമായോടു പറയുന്നു: നിന്റെ വിരൽ ഇങ്ങോട്ടു നീട്ടി എന്റെ കൈകളെ കാണ്ക; അവിശ്വാസി ആകാതെ വിശ്വാസിയായിരിക്ക. തോമാ ഉത്തരം പറയുന്നു: എന്റെ കർത്താവും എന്റെ ദൈവവും ആയുള്ളോവേ! കാണാതെ വിശ്വസിച്ചവർ ഭാഗ്യവാന്മാർ എന്ന് യേശു പറയുന്നു.'
      easy_to_miss: തോമാ മുറിവുകൾ യഥാർത്ഥത്തിൽ തൊട്ടു എന്നു യോഹന്നാൻ ഒരിടത്തും പറയുന്നില്ല. യേശുവിനെ കണ്ടതുതന്നെ മതിയായിരുന്നു.
    - verses: യോഹന്നാൻ 20:30–31
      title: നിങ്ങൾ വിശ്വസിക്കേണ്ടതിന്ന്
      text: ഇവിടെ എഴുതിയിട്ടില്ലാത്ത മറ്റ് അനേകം അടയാളങ്ങളും യേശു ചെയ്തു. എന്നാൽ യേശു ദൈവപുത്രനായ ക്രിസ്തു എന്നു നിങ്ങൾ വിശ്വസിക്കേണ്ടതിന്നും, അവന്റെ നാമത്തിൽ നിങ്ങൾക്കു ജീവൻ ഉണ്ടാകേണ്ടതിന്നും ഇതു എഴുതിയിരിക്കുന്നു.
      easy_to_miss: “കാണാതെ വിശ്വസിച്ചവർ” എന്ന അനുഗ്രഹം ഈ സുവിശേഷം വായിക്കുന്ന ഓരോരുത്തർക്കും ഉള്ളതാണ്, നമുക്കും.
    people:
    - name: തോമാ
      role: പന്തിരുവരിൽ ഒരുവൻ, ഇരട്ട എന്നു വിളിക്കപ്പെട്ടവൻ. പാരമ്പര്യമനുസരിച്ച് അവൻ സുവിശേഷം ഭാരതത്തിൽ കൊണ്ടുവന്നു.
      name_meaning: “ഇരട്ട” (അരാമ്യ; ഗ്രീക്കിൽ ദിദിമൊസ്)
      ml: Thomas
    - name: ശിഷ്യന്മാർ
      role: ഉയിർപ്പു ദിവസം വൈകുന്നേരം വാതിലടച്ച് ഒളിച്ചിരിക്കുന്നവർ.
      name_meaning: —
      ml: The disciples
    phrases:
    - term: പുതുഞായർ
      explanation: ഉയിർപ്പിനു ശേഷമുള്ള ഞായർ. സുറിയാനിപാരമ്പര്യത്തിൽ ഇതിനെ ‘പുതിയ ഞായർ’ എന്നു വിളിക്കുന്നു.
    - term: എട്ടു ദിവസം കഴിഞ്ഞിട്ട്
      explanation: അന്നത്തെ രീതിയിൽ രണ്ടു ഞായറാഴ്ചകളും ചേർത്ത് എണ്ണുന്നു. എല്ലാ ഞായറാഴ്ചയും ഉയിർത്തെഴുന്നേറ്റ കർത്താവിനെ കണ്ടുമുട്ടുക എന്നതു സഭയുടെ താളമായിത്തീർന്നു.
    - term: ദിദിമൊസ്
      explanation: “ഇരട്ട” എന്നതിന്റെ ഗ്രീക്ക്; യോഹന്നാൻ തോമായ്ക്കു നല്കുന്ന പേര്.
    reflection:
      title_en: തോമായ്ക്കായി യേശു വീണ്ടും വന്നു
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        അർഹിക്കാത്ത ഒരു ചീത്തപ്പേര് തോമായ്ക്കുണ്ട്. യെരൂശലേമിൽ പോയി യേശുവിനോടുകൂടെ മരിക്കാമെന്നു മറ്റുള്ളവരോട് ഒരിക്കൽ പറഞ്ഞവനാണ് അവൻ. അവൻ ഭീരുവല്ലായിരുന്നു. തന്റെ സ്നേഹിതൻ ക്രൂശിക്കപ്പെടുന്നതു കണ്ട്, മറ്റൊരാളുടെ വാക്കിന്മേൽ വീണ്ടും പ്രത്യാശിക്കാൻ കഴിയാതെപോയ ഒരു മനുഷ്യനായിരുന്നു അവൻ.

        യേശു അവനെ ശാസിക്കുന്നില്ല. ഒരാഴ്ച കഴിഞ്ഞ്, അടച്ചിട്ട അതേ മുറിയിലേക്ക് അവൻ മടങ്ങിവന്ന്, തോമാ ചോദിച്ചതുതന്നെ അവനു നല്കുന്നു. തോമായ്ക്ക് അതു വേണ്ടിവരുന്നില്ല. അവൻ യേശുവിനെ കണ്ട്, സുവിശേഷങ്ങളിൽ അതുവരെ ആരും പറഞ്ഞിട്ടില്ലാത്തത്ര പറയുന്നു: എന്റെ കർത്താവും എന്റെ ദൈവവും.

        യുവജനദിനത്തിൽ ഇതിനു പ്രാധാന്യമുണ്ട്. ചെറുപ്പക്കാർക്കു പലപ്പോഴും സത്യസന്ധമായ സംശയങ്ങളുണ്ട്; ചോദിക്കുന്നതു നിർത്താൻ അവരോടു പറയുകയും ചെയ്യുന്നു. സമൂഹത്തിലേക്കു കൊണ്ടുവരികയും അവിടെത്തന്നെ നിലനിർത്തുകയും ചെയ്യുന്ന സംശയം ഏറ്റവും ആഴമുള്ള വിശ്വാസത്തിൽ അവസാനിക്കാമെന്നു തോമാ കാണിക്കുന്നു. നമ്മുടെ സഭയുടെ വിശ്വാസം തോമായിൽനിന്നാണ്. അവനെപ്പോലെ സ്വയം കണ്ടറിയേണ്ടവരോടു നമുക്കു ക്ഷമയുള്ളവരായിരിക്കാം.
      title_ml: Jesus came back for Thomas
    week:
      question: ഇതുവരെ ഉറക്കെ പറഞ്ഞിട്ടില്ലാത്ത, വിശ്വാസത്തെക്കുറിച്ചുള്ള ഒരു സംശയമോ ചോദ്യമോ എന്താണ്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: 'ചെറുപ്പക്കാർ: ഇടവകയിലെ ഒരു മുതിർന്നയാളോട് അവർ എങ്ങനെ വിശ്വാസത്തിലേക്കു വന്നു എന്നു ചോദിക്കുക. മുതിർന്നവർ: ഒരു ചെറുപ്പക്കാരന്റെ ചോദ്യം തിരുത്താതെ കേൾക്കുക.'
      prayer: എന്റെ കർത്താവും എന്റെ ദൈവവും ആയുള്ളോവേ! ഉയിർത്തെഴുന്നേറ്റ യേശുവേ, നീ തോമായ്ക്കായി മടങ്ങിവന്നു. ഞങ്ങളുടെ സംശയങ്ങളിൽ ഞങ്ങളുടെ അടുക്കൽ വരേണമേ; നിന്റെ മുറിവുകൾ ഞങ്ങളെ കാണിക്കേണമേ; ഞങ്ങളുടെ സഭയിലെ യുവജനങ്ങളെ, യഥാർത്ഥത്തിൽ അവരുടേതായ ഒരു വിശ്വാസംകൊണ്ട് അനുഗ്രഹിക്കേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 20:19–31
        ml: യോഹന്നാൻ 20:19–31
        note: 'യേശു ശിഷ്യന്മാർക്കു പ്രത്യക്ഷനാകുന്നു; എട്ടു ദിവസം കഴിഞ്ഞ് തോമാസ് പറയുന്നു: എന്റെ കർത്താവും എന്റെ ദൈവവുമായുള്ളോവേ.'
        printed: St. John 20:19-31
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 4:31–38
        ml: യോഹന്നാൻ 4:31–38
        note: തല പൊക്കി നോക്കുവിൻ; വയലുകൾ കൊയ്ത്തിന്നു വെളുത്തിരിക്കുന്നു.
        printed: St. John 4:31-38
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 41:41–46
        ml: ഉല്പത്തി 41:41–46
        note: മുപ്പതാം വയസ്സിൽ യോസേഫിനെ മിസ്രയീംദേശത്തിനു മുഴുവൻ മേലധികാരിയാക്കുന്നു.
        printed: Genesis 41:41-46
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Ecclesiastes 12:1–8
        ml: സഭാപ്രസംഗി 12:1–8
        note: നിന്റെ യൌവനകാലത്തു നിന്റെ സ്രഷ്ടാവിനെ ഓർത്തുകൊൾക.
        printed: Ecclesiastes 12:1-8
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Jeremiah 1:4–12
        ml: യിരെമ്യാവ് 1:4–12
        note: ഞാൻ ബാലൻ എന്നു നീ പറയരുത്; ഞാൻ നിന്നോടുകൂടെ ഉണ്ട്.
        printed: Jeremiah 1:4-12
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 40:9–15
        ml: യെശയ്യാവ് 40:9–15
        note: ഒരു ഇടയനെപ്പോലെ അവൻ തന്റെ ആട്ടിൻകൂട്ടത്തെ മേയിച്ച് കുഞ്ഞാടുകളെ ഭുജത്തിൽ എടുക്കും.
        printed: Isaiah 40:9-15
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: 1 Peter 2:19–25
        ml: 1 പത്രൊസ് 2:19–25
        note: അവന്റെ അടിപ്പിണരാൽ നിങ്ങൾക്കു സൗഖ്യം വന്നിരിക്കുന്നു; നിങ്ങളുടെ ആത്മാക്കളുടെ ഇടയന്റെ അടുക്കലേക്കു നിങ്ങൾ തിരിഞ്ഞിരിക്കുന്നു.
        printed: I Peter 2:19-25
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: 2 Timothy 2:1–13
        ml: 2 തിമൊഥെയൊസ് 2:1–13
        note: എന്റെ മകനേ, കൃപയിൽ ശക്തിപ്പെടുക; നാം അവനോടുകൂടെ മരിച്ചു എങ്കിൽ അവനോടുകൂടെ ജീവിക്കും.
        printed: II Timothy 2:1-13
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 20:19–31
        ml: യോഹന്നാൻ 20:19–31
        note: 'യേശു ശിഷ്യന്മാർക്കു പ്രത്യക്ഷനാകുന്നു; എട്ടു ദിവസം കഴിഞ്ഞ് തോമാസ് പറയുന്നു: എന്റെ കർത്താവും എന്റെ ദൈവവുമായുള്ളോവേ. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.'
        printed: St. John 20:19-31
        main: true
    key_verse:
      ref: യോഹന്നാൻ 20:28
    hero_quote:
      text: കാണാതെ വിശ്വസിച്ചവർ ഭാഗ്യവാന്മാർ.
      ref: യോഹന്നാൻ 20:29
