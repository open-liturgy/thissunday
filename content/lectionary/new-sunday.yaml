tagline: 'Thomas sees the wounds: “My Lord and my God”'
standfirst: Thomas was not there when Jesus first appeared, and he will not believe second-hand. A week later Jesus comes back, through locked doors, and shows him his hands.
description: Readings for New Sunday, the Sunday after Easter, with John 20:19–31, Thomas and the risen Christ, explained in five scenes. Reflection and question.
