one_minute:
  what_happens: 'On Easter evening Jesus stands among the frightened disciples, shows his wounds and breathes the Holy Spirit on them. Thomas is absent and refuses to believe. Eight days later Jesus returns, invites Thomas to touch his wounds, and Thomas says: my Lord and my God.'
  why_this_sunday: New Sunday is eight days after Easter, the day Jesus appeared to Thomas. Our Church, which traces its faith to St. Thomas, keeps it with special love. It is also Youth Sunday.
  take_with_you: Thomas’ doubt did not shut him out. Jesus came back for him.
readings_thread: Joseph is raised to power at thirty, and Ecclesiastes tells the young to remember their Creator. Jeremiah is told not to say “I am only a youth”. Paul urges young Timothy to be strong in grace.
key_verse:
  ref: John 20:28
  ml: 'തോമാസ് അവനോടു: എന്റെ കർത്താവും എന്റെ ദൈവവും ആയുള്ളോവേ എന്നു ഉത്തരം പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: Thomas answered him, “My Lord and my God!”
  en_translation: World English Bible
scenes:
- verses: John 20:19–20
  title: Peace be with you
  text: 'On Easter evening the disciples are behind locked doors for fear. Jesus stands among them: peace be with you. He shows them his hands and side, and they rejoice.'
  easy_to_miss: The risen body still has wounds. Jesus is known by his scars.
- verses: John 20:21–23
  title: He breathed on them
  text: 'As the Father sent me, so I send you. He breathes on them: receive the Holy Spirit. Whose sins you forgive are forgiven.'
  easy_to_miss: God breathed life into Adam (Genesis 2:7). Here Jesus breathes new life into his frightened friends.
- verses: John 20:24–25
  title: Unless I see
  text: 'Thomas was not there. When the others say they have seen the Lord, he says: unless I see the nail marks and put my hand in his side, I will not believe.'
  easy_to_miss: Thomas is the one who said earlier, “let us also go, that we may die with him” (John 11:16). He is brave, not weak.
- verses: John 20:26–29
  title: My Lord and my God
  text: 'Eight days later, doors locked again, Jesus comes and says to Thomas: put your finger here; do not doubt, but believe. Thomas answers: my Lord and my God! Blessed are those who have not seen and yet believe, says Jesus.'
  easy_to_miss: John never says Thomas actually touched the wounds. Seeing Jesus was enough.
- verses: John 20:30–31
  title: So that you may believe
  text: Jesus did many other signs not written here. These are written so that you may believe that Jesus is the Christ, the Son of God, and have life in his name.
  easy_to_miss: The blessing on “those who have not seen” is for every reader of this Gospel, including us.
