        kind_ml: സുവിശേഷം
        ref: John 14:1–16
        ml: യോഹന്നാൻ 14:1–16
        printed: St. John 14:1-16
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 16:16–30
        ml: യോഹന്നാൻ 16:16–30
        printed: St. John 16:16-30
