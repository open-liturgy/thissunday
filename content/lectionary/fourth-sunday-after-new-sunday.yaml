        ml: ആവർത്തനം 16:1–8
        printed: Deuteronomy 16:1-8
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Joshua 8:30–35
        ml: യോശുവ 8:30–35
        printed: Joshua 8:30-35
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Isaiah 54:1–8
        ml: യെശയ്യാവ് 54:1–8
        printed: Isaiah 54:1-8
