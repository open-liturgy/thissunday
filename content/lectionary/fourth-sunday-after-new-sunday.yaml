    main: true
one_minute:
  what_happens: Jesus sets out resolutely for Jerusalem. A Samaritan village will not receive him, and James and John want to call down fire; he rebukes them. Three people want to follow him, and he tells each what it will cost.
  why_this_sunday: This is the last Sunday before the Ascension, which falls on Thursday. Luke speaks of the days drawing near for Jesus to be “taken up”.
  take_with_you: Following Jesus is not a plan for later. It starts by not looking back.
readings_thread: Israel keeps the Passover, and Joshua reads the whole law to the people. Isaiah tells Jerusalem to enlarge her tent. Hebrews remembers those who suffered for their faith and did not see the promise in their lifetime.
key_verse:
  ref: Luke 9:62
  ml: 'യേശു അവനോടു: കലപ്പെക്കു കൈ വെച്ച ശേഷം പുറകോട്ടു നോക്കുന്നവൻ ആരും ദൈവരാജ്യത്തിന്നു കൊള്ളാകുന്നവനല്ല എന്നു പറഞ്ഞു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: But Jesus said to him, “No one, having put his hand to the plow, and looking back, is fit for God’s Kingdom.”
  en_translation: World English Bible
scenes:
- verses: Luke 9:51
  title: He set his face
  text: As the days draw near for him to be taken up, Jesus firmly sets his face to go to Jerusalem.
  easy_to_miss: “Taken up” is the same word Luke uses for the Ascension (Acts 1:2). Luke sees the cross, resurrection and Ascension as one road.
- verses: Luke 9:52–53
  title: A village says no
  text: He sends messengers ahead into a Samaritan village to prepare for him, but the people will not receive him, because he is heading for Jerusalem.
  easy_to_miss: Samaritans and Jews disagreed about where God should be worshipped (John 4:20). Jerusalem was the sore point.
- verses: Luke 9:54–56
  title: Fire from heaven?
  text: 'James and John ask: Lord, shall we call down fire from heaven to destroy them? He turns and rebukes them, and they go on to another village.'
  easy_to_miss: Elijah once called down fire (2 Kings 1:10). Jesus refuses to follow that example. Mark says he nicknamed these brothers “sons of thunder” (Mark 3:17).
- verses: Luke 9:57–58
  title: Nowhere to lay his head
  text: 'Someone says: I will follow you wherever you go. Jesus answers: foxes have holes and birds have nests, but the Son of Man has nowhere to lay his head.'
  easy_to_miss: Jesus has just been turned away from a village. He means it literally.
- verses: Luke 9:59–62
  title: Not looking back
  text: Another asks to bury his father first; let the dead bury their dead, Jesus says, and go and proclaim the kingdom. Another wants to say goodbye at home. No one who puts a hand to the plough and looks back is fit for the kingdom.
  easy_to_miss: A ploughman who looks back cuts a crooked furrow. Jesus is talking about where your attention is.
people:
- name: James and John
  ml: യാക്കോബും യോഹന്നാനും
  role: Brothers among the twelve, quick-tempered enough to want fire from heaven.
  name_meaning: James is Jacob, “he grasps the heel”; John, “the Lord is gracious”
- name: The would-be followers
  ml: അനുഗമിപ്പാൻ ഒരുങ്ങിയവർ
  role: Three people who want to follow Jesus, each with a condition.
  name_meaning: —
phrases:
- term: Set his face
  explanation: An Old Testament phrase for firm determination (Isaiah 50:7).
- term: Samaritans
  explanation: People of the region between Galilee and Judea, with their own temple on Mount Gerizim. Jews and Samaritans avoided each other.
- term: Taken up
  explanation: Luke’s word for the Ascension, which the Church celebrates on the Thursday after this Sunday.
reflection:
  title_en: Hand on the plough
  title_ml: കലപ്പയിൽ കൈ വെച്ചവർ
  read_time: A three-minute read
  body: |-
    Jesus’ answers to the three would-be followers sound harsh. Is it wrong to want to bury your father, or say goodbye to your family? Jesus is not against love for family. He is talking about the moment when following him becomes something for later, once other things are settled.

    He has just set his face towards Jerusalem. He knows what is waiting there, and he does not look back. The people who offer to follow him want to, but each has a condition: wherever you go, but first let me. Jesus says the kingdom cannot be the second thing on the list.

    Most of us have a “first let me”. First let me finish my studies, get settled, sort out the house. These are good things. But there is no ideal moment to start following Jesus, and this Gospel says the moment is now. Put your hand to the plough, and keep your eyes on the furrow ahead.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What “first let me” is stopping you from doing something you know God wants?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: 'Do one thing this week you have been putting off for God: a reconciliation, a visit, a prayer habit.'
  prayer: Lord Jesus, you set your face to Jerusalem and did not turn back. Give us the courage to follow you now, not later, and keep our eyes on the road ahead. Amen.
translations:
  ml:
    name:
      en: പുതുഞായറിനു ശേഷം നാലാം ഞായർ
      ml: Fourth Sunday after New Sunday
    season:
      en: ക്യംതാ
      gloss: ഉയിർപ്പുകാലം
    tagline: യേശു യെരൂശലേമിലേക്കു മനസ്സുറപ്പിക്കുന്നു; അനുഗാമികളെ തേടുന്നു
    standfirst: തന്നെ കാത്തിരിക്കുന്നത് എന്തെന്നറിഞ്ഞുകൊണ്ട് യേശു യെരൂശലേമിലേക്കു തിരിയുന്നു. വഴിയിൽ മൂന്നുപേർ അവനെ അനുഗമിക്കാമെന്നു പറയുന്നു; ഓരോരുത്തർക്കും കഠിനമായ ഒരു മറുപടി ലഭിക്കുന്നു.
    description: പുതുഞായറിനു ശേഷം നാലാം ഞായറിലെ വായനകൾ, യേശുവിനെ അനുഗമിക്കുന്നതിന്റെ വിലയെക്കുറിച്ചുള്ള ലൂക്കൊസ് 9:51–62 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: യേശു ഉറച്ച മനസ്സോടെ യെരൂശലേമിലേക്കു യാത്രയാകുന്നു. ഒരു ശമര്യഗ്രാമം അവനെ കൈക്കൊള്ളുന്നില്ല; യാക്കോബും യോഹന്നാനും ആകാശത്തുനിന്നു തീ ഇറക്കാൻ ആഗ്രഹിക്കുന്നു; അവൻ അവരെ ശാസിക്കുന്നു. മൂന്നുപേർ അവനെ അനുഗമിക്കാൻ ആഗ്രഹിക്കുന്നു; അതിന്റെ വില എന്തെന്ന് അവൻ ഓരോരുത്തരോടും പറയുന്നു.
      why_this_sunday: വ്യാഴാഴ്ച വരുന്ന സ്വർഗ്ഗാരോഹണത്തിനു മുമ്പുള്ള അവസാന ഞായറാണിത്. യേശുവിന്റെ “ആരോഹണത്തിന്നുള്ള കാലം” അടുത്തുവരുന്നതിനെക്കുറിച്ചു ലൂക്കൊസ് പറയുന്നു.
      take_with_you: യേശുവിനെ അനുഗമിക്കുന്നതു പിന്നത്തേക്കുള്ള ഒരു പദ്ധതിയല്ല. പുറകോട്ടു നോക്കാതിരിക്കുന്നതിലൂടെ അതു തുടങ്ങുന്നു.
    readings_thread: യിസ്രായേൽ പെസഹ ആചരിക്കുന്നു; ന്യായപ്രമാണം മുഴുവനും യോശുവ ജനത്തെ വായിച്ചുകേൾപ്പിക്കുന്നു. നിന്റെ കൂടാരത്തിന്റെ സ്ഥലം വിശാലമാക്കുക എന്നു യെശയ്യാവു യെരൂശലേമിനോടു പറയുന്നു. വിശ്വാസം നിമിത്തം കഷ്ടം സഹിച്ചവരെയും, ജീവിതകാലത്തു വാഗ്ദത്തം പ്രാപിക്കാത്തവരെയും എബ്രായലേഖനം ഓർക്കുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 9:51
      title: അവൻ മനസ്സു ഉറപ്പിച്ചു
      text: അവന്റെ ആരോഹണത്തിന്നുള്ള കാലം തികയാറായപ്പോൾ, യേശു യെരൂശലേമിലേക്കു യാത്രയാവാൻ മനസ്സു ഉറപ്പിക്കുന്നു.
      easy_to_miss: സ്വർഗ്ഗാരോഹണത്തിനു ലൂക്കൊസ് ഉപയോഗിക്കുന്ന അതേ വാക്കാണിത് (അപ്പൊസ്തലപ്രവൃത്തികൾ 1:2). ക്രൂശിനെയും ഉയിർപ്പിനെയും സ്വർഗ്ഗാരോഹണത്തെയും ലൂക്കൊസ് ഒരേ വഴിയായി കാണുന്നു.
    - verses: ലൂക്കൊസ് 9:52–53
      title: ഒരു ഗ്രാമം നിരസിക്കുന്നു
      text: അവന്നായി വട്ടംകൂട്ടേണ്ടതിന്ന് അവൻ ദൂതന്മാരെ ഒരു ശമര്യഗ്രാമത്തിലേക്കു മുമ്പായി അയക്കുന്നു. എന്നാൽ അവൻ യെരൂശലേമിലേക്കു പോകുന്നതുകൊണ്ട് അവർ അവനെ കൈക്കൊള്ളുന്നില്ല.
      easy_to_miss: ദൈവത്തെ എവിടെ ആരാധിക്കണം എന്നതിൽ ശമര്യരും യെഹൂദരും ഭിന്നിച്ചിരുന്നു (യോഹന്നാൻ 4:20). യെരൂശലേമായിരുന്നു തർക്കവിഷയം.
    - verses: ലൂക്കൊസ് 9:54–56
      title: ആകാശത്തുനിന്നു തീ?
      text: 'യാക്കോബും യോഹന്നാനും ചോദിക്കുന്നു: കർത്താവേ, ആകാശത്തുനിന്നു തീ ഇറങ്ങി അവരെ നശിപ്പിപ്പാൻ ഞങ്ങൾ പറയുന്നതു നിനക്കു സമ്മതമോ? അവൻ തിരിഞ്ഞ് അവരെ ശാസിക്കുന്നു; അവർ വേറൊരു ഗ്രാമത്തിലേക്കു പോകുന്നു.'
      easy_to_miss: ഏലീയാവ് ഒരിക്കൽ ആകാശത്തുനിന്നു തീ ഇറക്കി (2 രാജാക്കന്മാർ 1:10). ആ മാതൃക പിന്തുടരാൻ യേശു വിസമ്മതിക്കുന്നു. ഈ സഹോദരന്മാർക്ക് അവൻ “ഇടിമക്കൾ” എന്നു പേരിട്ടു എന്നു മർക്കൊസ് പറയുന്നു (മർക്കൊസ് 3:17).
    - verses: ലൂക്കൊസ് 9:57–58
      title: തല ചായിപ്പാൻ സ്ഥലമില്ല
      text: 'ഒരുത്തൻ പറയുന്നു: നീ എവിടെ പോയാലും ഞാൻ നിന്നെ അനുഗമിക്കാം. യേശു ഉത്തരം പറയുന്നു: കുറുനരികൾക്കു കുഴിയും ആകാശത്തിലെ പറവജാതിക്കു കൂടും ഉണ്ടു; മനുഷ്യപുത്രന്നോ തല ചായിപ്പാൻ സ്ഥലമില്ല.'
      easy_to_miss: യേശുവിനെ ഒരു ഗ്രാമം ഇപ്പോൾതന്നെ തിരിച്ചയച്ചിരിക്കുന്നു. അക്ഷരാർത്ഥത്തിൽത്തന്നെയാണ് അവൻ ഇതു പറയുന്നത്.
    - verses: ലൂക്കൊസ് 9:59–62
      title: പുറകോട്ടു നോക്കാതെ
      text: മുമ്പെ പോയി തന്റെ അപ്പനെ കുഴിച്ചിടുവാൻ മറ്റൊരുത്തൻ അനുവാദം ചോദിക്കുന്നു. മരിച്ചവർ തങ്ങളുടെ മരിച്ചവരെ കുഴിച്ചിടട്ടെ; നീയോ പോയി ദൈവരാജ്യം അറിയിക്ക എന്നു യേശു പറയുന്നു. വേറൊരുത്തൻ വീട്ടിലുള്ളവരോടു യാത്ര പറയാൻ ആഗ്രഹിക്കുന്നു. കലപ്പെക്കു കൈ വെച്ച ശേഷം പുറകോട്ടു നോക്കുന്നവൻ ആരും ദൈവരാജ്യത്തിന്നു കൊള്ളാകുന്നവനല്ല.
      easy_to_miss: പുറകോട്ടു നോക്കുന്ന ഉഴവുകാരന്റെ ചാലു വളയും. ശ്രദ്ധ എവിടെയാണ് എന്നതിനെക്കുറിച്ചാണ് യേശു പറയുന്നത്.
    people:
    - name: യാക്കോബും യോഹന്നാനും
      role: പന്തിരുവരിൽ രണ്ടു സഹോദരന്മാർ; ആകാശത്തുനിന്നു തീ ആഗ്രഹിക്കാൻ മാത്രം മുൻകോപികൾ.
      name_meaning: യാക്കോബ്, “കുതികാൽ പിടിക്കുന്നവൻ”; യോഹന്നാൻ, “കർത്താവു കൃപാലുവാകുന്നു”
      ml: James and John
    - name: അനുഗമിപ്പാൻ ഒരുങ്ങിയവർ
      role: യേശുവിനെ അനുഗമിക്കാൻ ആഗ്രഹിക്കുന്ന മൂന്നുപേർ; ഓരോരുത്തർക്കും ഒരു വ്യവസ്ഥയുണ്ട്.
      name_meaning: —
      ml: The would-be followers
    phrases:
    - term: മനസ്സു ഉറപ്പിക്കുക
      explanation: ഉറച്ച തീരുമാനത്തിനുള്ള ഒരു പഴയനിയമ പ്രയോഗം (യെശയ്യാവു 50:7).
    - term: ശമര്യർ
      explanation: ഗലീലെക്കും യെഹൂദ്യെക്കും ഇടയിലുള്ള പ്രദേശത്തെ ജനം; ഗെരിസീം മലയിൽ അവർക്കു സ്വന്തം ദൈവാലയം ഉണ്ടായിരുന്നു. യെഹൂദരും ശമര്യരും പരസ്പരം ഒഴിഞ്ഞുമാറി.
    - term: ആരോഹണം
      explanation: സ്വർഗ്ഗാരോഹണത്തിനു ലൂക്കൊസ് ഉപയോഗിക്കുന്ന വാക്ക്. ഈ ഞായറിനു ശേഷമുള്ള വ്യാഴാഴ്ച സഭ അത് ആഘോഷിക്കുന്നു.
    reflection:
      title_en: കലപ്പയിൽ കൈ വെച്ചവർ
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        അനുഗമിക്കാൻ ഒരുങ്ങിയ മൂന്നുപേരോടുള്ള യേശുവിന്റെ മറുപടികൾ കഠിനമായി തോന്നുന്നു. അപ്പനെ അടക്കം ചെയ്യാനോ കുടുംബത്തോടു യാത്ര പറയാനോ ആഗ്രഹിക്കുന്നതു തെറ്റാണോ? യേശു കുടുംബസ്നേഹത്തിന് എതിരല്ല. മറ്റു കാര്യങ്ങളെല്ലാം ശരിയായിക്കഴിഞ്ഞ്, പിന്നീടു ചെയ്യാനുള്ള ഒന്നായി അവനെ അനുഗമിക്കുന്നതു മാറുന്ന നിമിഷത്തെക്കുറിച്ചാണ് അവൻ പറയുന്നത്.

        അവൻ ഇപ്പോൾതന്നെ യെരൂശലേമിലേക്കു മനസ്സുറപ്പിച്ചിരിക്കുന്നു. അവിടെ തന്നെ കാത്തിരിക്കുന്നത് എന്തെന്ന് അവന് അറിയാം; അവൻ പുറകോട്ടു നോക്കുന്നില്ല. അവനെ അനുഗമിക്കാമെന്നു പറയുന്നവർക്ക് അതിന് ആഗ്രഹമുണ്ട്; പക്ഷേ ഓരോരുത്തർക്കും ഒരു വ്യവസ്ഥയുണ്ട്: നീ എവിടെ പോയാലും, പക്ഷേ ആദ്യം ഞാൻ ഒന്ന്. ദൈവരാജ്യം പട്ടികയിലെ രണ്ടാമത്തെ കാര്യമാകാൻ കഴിയില്ല എന്നു യേശു പറയുന്നു.

        നമ്മിൽ മിക്കവർക്കും ഒരു ‘ആദ്യം ഞാൻ ഒന്ന്’ ഉണ്ട്. ആദ്യം പഠിത്തം തീരട്ടെ, ഒന്നു സ്ഥിരപ്പെടട്ടെ, വീടിന്റെ കാര്യം ശരിയാകട്ടെ. ഇവയെല്ലാം നല്ല കാര്യങ്ങളാണ്. എന്നാൽ യേശുവിനെ അനുഗമിച്ചുതുടങ്ങാൻ അനുയോജ്യമായ ഒരു നിമിഷമില്ല; ആ നിമിഷം ഇപ്പോഴാണെന്ന് ഈ സുവിശേഷം പറയുന്നു. കലപ്പയിൽ കൈ വെക്കുക; മുമ്പിലുള്ള ചാലിൽ കണ്ണുറപ്പിക്കുക.
      title_ml: Hand on the plough
    week:
      question: ദൈവം ആഗ്രഹിക്കുന്നു എന്നു നിങ്ങൾക്ക് അറിയാവുന്ന ഒരു കാര്യം ചെയ്യുന്നതിൽനിന്ന് ഏതു ‘ആദ്യം ഞാൻ ഒന്ന്’ ആണ് നിങ്ങളെ തടയുന്നത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: 'ദൈവത്തിനുവേണ്ടി നിങ്ങൾ മാറ്റിവെച്ചുകൊണ്ടിരുന്ന ഒരു കാര്യം ഈ ആഴ്ച ചെയ്യുക: ഒരു രമ്യത, ഒരു സന്ദർശനം, ഒരു പ്രാർത്ഥനാശീലം.'
      prayer: കർത്താവായ യേശുവേ, നീ യെരൂശലേമിലേക്കു മനസ്സുറപ്പിച്ചു, പിന്തിരിഞ്ഞില്ല. പിന്നീടല്ല, ഇപ്പോൾതന്നെ നിന്നെ അനുഗമിക്കാനുള്ള ധൈര്യം ഞങ്ങൾക്കു തരേണമേ; മുമ്പിലുള്ള വഴിയിൽ ഞങ്ങളുടെ കണ്ണുകൾ ഉറപ്പിക്കേണമേ. ആമേൻ.
    readings:
