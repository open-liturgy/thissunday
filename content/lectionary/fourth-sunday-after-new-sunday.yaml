is_sunday: true
name:
  en: Fourth Sunday after New Sunday
  ml: പുതുഞായറിനു ശേഷം നാലാം ഞായർ
title_as_printed: Fourth Sunday after New Sunday
season:
  en: Kyomtho
  gloss: The Resurrection season
  syr: ܩܝܡܬܐ
tagline: Jesus sets his face to Jerusalem, and looks for followers
standfirst: Jesus turns towards Jerusalem, knowing what is waiting for him. On the way three people offer to follow him, and each one meets a hard answer.
description: Readings for the Fourth Sunday after New Sunday, with Luke 9:51–62, the cost of following Jesus, explained in five scenes. Reflection and question.
hero_quote:
  text: It came to pass, when the days were near that he should be taken up, he intently set his face to go to Jerusalem
  ref: Luke 9:51
