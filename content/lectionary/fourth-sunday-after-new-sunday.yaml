    hero_quote:
      text: അവന്റെ ആരോഹണത്തിന്നുള്ള കാലം തികയാറായപ്പോൾ അവൻ യെരൂശലേമിലേക്കു യാത്രയാവാൻ മനസ്സു ഉറപ്പിച്ചു.
      ref: ലൂക്കൊസ് 9:51
