phrases:
- term: Hosanna
  explanation: Hebrew for “save us, please”, from Psalm 118:25. By Jesus’ time it was also a shout of praise.
- term: Daughter of Zion
  explanation: A poetic name for Jerusalem and its people (Zechariah 9:9).
- term: Glorified
  explanation: John’s word for Jesus’ death, resurrection and return to the Father.
reflection:
  title_en: A king on a donkey
  title_ml: കഴുതപ്പുറത്തു വരുന്ന രാജാവ്
  read_time: A three-minute read
  body: |-
    The crowd on Hosanna Sunday knew exactly what kind of king they wanted. They waved palm branches, the symbol of victory over enemies. They expected someone who would drive out Rome and make Israel great again. Jesus came riding on a young donkey.

    He was a king, but not that kind. He came in peace, on the way to a cross. Within the week the same city would turn against him. Even his disciples did not understand what they were seeing until after the resurrection.

    On Boys’ and Girls’ Day, the Church remembers that children were among those who shouted Hosanna in the Temple, and Jesus defended them. Children often see more clearly than adults what kind of king Jesus is. Holy Week begins today. The question for all of us is whether we will still be with him on Friday.
