  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: If Jesus came to our town this week, what would we want him to do? What do you think he would actually do?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Plan as a family which Holy Week services you will attend together, and keep the palm from today somewhere you will see it.
  prayer: Hosanna to the Son of David! Lord Jesus, you came to Jerusalem humble and riding on a donkey. Walk with us through this Holy Week, and keep us faithful to you all the way to the cross and the empty tomb. Amen.
