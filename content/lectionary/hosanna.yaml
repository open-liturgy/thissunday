- name: The crowd
  ml: പുരുഷാരം
  role: Pilgrims in Jerusalem for Passover, many of whom had heard about Lazarus.
  name_meaning: —
- name: Lazarus
  ml: ലാസർ
  role: Raised from the dead at Bethany, and the reason many came to see Jesus.
  name_meaning: “God has helped”
- name: The Pharisees
  ml: പരീശന്മാർ
  role: They watch the welcome and feel they have lost control.
  name_meaning: Probably “the separated ones”
phrases:
- term: Hosanna
  explanation: Hebrew for “save us, please”, from Psalm 118:25. By Jesus’ time it was also a shout of praise.
- term: Daughter of Zion
  explanation: A poetic name for Jerusalem and its people (Zechariah 9:9).
- term: Glorified
  explanation: John’s word for Jesus’ death, resurrection and return to the Father.
reflection:
  title_en: A king on a donkey
  title_ml: കഴുതപ്പുറത്തു വരുന്ന രാജാവ്
  read_time: A three-minute read
  body: |-
    The crowd on Hosanna Sunday knew exactly what kind of king they wanted. They waved palm branches, the symbol of victory over enemies. They expected someone who would drive out Rome and make Israel great again. Jesus came riding on a young donkey.

    He was a king, but not that kind. He came in peace, on the way to a cross. Within the week the same city would turn against him. Even his disciples did not understand what they were seeing until after the resurrection.

    On Boys’ and Girls’ Day, the Church remembers that children were among those who shouted Hosanna in the Temple, and Jesus defended them. Children often see more clearly than adults what kind of king Jesus is. Holy Week begins today. The question for all of us is whether we will still be with him on Friday.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: If Jesus came to our town this week, what would we want him to do? What do you think he would actually do?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Plan as a family which Holy Week services you will attend together, and keep the palm from today somewhere you will see it.
  prayer: Hosanna to the Son of David! Lord Jesus, you came to Jerusalem humble and riding on a donkey. Walk with us through this Holy Week, and keep us faithful to you all the way to the cross and the empty tomb. Amen.
translations:
  ml:
    name:
      en: ഹോശാനാ ഞായർ
      ml: Hosanna Sunday
    season:
      en: വലിയ നോമ്പ്
      gloss: ഉയിർപ്പിനു മുമ്പുള്ള അമ്പതു നോമ്പുദിവസങ്ങൾ
    also_kept_as: ബാലികാബാലന്മാരുടെ ദിനം
    also_kept_as_note: മത്തായി 21:15–16 കാണുക
    tagline: രാജാവ് കഴുതപ്പുറത്ത് യെരൂശലേമിലേക്കു വരുന്നു
    standfirst: യേശു യെരൂശലേമിലേക്കു വരുന്നു എന്ന് ഒരു വലിയ പുരുഷാരം കേൾക്കുന്നു. അവർ കുരുത്തോല എടുത്ത് അവനെ എതിരേല്പാൻ ഓടിച്ചെന്ന് ഹോശന്നാ എന്ന് ആർക്കുന്നു. അവൻ ഒരു ചെറിയ കഴുതപ്പുറത്തു വരുന്നു.
    description: ഹോശാനാ (ഓശാന) ഞായറിലെ വായനകൾ, യേശുവിന്റെ യെരൂശലേം പ്രവേശനത്തെക്കുറിച്ചുള്ള യോഹന്നാൻ 12:12–19 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും കുടുംബചോദ്യവും.
    one_minute:
      what_happens: പെസഹയ്ക്ക് അഞ്ചു ദിവസം മുമ്പ്, ഒരു വലിയ പുരുഷാരം കുരുത്തോലയുമായി യേശുവിനെ എതിരേല്പാൻ ചെന്ന് ഹോശന്നാ എന്ന് ആർക്കുന്നു. സെഖര്യാവിന്റെ പ്രവചനം നിവൃത്തിയാക്കിക്കൊണ്ട് അവൻ ഒരു ചെറിയ കഴുതപ്പുറത്ത് ഇരിക്കുന്നു. ലാസർ ഉയിർത്തെഴുന്നേല്ക്കുന്നതു കണ്ടവർ ആ കഥ പറഞ്ഞുകൊണ്ടേയിരിക്കുന്നു; പരീശന്മാർ നിരാശരാകുന്നു.
      why_this_sunday: ഹോശാനാ ഞായറോടെ കഷ്ടാനുഭവആഴ്ച ആരംഭിക്കുന്നു. ദൈവാലയത്തിൽ ഹോശന്നാ എന്ന് ആർത്ത കുട്ടികളെ ഓർത്ത്, സഭ ഈ ദിവസം ബാലികാബാലന്മാരുടെ ദിനമായും ആചരിക്കുന്നു.
      take_with_you: ഹോശന്നാ എന്ന് ആർക്കുന്ന അതേ നഗരം ഒരാഴ്ചയ്ക്കകം ക്രൂശിക്ക എന്ന് ആർക്കും. പുരുഷാരത്തിനിടയിൽ സ്തുതിക്കുവാൻ എളുപ്പമാണ്; വിശ്വസ്തത പരീക്ഷിക്കപ്പെടുന്നതു പിന്നീടാണ്.
    readings_thread: യാക്കോബ് യെഹൂദയെ അനുഗ്രഹിക്കുന്നു; അവന്റെ വംശത്തിലെ ഭരണാധിപൻ തന്റെ കഴുതയെ മുന്തിരിവള്ളിയിൽ കെട്ടും. ബാലനായ ശമൂവേൽ കർത്താവിനെ ശുശ്രൂഷിക്കുന്നു, യുവാവായ ശലോമോൻ ജ്ഞാനം ചോദിക്കുന്നു, ദാനീയേലും സ്നേഹിതന്മാരും യൌവനത്തിൽ വിശ്വസ്തരായി നില്ക്കുന്നു. സന്തോഷിക്കുവാൻ സെഫന്യാവും സെഖര്യാവും സീയോൻപുത്രിയെ വിളിക്കുന്നു.
    scenes:
    - verses: യോഹന്നാൻ 12:12–13
      title: കുരുത്തോലകൾ
      text: 'പിറ്റേന്നു, പെരുന്നാൾക്കു വന്ന വലിയ പുരുഷാരം യേശു വരുന്നു എന്നു കേൾക്കുന്നു. അവർ ഈത്തപ്പനയുടെ കുരുത്തോല എടുത്ത് അവനെ എതിരേല്പാൻ ചെന്ന് ആർക്കുന്നു: ഹോശന്നാ, യിസ്രായേലിന്റെ രാജാവായി കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ വാഴ്ത്തപ്പെട്ടവൻ!'
      easy_to_miss: കുരുത്തോല ദേശീയവിജയത്തിന്റെ അടയാളമായിരുന്നു. പുരുഷാരം ഒരു രാജാവിനെയാണ് സ്വാഗതം ചെയ്യുന്നത്.
    - verses: യോഹന്നാൻ 12:14–15
      title: ചെറിയ കഴുതപ്പുറത്ത്
      text: യേശു ഒരു ചെറിയ കഴുതയെ കണ്ട് അതിന്മേൽ കയറുന്നു. “സീയോൻ പുത്രി, ഭയപ്പെടേണ്ടാ; ഇതാ നിന്റെ രാജാവു കഴുതക്കുട്ടിപ്പുറത്തു കയറിവരുന്നു” എന്ന് എഴുതിയിരിക്കുന്നതുപോലെ തന്നേ.
      easy_to_miss: രാജാക്കന്മാർ യുദ്ധത്തിനു കുതിരപ്പുറത്താണ് വന്നിരുന്നത്. സമാധാനത്തിൽ വരുന്ന രാജാവിന്റെ മൃഗമായിരുന്നു കഴുത.
    - verses: യോഹന്നാൻ 12:16
      title: അവർ പിന്നീടു ഗ്രഹിച്ചു
      text: ഇത് അവന്റെ ശിഷ്യന്മാർ ആദിയിൽ ഗ്രഹിക്കുന്നില്ല. യേശുവിന്നു തേജസ്കരണം വന്നശേഷം മാത്രമാണ്, ഇത് അവനെക്കുറിച്ച് എഴുതിയിരിക്കുന്നു എന്ന് അവർക്ക് ഓർമ്മവരുന്നത്.
      easy_to_miss: അന്ന് ശിഷ്യന്മാർക്ക് അർത്ഥം പിടികിട്ടിയില്ല എന്നു യോഹന്നാൻ സമ്മതിക്കുന്നു. പലപ്പോഴും ഗ്രാഹ്യം വരുന്നത് ഉയിർപ്പിനു ശേഷമാണ്.
    - verses: യോഹന്നാൻ 12:17–18
      title: ലാസർ നിമിത്തം
      text: അവൻ ലാസരെ കല്ലറയിൽനിന്നു വിളിച്ചപ്പോൾ അവനോടുകൂടെ ഉണ്ടായിരുന്ന പുരുഷാരം കണ്ടതിനെക്കുറിച്ചു സാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരിക്കുന്നു. അതുകൊണ്ടാണ് ഇത്രയധികം പേർ അവനെ എതിരേല്പാൻ വരുന്നത്.
      easy_to_miss: തലേ ശനിയാഴ്ച വായിക്കുന്ന ലാസരിന്റെ ഉയിർപ്പിനോട് യോഹന്നാൻ ഈ ദിവസത്തെ നേരിട്ടു ബന്ധിപ്പിക്കുന്നു.
    - verses: യോഹന്നാൻ 12:19
      title: ലോകം അവന്റെ പിന്നാലെ
      text: 'പരീശന്മാർ തമ്മിൽ തമ്മിൽ പറയുന്നു: “നമുക്കു ഒന്നും സാധിക്കുന്നില്ലല്ലോ; ലോകം അവന്റെ പിന്നാലെ ആയിപ്പോയി”.'
      easy_to_miss: തൊട്ടടുത്ത വാക്യങ്ങളിൽ ചില യവനന്മാർ യേശുവിനെ കാണാൻ വരുന്നു. “ലോകം” ഉടനെ എത്തിത്തുടങ്ങുന്നു.
    people:
    - name: പുരുഷാരം
      role: പെസഹയ്ക്കു യെരൂശലേമിൽ വന്ന തീർത്ഥാടകർ; അവരിൽ പലരും ലാസരിനെക്കുറിച്ചു കേട്ടിരുന്നു.
      name_meaning: —
      ml: The crowd
    - name: ലാസർ
      role: ബേഥാന്യയിൽ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടവൻ; പലരും യേശുവിനെ കാണാൻ വന്നതിന്റെ കാരണം.
      name_meaning: “ദൈവം സഹായിച്ചു”
      ml: Lazarus
    - name: പരീശന്മാർ
      role: ഈ സ്വീകരണം കണ്ട്, കാര്യങ്ങൾ തങ്ങളുടെ കൈവിട്ടുപോയി എന്ന് അവർ കരുതുന്നു.
      name_meaning: ഒരുപക്ഷേ “വേർതിരിക്കപ്പെട്ടവർ”
      ml: The Pharisees
    phrases:
    - term: ഹോശന്നാ
      explanation: ‘ഇപ്പോൾ രക്ഷിക്കേണമേ’ എന്നർത്ഥമുള്ള എബ്രായ വാക്ക് (സങ്കീർത്തനം 118:25). യേശുവിന്റെ കാലമായപ്പോൾ അതു സ്തുതിയുടെ ആർപ്പുവിളിയുമായിരുന്നു.
    - term: സീയോൻ പുത്രി
      explanation: യെരൂശലേമിനും അതിലെ ജനത്തിനുമുള്ള കാവ്യാത്മകമായ പേര് (സെഖര്യാവു 9:9).
    - term: തേജസ്കരണം
      explanation: യേശുവിന്റെ മരണം, ഉയിർപ്പ്, പിതാവിന്റെ അടുക്കലേക്കുള്ള മടക്കം എന്നിവയ്ക്കു യോഹന്നാൻ ഉപയോഗിക്കുന്ന വാക്ക്.
    reflection:
      title_en: കഴുതപ്പുറത്തു വരുന്ന രാജാവ്
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        ഹോശാനാ ഞായറിലെ പുരുഷാരത്തിന് തങ്ങൾക്ക് ഏതുതരം രാജാവിനെയാണ് വേണ്ടതെന്നു കൃത്യമായി അറിയാമായിരുന്നു. ശത്രുക്കളുടെമേലുള്ള വിജയത്തിന്റെ അടയാളമായ കുരുത്തോല അവർ വീശി. റോമിനെ തുരത്തി യിസ്രായേലിനെ വീണ്ടും വലുതാക്കുന്ന ഒരാളെ അവർ പ്രതീക്ഷിച്ചു. യേശു വന്നത് ഒരു ചെറിയ കഴുതപ്പുറത്താണ്.

        അവൻ രാജാവായിരുന്നു; പക്ഷേ ആ തരത്തിലുള്ളവനല്ല. ക്രൂശിലേക്കുള്ള വഴിയിൽ, സമാധാനത്തിൽ അവൻ വന്നു. ആഴ്ച തീരുംമുമ്പേ അതേ നഗരം അവനെതിരെ തിരിയും. തങ്ങൾ കാണുന്നത് എന്താണെന്ന് ഉയിർപ്പിനു ശേഷമല്ലാതെ അവന്റെ ശിഷ്യന്മാർക്കുപോലും മനസ്സിലായില്ല.

        ബാലികാബാലന്മാരുടെ ദിനത്തിൽ, ദൈവാലയത്തിൽ ഹോശന്നാ എന്ന് ആർത്തവരിൽ കുട്ടികളും ഉണ്ടായിരുന്നു എന്നും യേശു അവരുടെ പക്ഷം പിടിച്ചു എന്നും സഭ ഓർക്കുന്നു. യേശു ഏതുതരം രാജാവാണെന്നു മുതിർന്നവരെക്കാൾ വ്യക്തമായി പലപ്പോഴും കുട്ടികൾ കാണുന്നു. കഷ്ടാനുഭവആഴ്ച ഇന്ന് ആരംഭിക്കുന്നു. വെള്ളിയാഴ്ചയും നാം അവനോടുകൂടെ ഉണ്ടാകുമോ എന്നതാണ് നമ്മുടെ എല്ലാവരുടെയും മുമ്പിലുള്ള ചോദ്യം.
      title_ml: A king on a donkey
    week:
      question: ഈ ആഴ്ച യേശു നമ്മുടെ നാട്ടിൽ വന്നാൽ, അവൻ എന്തു ചെയ്യണമെന്നാണ് നാം ആഗ്രഹിക്കുക? അവൻ യഥാർത്ഥത്തിൽ എന്തു ചെയ്യുമെന്നാണ് നിങ്ങൾ കരുതുന്നത്?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: കഷ്ടാനുഭവആഴ്ചയിലെ ഏതെല്ലാം ശുശ്രൂഷകളിൽ ഒരുമിച്ചു പങ്കെടുക്കുമെന്നു കുടുംബമായി തീരുമാനിക്കുക. ഇന്നത്തെ കുരുത്തോല എപ്പോഴും കാണുന്ന ഒരിടത്തു സൂക്ഷിക്കുക.
      prayer: ദാവീദിന്റെ പുത്രന്നു ഹോശന്നാ! കർത്താവായ യേശുവേ, താഴ്മയോടെ കഴുതപ്പുറത്തു നീ യെരൂശലേമിലേക്കു വന്നു. ഈ കഷ്ടാനുഭവആഴ്ചയിൽ ഞങ്ങളോടുകൂടെ നടക്കേണമേ; ക്രൂശുവരെയും ഒഴിഞ്ഞ കല്ലറവരെയും ഞങ്ങളെ നിന്നോടു വിശ്വസ്തരായി കാത്തുകൊള്ളേണമേ. ആമേൻ.
    readings:
      evening:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Matthew 21:1–17
        ml: മത്തായി 21:1–17
        note: യെരൂശലേമിലേക്കുള്ള പ്രവേശനം, ദൈവാലയശുദ്ധീകരണം, ഹോശന്നാ എന്ന് ആർക്കുന്ന കുട്ടികൾ.
        printed: St. Matthew 21:1-17
      morning:
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: Luke 19:28–44
        ml: ലൂക്കൊസ് 19:28–44
        note: യേശു ഒലിവുമലയിൽനിന്ന് ഇറങ്ങിവരുന്നു; യെരൂശലേമിനെക്കുറിച്ചു കരയുന്നു.
        printed: St. Luke 19:28-44
      before_qurbana:
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Genesis 49:8–15
        ml: ഉല്പത്തി 49:8–15
        note: 'യാക്കോബ് യെഹൂദയെ അനുഗ്രഹിക്കുന്നു: ചെങ്കോൽ അവനിൽനിന്നു നീങ്ങിപ്പോകയില്ല; അവൻ തന്റെ കഴുതയെ മുന്തിരിവള്ളിയിൽ കെട്ടുന്നു.'
        printed: Genesis 49:8-15
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: 1 Samuel 2:18–26; 16:1
        ml: 1 ശമൂവേൽ 2:18–26; 16:1
        note: ബാലനായ ശമൂവേൽ ദൈവപ്രീതിയിൽ വളരുന്നു; ഒരു പുതിയ രാജാവിനെ അഭിഷേകം ചെയ്യാൻ ശമൂവേലിനെ അയയ്ക്കുന്നു.
        printed: I Samuel 2:18-26, 16:1
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Daniel 1:16–20
        ml: ദാനീയേൽ 1:16–20
        note: ദാനീയേലും സ്നേഹിതന്മാരും, വിശ്വസ്തരായ യുവാക്കൾ, മറ്റുള്ളവരെക്കാൾ പത്തിരട്ടി ജ്ഞാനികളായി കാണപ്പെടുന്നു.
        printed: Daniel 1:16-20
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Micah 4:1–5
        ml: മീഖാ 4:1–5
        note: ജാതികൾ തങ്ങളുടെ വാളുകളെ കൊഴുക്കളായി അടിച്ചുതീർക്കും.
        printed: Micah 4:1-5
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: 1 Kings 3:4–14
        ml: 1 രാജാക്കന്മാർ 3:4–14
        note: യുവാവായ ശലോമോൻ ദൈവത്തോടു വിവേകമുള്ള ഒരു ഹൃദയം ചോദിക്കുന്നു.
        printed: I Kings 3:4-14
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Zephaniah 3:11–20
        ml: സെഫന്യാവ് 3:11–20
        note: സീയോൻപുത്രിയേ, ഘോഷിച്ചുല്ലസിക്ക; നിന്റെ ദൈവമായ യഹോവ നിന്റെ മദ്ധ്യേ ഉണ്ട്.
        printed: Zephaniah 3:11-20
      - kind: Old Testament
        kind_ml: പഴയനിയമം
        ref: Jeremiah 30:18–22
        ml: യിരെമ്യാവ് 30:18–22
        note: ഞാൻ യെരൂശലേമിനെ പുനഃസ്ഥാപിക്കും; നിങ്ങൾ എനിക്കു ജനമായും ഞാൻ നിങ്ങൾക്കു ദൈവമായും ഇരിക്കും.
        printed: Jeremiah 30:18-22
      holy_qurbana:
      - kind: General Epistle
        kind_ml: പൊതുലേഖനം
        ref: 1 John 5:1–12
        ml: 1 യോഹന്നാൻ 5:1–12
        note: ദൈവത്തിൽനിന്നു ജനിച്ചതൊക്കെയും ലോകത്തെ ജയിക്കുന്നു; ഇതാണ് നമ്മുടെ വിശ്വാസം.
        printed: I John 5:1-12
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Romans 8:18–25
        ml: റോമർ 8:18–25
        note: ദൈവമക്കളുടെ വെളിപ്പാടിനായി സർവ്വസൃഷ്ടിയും ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നു.
        printed: Romans 8:18-25
      - kind: Pauline Epistle
        kind_ml: പൗലോസിന്റെ ലേഖനം
        ref: Ephesians 6:1–24
        ml: എഫെസ്യർ 6:1–24
        note: മക്കളും മാതാപിതാക്കളും, ദൈവത്തിന്റെ സർവ്വായുധവർഗ്ഗവും.
        printed: Ephesians:6:1-24
      - kind: Gospel
        kind_ml: സുവിശേഷം
        ref: John 12:12–19
        ml: യോഹന്നാൻ 12:12–19
        note: രാജാവു ഒരു കഴുതക്കുട്ടിമേൽ വരുമ്പോൾ പുരുഷാരം കുരുത്തോലകൾ വീശുന്നു. ഇതാണ് ഇന്നത്തെ സുവിശേഷം.
        printed: St. John 12:12-19
        main: true
    key_verse:
      ref: യോഹന്നാൻ 12:13
    hero_quote:
      text: സീയോൻ പുത്രി, ഭയപ്പെടേണ്ടാ; ഇതാ നിന്റെ രാജാവു കഴുതക്കുട്ടിപ്പുറത്തു കയറിവരുന്നു.
      ref: യോഹന്നാൻ 12:15
