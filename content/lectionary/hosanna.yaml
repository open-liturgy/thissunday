one_minute:
  what_happens: Five days before Passover, a great crowd takes palm branches and goes out to meet Jesus, shouting Hosanna. He sits on a young donkey, fulfilling Zechariah’s prophecy. People who saw Lazarus raised keep telling the story, and the Pharisees despair.
  why_this_sunday: Hosanna Sunday begins Holy Week. The Church also keeps it as Boys’ and Girls’ Day, remembering the children who shouted Hosanna in the Temple.
  take_with_you: The same city that shouts Hosanna will shout Crucify within a week. Praise is easy in a crowd; faithfulness is tested later.
readings_thread: Jacob blesses Judah, whose ruler will tie his donkey to the vine. The boy Samuel serves the Lord, young Solomon asks for wisdom, and Daniel and his friends stay faithful as young men. Zephaniah and Zechariah call the daughter of Zion to rejoice.
key_verse:
  ref: John 12:13
  ml: 'ഈത്തപ്പനയുടെ കുരുത്തോല എടുത്തുംകൊണ്ടു അവനെ എതിരേല്പാൻ ചെന്നു: ഹോശന്നാ, യിസ്രായേലിന്റെ രാജാവായി കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ വാഴ്ത്തപ്പെട്ടവൻ എന്നു ആർത്തു.'
  ml_translation: Sathyavedapusthakam, 1910
  en: they took the branches of the palm trees and went out to meet him, and cried out, “Hosanna! Blessed is he who comes in the name of the Lord, the King of Israel!”
  en_translation: World English Bible
scenes:
- verses: John 12:12–13
  title: Palm branches
  text: 'The next day the great crowd that had come for the feast hears that Jesus is coming. They take palm branches, go out to meet him and shout: Hosanna! Blessed is he who comes in the name of the Lord, the King of Israel!'
  easy_to_miss: Palm branches were a symbol of national victory. The crowd is welcoming a king.
- verses: John 12:14–15
  title: On a young donkey
  text: 'Jesus finds a young donkey and sits on it, as Zechariah wrote: do not be afraid, daughter of Zion; your king is coming, sitting on a donkey’s colt.'
  easy_to_miss: Kings rode horses to war. A donkey was the animal of a king coming in peace.
- verses: John 12:16
  title: They understood later
  text: His disciples do not understand this at first. Only after Jesus is glorified do they remember that this was written about him.
  easy_to_miss: John admits the disciples missed the meaning at the time. Understanding often comes after Easter.
- verses: John 12:17–18
  title: Because of Lazarus
  text: The crowd that was with him when he called Lazarus out of the tomb keeps telling what they saw. That is why so many come out to meet him.
  easy_to_miss: John links this day directly to the raising of Lazarus, read on the Saturday before.
- verses: John 12:19
  title: The whole world goes after him
  text: 'The Pharisees say to one another: you see, you are getting nowhere. Look, the whole world has gone after him.'
  easy_to_miss: In the very next verses, some Greeks come asking to see Jesus. The “whole world” starts arriving at once.
