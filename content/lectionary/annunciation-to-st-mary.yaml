standfirst: Six months after he spoke to Zechariah in the Temple, Gabriel is sent to a young woman in a small village. She asks one question and then says yes.
description: Readings for the Annunciation to St. Mary, with Luke 1:26–38 explained in five scenes, a reflection and one question for the family.
