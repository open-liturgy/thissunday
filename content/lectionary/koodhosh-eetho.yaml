phrases:
- term: Caesarea Philippi
  explanation: A city at the foot of Mount Hermon, rebuilt by Herod’s son Philip and named for the emperor. It was full of pagan shrines.
- term: Keys of the kingdom
  explanation: Keys were given to a trusted steward who opened and shut the house for the king (Isaiah 22:22).
- term: Koodosh Eetho
  explanation: Syriac for the sanctification of the Church. It is kept on the Sunday on or after 30 October and opens the Church year.
reflection:
  title_en: Built on people who get it wrong
  title_ml: '[TITLE ML]'
  read_time: A three-minute read
  body: |-
    Peter’s answer at Caesarea Philippi is the most famous thing he ever says. Jesus blesses him for it and calls him the rock. Five verses later the same man tries to talk Jesus out of the cross and is told to get out of the way. Matthew does not soften either moment.

    The Church begins its year with this Gospel on purpose. It is easy to imagine the Church as a building, or as the people who never put a foot wrong. Jesus builds it on a man who understood one thing perfectly and another thing not at all, and who would deny him within the year.

    That leaves room for the rest of us. The question Jesus asks is still put to each person in turn: who do you say I am? Answering it is the first step. Letting him correct the rest of what we think is the work of a whole year, and this is the first Sunday of it.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: If someone asked you this week who Jesus is to you, what would you honestly say?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Pick one thing you want to do differently in this new Church year, and tell one person at home so they can ask you about it.
  prayer: Lord Jesus, you are the Christ, the Son of the living God. Build your Church on us, weak as we are, and correct us when we think as people think and not as God thinks. Amen.
