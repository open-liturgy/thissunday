one_minute:
  what_happens: Near Caesarea Philippi, Jesus asks who people say he is, then asks his disciples. Peter says he is the Christ. Jesus calls him the rock the Church is built on, then warns that he must suffer. Peter objects and is rebuked.
  why_this_sunday: 'Koodosh Eetho means the sanctification of the Church. On the first Sunday of the new year the Church remembers where it came from: one man’s confession of who Jesus is.'
  take_with_you: Peter is called a rock and a stumbling block in the same conversation. The Church is built on people like that, and it still is.
readings_thread: Moses meets God in the tent outside the camp, the cloud fills the tabernacle, and Isaiah sees the Lord in the Temple. Peter and Paul then say the dwelling place of God is now his people. The year opens by asking what makes a place, and a people, holy.
key_verse:
  ref: Matthew 16:18
  ml: '[ML VERSE: Sathyavedapusthakam 1910, Matthew 16:18]'
  ml_translation: Sathyavedapusthakam, 1910
  en: I also tell you that you are Peter, and on this rock I will build my assembly, and the gates of Hades will not prevail against it.
  en_translation: World English Bible
scenes:
- verses: Matthew 16:13–14
  title: What are people saying?
  text: Far to the north, near a city named after Caesar, Jesus asks what people say about him. John the Baptist, Elijah, Jeremiah, one of the prophets.
  easy_to_miss: Every answer the crowd gives is a prophet who is already dead. They can only fit Jesus into the past.
- verses: Matthew 16:15–16
  title: But who do you say I am?
  text: 'Jesus turns the question on the disciples. Peter answers for them all: “You are the Christ, the Son of the living God.”'
  easy_to_miss: The question moves from “people” to “you”. Nobody can borrow someone else’s answer to it.
- verses: Matthew 16:17–19
  title: The rock and the keys
  text: Jesus says Peter did not work this out himself; the Father showed him. Peter is the rock on which the Church will stand, and he is given the keys of the kingdom.
  easy_to_miss: This is one of only two places in the Gospels where the word “church” appears (the other is Matthew 18:17).
- verses: Matthew 16:20–21
  title: The road to Jerusalem
  text: Jesus tells them to keep it quiet for now. From this moment he begins to explain that he must go to Jerusalem, suffer, be killed and rise on the third day.
  easy_to_miss: 'Matthew marks it as a turning point: “from that time Jesus began”. The rest of the Gospel walks towards the cross.'
- verses: Matthew 16:22–23
  title: Get behind me
  text: Peter takes Jesus aside and tells him this must never happen. Jesus calls him Satan and a stumbling block, because he is thinking the way people think, not the way God thinks.
  easy_to_miss: The rock of verse 18 becomes a stumbling block in verse 23. The same man can be a foundation or something to trip over.
