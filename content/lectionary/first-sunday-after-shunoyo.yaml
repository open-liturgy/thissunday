# Reusable text for First Sunday after the Festival of the Ascension of St. Mary. Year-independent; a dated edition in content/sundays/ overrides any field.
# Readings transcribed from https://mosc.in/lectionary/kyomtho-easter-to-koodosh-edtho/. Everything else is a DRAFT for priest/editor review.
sunday_slug: first-sunday-after-shunoyo
is_sunday: true
name:
  en: First Sunday after Shunoyo
  ml: ശൂനോയോയ്ക്കു ശേഷം ഒന്നാം ഞായർ
title_as_printed: First Sunday after the Festival of the Ascension of St. Mary
season:
  en: Pentecost
  gloss: The season of the Holy Spirit
  syr: ܦܢܛܩܘܣܛܐ
tagline: The speck, the log, and the fruit of a good tree
standfirst: Jesus asks why we notice the speck in someone else’s eye and miss the log in our own. Then he says you can tell a tree by its fruit, and a person by what comes out of their mouth.
description: Readings for the First Sunday after Shunoyo, with Luke 6:39–45, the speck and the log, explained in five scenes. Reflection and question.
hero_quote:
  text: Why do you see the speck of chaff that is in your brother’s eye, but don’t consider the beam that is in your own eye?
  ref: Luke 6:41
readings:
  evening:
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: Luke 14:25–35
    ml: ലൂക്കൊസ് 14:25–35
    note: Count the cost before building a tower; salt that loses its taste.
    printed: St. Luke 14:25-35
  morning:
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: Luke 15:1–10
    ml: ലൂക്കൊസ് 15:1–10
    note: 'The lost sheep and the lost coin: joy in heaven over one sinner who repents.'
    printed: St. Luke 15:1-10
  before_qurbana:
  - kind: Old Testament
    kind_ml: പഴയനിയമം
    ref: Exodus 14:21–31
    ml: പുറപ്പാട് 14:21–31
    note: Israel walks through the sea on dry ground.
    printed: Exodus 14:21-31
  - kind: Old Testament
    kind_ml: പഴയനിയമം
    ref: 1 Samuel 8:4–9
    ml: 1 ശമൂവേൽ 8:4–9
    note: Israel asks for a king like the other nations, rejecting God as their king.
    printed: I Samuel 8:4-9
  - kind: Old Testament
    kind_ml: പഴയനിയമം
    ref: Isaiah 43:1–5
    ml: യെശയ്യാവ് 43:1–5
    note: Do not fear, for I have redeemed you; I have called you by name, you are mine.
    printed: Isaiah 43:1-5
  holy_qurbana:
  - kind: General Epistle
    kind_ml: പൊതുലേഖനം
    ref: 1 John 2:22–29
    ml: 1 യോഹന്നാൻ 2:22–29
    note: Abide in him, so that we may be confident when he appears.
    printed: I John 2:22-29
  - kind: Pauline Epistle
    kind_ml: പൗലോസിന്റെ ലേഖനം
    ref: Ephesians 6:10–17
    ml: എഫെസ്യർ 6:10–17
    note: Put on the whole armour of God.
    printed: Ephesians 6:10-17
  - kind: Gospel
    kind_ml: സുവിശേഷം
    ref: Luke 6:39–45
    ml: ലൂക്കൊസ് 6:39–45
    note: The speck and the log; a tree is known by its fruit. This is the Gospel of the day.
    printed: St. Luke 6:39-45
    main: true
one_minute:
  what_happens: 'Jesus gives short sayings: the blind cannot lead the blind; a student becomes like the teacher; take the log out of your own eye before the speck from your brother’s; a good tree bears good fruit; the mouth speaks from what fills the heart.'
  why_this_sunday: These sayings come from Luke’s Sermon on the Plain. They are about examining ourselves before judging others.
  take_with_you: What we say shows what we have stored in our hearts.
readings_thread: 'Israel walks through the sea on dry ground, and the people ask Samuel for a king like other nations. God tells Israel: you are mine. John warns about those who deny the Son, and Ephesians tells us to put on God’s armour.'
key_verse:
  ref: Luke 6:45
  ml: നല്ലമനുഷ്യൻ തന്റെ ഹൃദയത്തിലെ നല്ല നിക്ഷേപത്തിൽ നിന്നു നല്ലതു പുറപ്പെടുവിക്കുന്നു; ദുഷ്ടൻ ദോഷമായതിൽ നിന്നു ദോഷം പുറപ്പെടുവിക്കുന്നു. ഹൃദയത്തിൽ നിറഞ്ഞു കവിയുന്നതല്ലോ വായി പ്രസ്താവിക്കുന്നതു.
  ml_translation: Sathyavedapusthakam, 1910
  en: The good man out of the good treasure of his heart brings out that which is good, and the evil man out of the evil treasure of his heart brings out that which is evil, for out of the abundance of the heart, his mouth speaks.
  en_translation: World English Bible
scenes:
- verses: Luke 6:39
  title: The blind leading the blind
  text: Can a blind person lead a blind person? Will they not both fall into a pit?
  easy_to_miss: Jesus has just told them not to judge (Luke 6:37). A judge who cannot see himself is a blind guide.
- verses: Luke 6:40
  title: Like the teacher
  text: A disciple is not above the teacher, but everyone fully trained will be like their teacher.
  easy_to_miss: We become like whoever we learn from. It matters who we follow.
- verses: Luke 6:41–42
  title: The speck and the log
  text: Why do you look at the speck in your brother’s eye and not notice the log in your own? First take the log out of your own eye, and then you will see clearly to take out the speck.
  easy_to_miss: Jesus does not say leave the speck alone. He says see clearly first.
- verses: Luke 6:43–44
  title: Known by its fruit
  text: No good tree bears bad fruit, and no bad tree bears good fruit. Each tree is known by its fruit. Figs do not grow on thorns.
  easy_to_miss: Jesus was a craftsman’s son in a farming village. His pictures come from everyday life.
- verses: Luke 6:45
  title: From the heart
  text: A good person brings good out of the good stored in the heart, and an evil person evil out of evil. The mouth speaks from what fills the heart.
  easy_to_miss: The word for “treasure” is a storeroom. Each of us is stocking one.
people:
- name: The disciples
  ml: ശിഷ്യന്മാർ
  role: Listening to Jesus on a level place with a great crowd (Luke 6:17).
  name_meaning: —
phrases:
- term: Sermon on the Plain
  explanation: Luke’s version of Jesus’ great sermon (Luke 6:17–49), similar to Matthew’s Sermon on the Mount.
- term: Speck and log
  explanation: 'A deliberately funny picture: a person with a beam of wood in their eye trying to remove a speck of sawdust from someone else’s.'
- term: Treasure of the heart
  explanation: 'What a person stores up inside: thoughts, habits and loves, which come out in speech.'
reflection:
  title_en: Logs and specks
  title_ml: കോലും കരടും
  read_time: A three-minute read
  body: |-
    Jesus’ picture is meant to make us laugh. A man with a plank sticking out of his eye leans in close to help his brother with a speck of dust. We laugh because we recognise ourselves. It is always easier to see what is wrong with other people.

    Jesus does not say we should never help anyone see their faults. He says we should first deal with our own. Someone who has honestly faced their own sin is gentler and clearer when they speak to others. Someone who has not becomes a blind guide.

    The last saying turns the mirror inward again. Our words come from what we have stored in our hearts. If what comes out of our mouths at home is often harsh, the answer is not just to watch our tongues. It is to change what we are storing up: in prayer, in what we watch and read, and in the company we keep.
  author: '[AUTHOR NAME]'
  reviewer: '[REVIEWER NAME, PARISH]'
week:
  question: What do our words at home this week say about what is in our hearts?
  question_note: Two minutes after the audio. Everyone gets a turn, and nobody is interrupted.
  small_act: Before correcting anyone this week, name one fault of your own to God first.
  prayer: Lord Jesus, take the log out of our eyes so we can see clearly. Fill our hearts with good treasure, so that our words build up and do not tear down. Amen.
translations:
  ml:
    name:
      en: ശൂനോയോയ്ക്കു ശേഷം ഒന്നാം ഞായർ
      ml: First Sunday after Shunoyo
    season:
      en: പെന്തിക്കോസ്തി
      gloss: പരിശുദ്ധാത്മാവിന്റെ കാലം
    tagline: കരടും കോലും, നല്ല വൃക്ഷത്തിന്റെ ഫലവും
    standfirst: സഹോദരന്റെ കണ്ണിലെ കരടു നാം കാണുകയും സ്വന്തകണ്ണിലെ കോൽ കാണാതിരിക്കയും ചെയ്യുന്നത് എന്തുകൊണ്ട് എന്ന് യേശു ചോദിക്കുന്നു. പിന്നെ, വൃക്ഷത്തെ ഫലംകൊണ്ടും മനുഷ്യനെ വായിൽനിന്നു വരുന്നതുകൊണ്ടും അറിയാം എന്ന് അവൻ പറയുന്നു.
    description: ശൂനോയോയ്ക്കു ശേഷം ഒന്നാം ഞായറിലെ വായനകൾ, കരടിനെയും കോലിനെയും കുറിച്ചുള്ള ലൂക്കൊസ് 6:39–45 അഞ്ചു രംഗങ്ങളിൽ. ധ്യാനവും ചോദ്യവും.
    one_minute:
      what_happens: 'യേശു ചെറിയ ചില വചനങ്ങൾ പറയുന്നു: കുരുടന്നു കുരുടനെ വഴികാട്ടുവാൻ കഴികയില്ല; ശിഷ്യൻ ഗുരുവിനെപ്പോലെ ആകും; സഹോദരന്റെ കണ്ണിലെ കരടെടുക്കും മുമ്പ് സ്വന്തകണ്ണിലെ കോൽ എടുത്തുകളക; നല്ല വൃക്ഷം നല്ല ഫലം കായ്ക്കുന്നു; ഹൃദയത്തിൽ നിറഞ്ഞു കവിയുന്നതാണ് വായ് സംസാരിക്കുന്നത്.'
      why_this_sunday: ലൂക്കൊസിന്റെ സമഭൂമിപ്രസംഗത്തിൽനിന്നുള്ളതാണ് ഈ വചനങ്ങൾ. മറ്റുള്ളവരെ വിധിക്കുന്നതിനു മുമ്പു നമ്മെത്തന്നെ പരിശോധിക്കുന്നതിനെക്കുറിച്ചാണ് അവ.
      take_with_you: നാം പറയുന്നതു നമ്മുടെ ഹൃദയത്തിൽ സംഭരിച്ചിരിക്കുന്നതിനെ വെളിപ്പെടുത്തുന്നു.
    readings_thread: യിസ്രായേൽ കടലിന്റെ നടുവിലൂടെ ഉണങ്ങിയ നിലത്തു നടക്കുന്നു; മറ്റു ജാതികളെപ്പോലെ ഒരു രാജാവിനെ ജനം ശമൂവേലിനോടു ചോദിക്കുന്നു. നീ എനിക്കുള്ളവൻ എന്നു ദൈവം യിസ്രായേലിനോടു പറയുന്നു. പുത്രനെ നിഷേധിക്കുന്നവരെക്കുറിച്ചു യോഹന്നാൻ മുന്നറിയിപ്പു നല്കുന്നു; ദൈവത്തിന്റെ സർവ്വായുധവർഗ്ഗം ധരിക്കുവാൻ എഫെസ്യലേഖനം പറയുന്നു.
    scenes:
    - verses: ലൂക്കൊസ് 6:39
      title: കുരുടൻ കുരുടനെ വഴികാട്ടുമോ?
      text: കുരുടന്നു കുരുടനെ വഴികാട്ടുവാൻ കഴിയുമോ? ഇരുവരും കുഴിയിൽ വീഴുകയില്ലയോ?
      easy_to_miss: വിധിക്കരുത് എന്ന് യേശു ഇപ്പോൾ പറഞ്ഞതേയുള്ളൂ (ലൂക്കൊസ് 6:37). തന്നെത്തന്നെ കാണാൻ കഴിയാത്ത ന്യായാധിപൻ ഒരു കുരുടനായ വഴികാട്ടിയാണ്.
    - verses: ലൂക്കൊസ് 6:40
      title: ഗുരുവിനെപ്പോലെ
      text: ശിഷ്യൻ ഗുരുവിന്നു മീതെയല്ല; അഭ്യാസം തികഞ്ഞവൻ എല്ലാം ഗുരുവിനെപ്പോലെ ആകും.
      easy_to_miss: ആരിൽനിന്നു പഠിക്കുന്നുവോ അവരെപ്പോലെ നാം ആകുന്നു. നാം ആരെ പിന്തുടരുന്നു എന്നതു പ്രധാനമാണ്.
    - verses: ലൂക്കൊസ് 6:41–42
      title: കരടും കോലും
      text: നീ സഹോദരന്റെ കണ്ണിലെ കരടു നോക്കുകയും സ്വന്തകണ്ണിലെ കോൽ വിചാരിക്കാതിരിക്കയും ചെയ്യുന്നതു എന്തു? മുമ്പെ സ്വന്തകണ്ണിലെ കോൽ എടുത്തുകളക; എന്നാൽ സഹോദരന്റെ കണ്ണിലെ കരടു എടുത്തുകളവാൻ വെടിപ്പായി കാണും.
      easy_to_miss: കരടിനെ വെറുതെ വിട്ടേക്ക് എന്നല്ല യേശു പറയുന്നത്. ആദ്യം വ്യക്തമായി കാണുക എന്നാണ്.
    - verses: ലൂക്കൊസ് 6:43–44
      title: ഫലംകൊണ്ട് അറിയാം
      text: ആകാത്തഫലം കായ്ക്കുന്ന നല്ല വൃക്ഷമില്ല; നല്ലഫലം കായ്ക്കുന്ന ആകാത്ത വൃക്ഷവുമില്ല. ഏതു വൃക്ഷത്തെയും ഫലംകൊണ്ടു അറിയാം. മുള്ളിൽനിന്ന് ആരും അത്തിപ്പഴം ശേഖരിക്കാറില്ല.
      easy_to_miss: ഒരു കൃഷിഗ്രാമത്തിലെ ഒരു തച്ചന്റെ മകനായിരുന്നു യേശു. അവന്റെ ചിത്രങ്ങൾ ദൈനംദിനജീവിതത്തിൽനിന്നു വരുന്നു.
    - verses: ലൂക്കൊസ് 6:45
      title: ഹൃദയത്തിൽനിന്ന്
      text: നല്ലമനുഷ്യൻ തന്റെ ഹൃദയത്തിലെ നല്ല നിക്ഷേപത്തിൽനിന്നു നല്ലതു പുറപ്പെടുവിക്കുന്നു; ദുഷ്ടൻ ദോഷമായതിൽനിന്നു ദോഷം പുറപ്പെടുവിക്കുന്നു. ഹൃദയത്തിൽ നിറഞ്ഞു കവിയുന്നതല്ലോ വായി പ്രസ്താവിക്കുന്നത്.
      easy_to_miss: ‘നിക്ഷേപം’ എന്നതിന്റെ വാക്ക് ഒരു കലവറയെ കുറിക്കുന്നു. നാം ഓരോരുത്തരും ഒന്നു നിറച്ചുകൊണ്ടിരിക്കുന്നു.
    people:
    - name: ശിഷ്യന്മാർ
      role: ഒരു സമഭൂമിയിൽ വലിയ പുരുഷാരത്തോടൊപ്പം യേശുവിനെ കേൾക്കുന്നവർ (ലൂക്കൊസ് 6:17).
      name_meaning: —
      ml: The disciples
    phrases:
    - term: സമഭൂമിപ്രസംഗം
      explanation: യേശുവിന്റെ മഹാപ്രസംഗത്തിന്റെ ലൂക്കൊസിലുള്ള രൂപം (ലൂക്കൊസ് 6:17–49); മത്തായിയിലെ ഗിരിപ്രഭാഷണത്തോടു സാമ്യമുള്ളത്.
    - term: കരടും കോലും
      explanation: 'മനഃപൂർവ്വം രസകരമാക്കിയ ഒരു ചിത്രം: കണ്ണിൽ ഒരു മരക്കഴുക്കോൽ ഉള്ള ഒരാൾ മറ്റൊരാളുടെ കണ്ണിൽനിന്ന് ഒരു തരി അറക്കപ്പൊടി എടുക്കാൻ ശ്രമിക്കുന്നു.'
    - term: ഹൃദയത്തിലെ നിക്ഷേപം
      explanation: 'ഒരാൾ ഉള്ളിൽ സംഭരിക്കുന്നവ: ചിന്തകളും ശീലങ്ങളും ഇഷ്ടങ്ങളും; അവ സംസാരത്തിൽ പുറത്തുവരുന്നു.'
    reflection:
      title_en: കോലും കരടും
      read_time: മൂന്നു മിനിറ്റ് വായന
      body: |-
        യേശുവിന്റെ ഈ ചിത്രം നമ്മെ ചിരിപ്പിക്കാനുള്ളതാണ്. കണ്ണിൽനിന്ന് ഒരു പലക തള്ളിനില്ക്കുന്ന ഒരാൾ, സഹോദരന്റെ കണ്ണിലെ ഒരു പൊടിത്തരി എടുക്കാൻ അടുത്തേക്കു കുനിയുന്നു. നമ്മെത്തന്നെ അതിൽ തിരിച്ചറിയുന്നതുകൊണ്ടാണ് നാം ചിരിക്കുന്നത്. മറ്റുള്ളവരുടെ തെറ്റുകൾ കാണാൻ എപ്പോഴും എളുപ്പമാണ്.

        ആരെയും അവരുടെ തെറ്റുകൾ കാണാൻ നാം ഒരിക്കലും സഹായിക്കരുതെന്ന് യേശു പറയുന്നില്ല. ആദ്യം നമ്മുടെ സ്വന്തം തെറ്റുകൾ കൈകാര്യം ചെയ്യണമെന്നാണ് അവൻ പറയുന്നത്. സ്വന്തം പാപത്തെ സത്യസന്ധമായി നേരിട്ട ഒരാൾ മറ്റുള്ളവരോടു സംസാരിക്കുമ്പോൾ കൂടുതൽ സൌമ്യനും വ്യക്തതയുള്ളവനുമായിരിക്കും. അങ്ങനെ ചെയ്യാത്തയാൾ ഒരു കുരുടനായ വഴികാട്ടിയാകുന്നു.

        അവസാനത്തെ വചനം കണ്ണാടിയെ വീണ്ടും ഉള്ളിലേക്കു തിരിക്കുന്നു. നമ്മുടെ വാക്കുകൾ വരുന്നതു ഹൃദയത്തിൽ നാം സംഭരിച്ചിരിക്കുന്നതിൽനിന്നാണ്. വീട്ടിൽ നമ്മുടെ വായിൽനിന്നു വരുന്നതു പലപ്പോഴും കഠിനമാണെങ്കിൽ, നാവിനെ സൂക്ഷിക്കുക മാത്രമല്ല പരിഹാരം. നാം സംഭരിക്കുന്നതിനെ മാറ്റുക: പ്രാർത്ഥനയിലൂടെ, നാം കാണുന്നതിലൂടെയും വായിക്കുന്നതിലൂടെയും, നാം കൂട്ടുകൂടുന്നവരിലൂടെയും.
      title_ml: Logs and specks
    week:
      question: ഈ ആഴ്ച വീട്ടിലെ നമ്മുടെ വാക്കുകൾ നമ്മുടെ ഹൃദയത്തിലുള്ളതിനെക്കുറിച്ച് എന്തു പറയുന്നു?
      question_note: ഓഡിയോയ്ക്കു ശേഷം രണ്ടു മിനിറ്റ്. എല്ലാവർക്കും ഒരു അവസരം; ആരും ഇടയ്ക്കു കയറി സംസാരിക്കരുത്.
      small_act: ഈ ആഴ്ച ആരെയെങ്കിലും തിരുത്തുന്നതിനു മുമ്പ്, നിങ്ങളുടെ സ്വന്തം ഒരു കുറവ് ആദ്യം ദൈവത്തോട് ഏറ്റുപറയുക.
      prayer: കർത്താവായ യേശുവേ, വ്യക്തമായി കാണേണ്ടതിന്നു ഞങ്ങളുടെ കണ്ണിലെ കോൽ എടുത്തുകളയേണമേ. ഞങ്ങളുടെ ഹൃദയങ്ങളെ നല്ല നിക്ഷേപംകൊണ്ടു നിറയ്ക്കേണമേ; ഞങ്ങളുടെ വാക്കുകൾ തകർക്കാതെ പണിതുയർത്തുമാറാകട്ടെ. ആമേൻ.
