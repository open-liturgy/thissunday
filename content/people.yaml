# Character pages: /people/{slug}/
#
# Each entry is one person (or group) with its own page. `match` lists the
# `people[].name` values in the lectionary files that refer to them:
#   - "Peter"                    any Sunday whose people list has that exact name
#   - "koodhosh-eetho: Simon bar Jonah"   only on that sunday_slug
# One people entry can match several characters (e.g. "Peter and Andrew").
# Names not matched here stay plain text on the Sunday page; add them here to
# give them a page.
#
# Only facts already in the editions are shown on a character page (the role
# written for each Sunday, and the name meanings), so nothing here needs its
# own review beyond the identifications below. `ml` is copied from the
# editions; leave it out rather than guess.
#
# kind: person (default), angel or group.

