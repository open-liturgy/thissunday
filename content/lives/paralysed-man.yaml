summary: A paralysed man in Capernaum whose four friends lowered him through the roof to reach Jesus. Jesus forgave his sins and then told him to get up and walk, and he did.
events:
- text: Jesus is preaching in a crowded house in Capernaum.
  ref: "Mark 2:1–2"
- text: Four men carry him on a mat; unable to get near, they open up the roof and lower him down.
  ref: "Mark 2:3–4"
- text: Seeing their faith, Jesus says, “Son, your sins are forgiven you.”
  ref: "Mark 2:5"
- text: Some scribes think this is blasphemy; Jesus answers that the Son of Man has authority on earth to forgive sins.
  ref: "Mark 2:6–10"
- text: He tells the man, “Arise, take up your mat, and go to your house”; he does, and everyone glorifies God.
  ref: "Mark 2:11–12"
remembered:
- name: Third Sunday of Great Lent (Palsy Sunday)
read:
- ref: "Mark 2:1–12"
  note: Through the roof
- ref: "Luke 5:17–26"
  note: The same story in Luke
sources:
- label: The Holy Bible (World English Bible)
reviewed: false
