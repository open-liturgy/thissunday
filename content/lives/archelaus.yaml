summary: Archelaus, son of Herod the Great, who ruled Judea after his father. Because of him Joseph did not settle in Judea on the return from Egypt, but went to Nazareth in Galilee.
born:
  text: Son of Herod the Great and his wife Malthace
  ref: Josephus, Antiquities 17.1.3
  from: history
family:
  - { relation: "Father", name: "Herod the Great", ref: "Matthew 2:22" }
events:
  - { text: "On Herod’s death in 4 BC he becomes ruler (ethnarch) of Judea, Samaria and Idumea, under the emperor Augustus.", ref: "Josephus, Antiquities 17.11.4", from: "history" }
  - { text: "Hearing that Archelaus reigns in Judea, Joseph is afraid to go there and, warned in a dream, withdraws to Galilee.", ref: "Matthew 2:22–23" }
  - { text: "His rule is harsh; a delegation of Jews and Samaritans complains to Rome.", ref: "Josephus, Antiquities 17.13.2", from: "history" }
died:
  text: Removed by Augustus in AD 6 and banished to Vienne in Gaul; Judea then came under Roman governors
  ref: Josephus, Antiquities 17.13.2
  from: history
read:
  - { ref: "Matthew 2:19–23", note: "The return from Egypt" }
sources:
  - { label: "The Holy Bible (World English Bible)" }
  - { label: "Josephus, Antiquities of the Jews 17", url: "https://www.gutenberg.org/ebooks/2848" }
reviewed: false
