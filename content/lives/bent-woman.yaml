summary: A woman who for eighteen years was bent over and could not stand up straight. Jesus healed her in the synagogue on the Sabbath, called her a daughter of Abraham, and she glorified God.
events:
- text: She has had a spirit of infirmity for eighteen years, bent over and unable to straighten herself.
  ref: "Luke 13:11"
- text: She is in the synagogue on the Sabbath where Jesus is teaching.
  ref: "Luke 13:10"
- text: "Jesus calls her: “Woman, you are freed from your infirmity,” and lays his hands on her."
  ref: "Luke 13:12–13"
- text: Immediately she stands up straight and glorifies God.
  ref: "Luke 13:13"
- text: The synagogue ruler objects to healing on the Sabbath; Jesus answers that this daughter of Abraham should be loosed from her bond.
  ref: "Luke 13:14–17"
remembered:
- name: Fifth Sunday of Great Lent (Kpiptho, the Crippled Woman)
read:
- ref: "Luke 13:10–17"
  note: The healing on the Sabbath
sources:
- label: The Holy Bible (World English Bible)
reviewed: false
