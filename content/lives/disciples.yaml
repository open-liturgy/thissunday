summary: "Those who followed Jesus to learn from him: the twelve, and many more men and women. A disciple is a learner who follows a teacher, and Jesus sent his followers to make disciples of all nations."
events:
- text: "Jesus calls fishermen by the sea: “Come after me, and I will make you fishers for men.”"
  ref: "Mark 1:16–20"
- text: Women disciples, among them Mary Magdalene, Joanna and Susanna, travel with him and support him.
  ref: "Luke 8:1–3"
- text: "He teaches them to pray: “Our Father…”"
  ref: "Luke 11:1–4"
- text: After his hard teaching on the bread of life, many go back; Peter says, “Lord, to whom would we go?”
  ref: "John 6:60–69"
- text: He washes their feet and gives them a new commandment, to love one another.
  ref: "John 13:1–15, 34–35"
- text: “Go and make disciples of all nations, baptizing them…”
  ref: "Matthew 28:19"
- text: In Antioch the disciples are first called Christians.
  ref: "Acts 11:26"
read:
- ref: "Mark 1:16–20"
  note: The first call
- ref: "Luke 9:23–26"
  note: Take up the cross
- ref: "John 13:1–17"
  note: Washing their feet
sources:
- label: The Holy Bible (World English Bible)
reviewed: false
