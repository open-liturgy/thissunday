summary: Trained experts in the Law of Moses who copied, taught and interpreted the Scriptures. In the Gospels they often question Jesus, though one was told he was not far from the Kingdom of God.
events:
- text: Ezra is called “a skilled scribe in the law of Moses.”
  ref: "Ezra 7:6"
- text: People are amazed that Jesus teaches with authority, not as the scribes.
  ref: "Mark 1:22"
- text: Some scribes think it blasphemy when Jesus forgives the paralysed man’s sins.
  ref: "Mark 2:6–7"
- text: Scribes from Jerusalem say he casts out demons by Beelzebul.
  ref: "Mark 3:22"
- text: A scribe asks which commandment is first; Jesus says, “You are not far from God’s Kingdom.”
  ref: "Mark 12:28–34"
- text: Jesus warns against scribes who like long robes and long prayers but devour widows’ houses.
  ref: "Mark 12:38–40"
- text: With the chief priests and elders they hand Jesus over to Pilate.
  ref: "Mark 15:1"
- text: “Every scribe who has been made a disciple in the Kingdom of Heaven” brings out treasures new and old.
  ref: "Matthew 13:52"
read:
- ref: "Mark 12:28–34"
  note: Not far from the Kingdom
- ref: "Mark 12:38–40"
  note: Beware of the scribes
sources:
- label: The Holy Bible (World English Bible)
reviewed: false
