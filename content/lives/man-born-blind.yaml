summary: A beggar in Jerusalem, blind from birth, whom Jesus healed with clay and the water of Siloam. Questioned and thrown out by the Pharisees, he came to believe in Jesus as the Son of Man.
events:
- text: The disciples ask whose sin caused his blindness; Jesus says neither his nor his parents’, but that God’s works might be shown in him.
  ref: "John 9:1–3"
- text: Jesus spits on the ground, makes clay, anoints his eyes and sends him to wash in the pool of Siloam; he comes back seeing.
  ref: "John 9:6–7"
- text: His neighbours argue whether he is the same man who used to beg.
  ref: "John 9:8–12"
- text: Because it is the Sabbath, the Pharisees question him; his parents, afraid, say, “He is of age. Ask him.”
  ref: "John 9:13–23"
- text: "He tells them, “One thing I do know: that though I was blind, now I see,” and they throw him out."
  ref: "John 9:24–34"
- text: Jesus finds him; he says, “Lord, I believe!” and worships him.
  ref: "John 9:35–38"
remembered:
- name: Sixth Sunday of Great Lent
read:
- ref: John 9
  note: The whole chapter
sources:
- label: The Holy Bible (World English Bible)
reviewed: false
